asyncapi: 2.6.0
id: 'urn:boilerplate-node-backend:asyncapi:contracts'
info:
    title: Boilerplate Node Backend Async Contracts
    version: 1.0.0
    contact:
        name: Boilerplate maintainers
        url: https://github.com/Guebbit/boilerplate-node-backend
        email: noreply@example.com
    license:
        name: AGPL-3.0
    description: |
        AsyncAPI contract for real-time/event-driven flows in this boilerplate.

        Implemented:
        - SSE observability events over `/observability/events`
        - RabbitMQ worker job queues (`worker.*`)
defaultContentType: application/json
tags:
    - name: implemented
      description: Contracts already implemented in the backend runtime.
servers:
    sseLocal:
        url: localhost:3000
        protocol: http
        description: Local HTTP server for SSE (`/observability/events`).
    rabbitmqLocal:
        url: localhost:5672
        protocol: amqp
        description: Local RabbitMQ broker for async job queues.
channels:
    observability.metrics.snapshot:
        description: Initial metrics snapshot sent on SSE connect.
        subscribe:
            operationId: sseMetricsSnapshot
            message:
                $ref: '#/components/messages/MetricsSnapshotEvent'
    observability.metrics.updated:
        description: Periodic SSE metrics update.
        subscribe:
            operationId: sseMetricsUpdated
            message:
                $ref: '#/components/messages/MetricsUpdatedEvent'
    observability.heartbeat:
        description: SSE heartbeat event.
        subscribe:
            operationId: sseHeartbeat
            message:
                $ref: '#/components/messages/HeartbeatEvent'
    worker.email.send:
        description: Email job queue — producers enqueue email requests, the email worker consumes them.
        servers:
            - rabbitmqLocal
        publish:
            operationId: workerEmailPublish
            summary: Enqueue an email for async delivery.
            message:
                $ref: '#/components/messages/EmailJobMessage'
        subscribe:
            operationId: workerEmailConsume
            summary: Email worker picks up and sends the email.
            message:
                $ref: '#/components/messages/EmailJobConsumeMessage'
    worker.pdf.generate:
        description: PDF generation job queue — producers enqueue render requests, the PDF worker consumes them.
        servers:
            - rabbitmqLocal
        publish:
            operationId: workerPdfPublish
            summary: Enqueue a PDF generation request.
            message:
                $ref: '#/components/messages/PdfJobMessage'
        subscribe:
            operationId: workerPdfConsume
            summary: PDF worker renders template to PDF.
            message:
                $ref: '#/components/messages/PdfJobConsumeMessage'
components:
    messages:
        MetricsSnapshotEvent:
            name: MetricsSnapshotEvent
            messageId: observability.metrics.snapshot
            title: Initial observability metrics snapshot
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
        MetricsUpdatedEvent:
            name: MetricsUpdatedEvent
            messageId: observability.metrics.updated
            title: Periodic observability metrics update
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
        HeartbeatEvent:
            name: HeartbeatEvent
            messageId: observability.heartbeat
            title: Observability heartbeat
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
        EmailJobMessage:
            name: EmailJobMessage
            messageId: worker.email.send
            title: Email delivery job
            payload:
                $ref: '#/components/schemas/EmailJobPayload'
        PdfJobMessage:
            name: PdfJobMessage
            messageId: worker.pdf.generate
            title: PDF generation job
            payload:
                $ref: '#/components/schemas/PdfJobPayload'
        EmailJobConsumeMessage:
            name: EmailJobConsumeMessage
            messageId: worker.email.job.consume
            title: Email delivery job (worker consume)
            payload:
                $ref: '#/components/schemas/EmailJobPayload'
        PdfJobConsumeMessage:
            name: PdfJobConsumeMessage
            messageId: worker.pdf.job.consume
            title: PDF generation job (worker consume)
            payload:
                $ref: '#/components/schemas/PdfJobPayload'
    schemas:
        ObservabilityMetricsPayload:
            type: object
            required:
                - timestamp
                - uptimeSeconds
                - memory
                - http
                - realtime
            properties:
                timestamp:
                    type: string
                    format: date-time
                uptimeSeconds:
                    type: integer
                    minimum: 0
                memory:
                    type: object
                    required:
                        - rss
                        - heapUsed
                        - heapTotal
                        - external
                    properties:
                        rss:
                            type: integer
                            minimum: 0
                        heapUsed:
                            type: integer
                            minimum: 0
                        heapTotal:
                            type: integer
                            minimum: 0
                        external:
                            type: integer
                            minimum: 0
                    additionalProperties: false
                http:
                    type: object
                    required:
                        - totalRequests
                        - totalErrors
                    properties:
                        totalRequests:
                            type: integer
                            minimum: 0
                        totalErrors:
                            type: integer
                            minimum: 0
                    additionalProperties: false
                realtime:
                    type: object
                    required:
                        - sseClients
                    properties:
                        sseClients:
                            type: integer
                            minimum: 0
                    additionalProperties: false
            additionalProperties: false
        EmailJobPayload:
            type: object
            required:
                - request
                - templateName
                - data
            properties:
                request:
                    type: object
                    description: Nodemailer SendMailOptions subset.
                    required:
                        - to
                    properties:
                        to:
                            type: string
                        subject:
                            type: string
                        text:
                            type: string
                        html:
                            type: string
                    additionalProperties: false
                from:
                    type: string
                    description: Optional sender override.
                templateName:
                    type: string
                    description: EJS template name to render.
                data:
                    type: object
                    description: >-
                        Everything the template prints, already translated by the producer —
                        including the `<html lang>` value and the footer line. The consumer
                        interpolates it and resolves nothing, which is why no locale travels
                        with the job.
            additionalProperties: false
        PdfJobPayload:
            type: object
            required:
                - templatePath
                - templateData
                - outputPath
            properties:
                templatePath:
                    type: string
                    description: Path to the EJS template file.
                templateData:
                    type: object
                    description: >-
                        Everything the template prints, already translated by the producer —
                        same contract as EmailJobPayload.data, and the same reason no locale
                        travels with the job.
                outputPath:
                    type: string
                    description: Filesystem path where the generated PDF will be written.
            additionalProperties: false
