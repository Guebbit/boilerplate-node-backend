# Code generated by `npm run contracts:bundle`. DO NOT EDIT.
# Sources: shared/contracts/asyncapi.root.yaml
#          src/modules/observability/asyncapi.yaml
#          src/modules/webhooks/asyncapi.yaml
#          src/modules/webhooks/asyncapi.internal.yaml
#          shared/contracts/asyncapi.workers.yaml
asyncapi: 3.0.0
id: 'urn:boilerplate-node-backend:asyncapi:contracts'
info:
    title: Boilerplate Node Backend Async Contracts
    # Bumped alongside `openapi.root.yaml`'s own 2.0.0: the Standard Webhooks envelope
    # (`webhooks/asyncapi.yaml`, `{ type, timestamp, data }` plus the signed headers) is a
    # deliberate, reviewed break for a subscriber on the old raw-event-body shape. Note:
    # `check:asyncapi-breaking`'s major-version skip compares the `asyncapi:` SPEC version
    # (currently 3.0.0 everywhere), not this field — this bump documents the break for a human
    # reader, it does not silence that gate, which is expected to report real breaking changes
    # against `origin/main` until this work is actually pushed and becomes the new baseline.
    version: 2.0.0
    contact:
        name: Boilerplate maintainers
        url: https://github.com/Guebbit/boilerplate-node-backend
        email: noreply@example.com
    license:
        name: AGPL-3.0
    description: |
        AsyncAPI contract for real-time/event-driven flows in this boilerplate.

        The channels below are the whole of it — every one is implemented in the backend
        runtime, and each says what it carries and when.
    tags:
        - name: implemented
          description: Contracts already implemented in the backend runtime.
defaultContentType: application/json
servers:
    sseLocal:
        host: localhost:3000
        protocol: http
        description: Local HTTP server for SSE (`/observability/events`).
    subscriberEndpoint:
        # A VARIABLE server, not a fixed host: every subscription names its own HTTPS URL, so there
        # is no one address this document can print. `asyncapi-servers`/`asyncapi-channel-servers`
        # (`spectral.asyncapi.modules.yaml`) still pass, because the channels below DO bind to a
        # declared server — it just resolves per subscription instead of per deployment.
        #
        # Not a server this application runs — the reverse of every other section's server: a
        # subscriber genuinely subscribes to receive these, over a connection this application
        # opens outbound.
        host: '{subscriberHost}'
        pathname: '{subscriberPath}'
        protocol: https
        variables:
            subscriberHost:
                default: example.com
                description: Host (and port, when non-default) of a subscription's configured URL.
            subscriberPath:
                default: /webhooks/inbox
                description: Path of a subscription's configured URL.
    rabbitmqLocal:
        host: localhost:5672
        protocol: amqp
        description: Local RabbitMQ broker for async job queues.
channels:
    observability.metrics.snapshot:
        address: observability.metrics.snapshot
        description: Initial metrics snapshot sent on SSE connect.
        messages:
            MetricsSnapshotEvent:
                $ref: '#/components/messages/MetricsSnapshotEvent'
    observability.metrics.updated:
        address: observability.metrics.updated
        description: Periodic SSE metrics update.
        messages:
            MetricsUpdatedEvent:
                $ref: '#/components/messages/MetricsUpdatedEvent'
    observability.heartbeat:
        address: observability.heartbeat
        description: SSE heartbeat event.
        messages:
            HeartbeatEvent:
                $ref: '#/components/messages/HeartbeatEvent'
    order.created:
        address: order.created
        description: A new order was placed.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderCreatedEvent:
                $ref: '#/components/messages/OrderCreatedEvent'
    order.paid:
        address: order.paid
        description: An order's payment settled.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderPaidEvent:
                $ref: '#/components/messages/OrderPaidEvent'
    order.shipped:
        address: order.shipped
        description: An order was marked shipped.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderShippedEvent:
                $ref: '#/components/messages/OrderShippedEvent'
    order.cancelled:
        address: order.cancelled
        description: An order was cancelled.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderCancelledEvent:
                $ref: '#/components/messages/OrderCancelledEvent'
    payment.succeeded:
        address: payment.succeeded
        description: A payment settled successfully.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentSucceededEvent:
                $ref: '#/components/messages/PaymentSucceededEvent'
    payment.failed:
        address: payment.failed
        description: A payment attempt was declined.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentFailedEvent:
                $ref: '#/components/messages/PaymentFailedEvent'
    worker.webhook.deliver:
        address: worker.webhook.deliver
        description: >-
            Outbound webhook delivery job queue — the `webhooks` module's subscriber enqueues one message per matching subscription, the webhook worker consumes it.
        servers:
            - $ref: '#/servers/rabbitmqLocal'
        messages:
            WebhookDeliverJobMessage:
                $ref: '#/components/messages/WebhookDeliverJobMessage'
    worker.email.send:
        address: worker.email.send
        description: Email job queue — producers enqueue email requests, the email worker consumes them.
        servers:
            - $ref: '#/servers/rabbitmqLocal'
        messages:
            EmailJobMessage:
                $ref: '#/components/messages/EmailJobMessage'
    worker.image.digest:
        address: worker.image.digest
        description: >-
            Image digest job queue — producers enqueue a quarantined upload once the document naming it exists, the image worker consumes them.
        servers:
            - $ref: '#/servers/rabbitmqLocal'
        messages:
            ImageDigestJobMessage:
                $ref: '#/components/messages/ImageDigestJobMessage'
operations:
    sseMetricsSnapshot:
        action: send
        channel:
            $ref: '#/channels/observability.metrics.snapshot'
        description: >-
            Sent once, immediately on connect, so a dashboard renders populated instead of waiting out the first 5-second tick with empty cards. Same payload shape as the periodic update — a client handles one message type, not two.
        messages:
            - $ref: '#/channels/observability.metrics.snapshot/messages/MetricsSnapshotEvent'
    sseMetricsUpdated:
        action: send
        channel:
            $ref: '#/channels/observability.metrics.updated'
        description: >-
            Pushed every 5 seconds for as long as the connection is open. Memory is in BYTES, identical to what `GET /observability/health` publishes, so a dashboard showing both compares numbers rather than converting units to find out whether they agree.
        messages:
            - $ref: '#/channels/observability.metrics.updated/messages/MetricsUpdatedEvent'
    sseHeartbeat:
        action: send
        channel:
            $ref: '#/channels/observability.heartbeat'
        description: >-
            A 15-second keep-alive carrying no metrics. Idle proxies close a connection that has been quiet, and an SSE stream between two ticks looks idle to them; this is also what lets a client tell "the stream is alive and nothing changed" from "the stream died".
        messages:
            - $ref: '#/channels/observability.heartbeat/messages/HeartbeatEvent'
    webhookOrderCreated:
        action: send
        channel:
            $ref: '#/channels/order.created'
        summary: An order was written for the first time.
        description: >-
            Fired once per order, from both an admin create and a storefront checkout — see `orders/services/crud.ts`'s `recordCreated`.
        messages:
            - $ref: '#/channels/order.created/messages/OrderCreatedEvent'
    webhookOrderPaid:
        action: send
        channel:
            $ref: '#/channels/order.paid'
        summary: An order moved to the `paid` status.
        description: >-
            Derived from `order.status_changed` (`to: 'paid'`) rather than its own domain event — see `orders/events.ts`: "listeners filter on `to`; the event doesn't know who cares."
        messages:
            - $ref: '#/channels/order.paid/messages/OrderPaidEvent'
    webhookOrderShipped:
        action: send
        channel:
            $ref: '#/channels/order.shipped'
        summary: An order moved to the `shipped` status.
        description: Derived from `order.status_changed` filtered to `to = 'shipped'`, same as `order.paid`.
        messages:
            - $ref: '#/channels/order.shipped/messages/OrderShippedEvent'
    webhookOrderCancelled:
        action: send
        channel:
            $ref: '#/channels/order.cancelled'
        summary: A cancel went through; stock is already back on the shelf.
        description: One-to-one with the `order.cancelled` domain event — see `orders/events.ts`.
        messages:
            - $ref: '#/channels/order.cancelled/messages/OrderCancelledEvent'
    webhookPaymentSucceeded:
        action: send
        channel:
            $ref: '#/channels/payment.succeeded'
        summary: A payment reached `succeeded`.
        description: One-to-one with the `payment.succeeded` domain event — see `payments/events.ts`.
        messages:
            - $ref: '#/channels/payment.succeeded/messages/PaymentSucceededEvent'
    webhookPaymentFailed:
        action: send
        channel:
            $ref: '#/channels/payment.failed'
        summary: A payment reached `declined`.
        description: >-
            One-to-one with the `payment.failed` domain event. Retryable with another method, so this can fire more than once for the same order.
        messages:
            - $ref: '#/channels/payment.failed/messages/PaymentFailedEvent'
    workerWebhookDeliverPublish:
        action: receive
        channel:
            $ref: '#/channels/worker.webhook.deliver'
        summary: Enqueue one subscription's delivery attempt for a domain event.
        description: >-
            One event fan out to N subscriptions is N messages, never one message N subscriptions read — a slow or dead endpoint must delay only its own deliveries, not the sibling subscriptions matching the same event.
        messages:
            - $ref: '#/channels/worker.webhook.deliver/messages/WebhookDeliverJobMessage'
    workerWebhookDeliverConsume:
        action: send
        channel:
            $ref: '#/channels/worker.webhook.deliver'
        summary: Webhook worker signs, sends, and records the attempt.
        description: >-
            Signs the payload (Standard Webhooks format), resolves and validates the target through the SSRF guard, POSTs with a hard timeout, and records the outcome on the delivery row this job names. A failure schedules `nextAttemptAt` for the retry sweep rather than requeueing here — see `docs/reference/ops.md#scheduled-jobs`.
        messages:
            - $ref: '#/channels/worker.webhook.deliver/messages/WebhookDeliverJobMessage'
    workerEmailPublish:
        action: receive
        channel:
            $ref: '#/channels/worker.email.send'
        summary: Enqueue an email for async delivery.
        description: >-
            `enqueueEmail` publishes here instead of calling the SMTP transport inline, so a slow or unreachable mail server cannot add its latency to the request that triggered the mail. When the broker itself is unavailable the adapter falls back to sending inline rather than dropping the message — the queue is an optimisation on this path, never the system of record.
        messages:
            - $ref: '#/channels/worker.email.send/messages/EmailJobMessage'
    workerEmailConsume:
        action: send
        channel:
            $ref: '#/channels/worker.email.send'
        summary: Email worker picks up and sends the email.
        description: >-
            The consumer acknowledges only after the transport accepts the message, so a worker that dies mid-send returns the job to the queue rather than losing it. A rendering failure is not retried — the template is broken for every redelivery, and requeueing it forever would starve the queue behind a job that cannot succeed.
        messages:
            - $ref: '#/channels/worker.email.send/messages/EmailJobMessage'
    workerImageDigestPublish:
        action: receive
        channel:
            $ref: '#/channels/worker.image.digest'
        summary: Enqueue a quarantined upload for digesting.
        description: >-
            Published only after the document referencing `key` as its `pendingImageKey` has been persisted, so the job always carries a real id to write back to. Decoding, re-encoding and thumbnailing an image is CPU-bound — exactly what must not happen on a request thread.
        messages:
            - $ref: '#/channels/worker.image.digest/messages/ImageDigestJobMessage'
    workerImageDigestConsume:
        action: send
        channel:
            $ref: '#/channels/worker.image.digest'
        summary: Image worker digests the upload and promotes it.
        description: >-
            Strips metadata, caps dimensions and re-encodes the quarantined original, builds its WebP thumbnail, promotes both into the public store, then writes the two urls back onto the document — conditional on `pendingImageKey` still matching `key`, so a stale or superseded job cannot overwrite a later upload, and a deleted document is detected rather than silently ignored.
        messages:
            - $ref: '#/channels/worker.image.digest/messages/ImageDigestJobMessage'
components:
    messages:
        MetricsSnapshotEvent:
            name: MetricsSnapshotEvent
            title: Initial observability metrics snapshot
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
        MetricsUpdatedEvent:
            name: MetricsUpdatedEvent
            title: Periodic observability metrics update
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
        HeartbeatEvent:
            name: HeartbeatEvent
            title: Observability heartbeat
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
        OrderCreatedEvent:
            name: OrderCreatedEvent
            title: Order created
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderCreatedEnvelope'
        OrderPaidEvent:
            name: OrderPaidEvent
            title: Order paid
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderPaidEnvelope'
        OrderShippedEvent:
            name: OrderShippedEvent
            title: Order shipped
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderShippedEnvelope'
        OrderCancelledEvent:
            name: OrderCancelledEvent
            title: Order cancelled
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderCancelledEnvelope'
        PaymentSucceededEvent:
            name: PaymentSucceededEvent
            title: Payment succeeded
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentSucceededEnvelope'
        PaymentFailedEvent:
            name: PaymentFailedEvent
            title: Payment failed
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentFailedEnvelope'
        WebhookDeliverJobMessage:
            name: WebhookDeliverJobMessage
            title: Webhook delivery job
            payload:
                $ref: '#/components/schemas/WebhookDeliverJobPayload'
        EmailJobMessage:
            name: EmailJobMessage
            title: Email delivery job
            payload:
                $ref: '#/components/schemas/EmailJobPayload'
        ImageDigestJobMessage:
            name: ImageDigestJobMessage
            title: Image digest job
            payload:
                $ref: '#/components/schemas/ImageDigestJobPayload'
    schemas:
        ObservabilityMetricsPayload:
            type: object
            required:
                - timestamp
                - uptimeSeconds
                - memory
                - http
                - realtime
            properties:
                timestamp:
                    type: string
                    format: date-time
                uptimeSeconds:
                    type: integer
                    minimum: 0
                memory:
                    type: object
                    required:
                        - rss
                        - heapUsed
                        - heapTotal
                        - external
                    properties:
                        rss:
                            type: integer
                            minimum: 0
                        heapUsed:
                            type: integer
                            minimum: 0
                        heapTotal:
                            type: integer
                            minimum: 0
                        external:
                            type: integer
                            minimum: 0
                    additionalProperties: false
                http:
                    type: object
                    required:
                        - totalRequests
                        - totalErrors
                    properties:
                        totalRequests:
                            type: integer
                            minimum: 0
                        totalErrors:
                            type: integer
                            minimum: 0
                    additionalProperties: false
                realtime:
                    type: object
                    required:
                        - sseClients
                    properties:
                        sseClients:
                            type: integer
                            minimum: 0
                    additionalProperties: false
            additionalProperties: false
        WebhookHeaders:
            type: object
            description: >-
                The three Standard Webhooks headers every delivery carries — see `transport/webhook-signing.ts`. Documented here for the subscriber reading this catalogue; nothing in this repo generates types off a message's `headers`.
            required:
                - webhook-id
                - webhook-timestamp
                - webhook-signature
            properties:
                webhook-id:
                    type: string
                    description: >-
                        Shared by every subscription this event fanned out to, and by every retry of one delivery — the id a subscriber dedupes on.
                webhook-timestamp:
                    type: string
                    description: Unix seconds when this attempt was signed, folded into the signature.
                webhook-signature:
                    type: string
                    description: 'One or more space-separated `v1,<base64 HMAC-SHA256>` values.'
        OrderIdPayload:
            type: object
            required:
                - orderId
            properties:
                orderId:
                    type: string
            additionalProperties: false
        OrderCancelledPayload:
            type: object
            required:
                - orderId
                - refund
            properties:
                orderId:
                    type: string
                refund:
                    type: boolean
                    description: >-
                        Whether the cancel carries a refund — a customer cancelling is owed their money, an operator cancelling may not be. See `orders/events.ts`.
            additionalProperties: false
        PaymentEventPayload:
            type: object
            required:
                - paymentId
                - orderId
            properties:
                paymentId:
                    type: string
                orderId:
                    type: string
            additionalProperties: false
        OrderCreatedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    type: string
                    enum:
                        - order.created
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
        OrderPaidEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    type: string
                    enum:
                        - order.paid
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
        OrderShippedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    type: string
                    enum:
                        - order.shipped
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
        OrderCancelledEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    type: string
                    enum:
                        - order.cancelled
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderCancelledPayload'
            additionalProperties: false
        PaymentSucceededEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    type: string
                    enum:
                        - payment.succeeded
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentEventPayload'
            additionalProperties: false
        PaymentFailedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    type: string
                    enum:
                        - payment.failed
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentEventPayload'
            additionalProperties: false
        WebhookDeliverJobPayload:
            type: object
            required:
                - deliveryId
            properties:
                deliveryId:
                    type: string
                    description: >-
                        The `webhookdeliveries` row this attempt updates in place — created `pending` before the job is published, so `GET /webhooks/deliveries` shows it immediately and a lost message still leaves a queryable trace. The Claim Check pattern (EIP): the row is the source of truth for everything else an attempt needs (`subscriptionId`, `eventId`, `eventType`, the payload, the current `attempt`), so the message carries only the key — nothing here can go stale on a replay, and no event payload sits twice in the broker.
            additionalProperties: false
        EmailJobPayload:
            type: object
            required:
                - request
                - templateName
                - data
            properties:
                request:
                    type: object
                    description: Nodemailer SendMailOptions subset.
                    required:
                        - to
                    properties:
                        to:
                            type: string
                        subject:
                            type: string
                        text:
                            type: string
                        html:
                            type: string
                    additionalProperties: false
                from:
                    type: string
                    description: Optional sender override.
                templateName:
                    type: string
                    description: >-
                        Outbox name of the mail to render, without a file extension — the consumer resolves it to a template file. Shared with the twin backend, which renders a different engine, so the name names the mail and not the file.
                data:
                    type: object
                    description: >-
                        Everything the template prints, already translated by the producer — including the `<html lang>` value and the footer line. The consumer interpolates it and resolves nothing, which is why no locale travels with the job.
            additionalProperties: false
        ImageDigestJobPayload:
            type: object
            required:
                - collection
                - documentId
                - key
            properties:
                collection:
                    type: string
                    description: >-
                        Which module's `imageTargets` entry writes the result back — a registry key (see `kernel/registry.ts`), not a raw Mongo collection name.
                documentId:
                    type: string
                    description: >-
                        The target document's id. The writeback matches it against its own `pendingImageKey`, so a stale or duplicate delivery updates nothing.
                key:
                    type: string
                    description: >-
                        The opaque key `imageStore.quarantine()` returned. Never a filesystem path — the consumer calls back into the store, which stays free to change backend without this payload's shape changing.
            additionalProperties: false
