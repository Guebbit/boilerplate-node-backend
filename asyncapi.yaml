        AccountExportJobPayload:
            type: object
            required:
                - exportId
                - userId
                - email
                - emailVerified
                - locale
            properties:
                exportId:
                    type: string
                    description: >-
                        The `accountexports` row this job fills in — created `building` before the job is published, so a lost message still leaves a queryable trace (Claim Check, EIP: the row is the source of truth for the rest).
                userId:
                    type: string
                    description: The account the export is about.
                email:
                    type: string
                    description: >-
                        The address the request saw. The mailbox the link goes to, and the key the `feedback` section matches by.
                emailVerified:
                    type: boolean
                    description: >-
                        Whether the account had proved `email` when it asked. A section that matches by address answers only when this is true (GDPR Art. 12(6)).
                locale:
                    type: string
                    description: The language the mail is written in.
            additionalProperties: false
        WebhookDeliverJobPayload:
            type: object
            required:
                - deliveryId
            properties:
                deliveryId:
                    type: string
                    description: >-
                        The `webhookdeliveries` row this attempt updates in place — created `pending` before the job is published, so `GET /webhooks/deliveries` shows it immediately and a lost message still leaves a queryable trace. The Claim Check pattern (EIP): the row is the source of truth for everything else an attempt needs (`subscriptionId`, `eventId`, `eventType`, the payload, the current `attempt`), so the message carries only the key — nothing here can go stale on a replay, and no event payload sits twice in the broker.
            additionalProperties: false
        EmailJobPayload:
            type: object
            required:
                - request
                - templateName
                - data
            properties:
                request:
                    # `title` names the generated model — a bare inline object otherwise becomes
                    # Modelina's `AnonymousSchemaN`, renumbered on every unrelated schema addition.
                    title: EmailRequest
                    type: object
                    description: Nodemailer SendMailOptions subset.
                    required:
                        - to
                    properties:
                        to:
                            type: string
                        subject:
                            type: string
                        text:
                            type: string
                        html:
                            type: string
                        attachments:
                            type: array
                            description: >-
                                Claim Check tickets, never bytes: each names a file the producer already wrote to the mail spool (`mail-spool.ts`). The consumer resolves `key` inside the spool root and sends nothing it cannot resolve, closing off the arbitrary-file-read a producer-chosen path would otherwise open.
                            items:
                                title: EmailAttachment
                                type: object
                                required:
                                    - filename
                                    - key
                                properties:
                                    filename:
                                        type: string
                                        description: The filename the recipient sees.
                                    key:
                                        type: string
                                        description: >-
                                            The opaque key `spoolAttachment` returned. Never a filesystem path.
                                additionalProperties: false
                    additionalProperties: false
                from:
                    type: string
                    description: Optional sender override.
                templateName:
                    type: string
                    description: >-
                        Outbox name of the mail to render, without a file extension — the consumer resolves it to a template file. Shared with the twin backend, which renders a different engine, so the name names the mail and not the file.
                data:
                    type: object
                    description: >-
                        Everything the template prints, already translated by the producer — including the `<html lang>` value and the footer line. The consumer interpolates it and resolves nothing, which is why no locale travels with the job.
            additionalProperties: false
        ImageDigestJobPayload:
            type: object
            required:
                - collection
                - documentId
                - key
            properties:
                collection:
                    type: string
                    description: >-
                        Which module's `imageTargets` entry writes the result back — a registry key (see `kernel/registry.ts`), not a raw Mongo collection name.
                documentId:
                    type: string
                    description: >-
                        The target document's id. The writeback matches it against its own `pendingImageKey`, so a stale or duplicate delivery updates nothing.
                key:
                    type: string
                    description: >-
                        The opaque key `imageStore.quarantine()` returned. Never a filesystem path — the consumer calls back into the store, which stays free to change backend without this payload's shape changing.
            additionalProperties: false
