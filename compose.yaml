# The base of both stacks. Never run alone.
#
# Holds:     the service names, how `app` is built, and the image pins identical in both stacks.
# Dev:       compose.override.yaml, auto-loaded beside this file by a plain `docker compose up`.
# Prod:      compose.production.yaml, always `-f compose.yaml -f compose.production.yaml`. An explicit
#            `-f` turns the auto-load off; `docker/deploy.sh` always passes both.
# Rule:      a key lives in exactly one of the three files, and a service listed here exists in both
#            overlays, which set its profiles, ports, environment, hardening and healthcheck.
# Why:       no overlay overrides a value, so no `!reset` or `!override` (podman-compose 1.6.0 breaks
#            on both for mappings), and no `${VAR:?}` here: development reads this file too.
# See:       docs/operate/ways-to-deploy/docker-server.md#the-production-compose-file

services:
    # The API. Each overlay names its own Dockerfile stage under `build.target`.
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile

    # MongoDB, digest-pinned.
    database:
        image: docker.io/library/mongo:9.0.4@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058

    # The response cache and the rate-limit store: two Redis instances, one image.
    cache:
        image: docker.io/library/redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    limits:
        image: docker.io/library/redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0

    # RabbitMQ. Its image differs on purpose (development adds the management UI), so each overlay sets it.
    queue: {}

    # The monitoring stack: development puts it under `observability`, production under `monitoring`
    # (each overlay sets its profile), but both run these exact images.
    prometheus:
        image: docker.io/prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    alertmanager:
        image: docker.io/prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    loki:
        image: docker.io/grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    alloy:
        image: docker.io/grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
