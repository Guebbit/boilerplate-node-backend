# Money as whole minor units. The ISO 4217 exponent table itself stays in `money.ts`; these cases
# are how both sides must read it. Exponent 2 is the rule: JPY has 0, KWD/BHD/IQD 3, CLF 4.
# HUF, IDR, COP, PKR and LBP are 2 here although CLDR (`Intl`) says 0, and IQD is 3 where CLDR says 0.
#
#   exponent       a currency code -> its decimal places (an unlisted code gets 2).
#   minor-text     decimal TEXT -> minor units by moving digits, never by float. Rounds half away
#                  from zero on the first dropped digit. Only plain `-?digits[.digits]` takes this
#                  path; anything else (exponent form, `.5`, padding) is read as a number.
#   minor-number   a number -> minor units: `round(value * 10^exponent)`, half toward +infinity.
#                  Non-finite input and negative zero both come out as 0.
#   decimal        minor units -> the decimal the API publishes.
#   fits           whether a decimal has no more places than the currency's minor unit.
#   apportion      split `total` over `weights`; floor every share, then the leftover goes to the
#                  largest weight (the first one on a tie). All-zero weights give all zeros.
#   scale-by-rate  `round(amount * rate)`, half toward +infinity (so -252.5 is -252).
cases:
    - { name: EUR has two places, kind: exponent, currency: EUR, exponent: 2 }
    - { name: JPY has none, kind: exponent, currency: JPY, exponent: 0 }
    - { name: KRW has none, kind: exponent, currency: KRW, exponent: 0 }
    - { name: ISK has none, kind: exponent, currency: ISK, exponent: 0 }
    - { name: KWD has three, kind: exponent, currency: KWD, exponent: 3 }
    - { name: BHD has three, kind: exponent, currency: BHD, exponent: 3 }
    - { name: IQD has three where CLDR says none, kind: exponent, currency: IQD, exponent: 3 }
    - { name: CLF has four, kind: exponent, currency: CLF, exponent: 4 }
    - { name: HUF has two where CLDR says none, kind: exponent, currency: HUF, exponent: 2 }
    - { name: IDR has two where CLDR says none, kind: exponent, currency: IDR, exponent: 2 }
    - { name: an unlisted code gets two, kind: exponent, currency: XXX, exponent: 2 }
    - {
          name: a lowercase code is not listed and gets two,
          kind: exponent,
          currency: jpy,
          exponent: 2
      }
    - {
          name: plain text moves the digits,
