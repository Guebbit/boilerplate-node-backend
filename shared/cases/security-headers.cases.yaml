# The security headers every response carries, whatever the route (`installSecurity`, helmet's
# defaults). The twin sets the same ones, with the same values.
#
#   header   Case-insensitive name.
#   value    The exact value expected, or
#   absent   `true`: the header must NOT be on the response.
#
# `Content-Security-Policy` is compared as written by helmet 8: directives joined with `;`, no
# space. A helmet upgrade that changes a default fails here, and the twin follows the new value.
cases:
    - name: content security policy restricts every fetch to this origin
      header: Content-Security-Policy
      value: "default-src 'self';base-uri 'self';font-src 'self' https: data:;form-action 'self';frame-ancestors 'self';img-src 'self' data:;object-src 'none';script-src 'self';script-src-attr 'none';style-src 'self' https: 'unsafe-inline';upgrade-insecure-requests"
    - name: the opener policy isolates the browsing context group
      header: Cross-Origin-Opener-Policy
      value: same-origin
    - name: the resource policy keeps other origins from embedding responses
      header: Cross-Origin-Resource-Policy
      value: same-origin
    - name: the origin agent cluster is requested
      header: Origin-Agent-Cluster
      value: '?1'
    - name: the referrer is never sent
      header: Referrer-Policy
      value: no-referrer
    - name: transport security lasts a year and covers subdomains
      header: Strict-Transport-Security
      value: max-age=31536000; includeSubDomains
    - name: content sniffing is off
      header: X-Content-Type-Options
      value: nosniff
    - name: DNS prefetching is off
      header: X-DNS-Prefetch-Control
      value: 'off'
    - name: downloads are not opened in the site's context
      header: X-Download-Options
      value: noopen
    - name: framing is limited to the same origin
      header: X-Frame-Options
      value: SAMEORIGIN
    - name: Flash and PDF cross-domain policies are refused
      header: X-Permitted-Cross-Domain-Policies
      value: none
    - name: the legacy XSS auditor is disabled
      header: X-XSS-Protection
      value: '0'
    - name: the framework is not announced
      header: X-Powered-By
      absent: true
    - name: every answer varies on Origin, so a shared cache cannot mix CORS variants
      header: Vary
      value: Origin
