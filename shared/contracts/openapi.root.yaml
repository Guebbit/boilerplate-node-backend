openapi: 3.1.0
info:
    title: Boilerplate API
    license:
        name: AGPL-3.0-or-later
        url: https://www.gnu.org/licenses/agpl-3.0.html
    # Alpha: the first real version is 1.0.0 (SemVer §4, 0.y.z is initial development).
    version: '0.1.0'
    description: |
        Stable, codegen-oriented OpenAPI contract.
        Designed for multi-project, multi-language use (client/server stubs, DTOs, SDKs).

        Language: every endpoint honours `Accept-Language` (q-weights and region tags
        included). It selects the language of user-facing copy only — `errors[].message` and a
        success envelope's `message` — never the response shape, the status code, or a
        machine-readable field such as `errors[].code`. An unsupported language falls back
        instead of erroring; `Content-Language` states what was used and `Vary:
        Accept-Language` is always set. `GET /locales` lists what a deployment supports.

        The header is intentionally not declared per operation: it applies to all of them and
        clients set it once in an interceptor, so declaring it on every operation would only add a
        redundant argument to every generated function. This paragraph is its contract.
    contact:
        name: API Team

# Error codes that belong to no module — an HTTP-status-derived default, or a check that
# runs in front of every route rather than inside one. A module's OWN codes are declared the same
# way in its own openapi.yaml; the bundler collects every fragment's x-error-codes into one
# catalogue and publishes it as `errors[].code`'s `examples` — never as an `enum`, so a new code is
# additive, not a breaking response change (Zalando API guideline #112).
x-error-codes:
    BAD_REQUEST:
        {
            status: 400,
            description: 'A malformed request the body parser or a library refused before any route ran.'
        }
    UNAUTHORIZED: { status: 401, description: 'No valid session — log in and retry.' }
    FORBIDDEN:
        {
            status: 403,
            description: "The caller is authenticated but lacks the permission this route requires. A key's own `deniedCode` can replace this default with a more specific one."
        }
    OUTRANKED:
        {
            status: 403,
            description: "The caller holds the permission this route requires, but the person whose account, order, payment, return or API key it would change ranks at or above the caller. The one exception is the caller's own: staff and administrators change what is theirs, never what belongs to an equal or a superior. The four steps that move money (recording a payment by hand, a refund, approving a return, receiving a return) refuse the caller's own order too, with a plain `FORBIDDEN`."
        }
    NOT_FOUND:
        {
            status: 404,
            description: 'The addressed resource does not exist, or the caller may not be told that it does.'
        }
    CONFLICT:
        {
            status: 409,
            description: "The request is well-formed but conflicts with the resource's current state."
        }
    PRECONDITION_FAILED:
        {
            status: 412,
            description: "The write's `If-Match` no longer describes the stored resource — someone changed or removed it since the caller read it. Re-read, reapply the edit, resend."
        }
    VALIDATION_ERROR:
        {
            status: 422,
            description: 'One or more fields failed schema validation — see `errors[].details.field`.'
        }
    REQUEST_ERROR:
        {
            status: 422,
            description: 'A 4xx with no more specific code of its own. Mostly a 422 refused for a reason that is not one field (a field-level failure is `VALIDATION_ERROR`); also a 429 and any other 4xx the status table does not name.'
        }
    INVALID_REQUEST:
        {
            status: 422,
            description: 'A 4xx nobody handled on the way, answered by the global error handler with no copy of its own: a driver failure that is really about the request (a refused write is a 422, a duplicate key a 409, a stale `If-Match` a 412) or a library declaring its own 4xx. A route that catches the failure answers with the status-derived code instead.'
        }
    INTERNAL_ERROR:
        {
            status: 500,
            description: 'An unexpected server-side failure. Never carries library or stack detail.'
        }
    PAYLOAD_TOO_LARGE:
        { status: 413, description: "The request body exceeds this deployment's size limit." }
    UNSUPPORTED_MEDIA_TYPE:
        {
            status: 415,
            description: "The request's `Content-Type` is not one this operation accepts."
        }
    LIMIT_PART_COUNT:
        { status: 400, description: 'A multipart upload carries too many parts (multer).' }
    LIMIT_FILE_SIZE:
        {
            status: 400,
            description: "An uploaded file exceeds this deployment's size limit (multer)."
        }
    LIMIT_FILE_COUNT:
        { status: 400, description: 'A multipart upload carries too many files (multer).' }
    LIMIT_FIELD_KEY: { status: 400, description: 'A multipart field name is too long (multer).' }
    LIMIT_FIELD_VALUE: { status: 400, description: 'A multipart field value is too long (multer).' }
    LIMIT_FIELD_COUNT:
        {
            status: 400,
            description: 'A multipart upload carries too many non-file fields (multer).'
        }
    LIMIT_UNEXPECTED_FILE:
        {
            status: 400,
            description: 'A multipart upload carries a file under a field name this operation does not accept (multer).'
        }
    MISSING_FIELD_NAME:
        { status: 400, description: 'A multipart file part carries no field name (multer).' }
    SERVICE_UNAVAILABLE:
        {
            status: 503,
            description: 'A dependency (database, broker) is unreachable. Carries a `Retry-After` hint.'
        }
    RATE_LIMITED:
        {
            status: 429,
            description: 'The caller exceeded a rate-limit budget. Carries a `Retry-After` hint.'
        }
    IDEMPOTENCY_KEY_REQUIRED:
        {
            status: 400,
            description: 'This route requires an `Idempotency-Key` header and the request carries none.'
        }
    IDEMPOTENCY_IN_FLIGHT:
        {
            status: 409,
            description: 'Another request already carries this `Idempotency-Key` and has not finished yet.'
        }
    IDEMPOTENCY_KEY_MISMATCH:
        {
            status: 422,
            description: 'This `Idempotency-Key` was already used with a different request body.'
        }
    REAUTH_REQUIRED:
        {
            status: 401,
            description: "This action requires a session fresher than the caller's current one — see `POST /account/reauth`. `details.maxAge` is the freshness asked for; `details.methods`, when present, lists what the re-authentication must also prove (`otp`: a code from an armed second factor)."
        }

servers:
    - url: http://localhost:3000
      description: Local
    - url: https://api.example.com
      description: Production

# ---------- Responses the APPLICATION answers, on operations that never declare them. ----------
#
# Two middlewares sit in front of every route and can refuse before it runs: the global rate
# limiter (`app.use(rateLimiter)`), and the body parser — whose size, syntax and encoding checks
# account for three of the four statuses below. Neither is any one endpoint's business, so
# neither belongs in a module fragment — an operation left to declare its own would either
# duplicate these four everywhere or answer a status its own contract denies.
#
# Declared ONCE here and merged into every matching operation by `scripts/contracts/openapi-bundle.ts`,
# rather than hand-copied into each fragment. A hand-copied list is a published claim with no guard
# behind it: it goes stale silently, and the next app-level response repeats the whole exercise.
#
# `appliesTo` — `all` for what any request can trigger, `requestBody` for what only a request
# carrying a body can.
x-app-level-responses:
    '400':
        response: BadRequest
        appliesTo: requestBody
    '413':
        response: PayloadTooLarge
        appliesTo: requestBody
    '415':
        response: UnsupportedMediaType
        appliesTo: requestBody
    '429':
        response: TooManyRequests
        appliesTo: all
    '503':
        response: ServiceUnavailable
        appliesTo: all

tags:
    - name: System
      description: Public system endpoints (ping, liveness).

# If set, by default all operation requires an authentication
# security:
#    - bearerAuth: []

components:
    # This is a common security scheme that can be used by any operation
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
        apiKeyAuth:
            type: http
            scheme: bearer
            # No `bearerFormat` — deliberately: `JWT` would claim a structure this credential
            # does not have. `sk_<prefix>_<secret>`, opaque, distinguished from a JWT by that
            # prefix alone (a JWT always begins `eyJ`). See
            # docs/tools/security.md#machine-to-machine-credentials.
            description: An opaque `sk_...` machine-to-machine credential, minted via `POST /api-keys`.
        cookieAuth:
            type: apiKey
            in: cookie
            name: jwt
            description: The HttpOnly refresh cookie. Only the two Server-Sent Events streams take it, because a browser `EventSource` cannot set an `Authorization` header.
        metricsBearer:
            type: http
            scheme: bearer
            description: The static scrape credential (`NODE_METRICS_TOKEN`) Prometheus sends to `GET /observability/metrics`. Not a session token and not an `sk_...` key.

    parameters:
        # `Accept-Language` is honoured by every operation and is documented in
        # `info.description` rather than declared here — see the note there.

        # Common parameters
        PageParam:
            name: page
            in: query
            required: false
            schema:
                $ref: '#/components/schemas/Page'
            description: 1-based page index
        PageSizeParam:
            name: pageSize
            in: query
            required: false
            schema:
                $ref: '#/components/schemas/PageSize'
        TextParam:
            name: text
            in: query
            required: false
            schema:
                $ref: '#/components/schemas/Text'

        # Rung 3 of the anti-automation ladder (`NODE_ANTIBOT_PROVIDER`) — see antibot/openapi.yaml.
        # Optional at the contract level: absent while the provider is `none`, required by the
        # server once a real one is selected.
        AntibotChallengeTokenHeader:
            name: x-antibot-challenge-token
            in: header
            required: false
            schema:
                type: string
                maxLength: 4096
            description: >
                The token the active human-challenge provider issued to the client — see
                `GET /antibot/config`. Absent when that provider is `none`.

        # Opt-in per route (see `src/infrastructure/http/middlewares/idempotency.ts`) — never
        # required at the contract level, since a caller not asking for replay protection must
        # still be able to call the route.
        # The twin for a route where a retry would move money twice: same shape, but absent is a 400
        # (`IDEMPOTENCY_KEY_REQUIRED`), per the IETF Idempotency-Key header draft.
        RequiredIdempotencyKeyHeader:
            name: Idempotency-Key
            in: header
            required: true
            schema:
                type: string
                minLength: 1
                maxLength: 200
                pattern: '^[A-Za-z0-9_-]+$'
            description: >
                An opaque, client-generated value (a UUID by convention) that makes a retried
                write safe, and that this route REQUIRES: a request without it answers 400
                (`IDEMPOTENCY_KEY_REQUIRED`) and nothing is written. Repeating the request with the
                SAME key and the SAME body replays the first response (`Idempotent-Replay: true`, no
                repeated write); the same key with a DIFFERENT body answers 422; a key still being
                processed by another in-flight request answers 409.

        IdempotencyKeyHeader:
            name: Idempotency-Key
            in: header
            required: false
            schema:
                type: string
                minLength: 1
                maxLength: 200
                pattern: '^[A-Za-z0-9_-]+$'
            description: >
                An opaque, client-generated value (a UUID by convention) that makes a retried
                write safe. Repeating this request with the SAME key and the SAME body replays
                the first response (`Idempotent-Replay: true`, no repeated write) instead of
                running it again; the same key with a DIFFERENT body answers 422; a key still
                being processed by another in-flight request answers 409. Omitting the header
                simply forgoes replay protection — the write still happens normally.

        # Declared once here and added to a versioned path's PUT/PATCH/DELETE by the bundler, from
        # the path item's `x-versioned` marker (`scripts/contracts/openapi-bundle.ts`) — never
        # hand-copied per operation, so a fifth versioned resource cannot forget it.
        IfMatchHeader:
            name: If-Match
            in: header
            required: false
            schema:
                type: string
                maxLength: 200
            description: >
                The `ETag` this client last read for the resource (RFC 9110 §13.1.1), quoted as
                received. The write runs only if the stored resource is still at that version;
                otherwise it answers 412 `PRECONDITION_FAILED` and changes nothing. `*` means "any
                version, as long as it exists". Omitting the header keeps the old behaviour: the
                write is unconditional, last writer wins.

        # Query ID parameters (just for filtering)
        #
        # `id` is a batch read, not a lookup: an array so `?id=a&id=b` reads many at once, filtered
        # through the same `$in` a single value already produces. `minItems: 1` refuses `[]`, which
        # a query builder that skips empty filters would otherwise read as "no filter" — an
        # accidental full export. `maxItems: 100` matches `PageSize.maximum`, so a batch cannot cost
        # more than a page can.
        IdParam:
            name: id
            in: query
            required: false
            explode: true
            schema:
                type: array
                minItems: 1
                maxItems: 100
                items: { $ref: '#/components/schemas/Id' }
        # The delete flag, shared because every soft-deleting domain offers the same three
        # spellings of it: `/hard` in the path, `?hardDelete=true` in the query, `hardDelete` in
        # the body. Params outrank query, which outranks body — see docs/theory/request-input.md.
        # Declared here once so a fourth domain cannot accidentally offer only two of the three.
        HardDeleteParam:
            name: hardDelete
            in: query
            required: false
            schema:
                type: boolean
            description: Permanently remove the record instead of soft-deleting it. Where the same operation also accepts the flag in its path or body, a `true` from any of them wins.

        # Path ID parameters (for resource lookup)
        IdPathParam:
            name: id
            in: path
            required: true
            schema:
                $ref: '#/components/schemas/Id'
            description: Resource identifier

        ProductIdPathParam:
            name: productId
            in: path
            required: true
            schema:
                $ref: '#/components/schemas/Id'
            description: Product identifier

    # Response headers a module's operations reuse.
    headers:
        Location:
            required: true
            description: >-
                Where the created resource lives, as a path on this API (RFC 9110 §9.3.3). A create
                that answers 201 always sends it, so a client follows the link instead of composing
                one. Some created things have no `GET` of their own (a feedback ticket, a payment, an
                API key) — the link is still their address for `PUT`, `PATCH` and `DELETE`.
            schema:
                type: string

        ETag:
            required: true
            description: >-
                The resource's current version as a strong entity-tag (RFC 9110 §8.8.3). Send it
                back as `If-Match` on `PUT`, `PATCH` or `DELETE` to refuse the write if someone
                else changed the resource in between. Opaque: compare it, never parse it. It
                validates writes only — a read never answers `304` from it.
            schema:
                type: string

    responses:
        Success:
            description: Success
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/MessageResponse'
        BadRequest:
            description: >-
                The request could not be understood or authenticated as what it claims to be —
                distinct from `ValidationError`, which is a well-formed request whose FIELDS are
                wrong. Used where a caller is a machine rather than a form: an unverifiable webhook
                signature is the case that needs it.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        Unauthorized:
            description: Unauthorized
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        Forbidden:
            description: Forbidden
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        NotFound:
            description: Resource not found
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        Conflict:
            description: The request conflicts with the current state of the resource
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        PreconditionFailed:
            description: >-
                The request's `If-Match` no longer matches the stored resource: it was changed
                (or removed) after the caller read it. Nothing was written. Read it again,
                reapply the edit, and resend with the new `ETag`.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        ValidationError:
            description: Validation failed
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ValidationErrorResponse'
        PayloadTooLarge:
            description: >-
                The request body is larger than this deployment accepts
                (`NODE_JSON_BODY_LIMIT`, 100kb by default; multipart uploads are bounded separately
                by `NODE_MAX_UPLOAD_BYTES`). Refused by the body parser before any route runs,
                which is why it is declared for every body-accepting operation rather than by hand.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        UnsupportedMediaType:
            description: >-
                The request body declares a character set or a content encoding the body parser
                cannot read. Refused before any route runs, like `413` above — a body whose
                content-type simply matches no parser is NOT this: it reaches the route, which
                answers whatever it says about a request missing every field.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        TooManyRequests:
            description: The caller has spent a rate-limit budget and must wait. The wait is in the standard `RateLimit`/`Retry-After` headers, and — where the endpoint has a budget of its own to report, like a resend cooldown — in the error `details` too.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        ServiceUnavailable:
            description: >-
                A dependency the request needed (Mongo, Redis) is unreachable right now — the
                SERVER is temporarily unable, not the request refused (RFC 9110 §15.6.4). Every
                route can answer this: `getAuth` for any bearer request, or a controller's own
                database call. The `Retry-After` header carries a rough wait hint, a few seconds,
                not a promise — there is no queue depth or circuit-breaker state to compute a
                real one from.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        InternalError:
            description: Internal server error
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'

    schemas:
        # ---------- Shared — scalars, envelopes and the entities more than one module references. ----------
        Page:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
            description: 1-based page index. Bounded so page × pageSize cannot ask for an unbounded Mongo skip.
        PageSize:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
            description: Optional override; server may clamp to a max
        Id:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[0-9A-Za-z_-]+$'
            description: Resource identifier
        Text:
            type: string
            minLength: 1
            maxLength: 200
            description: Free-text search string
        Email:
            type: string
            maxLength: 254
            format: email
        Locale:
            type: string
            maxLength: 35
            description: >-
                BCP 47 language tag, e.g. `en` or `it`. Which tags a deployment actually supports
                is a runtime fact, not a contract one — ask `GET /locales`.
            pattern: '^[a-z]{2}(-[A-Za-z0-9]+)*$'
            example: it
        CountryCode:
            type: string
            maxLength: 2
            description: >-
                ISO 3166-1 alpha-2 country code, e.g. `IT`. Shape-checked here; which codes a
                deployment actually ships to is a runtime fact, not a contract one — see
                `GET /delivery/methods`' `shipToCountries`, the same split `Locale` makes for
                which language tags a deployment supports.
            pattern: '^[A-Z]{2}$'
            example: IT
        ImageUrl:
            type: string
            format: uri-reference
            minLength: 1
            description: >-
                Absolute URL or server-relative upload path (e.g. `/uploads/abc.jpg`).
                `uri-reference`, not `uri`: an uploaded image is stored and returned as a
                path relative to the API host, which is not a valid absolute URI. `minLength: 1`:
                `''` is never a synonym for "no image" — only `null` is, on a field that allows
                it.
        ImageRemoval:
            type: 'null'
            description: >-
                Write-side `imageUrl`: the ONLY accepted value is `null`, meaning "remove the
                current image". A new image is sent as multipart `imageUpload` bytes. A client
                never names a path in this server's store, because it cannot know which files
                are its own (a path would let one record delete another's file).
                Responses carry the real path under `ImageUrl`.
        ThumbnailUrl:
            type: string
            format: uri-reference
            readOnly: true
            description: >-
                Server-relative path to a small WebP derivative of `imageUrl`, produced by the
                image digest pipeline once an uploaded image has finished processing (see
                `docs/tools/image-processing.md`). Absent for a record whose image is a remote
                or default URL rather than an upload — there is nothing to derive a thumbnail
                from. Never accepted on a request body: the server is the only writer.

        # ---------- On the `imageUpload` fields below (and why they carry no limits) ----------
        #
        # The six `*Multipart` request bodies each declare `imageUpload` as a bare
        # `type: string, format: binary` — no `maxLength`, no `contentMediaType`. That is on
        # purpose, and it is worth knowing why before someone "fixes" it.
        #
        # The real limits live in the backend, and only there:
        #   - accepted mime types → src/infrastructure/http/middlewares/upload.ts's `fileFilter` (image/png, jpg, jpeg, webp)
        #   - maximum size        → NODE_MAX_UPLOAD_BYTES, default 5 MB
        # enforced twice: `fileFilter` rejects on the client's declared Content-Type before the
        # bytes touch disk, then `identifyImageFile()` re-reads the actual magic bytes and answers
        # 422 when the declaration lied. Nothing a client declares can substitute for either gate.
        #
        # Declaring the constraints here would document them but generate nothing to read:
        #   - orval's zod generator short-circuits on `format: binary` straight to
        #     `zod.instanceof(File)` and emits no length constant for it
        #     (@orval/zod, the `case "string"` branch);
        #   - the `zodSchemas` target in orval.config.ts has no `splitByContentType`, so only the
        #     JSON body of each operation becomes a schema — the multipart bodies never do.
        # So a `maxLength` added here would reach no generated artefact in either repo, while
        # looking like it had.
        #
        # The frontend therefore restates both numbers in src/infrastructure/uploads.ts, which names
        # storage.ts as the authority and explains the same thing at its own call site. If the
        # backend's limits ever change, that file is what has to change with them — nothing will
        # announce the drift.

        PaginationMeta:
            type: object
            additionalProperties: false
            required: [page, pageSize, totalItems, totalPages]
            properties:
                page:
                    $ref: '#/components/schemas/Page'
                pageSize:
                    $ref: '#/components/schemas/PageSize'
                totalItems:
                    type: integer
                    minimum: 0
                totalPages:
                    type: integer
                    minimum: 0

        # ---------- System Messages ----------

        # The three `&envelope*` anchors below are the single definition of the success-envelope
        # preamble. Every *Envelope schema aliases them with `*envelopeSuccess` etc., so the shape
        # is written once here and the YAML parser expands it everywhere — no allOf, and therefore
        # no schema that has to stay non-strict. See the note on ErrorResponse for why.
        # The success-envelope preamble, named so every *Envelope schema in every module file can
        # `$ref` it. These were YAML anchors while the document was assembled by concatenation;
        # anchors cannot cross files, and each module is now a standalone document.
        EnvelopeSuccess:
            type: boolean
            enum: [true]

        EnvelopeStatus:
            type: integer

        EnvelopeMessage:
            type: string

        MessageResponse:
            type: object
            additionalProperties: false
            required: [success, status, message]
            properties:
                success:
                    $ref: '#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '#/components/schemas/EnvelopeMessage'

        ErrorItem:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
                code:
                    type: string
                    description: Stable machine-readable error code
                    example: VALIDATION_ERROR
                message:
                    type: string
                    description: Human-readable error detail
                    example: Field "email" is required
                details:
                    type: object
                    additionalProperties: true
                    description: Optional structured metadata for programmatic handling

        # `additionalProperties: false` cannot live on a schema used as an `allOf` base: the
        # constraint is evaluated per-subschema, so it would reject the properties a sibling
        # contributes. Rather than leave the error/success envelopes unconstrained, they are
        # written flat and share their preamble through YAML anchors.
        ErrorResponse:
            type: object
            additionalProperties: false
            required: [success, status, message, errors]
            properties:
                success: &errorSuccess
                    type: boolean
                    enum: [false]
                status: &errorStatus
                    type: integer
                message: &errorMessage
                    type: string
                    description: Human-readable summary for this failure
                errors: &errorErrors
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/ErrorItem'
                    description: Structured machine-friendly errors

        ValidationErrorResponse:
            type: object
            additionalProperties: false
            required: [success, status, message, errors]
            properties:
                success: *errorSuccess
                status: *errorStatus
                message:
                    type: string
                    description: Human-readable summary for this failure
                    example: Validation failed
                errors: *errorErrors

        # ---------- Domain ----------

        # All success responses are wrapped in a standard envelope:
        # { success: true, status: number, message: string, data: <payload> }
        # The schemas below describe the "data" payload for each endpoint.
        # Wrapped response schemas below combine the envelope with the domain payload.

        UserEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/User'

        User:
            type: object
            additionalProperties: false
            required: [id, email, username]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                email:
                    $ref: '#/components/schemas/Email'
                username:
                    type: string
                # The role this person holds inside the shop, by name — one of the presets in
                # `shared/authorization-roles.yaml`. A NAME rather than a key list: roles are data
                # a deployment may edit, and publishing the keys would freeze each account at the
                # permissions its role held on the day it was written. What a caller may DO is
                # `GET /me/abilities`, which answers for the caller rather than about a row.
                role:
                    type: string
                # Independent of `deletedAt` below: an account can be deactivated without being
                # deleted, and a deleted one keeps whatever `active` it had. They share an effect,
                # not a value — see the note on `CreateProductRequest.active`.
                active:
                    type: boolean
                # WHEN the address was confirmed through the verify-request / verify-confirm flow,
                # absent until it is. Self-signup starts absent and confirms by email;
                # admin-created and OAuth accounts start set because an operator or the provider
                # already vouches for the address. Informational only — enforcement is the `role`
                # above (`unverified` holds no `cart.checkout`, see `GET /account/abilities`) — so
                # a client renders this as a banner, never as a wall of its own.
                verifiedAt:
                    type: [string, 'null']
                    format: date-time
                # Set only by `PUT`/`PATCH /account` requesting a new address, cleared once
                # `POST /account/email-change-confirm` proves it or `DELETE /account/pending-email`
                # cancels it explicitly — resending the CURRENT address is a no-op, not a cancel.
                # Inlined rather than `$ref`ing `Email`: that schema is shared with WRITABLE
                # request bodies, and `readOnly` belongs to this field's use here, not to every one
                # of them. A client shows it as a banner, never writes it — the request body's own
                # `email` is what starts a change (see docs/modules/account.md#proving-an-address).
                pendingEmail:
                    type: string
                    format: email
                    readOnly: true
                imageUrl:
                    $ref: '#/components/schemas/ImageUrl'
                thumbnailUrl:
                    $ref: '#/components/schemas/ThumbnailUrl'
                locale:
                    $ref: '#/components/schemas/Locale'
                phone:
                    type: string
                website:
                    type: string
                # "Never asked" and "denied" are the same answer, arrived at differently — the
                # gate is opt-in, so only `true` captures anything
                # (`observability/analytics/index.ts`).
                analyticsConsent:
                    type: boolean
                # Enforced at signup only (`SignupRequest.termsAccepted`, required there) — every
                # account in the database has this `true` by construction.
                # Informational from here on: there is no re-acceptance flow.
                termsAccepted:
                    type: boolean
                # Present only once POST /account/2fa/confirm has armed a secret — a pending,
                # unconfirmed one never reaches here. The secret and backup codes themselves are
                # never part of this schema; see `users/model.ts`'s asymmetric storage.
                twoFactorEnabledAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                # Present only on a soft-deleted account, exactly as on `Product`. With `active` an
                # independent fact, this is the only thing that tells a deleted account from a
                # live one. Safe to expose: every route serving a `User` list is admin-only, and
                # `/account` serves the caller their own record.
                deletedAt:
                    type: string
                    format: date-time
                # What the CALLER may do to this account, decided by the server — present on the
                # `/users` reads and writes, absent on `/account` (a person's own record has no
                # one to rank). A client renders its controls from this rather than from the role
                # names: the answer is the route's key AND the rank rule ("is this account below
                # you?"), and a second copy of that in a separately deployed client is how the two
                # come to disagree.
                actions:
                    $ref: '#/components/schemas/UserActions'

        UserActions:
            type: object
            additionalProperties: false
            required: [update, ban, delete]
            description: >-
                What the requesting caller may do to this account. Each is the route's permission
                key AND the rank rule: an account at the caller's own level or above is
                `false` for all three, the caller's own account is judged by the keys alone.
            properties:
                update:
                    type: boolean
                    description: >-
                        Whether `PUT`/`PATCH /users/{id}` would be accepted for the profile fields
                        — `users.any.update`, and the account ranks below the caller. Never covers
                        a credential: no caller changes another person's email, password or second
                        factor.
                ban:
                    type: boolean
                    description: >-
                        Whether the account may be deactivated or reactivated — `users.any.ban`,
                        and the account ranks below the caller.
                delete:
                    type: boolean
                    description: >-
                        Whether `DELETE /users/{id}` (soft or hard) and `POST /users/{id}/restore`
                        would be accepted — `users.any.delete`, and the account ranks below the
                        caller.

        # For the path-form deletes, which need no id — `{id}` already carries it — but do
        # read the flag from a body as readily as from the query.
        HardDeleteRequest:
            type: object
            additionalProperties: false
            properties:
                hardDelete:
                    type: boolean
                    default: false

        # ---------- system — the schemas only this module's paths reference. ----------
        HealthPing:
            type: object
            additionalProperties: false
            required: [status]
            properties:
                status:
                    type: string
                    enum: [ok]
                    description: Liveness indicator. Always `ok` when the process is answering.

        HealthPingEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/HealthPing'

paths:
    # --------- System ---------
    /:
        get:
            tags: [System]
            summary: API health check
            description: |
                Public ping for clients (the frontend's API-down banner), rate-limited like any
                browser call. Not an orchestrator probe: `/livez` is liveness, `/readyz` readiness.
            operationId: getHealth
            security: []
            responses:
                '200':
                    description: API is running
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthPingEnvelope'

    /livez:
        get:
            tags: [System]
            summary: Liveness check
            description: |
                Is the process up. For an orchestrator (Kubernetes' own `/livez` + `/readyz`
                convention) and for every container HEALTHCHECK. Empty body, no I/O: it checks
                nothing else, on purpose. A failing dependency must never fail liveness, because
                a restart does not bring a downed database back.
            operationId: getLivez
            security: []
            responses:
                '200':
                    description: The process is up.

    /readyz:
        get:
            tags: [System]
            summary: Readiness check
            description: |
                Public readiness probe, for a load balancer's own probe (a Kubernetes
                readinessProbe, an AWS ALB target group, Traefik's service health check). Empty
                body either way: 200 once this instance has finished booting, has not started
                draining for shutdown, and can reach the database; 503 otherwise.

                NOT for a container HEALTHCHECK: the tools that read Docker's health status treat
                it as liveness, so a database blip would restart or replace healthy containers.
                `GET /livez` is that probe.
            operationId: getReadyz
            security: []
            responses:
                '200':
                    description: Ready to receive traffic.
                '503':
                    description: Booting, draining, or the database is unreachable.

    /.well-known/security.txt:
        get:
            tags: [System]
            summary: Vulnerability disclosure contact
            description: |
                RFC 9116 `security.txt`: where an outside reporter sends a vulnerability.
                Published only when the deployment sets `NODE_SECURITY_CONTACT` and
                `NODE_SECURITY_EXPIRES`; a fork that has not opted in answers 404 and publishes
                nothing. Plain text, not the JSON envelope, because the format is fixed by the RFC.
            operationId: getSecurityTxt
            security: []
            responses:
                '200':
                    description: The policy file.
                    content:
                        text/plain:
                            schema:
                                type: string
                '404':
                    description: This deployment has not published a disclosure contact.

