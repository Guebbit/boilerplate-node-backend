        # ---------- system — the schemas only this module's paths reference. ----------
        HealthPing:
            type: object
            additionalProperties: false
            required: [status]
            properties:
                status:
                    type: string
                    enum: [ok]
                    description: Liveness indicator. Always `ok` when the process is answering.

        HealthPingEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/HealthPing'

