rules:
    # A translation is its own subject, deliberately apart from `Locale`: a translator writes
    # WORDS for an entity a locale is already active for, never the locale's own row. It is also
    # apart from `Product`/whatever entity is translated, which is the whole point — a
    # mistranslation can never become a mischanged price. Unconditional either way, so `any` is
    # its only reading — there is no narrower one to make explicit.
    #
    # Owned by `core`, not `locales`: the subject these keys guard
    # is `kernel/translation.ts`'s port, which every module writing translatable content reaches
    # regardless of whether `locales` is installed to answer it. Deleting `locales` deletes its
    # own module and keys; it must not also delete the ability to gate a rewording on this key.
    - action: read
      subject: Translation
      module: core
      scope: tenant
      description: Read an entity's translated fields, in the admin shape (every locale at once).
    - action: update
      subject: Translation
      module: core
      scope: tenant
      description: >-
          Write an entity's translated fields. Never grants a write on the entity itself — that is
          `update:Product`, and the two are stacked on the product write route precisely so
          one alone cannot turn a rewording into a repricing.

sets:
    - name: TranslationDisplay
      module: core
      description: Read an entity's translated fields in the admin shape.
      rules:
          - read:Translation
    - name: TranslationManagement
      module: core
      description: Write an entity's translated fields.
      rules:
          - update:Translation
