extends:
    - 'spectral:oas'

rules:
    # --- Quality gates ---
    operation-operationId: error
    operation-tags: error

    # --- Catch the common typo: $refs instead of $ref ---
    no-refs-typo:
        description: "Do not use '$refs' (typo). Use '$ref'."
        severity: error
        given: '$..$refs'
        then:
            function: truthy

    # --- operationId naming matches the HTTP verb ---
    #
    # `replace*` means a full, idempotent replace; `update*` means a partial change — but nothing
    # checked that the METHOD agreed, so D17d could (and did) change a verb behind an unchanged
    # operationId with nothing to catch it. Each rule's `given` selects exactly the offenders: an
    # operationId matching the prefix, under any method but the right one, name not on the
    # allowlist — so a match here always means a real drift, not a rule bug.
    #
    # Allowlisted, both idempotent single-field PUTs whose one editable property is set outright
    # rather than merged, so PUT is the correct verb even though the name reads as "update":
    #   - updateCartItemById: aliased to the upsert endpoint, setting a cart line's quantity.
    #   - updateLocaleEntry: the entry's key is not editable, so `value` is its whole surface.
    verb-replace-is-put:
        description: 'operationId matching ^replace must be a PUT operation — see the allowlist above this rule if a genuine exception is needed.'
        severity: error
        given: "$.paths[*][?(@property != 'put' && @.operationId && @.operationId.match(/^replace/))]"
        then:
            field: operationId
            function: falsy

    verb-update-is-patch:
        description: 'operationId matching ^update must be a PATCH operation — see the allowlist above this rule if a genuine exception is needed.'
        severity: error
        given: "$.paths[*][?(@property != 'patch' && @.operationId && @.operationId.match(/^update/) && @.operationId != 'updateCartItemById' && @.operationId != 'updateLocaleEntry')]"
        then:
            field: operationId
            function: falsy

    # --- operationId naming: camelCase, no HTTP verb prefix ---
    operation-id-no-http-verb-prefix:
        description: 'operationId must not start with an HTTP verb (post, put, get). Use semantic verbs: list, create, update, delete, search, get, login, signup, etc (delete is allowed).'
        severity: error
        given: '$.paths[*][*].operationId'
        then:
            function: pattern
            functionOptions:
                notMatch: '^(post|put|patch)[A-Z]'

    operation-id-camel-case:
        description: 'operationId must be camelCase.'
        severity: error
        given: '$.paths[*][*].operationId'
        then:
            function: pattern
            functionOptions:
                match: '^[a-z][a-zA-Z0-9]*$'

    # --- Request schema naming conventions ---
    request-schema-no-http-verb-prefix:
        description: 'Request schema names must not start with an HTTP verb (Post, Put, Patch, Get). Use semantic names: CreateXRequest, UpdateXRequest, DeleteXRequest, SearchXRequest, etc (Delete is allowed).'
        severity: error
        given: '$.components.schemas'
        then:
            field: '@key'
            function: pattern
            functionOptions:
                notMatch: '^(Post|Put|Patch|Get)[A-Z].*Request$'

    request-schema-pascal-case:
        description: 'Request schema names must be PascalCase.'
        severity: error
        given: '$.components.schemas[?(@property.match(/Request$/))]~'
        then:
            function: pattern
            functionOptions:
                match: '^[A-Z][a-zA-Z0-9]*Request$'

    # --- Response schema naming conventions ---
    response-schema-no-http-verb-prefix:
        description: 'Response schema names must not start with an HTTP verb (Post, Put, Patch, Get). Use semantic names: UsersResponse, CartResponse, CheckoutResponse, etc (Delete is allowed).'
        severity: error
        given: '$.components.schemas'
        then:
            field: '@key'
            function: pattern
            functionOptions:
                notMatch: '^(Post|Put|Patch|Get)[A-Z].*Response$'

    response-schema-pascal-case:
        description: 'Response schema names must be PascalCase.'
        severity: error
        given: '$.components.schemas[?(@property.match(/Response$/))]~'
        then:
            function: pattern
            functionOptions:
                match: '^[A-Z][a-zA-Z0-9]*Response$'

    # --- Parameter naming ---
    # `in: header` is excluded: HTTP headers are conventionally hyphenated on the wire
    # (`x-antibot-challenge-token`), and camelCasing one would just be a made-up name nothing sends.
    parameter-name-camel-case:
        description: 'Parameter names must be camelCase.'
        severity: error
        given: '$.components.parameters[?(@.in != "header")].name'
        then:
            function: pattern
            functionOptions:
                match: '^[a-z][a-zA-Z0-9]*$'

    # --- Every string a request can carry declares how long it may be ---
    #
    # A string with no `maxLength` is bounded only by the 100 kB body limit, so one field can cost
    # a hundred kilobytes of memory, a hundred kilobytes of Mongo document, a hundred kilobytes in
    # a log line and, for a field that feeds a cache key or a mail, more than that. The shared
    # `Text` (1 to 200) and the per-kind values in docs/api/field-limits.md exist so the choice is a
    # one-liner.
    #
    # Exempt, because their length is already fixed or bounded elsewhere:
    #   - an `enum` (its longest member is the bound);
    #   - a fixed-length `format` (`date`, `date-time`, `uuid`, `time`);
    #   - a file part (`format: binary`), bounded by the upload limit;
    #   - a schema that composes (`allOf`/`oneOf`/`anyOf`): the bound is on the part it names.
    # `pattern`, `format: email` and `format: uri` alone are NOT exemptions: none of them bounds a
    # length. Only schemas a request reaches are checked (a body, a parameter): a response is the
    # server's own text.
    string-declares-max-length:
        description: 'A string a request can carry must declare maxLength (see docs/api/field-limits.md for values by kind).'
        severity: error
        given:
            - "$.paths[*][*].requestBody.content[*].schema..[?(@ && @.type === 'string' && !@.enum && !@.allOf && !@.oneOf && !@.anyOf && @.format !== 'date' && @.format !== 'date-time' && @.format !== 'uuid' && @.format !== 'time' && @.format !== 'binary')]"
            - "$.paths[*][*].parameters[*].schema..[?(@ && @.type === 'string' && !@.enum && !@.allOf && !@.oneOf && !@.anyOf && @.format !== 'date' && @.format !== 'date-time' && @.format !== 'uuid' && @.format !== 'time' && @.format !== 'binary')]"
            - "$.paths[*].parameters[*].schema..[?(@ && @.type === 'string' && !@.enum && !@.allOf && !@.oneOf && !@.anyOf && @.format !== 'date' && @.format !== 'date-time' && @.format !== 'uuid' && @.format !== 'time' && @.format !== 'binary')]"
        then:
            field: maxLength
            function: defined

    # The same rule for a parameter whose schema IS the string (`username`, a header, a path id):
    # the recursive paths above match a schema's children, never the schema itself, so a bare string
    # parameter needs its own selector, one level up.
    string-parameter-declares-max-length:
        description: 'A string parameter must declare maxLength on its schema (see docs/api/field-limits.md for values by kind).'
        severity: error
        given:
            - "$.paths[*][*].parameters[?(@ && @.schema && @.schema.type === 'string' && !@.schema.enum && !@.schema.allOf && !@.schema.oneOf && !@.schema.anyOf && @.schema.format !== 'date' && @.schema.format !== 'date-time' && @.schema.format !== 'uuid' && @.schema.format !== 'time' && @.schema.format !== 'binary')]"
            - "$.paths[*].parameters[?(@ && @.schema && @.schema.type === 'string' && !@.schema.enum && !@.schema.allOf && !@.schema.oneOf && !@.schema.anyOf && @.schema.format !== 'date' && @.schema.format !== 'date-time' && @.schema.format !== 'uuid' && @.schema.format !== 'time' && @.schema.format !== 'binary')]"
        then:
            field: schema.maxLength
            function: defined
