# The queues that belong to no domain — the async half of what `openapi.root.yaml` files under
# `system`.
#
# Sending an email is a verb, not a domain: the producer is whichever module needs one, and the
# consumer is `infrastructure/adapters/email.worker.ts`. That doesn't stop making sense in an app
# with no modules, so the contract for it sits beside the root rather than inside a domain that
# happens to enqueue the most jobs. Webhook delivery is NOT here: it is webhooks' own queue
# (`src/modules/webhooks/asyncapi.internal.yaml`).
#
# Unlike the root, this IS a standalone AsyncAPI document — `info` exists only to make it one, so
# `npm run lint:asyncapi:modules` can validate it exactly like a module’s.
#
# It declares `rabbitmqLocal` because it is the only section whose channels bind to it. That is
# what keeps the broker out of `asyncapi.public.yaml`: the bundle an API client shares merges the
# shared sections only, so a server no shared channel can reach never appears in it.
#
# Each queue declares its message ONCE and two operations point at it — `...Publish` (`action:
# receive`: this application receives the enqueue request) and `...Consume` (`action: send`: this
# application hands the job to the worker that dequeues it). One message, two operations, direction
# read off `action` rather than encoded in a second message declaration with the same payload.
asyncapi: 3.0.0
info:
    title: Worker job queues
    version: 0.1.0
    description: The `worker.*` queues, owned by the application rather than by any domain.
servers:
    rabbitmqLocal:
        host: localhost:5672
        protocol: amqp
        description: Local RabbitMQ broker for async job queues.
channels:
    worker.email.send:
        address: worker.email.send
        description: Email job queue — producers enqueue email requests, the email worker consumes them.
        servers:
            - $ref: '#/servers/rabbitmqLocal'
        messages:
            EmailJobMessage:
                $ref: '#/components/messages/EmailJobMessage'
    worker.email.urgent:
        address: worker.email.urgent
        description: >-
            Urgent email queue — the few mails a person is sitting on a screen waiting for (a
            verification link, a password-reset link, a two-factor code, an export-ready link, an
            account-deletion link). Same message as `worker.email.send`, its own consumer, so a
            backlog of ordinary mail never delays one.
        servers:
            - $ref: '#/servers/rabbitmqLocal'
        messages:
            EmailJobMessage:
                $ref: '#/components/messages/EmailJobMessage'
    worker.image.digest:
        address: worker.image.digest
        description: >-
            Image digest job queue — producers enqueue a quarantined upload once the document
            naming it exists, the image worker consumes them.
        servers:
            - $ref: '#/servers/rabbitmqLocal'
        messages:
            ImageDigestJobMessage:
                $ref: '#/components/messages/ImageDigestJobMessage'
operations:
    workerEmailPublish:
        action: receive
        channel:
            $ref: '#/channels/worker.email.send'
        summary: Enqueue an email for async delivery.
        description: >-
            `enqueueEmail` publishes here instead of calling the SMTP transport inline, so a
            slow or unreachable mail server cannot add its latency to the request that
            triggered the mail. When the broker itself is unavailable the message is never
            dropped: sent inline or held in a durable fallback queue — the broker is an
            optimisation on this path, never the system of record.
        messages:
            - $ref: '#/channels/worker.email.send/messages/EmailJobMessage'
    workerEmailUrgentPublish:
        action: receive
        channel:
            $ref: '#/channels/worker.email.urgent'
        summary: Enqueue an urgent email for async delivery.
        description: >-
            Same contract as `workerEmailPublish`, for a mail a person is waiting on. The
            producer chooses the channel; nothing else about the job changes.
        messages:
            - $ref: '#/channels/worker.email.urgent/messages/EmailJobMessage'
    workerEmailUrgentConsume:
        action: send
        channel:
            $ref: '#/channels/worker.email.urgent'
        summary: Email worker picks up and sends the urgent email.
        description: >-
            Consumed by the same handler as `workerEmailConsume`, on its own queue and its own
            consumer.
        messages:
            - $ref: '#/channels/worker.email.urgent/messages/EmailJobMessage'
    workerEmailConsume:
        action: send
        channel:
            $ref: '#/channels/worker.email.send'
        summary: Email worker picks up and sends the email.
        description: >-
            The consumer acknowledges only after the transport accepts the message, so a worker
            that dies mid-send returns the job to the queue rather than losing it. A rendering
            failure is retried like any other error, up to `NODE_QUEUE_MAX_ATTEMPTS`, then parked
            in the dead queue. The render reads the template and the spooled attachments from
            disk, and a name the running worker has not yet registered (a deploy in progress) can
            still resolve, so a failure is not provably permanent. The cap keeps a broken template
            from starving the queue, and no mail is sent before the render succeeds.
        messages:
            - $ref: '#/channels/worker.email.send/messages/EmailJobMessage'
    workerImageDigestPublish:
        action: receive
        channel:
            $ref: '#/channels/worker.image.digest'
        summary: Enqueue a quarantined upload for digesting.
        description: >-
            Published only after the document referencing `key` as its `pendingImageKey` has
            been persisted, so the job always carries a real id to write back to. Decoding,
            re-encoding and thumbnailing an image is CPU-bound — exactly what must not happen
            on a request thread.
        messages:
            - $ref: '#/channels/worker.image.digest/messages/ImageDigestJobMessage'
    workerImageDigestConsume:
        action: send
        channel:
            $ref: '#/channels/worker.image.digest'
        summary: Image worker digests the upload and promotes it.
        description: >-
            Strips metadata, caps dimensions and re-encodes the quarantined original, builds
            its WebP thumbnail, promotes both into the public store, then writes the two urls
            back onto the document — conditional on `pendingImageKey` still matching `key`, so
            a stale or superseded job cannot overwrite a later upload, and a deleted document
            is detected rather than silently ignored.
        messages:
            - $ref: '#/channels/worker.image.digest/messages/ImageDigestJobMessage'
components:
    messages:
        EmailJobMessage:
            name: EmailJobMessage
            title: Email delivery job
            payload:
                $ref: '#/components/schemas/EmailJobPayload'
        ImageDigestJobMessage:
            name: ImageDigestJobMessage
            title: Image digest job
            payload:
                $ref: '#/components/schemas/ImageDigestJobPayload'
    schemas:
        EmailJobPayload:
            type: object
            required:
                - request
                - templateName
                - data
            properties:
                request:
                    # `title` names the generated model — a bare inline object otherwise becomes
                    # Modelina's `AnonymousSchemaN`, renumbered on every unrelated schema addition.
                    title: EmailRequest
                    type: object
                    description: Nodemailer SendMailOptions subset.
                    required:
                        - to
                    properties:
                        to:
                            type: string
                        subject:
                            type: string
                        text:
                            type: string
                        html:
                            type: string
                        replyTo:
                            type: string
                            format: email
                            description: >-
                                Bare address replies go to, set as the `Reply-To` header. The
                                producer has already validated it; `From` stays the configured
                                sender either way.
                        noReplyTo:
                            type: boolean
                            description: >-
                                `true` sends no `Reply-To` header at all, instead of the support
                                address a mail that names no `replyTo` gets. For a mail whose
                                replies must reach nobody; leaves `replyTo` unread when both are set.
                        messageId:
                            type: string
                            pattern: '^<[^<>\s@]+@[^<>\s@]+>$'
                            description: >-
                                The `Message-ID` header, angle brackets included. A producer sets
                                one when a later mail must thread under this one; left out, the
                                transport makes its own. The pattern keeps a header-breaking
                                character out of it.
                        inReplyTo:
                            type: string
                            pattern: '^<[^<>\s@]+@[^<>\s@]+>$'
                            description: >-
                                The `Message-ID` of the mail this one answers, set as `In-Reply-To`
                                and `References` so a mail client files it in the same thread.
                        attachments:
                            type: array
                            description: >-
                                Claim Check tasks, never bytes: each names a file the producer
                                already wrote to the mail spool (`mail-spool.ts`). The consumer
                                resolves `key` inside the spool root and sends nothing it cannot
                                resolve, closing off the arbitrary-file-read a producer-chosen path
                                would otherwise open.
                            items:
                                title: EmailAttachment
                                type: object
                                required:
                                    - filename
                                    - key
                                properties:
                                    filename:
                                        type: string
                                        description: The filename the recipient sees.
                                    key:
                                        type: string
                                        description: >-
                                            The opaque key `spoolAttachment` returned. Never a
                                            filesystem path.
                                additionalProperties: false
                    additionalProperties: false
                from:
                    type: string
                    description: Optional sender override.
                templateName:
                    type: string
                    description: >-
                        Outbox name of the mail to render, without a file extension — the consumer
                        resolves it to a template file. Shared with the twin backend, which renders
                        a different engine, so the name names the mail and not the file.
                data:
                    type: object
                    description: >-
                        Everything the template prints, already translated by the producer —
                        including the `<html lang>` value and the footer line. The consumer
                        interpolates it and resolves nothing, which is why no locale travels
                        with the job.
            additionalProperties: false
        ImageDigestJobPayload:
            type: object
            required:
                - collection
                - documentId
                - key
            properties:
                collection:
                    type: string
                    description: >-
                        Which module's `imageTargets` entry writes the result back — a registry
                        key (see `kernel/registry.ts`), not a raw Mongo collection name.
                documentId:
                    type: string
                    description: >-
                        The target document's id. The writeback matches it against its own
                        `pendingImageKey`, so a stale or duplicate delivery updates nothing.
                key:
                    type: string
                    description: >-
                        The opaque key `imageStore.quarantine()` returned. Never a filesystem
                        path — the consumer calls back into the store, which stays free to change
                        backend without this payload's shape changing.
            additionalProperties: false
