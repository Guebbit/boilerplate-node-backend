# The preset roles, and the keys each one holds.
#
# Committed with identical bytes in `boilerplate-node-backend` and
# `boilerplate-php-laravel-backend`, and read by both seeders rather than restated in each.
#
# WHY THIS FILE EXISTS AT ALL. `authorization-keys.yaml` and `authorization-conformance.yaml` make
# the two implementations *agree*; only this one makes them the same **product**. The PHP twin
# stores roles in a table via `spatie/laravel-permission` and the Node twin does not store them
# that way at all, so two independently written seeders would produce two different shops that
# both pass every test.
#
# Nobody is handed an empty permission matrix. A deployment gets these on day one and may edit
# them afterwards — they are a starting point, not a schema.
#
# Every tenant role below is a demo persona, run against every screen — see `docs/demo-ecommerce/`
# — except `owner`, the shop's one superuser account rather than a job. Reusing the others means
# the permission model is exercised by the demo rather than only by its own tests.

version: 1

roles:
    # -- tenant scope --------------------------------------------------------------------------
    # `unverified` is what `customer` starts as, before the address is proven — one key thinner,
    # nothing else different. Browsing, the basket, the wishlist, the address book and the account
    # follow from being signed in and need no key either way, which is the "fails in the right
    # direction" property the whole model was chosen for. See `cart.checkout`'s own description in
    # `shared/authorization-keys.yaml` and docs/theory/authorization.md.
    #
    # THERE IS NO UNVERIFIED MANAGER. A role is something an operator GRANTS, and granting it IS
    # the vouching — so every staff role below holds `cart.checkout` explicitly (`owner` via
    # `all.manage`), and this is the only tenant role that may not.
    - name: unverified
      scope: tenant
      title: A signed-up account, address unproven
      description: >-
          What `customer` is minus the ability to spend. Assigned automatically at signup; the
          verify flow promotes the account to `customer` once the address is proven, and an
          operator may promote it to anything else at any time — granting a role is the vouching.
      permissions:
          - products.read
          - locales.read
          - delivery.read
          - orders.read
          - payments.read

    - name: customer
      scope: tenant
      title: The customer
      description: >-
          Someone buying things. Everything they may do to their own basket, wishlist, addresses
          and account follows from being signed in and needs no key at all — what is listed here
          is only what they may read of the SHOP, plus the one key that lets them spend.
      permissions:
          - products.read
          - locales.read
          - delivery.read
          - orders.read
          - payments.read
          - cart.checkout

    - name: manager
      scope: tenant
      title: The shop manager
      description: >-
          What is for sale, at what price, and what happens to an order after it arrives. Reads
          stock but does not move it; that is the warehouse's job and its audit trail.
      permissions:
          # These three stay on the wildcard deliberately — see "why some families keep
          # `manage`" at the foot of this file. Spelling them out would NARROW this role.
          - products.manage
          - orders.manage
          - locales.manage
          # Stated rather than inherited. A product write stacks `products.update` AND a
          # translations key, and a `manage` key expands only over its own family — so
          # `locales.manage` does not reach `translations.*` and a manager editing a listing needs
          # these by name.
          - translations.read
          - translations.update
          - payments.read
          - inventory.read
          - delivery.read
          - feedback.read
          - users.read
          - audit.read
          - webhooks.read
          - webhooks.create
          - webhooks.update
          - webhooks.delete
          # Shopping on a staff account is not a security event — see "no unverified manager" above.
          - cart.checkout

    - name: warehouse
      scope: tenant
      title: The warehouse
      description: >-
          Stock, and getting parcels out of the door. Records movements and advances consignments;
          may not change what a thing costs or delete it from the catalogue.
      permissions:
          - products.read
          - orders.read
          - inventory.read
          - inventory.create
          - delivery.read
          - delivery.update
          - cart.checkout

    - name: support
      scope: tenant
      title: The support desk
      description: >-
          Messages from people, and accounts that need help. May update an account and may not
          erase one — that is the owner's and the moderator's, and it expects a freshly proved
          session.
      permissions:
          - feedback.read
          - feedback.update
          - feedback.delete
          - users.read
          - users.update
          - orders.read
          - payments.read
          - audit.read
          - cart.checkout

    - name: editor
      scope: tenant
      title: The editor
      description: >-
          Everything the shop SAYS and SHOWS, in every registered language: the catalogue record
          itself (`products.manage`, price included), the dictionary a shopper reads the shop in
          (`locales.manage` — including registering a language the shop has not spoken before),
          and the words on a translatable entity such as a product's title and description
          (`translations.read` and `translations.update`). What none of them touches is a different
          subject entirely:
          stock (that is `inventory`), a delivery rule, an order, or an account.
      permissions:
          # Both keep the wildcard on purpose — an editor works on drafts, and the concrete
          # `read` keys are restricted to active rows. See the foot of this file.
          - products.manage
          - locales.manage
          - translations.read
          - translations.update
          - cart.checkout

    - name: moderator
      scope: tenant
      title: The moderator
      description: >-
          Accounts, and the two things people write about their orders: the message they send and
          the order itself. May ban an account, reverse a bad charge, and read why either happened.
          `orders.manage` also reaches delete, which nothing narrower would let a moderator update.
      permissions:
          - users.read
          - users.create
          - users.update
          # Erasing an account. Held explicitly rather than through `users.manage`, so that this
          # role gaining it was a decision somebody made rather than a key it absorbed. The route
          # still demands a freshly proved session — `users.delete` carries `stepUp: critical`.
          - users.delete
          # Both keep the wildcard: their `read` keys are restricted to the caller's OWN rows,
          # which is the opposite of what a moderator is for. See the foot of this file.
          - orders.manage
          - payments.manage
          - audit.read
          - cart.checkout

    - name: owner
      scope: tenant
      title: The shop owner
      description: >-
          Unrestricted within this shop, and only within it — and note that it says nothing
          about the platform. One role cannot reach both scopes, which is the point.
      permissions:
          - all.manage

    # -- platform scope ------------------------------------------------------------------------
    - name: operator
      scope: platform
      title: The platform operator
      description: >-
          Runs the installation: health, metrics, the operational audit. Explicitly NOT a
          super-owner — holds no bare key and therefore cannot read a single shop's orders,
          customers or messages. The conformance suite asserts both halves of that.
      permissions:
          - platform.observability.manage

# The role every unauthenticated request resolves to. Named so that "guest" is a value in the
# model rather than a null somebody forgot to handle, and it holds exactly the keys a stranger
# needs — reading published products and the dictionary the shop is rendered in.
anonymous:
    name: guest
    scope: tenant
    permissions:
        - products.read
        - locales.read
        - delivery.read

# WHY SOME FAMILIES KEEP `manage`
#
# A `manage` key is not a grant, it is an instruction to expand (`src/kernel/ability.ts`). Every
# role above that could be spelled out concretely now is, so that adding a key to one of those
# families never widens a role silently — the grant has to be written down to exist.
#
# Four families are deliberately NOT spelled out, because there the two forms are not equivalent:
#
#     products.read   active: true, deletedAt: null
#     locales.read    active: true, deletedAt: null
#     orders.read     userId: $caller.id, deletedAt: null
#     payments.read   userId: $caller.id
#
# Those conditions apply to a key granted DIRECTLY and are dropped for one reached THROUGH a
# wildcard. So `orders.manage` reads the whole shop's orders, while a concrete `orders.read` reads
# only the caller's own — and swapping one for the other would quietly reduce a manager to their
# own order history, a change no type-check or lint can see. Until a family declares a key for the
# wide read, the wildcard is the only way to say what these roles actually mean.
