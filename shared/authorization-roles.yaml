# The preset roles, and the keys each one holds.
#
# Committed with identical bytes in `boilerplate-node-backend` and
# `boilerplate-php-laravel-backend`, and read by both seeders rather than restated in each.
#
# WHY THIS FILE EXISTS AT ALL. `authorization-keys.yaml` and `authorization-conformance.yaml` make
# the two implementations *agree*; only this one makes them the same **product**. The PHP twin
# stores roles in a table via `spatie/laravel-permission` and the Node twin does not store them
# that way at all, so two independently written seeders would produce two different shops that
# both pass every test.
#
# Nobody is handed an empty permission matrix. A deployment gets these on day one and may edit
# them afterwards — they are a starting point, not a schema.
#
# EVERY ROLE CARRIES A `level` — admin, staff or user — and it is a second question asked after the
# keys, never instead of them. A route still needs its key; then, for a write on something a person
# owns, the owner's level must be strictly below the caller's (`docs/theory/authorization.md`,
# "Acting on someone else's things"). `operator` sits at admin level so no shop role can touch the
# installation's own account. A person holding two roles counts at the higher one.
#
# STAFF AND ADMINISTRATORS DO NOT SHOP. `cart.self.update` and `cart.self.checkout` are held by the
# shopper roles only, so a staff account owns no basket, order, payment or return, and nobody
# approves or refunds their own transaction. A person who also buys uses a second, customer account.
#
# Every tenant role below is a demo persona, run against every screen — see `docs/demo-ecommerce/`
# — except `admin`, the shop's one superuser account rather than a job. Reusing the others means
# the permission model is exercised by the demo rather than only by its own tests.
#
# EVERY GRANT BELOW IS SPELLED OUT, `admin` INCLUDED. There is no wildcard of any kind —
# breadth is a segment on the key itself (`<family>.self.read` vs `<family>.any.read`), so a role
# that reads widely says `any` and a role that reads only its own says `self`, and nothing has to
# be inferred from which wildcard a role happens to hold. `admin` lists every declared tenant key
# by name for the same reason every other role does: a key nothing lists grants nothing, and that
# is now true of `admin` too — see `authorization-keys.yaml`'s closing note.

version: 1

roles:
    # -- tenant scope --------------------------------------------------------------------------
    # `unverified` is what `customer` starts as, before the address is proven — one key thinner,
    # nothing else different. Browsing, the wishlist, the address book and the account follow from
    # being signed in and need no key either way, which is the "fails in the right direction"
    # property the whole model was chosen for. The basket needs `cart.self.update`, which only the
    # two shopper roles hold. See `cart.self.checkout`'s own description in
    # `shared/authorization-keys.yaml` and docs/theory/authorization.md.
    - name: unverified
      scope: tenant
      title: A signed-up account, address unproven
      level: user
      description: >-
          What `customer` is minus the ability to spend. Assigned automatically at signup; the
          verify flow promotes the account to `customer` once the address is proven, and an
          operator may promote it to anything else at any time — granting a role is the vouching.
      # `access/service.ts`'s SIGNUP_DEFAULT_ROLE and VERIFIED_CUSTOMER_ROLE read these two flags
      # rather than hand-typing the role names. Exactly one role in this file may carry
      # `signupDefault: true`; `kernel/permissions.ts` throws at boot otherwise.
      signupDefault: true
      promotesTo: customer
      permissions:
          - products.self.read
          - locales.self.read
          - orders.self.read
          - payments.self.read
          - cart.self.update
          # The example module: one's own examples. Held by every role that is a signed-in account.
          - examples.self.read
          - examples.self.create
          - examples.self.update
          - examples.self.delete

    - name: customer
      scope: tenant
      title: The customer
      level: user
      description: >-
          Someone buying things. Everything they may do to their own wishlist, addresses and
          account follows from being signed in and needs no key at all — what is listed here is
          what they may read of the SHOP, the two keys that let them use a basket and spend it,
          and the `examples.self.*` keys of the module written to be copied.
      permissions:
          - products.self.read
          - locales.self.read
          - orders.self.read
          - payments.self.read
          - cart.self.update
          - cart.self.checkout
          - examples.self.read
          - examples.self.create
          - examples.self.update
          - examples.self.delete

    - name: manager
      scope: tenant
      title: The shop manager
      level: staff
      description: >-
          What is for sale, at what price, and what happens to an order after it arrives. Reads
          stock but does not move it; that is the warehouse's job and its audit trail.
      permissions:
          - products.any.read
          - products.any.create
          - products.any.update
          - products.any.delete
          - orders.any.read
          - orders.any.create
          - orders.any.update
          - orders.any.delete
          - locales.any.read
          - locales.any.create
          - locales.any.update
          - locales.any.delete
          # A product write stacks `products.any.update` AND a translations key, so a manager
          # editing a listing needs this by name.
          - translations.any.read
          - translations.any.update
          - payments.self.read
          - inventory.any.read
          # A manager may start fulfilment on a paid order — POST /delivery/order/{id}/start.
          - delivery.any.start
          # The returns queue: read it, decide a request, and record goods arriving.
          - returns.any.read
          - returns.any.update
          - returns.any.receive
          - feedback.any.read
          - audit.any.read
          - webhooks.any.read
          - webhooks.any.create
          - webhooks.any.update
          - webhooks.any.delete
          - examples.self.read
          - examples.self.create
          - examples.self.update
          - examples.self.delete

    - name: warehouse
      scope: tenant
      title: The warehouse
      level: staff
      description: >-
          Stock, and getting parcels out of the door. Records movements and advances consignments;
          may not change what a thing costs or delete it from the catalogue.
      permissions:
          # The wide read, drafts included: the stock form's product picker must list a product
          # that is not published yet. Read only — price and delete stay the manager's.
          - products.any.read
          # The fix this plan exists for: packing an order that is never the warehouse operator's
          # own needs the WIDE read, not the narrow one `orders.self.read` would give.
          - orders.any.read
          - inventory.any.read
          - inventory.any.create
          - delivery.any.update
          # The warehouse's own door for starting work on a paid order.
          - delivery.any.start
          # The warehouse holds the parcel: it reads the queue and says the goods arrived. Deciding
          # whether a return was owed is the manager's and the support desk's, not theirs.
          - returns.any.read
          - returns.any.receive
          - examples.self.read
          - examples.self.create
          - examples.self.update
          - examples.self.delete

    - name: support
      scope: tenant
      title: The support desk
      level: staff
      description: >-
          Messages from people, and accounts that need help. May correct a customer's profile and
          may neither ban nor erase an account — banning is the moderator's, erasing the admin's
          and the moderator's, and it expects a freshly proved session. Touches only accounts below
          staff level, and never a credential.
      permissions:
          - feedback.any.read
          - feedback.any.update
          - feedback.any.delete
          - users.any.read
          - users.any.update
          # The fix this plan exists for: helping a customer with an order or a payment that is
          # never the support agent's own needs the WIDE read, not the narrow one.
          - orders.any.read
          - payments.any.read
          # Helping a customer with a return: read the queue and answer a request.
          - returns.any.read
          - returns.any.update
          - examples.self.read
          - examples.self.create
          - examples.self.update
          - examples.self.delete

    - name: editor
      scope: tenant
      title: The editor
      level: staff
      description: >-
          Everything the shop SAYS and SHOWS, in every registered language: the catalogue record
          itself (price included), the dictionary a shopper reads the shop in — including
          registering a language the shop has not spoken before — and the words on a translatable
          entity such as a product's title and description. What none of them touches is a
          different subject entirely: stock (that is `inventory`), a delivery rule, an order, or an
          account.
      permissions:
          # Every product and locale action, including the wide read — an editor works on drafts,
          # and the narrow `self` read is restricted to active rows.
          - products.any.read
          - products.any.create
          - products.any.update
          - products.any.delete
          - locales.any.read
          - locales.any.create
          - locales.any.update
          - locales.any.delete
          - translations.any.read
          - translations.any.update
          - examples.self.read
          - examples.self.create
          - examples.self.update
          - examples.self.delete

    - name: moderator
      scope: tenant
      title: The moderator
      level: staff
      description: >-
          Accounts, and what happens to an order once it is placed. May ban an account, reverse a
          bad charge, and read why either happened. Touches only accounts and orders below staff
          level, and never a credential.
      permissions:
          - users.any.read
          - users.any.create
          - users.any.update
          - users.any.ban
          # Erasing an account. Held explicitly rather than through a wildcard, so that this role
          # gaining it was a decision somebody made rather than a key it absorbed. The route still
          # demands a freshly proved session — `users.any.delete` carries `stepUp: critical`.
          - users.any.delete
          # The wide read on both — a moderator's whole purpose is rows that are never their own.
          - orders.any.read
          - orders.any.update
          - payments.any.read
          - payments.any.create
          - payments.any.update
          - returns.any.read
          - returns.any.update
          - audit.any.read
          - examples.self.read
          - examples.self.create
          - examples.self.update
          - examples.self.delete

    - name: admin
      scope: tenant
      title: The administrator
      level: admin
      description: >-
          Unrestricted within this shop, and only within it — and note that it says nothing
          about the platform. One role cannot reach both scopes, which is the point. Every tenant
          key below is held by name, bar the two `shopperOnly` basket keys (an administrator does
          not shop); the conformance suite refuses any other declared tenant key this list omits,
          so adding a key here can never again be optional.
      permissions: &admin_permissions
          - products.self.read
          - products.any.read
          - products.any.create
          - products.any.update
          - products.any.delete
          - orders.self.read
          - orders.any.read
          - orders.any.create
          - orders.any.update
          - orders.any.delete
          - orders.any.override
          - payments.self.read
          - payments.any.read
          - payments.any.create
          - payments.any.update
          - inventory.any.read
          - inventory.any.create
          - inventory.any.sweep
          - delivery.any.update
          - delivery.any.start
          - returns.any.read
          - returns.any.update
          - returns.any.receive
          - feedback.any.read
          - feedback.any.update
          - feedback.any.delete
          - locales.self.read
          - locales.any.read
          - locales.any.create
          - locales.any.update
          - locales.any.delete
          - translations.any.read
          - translations.any.update
          - users.any.read
          - users.any.create
          - users.any.update
          - users.any.ban
          - users.any.delete
          - audit.any.read
          - webhooks.any.read
          - webhooks.any.create
          - webhooks.any.update
          - webhooks.any.delete
          - apikeys.any.read
          - apikeys.any.create
          - apikeys.any.delete
          - examples.self.read
          - examples.self.create
          - examples.self.update
          - examples.self.delete
          - examples.any.read
          - examples.any.update
          - examples.any.delete

    # The principal background/scheduled work runs as — a reservation
    # sweep, a reaper — never `admin` itself, so an audit row can say "a sweep did this" and never
    # "an admin did this" for a request nobody made. `permissions` is a YAML alias of `admin`'s own
    # list, `&admin_permissions` above: the two can never drift apart by hand, because they are the
    # same parsed array, not two lists somebody has to keep matching.
    #
    # Assigning it to a real account is possible (nothing here refuses the name) but pointless: the
    # audit trail's `system` label comes from the CALLER'S ID being the literal string `system`
    # (`Caller.system` in `kernel/permissions.ts`), never from holding this role, so a real account
    # granted it would read as an ordinary unrestricted `admin`, not as the system actor. Nothing in
    # this codebase ever assigns it — `SYSTEM_ACTOR` is its only caller.
    - name: system
      scope: tenant
      title: The system actor
      level: admin
      description: >-
          Background and scheduled work acting on nobody's behalf — a reservation-expiry sweep, a
          reaper. Unrestricted within this shop, exactly like `admin`. Nothing in this codebase
          assigns it to a real account.
      permissions: *admin_permissions

    # -- platform scope ------------------------------------------------------------------------
    - name: operator
      scope: platform
      title: The platform operator
      level: admin
      description: >-
          Runs the installation: health, metrics, and the incidents in the operational audit
          (security events, failed logins, worker failures — never a customer's orders or accounts,
          and IP addresses pseudonymised). Explicitly NOT a super-admin — holds no bare key and
          therefore cannot read a single shop's orders, customers or messages. At admin level, so
          no shop role can touch this account. The conformance suite asserts both halves of that.
      permissions:
          - platform.observability.any.read

# The role every unauthenticated request resolves to. Named so that "guest" is a value in the
# model rather than a null somebody forgot to handle, and it holds exactly the keys a stranger
# needs — reading published products and the dictionary the shop is rendered in.
anonymous:
    name: guest
    scope: tenant
    level: user
    permissions:
        - products.self.read
        - locales.self.read
