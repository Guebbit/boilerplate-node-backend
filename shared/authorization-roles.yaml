# The preset roles, and the permission sets each one lists.
#
# Committed with identical bytes in `boilerplate-node-backend` and
# `boilerplate-php-laravel-backend`, and read by both seeders rather than restated in each.
#
# WHY THIS FILE EXISTS AT ALL. `authorization-keys.yaml` (the rules and the sets) and `authorization-conformance.yaml` make
# the two implementations *agree*; only this one makes them the same **product**. The PHP twin
# stores roles in a table via `spatie/laravel-permission` and the Node twin does not store them
# that way at all, so two independently written seeders would produce two different shops that
# both pass every test.
#
# Nobody is handed an empty permission matrix. A deployment gets these on day one and may edit
# them afterwards — they are a starting point, not a schema.
#
# A STAFF ROLE IS ONLY A LIST OF PERMISSION SETS, and nothing else: no level, no rank. A person holds at
# most one stored role per scope. What protects PEOPLE is a rule, `assign:Role` (the `RoleManagement`
# set): only its holder may
# hand out a staff role or change an account that holds one (`docs/theory/authorization.md`,
# "Protecting people"). Staff without it change customers only.
#
# EVERY SIGNED-IN ACCOUNT IS A CUSTOMER TOO. The `audience` block below is not stored and never
# granted: it is computed per request — no session is `guest`, a session without `verifiedAt` is
# `unverified`, one with it is `customer` — and unioned with the staff role the account holds. So
# a staff member reads, pays for and returns their own orders, and fills a basket, exactly like
# anyone else; a staff role only ADDS the staff rules. An API key gets the `guest` rules and what it
# was minted with, never the audience of its minter.
#
# Every tenant role below is a demo persona, run against every screen — see `docs/demo-ecommerce/`
# — except `admin`, the shop's one superuser account rather than a job. Reusing the others means
# the permission model is exercised by the demo rather than only by its own tests.
#
# EVERY SET BELOW IS LISTED BY NAME, `admin` INCLUDED. There is no wildcard of any kind. Whether a
# role reads its own rows or everyone's is the ACTION of the rule inside the set (`read:Order` is
# mine, `display:Order` is every row), so nothing has to be inferred from which wildcard a role
# happens to hold. `admin` lists every declared tenant set that the `customer` audience does not
# already give, for the same reason every other role does: a set nothing lists grants nothing —
# see `authorization-keys.yaml`'s closing note.

version: 1

roles:
    # -- tenant scope --------------------------------------------------------------------------
    - name: manager
      scope: tenant
      title: The shop manager
      description: >-
          What is for sale, at what price, and what happens to an order after it arrives. Reads
          stock but does not move it; that is the warehouse's job and its audit trail.
      sets:
          - ProductDisplay
          - ProductManagement
          - OrderDisplay
          - OrderCreation
          - OrderEditing
          - OrderRemoval
          # The order list as a spreadsheet, for reconciliation and the accountant.
          - OrderExport
          - LocaleDisplay
          - LocaleManagement
          # A product write stacks `update:Product` AND a translations rule, so a manager
          # editing a listing needs this by name.
          - TranslationDisplay
          - TranslationManagement
          # The manager cancels paid orders, which refunds them, so it reads the money; refunding
          # itself stays `create:Refund`.
          - PaymentDisplay
          # The sales numbers are the manager's job; they can already see every payment.
          - StatsDisplay
          - InventoryDisplay
          # A manager may start fulfilment on a paid order — POST /delivery/order/{id}/start.
          - DeliveryStart
          # The returns queue: read it, decide a request, and record goods arriving.
          - ReturnDisplay
          - ReturnManagement
          - ReturnReceiving
          - FeedbackDisplay
          - AuditDisplay
          - WebhookDisplay
          - WebhookManagement
          - ExampleAuthoring

    - name: warehouse
      scope: tenant
      title: The warehouse
      description: >-
          Stock, and getting parcels out of the door. Records movements and advances consignments;
          may not change what a thing costs or delete it from the catalogue.
      sets:
          # The wide read, drafts included: the stock form's product picker must list a product
          # that is not published yet. Read only — price and delete stay the manager's.
          - ProductDisplay
          # The fix this plan exists for: packing an order that is never the warehouse operator's
          # own needs the WIDE read, not the narrow one `read:Order` would give.
          - OrderDisplay
          - InventoryDisplay
          - InventoryManagement
          - DeliveryManagement
          # The warehouse's own door for starting work on a paid order.
          - DeliveryStart
          # The warehouse holds the parcel: it reads the queue and says the goods arrived. Deciding
          # whether a return was owed is the manager's and the support desk's, not theirs.
          - ReturnDisplay
          - ReturnReceiving
          - ExampleAuthoring

    - name: support
      scope: tenant
      title: The support desk
      description: >-
          Messages from people, and accounts that need help. May correct a customer's profile and
          may neither ban nor erase an account — banning is the moderator's, erasing the admin's
          and the moderator's, and it expects a freshly proved session. Touches customers' accounts
          only, and never a credential.
      sets:
          - FeedbackDisplay
          - FeedbackManagement
          - UserDisplay
          - UserEditing
          # The fix this plan exists for: helping a customer with an order or a payment that is
          # never the support agent's own needs the WIDE read, not the narrow one.
          - OrderDisplay
          - PaymentDisplay
          # Helping a customer with a return: read the queue and answer a request.
          - ReturnDisplay
          - ReturnManagement
          - ExampleAuthoring

    - name: editor
      scope: tenant
      title: The editor
      description: >-
          Everything the shop SAYS and SHOWS, in every registered language: the catalogue record
          itself (price included), the dictionary a shopper reads the shop in — including
          registering a language the shop has not spoken before — and the words on a translatable
          entity such as a product's title and description. What none of them touches is a
          different subject entirely: stock (that is `inventory`), a delivery rule, an order, or an
          account.
      sets:
          # Every product and locale action, including the wide read — an editor works on drafts,
          # and the narrow `read:Product` is restricted to active rows.
          - ProductDisplay
          - ProductManagement
          - LocaleDisplay
          - LocaleManagement
          - TranslationDisplay
          - TranslationManagement
          - ExampleAuthoring

    - name: moderator
      scope: tenant
      title: The moderator
      description: >-
          Accounts, and what happens to an order once it is placed. May ban an account, reverse a
          bad charge, and read why either happened. Touches customers' accounts only, and
          never a credential.
      sets:
          - UserDisplay
          - UserCreation
          - UserEditing
          - UserBanning
          # Erasing an account. Held explicitly rather than through a wildcard, so that this role
          # gaining it was a decision somebody made rather than a rule it absorbed. The route still
          # demands a freshly proved session — `delete:User` carries `stepUp: critical`.
          - UserErasure
          # The wide read on both — a moderator's whole purpose is rows that are never their own.
          - OrderDisplay
          - OrderEditing
          - PaymentDisplay
          - PaymentRecording
          - PaymentRefunding
          - ReturnDisplay
          - ReturnManagement
          - AuditDisplay
          - ExampleAuthoring

    - name: admin
      scope: tenant
      title: The administrator
      description: >-
          Unrestricted within this shop, and only within it — and note that it says nothing
          about the platform. One role cannot reach both scopes, which is the point. Every tenant
          set the `customer` audience does not already give is listed below by name; the conformance
          suite refuses any other declared tenant rule this list omits, so adding a set here can
          never again be optional.
      sets: &admin_sets
          - ProductDisplay
          - ProductManagement
          - OrderDisplay
          - OrderCreation
          - OrderEditing
          - OrderRemoval
          - OrderOverride
          - OrderExport
          - PaymentDisplay
          - PaymentRecording
          - PaymentRefunding
          - StatsDisplay
          - InventoryDisplay
          - InventoryManagement
          - InventorySweep
          - DeliveryManagement
          - DeliveryStart
          - ReturnDisplay
          - ReturnManagement
          - ReturnReceiving
          - FeedbackDisplay
          - FeedbackManagement
          - LocaleDisplay
          - LocaleManagement
          - TranslationDisplay
          - TranslationManagement
          - UserDisplay
          - UserCreation
          - UserEditing
          - UserBanning
          - UserErasure
          - AuditDisplay
          - WebhookDisplay
          - WebhookManagement
          - ApiKeyDisplay
          - ApiKeyManagement
          - RoleManagement
          - ExampleAuthoring
          - ExampleManagement

    # The principal background/scheduled work runs as — a reservation
    # sweep, a reaper — never `admin` itself, so an audit row can say "a sweep did this" and never
    # "an admin did this" for a request nobody made. `sets` is a YAML alias of `admin`'s own
    # list, `&admin_sets` above: the two can never drift apart by hand, because they are the
    # same parsed array, not two lists somebody has to keep matching.
    #
    # `assignable: false`: no request may hand it to an account. The audit trail's `system` label
    # comes from the CALLER'S ID being the literal string `system` (`Caller.system` in
    # `kernel/permissions.ts`), never from holding this role, so a real account granted it would be
    # an admin twin logged as `admin`. Nothing in this codebase assigns it — `SYSTEM_ACTOR` is its
    # only caller.
    - name: system
      scope: tenant
      title: The system actor
      assignable: false
      description: >-
          Background and scheduled work acting on nobody's behalf — a reservation-expiry sweep, a
          reaper. Unrestricted within this shop, exactly like `admin`. Never assignable to an
          account.
      sets: *admin_sets

    # -- platform scope ------------------------------------------------------------------------
    - name: operator
      scope: platform
      title: The platform operator
      description: >-
          Runs the installation: health, metrics, and the incidents in the operational audit
          (security events, failed logins, worker failures — never a customer's orders or accounts,
          and IP addresses pseudonymised). Explicitly NOT a super-admin — holds no tenant rule and
          therefore cannot read a single shop's orders, customers or messages. Only a holder of
          `assign:Role` can change this account, which no shop role is but the administrator.
          The conformance suite asserts both halves of that.
      sets:
          - ObservabilityDisplay

# The audience roles: what a request IS before any staff role is added. Never stored, never
# granted, never a row in a membership — `kernel/permissions.ts#audienceOf` picks one per request
# from the session and `User.verifiedAt`. The effective rules of a caller are the audience's plus the
# staff role's, so a set belongs here when EVERY account of that audience holds it.
#
# Written out in full, not as "customer = unverified + checkout": the PHP twin reads these bytes
# and must not have to know an inheritance rule that only one side implements.
audience:
    # No session. Named so that "guest" is a value in the model rather than a null somebody forgot
    # to handle: exactly what a stranger needs, reading published products and the dictionary the
    # shop is rendered in.
    guest:
        title: A stranger
        description: >-
            Nobody is signed in. Holds only what the storefront needs to render.
        sets:
            - ProductStorefront
            - LocaleStorefront

    # A session whose address is not proven yet. Everything `customer` is, minus the ability to
    # spend: browsing, the wishlist, the address book and the account follow from being signed in.
    unverified:
        title: A signed-up account, address unproven
        description: >-
            What `customer` is minus the ability to spend. The account becomes `customer` the moment
            `verifiedAt` is set, with nothing to grant or promote.
        sets:
            - ProductStorefront
            - LocaleStorefront
            - OrderOwn
            - PaymentOwn
            - CartShopping
            - NotificationOwn

    # A session whose address is proven.
    customer:
        title: The customer
        description: >-
            Someone buying things, and every signed-in account whose address is proven, staff
            included. Their own wishlist, addresses and account follow from being signed in and need
            no rule; what is listed is what they may read of the SHOP and the two sets that let them
            use a basket and spend it.
        sets:
            - ProductStorefront
            - LocaleStorefront
            - OrderOwn
            - PaymentOwn
            - CartShopping
            - CartCheckout
            - NotificationOwn
