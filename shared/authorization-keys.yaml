# Every permission rule and permission set that exists. Generated — `npm run authorization:bundle`
# splices this file from one fragment per owning module (`src/modules/<name>/authorization.yaml`)
# plus this root residual for the app-level `core` rules. A rule or a set is introduced in its
# owning fragment, never in the bundle directly; `--check` (wired into `complete`) fails the build
# if the bundle drifts from them.
#
# Committed with identical bytes in `boilerplate-node-backend` and
# `boilerplate-php-laravel-backend`. Neither repo's formatter touches it — see the exclusion in
# `.prettierignore` / `dprint.json`, for the same reason `spectral.yaml` is excluded: two
# formatters over one shared artefact is a silent fork.
#
# ROLES ARE DATA, PERMISSIONS ARE CODE. A deployment may create roles at runtime. It may never
# invent a rule, because a rule nothing checks grants nothing while looking like it grants
# something. Assignment validates against this file, not against a string.
#
# THREE LAYERS, the CanCan model as Solidus uses it:
#   rule            one `action` on one `subject`, optionally narrowed by `conditions`. Its id is
#                   `<action>:<subject>` (`display:Order`) and no two rules share one.
#   permission set  a named bundle of rules per module (`OrderDisplay`). Declared beside the rules,
#                   listed by roles in `authorization-roles.yaml`.
#   role            a list of sets. Nothing else: no level, no rank, no wildcard.
# A guard asks `(action, subject)` and nothing else; no rule or set name appears in a route.
#
# NO `self` / `any` IN A NAME. "Own rows" is a CONDITION on a rule (`userId: $caller.id`), the way
# Solidus' `DefaultCustomer` writes it. What tells a staff door from a customer's own-rows rule is
# the action: `display` is "every row" where `read` is "my rows", and `admin` is "edit or remove
# any row" where `update` and `delete` are "mine". Both are declared in `implies:` below, so a
# holder of `display` also passes a `read` check, which is what keeps one query for both.
#
# THE ONE INVARIANT, and the reason `scope` is a field rather than a naming convention:
#   a tenant rule can never be satisfied by a platform-scope caller, and a platform rule can never
#   be satisfied by a tenant-scope caller.
# A platform operator administers shared reference data and is not a super-member. Mapping that
# person onto the old `admin` boolean was one line to write and a total confidentiality failure.

version: 1

# CASL's action vocabulary, plus the additions this model needs. `manage` is NOT in this list: it
# is not a declared action, since there is no wildcard of any kind, per-family or scope-wide —
# see the note at the foot of this file for why — so `manage` names nothing here.
#
# `write` is deliberately absent. It collapses create, update and delete into one rule, and the
# shop needs them apart: a support agent may update a user and may not delete one, a warehouse
# operator may adjust stock and may not delete a product.
#
# `checkout`, `sweep`, `override`, `start`, `receive`, `ban`, `export` and `assign` are additions beyond
# CASL's own CRUD vocabulary, and all follow the same rule: a verb is added only when CRUD cannot say
# the thing, never when CRUD is merely inconvenient, and the reason is recorded on the rule itself.
#   - `checkout` is `checkout:Cart`'s action. CRUD has no verb for "spend the basket": `create` on
#     `Cart` would have said nothing about what changed.
#   - `sweep` clears expired reservation holds on a schedule: no noun it creates, no row whose
#     update names the action.
#   - `override` skips the normal lifecycle gate to force a delivery move or correct a status by
#     hand, with a recorded reason — `update` would hide that this write bypasses the ordinary rule.
#   - `start` moves a paid order into `processing`. No shipment exists yet, and it is a narrower
#     grant than `update:Order`, which lets an admin rewrite the order outright.
#   - `receive` records that returned goods arrived, which puts the units back on sale and pays the
#     customer back — `update` on `Return` is the decision to approve it, a narrower hand.
#   - `ban` locks a person out, a wider hand than correcting their profile.
#   - `export` takes every customer's order out of the application as a file, a wider hand than
#     reading them one at a time. Shopify keeps a separate Export permission for the same reason.
#   - `assign` hands a staff role to an account or takes it away, and is what lets someone change
#     an account that already holds one. No `Role` row is written (roles are data in a file), so no
#     CRUD verb says it. Solidus names the same thing `RoleManagement`.
#   - `display` and `admin` are Solidus' two staff doors. `display` reads every row of a subject
#     that also has an own-rows or public `read`; `admin` edits or removes any row of a subject
#     whose `update` and `delete` are own-rows. They exist so a staff door cannot be opened by the
#     rule every signed-in account holds. A subject with no own-rows rule keeps plain `read`.
#
# THIS LIST IS THE ONE HOME of the vocabulary: `npm run gen:api` turns it into
# `api/permission-actions.ts` (and the frontend's copy), so no code types it a second time.
actions:
    - read
    - create
    - update
    - delete
    - checkout
    - sweep
    - override
    - start
    - receive
    - ban
    - export
    - assign
    - display
    - admin

# Which plain actions a staff action also answers. The ability emits each implied rule beside the
# staff one, so `can('read', Order)` is yes for a holder of `display:Order` and `accessibleBy`
# compiles one filter from the own-rows rule and the staff rule together.
implies:
    display:
        - read
    admin:
        - update
        - delete

# The two scopes. Never both, never derived from a flag — a caller resolves to exactly one.
scopes:
    tenant: Content belonging to one shop.
    platform: Shared operational data, across shops. A rule on platform data.

# Step-up — the third axis, declared on the RULE rather than on a route.
#
# A rule may carry `stepUp: critical | sensitive`, and `requirePermission` then demands that the
# caller proved themselves within that window before it lets them through. The tiers are the ones
# `NODE_REAUTH_TIME_CRITICAL` / `NODE_REAUTH_TIME_SENSITIVE` set, so this adds a place to say WHICH
# actions are worth a challenge, not a second mechanism for making one.
#
# On the rule and not the route because the rule is what the action IS: erasing somebody's account
# deserves a fresh session wherever it is reached from, and a second route that reaches it would
# otherwise have to remember. `amr` may also be named, so a future passkey tier is a line here
# rather than a guard change — the reason `amr` was carried as a list rather than a boolean.

# Credential — whether an API key can be minted with the rule.
#
# A rule may carry `credential: false`: no route a credential reaches asks for it, so minting a key
# with it would grant nothing while looking like it grants something. That is the same argument as
# "a rule nothing checks", applied to the other end. A rule with a `stepUp` tier is never mintable
# either (a credential cannot re-authenticate), and neither is a platform rule. Absent means the
# rule may be minted.

# Conditions — the ABAC half, and the reason this is not pure RBAC.
#
# A rule may carry `conditions`: a filter fragment that must ALSO hold of the row. It is the same
# shape CASL takes as its third argument and the same shape both repositories already spread into
# a query, which is what lets it be compiled INTO the read instead of checked after it.
#
# `$caller.<field>` is substituted from the resolved caller at request time. That is the whole
# placeholder grammar; there is no expression language, on purpose.
#
# THE FIELD NAMES ARE THE MODEL'S, not either storage's. `active` and `userId` are what the rule
# is ABOUT; one backend stores them under those names and the other under `active` and `user_id`,
# and each maps this vocabulary onto its own columns on the way into a query. The shared artefact
# is the condition set, and each backend generates its own query from it.
#
# Tenancy is NOT written here. Every tenant-scope rule has `tenantId: $caller.tenantId` injected
# by the resolver, so no rule can forget it and no request parameter can supply it.
#
# A rule with no `conditions` is unconditional within its scope. `read:Product` sees active,
# undeleted rows; `display:Product` sees every row — which is why a staff action and a condition
# move together on the families where the narrow reading is filtered at all.
#
# `deletedAt: null` is on the narrow reads of `Product` and `Order`, the subjects whose soft delete
# hides a row from the storefront. A payment is a record of money moving and is never withdrawn from view, so it carries
# no such column and no such condition; a rule naming a column the table lacks is a query that
# throws rather than one that narrows.
#
# It is on the narrow reads and not the wide ones, and that asymmetry is the rule
# somebody would otherwise have to remember: a soft-deleted row is gone for the audience it was
# hidden from and still there for the staff who can restore it. Matching `null` covers a field
# that is absent as well as one that is set to nothing, which is what an "unset to restore" write
# leaves behind.

# The rules themselves.
#
# `subject` is the CASL subject type — the concrete thing a rule is about, singular. A module's
# folder name is plural; the two differ on purpose: `display:Order` is a permission, `Order` is a
# thing.
#
# Modules absent from this list have no rules, and that is a decision rather than an omission:
# `wishlist` and `account` are *your own things*. What you may do with them follows from being
# signed in, not from a role, and giving them rules would invite a role that grants access to
# someone else's basket. `cart` is nearly the same — its exceptions are `update:Cart` and
# `checkout:Cart` below: whether the account shops at all, and a fact about the ACCOUNT (has this
# address been proven?) rather than about the basket's contents, which stay ruleless.
rules:
    # -- products ------------------------------------------------------------------------------
    - action: read
      subject: Product
      module: products
      scope: tenant
      description: Read active, undeleted products — the storefront's own view.
      conditions:
          active: true
          deletedAt: null
    - action: display
      subject: Product
      module: products
      scope: tenant
      description: Read every product regardless of publish state — what staff need to see a draft.
    - action: create
      subject: Product
      module: products
      scope: tenant
      description: Add a product to the catalogue.
    - action: update
      subject: Product
      module: products
      scope: tenant
      description: Change a product, including its price and its published state.
    - action: delete
      subject: Product
      module: products
      scope: tenant
      description: Remove a product. Separate from update because the blast radius is.

    # -- cart ----------------------------------------------------------------------------------
    # A basket is your own thing, so `cart` otherwise declares no rules. This exception is not
    # about the basket's CONTENTS (still ruleless: add, remove, set quantity) but about spending
    # it, which is a fact about the ACCOUNT — an unproven address must not be able to place an
    # order — and a fact about the account belongs on a rule, not a route mount. `update:Cart` is the coarser fact: whether this account shops at all, and
    # every signed-in account does, staff included (the audience roles in
    # `shared/authorization-roles.yaml`).
    # `checkout`, not `create` on `Order`: `create:Order` already means "raise an
    # order on someone else's behalf", and reusing it here would be the identical CASL tuple,
    # indistinguishable once packed for the browser. Docs: docs/theory/authorization.md.
    - action: update
      subject: Cart
      module: cart
      scope: tenant
      description: Use a basket at all — add to it, change it, reorder into it. Held by every signed-in account.
    - action: checkout
      subject: Cart
      module: cart
      scope: tenant
      description: Spend the caller's own basket — place an order and start paying for it.
      # The 403 keeps its specific wording rather than `requirePermission`'s generic one: a
      # customer refused THIS key is being told to confirm their email, not that they lack
      # permission in the abstract. `t('generic.error-<deniedCode, kebab-cased>')`.
      deniedCode: EMAIL_NOT_VERIFIED

    # -- orders --------------------------------------------------------------------------------
    - action: read
      subject: Order
      module: orders
      scope: tenant
      credential: false
      description: Read the caller's own orders.
      conditions:
          userId: $caller.id
          deletedAt: null
    - action: display
      subject: Order
      module: orders
      scope: tenant
      description: Read every order in the shop — the support desk and the warehouse, who help with or pack an order that is never their own.
    - action: create
      subject: Order
      module: orders
      scope: tenant
      description: Raise an order on someone else's behalf. Checking out is not this key.
    - action: update
      subject: Order
      module: orders
      scope: tenant
      description: Move an order along its status path.
    - action: delete
      subject: Order
      module: orders
      scope: tenant
      description: Remove an order.
    - action: override
      subject: Order
      module: orders
      scope: tenant
      description: Skip the normal lifecycle gate to force a delivery move, or correct a status by hand, with a recorded reason.
      # An override exists precisely to bypass the ordinary rule — the same reasoning
      # create:Refund carries this tier for: a stolen access token proves nothing about how
      # recently its holder typed their password, and this key's damage (a wrong parcel/status
      # written on the record) is not undone by another ordinary request.
      stepUp: critical
    - action: export
      subject: Order
      module: orders
      scope: tenant
      description: Take every order out of the shop as a CSV file, customer emails included. An API key cannot use it, since its step-up needs a person.
      # Exporting everyone's orders cannot need less proof than exporting your own data does
      # (`POST /account/export`, also `sensitive`): the file leaves the application whole.
      stepUp: sensitive

    # -- payments ------------------------------------------------------------------------------
    - action: read
      subject: Payment
      module: payments
      scope: tenant
      credential: false
      description: Read the caller's own payments.
      conditions:
          userId: $caller.id
    - action: display
      subject: Payment
      module: payments
      scope: tenant
      description: Read every payment in the shop — the support desk helping with an order that is never their own, and the shop manager seeing the money behind the orders they handle.
    - action: create
      subject: Payment
      module: payments
      scope: tenant
      description: Record a payment that arrived outside the provider — cash, a transfer, by hand.
      # Money the shop is now on the hook to have actually received. Same tier as
      # create:Refund: the admin's word is the only proof, and a stolen access token proves
      # nothing about how recently its holder typed their password.
      stepUp: critical
    - action: create
      subject: Refund
      module: payments
      scope: tenant
      description: Return money to the payer — refund a payment, whole or in part.
      # Money leaving the shop. The one action here whose damage cannot be undone by another
      # request.
      stepUp: critical

    # -- inventory -----------------------------------------------------------------------------
    - action: read
      subject: StockLevel
      module: inventory
      scope: tenant
      description: Read stock levels and the movements behind them.
    - action: create
      subject: StockMovement
      module: inventory
      scope: tenant
      description: Record a receipt or an adjustment, or set a product's preorder limit. Stock never moves without one.
    # Not a CRUD verb — see `actions:` above. Guards the one route that clears expired reservation
    # holds on a schedule; granted to no preset role but `admin`, who holds it by name like every
    # other key. See `inventory/routes.ts`.
    - action: sweep
      subject: StockLevel
      module: inventory
      scope: tenant
      description: Clear expired reservation holds. The expiry tick, not a role's own tool.

    # -- delivery ------------------------------------------------------------------------------
    - action: update
      subject: Shipment
      module: delivery
      scope: tenant
      description: Cut a shipment from a fulfillment order, record its arrival, correct its tracking code, and hold or release a fulfillment order.
    # Narrower than `update:Order` on purpose: the warehouse may begin work on a paid order
    # without being handed the run of the order record. `paid → processing` is `system`-only in
    # `orders/domain/lifecycle.ts` — this rule gates `POST /delivery/order/{id}/start`, the door
    # that calls `orders/services/status.ts`'s `markProcessing`.
    - action: start
      subject: Shipment
      module: delivery
      scope: tenant
      description: Begin fulfilling a paid order — the move into `processing`, before any parcel exists to record.

    # -- returns -------------------------------------------------------------------------------
    # There is no own-rows rule on `Return`. A customer making or reading their own return needs only to
    # be signed in — the same rule an order's own cancel follows — and "own" is decided by who owns
    # the ORDER (a return is keyed by `orderId`, never by `userId`, so erasing the account leaves
    # the record without a personal link).
    - action: read
      subject: Return
      module: returns
      scope: tenant
      description: Read every return in the shop — the queue staff work through.
    - action: update
      subject: Return
      module: returns
      scope: tenant
      description: Decide a return request — approve it, or decline it with a reason.
    # Narrower than `update:Return` on purpose, the way `start:Shipment` is narrower than
    # `update:Order`: the warehouse holds the parcel and may say it arrived, without being
    # handed the decision of whether the return was owed.
    - action: receive
      subject: Return
      module: returns
      scope: tenant
      description: Record that the returned goods arrived — puts the units back on sale and returns the customer's money.
      # Receiving pays the customer back. Same tier as `create:Refund`: a stolen access token
      # proves nothing about how recently its holder typed their password.
      stepUp: critical

    # -- feedback ------------------------------------------------------------------------------
    - action: read
      subject: Feedback
      module: feedback
      scope: tenant
      description: Read messages sent through the contact form.
    - action: update
      subject: Feedback
      module: feedback
      scope: tenant
      description: Change a message's handling status.
    - action: delete
      subject: Feedback
      module: feedback
      scope: tenant
      description: Remove a message.

    # -- locales -------------------------------------------------------------------------------
    - action: read
      subject: Locale
      module: locales
      scope: tenant
      description: Read active locales and their dictionaries — the storefront's own view.
      conditions:
          active: true
    - action: display
      subject: Locale
      module: locales
      scope: tenant
      description: Read every locale regardless of publish state — what staff need to see a draft language.
    - action: create
      subject: Locale
      module: locales
      scope: tenant
      description: Add a locale.
    - action: update
      subject: Locale
      module: locales
      scope: tenant
      description: Change a locale or one of its entries.
    - action: delete
      subject: Locale
      module: locales
      scope: tenant
      description: Remove a locale or one of its entries.

    # A translation is its own subject, deliberately apart from `Locale`: a translator writes
    # WORDS for an entity a locale is already active for, never the locale's own row. It is also
    # apart from `Product`/whatever entity is translated, which is the whole point — a
    # mistranslation can never become a mischanged price. Unconditional either way, so `any` is
    # its only reading — there is no narrower one to make explicit.
    #
    # Owned by `core`, not `locales`: the subject these keys guard
    # is `kernel/translation.ts`'s port, which every module writing translatable content reaches
    # regardless of whether `locales` is installed to answer it. Deleting `locales` deletes its
    # own module and keys; it must not also delete the ability to gate a rewording on this key.
    - action: read
      subject: Translation
      module: core
      scope: tenant
      description: Read an entity's translated fields, in the admin shape (every locale at once).
    - action: update
      subject: Translation
      module: core
      scope: tenant
      description: >-
          Write an entity's translated fields. Never grants a write on the entity itself — that is
          `update:Product`, and the two are stacked on the product write route precisely so
          one alone cannot turn a rewording into a repricing.

    # -- users ---------------------------------------------------------------------------------
    - action: read
      subject: User
      module: users
      scope: tenant
      description: Read other people's accounts. Reading your own is `account`, not a key.
    - action: create
      subject: User
      module: users
      scope: tenant
      description: Create an account for someone else.
    - action: update
      subject: User
      module: users
      scope: tenant
      description: >-
          Change someone else's profile: username, image, locale, phone, website, and the role
          (only for a holder of `assign:Role`). Never a credential, and never `active`.
    - action: ban
      subject: User
      module: users
      scope: tenant
      description: Deactivate someone else's account, or lift the deactivation; pause someone's checkout, or lift the pause.
    - action: delete
      subject: User
      module: users
      scope: tenant
      description: Erase someone else's account.
      # Irreversible and about somebody else. A stolen session should not be able to reach it on
      # the strength of a login that happened this morning.
      stepUp: critical

    # -- roles ---------------------------------------------------------------------------------
    # The one permission that protects PEOPLE. Whoever holds it may hand a staff role to an account
    # or take it away, and may edit, ban or erase an account that already holds one. Everyone else
    # with a users rule changes customers only, so a moderator who may erase accounts cannot erase
    # the administrator's. A role is a bundle of permission sets and nothing else: there is no level to rank.
    - action: assign
      subject: Role
      module: access
      scope: tenant
      credential: false
      description: Hand a staff role to an account or take it away, and change an account that holds one — edit, ban, erase. Held by administrators.

    # -- audit-logs ----------------------------------------------------------------------------
    - action: read
      subject: AuditLog
      module: audit-logs
      scope: tenant
      description: Read the audit trail. There is no write key — nothing edits an audit row.

    # -- webhooks --------------------------------------------------------------------------------
    - action: read
      subject: WebhookSubscription
      module: webhooks
      scope: tenant
      description: Read this shop's webhook subscriptions, delivery log and event catalogue.
    - action: create
      subject: WebhookSubscription
      module: webhooks
      scope: tenant
      description: Add a subscription, minting its first secret.
    - action: update
      subject: WebhookSubscription
      module: webhooks
      scope: tenant
      description: >-
          Change a subscription, rotate or drop a secret from its ring, and replay a delivery. The
          blast radius of all three is the same — a party this shop did not intend gets signed
          deliveries — so they share one key.
    - action: delete
      subject: WebhookSubscription
      module: webhooks
      scope: tenant
      description: Remove a subscription. Separate from update because the blast radius is.

    # -- api-keys --------------------------------------------------------------------------------
    - action: read
      subject: ApiKey
      module: api-keys
      scope: tenant
      credential: false
      description: List this shop's machine-to-machine credentials. Never returns a key's secret.
    - action: create
      subject: ApiKey
      module: api-keys
      scope: tenant
      description: >-
          Mint a credential. Carries its own floor on top of this key: a credential can never hold
          a permission the minter lacks.
      # A minted credential outlives the session that made it, so a stolen access token that
      # could mint one would turn ten minutes of access into a long-lived key. GitHub's sudo mode
      # asks for the same before creating a token.
      stepUp: critical
    - action: delete
      subject: ApiKey
      module: api-keys
      scope: tenant
      credential: false
      description: Revoke a credential. Soft and immediate; the row stays readable.

    # -- observability -------------------------------------------------------------------------
    # The only platform-scope module in the boilerplate, and it is what makes the invariant
    # testable here rather than only in a downstream project: health, metrics and the operational
    # audit are about the INSTALLATION, not about one shop's content.
    - action: read
      subject: ObservabilitySnapshot
      module: observability
      scope: platform
      description: Read health, metrics overview and the operational audit.

    # -- examples ------------------------------------------------------------------------------
    # The plain actions are the caller's own rows (the condition rides into the query). `display`
    # and `admin` are the staff doors: every row, whoever owns it. An admin holds both; delete this
    # file with the module and its rules and sets leave with it.
    - action: read
      subject: Example
      module: example
      scope: tenant
      credential: false
      description: Read the caller's own examples, drafts included.
      conditions:
          userId: $caller.id
    - action: create
      subject: Example
      module: example
      scope: tenant
      credential: false
      description: Write a new example of one's own.
    - action: update
      subject: Example
      module: example
      scope: tenant
      credential: false
      description: Edit the caller's own examples, and move them through draft, published and archived.
      conditions:
          userId: $caller.id
    - action: delete
      subject: Example
      module: example
      scope: tenant
      credential: false
      description: Remove the caller's own examples.
      conditions:
          userId: $caller.id
    - action: display
      subject: Example
      module: example
      scope: tenant
      credential: false
      description: Read every example, whoever owns it.
    - action: admin
      subject: Example
      module: example
      scope: tenant
      credential: false
      description: Edit or remove any example, whoever owns it.

    # -- notifications -------------------------------------------------------------------------
    # Own rows only: an inbox is somebody's own, and no role reads or clears another person's. The
    # service filters every query by the caller's id, so there is no staff door to declare.
    # Held by every role that is a signed-in account — a staff member is a person with an inbox
    # too, even though staff own no basket.
    - action: read
      subject: Notification
      module: notifications
      scope: tenant
      credential: false
      description: Read the caller's own notifications, follow them live, and mark them read.
      conditions:
          userId: $caller.id
    - action: delete
      subject: Notification
      module: notifications
      scope: tenant
      credential: false
      description: Delete the caller's own notifications, one or all at once.
      conditions:
          userId: $caller.id

    # -- stats ---------------------------------------------------------------------------------
    - action: read
      subject: Stats
      module: stats
      scope: tenant
      credential: false
      description: Read the shop's sales numbers — revenue, orders, products, customers, the payments mix.

# The permission sets. A set is the unit a role lists, so a role never names a rule directly.
# Each module declares its own beside its rules, and a new module's sets are listed in
# `authorization-roles.yaml` by `admin`.
sets:
    - name: ProductStorefront
      module: products
      description: What the storefront shows anybody, which is active and undeleted products.
      rules:
          - read:Product
    - name: ProductDisplay
      module: products
      description: Every product, drafts and removed ones included.
      rules:
          - display:Product
    - name: ProductManagement
      module: products
      description: Add, change and remove products.
      rules:
          - create:Product
          - update:Product
          - delete:Product

    - name: CartShopping
      module: cart
      description: Use a basket at all.
      rules:
          - update:Cart
    - name: CartCheckout
      module: cart
      description: Spend the basket, which places an order and starts paying.
      rules:
          - checkout:Cart

    - name: OrderOwn
      module: orders
      description: Read one's own orders.
      rules:
          - read:Order
    - name: OrderDisplay
      module: orders
      description: Read every order in the shop.
      rules:
          - display:Order
    - name: OrderCreation
      module: orders
      description: Raise an order on someone else's behalf.
      rules:
          - create:Order
    - name: OrderEditing
      module: orders
      description: Move an order along its status path.
      rules:
          - update:Order
    - name: OrderRemoval
      module: orders
      description: Remove an order.
      rules:
          - delete:Order
    - name: OrderOverride
      module: orders
