# The cases both backends must answer identically.
#
# Committed with identical bytes in `boilerplate-node-backend` and
# `boilerplate-php-laravel-backend`. Each repository runs every case against its own
# implementation — CASL on one side, an evaluator over `spatie/laravel-permission` on the other —
# and the two are twins exactly as far as this file says they are.
#
# IT HOLDS THE DENY CASES. A widened scope does not fail a test that only checks the right thing
# is allowed, which is why an authorization suite made of happy paths is worth so little. Every
# `allow` below exists as the CONTROL for a neighbouring `deny`: it is what proves the deny was
# earned by the rule and not by an evaluator that refuses everything.
#
# EVERY CASE IS A SENTENCE. If one needs a paragraph to explain, the model is wrong and the case
# is the messenger.
#
# READING A CASE:
#   caller    the resolved caller — never a role name, because roles are data and this file
#             tests the model. `scope` is `tenant` or `platform`, never both.
#   action    one of the actions in `authorization-keys.yaml`.
#   subject   the CASL subject type.
#   resource  the row's attributes. Absent means the question is about the ACTION alone
#             ("may this caller create products at all?"), which is what a route guard asks.
#   expect    allow | deny

version: 1

# Every tenant rule a verified `admin` effectively holds: the rules of the `customer` audience plus
# the sets `authorization-roles.yaml` lists for `admin`, expanded to rule ids — spelled out once and
# reused via YAML anchor below, for cases that need "the most privileged tenant caller
# conceivable" rather than one specific rule. That is every declared tenant rule. Kept identical to
# the expansion of those sets BY HAND: there is no schema link between the files, so a rule added
# to one and not the other is a review problem, not a machine-caught one.
admin-permissions: &admin_permissions
    - read:Product
    - display:Product
    - create:Product
    - update:Product
    - delete:Product
    - read:Order
    - display:Order
    - create:Order
    - update:Order
    - delete:Order
    - override:Order
    - export:Order
    - read:Payment
    - display:Payment
    - create:Payment
    - create:Refund
    - read:Stats
    - read:StockLevel
    - create:StockMovement
    - sweep:StockLevel
    - update:Shipment
    - start:Shipment
    - read:Return
    - update:Return
    - receive:Return
    - read:Feedback
    - update:Feedback
    - delete:Feedback
    - read:Locale
    - display:Locale
    - create:Locale
    - update:Locale
    - delete:Locale
    - read:Translation
    - update:Translation
    - read:User
    - create:User
    - update:User
    - ban:User
    - delete:User
    - read:AuditLog
    - read:WebhookSubscription
    - create:WebhookSubscription
    - update:WebhookSubscription
    - delete:WebhookSubscription
    - read:ApiKey
    - create:ApiKey
    - delete:ApiKey
    - assign:Role
    - update:Cart
    - checkout:Cart
    - read:Example
    - create:Example
    - update:Example
    - delete:Example
    - read:Notification
    - delete:Notification
    - display:Example
    - admin:Example

# Every tenant rule `moderator` holds — kept identical to the expansion of `authorization-roles.yaml`'s
# own `moderator` sets by hand, like the admin copy above.
moderator-permissions: &moderator_permissions
    - read:User
    - create:User
    - update:User
    - ban:User
    - delete:User
    - display:Order
    - update:Order
    - display:Payment
    - create:Payment
    - create:Refund
    - read:Return
    - update:Return
    - read:AuditLog
    - read:Example
    - create:Example
    - update:Example
    - delete:Example
    - read:Notification
    - delete:Notification

cases:
    # =============================================================================================
    # The scope invariant, both directions. These two are the reason the file exists.
    # =============================================================================================

    - name: a platform operator cannot read a shop's content
      caller: { id: op_1, scope: platform, tenantId: null, permissions: [read:ObservabilitySnapshot] }
      action: read
      subject: Order
      resource: { tenantId: shop_1, userId: usr_1 }
      expect: deny

    - name: a shop admin cannot read platform operational data
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: *admin_permissions }
      action: read
      subject: ObservabilitySnapshot
      resource: {}
      expect: deny

    - name: a platform operator can read platform operational data
      caller: { id: op_1, scope: platform, tenantId: null, permissions: [read:ObservabilitySnapshot] }
      action: read
      subject: ObservabilitySnapshot
      resource: {}
      expect: allow

    - name: holding every declared tenant rule still never satisfies a bare manage action
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: *admin_permissions }
      action: manage
      subject: ObservabilitySnapshot
      resource: {}
      expect: deny

    # These two are the same invariant reached by a mis-seeded role rather than by a wildcard: a
    # concrete rule from the wrong scope must be INERT, not merely unreachable through a route.
    - name: a tenant caller holding a platform rule by mistake is still denied
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: [read:ObservabilitySnapshot] }
      action: read
      subject: ObservabilitySnapshot
      resource: {}
      expect: deny

    - name: a platform caller holding a tenant rule by mistake is still denied
      caller: { id: op_1, scope: platform, tenantId: null, permissions: [read:Product] }
      action: read
      subject: Product
      resource: { tenantId: shop_1, active: true }
      expect: deny

    # =============================================================================================
    # Tenancy. A caller resolved into one shop can never reach another, whatever they hold.
    # =============================================================================================

    - name: a shop admin cannot read another shop's order
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: *admin_permissions }
      action: read
      subject: Order
      resource: { tenantId: shop_2, userId: usr_9 }
      expect: deny

    - name: a shop admin can read their own shop's order
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: *admin_permissions }
      action: read
      subject: Order
      resource: { tenantId: shop_1, userId: usr_9 }
      expect: allow

    - name: a manager cannot update a product belonging to another shop
      caller: { id: usr_2, scope: tenant, tenantId: shop_1, permissions: [update:Product] }
      action: update
      subject: Product
      resource: { tenantId: shop_2, active: true }
      expect: deny

    - name: a manager may read a customer's payment
      caller: { id: usr_2, scope: tenant, tenantId: shop_1, permissions: [display:Payment] }
      action: read
      subject: Payment
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: allow

    - name: a manager may not refund a payment
      caller: { id: usr_2, scope: tenant, tenantId: shop_1, permissions: [display:Payment] }
      action: create
      subject: Refund
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: deny

    - name: a support desk that reads every order may not export them
      caller: { id: usr_2, scope: tenant, tenantId: shop_1, permissions: [display:Order] }
      action: export
      subject: Order
      resource: { tenantId: shop_1, userId: usr_9 }
      expect: deny

    - name: a manager holding the export rule may export orders
      caller: { id: usr_2, scope: tenant, tenantId: shop_1, permissions: [export:Order] }
      action: export
      subject: Order
      resource: { tenantId: shop_1, userId: usr_9 }
      expect: allow

    - name: the same person, member of two shops, is one caller in one of them at a time
      caller: { id: usr_2, scope: tenant, tenantId: shop_2, permissions: [update:Product] }
      action: update
      subject: Product
      resource: { tenantId: shop_2, active: true }
      expect: allow

    # =============================================================================================
    # Ownership. `read:Order` and `read:Payment` are your own rows, and nothing widens
    # them by accident — `display:Order` and `display:Payment` are the separate, explicit rules
    # for everyone's.
    # =============================================================================================

    - name: a customer cannot read someone else's order
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: [read:Order, read:Payment] }
      action: read
      subject: Order
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: deny

    - name: a customer can read their own order
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: [read:Order, read:Payment] }
      action: read
      subject: Order
      resource: { tenantId: shop_1, userId: usr_1 }
      expect: allow

    - name: a customer cannot read someone else's payment
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: [read:Payment] }
      action: read
      subject: Payment
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: deny

    - name: a caller with no id cannot read an order by owning nothing
      caller: { id: null, scope: tenant, tenantId: shop_1, permissions: [read:Order] }
      action: read
      subject: Order
      resource: { tenantId: shop_1, userId: null }
      expect: deny

    # `display:Order` and `display:Payment` carry no owner condition, so the support desk and
    # the warehouse can read an order or a payment that is never their own — without the family's
    # old `manage` wildcard, which would also have handed them delete.
    - name: a caller holding display:Order reads an order that is not their own
      caller: { id: usr_3, scope: tenant, tenantId: shop_1, permissions: [display:Order] }
      action: read
      subject: Order
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: allow

    - name: display:Order alone does not let that caller delete the order
      caller: { id: usr_3, scope: tenant, tenantId: shop_1, permissions: [display:Order] }
      action: delete
      subject: Order
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: deny

    # The example module's two doors, the smallest worked case of own rows against every row: the
    # plain action narrowed by an owner condition, and the staff action (`admin`) with none.
    - name: a caller can edit their own example
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: [update:Example] }
      action: update
      subject: Example
      resource: { tenantId: shop_1, userId: usr_1 }
      expect: allow

    - name: a caller holding only update:Example cannot edit someone else's example
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: [update:Example] }
      action: update
      subject: Example
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: deny

    - name: a caller holding admin:Example edits an example that is not their own
      caller: { id: usr_3, scope: tenant, tenantId: shop_1, permissions: [admin:Example] }
      action: update
      subject: Example
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: allow

    - name: update:Example alone does not let that caller delete the example
      caller: { id: usr_3, scope: tenant, tenantId: shop_1, permissions: [update:Example] }
      action: delete
      subject: Example
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: deny

    - name: a caller holding display:Payment reads a payment that is not their own
      caller: { id: usr_4, scope: tenant, tenantId: shop_1, permissions: [display:Payment] }
      action: read
      subject: Payment
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: allow

    # =============================================================================================
    # Visibility. A third axis, and a property of the row rather than of the caller.
    # =============================================================================================

    - name: a guest cannot read an inactive product
      caller: { id: null, scope: tenant, tenantId: shop_1, permissions: [read:Product, read:Locale] }
      action: read
      subject: Product
      resource: { tenantId: shop_1, active: false }
      expect: deny

    - name: a guest can read a published product
      caller: { id: null, scope: tenant, tenantId: shop_1, permissions: [read:Product, read:Locale] }
      action: read
      subject: Product
      resource: { tenantId: shop_1, active: true }
      expect: allow

    - name: a signed-in customer sees exactly what a guest sees of the catalogue
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: [read:Product] }
      action: read
      subject: Product
      resource: { tenantId: shop_1, active: false }
      expect: deny

    - name: display:Product reads an inactive product, unlike read:Product
      caller: { id: usr_3, scope: tenant, tenantId: shop_1, permissions: [display:Product] }
      action: read
      subject: Product
      resource: { tenantId: shop_1, active: false }
      expect: allow

    - name: a guest cannot read an inactive locale
      caller: { id: null, scope: tenant, tenantId: shop_1, permissions: [read:Locale] }
      action: read
      subject: Locale
      resource: { tenantId: shop_1, active: false }
      expect: deny

    # =============================================================================================
    # The separated actions. This is what `write` could not express, and why it is not an action.
    # =============================================================================================

    - name: the support desk may update an account
      caller: { id: usr_4, scope: tenant, tenantId: shop_1, permissions: [read:User, update:User] }
      action: update
      subject: User
      resource: { tenantId: shop_1 }
      expect: allow

    - name: the support desk may not ban an account
      # `ban` split out of `update` so correcting a profile never locks a person out.
      caller: { id: usr_4, scope: tenant, tenantId: shop_1, permissions: [read:User, update:User] }
      action: ban
      subject: User
      resource: { tenantId: shop_1 }
      expect: deny

    - name: ban:User bans an account
      caller: { id: usr_9, scope: tenant, tenantId: shop_1, permissions: [read:User, ban:User] }
      action: ban
      subject: User
      resource: { tenantId: shop_1 }
      expect: allow

    - name: ban:User does not edit a profile
      caller: { id: usr_9, scope: tenant, tenantId: shop_1, permissions: [read:User, ban:User] }
      action: update
      subject: User
      resource: { tenantId: shop_1 }
      expect: deny

    - name: the support desk may not erase an account
      caller: { id: usr_4, scope: tenant, tenantId: shop_1, permissions: [read:User, update:User] }
      action: delete
      subject: User
      resource: { tenantId: shop_1 }
      expect: deny

    - name: the warehouse may record a stock movement
      caller: { id: usr_5, scope: tenant, tenantId: shop_1, permissions: [create:StockMovement] }
      action: create
      subject: StockMovement
      resource: { tenantId: shop_1 }
      expect: allow

    - name: the warehouse may read a draft product, so the stock form can list it
      caller: { id: usr_5, scope: tenant, tenantId: shop_1, permissions: [display:Product, read:StockLevel] }
      action: read
      subject: Product
      resource: { tenantId: shop_1, active: false }
      expect: allow

    - name: the warehouse may not delete a product
      caller:
          {
              id: usr_5,
              scope: tenant,
              tenantId: shop_1,
              permissions: [display:Product, read:StockLevel, create:StockMovement, update:Shipment]
          }
      action: delete
      subject: Product
      resource: { tenantId: shop_1, active: true }
      expect: deny

    - name: the warehouse may not change a price
      caller:
          {
              id: usr_5,
              scope: tenant,
              tenantId: shop_1,
              permissions: [display:Product, read:StockLevel, create:StockMovement, update:Shipment]
          }
      action: update
      subject: Product
      resource: { tenantId: shop_1, active: true }
      expect: deny

    - name: a customer may not advance a consignment
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: [read:Product] }
      action: update
      subject: Shipment
      resource: { tenantId: shop_1 }
      expect: deny

    - name: the warehouse may advance a consignment
      caller: { id: usr_5, scope: tenant, tenantId: shop_1, permissions: [update:Shipment] }
      action: update
      subject: Shipment
      resource: { tenantId: shop_1 }
      expect: allow

    # `start:Shipment` is narrower than `update:Order` on purpose: the warehouse can
    # begin fulfilment without being handed the run of the order record.
    - name: the warehouse may start fulfilling a paid order
      caller: { id: usr_5, scope: tenant, tenantId: shop_1, permissions: [start:Shipment] }
      action: start
      subject: Shipment
      resource: { tenantId: shop_1 }
      expect: allow

    - name: advancing a consignment does not also let the warehouse start fulfilment
      caller: { id: usr_5, scope: tenant, tenantId: shop_1, permissions: [update:Shipment] }
      action: start
      subject: Shipment
      resource: { tenantId: shop_1 }
      expect: deny

    # =============================================================================================
    # `read` is not a subset of anything else, and there is no rule for an action a subject never
    # declared — not even for a caller holding every OTHER rule that subject has.
    # =============================================================================================

    - name: read does not imply update
      caller: { id: usr_4, scope: tenant, tenantId: shop_1, permissions: [read:Feedback] }
      action: update
      subject: Feedback
      resource: { tenantId: shop_1 }
      expect: deny

    - name: there is no write rule, so update and delete are answered separately
      caller: { id: usr_4, scope: tenant, tenantId: shop_1, permissions: [read:Feedback, update:Feedback] }
      action: delete
      subject: Feedback
      resource: { tenantId: shop_1 }
      expect: deny

    - name: a payment cannot be deleted, because no rule grants it — not even holding every other payment rule
      caller: { id: usr_3, scope: tenant, tenantId: shop_1, permissions: [read:Payment, display:Payment, create:Payment, create:Refund] }
      action: delete
      subject: Payment
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: deny

    # =============================================================================================
    # Nothing is granted by default, and the audit trail is not writable by anyone.
    # =============================================================================================

    - name: a caller holding no rules at all is denied
      caller: { id: usr_6, scope: tenant, tenantId: shop_1, permissions: [] }
      action: read
      subject: Product
      resource: { tenantId: shop_1, active: true }
      expect: deny

    - name: an audit row cannot be updated, because no rule grants it — not even holding every audit rule
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: [read:AuditLog] }
      action: update
      subject: AuditLog
      resource: { tenantId: shop_1 }
      expect: deny

    - name: an audit row can be read by a holder of read:AuditLog
      caller: { id: usr_3, scope: tenant, tenantId: shop_1, permissions: [read:AuditLog] }
      action: read
      subject: AuditLog
      resource: { tenantId: shop_1 }
      expect: allow

    - name: an unknown subject is denied rather than defaulted, even for the most privileged caller
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: *admin_permissions }
      action: read
      subject: NoSuchThing
      resource: { tenantId: shop_1 }
      expect: deny

    # =============================================================================================
    # The editor. Everything the shop says and shows, in every registered language: the catalogue
    # record, the dictionary, and the words on a translatable entity — nothing about stock, an
    # order, or a person. Spelled out in full because there is no `manage` wildcard —
    # this is exactly `shared/authorization-roles.yaml`'s `editor` grant.
    # =============================================================================================

    - name: an editor may add a product
      caller:
          {
              id: usr_7,
              scope: tenant,
              tenantId: shop_1,
              permissions:
                  [
                      display:Product,
                      create:Product,
                      update:Product,
                      delete:Product,
                      display:Locale,
                      create:Locale,
                      update:Locale,
                      delete:Locale,
                      read:Translation,
                      update:Translation
                  ]
          }
      action: create
      subject: Product
      resource: { tenantId: shop_1 }
      expect: allow

    - name: an editor sees a draft the storefront does not
      caller:
          {
              id: usr_7,
              scope: tenant,
              tenantId: shop_1,
              permissions:
                  [
                      display:Product,
                      create:Product,
                      update:Product,
                      delete:Product,
                      display:Locale,
                      create:Locale,
                      update:Locale,
                      delete:Locale,
                      read:Translation,
                      update:Translation
                  ]
          }
      action: read
      subject: Product
      resource: { tenantId: shop_1, active: false }
      expect: allow

    - name: an editor may not read an order
      caller:
          {
              id: usr_7,
              scope: tenant,
              tenantId: shop_1,
              permissions:
                  [
                      display:Product,
                      create:Product,
                      update:Product,
                      delete:Product,
                      display:Locale,
                      create:Locale,
                      update:Locale,
                      delete:Locale,
                      read:Translation,
                      update:Translation
                  ]
          }
      action: read
      subject: Order
      resource: { tenantId: shop_1, userId: usr_1 }
      expect: deny

    - name: an editor may not read an account
      caller:
          {
              id: usr_7,
              scope: tenant,
              tenantId: shop_1,
              permissions:
                  [
                      display:Product,
                      create:Product,
                      update:Product,
                      delete:Product,
                      display:Locale,
                      create:Locale,
                      update:Locale,
                      delete:Locale,
                      read:Translation,
                      update:Translation
                  ]
          }
      action: read
      subject: User
      resource: { tenantId: shop_1 }
      expect: deny

    # =============================================================================================
    # The dictionary rules ON THEIR OWN — `Locale` and `Translation` without `Product`.
    #
    # No shipped role holds exactly this set: `translator` was folded into `editor`, which also
    # carries the product rules. The guarantees below are about the RULES rather than about anybody
    # who holds them, so they are what a deployment cutting a words-only role gets back, and they
    # are the reason such a role remains expressible at all.
    # =============================================================================================

    - name: create:Locale registers a language
      caller: { id: usr_8, scope: tenant, tenantId: shop_1, permissions: [create:Locale] }
      action: create
      subject: Locale
      resource: { tenantId: shop_1 }
      expect: allow

    - name: display:Locale reads a draft language nobody has published yet
      caller: { id: usr_8, scope: tenant, tenantId: shop_1, permissions: [display:Locale] }
      action: read
      subject: Locale
      resource: { tenantId: shop_1, active: false }
      expect: allow

    - name: create:Locale does not add a product
      caller: { id: usr_8, scope: tenant, tenantId: shop_1, permissions: [create:Locale] }
      action: create
      subject: Product
      resource: { tenantId: shop_1 }
      expect: deny

    - name: the dictionary rules do not update a price, even together
      caller:
          {
              id: usr_8,
              scope: tenant,
              tenantId: shop_1,
              permissions: [update:Locale, update:Translation]
          }
      action: update
      subject: Product
      resource: { tenantId: shop_1, active: true }
      expect: deny

    - name: read:Translation reads a product's translations
      caller: { id: usr_8, scope: tenant, tenantId: shop_1, permissions: [read:Translation] }
      action: read
      subject: Translation
      resource: { tenantId: shop_1 }
      expect: allow

    - name: an editor holding only the product rules may not read a translation
      caller:
          {
              id: usr_7,
              scope: tenant,
              tenantId: shop_1,
              permissions: [display:Product, create:Product, update:Product, delete:Product]
          }
      action: read
      subject: Translation
      resource: { tenantId: shop_1 }
      expect: deny

    # =============================================================================================
    # The moderator. Accounts, orders and payments — and the audit trail those three write to.
    # Spelled out in full for the same reason the editor's cases are: this is exactly
    # `shared/authorization-roles.yaml`'s `moderator` grant.
    # =============================================================================================

    - name: a moderator may ban an account
      caller:
          {
              id: usr_9,
              scope: tenant,
              tenantId: shop_1,
              permissions: *moderator_permissions
          }
      action: ban
      subject: User
      resource: { tenantId: shop_1 }
      expect: allow

    - name: a moderator may read any order, not only their own
      caller:
          {
              id: usr_9,
              scope: tenant,
              tenantId: shop_1,
              permissions: *moderator_permissions
          }
      action: read
      subject: Order
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: allow

    - name: a moderator may refund a payment
      caller:
          {
              id: usr_9,
              scope: tenant,
              tenantId: shop_1,
              permissions: *moderator_permissions
          }
      action: create
      subject: Refund
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: allow

    - name: a moderator may read the action history
      caller:
          {
              id: usr_9,
              scope: tenant,
              tenantId: shop_1,
              permissions: *moderator_permissions
          }
      action: read
      subject: AuditLog
      resource: { tenantId: shop_1 }
      expect: allow

    - name: a moderator may not change what a product costs
      caller:
          {
              id: usr_9,
              scope: tenant,
              tenantId: shop_1,
              permissions: *moderator_permissions
          }
      action: update
      subject: Product
      resource: { tenantId: shop_1, active: true }
      expect: deny

    # =============================================================================================
    # `locales` declares two families — `locales.*` and `translations.*` — sharing one module but
    # naming two different subjects. Nothing connects them: holding one grants nothing on the
    # other's subject. `inventory` is the same shape one level down — one family, two SUBJECTS
    # (`StockLevel`, `StockMovement`) — and holding the read on one grants nothing on the other.
    # =============================================================================================

    - name: update:Translation does not reach the dictionary it writes against
      caller: { id: usr_10, scope: tenant, tenantId: shop_1, permissions: [update:Translation] }
      action: delete
      subject: Locale
      resource: { tenantId: shop_1 }
      expect: deny

    - name: update:Locale does not reach an entity's translated words
      caller: { id: usr_11, scope: tenant, tenantId: shop_1, permissions: [update:Locale] }
      action: update
      subject: Translation
      resource: { tenantId: shop_1 }
      expect: deny

    - name: read:StockLevel does not grant recording a movement
      # `read:StockLevel` is about a StockLevel and `create:StockMovement` about a
      # StockMovement — one module, two subjects, and no rule reaches across.
      caller: { id: usr_12, scope: tenant, tenantId: shop_1, permissions: [read:StockLevel] }
      action: create
      subject: StockMovement
      resource: { tenantId: shop_1 }
      expect: deny

    - name: a credential reader may not mint one
      # The escalation this pair guards against: a caller holding only the family's read must not
      # pass a check for its write, however that check is spelled.
      caller: { id: usr_13, scope: tenant, tenantId: shop_1, permissions: [read:ApiKey] }
      action: create
      subject: ApiKey
      resource: { tenantId: shop_1 }
      expect: deny

    - name: a webhook reader may not delete a subscription
      caller: { id: usr_14, scope: tenant, tenantId: shop_1, permissions: [read:WebhookSubscription] }
      action: delete
      subject: WebhookSubscription
      resource: { tenantId: shop_1 }
      expect: deny

    # =============================================================================================
    # What a moderator does NOT do to an order, and who shops. Deleting or placing an order is shop
    # operations (manager and admin), not moderation; and staff and administrators own no basket.
    # =============================================================================================

    - name: a moderator may update an order
      caller: { id: usr_9, scope: tenant, tenantId: shop_1, permissions: *moderator_permissions }
      action: update
      subject: Order
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: allow

    - name: a moderator may not delete an order
      caller: { id: usr_9, scope: tenant, tenantId: shop_1, permissions: *moderator_permissions }
      action: delete
      subject: Order
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: deny

    - name: a moderator may not place an order on someone's behalf
      caller: { id: usr_9, scope: tenant, tenantId: shop_1, permissions: *moderator_permissions }
      action: create
      subject: Order
      resource: { tenantId: shop_1 }
      expect: deny

    - name: a customer may use a basket
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: [update:Cart, checkout:Cart] }
      action: update
      subject: Cart
      resource: { tenantId: shop_1 }
      expect: allow

    # Staff are customers too: the audience's rules are unioned with the role's, so what a staff
    # member holds on top is only the staff rules. The caller below is a verified manager.
    - name: an administrator may use a basket, every signed-in account being a customer first
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: *admin_permissions }
      action: update
      subject: Cart
      resource: { tenantId: shop_1 }
      expect: allow

    - name: an administrator may check out
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: *admin_permissions }
      action: checkout
      subject: Cart
      resource: { tenantId: shop_1 }
      expect: allow

    - name: a verified manager may check out, beside the staff rules the role adds
      caller: { id: usr_2, scope: tenant, tenantId: shop_1, permissions: [update:Cart, checkout:Cart, read:Order, display:Order] }
      action: checkout
      subject: Cart
      resource: { tenantId: shop_1 }
      expect: allow

    - name: an account whose address is unproven may use a basket but may not check out
      caller: { id: usr_3, scope: tenant, tenantId: shop_1, permissions: [update:Cart, read:Order] }
      action: checkout
      subject: Cart
      resource: { tenantId: shop_1 }
      expect: deny

    - name: a staff member holding both order rules reads their own order and a stranger's
      caller: { id: usr_2, scope: tenant, tenantId: shop_1, permissions: [read:Order, display:Order] }
      action: read
      subject: Order
      resource: { tenantId: shop_1, userId: usr_9 }
      expect: allow

    - name: a customer cannot change an account, the users rules not being in their audience
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: [update:Cart, checkout:Cart, read:Order, read:Payment] }
      action: update
      subject: User
      resource: { tenantId: shop_1 }
      expect: deny

    - name: only a role manager may assign a role
      caller: { id: usr_2, scope: tenant, tenantId: shop_1, permissions: *moderator_permissions }
      action: assign
      subject: Role
      resource: { tenantId: shop_1 }
      expect: deny

    - name: an administrator may assign a role
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: *admin_permissions }
      action: assign
      subject: Role
      resource: { tenantId: shop_1 }
      expect: allow

    # =============================================================================================
    # The staff actions. `display` is every row where `read` is the caller's own, `admin` is edit or
    # remove any row where `update` and `delete` are the caller's own. A route guard asks for the
    # staff action, so the rule every signed-in account holds can never open a staff door; a holder
    # of the staff action also passes the plain one, so one query serves both.
    # =============================================================================================

    - name: a customer's own-rows read does not open the staff display of orders
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: [read:Order] }
      action: display
      subject: Order
      resource: { tenantId: shop_1 }
      expect: deny

    - name: the staff display of orders also answers a plain read of a stranger's order
      caller: { id: usr_2, scope: tenant, tenantId: shop_1, permissions: [display:Order] }
      action: read
      subject: Order
      resource: { tenantId: shop_1, userId: usr_9 }
      expect: allow

    - name: the staff display of orders is not a write
      caller: { id: usr_2, scope: tenant, tenantId: shop_1, permissions: [display:Order] }
      action: update
      subject: Order
      resource: { tenantId: shop_1, userId: usr_9 }
      expect: deny

    - name: the staff admin of examples removes someone else's example
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: [admin:Example] }
      action: delete
      subject: Example
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: allow

    - name: the staff admin of examples does not read them
      caller: { id: usr_1, scope: tenant, tenantId: shop_1, permissions: [admin:Example] }
      action: read
      subject: Example
      resource: { tenantId: shop_1, userId: usr_2 }
      expect: deny
