# The 13 demo login accounts: who they are, what they may do, what state they start in.
# Ids, images, address books and the 10 filler customers stay in `scenarios/` code.
# Each password is public on purpose: the demo profile never reaches a database anyone but a
# developer or CI can see. `NODE_SEED_<NAME>_PASSWORD` overrides it per account.
# The paired frontend's Cypress suite reads each login from the scenario description (`GET
# /__test/scenario`), so it keeps no copy. The generated tables in `docs/tools/demo-profile.md`
# read this file.
#
# state:
#   verified          proved the address (no verify-your-email nag)
#   active            false = an admin switched it off, every login is refused
#   twoFactor         email 2FA armed, with five known single-use backup codes
#   authenticator     an authenticator app armed with `staffTotpSecret` (a staff role grants
#                     nothing without one)
#   pendingEmail      the address it asked to move to and has not confirmed, or null
#   analyticsConsent  opted in to analytics (the consent gate is opt-in)
#
# Every account's memberships name a role from `shared/authorization-roles.yaml`. A customer holds
# none: it is computed from `verified`, never granted.

# Base32, 160 bits. One secret for every authenticator: a demo fixture gains nothing from seven.
staffTotpSecret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP

accounts:
    admin:
        email: root@root.it
        username: root
        defaultPassword: Demo-Admin1!
        # The shop's owner AND the installation's operator: two jobs, two memberships.
        memberships:
            - { scope: tenant, role: admin }
            - { scope: platform, role: operator }
        state:
            {
                verified: true,
                active: true,
                twoFactor: false,
                authenticator: true,
                pendingEmail: null,
                analyticsConsent: false
            }
    user:
        email: customer@example.com
        username: customer
        defaultPassword: Demo-User1!
        memberships: []
        # Opted in: the cart analytics journey logs in as this account.
        state:
