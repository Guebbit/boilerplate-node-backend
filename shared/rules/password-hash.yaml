# argon2id cost for every new password hash. OWASP Password Storage Cheat Sheet, second argon2id
# profile: keeps a login under ~50 ms on ordinary hardware. A stored hash carries its own
# parameters, so verifying never depends on these values.
# https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html#argon2id
memoryKib: 19456 # m = 19 MiB
passes: 2 # t
parallelism: 1 # p; buys a defender nothing on a busy server
