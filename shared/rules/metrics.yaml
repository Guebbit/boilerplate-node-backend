# Name, kind, help, labels and buckets of every infrastructure metric. Dashboards and alert rules
# are written against the names, so they are data a twin copies; recording, `collect()` hooks and
# the registry stay code. A module's own metrics stay in its `metrics.ts`.
#
# Not read at boot. `npm run regenerate` writes
# `src/infrastructure/observability/metrics.generated.ts` from it.
#
# Each entry is keyed by the camelCase name of the constant the code uses. A counter's name ends
# in `_total`. Only a histogram has `buckets`, in the unit its name states.
metrics:
    httpRequestsTotal:
        name: http_requests_total
        kind: counter
        help: Total number of HTTP requests handled.
        labelNames: [method, route, status_code]
    httpRequestDuration:
        name: http_request_duration_milliseconds
        kind: histogram
        help: HTTP request duration in milliseconds.
        labelNames: [method, route]
        buckets: [5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000]
    httpRequestErrorsTotal:
        name: http_request_errors_total
        kind: counter
        help: Total number of HTTP requests that returned a 4xx or 5xx status.
        labelNames: [method, route, status_code]
    httpInflightRequests:
        name: http_requests_in_flight
        kind: gauge
        help: Number of HTTP requests currently in flight.
    cacheInvalidationFailuresTotal:
        name: cache_invalidation_failures_total
        kind: counter
        help: Cache invalidations that could not reach Redis, so stale responses survive their write.
        labelNames: [tag]
    cacheRequestsTotal:
        name: cache_requests_total
        kind: counter
        help: 'HTTP cache lookups by outcome: hit, miss, stale (served old), or refresh (rebuilding).'
        labelNames: [result]
    outboxEventsPublishedTotal:
        name: outbox_events_published_total
        kind: counter
        help: Outbox events dispatched to their consumers and marked published.
    outboxEventsRetriedTotal:
        name: outbox_events_retried_total
        kind: counter
        help: Outbox dispatch attempts that failed and were rescheduled with backoff.
    outboxEventsDeadTotal:
        name: outbox_events_dead_total
        kind: counter
        help: Outbox events parked as dead after exhausting every dispatch attempt.
    outboxPendingEvents:
        name: outbox_pending_events
        kind: gauge
        help: Outbox events written but not yet published (includes ones backing off).
    securityEventsTotal:
        name: security_events_total
        kind: counter
        help: Security events (forged or guessed credentials), labelled by audit action.
        labelNames: [event]
    staleCredentialsTotal:
        name: auth_stale_credentials_total
        kind: counter
        help: Expired or revoked credentials presented, labelled by kind and reason.
        labelNames: [kind, reason]
    databaseOperationDuration:
        name: db_client_operation_duration_seconds
        kind: histogram
        help: Duration of database commands in seconds, by collection, operation and outcome.
        labelNames: [collection, operation, outcome]
        buckets: [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5]
    queueJobsDeadLetteredTotal:
        name: queue_jobs_dead_lettered_total
        kind: counter
        help: Jobs parked in a dead-letter queue, by queue name.
        labelNames: [queue]
    rateLimitStoreFallbackTotal:
        name: rate_limit_store_fallback_total
        kind: counter
        help: Rate-limit store operations served without the limits Redis, so budgets are per process or open.
        labelNames: [namespace]
    rateLimitRefusalsTotal:
        name: rate_limit_refusals_total
        kind: counter
        help: Requests refused with 429 by a rate-limit budget.
        labelNames: [budget]
    processUnhandledRejectionsTotal:
        name: process_unhandled_rejections_total
        kind: counter
        help: Promise rejections that reached the process-level unhandledRejection handler.
    processUptimeSeconds:
        name: process_uptime_seconds
        kind: gauge
        help: Uptime of the Node.js process in seconds.
    nodejsHeapSizeLimitBytes:
        name: nodejs_heap_size_limit_bytes
        kind: gauge
        help: Maximum heap size V8 will allocate for this process, in bytes.
    jobLastSuccessTimestampSeconds:
        name: job_last_success_timestamp_seconds
        kind: gauge
        help: Unix time of each crontab job's last recorded success.
        # `task`, not `job`: the scrape adds its own `job="api"`, and a clashing label would be
        # renamed `exported_job`, which no rule would match.
        labelNames: [task]
    jobLastRunTimestampSeconds:
        name: job_last_run_timestamp_seconds
        kind: gauge
        help: Unix time of each crontab job's last recorded run, whether it succeeded or not.
        labelNames: [task]
