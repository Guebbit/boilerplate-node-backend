# The kernel's rate-limit budgets, as data: the browsing brake, the api-key brake and the upload
# brake. A module's own budgets sit in its `module.yaml` under `rateLimits:`, same fields.
#
# Not read at boot. `npm run regenerate` writes
# `src/infrastructure/http/middlewares/rate-limits.generated.ts` from it. Key generators, what
# counts as a success and what is skipped stay code (`rate-limit.ts`).
#
# Each entry is keyed by its `namespace` in camelCase. `windowMs` is milliseconds, or `shared` for
# `NODE_RATE_LIMIT_WINDOW_MS`; `onStoreError` absent means `memory`.
rateLimits:
    global:
        name: Browsing (global)
        namespace: global
        environmentVariable: NODE_RATE_LIMIT_MAX
        defaultMax: 100
        windowMs: shared
        bounds:
            Every request across the whole surface — a scanner sweeping for paths that do not exist is
            the traffic most worth braking, same as a browsing session. A request that carried a
            valid api-key is refunded once it ends and counts against that key instead, so partners
            sharing one exit address do not spend each other's allowance; a fake key does not earn
            the refund.
        audited: false
        # The one budget that lets a request through while the limits Redis is down: it guards
        # browsing, not a credential, and counting it per worker would only brake honest traffic.
        onStoreError: pass
    apiKey:
        name: Api-key requests
        namespace: api-key
        environmentVariable: NODE_API_KEY_RATE_LIMIT_MAX
        defaultMax: 120
        windowMs: shared
        bounds:
            'A request authenticated via an api-key — keyed on the CREDENTIAL, not the address: a
            partner behind one NAT is one caller, and ten partners behind one CDN are ten, which an
            address-keyed budget cannot tell apart.'
        audited: true
    uploads:
        name: Image uploads
        namespace: uploads
        environmentVariable: NODE_UPLOAD_RATE_LIMIT_MAX
        defaultMax: 20
        windowMs: shared
        bounds:
            Routes that accept an image upload. Image processing (the `worker.image.digest` pipeline) is
            CPU-bound, decoding and re-encoding real work whether it runs inline or in a worker
            consuming one job at a time — a burst of well-formed upload requests is a cheap way to
            saturate what the global brake alone was sized for ordinary browsing, not this.
        audited: true
