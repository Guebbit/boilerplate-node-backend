          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /wishlist/{productId}/move-to-cart:
    post:
      tags:
        - Wishlist
      summary: Move a saved product into the cart
      description: The wishlist's exit — the saved line becomes one cart line (quantity 1, incremented if the cart already holds the product) and leaves the wishlist. The cart is written before the wishlist line is removed, so a failure part-way leaves the product SAVED rather than lost. Returns the updated wishlist; read the cart for its own new state.
      operationId: moveWishlistItemToCart
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductIdPathParam'
      responses:
        '200':
          description: The updated wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders:
    get:
      tags:
        - Orders
      summary: List orders (paginated)
      description: |
        Returns a paginated list of orders.
        Non-admin users are automatically scoped to their own orders; the `userId` filter is ignored for non-admin callers.
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/UserIdParam'
        - $ref: '#/components/parameters/ProductIdParam'
        - name: email
          in: query
          schema:
            $ref: '#/components/schemas/Email'
      responses:
        '200':
          description: Orders page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Orders
      summary: Create order
      description: Creates a new order directly from the supplied payload.
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Orders
      summary: Update order
      description: Updates an existing order identified by id in the request body.
      operationId: updateOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Orders
      summary: Delete order
      description: Deletes the order identified by the `id` field in the request body. Set `hardDelete` to `true` to permanently remove the record
      operationId: deleteOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteOrderRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/search:
    post:
      tags:
        - Orders
      summary: Search orders (DTO-friendly)
      description: |
        Searches and filters orders via a JSON request body. Functionally equivalent to `GET /orders`.
        Non-admin users are automatically scoped to their own orders; the `userId` filter is ignored for non-admin callers.
      operationId: searchOrders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchOrdersRequest'
      responses:
        '200':
          description: Orders search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Order details
      description: Returns the full details of the order identified by `{id}`. Functionally equivalent to `GET /orders?id={id}`.
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Orders
      summary: Edit order
      description: Updates the order identified by `{id}` in the path.
      operationId: updateOrderById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderByIdRequest'
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Orders
      summary: Delete order
      description: Deletes the order identified by `{id}` in the path. Pass the `hardDelete` query parameter as `true` to permanently remove the record. Functionally equivalent to `DELETE /orders`.
      operationId: deleteOrderById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - name: hardDelete
          in: query
          schema:
            type: boolean
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardDeleteRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{id}/hard:
    delete:
      tags:
        - Orders
      summary: Permanently delete order
      description: Permanently removes the order identified by `{id}`, rather than soft-deleting it. Functionally equivalent to `DELETE /orders/{id}?hardDelete=true`.
      operationId: hardDeleteOrderById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{id}/cancel:
    post:
      tags:
        - Orders
      summary: Cancel order
      description: Cancels the order identified by `{id}` — the one order write a customer can make. A `pending` or `paid` order can be cancelled this way; cancelling a paid one refunds its payment. `processing` and later statuses each need their own flow (return), which an admin drives through `PUT /orders/{id}`. A non-admin can cancel only their own orders; an admin can cancel anyone's. The check and the write are one atomic statement, so a cancel racing a status change resolves to exactly one winner.
      operationId: cancelOrderById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: The cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{id}/invoice:
    get:
      tags:
        - Orders
      summary: Download order invoice (PDF)
      description: Generates and returns the invoice for the order identified by `{id}` as a binary PDF file. The client should save or stream the response with an appropriate `Content-Disposition` header.
      operationId: getOrderInvoice
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Invoice PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /payments/intent:
    post:
      tags:
        - Payments
      summary: Create a payment intent
      description: Freezes one of the caller's `pending` orders into a payment intent — the amount is taken from the order's own lines, so the intent cannot quote a different number than the order shows. Asking again refreshes the same intent (one payment per order is a database fact); an order whose money already moved answers 409. The intent is the thing the card dialog confirms.
      operationId: createPaymentIntent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
      responses:
        '201':
          description: The payment intent, ready to confirm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /payments/order/{orderId}:
    get:
      tags:
        - Payments
      summary: Get the payment behind an order
      description: The payment record for one of the caller's orders, so a reload mid-flow finds the intent and its status again. Admins read anyone's. No intent yet is a 404 — absence is an answer, the client starts the flow with `POST /payments/intent`.
      operationId: getPaymentByOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
          description: One of the caller's own orders
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /payments/{id}/confirm:
    post:
      tags:
        - Payments
      summary: Confirm a payment
      description: The card dialog's submit. The provider charges first (that is how PSPs work — the money moves before your database hears about it), then the order is moved `pending → paid` by a conditional write; if the order slipped away in between, the charge is refunded on the spot. A decline answers 409 with `errors[].code` `PAYMENT_DECLINED` and is retryable — submit the same payment again with another card. The fake provider declines exactly one number, documented on `ConfirmPaymentRequest.cardNumber`.
      operationId: confirmPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '200':
          description: The payment, `succeeded`; the order is `paid`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /delivery/methods:
    get:
      tags:
        - Delivery
      summary: List shipping methods
      description: The shipping methods this shop offers — flat rates and free-above thresholds. Public, because what shipping costs is pre-purchase information; the authoritative pricing still happens at checkout, against the lines actually bought, so a client showing these numbers cannot commit the shop to a stale rate.
      operationId: listShippingMethods
      security: []
      responses:
        '200':
          description: The methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingMethodsResponseEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /delivery/order/{orderId}:
    get:
      tags:
        - Delivery
      summary: Get the shipment behind an order
      description: The parcel for one of the caller's orders — tracking code and whether it has arrived. Ownership is the order's, read through the same scope every order read uses. No parcel yet (the order has not reached `shipped`) is a 404 — absence is the answer.
      operationId: getShipmentByOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
          description: One of the caller's own orders
      responses:
        '200':
          description: The shipment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /delivery/advance:
    post:
      tags:
        - Delivery
      summary: Advance the fake courier
      description: Every parcel currently `shipped` arrives — the order moves `shipped → delivered` through the same conditional write the rest of the status machine uses, then the shipment is stamped. Admin, and deliberately a button rather than a schedule — this repo has no cron, so an operator (or the demo) is the timer, exactly like the expired-token purge.
      operationId: advanceCourier
      security:
        - bearerAuth: []
      responses:
        '200':
          description: How many parcels arrived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourierAdvanceResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /inventory/movements:
    get:
      tags:
        - Inventory
      summary: List stock movements
      description: The ledger, newest first — every signed change to a shelf count with the why attached (order, cancel, adjustment, restock). Optionally one product's story via `productId`. Admin — customers see stock as a number on the product page.
      operationId: listStockMovements
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
          description: Narrow to one product's movements
      responses:
        '200':
          description: The latest movements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementsResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /inventory/restock:
    post:
      tags:
        - Inventory
      summary: Restock a product
      description: Puts units on a shelf through the same conditional increment every other movement uses, and writes the ledger row through the same announcement — so a restock and a sale tell the same kind of story. Answers the shelf count after the units landed.
      operationId: restockProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestockRequest'
      responses:
        '200':
          description: The shelf after the delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestockResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Page'
      description: 1-based page index
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PageSize'
    TextParam:
      name: text
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Text'
    IdParam:
      name: id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    UserIdParam:
      name: userId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    ProductIdParam:
      name: productId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    IdPathParam:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Resource identifier
    ProductIdPathParam:
      name: productId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Product identifier
  responses:
    Success:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Page:
      type: integer
      minimum: 1
      default: 1
      description: 1-based page index
    PageSize:
      type: integer
      default: 10
      minimum: 1
      maximum: 100
      description: Optional override; server may clamp to a max
    Id:
      type: string
      description: Resource identifier
    Text:
      type: string
      minLength: 1
      description: Free-text search string
    Email:
      type: string
      format: email
    Password:
      type: string
      minLength: 8
    Locale:
      type: string
      description: BCP 47 language tag, e.g. `en` or `it`. Which tags a deployment actually supports is a runtime fact, not a contract one — ask `GET /locales`.
      pattern: ^[a-z]{2}(-[A-Za-z0-9]+)*$
      example: it
    ImageUrl:
      type: string
      format: uri-reference
      description: 'Absolute URL or server-relative upload path (e.g. `/uploads/abc.jpg`). `uri-reference`, not `uri`: an uploaded image is stored and returned as a path relative to the API host, which is not a valid absolute URI.'
    PaginationMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          $ref: '#/components/schemas/Page'
        pageSize:
          $ref: '#/components/schemas/PageSize'
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    EnvelopeSuccess:
      type: boolean
      enum:
        - true
    EnvelopeStatus:
      type: integer
    EnvelopeMessage:
      type: string
    MessageResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
      properties:
        success:
          $ref: '#/components/schemas/EnvelopeSuccess'
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          $ref: '#/components/schemas/EnvelopeMessage'
    ErrorItem:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error detail
          example: Field "email" is required
        details:
          type: object
          additionalProperties: true
          description: Optional structured metadata for programmatic handling
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - errors
      properties:
        success:
          type: boolean
          enum:
            - false
        status:
          type: integer
        message:
          type: string
          description: Human-readable summary for this failure
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ErrorItem'
          description: Structured machine-friendly errors
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - errors
      properties:
        success:
          type: boolean
          enum:
            - false
        status:
          type: integer
        message:
          type: string
          description: Human-readable summary for this failure
          example: Validation failed
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ErrorItem'
          description: Structured machine-friendly errors
    UserEnvelope:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - data
      properties:
        success:
          $ref: '#/components/schemas/EnvelopeSuccess'
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          $ref: '#/components/schemas/EnvelopeMessage'
        data:
          $ref: '#/components/schemas/User'
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - username
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          $ref: '#/components/schemas/Email'
        username:
          type: string
        admin:
          type: boolean
        active:
          type: boolean
        verified:
          type: boolean
        imageUrl:
          $ref: '#/components/schemas/ImageUrl'
        locale:
          $ref: '#/components/schemas/Locale'
        createdAt:
          type: string
          format: date-time
