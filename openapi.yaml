          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{id}/invoice:
    get:
      tags:
        - Orders
      summary: Download order invoice (PDF)
      description: Generates and returns the invoice for the order identified by `{id}` as a binary PDF file. The client should save or stream the response with an appropriate `Content-Disposition` header.
      operationId: getOrderInvoice
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Invoice PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /payments/intent:
    post:
      tags:
        - Payments
      summary: Create a payment intent
      description: Freezes one of the caller's `pending` orders into a payment intent — the amount is taken from the order's own lines, so the intent cannot quote a different number than the order shows. Asking again refreshes the same intent (one payment per order is a database fact); an order whose money already moved answers 409. The intent is the thing the card dialog confirms.
      operationId: createPaymentIntent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
      responses:
        '201':
          description: The payment intent, ready to confirm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /payments/order/{orderId}:
    get:
      tags:
        - Payments
      summary: Get the payment behind an order
      description: The payment record for one of the caller's orders, so a reload mid-flow finds the intent and its status again. Admins read anyone's. No intent yet is a 404 — absence is an answer, the client starts the flow with `POST /payments/intent`.
      operationId: getPaymentByOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
          description: One of the caller's own orders
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /payments/order/{orderId}/refund:
    post:
      tags:
        - Payments
      summary: Refund an order's payment
      description: Returns the money without touching the order's status — the operator action for a goodwill refund, and the second half of "cancel and refund" when a client sends both. Admin only. The write is conditional on the payment still being `succeeded`, so a double submit refunds once and answers 409 the second time.
      operationId: refundPaymentByOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
          description: The order whose payment is being returned
      responses:
        '200':
          description: The payment, `refunded`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /payments/{id}/confirm:
    post:
      tags:
        - Payments
      summary: Confirm a payment
      description: The card dialog's submit. The provider charges first (that is how PSPs work — the money moves before your database hears about it), then the order is moved `pending → paid` by a conditional write; if the order slipped away in between, the charge is refunded on the spot. A decline answers 409 with `errors[].code` `PAYMENT_DECLINED` and is retryable — submit the same payment again with another card. The fake provider declines exactly one number, documented on `ConfirmPaymentRequest.cardNumber`.
      operationId: confirmPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '200':
          description: The payment, `succeeded`; the order is `paid`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /delivery/methods:
    get:
      tags:
        - Delivery
      summary: List shipping methods
      description: The shipping methods this shop offers — flat rates and free-above thresholds. Public, because what shipping costs is pre-purchase information; the authoritative pricing still happens at checkout, against the lines actually bought, so a client showing these numbers cannot commit the shop to a stale rate.
      operationId: listShippingMethods
      security: []
      responses:
        '200':
          description: The methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingMethodsResponseEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /delivery/order/{orderId}:
    get:
      tags:
        - Delivery
      summary: Get the shipment behind an order
      description: The parcel for one of the caller's orders — tracking code and whether it has arrived. Ownership is the order's, read through the same scope every order read uses. No parcel yet (the order has not reached `shipped`) is a 404 — absence is the answer.
      operationId: getShipmentByOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
          description: One of the caller's own orders
      responses:
        '200':
          description: The shipment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /delivery/advance:
    post:
      tags:
        - Delivery
      summary: Advance the fake courier
      description: Every parcel currently `shipped` arrives — the order moves `shipped → delivered` through the same conditional write the rest of the status machine uses, then the shipment is stamped. Admin, and deliberately a button rather than a schedule — this repo has no cron, so an operator (or the demo) is the timer, exactly like the expired-token purge.
      operationId: advanceCourier
      security:
        - bearerAuth: []
      responses:
        '200':
          description: How many parcels arrived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourierAdvanceResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /inventory/levels:
    get:
      tags:
        - Inventory
      summary: Stock levels
      description: The stock board — every product with its two counters and the availability derived from them. Admin; a customer sees `available` on the product itself. Answers the question a catalogue listing cannot, which is WHY something is unbuyable — nothing on the shelf, or everything on it already spoken for.
      operationId: listInventoryLevels
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: lowOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Only products at or under the low-availability threshold (`NODE_LOW_STOCK_THRESHOLD`).
      responses:
        '200':
          description: A page of levels, most scarce first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLevelsResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /inventory/movements:
    get:
      tags:
        - Inventory
      summary: List stock movements
      description: A page of the ledger, newest first — one row per counter change, with both deltas and the reason attached. Every row was written by the same call that moved the counter, so the ledger cannot have gaps. Paged rather than capped, and `meta.totalItems` counts everything matching the filters — this is the record an audit works through, and a read that returned only the newest rows would misreport history as complete.
      operationId: listStockMovements
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: productId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
          description: Narrow to one product's movements
        - name: reason
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StockMovementReason'
          description: Narrow to one kind of transition
      responses:
        '200':
          description: The latest movements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementsResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /inventory/receipts:
    post:
      tags:
        - Inventory
      summary: Receive stock
      description: Units arrive from a supplier — `onHand` rises, `reserved` does not, so the delivery becomes available immediately. The only transition that can create units, and the reason a shop that has sold out can sell again.
      operationId: receiveStock
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptRequest'
      responses:
        '200':
          description: The counters after the delivery landed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLevelEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /inventory/adjustments:
    post:
      tags:
        - Inventory
      summary: Adjust stock
      description: A stocktake correction — signed, because shrinkage is the common case and it is negative. Refuses to take `onHand` below what is already reserved, because those units are promised to orders that exist — the fix for finding fewer units than were sold is to cancel orders, not to make availability negative.
      operationId: adjustStock
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustmentRequest'
      responses:
        '200':
          description: The counters after the correction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLevelEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The correction would leave fewer units than are already reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /inventory/reservations/sweep:
    post:
      tags:
        - Inventory
      summary: Expire stale reservations
      description: |
        Releases every hold whose window has closed and announces each one, so the orders behind them get cancelled.

        A job behind an admin endpoint rather than an internal schedule. The application ships no scheduler, so the tick is driven from outside — a cron entry, the platform's scheduled job, or an operator — the same arrangement as `POST /delivery/advance`. Idempotent; running it twice releases nothing the first run already released.
      operationId: sweepReservations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: How many holds were expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationSweepEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Page'
      description: 1-based page index
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PageSize'
    TextParam:
      name: text
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Text'
    IdParam:
      name: id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    UserIdParam:
      name: userId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    ProductIdParam:
      name: productId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    HardDeleteParam:
      name: hardDelete
      in: query
      required: false
      schema:
        type: boolean
      description: Permanently remove the record instead of soft-deleting it.
    IdPathParam:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Resource identifier
    ProductIdPathParam:
      name: productId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Product identifier
    LocalePathParam:
      name: locale
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Locale'
      description: A language tag from `GET /locales`.
    MessagesTenantQueryParam:
      name: tenant
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/LocaleTenant'
      description: Which frontend tenant's dictionary to build. Omitted, the deployment's default frontend tenant — a client paired one-to-one with this API never needs to say.
    EntryTenantQueryParam:
      name: tenant
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/LocaleTenant'
      description: Restrict the listing to one tenant's dictionary. Omitted lists every tenant, which is what an admin screen wants before the operator has picked one.
    EntryIdPathParam:
      name: entryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Identifier of one translation entry.
  responses:
    Success:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Page:
      type: integer
      minimum: 1
      default: 1
      description: 1-based page index
    PageSize:
      type: integer
      default: 10
      minimum: 1
      maximum: 100
      description: Optional override; server may clamp to a max
    Id:
      type: string
      description: Resource identifier
    Text:
      type: string
      minLength: 1
      description: Free-text search string
    Email:
      type: string
      format: email
    Password:
      type: string
      minLength: 8
    Locale:
      type: string
      description: BCP 47 language tag, e.g. `en` or `it`. Which tags a deployment actually supports is a runtime fact, not a contract one — ask `GET /locales`.
      pattern: ^[a-z]{2}(-[A-Za-z0-9]+)*$
      example: it
    ImageUrl:
      type: string
      format: uri-reference
      description: 'Absolute URL or server-relative upload path (e.g. `/uploads/abc.jpg`). `uri-reference`, not `uri`: an uploaded image is stored and returned as a path relative to the API host, which is not a valid absolute URI.'
    PaginationMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          $ref: '#/components/schemas/Page'
        pageSize:
          $ref: '#/components/schemas/PageSize'
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    EnvelopeSuccess:
      type: boolean
      enum:
        - true
    EnvelopeStatus:
      type: integer
    EnvelopeMessage:
      type: string
    MessageResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
      properties:
        success:
          $ref: '#/components/schemas/EnvelopeSuccess'
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          $ref: '#/components/schemas/EnvelopeMessage'
    ErrorItem:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error detail
          example: Field "email" is required
        details:
          type: object
          additionalProperties: true
          description: Optional structured metadata for programmatic handling
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - errors
      properties:
        success:
          type: boolean
          enum:
            - false
        status:
          type: integer
        message:
          type: string
          description: Human-readable summary for this failure
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ErrorItem'
          description: Structured machine-friendly errors
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - errors
      properties:
        success:
          type: boolean
          enum:
            - false
        status:
          type: integer
        message:
          type: string
          description: Human-readable summary for this failure
          example: Validation failed
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ErrorItem'
          description: Structured machine-friendly errors
    UserEnvelope:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - data
      properties:
        success:
          $ref: '#/components/schemas/EnvelopeSuccess'
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          $ref: '#/components/schemas/EnvelopeMessage'
        data:
          $ref: '#/components/schemas/User'
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - username
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          $ref: '#/components/schemas/Email'
        username:
          type: string
        admin:
          type: boolean
        active:
          type: boolean
        verified:
          type: boolean
        imageUrl:
          $ref: '#/components/schemas/ImageUrl'
        locale:
          $ref: '#/components/schemas/Locale'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
    Product:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - price
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        price:
          type: number
          format: double
          minimum: 0
        onHand:
          type: integer
          minimum: 0
          readOnly: true
          description: Units physically present, whether or not they are spoken for.
        reserved:
          type: integer
          minimum: 0
          readOnly: true
          description: Units held by an open order — present, but not for sale.
        available:
          type: integer
          minimum: 0
          readOnly: true
          description: What a customer may actually buy. Derived from the two counters above.
        description:
          type: string
        active:
          type: boolean
        imageUrl:
          $ref: '#/components/schemas/ImageUrl'
        categories:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
    CartItem:
      type: object
      additionalProperties: false
      required:
        - productId
        - quantity
      properties:
        productId:
          $ref: '#/components/schemas/Id'
        quantity:
          type: integer
          minimum: 1
    OrderAddress:
      type: object
      additionalProperties: false
      required:
        - fullName
        - street
        - city
        - zip
        - country
      properties:
        fullName:
          type: string
        street:
          type: string
        city:
          type: string
        zip:
          type: string
        country:
          type: string
        phone:
          type: string
    OrderItem:
      type: object
      additionalProperties: false
      required:
        - product
        - quantity
      properties:
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          minimum: 1
    OrderStatus:
      type: string
      enum:
        - pending
        - paid
        - processing
        - shipped
        - delivered
        - cancelled
      description: Where an order is in its lifecycle. The set is closed here; which value may FOLLOW which is the server's `domain/lifecycle.ts`, answered per caller by `OrderActions`.
    OrderActions:
      type: object
      additionalProperties: false
      required:
        - transitions
        - cancel
        - pay
      description: 'What the requesting caller may do to this order, decided by the server. A client renders its controls from this rather than re-implementing the lifecycle: the rules depend on the caller''s role, and a second copy in a separately deployed client is how the two come to disagree.'
      properties:
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatus'
          description: The statuses this caller may move the order to. Empty on a terminal order, and never contains the order's current status.
          example:
            - processing
            - cancelled
        cancel:
          type: boolean
          description: Whether `POST /orders/{id}/cancel` would be accepted for this caller. A customer may cancel while unpaid or paid; an operator one step further.
        pay:
          type: boolean
          description: 'Whether this order is still awaiting payment — it can reach `paid`, which only a confirmed charge writes. Not in `transitions`, because no request may make that move: a client starts the flow with `POST /payments/intent` and the provider''s yes does the rest.'
    Order:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - email
        - items
        - totalItems
        - totalQuantity
        - totalPrice
        - status
      properties:
        id:
          $ref: '#/components/schemas/Id'
        userId:
          $ref: '#/components/schemas/Id'
        email:
          $ref: '#/components/schemas/Email'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totalItems:
          type: integer
          minimum: 0
          description: Number of distinct line items in this order. Not to be confused with `PaginationMeta.totalItems`, which counts orders matching a search.
          example: 2
        totalQuantity:
          type: integer
          minimum: 0
          description: Sum of `quantity` across every line item.
          example: 5
        totalPrice:
          type: number
          format: double
          minimum: 0
          description: Sum of `product.price × quantity` across every line item, plus `shippingCost` when the checkout chose a method.
          example: 149.97
        notes:
          type: string
          description: Optional order notes
        shippingMethod:
          type: string
          description: The shipping method's id as the checkout froze it (e.g. standard, express, pickup).
        shippingCost:
          type: number
          format: double
          minimum: 0
          description: What that method cost at checkout time — a later rate change cannot re-price history.
        shippingAddress:
          $ref: '#/components/schemas/OrderAddress'
        status:
          $ref: '#/components/schemas/OrderStatus'
        actions:
          $ref: '#/components/schemas/OrderActions'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
    HardDeleteRequest:
      type: object
      additionalProperties: false
      properties:
        hardDelete:
          type: boolean
          default: false
    HealthPing:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: Liveness indicator. Always `ok` when the process is answering.
    HealthPingEnvelope:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - data
      properties:
        success:
          $ref: '#/components/schemas/EnvelopeSuccess'
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          $ref: '#/components/schemas/EnvelopeMessage'
        data:
          $ref: '#/components/schemas/HealthPing'
    LocaleDirection:
      type: string
      enum:
        - ltr
        - rtl
      description: Writing direction, which a client needs before it can lay the language out. Trivial today because every deployed language is left-to-right; a column rather than a derivation because the day it is not, the alternative is a migration.
      example: ltr
    LocaleTenant:
      type: string
      pattern: ^[a-z0-9][a-z0-9-]*$
      minLength: 1
      maxLength: 64
      description: |
        The id of one tenant — one keyspace, authored by one team. Which ids exist is
        configuration, listed by `GET /locales/tenants`; a row naming an unknown tenant is
        refused with a 422.

        On a LANGUAGE it reports capability: the backend tenant means the API can answer
        requests in it, because a dictionary file is deployed; a frontend tenant means a
        client dictionary is downloadable for it.

        On an ENTRY it says whose dictionary that row OVERRIDES. A frontend tenant's rows
        are what `GET /locales/{locale}/messages` serves; the backend tenant's rows are
        layered over the API's own deployed files at resolution time.
      example: demo-fe
    LocaleSource:
      type: string
      enum:
        - static
        - dynamic
        - both
      description: Which tier a language came from — deployed files, the database, or both.
      example: both
    LocaleCapability:
      type: object
      additionalProperties: false
      required:
        - tag
        - name
        - nativeName
        - direction
        - active
        - tenants
        - source
        - entryCount
        - revision
      description: 'One language as the manifest describes it: a merge of whatever the two tiers each know about it. A tag present in both appears once, carrying both tenants.'
      properties:
        tag:
          $ref: '#/components/schemas/Locale'
        name:
          type: string
          example: Spanish
        nativeName:
          type: string
          example: Español
        direction:
          $ref: '#/components/schemas/LocaleDirection'
        active:
          type: boolean
        tenants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LocaleTenant'
          description: 'Which tenants have words in this language. Without it a client seeing `es` in the list cannot tell whether it may send `Accept-Language: es` and get Spanish error messages (the backend tenant), or whether it may download a Spanish UI dictionary (a frontend tenant). Those are different questions.'
        source:
          $ref: '#/components/schemas/LocaleSource'
        entryCount:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 0
    LocaleCapabilities:
      type: object
      additionalProperties: false
      required:
        - locales
        - default
        - fallback
      description: 'Which languages a deployment offers, and what each of them can do. Runtime state, not contract state: it is derived from the dictionaries actually deployed and the rows actually stored, so it cannot be an enum here.'
      properties:
        locales:
          type: array
          items:
            $ref: '#/components/schemas/LocaleCapability'
          description: Every language, ordered by tag so the response is stable.
        default:
          $ref: '#/components/schemas/Locale'
        fallback:
          $ref: '#/components/schemas/Locale'
    LocaleCapabilitiesEnvelope:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - data
      properties:
        success:
          $ref: '#/components/schemas/EnvelopeSuccess'
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          $ref: '#/components/schemas/EnvelopeMessage'
        data:
          $ref: '#/components/schemas/LocaleCapabilities'
    CreateLocaleRequest:
      type: object
      additionalProperties: false
      required:
        - tag
        - name
        - nativeName
      properties:
        tag:
          $ref: '#/components/schemas/Locale'
        name:
          type: string
          minLength: 1
        nativeName:
          type: string
          minLength: 1
        direction:
          $ref: '#/components/schemas/LocaleDirection'
        active:
          type: boolean
          default: true
    Language:
      type: object
      additionalProperties: false
      required:
        - id
        - tag
        - baseLanguage
        - name
        - nativeName
        - direction
        - active
        - revision
      description: A language registered in the DYNAMIC tier. Its existence means entries can be translated into it and a client can download the result — never that the API can answer a request in it, which is decided by a deployed file and nothing else.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        tag:
          $ref: '#/components/schemas/Locale'
        baseLanguage:
          type: string
          pattern: ^[a-z]{2}$
          description: |-
            The ISO 639-1 code at the front of `tag` — the BCP 47 PRIMARY SUBTAG, with any region or script dropped. `pt-BR` and `pt-PT` are two languages here and both answer `pt`.
            Derived from `tag` and never sent by a client: two fields that can disagree about the same fact are a bug waiting for the first person who edits one of them. Stored rather than computed on read because it is what groups the variants of a language, and a stored column can be queried and indexed while a split cannot.
          example: pt
        name:
          type: string
          description: English name, for an admin list.
          example: Spanish
        nativeName:
          type: string
          description: The language's own name, for a client's language picker.
          example: Español
        direction:
          $ref: '#/components/schemas/LocaleDirection'
        active:
          type: boolean
        revision:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LanguageEnvelope:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - data
      properties:
        success:
          $ref: '#/components/schemas/EnvelopeSuccess'
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          $ref: '#/components/schemas/EnvelopeMessage'
        data:
          $ref: '#/components/schemas/Language'
    LocaleTenantKind:
      type: string
      enum:
        - frontend
        - backend
      description: What a tenant is. `backend` is this API's own copy, applied internally and never served; `frontend` is a client's copy, downloadable per language.
      example: frontend
    LocaleTenantDescriptor:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - kind
      description: One tenant as the registry describes it.
      properties:
        id:
          $ref: '#/components/schemas/LocaleTenant'
        label:
          type: string
          description: A human name, for an admin screen.
          example: Demo frontend
        kind:
          $ref: '#/components/schemas/LocaleTenantKind'
    LocaleTenants:
      type: object
      additionalProperties: false
      required:
        - tenants
      properties:
        tenants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LocaleTenantDescriptor'
    LocaleTenantsEnvelope:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - data
      properties:
        success:
          $ref: '#/components/schemas/EnvelopeSuccess'
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          $ref: '#/components/schemas/EnvelopeMessage'
        data:
          $ref: '#/components/schemas/LocaleTenants'
    LocaleDictionary:
      type: object
      additionalProperties: false
      required:
        - locale
        - messages
      description: 'The API''s OWN message dictionary for one language — its API-response copy and nothing else. It is never a client''s UI dictionary: the two are authored and deployed in separate repositories, and mixing them would put view copy in the API''s keyspace. A client that wants these merges them under a namespace it reserves for the API, never at the root.'
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        messages:
          type: object
          additionalProperties: true
          description: Nested key/value dictionary, the same shape the API loads.
    LocaleDictionaryEnvelope:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - data
      properties:
        success:
          $ref: '#/components/schemas/EnvelopeSuccess'
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          $ref: '#/components/schemas/EnvelopeMessage'
        data:
          $ref: '#/components/schemas/LocaleDictionary'
    UpdateLocaleRequest:
      type: object
      additionalProperties: false
      description: 'Every field optional: an omitted one means "leave it alone", never "clear it". The tag is absent by design — see the operation description.'
      properties:
        name:
          type: string
          minLength: 1
        nativeName:
          type: string
          minLength: 1
        direction:
          $ref: '#/components/schemas/LocaleDirection'
        active:
          type: boolean
    LocaleMessages:
      type: object
      additionalProperties: false
      required:
        - locale
        - revision
        - messages
      description: The CLIENT's dictionary for one language, built from the stored entries. Same nested shape as `LocaleDictionary` on purpose — a client merges both with one code path rather than two — and a completely separate keyspace, because the two are authored by different people for different surfaces.
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        revision:
          type: integer
          minimum: 0
        messages:
          type: object
          additionalProperties: true
          description: 'Flat dotted keys expanded into a tree: `products.list.title` becomes `products.list.title`, nested. Empty for a language with no entries yet, which is a legitimate state and not a 404.'
    LocaleMessagesEnvelope:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - data
      properties:
        success:
          $ref: '#/components/schemas/EnvelopeSuccess'
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          $ref: '#/components/schemas/EnvelopeMessage'
        data:
          $ref: '#/components/schemas/LocaleMessages'
    LocaleEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - locale
        - tenant
        - key
        - value
      description: |-
        One translated string: one row per (language, tenant, key). That shape makes every operation this feature needs a single indexed query — add is an insert, edit is an update, a whole dictionary is one find — and adding a language touches nothing that already exists.
        `tenant` is part of the identity, not a label on it: two tenants may both declare a top-level `generic`, so `generic.error-internal` names one string in the API's copy and a different one in a client's. Without it in the key, one would overwrite the other.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        locale:
          $ref: '#/components/schemas/Locale'
        tenant:
          $ref: '#/components/schemas/LocaleTenant'
        key:
          type: string
          description: 'Flat and dotted. Stored AS A STRING and never as a Mongo path — a document per language with `$set: { "messages.products.list.title": v }` would have Mongo read three levels of nesting where one key was meant, which is a trap that bites once and then keeps biting.'
          example: products.list.title
        value:
          type: string
          example: Catálogo
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LocaleEntriesResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LocaleEntry'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    LocaleEntriesResponseEnvelope:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - data
      properties:
        success:
          $ref: '#/components/schemas/EnvelopeSuccess'
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          $ref: '#/components/schemas/EnvelopeMessage'
        data:
          $ref: '#/components/schemas/LocaleEntriesResponse'
    LocaleEntryInput:
      type: object
      additionalProperties: false
      required:
        - key
        - value
      description: |-
        One key and its translation, as an import or a create sends it.
        A key is refused when it is a strict prefix of an existing key in the same language, or has one as a prefix — `products.list` alongside `products.list.title`. No tree can hold both: one is a string, the other needs to be an object at the same path. A naive builder silently drops one of them, and which one depends on insertion order, so this is caught at WRITE time with a 409 naming both keys rather than discovered at read time by whoever is missing a string.
        A key that no dictionary defines is ACCEPTED. Entries add keys as well as override them, and for `app` rows this API could not check anyway — that keyspace belongs to the client and lives in another repository. So a typo saves cleanly and then renders nowhere: harmless, invisible, and yours to notice.
      properties:
        key:
          type: string
          minLength: 1
          example: products.list.title
        value:
          type: string
          example: Catálogo
    ReplaceLocaleEntriesRequest:
      type: object
      additionalProperties: false
      required:
        - tenant
        - entries
      description: |-
        The COMPLETE set of entries for this language IN ONE TENANT. Anything already stored under that tenant and not named here is deleted; the other tenants are untouched.
        The tenant is named once for the batch rather than per row, so a replace cannot half-apply across dictionaries — the operation that deletes what it was not sent has to know exactly what it is allowed to delete.
      properties:
        tenant:
          $ref: '#/components/schemas/LocaleTenant'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LocaleEntryInput'
    LocaleImportResult:
      type: object
      additionalProperties: false
      required:
        - created
        - updated
        - removed
        - revision
      description: What an import actually did, counted rather than implied. `removed` is always 0 for a merge, which is the assertion a client can make to prove it called the operation it meant to.
      properties:
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        removed:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 0
    LocaleImportResultEnvelope:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - data
      properties:
        success:
          $ref: '#/components/schemas/EnvelopeSuccess'
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          $ref: '#/components/schemas/EnvelopeMessage'
        data:
          $ref: '#/components/schemas/LocaleImportResult'
    CreateLocaleEntryRequest:
      type: object
      additionalProperties: false
      required:
        - tenant
        - key
        - value
      properties:
        tenant:
          $ref: '#/components/schemas/LocaleTenant'
        key:
          type: string
          minLength: 1
          example: products.list.title
        value:
          type: string
          example: Catálogo
    LocaleEntryEnvelope:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - data
      properties:
        success:
          $ref: '#/components/schemas/EnvelopeSuccess'
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          $ref: '#/components/schemas/EnvelopeMessage'
        data:
          $ref: '#/components/schemas/LocaleEntry'
    MergeLocaleEntriesRequest:
      type: object
      additionalProperties: false
      required:
        - tenant
        - entries
      description: Entries to upsert into ONE tenant. Anything already stored is left exactly as it was.
      properties:
        tenant:
          $ref: '#/components/schemas/LocaleTenant'
        entries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LocaleEntryInput'
    UpdateLocaleEntryRequest:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value:
          type: string
    DependencyStatus:
      type: string
      enum:
        - ready
        - connecting
        - unavailable
        - disabled
      description: |-
        One backing service's state, in the four words this payload uses for all of them.
        `disabled` means "not configured in this deployment" and is a supported state, not a failure — it never degrades `status`. `connecting` is separate from `unavailable` because the production HEALTHCHECK allows a 40-second start period, during which "not yet" and "broken" look identical on the wire and mean opposite things.
    ObservabilityDependency:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/DependencyStatus'
    ObservabilityHealthDependencies:
      type: object
      additionalProperties: false
      required:
        - database
        - cache
        - queue
      description: 'Every backing service this process needs, read from the connection state each adapter already maintains. No I/O: a health endpoint that opens sockets is polled every few seconds by every replica forever, and becomes an amplifier pointed at the infrastructure it reports on.'
      properties:
        database:
          $ref: '#/components/schemas/ObservabilityDependency'
        cache:
          $ref: '#/components/schemas/ObservabilityDependency'
        queue:
          $ref: '#/components/schemas/ObservabilityDependency'
    ObservabilityHealthTelemetry:
      type: object
      additionalProperties: false
      required:
        - loki
        - otel
        - umami
        - faro
        - analytics
      description: |-
        Which telemetry sinks this deployment is WIRED TO — read off the environment, never probed.
        Deliberately not part of `status`: these are destinations this service writes to, and losing one costs visibility rather than capability. An unreachable Loki does not make a checkout fail, so it must not colour the dot a dashboard shows for "can this instance serve traffic".
      properties:
        loki:
          type: boolean
        otel:
          type: boolean
        umami:
          type: boolean
        faro:
          type: boolean
        analytics:
          type: object
          additionalProperties: false
          required:
            - provider
            - configured
          properties:
            provider:
              type: string
              enum:
                - umami
                - posthog
                - none
            configured:
              type: boolean
              description: 'Whether the selected provider has the credentials it needs. `none` is always true: collecting nothing is its configuration.'
    ProcessMemory:
      type: object
      additionalProperties: false
      required:
        - rss
        - heapUsed
        - heapTotal
        - external
      description: |-
        Process memory in BYTES, exactly as `process.memoryUsage()` reports it, published identically by every payload that describes this process.
        Bytes rather than megabytes because the conversion is a presentation decision and a lossy one: a rounded megabyte cannot express the 400 KB move between two polls that a leak hunter is looking for. The same four fields, in the same units and the same order, are on the SSE payload in this module's `asyncapi.yaml`. The two documents cannot `$ref` each other, so `tests/cross-cutting/process-snapshot.test.ts` asserts they stay identical.
      properties:
        rss:
          type: integer
          minimum: 0
        heapUsed:
          type: integer
          minimum: 0
        heapTotal:
          type: integer
          minimum: 0
        external:
          type: integer
          minimum: 0
    ObservabilityHealthSystem:
      type: object
      additionalProperties: false
      required:
        - platform
        - cpuCount
        - loadAvg
      properties:
        platform:
          type: string
        cpuCount:
          type: integer
        loadAvg:
          type: array
          items:
            type: number
    ObservabilityHealth:
      type: object
      additionalProperties: false
      required:
        - status
        - environment
        - service
        - nodeVersion
        - uptimeSeconds
        - dependencies
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          description: |-
            READINESS: `ok` when every dependency is `ready` or `disabled`, `degraded` otherwise. Which part is missing is `dependencies`' job to say.
            This is not liveness. `GET /` answers that, and is what the container HEALTHCHECK probes — an orchestrator restarts on liveness, and restarting this process would not bring a downed Redis back.
        environment:
          type: string
        service:
          type: string
        nodeVersion:
          type: string
        uptimeSeconds:
          type: integer
          minimum: 0
        dependencies:
          $ref: '#/components/schemas/ObservabilityHealthDependencies'
        telemetry:
          $ref: '#/components/schemas/ObservabilityHealthTelemetry'
        memory:
          $ref: '#/components/schemas/ProcessMemory'
        system:
          $ref: '#/components/schemas/ObservabilityHealthSystem'
        timestamp:
          type: string
          format: date-time
    ObservabilityHealthResponseEnvelope:
      type: object
      additionalProperties: false
      required:
        - success
        - status
        - message
        - data
      properties:
        success:
          $ref: '#/components/schemas/EnvelopeSuccess'
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          $ref: '#/components/schemas/EnvelopeMessage'
        data:
          $ref: '#/components/schemas/ObservabilityHealth'
