                - name: tag
                  in: query
                  required: false
                  schema:
                      type: string
                - name: minPrice
                  in: query
                  required: false
                  schema:
                      type: number
                      format: double
                      minimum: 0
                - name: maxPrice
                  in: query
                  required: false
                  schema:
                      type: number
                      format: double
                      minimum: 0
            responses:
                '200':
                    description: Products page
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductsResponseEnvelope'
