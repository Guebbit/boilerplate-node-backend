                    $ref: '#/components/schemas/Email'

        UpdateFeedbackRequestStatusRequest:
            type: object
            additionalProperties: false
            properties:
                status:
                    type: string
                    enum: [new, in_progress, resolved, spam]
                adminNotes:
                    type: string

        # --------------- RESPONSES ---------------
        # ---------- Response DTOs — envelope items ----------
        UsersResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/User'
                meta:
                    $ref: '#/components/schemas/PaginationMeta'

        ProductsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Product'
                meta:
                    $ref: '#/components/schemas/PaginationMeta'

        OrdersResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Order'
                meta:
                    $ref: '#/components/schemas/PaginationMeta'

        FeedbackRequestsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/FeedbackRequest'
                meta:
                    $ref: '#/components/schemas/PaginationMeta'

        # ---------- Response DTOs — Cart ----------
        CartSummaryResponse:
            type: object
            additionalProperties: false
            required: [itemsCount, totalQuantity, total]
            properties:
                itemsCount:
                    type: integer
                    minimum: 0
                    description: Number of distinct cart lines/items
                totalQuantity:
                    type: integer
                    minimum: 0
                    description: Sum of quantities across all items
                total:
                    type: number
                    format: double
                    minimum: 0
                    description: Sum of item prices * quantity (before tax/shipping/discounts)
                currency:
                    type: string
                    description: ISO-4217 currency code (e.g. USD)

        CartResponse:
            type: object
            additionalProperties: false
            required: [items, summary]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/CartItem'
                summary:
                    $ref: '#/components/schemas/CartSummaryResponse'

        CheckoutResponse:
            type: object
            additionalProperties: false
            required: [order]
            properties:
                order:
                    $ref: '#/components/schemas/Order'
                message:
                    type: string

        # ---------- Observability ----------

        ObservabilityHealthIntegrations:
            type: object
            additionalProperties: false
            properties:
                loki: { type: boolean }
                posthog: { type: boolean }
                otelEnabled: { type: boolean }
                umami: { type: boolean }
                faro: { type: boolean }

        ObservabilityHealthMemory:
            type: object
            additionalProperties: false
            required: [heapUsedMb, heapTotalMb, rssMb]
            properties:
                heapUsedMb: { type: integer }
                heapTotalMb: { type: integer }
                rssMb: { type: integer }

        ObservabilityHealthSystem:
            type: object
            additionalProperties: false
            required: [platform, cpuCount, loadAvg]
            properties:
                platform: { type: string }
                cpuCount: { type: integer }
                loadAvg:
                    type: array
                    items: { type: number }

        ObservabilityHealth:
            type: object
            additionalProperties: false
            required:
                [status, environment, service, nodeVersion, uptimeSeconds, database, timestamp]
            properties:
                status:
                    type: string
                    enum: [ok, degraded]
                environment: { type: string }
                service: { type: string }
                nodeVersion: { type: string }
                uptimeSeconds: { type: integer, minimum: 0 }
                database:
                    type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                        status:
                            type: string
                            enum: [connected, connecting, disconnected]
                integrations: { $ref: '#/components/schemas/ObservabilityHealthIntegrations' }
                memory: { $ref: '#/components/schemas/ObservabilityHealthMemory' }
                system: { $ref: '#/components/schemas/ObservabilityHealthSystem' }
                timestamp: { type: string, format: date-time }

        ObservabilityHealthResponse:
            type: object
            additionalProperties: false
            required: [success, data]
            properties:
                success: { type: boolean, enum: [true] }
                data: { $ref: '#/components/schemas/ObservabilityHealth' }

        ObservabilityMetricsLatency:
            type: object
            additionalProperties: false
            required: [p50, p95]
            properties:
                p50: { type: number, description: Median latency in ms }
                p95: { type: number, description: 95th-percentile latency in ms }

        ObservabilityMetricsSummary:
            type: object
            additionalProperties: false
            required: [http, auth, business, database, process, timestamp]
            properties:
                http:
                    type: object
                    additionalProperties: false
                    required: [totalRequests, totalErrors, errorRate, inFlight, latencyMs]
                    properties:
                        totalRequests: { type: integer, minimum: 0 }
                        totalErrors: { type: integer, minimum: 0 }
                        errorRate:
                            type: number
                            minimum: 0
                            maximum: 1
                            description: Fraction of requests that returned 4xx/5xx
                        inFlight: { type: integer, minimum: 0 }
                        latencyMs: { $ref: '#/components/schemas/ObservabilityMetricsLatency' }
                auth:
                    type: object
                    additionalProperties: false
                    properties:
                        loginSuccess: { type: integer, minimum: 0 }
                        loginFailure: { type: integer, minimum: 0 }
                        signupSuccess: { type: integer, minimum: 0 }
                business:
                    type: object
                    additionalProperties: false
                    properties:
                        checkoutSuccess: { type: integer, minimum: 0 }
                        ordersCreated: { type: integer, minimum: 0 }
                database:
                    type: object
                    additionalProperties: false
                    properties:
                        queriesTotal: { type: integer, minimum: 0 }
                        errorsTotal: { type: integer, minimum: 0 }
                process:
                    type: object
                    additionalProperties: false
                    properties:
                        uptimeSeconds: { type: integer, minimum: 0 }
                        heapUsedMb: { type: integer, minimum: 0 }
                timestamp: { type: string, format: date-time }

        ObservabilityMetricsSummaryResponse:
            type: object
            additionalProperties: false
            required: [success, data]
            properties:
                success: { type: boolean, enum: [true] }
                data: { $ref: '#/components/schemas/ObservabilityMetricsSummary' }

        AuditEventItem:
            type: object
            additionalProperties: false
            required: [actor_user_id, actor_role, action, outcome, timestamp, level]
            properties:
                actor_user_id: { type: string }
                actor_role:
                    type: string
                    enum: [admin, user, anonymous]
                action:
                    {
                        type: string,
                        description: 'Dot-notation action name (e.g. auth.login.succeeded)'
                    }
                outcome:
                    type: string
                    enum: [success, failure]
                ip: { type: string }
                user_agent: { type: string }
                request_id: { type: string }
                trace_id: { type: string }
                target_type: { type: string }
                target_id: { type: string }
                metadata:
                    type: object
                    additionalProperties: true
                timestamp: { type: string, format: date-time }
                level:
                    type: string
                    enum: [info, warn]

        AuditLogsResponse:
            type: object
            additionalProperties: false
            required: [success, data]
            properties:
                success: { type: boolean, enum: [true] }
                data:
                    type: object
                    additionalProperties: false
                    required: [items, total]
                    properties:
                        items:
                            type: array
                            items: { $ref: '#/components/schemas/AuditEventItem' }
                        total: { type: integer, minimum: 0 }

paths:
    # --------- System ---------
    /:
        get:
            tags: [System]
            summary: API health check
            description: Public ping endpoint. Returns a simple liveness indicator confirming the API process is running.
            operationId: getHealth
            responses:
                '200':
                    description: API is running
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthPingEnvelope'

    # --------- Locales ---------
    /locales:
        get:
            tags: [System]
            summary: Supported languages
            description: |
                Which languages this deployment can answer in, plus its default and fallback.

                Public, unauthenticated and cacheable: it is static copy that changes only on
                deploy, and a client that has just failed to reach the API is exactly who needs
                it.
            operationId: getLocales
            responses:
                '200':
                    description: Locale capabilities
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LocaleCapabilitiesEnvelope'
                '500': { $ref: '#/components/responses/InternalError' }

    /locales/{locale}:
        get:
            tags: [System]
            summary: API message dictionary
            description: |
                This API's own dictionary for one language.

                Normally unnecessary — the API resolves its keys itself and puts finished text on
                the wire. It earns its place when no response arrives at all (a network failure, a
                bare 502) and the client must produce the copy itself, in the active language.
            operationId: getLocaleDictionary
            parameters:
                - name: locale
                  in: path
                  required: true
                  schema:
                      $ref: '#/components/schemas/Locale'
                  description: A language tag from `GET /locales`.
            responses:
                '200':
                    description: Dictionary for the requested locale
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LocaleDictionaryEnvelope'
                '404': { $ref: '#/components/responses/NotFound' }
                '500': { $ref: '#/components/responses/InternalError' }

    # --------- Observability ---------
    /observability/events:
        get:
            tags: [Observability]
            summary: Observability SSE stream
            description: |
                Live Server-Sent Events stream for demo dashboards.
                Sends `metrics.snapshot` on connect, followed by periodic `metrics.updated` and `heartbeat` events.
            operationId: getObservabilityEvents
            responses:
                '200':
                    description: Server-Sent Events stream
                    content:
                        text/event-stream:
                            schema:
                                type: string

    /observability/health:
        get:
            tags: [Observability]
            summary: Health snapshot
            description: |
                Full JSON health snapshot for dashboard use.
                Includes uptime, database status, memory, integrations, and system info.
                Requires admin role.
            operationId: getObservabilityHealth
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Health summary
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ObservabilityHealthResponseEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '500': { $ref: '#/components/responses/InternalError' }

    /observability/metrics:
        get:
            tags: [Observability]
            summary: Prometheus metrics
            description: |
                Raw Prometheus text (exposition format 0.0.4).
                Intended for Prometheus scraping, not for browser clients.
                Use `GET /observability/metrics/overview` for a JSON summary suitable for dashboards.
            operationId: getObservabilityMetrics
            responses:
                '200':
                    description: Prometheus exposition text
                    content:
                        text/plain:
                            schema:
                                type: string

    /observability/metrics/overview:
        get:
            tags: [Observability]
            summary: Metrics overview (JSON)
            description: |
                Key operational metrics derived from Prometheus counters/histograms,
                returned as structured JSON for dashboard KPI cards and charts.
                Requires admin role.
            operationId: getObservabilityMetricsOverview
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Metrics overview
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ObservabilityMetricsSummaryResponseEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '500': { $ref: '#/components/responses/InternalError' }

    /observability/audit:
        get:
            tags: [Observability]
            summary: Recent audit events
            description: |
                Returns the most recent audit events, newest first, from the persisted audit trail.
                Events include auth flows, admin CRUD actions, and security blocks.
                Entries are retained for `NODE_AUDIT_RETENTION_DAYS` (default 90) and expire after.
                `total` counts every event matching the filters, not just the returned page.
                Requires admin role.
            operationId: getObservabilityAuditLogs
            security:
                - bearerAuth: []
            parameters:
                - name: actor
                  in: query
                  schema: { type: string }
                  description: Filter by actor user ID
                - name: action
                  in: query
                  schema: { type: string }
                  description: 'Filter by action name (e.g. auth.login.failed)'
                - name: outcome
                  in: query
                  schema:
                      type: string
                      enum: [success, failure]
                  description: Filter by outcome
                - name: since
                  in: query
                  schema:
                      type: string
                      format: date-time
                  description: Return events after this ISO-8601 timestamp
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 200
                      default: 50
                  description: Maximum number of events to return
            responses:
                '200':
                    description: Audit events
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditLogsResponseEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    # --------- Authentication and profile ---------
    /account:
        get:
            tags: [Account]
            summary: Current user info
            description: Returns the full profile of the currently authenticated user
            operationId: getAccount
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Current user info
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
        delete:
            tags: [Account]
            summary: Request account deletion
            description: Initiates the account-deletion flow for the authenticated user. A one-time confirmation token is sent to the user's email address. The token must then be submitted to `/account/delete-confirm` to complete the deletion.
            operationId: requestAccountDelete
            security:
                - bearerAuth: []
            responses:
                '200': { $ref: '#/components/responses/Success' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '500': { $ref: '#/components/responses/InternalError' }

    /account/delete-confirm:
        delete:
            tags: [Account]
            summary: Confirm account deletion
            description: Completes the account-deletion flow. Validates the one-time token issued by `DELETE /account` and, if valid, permanently removes the user account.
            operationId: confirmAccountDelete
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountDeleteConfirmRequest'
            responses:
                '200': { $ref: '#/components/responses/Success' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    /account/login:
        post:
            tags: [Auth]
            summary: Login
            description: Authenticates a user with email and password credentials. On success, returns a JWT access token that must be passed as a Bearer token on subsequent authenticated requests.
            operationId: login
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                '200':
                    description: Auth tokens
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthTokensEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    /account/signup:
        post:
            tags: [Auth]
            summary: Signup
            description: Registers a new user account with optional image upload. Returns the newly created user profile on success.
            operationId: signup
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SignupRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/SignupRequestMultipart'
            responses:
                '201':
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserEnvelope'
                # Signing up with an email that is already registered.
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    /account/reset:
        post:
            tags: [Auth]
            operationId: requestPasswordReset
            description: Initiates the password-reset flow by sending a one-time reset token to the provided email address. The token should then be submitted to `/account/reset-confirm`.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasswordResetRequest'
            responses:
                '200': { $ref: '#/components/responses/Success' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    /account/reset-confirm:
        post:
            tags: [Auth]
            operationId: confirmPasswordReset
            description: Completes the password-reset flow. Validates the one-time reset token issued by `/account/reset` and, if valid, updates the user's password to the supplied value.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasswordResetConfirmRequest'
            responses:
                '200': { $ref: '#/components/responses/Success' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    /account/refresh:
        get:
            tags: [Auth]
            summary: Refresh access token
            description: Creates a new short-lived access token from the refresh token in the `jwt` cookie. The cookie is `HttpOnly`, so the token is never readable by page scripts and never appears in a URL, a proxy log or a `Referer` header.
            operationId: refreshToken
            security: []
            responses:
                '200':
                    description: New access token
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RefreshTokenEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '500': { $ref: '#/components/responses/InternalError' }

    /account/logout-all:
        post:
            tags: [Auth]
            summary: Logout from all devices
            description: Logs out the authenticated user from ALL devices by removing all refresh tokens from the database and clearing authentication cookies.
            operationId: logoutAll
            security:
                - bearerAuth: []
            responses:
                '200': { $ref: '#/components/responses/Success' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '500': { $ref: '#/components/responses/InternalError' }

    /account/tokens/expired:
        delete:
            tags: [Auth]
            summary: Remove expired tokens
            description: Removes all expired tokens (refresh, password-reset, etc.) from every user record in the database. Restricted to administrators.
            operationId: deleteExpiredTokens
            security:
                - bearerAuth: []
            responses:
                '200': { $ref: '#/components/responses/Success' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '500': { $ref: '#/components/responses/InternalError' }

    # --------- Users ---------
    /users:
        get:
            tags: [Users]
            summary: List users (paginated)
            description: Returns a paginated list of user accounts.
            operationId: listUsers
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/PageParam'
                - $ref: '#/components/parameters/PageSizeParam'
                - $ref: '#/components/parameters/TextParam'
                - $ref: '#/components/parameters/IdParam'
                - name: email
                  in: query
                  schema:
                      $ref: '#/components/schemas/Email'
                - name: username
                  in: query
                  schema:
                      type: string
                - name: active
                  in: query
                  schema:
                      type: boolean
            responses:
                '200':
                    description: Users list page
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UsersResponseEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }
        post:
            tags: [Users]
            summary: Create user
            description: Creates a new user account with the supplied email, username, and password. Optional image can be uploaded.
            operationId: createUser
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUserRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/CreateUserRequestMultipart'
            responses:
                '201':
                    description: Created user
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }
        put:
            tags: [Users]
            summary: Edit user
            description: Updates an existing user's email or password. Optional image can be uploaded.
            operationId: updateUser
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateUserRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/UpdateUserRequestMultipart'
            responses:
                '200':
                    description: Updated user
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }
        delete:
            tags: [Users]
            summary: Delete user
            description: Deletes the user identified by the `id` field in the request body. Set `hardDelete` to `true` to permanently remove the record.
            operationId: deleteUser
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeleteUserRequest'
            responses:
                '200': { $ref: '#/components/responses/Success' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    /users/{id}:
        # Same as GET /users?id={id}
        get:
            tags: [Users]
            summary: User details
            description: Returns the full profile of the user identified by `{id}`. Functionally equivalent to `GET /users?id={id}`.
            operationId: getUserById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: User
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '500': { $ref: '#/components/responses/InternalError' }
        put:
            tags: [Users]
            summary: Edit user
            description: Updates the email or password of the user identified by `{id}` in the path. Optional image can be uploaded.
            operationId: updateUserById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateUserByIdRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/UpdateUserByIdRequestMultipart'
            responses:
                '200':
                    description: Updated user
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '404': { $ref: '#/components/responses/NotFound' }
                '500': { $ref: '#/components/responses/InternalError' }
        # Same as DELETE /users
        delete:
            tags: [Users]
            summary: Delete user
            description: Deletes the user identified by `{id}` in the path. Pass the `hardDelete` query parameter as `true` to permanently remove the record. Functionally equivalent to `DELETE /users`.
            operationId: deleteUserById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/IdPathParam'
                - name: hardDelete
                  in: query
                  schema:
                      type: boolean
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/HardDeleteRequest'
            responses:
                '200': { $ref: '#/components/responses/Success' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    # Same as DELETE /users/{id}?hardDelete=true — the flag spelled in the path instead of
    # in the query. Both reach the same handler; neither is the canonical one.
    /users/{id}/hard:
        delete:
            tags: [Users]
            summary: Permanently delete user
            description: Permanently removes the user identified by `{id}`, rather than soft-deleting it. Functionally equivalent to `DELETE /users/{id}?hardDelete=true`.
            operationId: hardDeleteUserById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/IdPathParam'
            responses:
                '200': { $ref: '#/components/responses/Success' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    # Same as GET /users, but with JSON body, more suitable for DTOs and multi-language codegen
    /users/search:
        post:
            tags: [Users]
            summary: Search users (DTO-friendly)
            description: Searches and filters users via a JSON request body. Functionally equivalent to `GET /users` with query parameters
            operationId: searchUsers
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchUsersRequest'
            responses:
                '200':
                    description: Users search results
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UsersResponseEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    /feedback/contact:
        post:
            tags: [Feedback]
            summary: Submit contact request
            description: Creates a user feedback/contact request and notifies admins via email.
            operationId: createFeedbackRequest
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateFeedbackRequest'
            responses:
                '201':
                    description: Created feedback request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedbackRequestEnvelope'
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    /feedback:
        get:
            tags: [Feedback]
            summary: List feedback requests
            description: Returns feedback/contact requests for admin review.
            operationId: listFeedbackRequests
            security:
                - bearerAuth: []
            # The controller merges query and body, so every filter below is reachable either way.
            # The body stays declared because it is read; unlike the other three resources this
            # one has no `POST /feedback/search` sibling to carry the DTO form.
            parameters:
                - $ref: '#/components/parameters/PageParam'
                - $ref: '#/components/parameters/PageSizeParam'
                - $ref: '#/components/parameters/TextParam'
                - name: email
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/Email'
                - name: status
                  in: query
                  required: false
                  schema:
                      type: string
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchFeedbackRequestsRequest'
            responses:
                '200':
                    description: Feedback request list
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedbackRequestsResponseEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    /feedback/{id}:
