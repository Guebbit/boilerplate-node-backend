            properties:
                id:
                    $ref: '#/components/schemas/Id'

        CreateFeedbackRequest:
            type: object
            additionalProperties: false
            required: [email, subject, message]
            properties:
                name:
                    type: string
                email:
                    $ref: '#/components/schemas/Email'
                subject:
                    type: string
                message:
                    type: string

        SearchFeedbackRequestsRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    $ref: '#/components/schemas/Page'
