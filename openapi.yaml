    StockMovementReason:
      type: string
      enum:
        - reserve
        - commit
        - release
        - expire
        - receive
        - adjust
      description: |
        * `reserve` — an order claimed units. `reserved` up, `onHand` unchanged.
        * `commit` — the order was paid for and the units left. Both down.
        * `release` — the hold was given up (the order was cancelled). `reserved` down.
        * `expire` — the hold timed out unpaid. Same counters as `release`, different story.
        * `receive` — a supplier delivery. `onHand` up.
        * `adjust` — a stocktake correction, signed. `onHand` moves either way.
    StockMovement:
      type: object
      additionalProperties: false
      required:
        - id
        - productId
        - reason
        - onHandDelta
        - reservedDelta
      properties:
        id:
          $ref: '#/components/schemas/Id'
        productId:
          $ref: '#/components/schemas/Id'
        reason:
          $ref: '#/components/schemas/StockMovementReason'
        onHandDelta:
          type: integer
        reservedDelta:
          type: integer
        reference:
          type: string
          description: The order the movement belongs to, when one does.
        note:
          type: string
          description: Why an adjustment was made — the operator's own words.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StockMovementsResponse:
      type: object
      additionalProperties: false
      required:
