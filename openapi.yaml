            parameters:
                - $ref: '#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateFeedbackRequestStatusRequest'
            responses:
                '200':
                    description: Updated feedback request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedbackRequestEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    # ----- Products -----

    /products:
