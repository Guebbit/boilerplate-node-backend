          type: integer
          minimum: 0
          description: Number of distinct line items in this order. Not to be confused with `PaginationMeta.totalItems`, which counts orders matching a search.
          example: 2
        totalQuantity:
          type: integer
          minimum: 0
          description: Sum of `quantity` across every line item.
          example: 5
        totalPrice:
          type: number
          format: double
          minimum: 0
          description: Sum of `product.price × quantity` across every line item, plus `shippingCost` when the checkout chose a method.
