      properties:
        cardNumber:
          type: string
          minLength: 12
          maxLength: 23
          pattern: ^[\d ]+$
          description: The card number, digits and optional spaces. The fake provider declines `4000000000000002` and accepts everything else; `4242424242424242` is the conventional success card.
    ShippingMethod:
      type: object
      additionalProperties: false
      required:
