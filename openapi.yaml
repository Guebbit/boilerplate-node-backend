    CancelOrderRequest:
      type: object
      additionalProperties: false
      description: The operator's choice of whether the money goes back with the cancellation. Ignored for a customer, who is always refunded. Omit the body entirely for the default.
      properties:
        refund:
          type: boolean
          default: true
          description: '`false` cancels and releases the stock without returning the money — a replacement going out, a correction, or a refund handled separately through `POST /payments/order/{orderId}/refund`.'
    CreatePaymentIntentRequest:
      type: object
      additionalProperties: false
      required:
        - orderId
      properties:
        orderId:
          $ref: '#/components/schemas/Id'
    PaymentActions:
      type: object
      additionalProperties: false
      required:
        - pay
        - refund
      description: What the requesting caller may do to this payment. Money is this module's to answer for; the order's own moves are on `Order.actions`, and a client that needs both composes them rather than deciding either for itself.
      properties:
        pay:
          type: boolean
          description: Whether `POST /payments/{id}/confirm` would be accepted — the payment is awaiting confirmation or retryable after a decline, AND the order can still reach `paid`.
        refund:
          type: boolean
          description: Whether `POST /payments/order/{orderId}/refund` would be accepted. False once refunded, which is what greys the control out rather than letting the operator discover it by clicking.
    Payment:
      type: object
      additionalProperties: false
      required:
        - id
        - orderId
        - userId
        - amount
        - currency
        - status
        - provider
      properties:
        id:
          $ref: '#/components/schemas/Id'
        orderId:
          $ref: '#/components/schemas/Id'
        userId:
          $ref: '#/components/schemas/Id'
        amount:
          type: number
          format: double
          minimum: 0
          description: The order's total as the intent froze it.
        currency:
          type: string
          description: ISO-4217 currency code (e.g. EUR)
        status:
          type: string
          enum:
            - requires_confirmation
            - succeeded
            - declined
            - refunded
          description: The provider-facing lifecycle. `declined` is retryable — the confirm endpoint accepts the same payment again; `refunded` is terminal.
        provider:
          type: string
          description: Which provider implementation handled it (`fake` in the demo).
        cardLast4:
          type: string
          description: The only card digits a payment system may remember.
        actions:
          $ref: '#/components/schemas/PaymentActions'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaymentEnvelope:
