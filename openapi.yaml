          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /observability/events:
    get:
      tags:
        - Observability
      summary: Observability SSE stream
      description: |
        Live Server-Sent Events stream for demo dashboards.
        Sends `metrics.snapshot` on connect, followed by periodic `metrics.updated` and `heartbeat` events.
      operationId: getObservabilityEvents
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /observability/health:
    get:
      tags:
        - Observability
      summary: Health snapshot
      description: |
        Readiness snapshot: whether this instance can serve what it promises, and which
        backing service is missing when it cannot. Also carries uptime, memory, system and
        telemetry-wiring detail for the dashboard card.

        This is NOT the liveness probe — `GET /` is, and it is what the container
        HEALTHCHECK calls. Nothing here performs I/O; every dependency is read from the
        connection state its adapter already maintains.

        Requires admin role.
      operationId: getObservabilityHealth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Health summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservabilityHealthResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /observability/metrics:
    get:
      tags:
        - Observability
      summary: Prometheus metrics
      description: |
        Raw Prometheus text (exposition format 0.0.4).
        Intended for Prometheus scraping, not for browser clients.
        Use `GET /observability/metrics/overview` for a JSON summary suitable for dashboards.
      operationId: getObservabilityMetrics
      responses:
        '200':
          description: Prometheus exposition text
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: |
            `NODE_METRICS_TOKEN` is not configured. The endpoint denies by default
            rather than opening: an unauthenticated metrics endpoint is not a state
            to arrive at by forgetting an environment variable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /observability/metrics/overview:
    get:
      tags:
        - Observability
      summary: Metrics overview (JSON)
      description: |
        Key operational metrics derived from Prometheus counters/histograms,
        returned as structured JSON for dashboard KPI cards and charts.
        Requires admin role.
      operationId: getObservabilityMetricsOverview
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metrics overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservabilityMetricsSummaryResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /observability/audit:
    get:
      tags:
        - Observability
      summary: Recent audit events
      description: |
        Returns the most recent audit events, newest first, from the persisted audit trail.
        Events include auth flows, admin CRUD actions, and security blocks.
        Entries are retained for `NODE_AUDIT_RETENTION_DAYS` (default 90) and expire after.
        `meta.totalItems` counts every event matching the filters, not just the returned page.
        Requires admin role.
      operationId: getObservabilityAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: actor
          in: query
          schema:
            type: string
          description: Filter by actor user ID
        - name: action
          in: query
          schema:
            type: string
          description: Filter by action name (e.g. auth.login.failed)
        - name: outcome
          in: query
          schema:
            type: string
            enum:
              - success
              - failure
          description: Filter by outcome
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Return events strictly after this ISO-8601 timestamp — an exclusive bound
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogsResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /account:
    get:
      tags:
        - Account
      summary: Current user info
      description: Returns the full profile of the currently authenticated user
      operationId: getAccount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Account
      summary: Update own profile
      description: Updates the authenticated user's own profile — email, username, locale, image. Role, account state and password are out of scope — the first two belong to the admin `/users` endpoints, the password to `POST /account/password`. Changing the email resets `verified` and sends a fresh verification email to the new address.
      operationId: updateAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequestMultipart'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Account
      summary: Request account deletion
      description: Initiates the account-deletion flow for the authenticated user. A one-time confirmation token is sent to the user's email address. The token must then be submitted to `/account/delete-confirm` to complete the deletion.
      operationId: requestAccountDelete
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /account/password:
    post:
      tags:
        - Auth
      summary: Change password
      description: Changes the authenticated user's password. Unlike the reset flow this proves possession of the current password rather than of the mailbox, so it needs no email round-trip. Other sessions stay live — revoke them with `POST /account/logout-all` or per session via `DELETE /account/sessions/{sessionId}`.
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /account/logout:
    post:
      tags:
        - Auth
      summary: Logout this session
      description: Logs out the CURRENT session only — revokes the refresh token carried by the `jwt` cookie and clears the authentication cookies. Other devices stay signed in; `POST /account/logout-all` is the one that revokes everything. Answers 200 whether or not a live session was found, because the caller's goal — not being logged in here — is met either way.
      operationId: logout
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '500':
          $ref: '#/components/responses/InternalError'
  /account/sessions:
    get:
      tags:
        - Account
      summary: List active sessions
      description: Lists the authenticated user's live refresh tokens as sessions — issue-agnostic handles with an expiry and a `current` marker, never the token values themselves. The one carried by the caller's own refresh cookie is flagged `current`.
      operationId: getSessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /account/sessions/{sessionId}:
    delete:
      tags:
        - Account
      summary: Revoke one session
      description: Revokes a single refresh token by its session id — "log out that device". Revoking the current session is allowed and equivalent to `POST /account/logout`, except that the cookies of OTHER clients cannot be cleared from here; their next refresh simply fails.
      operationId: revokeSession
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
          description: Session identifier from `GET /account/sessions`
      responses:
