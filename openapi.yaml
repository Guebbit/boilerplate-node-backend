openapi: 3.0.3
info:
    title: Ecommerce Demo API
    version: '2.0.0'
    description: |
        Stable, codegen-oriented OpenAPI contract.
        Designed for multi-project, multi-language use (client/server stubs, DTOs, SDKs).

        Language: every endpoint honours `Accept-Language` (q-weights and region tags
        included). It selects the language of user-facing copy only — `errors[].message` and a
        success envelope's `message` — never the response shape, the status code, or a
        machine-readable field such as `errors[].code`. An unsupported language falls back
        instead of erroring; `Content-Language` states what was used and `Vary:
        Accept-Language` is always set. `GET /locales` lists what a deployment supports.

        The header is intentionally not declared per operation: it applies to all of them and
        clients set it once in an interceptor, so declaring it 33 times would only add a
        redundant argument to every generated function. This paragraph is its contract.
    contact:
        name: API Team

servers:
    - url: http://localhost:3000
      description: Local
    - url: https://api.example.com
      description: Production

tags:
    - name: Auth
    - name: Account
    - name: Users
    - name: Products
    - name: Cart
    - name: Orders
    - name: Feedback
    - name: System
      description: Public system endpoints (ping, liveness).
    - name: Observability
      description: Operational observability endpoints (metrics, health, audit, events). Protected endpoints require admin role.

# If set, by default all operation requires an authentication
# security:
#    - bearerAuth: []

components:
    # This is a common security scheme that can be used by any operation
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

    parameters:
        # `Accept-Language` is honoured by every operation and is documented in
        # `info.description` rather than declared here — see the note there.

        # Common parameters
        PageParam:
            name: page
            in: query
            required: false
            schema:
                $ref: '#/components/schemas/Page'
            description: 1-based page index
        PageSizeParam:
            name: pageSize
            in: query
            required: false
            schema:
                $ref: '#/components/schemas/PageSize'
        TextParam:
            name: text
            in: query
            required: false
            schema:
                $ref: '#/components/schemas/Text'

        # Query ID parameters (just for filtering)
        IdParam:
            name: id
            in: query
            required: false
            schema:
                $ref: '#/components/schemas/Id'
        UserIdParam:
            name: userId
            in: query
            required: false
            schema:
                $ref: '#/components/schemas/Id'
        ProductIdParam:
            name: productId
            in: query
            required: false
            schema:
                $ref: '#/components/schemas/Id'
        # OrderIdParam:
        #     name: orderId
        #     in: query
        #     required: false
        #     schema:
        #         $ref: '#/components/schemas/Id'

        # Path ID parameters (for resource lookup)
        IdPathParam:
            name: id
            in: path
            required: true
            schema:
                $ref: '#/components/schemas/Id'
            description: Resource identifier

        ProductIdPathParam:
            name: productId
            in: path
            required: true
            schema:
                $ref: '#/components/schemas/Id'
            description: Product identifier

    responses:
        Success:
            description: Success
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/MessageResponse'
        Unauthorized:
            description: Unauthorized
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        Forbidden:
            description: Forbidden
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        NotFound:
            description: Resource not found
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        Conflict:
            description: The request conflicts with the current state of the resource
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        ValidationError:
            description: Validation failed
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ValidationErrorResponse'
        InternalError:
            description: Internal server error
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'

    schemas:
        # ---------- Commons ----------
        Page:
            type: integer
            minimum: 1
            default: 1
            description: 1-based page index
        PageSize:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
            description: Optional override; server may clamp to a max
        Id:
            type: string
            description: Resource identifier
        Text:
            type: string
            minLength: 1
            description: Free-text search string
        Email:
            type: string
            format: email
        Password:
            type: string
            minLength: 8
        Locale:
            type: string
            description: >-
                BCP 47 language tag, e.g. `en` or `it`. Which tags a deployment actually supports
                is a runtime fact, not a contract one — ask `GET /locales`.
            pattern: '^[a-z]{2}(-[A-Za-z0-9]+)*$'
            example: it
        ImageUrl:
            type: string
            format: uri-reference
            description: >-
                Absolute URL or server-relative upload path (e.g. `/uploads/abc.jpg`).
                `uri-reference`, not `uri`: an uploaded image is stored and returned as a
                path relative to the API host, which is not a valid absolute URI.

        # ---------- On the `imageUpload` fields below (and why they carry no limits) ----------
        #
        # The six `*Multipart` request bodies each declare `imageUpload` as a bare
        # `type: string, format: binary` — no `maxLength`, no `contentMediaType`. That is on
        # purpose, and it is worth knowing why before someone "fixes" it.
        #
        # The real limits live in the backend, and only there:
        #   - accepted mime types → src/core/adapters/storage.ts (image/png, jpg, jpeg, webp)
        #   - maximum size        → NODE_MAX_UPLOAD_BYTES, default 5 MB
        # enforced twice: `fileFilter` rejects on the client's declared Content-Type before the
        # bytes touch disk, then `identifyImageFile()` re-reads the actual magic bytes and answers
        # 422 when the declaration lied. Nothing a client declares can substitute for either gate.
        #
        # Declaring the constraints here would document them but generate nothing to read:
        #   - orval's zod generator short-circuits on `format: binary` straight to
        #     `zod.instanceof(File)` and emits no length constant for it
        #     (@orval/zod, the `case "string"` branch);
        #   - the `zodSchemas` target in orval.config.ts has no `splitByContentType`, so only the
        #     JSON body of each operation becomes a schema — the multipart bodies never do.
        # So a `maxLength` added here would reach no generated artefact in either repo, while
        # looking like it had.
        #
        # The frontend therefore restates both numbers in src/utils/uploads.ts, which names
        # storage.ts as the authority and explains the same thing at its own call site. If the
        # backend's limits ever change, that file is what has to change with them — nothing will
        # announce the drift.

        # ---------- Meta / envelope ----------
        PaginationMeta:
            type: object
            additionalProperties: false
            required: [page, pageSize, totalItems, totalPages]
            properties:
                page:
                    $ref: '#/components/schemas/Page'
                pageSize:
                    $ref: '#/components/schemas/PageSize'
                totalItems:
                    type: integer
                    minimum: 0
                totalPages:
                    type: integer
                    minimum: 0

        # ---------- System Messages ----------

        # The three `&envelope*` anchors below are the single definition of the success-envelope
        # preamble. Every *Envelope schema aliases them with `*envelopeSuccess` etc., so the shape
        # is written once here and the YAML parser expands it everywhere — no allOf, and therefore
        # no schema that has to stay non-strict. See the note on ErrorResponse for why.
        MessageResponse:
            type: object
            additionalProperties: false
            required: [success, status, message]
            properties:
                success: &envelopeSuccess
                    type: boolean
                    enum: [true]
                status: &envelopeStatus
                    type: integer
                message: &envelopeMessage
                    type: string

        LocaleCapabilities:
            type: object
            additionalProperties: false
            required: [locales, default, fallback]
            description: >-
                Which languages a deployment can answer in. Runtime state, not contract state:
                it is derived from the dictionaries actually deployed, so it cannot be an enum
                here.
            properties:
                locales:
                    type: array
                    items:
                        $ref: '#/components/schemas/Locale'
                    description: Every supported language tag.
                default:
                    $ref: '#/components/schemas/Locale'
                fallback:
                    $ref: '#/components/schemas/Locale'

        LocaleCapabilitiesEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/LocaleCapabilities'

        LocaleDictionary:
            type: object
            additionalProperties: false
            required: [locale, messages]
            description: >-
                The API's OWN message dictionary for one language — its API-response copy and
                nothing else. It is never a client's UI dictionary: the two are authored and
                deployed in separate repositories, and mixing them would put view copy in the
                API's keyspace. A client that wants these merges them under a namespace it
                reserves for the API, never at the root.
            properties:
                locale:
                    $ref: '#/components/schemas/Locale'
                messages:
                    type: object
                    additionalProperties: true
                    description: Nested key/value dictionary, the same shape the API loads.

        LocaleDictionaryEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/LocaleDictionary'

        HealthPing:
            type: object
            additionalProperties: false
            required: [status]
            properties:
                status:
                    type: string
                    enum: [ok]
                    description: Liveness indicator. Always `ok` when the process is answering.

        ErrorItem:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
                code:
                    type: string
                    description: Stable machine-readable error code
                    example: VALIDATION_ERROR
                message:
                    type: string
                    description: Human-readable error detail
                    example: Field "email" is required
                details:
                    type: object
                    additionalProperties: true
                    description: Optional structured metadata for programmatic handling

        # `additionalProperties: false` cannot live on a schema used as an `allOf` base: the
        # constraint is evaluated per-subschema, so it would reject the properties a sibling
        # contributes. Rather than leave the error/success envelopes unconstrained, they are
        # written flat and share their preamble through YAML anchors.
        ErrorResponse:
            type: object
            additionalProperties: false
            required: [success, status, message, errors]
            properties:
                success: &errorSuccess
                    type: boolean
                    enum: [false]
                status: &errorStatus
                    type: integer
                message: &errorMessage
                    type: string
                    description: Human-readable summary for this failure
                errors: &errorErrors
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/ErrorItem'
                    description: Structured machine-friendly errors

        ValidationErrorResponse:
            type: object
            additionalProperties: false
            required: [success, status, message, errors]
            properties:
                success: *errorSuccess
                status: *errorStatus
                message:
                    type: string
                    description: Human-readable summary for this failure
                    example: Validation failed
                errors: *errorErrors

        # ---------- Domain ----------

        # All success responses are wrapped in a standard envelope:
        # { success: true, status: number, message: string, data: <payload> }
        # The schemas below describe the "data" payload for each endpoint.
        # Wrapped response schemas below combine the envelope with the domain payload.

        HealthPingEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/HealthPing'

        AuthTokensEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/AuthTokens'

        RefreshTokenEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/RefreshTokenResponse'

        UserEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/User'

        UsersResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/UsersResponse'

        ProductEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/Product'

        ProductsResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/ProductsResponse'

        OrderEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/Order'

        OrdersResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/OrdersResponse'

        FeedbackRequestEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/FeedbackRequest'

        FeedbackRequestsResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/FeedbackRequestsResponse'

        CartResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/CartResponse'

        CartSummaryResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/CartSummaryResponse'

        CheckoutResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/CheckoutResponse'

        ObservabilityHealthResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/ObservabilityHealthResponse'

        ObservabilityMetricsSummaryResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/ObservabilityMetricsSummaryResponse'

        AuditLogsResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/AuditLogsResponse'

        AuthTokens:
            type: object
            additionalProperties: false
            required: [token]
            properties:
                token:
                    type: string
                    description: Access JWT
                refreshToken:
                    type: string
                    description: Refresh token if returned by backend
                expiresIn:
                    type: integer
                    description: Access token expiry in seconds

        RefreshTokenResponse:
            type: object
            additionalProperties: false
            required: [token]
            properties:
                token:
                    type: string
                    description: New access JWT
                refreshToken:
                    type: string
                    description: New refresh token if returned by backend
                expiresIn:
                    type: integer
                    description: New access token expiry in seconds

        User:
            type: object
            additionalProperties: false
            required: [id, email, username]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                email:
                    $ref: '#/components/schemas/Email'
                username:
                    type: string
                admin:
                    type: boolean
                # Independent of `deletedAt` below: an account can be deactivated without being
                # deleted, and a deleted one keeps whatever `active` it had. They share an effect,
                # not a value — see the note on `CreateProductRequest.active`.
                active:
                    type: boolean
                imageUrl:
                    $ref: '#/components/schemas/ImageUrl'
                locale:
                    $ref: '#/components/schemas/Locale'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                # Present only on a soft-deleted account, exactly as on `Product`. It was stripped
                # until `active` became a real column: while `active` was synthesised as
                # `!deletedAt`, deletion was legible through that flag, and once the two separated
                # an admin had no way to see it at all. Every route serving a `User` list is
                # admin-only; `/account` serves the caller their own record.
                deletedAt:
                    type: string
                    format: date-time

        Product:
            type: object
            additionalProperties: false
            required: [id, title, price]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                title:
                    type: string
                price:
                    type: number
                    format: double
                    minimum: 0
                description:
                    type: string
                active:
                    type: boolean
                imageUrl:
                    $ref: '#/components/schemas/ImageUrl'
                categories:
                    type: array
                    items:
                        type: string
                tags:
                    type: array
                    items:
                        type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                deletedAt:
                    type: string
                    format: date-time

        FeedbackRequest:
            type: object
            additionalProperties: false
            required: [id, email, subject, message, status, createdAt]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
                email:
                    $ref: '#/components/schemas/Email'
                subject:
                    type: string
                message:
                    type: string
                status:
                    type: string
                    enum: [new, in_progress, resolved, spam]
                adminNotes:
                    type: string
                respondedAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        CartItem:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
                productId:
                    $ref: '#/components/schemas/Id'
                quantity:
                    type: integer
                    minimum: 1

        OrderItem:
            type: object
            additionalProperties: false
            required: [product, quantity]
            properties:
                product:
                    $ref: '#/components/schemas/Product'
                quantity:
                    type: integer
                    minimum: 1

        Order:
            type: object
            additionalProperties: false
            required: [id, userId, email, items, totalItems, totalQuantity, totalPrice, status]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                userId:
                    $ref: '#/components/schemas/Id'
                email:
                    $ref: '#/components/schemas/Email'
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/OrderItem'
                totalItems:
                    type: integer
                    minimum: 0
                    description: >-
                        Number of distinct line items in this order. Not to be confused with
                        `PaginationMeta.totalItems`, which counts orders matching a search.
                    example: 2
                totalQuantity:
                    type: integer
                    minimum: 0
                    description: Sum of `quantity` across every line item.
                    example: 5
                totalPrice:
                    type: number
                    format: double
                    minimum: 0
                    description: Sum of `product.price × quantity` across every line item.
                    example: 149.97
                notes:
                    type: string
                    description: Optional order notes
                status:
                    type: string
                    enum: [pending, paid, processing, shipped, delivered, cancelled]
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        # ---------- Request DTOs — Auth ----------
        LoginRequest:
            type: object
            additionalProperties: false
            required: [email, password]
            properties:
                email:
                    $ref: '#/components/schemas/Email'
                password:
                    $ref: '#/components/schemas/Password'

        SignupRequest:
            type: object
            additionalProperties: false
            required: [email, username, password, passwordConfirm]
            properties:
                email:
                    $ref: '#/components/schemas/Email'
                username:
                    type: string
                    minLength: 3
                password:
                    $ref: '#/components/schemas/Password'
                passwordConfirm:
                    $ref: '#/components/schemas/Password'
                imageUrl:
                    $ref: '#/components/schemas/ImageUrl'

        SignupRequestMultipart:
            type: object
            additionalProperties: false
            required: [email, username, password, passwordConfirm]
            properties:
                email:
                    $ref: '#/components/schemas/Email'
                username:
                    type: string
                    minLength: 3
                password:
                    $ref: '#/components/schemas/Password'
                passwordConfirm:
                    $ref: '#/components/schemas/Password'
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional user profile image

        PasswordResetRequest:
            type: object
            additionalProperties: false
            required: [email]
            properties:
                email:
                    $ref: '#/components/schemas/Email'

        PasswordResetConfirmRequest:
            type: object
            additionalProperties: false
            required: [token, password, passwordConfirm]
            properties:
                token:
                    type: string
                    description: One-time password reset token (NOT a JWT).
                password:
                    $ref: '#/components/schemas/Password'
                passwordConfirm:
                    $ref: '#/components/schemas/Password'

        AccountDeleteConfirmRequest:
            type: object
            additionalProperties: false
            required: [token]
            properties:
                token:
                    type: string
                    description: One-time account deletion token (NOT a JWT).

        # ---------- Request DTOs — Users ----------
        SearchUsersRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    $ref: '#/components/schemas/Page'
                pageSize:
                    $ref: '#/components/schemas/PageSize'
                text:
                    $ref: '#/components/schemas/Text'
                id:
                    $ref: '#/components/schemas/Id'
                email:
                    $ref: '#/components/schemas/Email'
                username:
                    type: string
                # Filters the stored `active` column. It does NOT filter soft-deletion: the two
                # are independent facts, and `deletedAt` is not exposed on `User` at all, so
                # there is no filter for it here. `active: false` means "deactivated", not
                # "deleted" — it used to mean both, back when users had no `active` column.
                active:
                    type: boolean

        CreateUserRequest:
            type: object
            additionalProperties: false
            required: [email, username, password]
            properties:
                email:
                    $ref: '#/components/schemas/Email'
                username:
                    type: string
                password:
                    $ref: '#/components/schemas/Password'
                admin:
                    type: boolean
                # Same reasoning as `CreateProductRequest.active`: independent of soft-deletion,
                # defaulted here because leaving it undeclared is how two implementations came to
                # disagree about it. Create bodies only — an omitted `active` on an update means
                # "leave it alone".
                active:
                    type: boolean
                    default: true
                imageUrl:
                    $ref: '#/components/schemas/ImageUrl'
                locale:
                    $ref: '#/components/schemas/Locale'

        CreateUserRequestMultipart:
            type: object
            additionalProperties: false
            required: [email, username, password]
            properties:
                email:
                    $ref: '#/components/schemas/Email'
                username:
                    type: string
                password:
                    $ref: '#/components/schemas/Password'
                admin:
                    type: boolean
                # Same default, same reasoning as `CreateUserRequest.active` above.
                active:
                    type: boolean
                    default: true
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional user profile image
                locale:
                    $ref: '#/components/schemas/Locale'

        UpdateUserRequest:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                email:
                    $ref: '#/components/schemas/Email'
                username:
                    type: string
                password:
                    $ref: '#/components/schemas/Password'
                admin:
                    type: boolean
                active:
                    type: boolean
                imageUrl:
                    $ref: '#/components/schemas/ImageUrl'
                locale:
                    $ref: '#/components/schemas/Locale'

        UpdateUserRequestMultipart:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                email:
                    $ref: '#/components/schemas/Email'
                username:
                    type: string
                password:
                    $ref: '#/components/schemas/Password'
                admin:
                    type: boolean
                active:
                    type: boolean
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional user profile image
                locale:
                    $ref: '#/components/schemas/Locale'

        UpdateUserByIdRequest:
            type: object
            additionalProperties: false
            properties:
                email:
                    $ref: '#/components/schemas/Email'
                password:
                    $ref: '#/components/schemas/Password'
                username:
                    type: string
                admin:
                    type: boolean
                active:
                    type: boolean
                imageUrl:
                    $ref: '#/components/schemas/ImageUrl'

        UpdateUserByIdRequestMultipart:
            type: object
            additionalProperties: false
            properties:
                email:
                    $ref: '#/components/schemas/Email'
                password:
                    $ref: '#/components/schemas/Password'
                username:
                    type: string
                admin:
                    type: boolean
                active:
                    type: boolean
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional user profile image

        DeleteUserRequest:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                hardDelete:
                    type: boolean
                    default: false

        # ---------- Request DTOs — Products ----------
        SearchProductsRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    $ref: '#/components/schemas/Page'
                pageSize:
                    $ref: '#/components/schemas/PageSize'
                text:
                    $ref: '#/components/schemas/Text'
                id:
                    $ref: '#/components/schemas/Id'
                minPrice:
                    type: number
                    format: double
                    minimum: 0
                maxPrice:
                    type: number
                    format: double
                    minimum: 0
                category:
                    type: string
                tag:
                    type: string

        CreateProductRequest:
            type: object
            additionalProperties: false
            required: [title, price]
            properties:
                title:
                    type: string
                price:
                    type: number
                    format: double
                    minimum: 0
                description:
                    type: string
                # ---------- On `active`, and why it is declared here but not on the updates ----------
                #
                # `active` and `deletedAt` are INDEPENDENT. A record can be active or not regardless
                # of whether it has been soft-deleted, and the two are stored separately. What they
                # share is an effect, not a value: a non-admin sees a record only when it is active
                # AND not soft-deleted (`publicScope()` in the products repository requires both).
                # So a soft-deleted record behaves exactly like an inactive one from outside, while
                # remaining a distinct state inside.
                #
                # The default is declared because it is a real decision, and leaving it undeclared
                # is how the two repos ended up disagreeing about it: this spec said only
                # `type: boolean`, so the API defaulted a created product to `false` while the mock
                # defaulted it to `true`. Same contract, opposite behaviour, and nothing failed.
                #
                # It appears on the CREATE bodies only. On an update, an omitted `active` means
                # "leave it as it is" — a default there would silently republish a deactivated
                # record on any unrelated edit.
                active:
                    type: boolean
                    default: true
                imageUrl:
                    $ref: '#/components/schemas/ImageUrl'
                categories:
                    type: array
                    items:
                        type: string
                tags:
                    type: array
                    items:
                        type: string

        CreateProductRequestMultipart:
            type: object
            additionalProperties: false
            required: [title, price]
            properties:
                title:
                    type: string
                price:
                    type: number
                    format: double
                    minimum: 0
                description:
                    type: string
                # Same default, same reasoning as `CreateProductRequest.active` above.
                active:
                    type: boolean
                    default: true
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional product image
                categories:
                    type: array
                    items:
                        type: string
                tags:
                    type: array
                    items:
                        type: string

        UpdateProductRequest:
            type: object
            additionalProperties: false
            required: [id, title, price]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                title:
                    type: string
                description:
                    type: string
                price:
                    type: number
                    format: double
                    minimum: 0
                active:
                    type: boolean
                imageUrl:
                    $ref: '#/components/schemas/ImageUrl'
                categories:
                    type: array
                    items:
                        type: string
                tags:
                    type: array
                    items:
                        type: string

        UpdateProductRequestMultipart:
            type: object
            additionalProperties: false
            required: [id, title, price]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                title:
                    type: string
                description:
                    type: string
                price:
                    type: number
                    format: double
                    minimum: 0
                active:
                    type: boolean
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional product image
                categories:
                    type: array
                    items:
                        type: string
                tags:
                    type: array
                    items:
                        type: string

        UpdateProductByIdRequest:
            type: object
            additionalProperties: false
            required: [title, price]
            properties:
                title:
                    type: string
                description:
                    type: string
                price:
                    type: number
                    format: double
                    minimum: 0
                active:
                    type: boolean
                imageUrl:
                    $ref: '#/components/schemas/ImageUrl'
                categories:
                    type: array
                    items:
                        type: string
                tags:
                    type: array
                    items:
                        type: string

        UpdateProductByIdRequestMultipart:
            type: object
            additionalProperties: false
            required: [title, price]
            properties:
                title:
                    type: string
                description:
                    type: string
                price:
                    type: number
                    format: double
                    minimum: 0
                active:
                    type: boolean
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional product image
                categories:
                    type: array
                    items:
                        type: string
                tags:
                    type: array
                    items:
                        type: string

        # For the path-form deletes, which need no id — `{id}` already carries it — but do
        # read the flag from a body as readily as from the query.
        HardDeleteRequest:
            type: object
            additionalProperties: false
            properties:
                hardDelete:
                    type: boolean
                    default: false

        DeleteProductRequest:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                hardDelete:
                    type: boolean
                    default: false

        # ---------- Request DTOs — Cart ----------
        UpsertCartItemRequest:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
                productId:
                    $ref: '#/components/schemas/Id'
                quantity:
                    type: integer
