      description: 'Cancels the order identified by `{id}` — the one order write a customer can make. Which statuses allow it is the caller''s `Order.actions.cancel`; a customer may cancel while `pending` or `paid`, an operator one step further. Cancelling releases the order''s held stock in every case. Whether the MONEY goes back is `refund`: a customer is always refunded and cannot waive it, an operator chooses. Later statuses need their own flow (a return), driven through `PUT /orders/{id}`. A non-admin can cancel only their own orders; an admin can cancel anyone''s. The check and the write are one atomic statement, so a cancel racing a status change resolves to exactly one winner.'
