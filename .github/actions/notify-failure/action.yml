name: Notify on failure
description: Open or update one tracking issue when a recurring workflow fails.

# Opens or updates one tracking issue for a recurring nightly workflow's failure, instead of
# adding a channel nobody watches. `mutation.yml`'s `mutation-notify` and `schemathesis.yml`'s
# `schemathesis-notify` were the same script twice, one label and one sentence apart.

inputs:
    title:
        description: >
            The tracking issue's title. Also the de-dupe key — a later run with the same title
            comments on the existing issue instead of opening a second one.
        required: true
    label:
        description: The issue label used both to find the existing tracking issue and to tag a new one.
        required: true
    workflow-name:
        description: >
            Human name of the failed workflow, used in the issue body
            ("The <workflow-name> workflow failed on <date>.").
        required: true

runs:
    using: composite
    steps:
        - name: Open or update the failure issue
          uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
          env:
              NOTIFY_TITLE: ${{ inputs.title }}
              NOTIFY_LABEL: ${{ inputs.label }}
              NOTIFY_WORKFLOW_NAME: ${{ inputs.workflow-name }}
          with:
              script: |
                  const title = process.env.NOTIFY_TITLE;
                  const label = process.env.NOTIFY_LABEL;
                  const workflowName = process.env.NOTIFY_WORKFLOW_NAME;
                  const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                  const body = [
                      `The ${workflowName} workflow failed on ${new Date().toISOString().slice(0, 10)}.`,
                      '',
                      `Run: ${runUrl}`
                  ].join('\n');

                  const { data: openIssues } = await github.rest.issues.listForRepo({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      state: 'open',
                      labels: label
                  });
                  const existing = openIssues.find((issue) => issue.title === title);

                  if (existing) {
                      await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: existing.number,
                          body
                      });
                  } else {
                      await github.rest.issues.create({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          title,
                          body,
                          labels: [label]
                      });
                  }
