name: Fuzz (spec-driven)

# Throws hostile-but-spec-valid requests at every operation in openapi.yaml and asserts none of
# them 5xxes or answers off-contract.
#
# Two runs of the same suite, at two depths:
#
#   Gate:    `npm test` includes `test:fuzz`, so `ci.yml`'s `container-gate` (which runs
#            `npm run complete`) fuzzes every PR — a small pass, `TEST_FUZZ_RUNS`' default.
#   Hunter:  this workflow. Nightly, many more requests per operation, a fresh seed each night.
#            A red run here is a FINDING for a person to read, not a merge blocker — its first
#            run produced five genuine bugs, one an unauthenticated 500.
#
# The endpoint list is derived from the spec rather than written down, so a route added tomorrow
# is covered tomorrow, with nobody remembering to add it.
#
# Nightly, and on demand from the Actions tab before touching the HTTP layer or the spec.

on:
    schedule:
        # 03:45 UTC — after the backend's mutation run (03:00) and the frontend's nightlies
        # (03:00 / 03:15 / 03:30), so the five do not compete for runners.
        - cron: '45 3 * * *'
    workflow_dispatch:

concurrency:
    group: fuzz-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 22

jobs:
    fuzz:
        runs-on: ubuntu-latest
        # Generous on purpose: the point of a nightly is that it is allowed to be slow, and the
        # run scales with the number of operations in the spec. It should never be trimmed by
        # narrowing what gets fuzzed.
        timeout-minutes: 90
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  setup-mongod: 'true'

            # No Mongo service container: the suite uses `mongodb-memory-server` against a
            # preinstalled `mongod`, and the cache adapter treats an unreachable Redis as a miss —
            # same as the contract suite. The seed is printed first; rerun with
            # RANDOM_DATA_SEED=<seed> to reproduce.
            - name: Run the fuzzer
              env:
                  # Requests per operation. The gate runs the knob's small default; the nightly is
                  # where it is worth paying for depth — see tests/support/knobs.ts.
                  TEST_FUZZ_RUNS: '40'
              run: npm run test:fuzz
