name: Mutation

# Mutation testing lives in its own workflow, deliberately.
#
# It is NOT part of `ci.yml`, and that is structural rather than a convention: a run re-executes
# the unit suite once per mutant, so putting it anywhere near the `ci` aggregate job would
# eventually make someone wait minutes for a PR — and the first time it did, it would be turned
# off. Kept separate, it cannot become a PR gate by accident.
#
# What it answers: "do the tests actually work?" A mutant that survives is a bug the suite cannot
# see. Unlike line coverage, that cannot be satisfied by executing code without asserting on it.
#
# Runs nightly, and on demand from the Actions tab before a refactor.
# Scope and thresholds live in stryker.config.json. Only the unit suite takes part — see the
# note in that file for why integration and contract are excluded.

on:
    schedule:
        # 03:00 UTC — half an hour before the frontend's, so the two do not compete for runners.
        - cron: '0 3 * * *'
    workflow_dispatch:

concurrency:
    group: mutation-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 22

jobs:
    mutation:
        runs-on: ubuntu-latest
        # Generous: the run scales with the number of mutants, and the point of a nightly is
        # that it is allowed to be slow. It should never be trimmed by narrowing `mutate`.
        timeout-minutes: 90
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run mutation tests
              run: npm run test:mutation

            - name: Upload mutation report
              # Uploaded even on failure: a run that trips the break threshold is exactly the
              # run whose report someone needs to read.
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: mutation-report
                  path: reports/mutation/
                  retention-days: 30
                  if-no-files-found: warn
