name: Mutation

# Deliberately breaks the source in small ways and checks the suite notices. Measures how good the
# TESTS are, not how good the code is. Weekly, not a merge gate — except the diff job, which is.
#
# Mutation testing lives in its own workflow, deliberately.
#
# It is NOT part of `ci.yml`, and that is structural rather than a convention: a full sweep re-runs
# the suite once per mutant, so putting it anywhere near the `ci` aggregate job would eventually
# make someone wait hours for a PR — and the first time it did, it would be turned off. Kept
# separate, the full sweep cannot become a PR gate by accident. The one exception is the diff job
# below, scoped to the files a branch touched, which is a different bargain and gates on purpose.
#
# What it answers: "do the tests actually work?" A mutant that survives is a bug the suite cannot
# see. Unlike line coverage, that cannot be satisfied by executing code without asserting on it.
#
# One ruler, one scope, always sharded — see docs/tools/mutation-testing.md#one-ruler. The full
# scope runs weekly, and on demand from the Actions tab before a refactor.

on:
    schedule:
        # 03:00 UTC on Sundays — half an hour before the frontend's, so the two do not compete for
        # runners.
        - cron: '0 3 * * 0'
    workflow_dispatch:
        inputs:
            force:
                description: 'Discard the incremental cache and re-test every mutant'
                type: boolean
                default: false
    # The `mutation-diff` job below, and only that job — every other job here guards on
    # `github.event_name != 'pull_request'`. The full sweep must never become a PR gate; see the
    # header. The diff job is scoped to the files a branch touched, which is a different bargain.
    pull_request:

concurrency:
    group: mutation-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 22

jobs:
    mutation-matrix:
        # Plans the weekly matrix — see scripts/mutation/shard-plan.ts and its own
        # scripts/mutation/sharding.ts. Deliberately its own job rather than an inline `run` block:
        # its output feeds `mutation`'s `strategy.matrix` below, which can only read a previous
        # job's output, not compute its own.
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            shards: ${{ steps.plan.outputs.shards }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Plan this week's shards
              id: plan
              run: npx tsx scripts/mutation/shard-plan.ts >> "$GITHUB_OUTPUT"

    mutation:
        # The whole scope, sharded by line count rather than by module name — a hand-copied module
        # list is exactly how `src/infrastructure`, `src/kernel`, `webhooks`, `api-keys` and
        # `antibot` went unmeasured for a month despite sitting right in the old `stryker.deep.json`'s
        # own `mutate` list. `mutation-matrix` walks that scope itself every week instead.
        #
        # `maxTestRunnerReuse: 1` in `stryker.json` is load-bearing here, not a tuning knob. Every
        # test file that reaches mongoose re-evaluates `bson`, which allocates a 17 MiB buffer at
        # module scope, and Stryker never exits the worker — so the copies accumulate. Measured on
        # one file: 23 OOM restarts at reuse 5, none at 1, and the run was HALF the time because a
        # restart costs less than the crash-and-retry it replaces.
        needs: mutation-matrix
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        # See scripts/mutation/sharding.ts's `TARGET_LINES_PER_SHARD` comment — this number and
        # that constant are coupled and nothing checks that they still agree. History, 2026-09-21:
        # 210->270 after a measured shard took 219m at `--concurrency 2`; 270->350 alongside a drop
        # to `--concurrency 1` that was meant to roughly double wall-clock but instead made EVERY
        # remaining shard blow straight through 350m simultaneously (real ratio was worse than 2x).
        # Concurrency is back to 2 (below) and the shard target dropped 1300->600 lines instead —
        # smaller shards cost less time AND less peak memory, which concurrency alone couldn't
        # buy. Left at 350 anyway: real margin, still under GitHub's 360m hosted-runner ceiling.
        timeout-minutes: 350
        permissions:
            contents: read
        strategy:
            # One slow shard must not hide the results of the other dozen.
            fail-fast: false
            matrix:
                include: ${{ fromJson(needs.mutation-matrix.outputs.shards) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Restore this shard's incremental cache
              # `reports/*` is gitignored (see .gitignore), so nothing commits this file — without a
              # cache, every week pays the full re-mutation cost. The unique `key` per run
              # guarantees a save at the end; `restore-keys` falls back to the shard's most recent
              # cache. `workflow_dispatch`'s `force` input still discards whatever this restores
              # (Stryker's own behaviour), so restoring on that run is harmless, not wasted.
              uses: actions/cache@v4
              with:
                  path: reports/stryker-incremental.json
                  key: mutation-incremental-${{ matrix.name }}-${{ github.run_id }}
                  restore-keys: |
                      mutation-incremental-${{ matrix.name }}-

            - name: Run the mutate scope for ${{ matrix.name }}
              # `--concurrency 2`, not the config's 4 — a GitHub runner is 4 vCPU / 16 GB, and each
              # worker carries its own in-memory mongod. `--concurrency 1` (briefly, 2026-09-21) was
              # meant to fix three shards OOM'ing on `bson`'s off-heap scratch buffers
              # (docs/tools/mutation-testing.md#worker-heap-cap) — it "fixed" that by making every
              # shard, not just three, blow through even a 350m timeout, since halving concurrency
              # roughly doubles wall-clock and the real ratio was worse than 2x. The shard TARGET
              # (scripts/mutation/sharding.ts) dropped 1300->600 lines instead: a smaller `--mutate`
              # scope relates less of the integration suite through `enableFindRelatedTests`, which
              # is what actually drove the accumulation — concurrency was never the right lever.
              #
              # NODE_OPTIONS caps V8's own old-space — didn't fix the OOM by itself (see above,
              # bson's buffers sit outside it), kept anyway as a second, cheap guard against the
              # OTHER failure mode the same doc section describes.
              env:
                  NODE_OPTIONS: --max-old-space-size=4096
              run: npx stryker run stryker.json --mutate '${{ matrix.mutate }}' --concurrency 2 ${{ inputs.force && '--force' || '' }}

            - name: Upload the shard's report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: mutation-${{ matrix.name }}
                  path: reports/mutation/
                  retention-days: 14

    mutation-merge:
        # Folds every shard's report into `mutation-baseline.json`. Runs even when a shard failed
        # (`always()`): a shard that hit the ceiling still produced a partial report for every
        # mutant it finished, and that is real data worth folding in rather than discarding because
        # a sibling shard timed out.
        needs: [mutation-matrix, mutation]
        if: always() && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Download every shard's report
              uses: actions/download-artifact@v4
              with:
                  pattern: mutation-shard-*
                  path: mutation-reports

            - name: Fold this week's shards into the baseline
              # `--merge`, not `--update`: `--update`'s `missingFromReport` guard exists precisely to
              # refuse recording a partial report as if it were the whole baseline. See
              # scripts/mutation/baseline.ts's `mergeIntoBaseline`.
              run: npm run mutation:check -- --merge --merge-dir=mutation-reports

            - name: Commit the updated baseline
              # A regression here still exits non-zero (surfaced by `mutation-notify` below); the
              # commit happens regardless, because the record should reflect what was actually
              # measured whether or not it is good news — that is the whole point of a ratchet.
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  if git diff --quiet -- mutation-baseline.json; then
                    echo "no change to mutation-baseline.json"
                    exit 0
                  fi
                  git add mutation-baseline.json
                  git commit -m "chore(mutation): fold this week's sweep into the baseline"
                  git push

    mutation-diff:
        # The PR-scoped run: the same ruler, narrowed to the files this branch changed.
        #
        # It fails only on the per-file RATCHET — a file scoring below what `mutation-baseline.json`
        # already records for it. Not on `thresholds.break`, which is a percentage over whatever
        # happens to be in the diff: one survivor is 50% of two mutants and 10% of ten, and the
        # size of a diff is not a fact about the code.
        #
        # Pre-existing weakness therefore cannot fail a PR, and neither can an equivalent mutant —
        # one that no test could ever kill was already surviving when the baseline was taken. Only a
        # drop you introduced fails.
        #
        # No `continue-on-error` here: `check-baseline.ts` exits 0 when the baseline doesn't cover
        # a file yet (nothing to compare against is not this PR's fault), so the step only fails on
        # a real, measured regression once `mutation-merge` has had a chance to record one.
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # `merge-base` needs both sides; a shallow clone has neither.
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Mutate the files this branch changed
              run: npm run mutation -- --base=origin/${{ github.base_ref }}

            - name: Upload the diff report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: mutation-diff
                  path: reports/mutation/
                  retention-days: 14

    mutation-notify:
        # 24 failures and 12 cancellations went unnoticed over 35 nights under the old rotation,
        # before this existed — "check the Actions tab deliberately" was the alternative, tried for
        # a month, and it produced exactly that silence. One issue, updated in place, surfaces where
        # the repo is already read instead of adding a channel nobody watches.
        needs: [mutation-matrix, mutation, mutation-merge]
        if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            issues: write
        steps:
            - name: Open or update the weekly-failure issue
              uses: actions/github-script@v7
              with:
                  script: |
                      const title = 'Weekly mutation sweep failed';
                      const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const body = [
                          `The mutation workflow failed on ${new Date().toISOString().slice(0, 10)}.`,
                          '',
                          `Run: ${runUrl}`
                      ].join('\n');

                      const { data: openIssues } = await github.rest.issues.listForRepo({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          state: 'open',
                          labels: 'mutation-sweep'
                      });
                      const existing = openIssues.find((issue) => issue.title === title);

                      if (existing) {
                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: existing.number,
                              body
                          });
                      } else {
                          await github.rest.issues.create({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              title,
                              body,
                              labels: ['mutation-sweep']
                          });
                      }
