name: Mutation

# Deliberately breaks the source in small ways and checks the suite notices. Measures how good the
# TESTS are, not how good the code is. Weekly, not a merge gate — except the diff job, which is.
#
# Mutation testing lives in its own workflow, deliberately.
#
# It is NOT part of `ci.yml`, and that is structural rather than a convention: a full sweep re-runs
# the suite once per mutant, so putting it anywhere near the `ci` aggregate job would eventually
# make someone wait hours for a PR — and the first time it did, it would be turned off. Kept
# separate, the full sweep cannot become a PR gate by accident. The one exception is the diff job
# below, scoped to the files a branch touched, which is a different bargain and gates on purpose.
#
# What it answers: "do the tests actually work?" A mutant that survives is a bug the suite cannot
# see. Unlike line coverage, that cannot be satisfied by executing code without asserting on it.
#
# The weekly sweep runs in WAVES (`mutation-wave.yml`), then one merge. It is built to finish,
# however long that takes — days on the free runners, not hours:
#
#   Wave:      one matrix of at most 256 shards, one Stryker worker each.
#   Retry:     a shard out of time comes back in the next wave in smaller pieces; one that crashed
#              comes back once as it was.
#   Verdict:   `mutation-merge` alone — one report, one baseline commit, red only when a file
#              could not be measured at all or scored below its baseline.
#
# Before any of that, `preflight` runs the one test run that killed 30 shards on 2026-09-27 — the
# initial run of the most widely imported file — on this same runner setup. A sweep that cannot
# start fails there, in about 20 minutes, instead of after days of runner time.
#
# One ruler, the same `stryker.json` as a local run — see docs/tools/mutation-testing.md#the-github-sweep.
# On demand: Actions tab → Mutation → Run workflow. Tick `check-only` to run just `preflight`.

on:
    schedule:
        # 03:00 UTC on Sundays — half an hour before the frontend's, so the two do not compete for
        # runners.
        - cron: '0 3 * * 0'
    workflow_dispatch:
        inputs:
            check-only:
                description: 'Run only the 20-minute preflight, not the sweep'
                type: boolean
                default: false
    # The `mutation-diff` job below, and only that job — every other job here guards on
    # `github.event_name != 'pull_request'`. The full sweep must never become a PR gate; see the
    # header. The diff job is scoped to the files a branch touched, which is a different bargain.
    pull_request:

permissions:
    contents: read

concurrency:
    group: mutation-${{ github.workflow }}-${{ github.ref }}
    # A sweep takes days: a new one QUEUES behind it rather than cancelling it. A pull request's diff
    # run is still replaced by the next push.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    NODE_VERSION: 24

jobs:
    preflight:
        # `--dryRunOnly`: Stryker's initial test run, then stop — no mutant is tested. `users/model.ts`
        # is imported by nearly every test file, so its initial run is the largest any shard makes;
        # it is the one that ran out of memory in 30 shards of the 2026-09-27 sweep.
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 120
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Set up the runner
              uses: ./.github/actions/mutation-runner
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Run the widest initial test run
              # Same heap, worker count and dry-run budget as a wave shard (`mutation-wave.yml`).
              env:
                  NODE_OPTIONS: --max-old-space-size=12288 --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
              run: |
                  npx stryker run tmp/stryker.ci.json --mutate src/modules/users/model.ts \
                    --concurrency 1 --dryRunTimeoutMinutes 90 --dryRunOnly
                  free -h

    # Eight waves: the first holds the plan's first 256 shards; the rest take the backlog and every
    # retry. A wave with nothing left to do is one planning job and a skipped matrix.
    wave-1:
        needs: preflight
        if: github.event_name != 'pull_request' && !inputs.check-only
        uses: ./.github/workflows/mutation-wave.yml
        with:
            wave: 1

    wave-2:
        needs: [preflight, wave-1]
        if: ${{ !cancelled() && github.event_name != 'pull_request' && !inputs.check-only && needs.preflight.result == 'success' }}
        uses: ./.github/workflows/mutation-wave.yml
        with:
            wave: 2

    wave-3:
        needs: [preflight, wave-2]
        if: ${{ !cancelled() && github.event_name != 'pull_request' && !inputs.check-only && needs.preflight.result == 'success' }}
        uses: ./.github/workflows/mutation-wave.yml
        with:
            wave: 3

    wave-4:
        needs: [preflight, wave-3]
        if: ${{ !cancelled() && github.event_name != 'pull_request' && !inputs.check-only && needs.preflight.result == 'success' }}
        uses: ./.github/workflows/mutation-wave.yml
        with:
            wave: 4

    wave-5:
        needs: [preflight, wave-4]
        if: ${{ !cancelled() && github.event_name != 'pull_request' && !inputs.check-only && needs.preflight.result == 'success' }}
        uses: ./.github/workflows/mutation-wave.yml
        with:
            wave: 5

    wave-6:
        needs: [preflight, wave-5]
        if: ${{ !cancelled() && github.event_name != 'pull_request' && !inputs.check-only && needs.preflight.result == 'success' }}
        uses: ./.github/workflows/mutation-wave.yml
        with:
            wave: 6

    wave-7:
        needs: [preflight, wave-6]
        if: ${{ !cancelled() && github.event_name != 'pull_request' && !inputs.check-only && needs.preflight.result == 'success' }}
        uses: ./.github/workflows/mutation-wave.yml
        with:
            wave: 7

    wave-8:
        needs: [preflight, wave-7]
        if: ${{ !cancelled() && github.event_name != 'pull_request' && !inputs.check-only && needs.preflight.result == 'success' }}
        uses: ./.github/workflows/mutation-wave.yml
        with:
            wave: 8

    mutation-merge:
        # Folds every finished shard, from every wave, into one report and into
        # `mutation-baseline.json` — see scripts/mutation/ci/merge.ts.
        needs: [preflight, wave-8]
        if: ${{ !cancelled() && github.event_name != 'pull_request' && !inputs.check-only && needs.preflight.result == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  # The branch as it is NOW, not as it was when the sweep started days ago: the
                  # baseline commit below lands on top of whatever was pushed meanwhile.
                  ref: ${{ github.ref }}

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Download every finished shard's report
              # No shard finishing is a result the merge reports, not an error here.
              continue-on-error: true
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  pattern: shard-w*
                  path: tmp/mutation-ci/shards

            - name: Download every wave's plan
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  pattern: plan-w*
                  merge-multiple: true
                  path: tmp/mutation-ci/plans

            - name: Merge the shards into one report
              id: merge
              run: |
                  npx tsx scripts/mutation/ci/cli.ts merge --reports=tmp/mutation-ci/shards \
                    --plans=tmp/mutation-ci/plans --out=tmp/mutation-ci/merged >> "$GITHUB_OUTPUT"

            - name: Fold the report into the baseline
              # `--merge`, not `--update`: files this sweep could not measure keep their recorded
              # score instead of leaving the baseline. See scripts/mutation/baseline.ts's
              # `mergeIntoBaseline`. The exit code is kept for the verdict step, not acted on here —
              # the commit below must happen either way.
              id: check
              run: |
                  set +e
                  npm run --silent mutation:check -- --merge --merge-dir=tmp/mutation-ci/merged \
                    > tmp/mutation-ci/check.log 2>&1
                  code=$?
                  cat tmp/mutation-ci/check.log
                  echo "code=$code" >> "$GITHUB_OUTPUT"

            - name: Write the run summary
              if: always()
              run: |
                  if [ -f tmp/mutation-ci/merged/summary.md ]; then
                    cat tmp/mutation-ci/merged/summary.md >> "$GITHUB_STEP_SUMMARY"
                  fi
                  if [ -f tmp/mutation-ci/check.log ]; then
                    {
                      echo
                      echo '<details><summary>Against the baseline</summary>'
                      echo
                      echo '```'
                      cat tmp/mutation-ci/check.log
                      echo '```'
                      echo '</details>'
                    } >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload the report
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: mutation-report
                  path: tmp/mutation-ci/merged/
                  retention-days: 90

            - name: Commit the updated baseline
              # Regardless of the verdict: the record should reflect what was actually measured,
              # good news or not — that is the whole point of a ratchet. Retried on a rejected push,
              # since a sweep that takes days almost always finishes behind the branch.
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  if git diff --quiet -- mutation-baseline.json; then
                    echo "no change to mutation-baseline.json"
                    exit 0
                  fi
                  git add mutation-baseline.json
                  git commit -m "chore(mutation): fold this week's sweep into the baseline"
                  for attempt in 1 2 3; do
                    git push && exit 0
                    echo "push rejected (attempt $attempt) — rebasing onto the branch"
                    git pull --rebase origin "$GITHUB_REF_NAME"
                  done
                  exit 1

            - name: Verdict
              env:
                  INCOMPLETE: ${{ steps.merge.outputs.incomplete }}
                  CHECK: ${{ steps.check.outputs.code }}
              run: |
                  verdict=0
                  if [ "$INCOMPLETE" != 0 ]; then
                    echo "::error::$INCOMPLETE file(s) could not be measured in any wave — listed in the run summary."
                    verdict=1
                  fi
                  if [ "$CHECK" != 0 ]; then
                    echo "::error::A file scored below its recorded baseline — listed in the run summary."
                    verdict=1
                  fi
                  exit "$verdict"

    mutation-diff:
        # The PR-scoped run: the same ruler, narrowed to the files this branch changed.
        #
        # It fails only on the per-file RATCHET — a file scoring below what `mutation-baseline.json`
        # already records for it. Not on `thresholds.break`, which is a percentage over whatever
        # happens to be in the diff: one survivor is 50% of two mutants and 10% of ten, and the
        # size of a diff is not a fact about the code.
        #
        # Pre-existing weakness therefore cannot fail a PR, and neither can an equivalent mutant —
        # one that no test could ever kill was already surviving when the baseline was taken. Only a
        # drop you introduced fails.
        #
        # No `continue-on-error` here: `check-baseline.ts` exits 0 when the baseline doesn't cover
        # a file yet (nothing to compare against is not this PR's fault), so the step only fails on
        # a real, measured regression once `mutation-merge` has had a chance to record one.
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  # `merge-base` needs both sides; a shallow clone has neither.
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Mutate the files this branch changed
              run: npm run mutation -- --base=origin/${{ github.base_ref }}

            - name: Upload the diff report
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: mutation-diff
                  path: tmp/reports/mutation/
                  retention-days: 14

    mutation-notify:
        # 24 failures and 12 cancellations went unnoticed over 35 nights under the old rotation,
        # before this existed — "check the Actions tab deliberately" was the alternative, tried for
        # a month, and it produced exactly that silence. One issue, updated in place, surfaces where
        # the repo is already read instead of adding a channel nobody watches.
        needs:
            [
                preflight,
                wave-1,
                wave-2,
                wave-3,
                wave-4,
                wave-5,
                wave-6,
                wave-7,
                wave-8,
                mutation-merge
            ]
        if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            issues: write
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - name: Open or update the weekly-failure issue
              uses: ./.github/actions/notify-failure
              with:
                  title: 'Weekly mutation sweep failed'
                  label: 'mutation-sweep'
                  workflow-name: 'mutation'
