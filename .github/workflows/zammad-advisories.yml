name: Zammad advisories (daily)

# Asks GitHub, daily, whether a published Zammad security advisory covers the image pinned in
# `compose.production.yaml`. Dependabot cannot: Zammad's advisories carry no package ecosystem and
# some are missing from GitHub's global database (docs/operate/zammad.md#security-releases).
#
# `scripts/security/zammad-advisories.ts` strips the `-00NN` build suffix, compares the vulnerable
# ranges with the pin, and exits non-zero when the pin is exposed or a range cannot be read.
#
# Exit code 2 means exposed, 1 means the watcher could not decide (network, parse, unreadable range).
#
# A red run opens (or updates) one tracking issue. The notify job is separate on purpose: it holds
# `issues: write`, so it never sits next to a job that runs `npm ci` and its install scripts.

on:
    schedule:
        - cron: '15 5 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: zammad-advisories-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    advisories:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        outputs:
            # `exposed` when the script exits 2 (a published advisory covers the pin); empty for any other failure.
            outcome: ${{ steps.watch.outputs.outcome }}
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  ignore-scripts: 'true' # the script needs `tsx` and `semver`, nothing built

            # The token only lifts GitHub's anonymous limit (60 requests an hour); it reads a public repository.
            - name: Compare the pinned Zammad with its advisories
              id: watch
              run: |
                  status=0
                  npm run security:zammad-advisories || status=$?
                  if [ "$status" -eq 2 ]; then echo "outcome=exposed" >> "$GITHUB_OUTPUT"; fi
                  exit "$status"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    advisories-notify:
        # One issue, updated in place. Shares `notify-failure` with `audit.yml`. No npm, no install.
        needs: [advisories]
        if: always() && contains(needs.*.result, 'failure')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            issues: write
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk
            - name: Open or update the advisory issue
              uses: ./.github/actions/notify-failure
              with:
                  # Two issues, by cause: a covered pin needs a bump, a failed watcher needs a look at the log.
                  title: ${{ needs.advisories.outputs.outcome == 'exposed' && 'Zammad security advisory covers the pinned version' || 'Zammad advisory watcher failed' }}
                  label: 'zammad-advisory'
                  workflow-name: 'Zammad advisories'
                  # The deadlines of docs/operate/zammad.md#security-releases, on the issue that asks for a bump only.
                  details: ${{ needs.advisories.outputs.outcome == 'exposed' && 'Bump the pinned Zammad image within 7 days for a critical or high advisory, 30 days for medium or low (docs/operate/zammad.md#security-releases).' || '' }}
