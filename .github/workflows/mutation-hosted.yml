name: Mutation (hosted)

# Full-sweep mutation profile for GitHub-hosted runners only.
# Keeps local mutation settings untouched by using a dedicated config + shard budget.
on:
    schedule:
        - cron: '30 3 * * 0'
    workflow_dispatch:
        inputs:
            force:
                description: 'Discard the hosted incremental cache and re-test every mutant'
                type: boolean
                default: false
            shard-lines:
                description: 'Target lines per shard for hosted matrix planning'
                type: string
                default: '300'

permissions:
    contents: read

concurrency:
    group: mutation-hosted-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 24

jobs:
    mutation-matrix-hosted:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            shards: ${{ steps.plan.outputs.shards }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  setup-mongod: 'true'

            - name: Plan hosted shards
              id: plan
              run: npx tsx scripts/mutation/shard-plan.ts --target-lines=${{ inputs['shard-lines'] || '300' }} >> "$GITHUB_OUTPUT"

    mutation-hosted:
        needs: mutation-matrix-hosted
        runs-on: ubuntu-latest
        timeout-minutes: 350
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJson(needs.mutation-matrix-hosted.outputs.shards) }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Restore hosted incremental cache for this shard
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: tmp/reports/stryker-incremental-hosted.json
                  key: mutation-hosted-incremental-${{ matrix.name }}-${{ github.run_id }}
                  restore-keys: |
                      mutation-hosted-incremental-${{ matrix.name }}-

            - name: Run hosted mutate scope for ${{ matrix.name }}
              env:
                  NODE_OPTIONS: --max-old-space-size=3072
              run: npx stryker run stryker.hosted.json --mutate '${{ matrix.mutate }}' ${{ inputs.force && '--force' || '' }}

            - name: Upload hosted shard report
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: mutation-hosted-${{ matrix.name }}
                  path: tmp/reports/mutation/
                  retention-days: 14

    mutation-hosted-merge:
        needs: [mutation-matrix-hosted, mutation-hosted]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Download hosted shard reports
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  pattern: mutation-hosted-shard-*
                  path: mutation-reports

            - name: Fold hosted shards into the baseline
              run: npm run mutation:check -- --merge --merge-dir=mutation-reports

            - name: Commit the updated baseline
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  if git diff --quiet -- mutation-baseline.json; then
                    echo "no change to mutation-baseline.json"
                    exit 0
                  fi
                  git add mutation-baseline.json
                  git commit -m "chore(mutation): fold hosted weekly sweep into the baseline"
                  git push

    mutation-hosted-notify:
        needs: [mutation-matrix-hosted, mutation-hosted, mutation-hosted-merge]
        if: always() && contains(needs.*.result, 'failure')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            issues: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Open or update the hosted weekly-failure issue
              uses: ./.github/actions/notify-failure
              with:
                  title: 'Weekly hosted mutation sweep failed'
                  label: 'mutation-sweep-hosted'
                  workflow-name: 'mutation-hosted'
