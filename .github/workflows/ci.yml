name: CI

# The merge gate. Everything here runs on every PR and on every push to main, and the aggregate
# `ci` job at the bottom is the single check to require in branch protection. That rule is a GitHub
# setting, not a file: nothing here enforces it until the repository owner creates it.
#
# Deliberately many small jobs rather than one `npm run complete`: they run in parallel, and
# a red square names the thing that broke (formatting? contract? integration?) without anyone
# opening a log. The trade is repeated checkout/setup/install boilerplate in each.
#
# The jobs fall into these groups:
#   - style           commitlint, lint, prettier
#   - contract        lint-openapi, lint-asyncapi, their per-module counterparts,
#                     asyncapi-breaking (PR-only — nothing to diff
#                     against on a push to main),
#                     spec-identity — the spec is valid, and the paired frontend still agrees with
#                     it. The bundles, api.generated/ and the *.generated.ts files are not committed — see
#                     `postinstall` in package.json — so there is nothing left to go stale for
#                     them to check.
#   - observability   alert-rules
#   - correctness     typecheck, test-unit, test-integration, test-contract, replicas, broker
#   - architecture    dependency-graph, docs
#   - container       container-gate — the same correctness gate again, but inside the image
#                     `docker/Dockerfile` actually ships, with no services and no network
#                     `boot` — the PRODUCTION image starts against a real Mongo, answers `/livez`, and
#                     its runtime user cannot write under `src/`
#                     `backup-drill` — the backup image backs up a real Mongo and the restore drill restores it
#                     `deploy-drill` — a bad deploy is refused and the previous image comes back
#                     `zammad` — a real Zammad boots from the `helpdesk` services of the production compose file,
#                     a token creates and reads a ticket, and the helpdesk drill passes on Docker
#                     `publish-image` — pushes the proven image to a registry; skipped until `vars.IMAGE_REGISTRY` is set
#   - pair            frontend-e2e — the paired frontend's Cypress suite against this backend
#   - supply chain    audit
#   - adoption        scaffold-measure — the module templates still pass on a scratch copy
#                     (outside the gate until its first green run — see its own comment)
#
# The slow and hunting suites live elsewhere on a schedule: mutation.yml, fuzz.yml (the deep pass —
# the shallow one is in `complete`) and order-random.yml.

on:
    # Run on every PR and on direct pushes to main.
    # This gives fast feedback for feature branches and protects main.
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    # Cancel stale runs for the same branch/PR when newer commits arrive.
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    commitlint:
        # Push-only backstop: lint the pushed range against the conventional-commit rules in
        # commitlint.config.cjs. It caught a commit made with --no-verify. A pull request is
        # squash-merged, so its own commits never land; its TITLE becomes the commit subject and is
        # linted by `pr-title.yml` instead.
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  # Need full history to walk the commit range.
                  fetch-depth: 0
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            - name: Lint commit messages
              run: npx commitlint --from ${{ github.event.before }} --to ${{ github.event.after }} --verbose

    lint:
        # ESLint over the whole repo, including the layering rules in eslint.config.ts that
        # forbid src/infrastructure/** from importing the application layers.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            - name: Lint
              run: npm run lint

    prettier:
        # Formatting only — a separate job from `lint` so "you forgot to format" and "you wrote
        # a lint error" are two different red squares.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            - name: Check formatting
              run: npm run prettier:check

    lint-openapi:
        # Spectral lints openapi.yaml against shared/contracts/spectral.yaml, the ruleset the
        # paired frontend lints its identical copy under.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            - name: Lint OpenAPI spec
              run: npm run lint:openapi

    lint-asyncapi:
        # The same, for the realtime contract that drives the SSE types.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            - name: Lint AsyncAPI spec
              run: npm run lint:asyncapi

            - name: Lint AsyncAPI names
              run: npm run lint:asyncapi:names

    spec-identity:
        # The cross-repo contract gate. Mirrors the job of the same name in the frontend.
        #
        # Two files exist in BOTH repos, byte-identical — the REST contract and the shared half
        # of the async contract. `scripts/pairing/spec-identity.ts` holds the list and says, per entry,
        # what a fork of it would break.
        #
        # Both are ASSEMBLED HERE from per-module fragments and copied to the frontend, so this
        # job asks whether the copies over there are still the bundles built here.
        # Until this job existed they were checked by nothing. `lint-openapi` and `lint-asyncapi`
        # lint THIS repo's copy and pass, because a forked spec is still a valid spec. What nobody
        # could see was the fork itself.
        #
        # The async contract's shared half sits at a different path in each repo (this repo's
        # `asyncapi.public.yaml` is the frontend's `asyncapi.yaml`), which is why the list is path
        # *pairs* rather than names — a same-path check could not express that one.
        #
        # The sibling is checked out read-only, at its default branch: the question is whether this
        # PR agrees with what the frontend has actually shipped, not with some pinned older copy.
        #
        # A fork in the pair is a genuine failure, but an unreachable sibling is an infrastructure
        # problem — so `checkout` is allowed to fail and the step below says which of the two
        # happened. A copy of this boilerplate that has no paired frontend should delete this job
        # rather than watch it fail forever.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Checkout paired frontend
              id: sibling
              continue-on-error: true
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  # Override with a repository variable when the pair lives elsewhere.
                  repository: ${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-vue-frontend' }}
                  path: .spec-sibling
                  # Only needed when the sibling is private; falls back to this repo's token.
                  token: ${{ secrets.SPEC_SIBLING_TOKEN || github.token }}
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Report an unreachable sibling
              if: steps.sibling.outcome == 'failure'
              run: |
                  echo "::error::Could not check out the paired frontend "\
                  "(${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-vue-frontend' }}). "\
                  "Set the SPEC_SIBLING_REPO variable, add a SPEC_SIBLING_TOKEN secret if it is "\
                  "private, or delete this job if this copy has no paired frontend."
                  exit 1

            - name: Setup
              uses: ./.github/actions/setup

            - name: Compare the shared contract files
              env:
                  FRONTEND_PATH: .spec-sibling
              run: npx tsx scripts/pairing/check-spec-identity.ts

    alert-rules:
        # The Prometheus alert rules: valid syntax (`check rules`) and the right answers
        # (`test rules`, cases in prometheus.alert-rules.test.yaml and prometheus.infra-rules.test.yaml). The image is the one
        # the compose stacks run, pinned by digest in `compose.yaml`. Then the Alertmanager routing, by `amtool`.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Check and test the rules
              # promtool ships in the Prometheus image; the folder is mounted read-only. The image
              # is the one `compose.yaml` pins for both stacks (same extraction as
              # `validate-configs.sh`), so a bump there cannot leave the rules checked by an older tool.
              run: |
                  image=$(sed -n -E 's#^ +image: (docker\.io/)?(prom/prometheus:[^ ]+).*#\2#p' compose.yaml | head -1)
                  test -n "$image" || { echo "::error::no prom/prometheus image in compose.yaml"; exit 1; }
                  docker run --rm --entrypoint promtool \
                    -v "$PWD/docker/observability:/obs:ro" \
                    "$image" \
                    check rules /obs/prometheus.alert-rules.yaml /obs/prometheus.infra-rules.yaml
                  docker run --rm --entrypoint promtool \
                    -v "$PWD/docker/observability:/obs:ro" \
                    "$image" \
                    test rules /obs/prometheus.alert-rules.test.yaml /obs/prometheus.infra-rules.test.yaml

            - name: Check and test the alert routing
              # Renders alertmanager.config.template.yaml for each knob combination, then
              # `amtool check-config` and `amtool config routes test` prove where each alert
              # lands. amtool ships in the Alertmanager image, read from `compose.yaml` like the one above.
              run: |
                  image=$(sed -n -E 's#^ +image: (docker\.io/)?(prom/alertmanager:[^ ]+).*#\2#p' compose.yaml | head -1)
                  test -n "$image" || { echo "::error::no prom/alertmanager image in compose.yaml"; exit 1; }
                  docker run --rm --entrypoint sh \
                    -v "$PWD/docker/observability:/obs:ro" \
                    "$image" \
                    /obs/alertmanager-routes-test.sh

            - name: Validate the Loki and production Alloy configs
              # Each config is checked with the image pinned in compose.yaml (the one both stacks use),
              # so an image bump and a config the new version refuses cannot land apart.
              run: bash docker/observability/validate-configs.sh

    lint-openapi-modules:
        # The per-module REST fragments, against the narrower ruleset they are bundled from.
        # `lint-openapi` above only sees the bundle, so a fragment can be invalid and still bundle.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            - name: Lint per-module OpenAPI fragments
              run: npm run lint:openapi:modules

    lint-asyncapi-modules:
        # The per-module async fragments, for the same reason as the REST ones above.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            - name: Lint per-module AsyncAPI fragments
              run: npm run lint:asyncapi:modules

    asyncapi-breaking:
        # asyncapi.public.yaml is partner-facing — GET /webhooks/events serves it, and a
        # subscriber builds against its event names and payload shapes. This fails the PR when a
        # change removes or narrows one instead of finding out from a subscriber's bug report.
        #
        # PR-only: on a push to main the code is already merged, and diffing HEAD against its own
        # already-updated origin/main answers nothing. The mutation-diff job (mutation.yml) draws
        # the same line for the same reason.
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  # `merge-base` needs both sides; a shallow clone has neither.
                  fetch-depth: 0
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            - name: Check for breaking changes to the public event catalogue
              run: npx tsx scripts/contracts/check-asyncapi-breaking.ts --base=origin/${{ github.base_ref }}

    replicas:
        # The suites that boot the app as N separate copies behind a proxy (`tests/replicas`), plus
        # the idle-Redis-client check. They are not in `complete` — several boots and a Redis, and
        # a container engine — so CI is where they run on every push. `complete:manual` is the local equivalent.
        # 45, not 20: the per-case jest budgets (boot 90 s x copies, rolling restart twice that) add
        # up to ~42 min if every case hung, so jest reports each hang by name before the job is cut.
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        services:
            redis:
                # The image `compose.yaml` pins for `cache` and `limits` (redis:8-alpine): the replicas
                # suite must run on the Redis that dev and production run. Move both together.
                image: docker.io/library/redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            - name: Shared state holds across copies
              # The service container above is already listening, so the suite uses it instead of
              # starting its own — see tests/replicas/support/redis.ts.
              env:
                  NODE_TEST_REDIS_URL: redis://127.0.0.1:6379
              run: npm run test:replicas

    broker:
        # The queue adapter against a real RabbitMQ — `queue.test.ts` mocks amqplib, so only this
        # shows what the broker does with the arguments. Not in `complete`: it needs a broker.
        # `complete:manual` is the local equivalent.
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        services:
            rabbitmq:
                # rabbitmq:4-management — the management plugin is what the suite reads queue
                # arguments back through and closes a connection with.
                image: rabbitmq@sha256:6ec83ef56205ce7cc6f8a762f28fdeeab50f52e8f79becbac5a3a4c7293a379a
                ports:
                    - 5672:5672
                    - 15672:15672
                # `gosu rabbitmq`: as root, a ping before the broker's first boot would create the
                # Erlang cookie root-owned, and the broker would die on `eacces`.
                options: >-
                    --health-cmd "gosu rabbitmq rabbitmq-diagnostics -q ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            - name: The queue adapter against a real broker
              # The service container above is already listening, so the suite uses it instead of
              # starting its own — see tests/broker/support/rabbitmq.ts.
              env:
                  NODE_TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672
              run: npm run test:broker

    dependency-graph:
        # The two questions ESLint cannot answer, because it sees one file's imports and no
        # further: does any cycle exist, and can a tier REACH something it may not import.
        # The walls themselves are enforced by eslint-plugin-boundaries in the lint job.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            # The same three passes `npm run check` makes: the whole graph, the module walls, and
            # the clean-checkout bootstrap guard.
            # https://github.com/sverweij/dependency-cruiser/blob/main/doc/cli.md
            - name: Check the dependency graph
              run: |
                  npx depcruise src tests --output-type err
                  npx depcruise src/modules --config .dependency-cruiser.modules.cjs --output-type err
                  npx depcruise scripts/contracts/build-bundles.ts --config .dependency-cruiser.bootstrap.cjs --output-type err

    docs:
        # The documentation site is a build like any other: VitePress fails on a dead link between
        # pages, which is the only thing checking that the cross-references in `docs/` still
        # resolve.
        #
        # `regenerate --check` is the second half: every generated page (the module graph, the role
        # tables, the dependency tables, the jobs and rate-limit tables) and every other generated
        # file is compared with a fresh run, so an edit nobody regenerated for fails here rather
        # than leaving a page that quietly describes last month's code.
        #
        # `check-references.ts` answers the third question neither of those can: a dead LINK
        # fails the build, a stale table fails the check, but a page naming a source file that no
        # longer exists reads as current to everyone who has not opened the tree.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            - name: Check every generated artifact is current
              run: npx tsx scripts/regenerate-artifacts.ts --check

            - name: Check every path the docs cite still exists
              run: npx tsx scripts/docs/check-references.ts

            - name: Build the documentation site
              run: npm run docs:build

    typecheck:
        # `tsc --noEmit` — types only.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            - name: Type check
              run: npm run ts-check

    test-unit:
        # The fast suites, unit and cross-cutting: pure functions, services and repositories
        # against in-memory Mongo. One parallel jest pass gives the verdict and the JSON report.
        # Coverage is not measured anywhere: the mutation score is the test-quality number.
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            # `run-suite.ts --unsharded` takes its worker count from jest.config.js, which reads
            # this. The runner has 4 vCPUs; one is left for mongod and the OS.
            JEST_WORKERS: 3
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  setup-mongod: 'true'

            # `--json --outputFile` is jest's per-test report; `mkdir -p` first, because jest does
            # not create the parent directory and `tmp/` is gitignored.
            - name: Run unit tests with the JSON report
              run: |
                  mkdir -p tmp/reports
                  npm run test:unit:report

            - name: Per-module test report
              # Prints the rollup of the JSON the run above wrote into the job log, so a red build
              # names the MODULE before anyone opens an artifact.
              if: always()
              run: npm run test:report

            - name: Upload test report
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: test-report-unit
                  path: tmp/reports/test-report.json
                  retention-days: 14
                  if-no-files-found: ignore

    test-integration:
        # No Mongo/Redis service is started here: today's integration suite only
        # exercises an in-process Express app (see tests/integration/app-health.test.ts).
        # Add service containers here if a future test needs a real database/cache.
        #
        # 45 minutes: the suite runs in band, one file at a time, ~2000 cases. Measured on this
        # runner it takes about 20 minutes, so the budget is the contract job's, which has the
        # same shape.
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  setup-mongod: 'true'

            - name: Run integration tests
              run: npm run test:integration

    test-contract:
        # Drives the real Express app over HTTP (supertest + in-memory Mongo) and validates every
        # response against openapi.yaml, including `additionalProperties: false`.
        #
        # This is the gate for the over-serialization class — a field appearing on a response
        # without being declared in the spec fails here. The generated Zod schemas do not cover it:
        # nothing in this service validates a *response* with Zod (they guard request bodies), and
        # they are generated non-strict, so unknown keys would be stripped rather than rejected.
        #
        # No Mongo/Redis service container is needed: this suite uses mongodb-memory-server against
        # the setup action's preinstalled `mongod`, and the cache adapter treats an unreachable Redis
        # as a miss.
        #
        # 45 minutes: the suite runs in band, one file at a time, and on this runner it takes
        # about 25-30 (tests/contract/request-contract.test.ts alone is ~7.5), twice what the
        # same files take on a developer machine. A 20-minute budget cancelled it mid-run.
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  setup-mongod: 'true'

            - name: Run contract tests
              run: npm run test:contract

    test-contract-cookie:
        # The contract suite again, with `NODE_SESSION_MODE=cookie`: the same routes, the same spec,
        # signed in by a session id in a cookie instead of an access token. `test-contract` above
        # covers the default `jwt` mode, so between them both ways of staying signed in answer every
        # operation as the spec says. Same budget and same setup as that job, for the same suite.
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  setup-mongod: 'true'

            - name: Run contract tests in cookie mode
              run: npm run test:contract:cookie

            - name: Run the journeys in cookie mode
              # `npm run test:integration` runs them in jwt mode; this is the other mode.
              run: npm run test:journeys:cookie

    resolve-frontend:
        # One `git ls-remote` per push, so every `frontend-e2e` slice checks out the SAME frontend
        # commit. Slices start minutes apart (20 concurrent jobs on this plan); a frontend that
        # moved in between would make slices compute different splits, and a spec would run twice
        # or never — nothing in the runner can tell.
        runs-on: ubuntu-latest
        timeout-minutes: 2
        permissions:
            contents: read
        outputs:
            sha: ${{ steps.resolve.outputs.sha }}
        steps:
            - name: Resolve the paired frontend's default branch
              id: resolve
              env:
                  REPOSITORY: ${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-vue-frontend' }}
                  TOKEN: ${{ secrets.SPEC_SIBLING_TOKEN || github.token }}
              run: |
                  # `HEAD` is the remote's default branch. An unreachable repo leaves the sha
                  # empty, which would silently unpin every slice, so it fails here instead.
                  sha=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" HEAD | cut -f1 || true)
                  test -n "$sha" || { echo "::error::could not resolve sibling HEAD"; exit 1; }
                  echo "sha=${sha}" >> "$GITHUB_OUTPUT"

    frontend-e2e:
        # The paired frontend's own Cypress suite, against THIS change's backend. The frontend runs
        # the same suite against the backend's main; only this job can say whether a backend PR
        # breaks the app people actually use before it merges, rather than the morning after.
        #
        # Demo profile: the frontend's shard runner boots one `npm run demo` of this checkout per
        # slice (in-memory Mongo, cache and queue off) — see the frontend's
        # `scripts/e2e/run-shards.ts`. The frontend is checked out at the commit `resolve-frontend`
        # pinned, its default branch: the version a merge here would meet.
        #
        # A matrix, ONE SLICE PER RUNNER: the whole suite on one 4-vCPU runner measured ~178 min of
        # Cypress time against a 75-minute limit, so every run was cancelled. `E2E_SLICE` names the
        # slice this job owns (the frontend's boilerplate-vue-frontend/docs/build/live-e2e.md#ci-slices): shard 1..5 of its
        # balanced split, plus `antibot`, the specs that need the human-challenge provider on. This
        # job is jwt only; the frontend's own CI covers both session modes. The slice count (5) is
        # also in `E2E_SLICE` below; change both. The frontend must be pushed first: a runner
        # without `E2E_SLICE` support would run the whole suite in every slice.
        needs: resolve-frontend
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4, 5, antibot]
        permissions:
            contents: read
        env:
            # Where the frontend lands, beside this checkout rather than inside its tree walks.
            FRONTEND_PATH: .frontend
            # Read by the frontend's `scripts/e2e/run-shards.ts`.
            E2E_SLICE: ${{ matrix.shard == 'antibot' && 'antibot' || format('{0}/5', matrix.shard) }}
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            # Installs this backend's dependencies and a system `mongod` for the demo profile's
            # in-memory database — the same preamble the test jobs use.
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  setup-mongod: 'true'

            - name: Checkout paired frontend
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  # Override with a repository variable when the pair lives elsewhere.
                  repository: ${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-vue-frontend' }}
                  path: ${{ env.FRONTEND_PATH }}
                  ref: ${{ needs.resolve-frontend.outputs.sha }}
                  # Only needed when the sibling is private; falls back to this repo's token.
                  token: ${{ secrets.SPEC_SIBLING_TOKEN || github.token }}
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Cache Cypress binary
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('.frontend/package-lock.json') }}
                  restore-keys: |
                      cypress-${{ runner.os }}-

            - name: Install frontend dependencies
              working-directory: ${{ env.FRONTEND_PATH }}
              run: npm ci

            # BACKEND_PATH: this checkout, absolute — the frontend resolves it from its own cwd.
            # BACKEND_DEMO_COMMAND: how its shard runner boots each demo backend; `{backend}` is
            # replaced with BACKEND_PATH. Same value the frontend's own CI uses.
            - name: Run the frontend e2e suite against this backend
              working-directory: ${{ env.FRONTEND_PATH }}
              env:
                  BACKEND_PATH: ${{ github.workspace }}
                  BACKEND_DEMO_COMMAND: npm --prefix {backend} run demo
              run: npm run test:e2e

            - name: Upload failing-shard logs
              # `cancelled()` too: the 45-minute budget cancels the job, and a plain `failure()`
              # skips the upload on exactly the run that most needs the logs.
              if: failure() || cancelled()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: frontend-e2e-shard-logs-${{ matrix.shard }}
                  path: .frontend/reports/e2e/
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload Cypress screenshots
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: frontend-e2e-screenshots-${{ matrix.shard }}
                  path: .frontend/tests/e2e/screenshots
                  retention-days: 14
                  if-no-files-found: ignore

    container-gate:
        # Proves the CONTAINER LANE, not just the code: builds the `dev` stage of `docker/Dockerfile`
        # and runs `npm run complete` inside it — no compose, no service containers, no network — so a
        # passing run means the image genuinely carries everything it needs, baked `mongod`
        # included. This is the "hermetic" mode.
        #
        # Docker, not podman: runners ship Docker, and `CONTAINER_ENGINE` exists precisely so
        # switching is a one-variable difference — the claim under test is about the image, not
        # about which engine built it.
        #
        # It duplicates every other job here on purpose: they answer WHICH thing broke, this one
        # answers whether the container lane still works AT ALL.
        #
        # This job is what makes CI cover the whole gate (a `--no-verify` commit or a fork PR still
        # runs `npm run complete`): keep it in the `ci` job's `needs:`.
        #
        # 120 minutes: `npm run complete` is every other job's work in one container, one suite
        # after another, with two jest workers. Measured on this runner: the static checks take 3
        # minutes, unit 17, cross-cutting 3 and integration ~16, before contract and fuzz.
        runs-on: ubuntu-latest
        timeout-minutes: 120
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            # `--target dev`: a bare build ends at `runtime`, which has no tests and no devDependencies.
            - name: Build the dev/test image
              run: docker build -f docker/Dockerfile --target dev -t boilerplate-api-gate:${{ github.sha }} .

            # `-v .git:ro`: the build context leaves `.git` out, and lint's `local/comment-links` rule runs
            # `git ls-files`. `safe.directory`: the checkout is the runner's uid and the container runs as
            # root, which git >= 2.35.2 refuses as "dubious ownership"; GIT_CONFIG_* sets it without a file.
            - name: Run the gate inside it — no services, no network
              run: >
                  docker run --rm --network=none
                  -v "$PWD/.git:/app/.git:ro"
                  -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/app
                  boilerplate-api-gate:${{ github.sha }} npm run complete

    boot:
        # Proves the image we SHIP starts: the `runtime` stage of `docker/Dockerfile` against a real Mongo (queue
        # and cache are left out, they degrade), with the fail-closed env set, `/livez` answering, and
        # the `node` user unable to write under `src/`. `container-gate` above builds the dev/test
        # image, so nothing else here ever boots the production one.
        #
        # Not in `image-scan.yml`: that workflow is path-filtered and Monday-only, and a boot
        # check that skips most pushes proves little. The same script runs on a laptop:
        # `docker build -f docker/Dockerfile --target runtime -t boot-check . && docker/boot-check.sh boot-check`.
        # Not in the `ci` job's `needs:` until its first real run on GitHub has passed.
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Build the production image
              run: docker build -f docker/Dockerfile --target runtime -t boot-check:${{ github.sha }} .

            - name: Boot it and check the runtime user
              run: docker/boot-check.sh boot-check:${{ github.sha }}

    backup-drill:
        # Proves BACKUP and RESTORE end to end, not just their config: a replica-set Mongo started
        # as compose.production.yaml starts it, the backup image dumping it through the
        # `backup` role into a local repository, deduplication, the restore drill into a throwaway
        # Mongo, the Gatus heartbeat going green and red, a damaged repository failing the drill,
        # and the second machine's append-only server (a delete is refused, its upkeep prunes).
        # The same script runs on a laptop: `npm run backup:drill`. Plain `docker run` on one
        # private network, no published port.
        # Not in the `ci` job's `needs:` until its first real run on GitHub has passed.
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Build the images, back up, restore, compare
              run: bash docker/backup/drill.sh

    deploy-drill:
        # Proves a BAD DEPLOY IS UNDONE end to end: `docker/deploy.sh` on the real production compose
        # file with a throwaway client. A good image comes up healthy, a broken one (the same image
        # with a CMD that exits) is refused and the first image runs again, and `--rollback` returns
        # to the first image after a second good one. The same script runs on a laptop:
        # `npm run deploy:drill` (Podman by default; this runner has Docker).
        # Not in the `ci` job's `needs:` until its first real run on GitHub has passed.
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            CONTAINER_ENGINE: docker
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Deploy, break, roll back
              run: bash docker/deploy-drill.sh

    zammad:
        # A real Zammad, booted from the `helpdesk` services of compose.production.yaml BY NAME, so the
        # pins CI proves are the pins an operator runs: a Dependabot bump is proven before it merges.
        # Seeded by docker/zammad/autowizard.drill.json (`AUTOWIZARD_JSON`); the API token is minted with
        # one basic-auth `POST /api/v1/user_access_token` (the wizard's own token is not an API token).
        # Then a smoke check (the token creates and reads a ticket), and `npm run helpdesk:drill` for the
        # client-address, `Authorization` and geo-lookup checks on Docker (the same script runs on
        # Podman on a laptop). The boot time goes to the job summary: if a boot is over ~10 minutes or
        # flaky, this moves to a schedule and to pin-bump PRs (docs/operate/zammad.md).
        # Not in the `ci` job's `needs:` until its first real run on GitHub has passed.
        runs-on: ubuntu-latest
        timeout-minutes: 40
        permissions:
            contents: read
        env:
            CONTAINER_ENGINE: docker
            COMPOSE_PROJECT_NAME: boilerplate-zammad-ci
            ZAMMAD_PORT: '3060'
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            - name: Make a throwaway client for the stack
              # Every secret the compose file names gets a random value (an empty file is "unset" for the
              # optional ones, and Zammad reads only its own three). The image variable is required by the
              # file's interpolation and only `app` runs it, so Zammad's own image stands in.
              run: |
                  mkdir -p "clients/$COMPOSE_PROJECT_NAME/secrets"
                  grep -oE 'secrets/[a-z_]+$' compose.production.yaml | cut -d/ -f2 | sort -u | while read -r name; do
                      openssl rand -hex 32 >"clients/$COMPOSE_PROJECT_NAME/secrets/$name"
                      chmod 0644 "clients/$COMPOSE_PROJECT_NAME/secrets/$name"
                  done
                  printf 'COMPOSE_PROFILES=helpdesk\n' >"clients/$COMPOSE_PROJECT_NAME/.env"
                  {
                      echo "COMPOSE=$CONTAINER_ENGINE compose --env-file clients/$COMPOSE_PROJECT_NAME/.env -f compose.yaml -f compose.production.yaml"
                      echo "APP_IMAGE=$(sed -n -E 's/^x-zammad-image: &zammad-image (.+)$/\1/p' compose.production.yaml)"
                      echo "ZAMMAD_AUTOWIZARD_JSON=$(base64 -w0 docker/zammad/autowizard.drill.json)"
                  } >>"${GITHUB_ENV:-/dev/stderr}"

            - name: Boot Zammad and run the seed
              # `zammad-init` migrates and exits 0; nginx answers once Rails is healthy. A cold pull and
              # the first migration take minutes. The wait is bounded at ten minutes, the line H13 drew.
              run: |
                  start=$(date +%s)
                  $COMPOSE up -d zammad-init zammad-nginx zammad-scheduler zammad-websocket
                  init=unknown
                  for _ in $(seq 1 120); do
                      id=$($CONTAINER_ENGINE ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" --filter label=com.docker.compose.service=zammad-init | head -n 1)
                      init=$($CONTAINER_ENGINE inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$id" 2>/dev/null || true)
                      if [ "$init" = "exited 0" ] && curl -fsS "http://127.0.0.1:$ZAMMAD_PORT/api/v1/getting_started" >/dev/null 2>&1; then break; fi
                      sleep 5
                  done
                  seconds=$(($(date +%s) - start))
                  if [ "$init" != "exited 0" ]; then
                      echo "zammad-init: $init"
                      printf '### Zammad boot\n\nTimed out after **%s s** (zammad-init: %s).\n' "$seconds" "$init" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
                      exit 1
                  fi
                  # Running the wizard creates the admin and applies the file's settings, once.
                  curl -fsS "http://127.0.0.1:$ZAMMAD_PORT/api/v1/getting_started/auto_wizard" | grep -q '"auto_wizard_success":true'
                  seconds=$(($(date +%s) - start))
                  echo "Zammad booted and seeded in ${seconds}s"
                  printf '### Zammad boot\n\nBooted and seeded in **%s s** (from compose up to a seeded wizard).\n' "$seconds" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"

            - name: Mint the API token and smoke-test it
              # The token must be able to create a ticket and read it back: that is all the adapter does.
              # Basic auth is only for this one call; everything after it carries the token.
              # `field <name>` prints one top-level field of the JSON on stdin (node, so no `jq` to install).
              run: |
                  base="http://127.0.0.1:$ZAMMAD_PORT/api/v1"
                  field() { node -e 'let b="";process.stdin.on("data",(c)=>{b+=c}).on("end",()=>{const v=JSON.parse(b)[process.argv[1]];if(v===undefined){process.exit(1)}process.stdout.write(String(v))})' "$1"; }
                  token=$(curl -fsS -u 'drill-admin@example.com:Drill-Admin-Pass-2026' -H 'Content-Type: application/json' \
                      -d '{"name":"ci-smoke","permission":["ticket.agent"]}' "$base/user_access_token" | field token)
                  echo "::add-mask::$token"
                  created=$(curl -fsS -H "Authorization: Token token=$token" -H 'Content-Type: application/json' \
                      -d '{"title":"ci smoke","group":"Users","customer_id":"guess:ci-smoke@example.com","article":{"subject":"ci smoke","body":"hello","type":"note","internal":false}}' \
                      "$base/tickets" | field id)
                  title=$(curl -fsS -H "Authorization: Token token=$token" "$base/tickets/$created" | field title)
                  [ "$title" = "ci smoke" ] || { echo "read back '$title'"; exit 1; }
                  echo "the token created ticket $created and read it back"

            - name: Show the Zammad logs when a step failed
              if: failure()
              run: $COMPOSE logs --no-color --tail 200 zammad-init zammad-railsserver zammad-nginx

            - name: Take the smoke stack down
              # The drill below boots its own, and two Zammads at once are an avoidable memory bill.
              # The client directory holds the throwaway secrets: it goes too.
              if: always()
              run: |
                  $COMPOSE down -v --remove-orphans
                  rm -rf "clients/$COMPOSE_PROJECT_NAME"

            - name: The helpdesk drill (client address, Authorization, geo lookup)
              # Docker leg of H20. Real Chromium (preinstalled on this runner) signs in through the drill's edge proxy.
              run: npm run helpdesk:drill

    publish-image:
        # Builds the production image ONCE per merge and pushes it, so `docker/deploy.sh` can pull the
        # exact bytes CI proved by digest instead of rebuilding on the host. Switched OFF until a
        # registry exists: with `vars.IMAGE_REGISTRY` unset the job is skipped, not failed, and a run
        # shows it as skipped. Any OCI registry works; none is named here on purpose.
        # Inputs (repository settings, set once a registry is picked):
        #   vars.IMAGE_REGISTRY         host and namespace, e.g. `registry.example/team`
        #   vars.IMAGE_REGISTRY_USER    the login name
        #   secrets.IMAGE_REGISTRY_TOKEN the login token or password
        #   vars.INSTALL_CHROMIUM       `true` to bake Chromium in (invoice PDFs); default false
        # Needs `ci` (the whole merge gate) and `boot` (the production image starts). Runbook:
        # docs/operate/deploy-and-rollback.md#with-a-registry
        # Not in the `ci` job's `needs:`: a registry outage must never turn the merge gate red.
        if: >-
            github.event_name == 'push' && github.ref == 'refs/heads/main'
            && vars.IMAGE_REGISTRY != ''
            && needs.ci.result == 'success' && needs.boot.result == 'success'
        needs:
            - ci
            - boot
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            # Buildx: the default docker driver cannot write provenance or SBOM attestations.
            # https://github.com/docker/setup-buildx-action
            - name: Set up Buildx
              uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

            # Logs in to the registry named by `registry`; the token never reaches a build step.
            # https://github.com/docker/login-action
            - name: Log in to the registry
              uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
              with:
                  registry: ${{ vars.IMAGE_REGISTRY }}
                  username: ${{ vars.IMAGE_REGISTRY_USER }}
                  password: ${{ secrets.IMAGE_REGISTRY_TOKEN }}

            # `file` and `target`: the `runtime` stage of the one Dockerfile. `push`: send it. `provenance` / `sbom`: attach the build
            # attestation and the software bill of materials to the image. `build-args`: Chromium is opt-in.
            # https://github.com/docker/build-push-action
            - name: Build and push
              id: push
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  context: .
                  file: docker/Dockerfile
                  target: runtime
                  push: true
                  provenance: true
                  sbom: true
                  build-args: |
                      INSTALL_CHROMIUM=${{ vars.INSTALL_CHROMIUM || 'false' }}
                  tags: ${{ vars.IMAGE_REGISTRY }}/boilerplate-api:${{ github.sha }}

            # The digest is what `docker/deploy.sh <client> <ref>` takes: a tag can move, a digest cannot.
            - name: Print the digest
              env:
                  REF: ${{ vars.IMAGE_REGISTRY }}/boilerplate-api@${{ steps.push.outputs.digest }}
              run: |
                  {
                    echo '### Pushed image'
                    echo
                    echo 'Deploy it with:'
                    echo
                    echo '```'
                    echo "docker/deploy.sh <client> $REF"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

    audit:
        # Reports known moderate-and-above vulnerabilities in production dependencies.
        #
        # `moderate`, not `high`: every advisory this repo has actually had to act on was moderate
        # or low (mongoose prototype pollution, qs, body-parser), so a high-only threshold was red
        # for the one chain nobody could fix and silent about the three that mattered.
        #
        # Deliberately NOT in the `ci` gate's `needs:` below: a transitive finding with no
        # non-breaking fix would otherwise block every merge indefinitely with nothing anyone here
        # can do about it in the same PR. This still runs on every push/PR and still shows red when
        # it fails — an alert, not a gate. That only stays useful while it is usually GREEN: if an
        # unfixable advisory ever parks this job on red, add an allowlist keyed by advisory id
        # rather than raising the threshold back up.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup

            - name: Audit dependencies
              run: npm audit --omit=dev --audit-level=moderate

    scaffold-measure:
        # Scaffolds two modules in a scratch copy and runs ts-check, the lint, the modules' own
        # tests and the cross-cutting suite on them, so the templates cannot drift from `example`
        # unseen. Report-only, and not in the `ci` gate's `needs:` until it has had one green run
        # on GitHub.
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  setup-mongod: 'true'

            - name: Measure the scaffolder
              run: npm run measure:scaffold

    ci:
        # Single status check to require in branch protection, so adding/renaming
        # jobs above doesn't require updating the required-checks list every time.
        if: always()
        needs:
            - commitlint
            - lint
            - prettier
            - lint-openapi
            - lint-asyncapi
            - alert-rules
            - spec-identity
            - lint-openapi-modules
            - lint-asyncapi-modules
            - asyncapi-breaking
            - typecheck
            - replicas
            - broker
            - dependency-graph
            - docs
            - test-unit
            - test-integration
            - test-contract
            - test-contract-cookie
            - container-gate
            - resolve-frontend
            - frontend-e2e
            # `boot`, `backup-drill`, `deploy-drill`, `zammad`, `publish-image`, `audit` and (until its first
            # green run) `scaffold-measure` are deliberately excluded — see their own comments above.
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write # `notify-failure` opens or updates the tracking issue
        steps:
            - name: Check all jobs succeeded
              run: |
                  if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
                      echo "One or more required jobs failed."
                      exit 1
                  fi

            # A red push to main is the one failure no pull request is open to show. Without this step
            # it was seen by nobody, and a suite stayed red for weeks. Pull requests do not notify:
            # their own check is the signal. One issue, updated in place, like the scheduled workflows.
            - name: Checkout
              if: failure() && !cancelled() && github.event_name == 'push'
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Open or update the main-is-red issue
              if: failure() && !cancelled() && github.event_name == 'push'
              uses: ./.github/actions/notify-failure
              with:
                  title: 'CI is failing on main'
                  label: 'ci-main-red'
                  workflow-name: 'CI'
