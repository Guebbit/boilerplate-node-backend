name: CI

# The merge gate. Everything here runs on every PR and on every push to main, and the aggregate
# `ci` job at the bottom is the single check to require in branch protection. That rule is a GitHub
# setting, not a file: nothing here enforces it until the repository owner creates it.
#
# Deliberately many small jobs rather than one `npm run complete`: they run in parallel, and
# a red square names the thing that broke (formatting? contract? integration?) without anyone
# opening a log. The trade is repeated checkout/setup/install boilerplate in each.
#
# The jobs fall into four groups:
#   - style           commitlint, lint, prettier
#   - contract        lint-openapi, lint-asyncapi, their per-module counterparts,
#                     contracts-bundle-freshness, asyncapi-breaking (PR-only — nothing to diff
#                     against on a push to main),
#                     spec-identity — the spec is valid, and the paired frontend still agrees with
#                     it. api/ and src/types/asyncapi.generated.ts are no longer committed — see
#                     `postinstall` in package.json — so there is nothing left to go stale for
#                     them to check.
#   - correctness     typecheck, build, test-unit, test-integration, test-contract, cluster, broker
#   - architecture    dependency-graph, docs
#   - container       container-gate — the same correctness gate again, but inside the image
#                     `docker/Dockerfile` actually ships, with no services and no network
#   - pair            frontend-e2e — the paired frontend's Cypress suite against this backend
#   - supply chain    audit
#   - adoption        demo-strip-measure — report-only, like audit
#
# The slow and hunting suites live elsewhere on a schedule: mutation.yml, fuzz.yml (the deep pass —
# the shallow one is in `complete`), schemathesis.yml and order-random.yml.

on:
    # Run on every PR and on direct pushes to main.
    # This gives fast feedback for feature branches and protects main.
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    # Cancel stale runs for the same branch/PR when newer commits arrive.
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 24

jobs:
    commitlint:
        # Lint commit messages against the conventional-commit rules in commitlint.config.cjs.
        # Runs on PRs (gates the merge) and on push to main (backstop for commits made
        # with --no-verify or on a machine where the Husky hook never installed).
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  # Need full history to walk the commit range.
                  fetch-depth: 0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Lint commit messages (PR)
              if: github.event_name == 'pull_request'
              run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

            - name: Lint commit messages (push)
              if: github.event_name == 'push'
              run: npx commitlint --from ${{ github.event.before }} --to ${{ github.event.after }} --verbose

    lint:
        # ESLint over the whole repo, including the layering rules in eslint.config.ts that
        # forbid src/infrastructure/** from importing the application layers.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Lint
              run: npm run lint

    prettier:
        # Formatting only — a separate job from `lint` so "you forgot to format" and "you wrote
        # a lint error" are two different red squares.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Check formatting
              run: npm run prettier:check

    lint-openapi:
        # Spectral lints openapi.yaml against shared/contracts/spectral.yaml, the ruleset the
        # paired frontend lints its identical copy under.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Lint OpenAPI spec
              run: npm run lint:openapi

    lint-asyncapi:
        # The same, for the realtime contract that drives the SSE types.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Lint AsyncAPI spec
              run: npm run lint:asyncapi

    spec-identity:
        # The cross-repo contract gate. Mirrors the job of the same name in the frontend.
        #
        # Two files exist in BOTH repos, byte-identical — the REST contract and the shared half
        # of the async contract. `scripts/pairing/spec-identity.ts` holds the list and says, per entry,
        # what a fork of it would break.
        #
        # Both are ASSEMBLED HERE from per-module fragments and copied to the frontend, so this
        # job asks whether the copies over there are still the bundles built here.
        # `contracts-bundle-freshness` asks the other half of the question — whether the two
        # committed bundles (`asyncapi.yaml`, `asyncapi.public.yaml`) still match the fragments
        # they're built from — by diffing them against what `Setup`'s own `npm ci` just rebuilt.
        # `openapi.yaml` is gitignored, so it has no committed copy for that job to diff.
        #
        # Until this job existed they were checked by nothing. `lint-openapi` and `lint-asyncapi`
        # lint THIS repo's copy and pass, because a forked spec is still a valid spec. What nobody
        # could see was the fork itself.
        #
        # The async contract's shared half sits at a different path in each repo (this repo's
        # `asyncapi.public.yaml` is the frontend's `asyncapi.yaml`), which is why the list is path
        # *pairs* rather than names — a same-path check could not express that one.
        #
        # The sibling is checked out read-only, at its default branch: the question is whether this
        # PR agrees with what the frontend has actually shipped, not with some pinned older copy.
        #
        # A fork in the pair is a genuine failure, but an unreachable sibling is an infrastructure
        # problem — so `checkout` is allowed to fail and the step below says which of the two
        # happened. A copy of this boilerplate that has no paired frontend should delete this job
        # rather than watch it fail forever.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Checkout paired frontend
              id: sibling
              continue-on-error: true
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  # Override with a repository variable when the pair lives elsewhere.
                  repository: ${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-vue-frontend' }}
                  path: .spec-sibling
                  # Only needed when the sibling is private; falls back to this repo's token.
                  token: ${{ secrets.SPEC_SIBLING_TOKEN || github.token }}

            - name: Report an unreachable sibling
              if: steps.sibling.outcome == 'failure'
              run: |
                  echo "::error::Could not check out the paired frontend "\
                  "(${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-vue-frontend' }}). "\
                  "Set the SPEC_SIBLING_REPO variable, add a SPEC_SIBLING_TOKEN secret if it is "\
                  "private, or delete this job if this copy has no paired frontend."
                  exit 1

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Compare the shared contract files
              env:
                  FRONTEND_PATH: .spec-sibling
              run: npm run check:spec-identity

    lint-openapi-modules:
        # The per-module REST fragments, against the narrower ruleset they are bundled from.
        # `lint-openapi` above only sees the bundle, so a fragment can be invalid and still bundle.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Lint per-module OpenAPI fragments
              run: npm run lint:openapi:modules

    lint-asyncapi-modules:
        # The per-module async fragments, for the same reason as the REST ones above.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Lint per-module AsyncAPI fragments
              run: npm run lint:asyncapi:modules

    contracts-bundle-freshness:
        # The committed bundles are what their fragments say they are. Without this, a merged
        # fragment edit leaves `asyncapi.yaml`/`asyncapi.public.yaml` describing the previous
        # version of the API. `openapi.yaml` carries no such check here — it is gitignored, so
        # there is nothing committed to diff it against; `lint-openapi` still proves it assembles.
        #
        # `Setup`'s `npm ci` already runs `postinstall`, which reassembles every bundle from its
        # fragments before this job's own step runs. Running `check:contracts-bundle` here after
        # that would only compare the just-rebuilt file with itself — green on every push, whether
        # or not anyone remembered to re-bundle before committing. `git diff` against what the
        # checkout actually has on disk is the real question.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Check the committed bundles are current
              run: |
                  if ! git diff --exit-code -- asyncapi.yaml asyncapi.public.yaml; then
                      echo "asyncapi.yaml / asyncapi.public.yaml are stale. Run 'npm run contracts:bundle' and commit the result."
                      exit 1
                  fi

    asyncapi-breaking:
        # asyncapi.public.yaml is partner-facing — GET /webhooks/events serves it, and a
        # subscriber builds against its event names and payload shapes. This fails the PR when a
        # change removes or narrows one instead of finding out from a subscriber's bug report.
        #
        # PR-only: on a push to main the code is already merged, and diffing HEAD against its own
        # already-updated origin/main answers nothing. The mutation-diff job (mutation.yml) draws
        # the same line for the same reason.
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  # `merge-base` needs both sides; a shallow clone has neither.
                  fetch-depth: 0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Check for breaking changes to the public event catalogue
              run: npm run check:asyncapi-breaking -- --base=origin/${{ github.base_ref }}

    cluster:
        # The only suite that boots `src/cluster.ts` and forks real workers. It is not in
        # `complete` — two clusters and a Redis is ~25s and needs a container engine — so CI is
        # where it runs on every push. `complete:manual` is the local equivalent.
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        services:
            redis:
                # redis:7-alpine
                image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Rate limiting spends one budget across workers
              # The service container above is already listening, so the suite uses it instead of
              # starting its own — see tests/cluster/support/redis.ts.
              env:
                  NODE_TEST_REDIS_URL: redis://127.0.0.1:6379
              run: npm run test:cluster

    broker:
        # The queue adapter against a real RabbitMQ — `queue.test.ts` mocks amqplib, so only this
        # shows what the broker does with the arguments. Not in `complete`: it needs a broker.
        # `complete:manual` is the local equivalent.
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        services:
            rabbitmq:
                # rabbitmq:4-management — the management plugin is what the suite reads queue
                # arguments back through and closes a connection with.
                image: rabbitmq@sha256:6ec83ef56205ce7cc6f8a762f28fdeeab50f52e8f79becbac5a3a4c7293a379a
                ports:
                    - 5672:5672
                    - 15672:15672
                options: >-
                    --health-cmd "rabbitmq-diagnostics -q ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: The queue adapter against a real broker
              # The service container above is already listening, so the suite uses it instead of
              # starting its own — see tests/broker/support/rabbitmq.ts.
              env:
                  NODE_TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672
              run: npm run test:broker

    dependency-graph:
        # The two questions ESLint cannot answer, because it sees one file's imports and no
        # further: does any cycle exist, and can a tier REACH something it may not import.
        # The walls themselves are enforced by eslint-plugin-boundaries in the lint job.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Check the dependency graph
              run: npm run check:dependencies

    docs:
        # The documentation site is a build like any other: VitePress fails on a dead link between
        # pages, which is the only thing checking that the cross-references in `docs/` still
        # resolve. `check:docs-graph` is the second half — `docs/modules/index.md` publishes the
        # module graph, generated from the same dependency-cruiser output the job above uses, so a
        # new cross-module import that nobody regenerated the page for fails here rather than
        # leaving a diagram that quietly describes last month's architecture.
        #
        # `check:docs-references` answers the third question neither of those can: a dead LINK
        # fails the build, a stale GRAPH fails the check, but a page naming a source file that no
        # longer exists reads as current to everyone who has not opened the tree.
        #
        # `check:docs-roles` is the same shape as `check:docs-graph`, over the permission model
        # instead of the dependency graph: `docs/demo-ecommerce/index.md`'s role tables are
        # generated from `holdsKey` and `shared/authorization-roles.yaml`, and a role edit that
        # nobody regenerated the page for fails here rather than leaving a table that quietly
        # describes a permission model the code no longer has.
        #
        # `check:docs-dependencies` is the same shape again, over `package.json`:
        # `docs/tools/package-dependencies.md`'s tables are read off the manifest and the source
        # tree's own imports, so an added, removed or re-owned dependency that nobody regenerated
        # the page for fails here instead of leaving a page that quietly goes stale.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Check the module graph is current
              run: npm run check:docs-graph

            - name: Check the role tables are current
              run: npm run check:docs-roles

            - name: Check the dependency tables are current
              run: npm run check:docs-dependencies

            - name: Check every path the docs cite still exists
              run: npm run check:docs-references

            - name: Build the documentation site
              run: npm run docs:build

    typecheck:
        # `tsc --noEmit` — types only. `build` below repeats it as part of its own script; this
        # job exists so a type error is reported as one, not as a build failure.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Type check
              run: npm run ts-check

    build:
        # Proves the project still builds from a clean checkout.
        #
        # `build` is `ts-check && lint`, so this overlaps the two jobs above on purpose: they report
        # which half failed, this one proves the composite gate a developer actually runs still
        # passes. It calls `build`, not `build-only` (an alias for `npm run lint` only, which would
        # make the overlap total rather than partial).
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Build
              run: npm run build

    test-unit:
        # The fast suites, unit and cross-cutting: pure functions, services and repositories
        # against in-memory Mongo. One parallel jest pass gives the verdict and the JSON report.
        #
        # No coverage here. The per-file floors have their own job below: run `--runInBand` under
        # coverage this pass reached 277 of 317 files in the old 40-minute budget, and a floor
        # miss then fails the verdict of a suite whose tests all pass.
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            # `run-suite.ts --unsharded` takes its worker count from jest.config.js, which reads
            # this. The runner has 4 vCPUs; one is left for mongod and the OS.
            JEST_WORKERS: 3
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  setup-mongod: 'true'

            # `--json --outputFile` is jest's per-test report; `mkdir -p` first, because jest does
            # not create the parent directory and `tmp/` is gitignored.
            - name: Run unit tests with the JSON report
              run: |
                  mkdir -p tmp/reports
                  npm run test:unit:report

            - name: Per-module test report
              # Prints the rollup of the JSON the run above wrote into the job log, so a red build
              # names the MODULE before anyone opens an artifact.
              if: always()
              run: npm run test:report

            - name: Upload test report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: test-report-unit
                  path: tmp/reports/test-report.json
                  retention-days: 14
                  if-no-files-found: ignore

    coverage-floors:
        # The per-file coverage floors in `jest.config.js`, over the same unit and cross-cutting
        # suites as `test-unit`. Report-only, like `audit` and `demo-strip-measure`: a floor is a
        # ratchet recording where the code is, and `docs/tools/coverage-and-confidence.md` says
        # mutation score, not this number, is the signal. It is not in the `ci` gate's `needs:`.
        runs-on: ubuntu-latest
        timeout-minutes: 40
        permissions:
            contents: read
        env:
            JEST_WORKERS: 3
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  setup-mongod: 'true'

            # Jest exits non-zero on a failing test and on a threshold miss alike; the log names
            # every file under its floor.
            - name: Run unit tests against the coverage floors
              run: npm run test:unit:coverage

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage-report
                  path: tmp/coverage/
                  retention-days: 14
                  if-no-files-found: ignore

    test-integration:
        # No Mongo/Redis service is started here: today's integration suite only
        # exercises an in-process Express app (see tests/integration/app-health.test.ts).
        # Add service containers here if a future test needs a real database/cache.
        #
        # 45 minutes: the suite runs in band, one file at a time, ~2000 cases. Measured on this
        # runner it takes about 20 minutes, so the budget is the contract job's, which has the
        # same shape.
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  setup-mongod: 'true'

            - name: Run integration tests
              run: npm run test:integration

    test-contract:
        # Drives the real Express app over HTTP (supertest + in-memory Mongo) and validates every
        # response against openapi.yaml, including `additionalProperties: false`.
        #
        # This is the gate for the over-serialization class — a field appearing on a response
        # without being declared in the spec fails here. The generated Zod schemas do not cover it:
        # nothing in this service validates a *response* with Zod (they guard request bodies), and
        # they are generated non-strict, so unknown keys would be stripped rather than rejected.
        #
        # No Mongo/Redis service container is needed: this suite uses mongodb-memory-server against
        # the setup action's preinstalled `mongod`, and the cache adapter treats an unreachable Redis
        # as a miss.
        #
        # 45 minutes: the suite runs in band, one file at a time, and on this runner it takes
        # about 25-30 (tests/contract/request-contract.test.ts alone is ~7.5), twice what the
        # same files take on a developer machine. A 20-minute budget cancelled it mid-run.
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  setup-mongod: 'true'

            - name: Run contract tests
              run: npm run test:contract

    frontend-e2e:
        # The paired frontend's own Cypress suite, against THIS change's backend. The frontend runs
        # the same suite against the backend's main; only this job can say whether a backend PR
        # breaks the app people actually use before it merges, rather than the morning after.
        #
        # Demo profile: the frontend's shard runner boots one `npm run demo` of this checkout per
        # shard (in-memory Mongo, cache and queue off) — see the frontend's
        # `scripts/e2e/run-shards.ts`. The frontend is checked out at its default branch, the
        # version a merge here would meet.
        #
        # Three shards, not the runner's default four: each shard is a Chrome plus a backend plus a
        # mongod, and four of them on this 4-vCPU runner starved each other — eight specs missed a
        # 15-second wait that passes in seconds on a developer machine. 75 minutes covers the
        # longer wall-clock that buys.
        runs-on: ubuntu-latest
        timeout-minutes: 75
        permissions:
            contents: read
        env:
            # Where the frontend lands, beside this checkout rather than inside its tree walks.
            FRONTEND_PATH: .frontend
            # Read by the frontend's `scripts/e2e/run-shards.ts`; the antibot run is one more.
            E2E_SHARDS: 3
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            # Installs this backend's dependencies and a system `mongod` for the demo profile's
            # in-memory database — the same preamble the test jobs use.
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  setup-mongod: 'true'

            - name: Checkout paired frontend
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  # Override with a repository variable when the pair lives elsewhere.
                  repository: ${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-vue-frontend' }}
                  path: ${{ env.FRONTEND_PATH }}
                  # Only needed when the sibling is private; falls back to this repo's token.
                  token: ${{ secrets.SPEC_SIBLING_TOKEN || github.token }}

            - name: Cache Cypress binary
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('.frontend/package-lock.json') }}
                  restore-keys: |
                      cypress-${{ runner.os }}-

            - name: Install frontend dependencies
              working-directory: ${{ env.FRONTEND_PATH }}
              run: npm ci

            # BACKEND_PATH: this checkout, absolute — the frontend resolves it from its own cwd.
            # BACKEND_DEMO_COMMAND: how its shard runner boots each demo backend; `{backend}` is
            # replaced with BACKEND_PATH. Same value the frontend's own CI uses.
            - name: Run the frontend e2e suite against this backend
              working-directory: ${{ env.FRONTEND_PATH }}
              env:
                  BACKEND_PATH: ${{ github.workspace }}
                  BACKEND_DEMO_COMMAND: npm --prefix {backend} run demo
              run: npm run test:e2e

            - name: Upload failing-shard logs
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: frontend-e2e-shard-logs
                  path: .frontend/reports/e2e/
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload Cypress screenshots
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: frontend-e2e-screenshots
                  path: .frontend/tests/e2e/screenshots
                  retention-days: 14
                  if-no-files-found: ignore

    container-gate:
        # Proves the CONTAINER LANE, not just the code: builds `docker/Dockerfile` and runs
        # `npm run complete` inside it — no compose, no service containers, no network — so a
        # passing run means the image genuinely carries everything it needs, baked `mongod`
        # included. This is the "hermetic" mode; the "wired" mode (`docker-compose.test.yml`'s
        # `gate` service, against compose-supplied Mongo/Redis) is the everyday-dev shape and is
        # not run a second time here — one hermetic proof is the stronger claim.
        #
        # Docker, not podman: runners ship Docker, and `CONTAINER_ENGINE` exists precisely so
        # switching is a one-variable difference — the claim under test is about the image, not
        # about which engine built it.
        #
        # It duplicates every other job here on purpose, the same reasoning `build` already
        # documents for overlapping `typecheck`: they answer WHICH thing broke, this one answers
        # whether the container lane still works AT ALL.
        #
        # 120 minutes: `npm run complete` is every other job's work in one container, one suite
        # after another, with two jest workers. Measured on this runner: the static checks take 3
        # minutes, unit 17, cross-cutting 3 and integration ~16, before contract and fuzz.
        runs-on: ubuntu-latest
        timeout-minutes: 120
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Build the dev/test image
              run: docker build -f docker/Dockerfile -t boilerplate-api-gate:${{ github.sha }} .

            - name: Run the gate inside it — no services, no network
              run: docker run --rm --network=none boilerplate-api-gate:${{ github.sha }} npm run complete

    audit:
        # Reports known moderate-and-above vulnerabilities in production dependencies.
        #
        # `moderate`, not `high`: every advisory this repo has actually had to act on was moderate
        # or low (mongoose prototype pollution, qs, body-parser), so a high-only threshold was red
        # for the one chain nobody could fix and silent about the three that mattered.
        #
        # Deliberately NOT in the `ci` gate's `needs:` below: a transitive finding with no
        # non-breaking fix would otherwise block every merge indefinitely with nothing anyone here
        # can do about it in the same PR. This still runs on every push/PR and still shows red when
        # it fails — an alert, not a gate. That only stays useful while it is usually GREEN: if an
        # unfixable advisory ever parks this job on red, add an allowlist keyed by advisory id
        # rather than raising the threshold back up.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Audit dependencies
              run: npm audit --omit=dev --audit-level=moderate

    demo-strip-measure:
        # How far "a module is removable" actually is, measured rather than walked by
        # hand. Applies a removal recipe to a scratch copy — `shop` is the real `demo:remove`,
        # `locales` deletes the optional locales module — then runs regenerate, ts-check, the
        # cross-cutting suite and docs:build against what is left.
        #
        # Deliberately NOT in the `ci` gate's `needs:` below, the same reasoning as `audit`: it is
        # not green yet (the shop recipe still leaves residue tests that
        # `demo:remove` lists for a human), and turning it red would block every PR on work this
        # step only measures. It still runs on every push/PR and shows red on its own square — a
        # punch list, not a gate. Promote it into `needs:` once both recipes are green.
        strategy:
            fail-fast: false
            matrix:
                recipe: [shop, locales]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  setup-mongod: 'true'

            - name: Measure the ${{ matrix.recipe }} removal
              run: npm run measure:demo-strip -- --recipe ${{ matrix.recipe }}

    ci:
        # Single status check to require in branch protection, so adding/renaming
        # jobs above doesn't require updating the required-checks list every time.
        if: always()
        needs:
            - commitlint
            - lint
            - prettier
            - lint-openapi
            - lint-asyncapi
            - spec-identity
            - lint-openapi-modules
            - lint-asyncapi-modules
            - contracts-bundle-freshness
            - asyncapi-breaking
            - typecheck
            - build
            - cluster
            - broker
            - dependency-graph
            - docs
            - test-unit
            - test-integration
            - test-contract
            - container-gate
            - frontend-e2e
            # `audit`, `demo-strip-measure` and `coverage-floors` are deliberately excluded — see their
            # own comments above.
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Check all jobs succeeded
              run: |
                  if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
                      echo "One or more required jobs failed."
                      exit 1
                  fi
