name: Schemathesis (stateful contract fuzz)

# Drives REQUEST SEQUENCES through openapi.yaml's declared `links` — create an order, pay it,
# cancel it — the class of state-dependent failure `test:fuzz` and `test:prism` cannot see because
# both only ever send one request at a time. See docs/tools/fuzz-testing.md, "Stateful fuzzing".
#
# Schemathesis is a Python tool; it never enters this repo's dependency tree. It runs from its
# own official Docker image, in this workflow only, against the real app booted via `npm run demo`
# (in-memory Mongo, cache/queue disabled — the same profile the paired frontend's e2e suite uses).
#
# The image tag is PINNED, not `:stable`. `:stable` moved from v3 to v4.28.0 on 2026-09-03, first
# breaking on a missing module, then on `--stateful` itself (v4 renamed it to the `stateful`
# phase). A floating tag means this workflow's meaning changes under it with no diff to review —
# bump the pin by hand when there's a reason to.
#
# `--generation-deterministic` pins the generation seed, so a red run is reproducible by re-running
# it — the same requirement that keeps this a HUNTER-not-a-gate, like fuzz.yml and mutation.yml:
# advisory, nightly, not a merge gate.

on:
    schedule:
        # 04:00 UTC — after the fuzz run (03:45), so the two do not compete for runners.
        - cron: '0 4 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: schemathesis-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 24
    NODE_PORT: 3000
    SCHEMATHESIS_IMAGE: schemathesis/schemathesis:v4.28.0

jobs:
    schemathesis:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            # Same demo profile the paired frontend's e2e suite boots against: in-memory Mongo,
            # seeded fixtures, cache/queue disabled. Backgrounded so the next step can poll it.
            # `NODE_CLUSTER_WORKERS=1`: the demo never forks workers, but the rate-limit store
            # warns "counting per process" whenever this is unset, regardless — set it so the log
            # is clean when the run does fail and someone has to read it.
            # Logged to a file, not just the job's own stdout, so a boot failure below can print
            # exactly what the app said instead of leaving the reader to search the step above.
            - name: Boot the demo API
              env:
                  NODE_CLUSTER_WORKERS: 1
              run: npm run demo > demo.log 2>&1 &

            # /products is public and unauthenticated — the same default probe
            # scripts/testing/run-prism-smoke-test.ts uses to know the app is actually up.
            # 120s: a slow boot needs the room, and a failure prints demo.log to show why.
            - name: Wait for the API to accept requests
              run: |
                  if ! timeout 120 bash -c 'until curl -sf http://localhost:${{ env.NODE_PORT }}/products >/dev/null; do sleep 1; done'; then
                      echo "::error::The demo API never came up. Its log:"
                      cat demo.log
                      exit 1
                  fi

            # A bearer token for the demo profile's admin, so the chains reach the routes behind a
            # session instead of stopping at the first 401. The credentials come from the demo's
            # own `GET /__test/scenario` rather than a copy here, so a seed-password override
            # cannot leave this step logging in with a stale one. Masked, like any secret.
            - name: Mint an admin token against the demo API
              id: token
              run: |
                  credentials=$(curl -sf http://localhost:${{ env.NODE_PORT }}/__test/scenario)
                  token=$(curl -sf -X POST http://localhost:${{ env.NODE_PORT }}/account/login \
                    -H 'Content-Type: application/json' \
                    -d "$(echo "$credentials" | jq -c '.accounts.admin | {email, password}')" \
                    | jq -r '.data.token')
                  if [ -z "$token" ] || [ "$token" = "null" ]; then
                      echo "::error::Could not log in as the demo admin."
                      exit 1
                  fi
                  echo "::add-mask::$token"
                  echo "token=$token" >> "$GITHUB_OUTPUT"

            # Schemathesis v4: https://schemathesis.readthedocs.io/en/stable/reference/cli/
            # `--phases=stateful` follows the OpenAPI `links` declared in openapi.yaml to chain
            # requests (createOrder -> pay -> cancel, etc.) instead of firing one at a time — v4
            # replaced the old `--stateful=links` flag with this phase selector, and single-request
            # fuzzing is `fuzz.yml`'s job, not this one's.
            # `--generation-deterministic` pins generation so a failure reproduces on re-run — v4's
            # replacement for `--hypothesis-derandomize`.
            # `--report junit --report-dir`: a machine-readable result to upload as an artifact,
            # since the container's own stdout does not survive the job.
            # `--network host`: the app listens directly on the runner, not in a container, so the
            # container needs the runner's own network namespace to reach it on localhost.
            # `--header`: sent on every request, so the whole run acts as that admin.
            # No metrics token is sent: `GET /observability/metrics` takes `metricsBearer`, a static
            # scrape credential, but the stateful phase only follows `links` and none leads there, so
            # it is never called. A phase that walked every operation would need one.
            - name: Run Schemathesis
              run: |
                  mkdir -p tmp/reports/schemathesis
                  docker run --rm --network host \
                    -v ${{ github.workspace }}/openapi.yaml:/spec/openapi.yaml:ro \
                    -v ${{ github.workspace }}/tmp/reports/schemathesis:/reports \
                    ${{ env.SCHEMATHESIS_IMAGE }} \
                    run /spec/openapi.yaml \
                    --url http://localhost:${{ env.NODE_PORT }} \
                    --header "Authorization: Bearer ${{ steps.token.outputs.token }}" \
                    --checks all \
                    --phases=stateful \
                    --generation-deterministic \
                    --report junit --report-dir /reports

            - name: Upload the Schemathesis report
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: schemathesis-report
                  path: tmp/reports/schemathesis/
                  retention-days: 14

    schemathesis-notify:
        # One issue, updated in place, surfaces a nightly red run where the repo is already read
        # instead of adding a channel nobody watches. Shares `notify-failure` with `mutation.yml`'s
        # `mutation-notify`.
        needs: [schemathesis]
        if: always() && contains(needs.*.result, 'failure')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            issues: write
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - name: Open or update the nightly-failure issue
              uses: ./.github/actions/notify-failure
              with:
                  title: 'Nightly Schemathesis run failed'
                  label: 'schemathesis'
                  workflow-name: 'Schemathesis'
