name: Image scan (SBOM + vulnerabilities)

# Builds the image `docker/Dockerfile.production` actually ships and reports what is inside it —
# `container-gate` in ci.yml proves the image WORKS, this asks what it's carrying.
#
# Syft (SBOM) piped into Grype (vulnerabilities) — see docs/tools/deployment-hardening.md,
# "Supply-chain provenance: SBOM and signing". Not Trivy: ruled out in
# DECISIONS_0926_2_SECURITY_SCANNING.md (S5) after the March 2026 `trivy-action` supply-chain
# compromise (CVE-2026-33634, every tag force-pushed to a credential stealer).
#
# A REPORT, not a gate (same doc, S5): `fail-build: false` below, so a new CVE in a base-image
# package cannot block an unrelated merge. Read the uploaded `grype-report` artifact.
#
# Deliberately its own workflow rather than a `ci.yml` job: it does not need to run on every PR —
# the image's dependency surface does not move between a docs typo and the next `npm ci`.

on:
    schedule:
        # Base-image CVEs disclosed between pushes are still worth finding.
        - cron: '0 6 * * 1'
    push:
        branches:
            - main
        paths:
            - 'docker/**'
            - 'package-lock.json'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: image-scan-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-scan:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Build the production image
              run: docker build -f docker/Dockerfile.production -t boilerplate-api:scan .

            # Syft: generates a CycloneDX SBOM from the built image, on disk rather than only as a
            # workflow artifact so the next step can scan it without a second image pull.
            # `upload-release-assets: false` — this never runs during a GitHub release, and leaving
            # the default (true) would ask for a `contents: write` permission this job doesn't need.
            # https://github.com/anchore/sbom-action
            - name: Generate an SBOM with Syft
              uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
              with:
                  image: boilerplate-api:scan
                  format: cyclonedx-json
                  output-file: sbom.cdx.json
                  upload-release-assets: false

            # Grype: scans the SBOM from the step above (not the image again — `sbom:` reuses it).
            # `fail-build: false` and `output-format: table` — see the workflow header: this reports,
            # it does not gate, and a table is readable straight from the job log.
            # https://github.com/anchore/scan-action
            - name: Scan the SBOM with Grype
              uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
              with:
                  sbom: sbom.cdx.json
                  fail-build: false
                  output-format: table
                  output-file: grype-report.txt

            - name: Upload the SBOM and vulnerability report
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: image-scan-report
                  path: |
                      sbom.cdx.json
                      grype-report.txt
                  retention-days: 90
                  if-no-files-found: warn
