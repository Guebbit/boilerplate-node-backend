version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      # Dependabot's PR title becomes the squash commit subject, so it must be conventional.
      commit-message:
          prefix: build
          prefix-development: build
          include: scope
      # A release must be a week old before Dependabot proposes it: a hijacked or yanked version is
      # usually caught inside that window.
      # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#cooldown-
      cooldown:
          default-days: 7
      # mermaid 12 breaks `vitepress-plugin-mermaid` and re-lays-out every diagram; the `katex`
      # override in package.json stands in for the one fix mermaid 11 will never get.
      ignore:
          - dependency-name: mermaid
            update-types: ['version-update:semver-major']
      # One weekly PR for every minor/patch bump together. A major stays OUT of the group on purpose:
      # a breaking bump gets its own PR, reviewed on its own.
      # https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/grouping-pull-requests
      groups:
          minor-and-patch:
              applies-to: version-updates
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      # The workflows live under /.github/workflows; `directories` adds each composite action.
      directories:
          - /
          - /.github/actions/*
      schedule:
          interval: weekly
      # Dependabot's PR title becomes the squash commit subject, so it must be conventional.
      commit-message:
          prefix: build
          include: scope
      cooldown:
          default-days: 7
      groups:
          minor-and-patch:
              applies-to: version-updates
              update-types:
                  - minor
                  - patch

    # Base images in the Dockerfiles (`tag@sha256:digest`): Dependabot moves the tag and digest together.
    - package-ecosystem: docker
      directory: /docker
      schedule:
          interval: weekly
      # Dependabot's PR title becomes the squash commit subject, so it must be conventional.
      commit-message:
          prefix: build
          include: scope
      cooldown:
          default-days: 7
      groups:
          base-images:
              applies-to: version-updates
              update-types:
                  - minor
                  - patch

    # Images in the compose files, one group so a routine bump is one PR.
    - package-ecosystem: docker-compose
      directory: /
      schedule:
          interval: weekly
      # Dependabot's PR title becomes the squash commit subject, so it must be conventional.
      commit-message:
          prefix: build
          include: scope
      cooldown:
          default-days: 7
      # dependabot-core#15718: it reads this image's `-386` tag suffix as a version segment and
      # proposes the i386-only build. Bump it by hand: when the dev-images group PR lands, move this
      # image to the latest otel tag and run `bash docker/observability/validate-configs.sh`. Drop
      # the ignore when dependabot-core#15718 closes.
      ignore:
          - dependency-name: otel/opentelemetry-collector-contrib
          # Mongo minors are short-lived. On a patch PR, bump `config.mongodbMemoryServer.version`
          # in package.json in the same PR: tests/cross-cutting/mongo-version-pin.test.ts fails until then.
          - dependency-name: '*mongo'
            update-types:
                - version-update:semver-minor
                - version-update:semver-major
      groups:
          dev-images:
              applies-to: version-updates
              # Its own PR, so mongo's red patch PR does not hold the other image bumps back.
              exclude-patterns:
                  - '*mongo'
              update-types:
                  - minor
                  - patch
