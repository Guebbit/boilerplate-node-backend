# Code generated by `npm run contracts:bundle`. DO NOT EDIT.
# Sources: shared/contracts/asyncapi.root.yaml
#          src/modules/observability/asyncapi.yaml
#          src/modules/webhooks/asyncapi.yaml
asyncapi: 3.0.0
id: 'urn:boilerplate-node-backend:asyncapi:contracts'
info:
    title: Boilerplate Node Backend Async Contracts
    # Bumped alongside `openapi.root.yaml`'s own 2.0.0: the Standard Webhooks envelope
    # (`webhooks/asyncapi.yaml`, `{ type, timestamp, data }` plus the signed headers) is a
    # deliberate, reviewed break for a subscriber on the old raw-event-body shape. Note:
    # `check:asyncapi-breaking`'s major-version skip compares the `asyncapi:` SPEC version
    # (currently 3.0.0 everywhere), not this field — this bump documents the break for a human
    # reader, it does not silence that gate, which is expected to report real breaking changes
    # against `origin/main` until this work is actually pushed and becomes the new baseline.
    version: 2.0.0
    contact:
        name: Boilerplate maintainers
        url: https://github.com/Guebbit/boilerplate-node-backend
        email: noreply@example.com
    license:
        name: AGPL-3.0
    description: |
        AsyncAPI contract for real-time/event-driven flows in this boilerplate.

        The channels below are the whole of it — every one is implemented in the backend
        runtime, and each says what it carries and when.
    tags:
        - name: implemented
          description: Contracts already implemented in the backend runtime.
defaultContentType: application/json
servers:
    sseLocal:
        host: localhost:3000
        protocol: http
        description: Local HTTP server for SSE (`/observability/events`).
    subscriberEndpoint:
        # A VARIABLE server, not a fixed host: every subscription names its own HTTPS URL, so there
        # is no one address this document can print. `asyncapi-servers`/`asyncapi-channel-servers`
        # (`spectral.asyncapi.modules.yaml`) still pass, because the channels below DO bind to a
        # declared server — it just resolves per subscription instead of per deployment.
        #
        # Not a server this application runs — the reverse of every other section's server: a
        # subscriber genuinely subscribes to receive these, over a connection this application
        # opens outbound.
        host: '{subscriberHost}'
        pathname: '{subscriberPath}'
        protocol: https
        variables:
            subscriberHost:
                default: example.com
                description: Host (and port, when non-default) of a subscription's configured URL.
            subscriberPath:
                default: /webhooks/inbox
                description: Path of a subscription's configured URL.
channels:
    observability.metrics.snapshot:
        address: observability.metrics.snapshot
        description: Initial metrics snapshot sent on SSE connect.
        messages:
            MetricsSnapshotEvent:
                $ref: '#/components/messages/MetricsSnapshotEvent'
    observability.metrics.updated:
        address: observability.metrics.updated
        description: Periodic SSE metrics update.
        messages:
            MetricsUpdatedEvent:
                $ref: '#/components/messages/MetricsUpdatedEvent'
    observability.heartbeat:
        address: observability.heartbeat
        description: SSE heartbeat event.
        messages:
            HeartbeatEvent:
                $ref: '#/components/messages/HeartbeatEvent'
    order.created:
        address: order.created
        description: A new order was placed.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderCreatedEvent:
                $ref: '#/components/messages/OrderCreatedEvent'
    order.paid:
        address: order.paid
        description: An order's payment settled.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderPaidEvent:
                $ref: '#/components/messages/OrderPaidEvent'
    order.shipped:
        address: order.shipped
        description: An order was marked shipped.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderShippedEvent:
                $ref: '#/components/messages/OrderShippedEvent'
    order.cancelled:
        address: order.cancelled
        description: An order was cancelled.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderCancelledEvent:
                $ref: '#/components/messages/OrderCancelledEvent'
    payment.succeeded:
        address: payment.succeeded
        description: A payment settled successfully.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentSucceededEvent:
                $ref: '#/components/messages/PaymentSucceededEvent'
    payment.failed:
        address: payment.failed
        description: A payment attempt was declined.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentFailedEvent:
                $ref: '#/components/messages/PaymentFailedEvent'
operations:
    sseMetricsSnapshot:
        action: send
        channel:
            $ref: '#/channels/observability.metrics.snapshot'
        description: >-
            Sent once, immediately on connect, so a dashboard renders populated instead of waiting out the first 5-second tick with empty cards. Same payload shape as the periodic update — a client handles one message type, not two.
        messages:
            - $ref: '#/channels/observability.metrics.snapshot/messages/MetricsSnapshotEvent'
    sseMetricsUpdated:
        action: send
        channel:
            $ref: '#/channels/observability.metrics.updated'
        description: >-
            Pushed every 5 seconds for as long as the connection is open. Memory is in BYTES, identical to what `GET /observability/health` publishes, so a dashboard showing both compares numbers rather than converting units to find out whether they agree.
        messages:
            - $ref: '#/channels/observability.metrics.updated/messages/MetricsUpdatedEvent'
    sseHeartbeat:
        action: send
        channel:
            $ref: '#/channels/observability.heartbeat'
        description: >-
            A 15-second keep-alive carrying no metrics. Idle proxies close a connection that has been quiet, and an SSE stream between two ticks looks idle to them; this is also what lets a client tell "the stream is alive and nothing changed" from "the stream died".
        messages:
            - $ref: '#/channels/observability.heartbeat/messages/HeartbeatEvent'
    webhookOrderCreated:
        action: send
        channel:
            $ref: '#/channels/order.created'
        summary: An order was written for the first time.
        description: >-
            Fired once per order, from both an admin create and a storefront checkout — see `orders/services/crud.ts`'s `recordCreated`.
        messages:
            - $ref: '#/channels/order.created/messages/OrderCreatedEvent'
    webhookOrderPaid:
        action: send
        channel:
            $ref: '#/channels/order.paid'
        summary: An order moved to the `paid` status.
        description: >-
            Derived from `order.status_changed` (`to: 'paid'`) rather than its own domain event — see `orders/events.ts`: "listeners filter on `to`; the event doesn't know who cares."
        messages:
            - $ref: '#/channels/order.paid/messages/OrderPaidEvent'
    webhookOrderShipped:
        action: send
        channel:
            $ref: '#/channels/order.shipped'
        summary: An order moved to the `shipped` status.
        description: Derived from `order.status_changed` filtered to `to = 'shipped'`, same as `order.paid`.
        messages:
            - $ref: '#/channels/order.shipped/messages/OrderShippedEvent'
    webhookOrderCancelled:
        action: send
        channel:
            $ref: '#/channels/order.cancelled'
        summary: A cancel went through; stock is already back on the shelf.
        description: One-to-one with the `order.cancelled` domain event — see `orders/events.ts`.
        messages:
            - $ref: '#/channels/order.cancelled/messages/OrderCancelledEvent'
    webhookPaymentSucceeded:
        action: send
        channel:
            $ref: '#/channels/payment.succeeded'
        summary: A payment reached `succeeded`.
        description: One-to-one with the `payment.succeeded` domain event — see `payments/events.ts`.
        messages:
            - $ref: '#/channels/payment.succeeded/messages/PaymentSucceededEvent'
    webhookPaymentFailed:
        action: send
        channel:
            $ref: '#/channels/payment.failed'
        summary: A payment reached `declined`.
        description: >-
            One-to-one with the `payment.failed` domain event. Retryable with another method, so this can fire more than once for the same order.
        messages:
            - $ref: '#/channels/payment.failed/messages/PaymentFailedEvent'
components:
    messages:
        MetricsSnapshotEvent:
            name: MetricsSnapshotEvent
            title: Initial observability metrics snapshot
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
        MetricsUpdatedEvent:
            name: MetricsUpdatedEvent
            title: Periodic observability metrics update
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
        HeartbeatEvent:
            name: HeartbeatEvent
            title: Observability heartbeat
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
        OrderCreatedEvent:
            name: OrderCreatedEvent
            title: Order created
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderCreatedEnvelope'
        OrderPaidEvent:
            name: OrderPaidEvent
            title: Order paid
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderPaidEnvelope'
        OrderShippedEvent:
            name: OrderShippedEvent
            title: Order shipped
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderShippedEnvelope'
        OrderCancelledEvent:
            name: OrderCancelledEvent
            title: Order cancelled
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderCancelledEnvelope'
        PaymentSucceededEvent:
            name: PaymentSucceededEvent
            title: Payment succeeded
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentSucceededEnvelope'
        PaymentFailedEvent:
            name: PaymentFailedEvent
            title: Payment failed
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentFailedEnvelope'
    schemas:
        ObservabilityMetricsPayload:
            type: object
            required:
                - timestamp
                - uptimeSeconds
                - memory
                - http
                - realtime
            properties:
                timestamp:
                    type: string
                    format: date-time
                uptimeSeconds:
                    type: integer
                    minimum: 0
                memory:
                    type: object
                    required:
                        - rss
                        - heapUsed
                        - heapTotal
                        - external
                    properties:
                        rss:
                            type: integer
                            minimum: 0
                        heapUsed:
                            type: integer
                            minimum: 0
                        heapTotal:
                            type: integer
                            minimum: 0
                        external:
                            type: integer
                            minimum: 0
                    additionalProperties: false
                http:
                    type: object
                    required:
                        - totalRequests
                        - totalErrors
                    properties:
                        totalRequests:
                            type: integer
                            minimum: 0
                        totalErrors:
                            type: integer
                            minimum: 0
                    additionalProperties: false
                realtime:
                    type: object
                    required:
                        - sseClients
                    properties:
                        sseClients:
                            type: integer
                            minimum: 0
                    additionalProperties: false
            additionalProperties: false
        WebhookHeaders:
            type: object
            description: >-
                The three Standard Webhooks headers every delivery carries — see `transport/webhook-signing.ts`. Documented here for the subscriber reading this catalogue; nothing in this repo generates types off a message's `headers`.
            required:
                - webhook-id
                - webhook-timestamp
                - webhook-signature
            properties:
                webhook-id:
                    type: string
                    description: >-
                        Shared by every subscription this event fanned out to, and by every retry of one delivery — the id a subscriber dedupes on.
                webhook-timestamp:
                    type: string
                    description: Unix seconds when this attempt was signed, folded into the signature.
                webhook-signature:
                    type: string
                    description: 'One or more space-separated `v1,<base64 HMAC-SHA256>` values.'
        OrderIdPayload:
            type: object
            required:
                - orderId
            properties:
                orderId:
                    type: string
            additionalProperties: false
        OrderCancelledPayload:
            type: object
            required:
                - orderId
                - refund
            properties:
                orderId:
                    type: string
                refund:
                    type: boolean
                    description: >-
                        Whether the cancel carries a refund — a customer cancelling is owed their money, an operator cancelling may not be. See `orders/events.ts`.
            additionalProperties: false
        PaymentEventPayload:
            type: object
            required:
                - paymentId
                - orderId
            properties:
                paymentId:
                    type: string
                orderId:
                    type: string
            additionalProperties: false
        OrderCreatedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    type: string
                    enum:
                        - order.created
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
        OrderPaidEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    type: string
                    enum:
                        - order.paid
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
        OrderShippedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    type: string
                    enum:
                        - order.shipped
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
        OrderCancelledEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    type: string
                    enum:
                        - order.cancelled
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderCancelledPayload'
            additionalProperties: false
        PaymentSucceededEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    type: string
                    enum:
                        - payment.succeeded
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentEventPayload'
            additionalProperties: false
        PaymentFailedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    type: string
                    enum:
                        - payment.failed
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentEventPayload'
            additionalProperties: false
