# Code generated by `npm run contracts:bundle`. DO NOT EDIT.
# Sources: shared/contracts/asyncapi.root.yaml
#          src/modules/observability/asyncapi.yaml
#          src/modules/webhooks/asyncapi.yaml
#          src/modules/notifications/asyncapi.yaml
asyncapi: 3.0.0
id: 'urn:boilerplate-node-backend:asyncapi:contracts'
info:
    title: Boilerplate Node Backend Async Contracts
    # Alpha, the same `0.1.0` as `openapi.root.yaml` and every module fragment (SemVer §4:
    # `0.y.z` is initial development). `check:asyncapi-breaking` ignores this field.
    version: 0.1.0
    contact:
        name: Boilerplate maintainers
        url: https://github.com/Guebbit/boilerplate-node-backend
        email: noreply@example.com
    license:
        name: AGPL-3.0
    description: |
        AsyncAPI contract for real-time/event-driven flows in this boilerplate.

        The channels below are the whole of it — every one is implemented in the backend
        runtime, and each says what it carries and when.
    tags:
        - name: implemented
          description: Contracts already implemented in the backend runtime.
defaultContentType: application/json
servers:
    sseLocal:
        host: localhost:3000
        protocol: http
        description: Local HTTP server for SSE (`/observability/events`).
    subscriberEndpoint:
        # A VARIABLE server, not a fixed host: every subscription names its own HTTPS URL, so there
        # is no one address this document can print. `asyncapi-servers`/`asyncapi-channel-servers`
        # (`spectral.asyncapi.modules.yaml`) still pass, because the channels below DO bind to a
        # declared server — it just resolves per subscription instead of per deployment.
        #
        # Not a server this application runs — the reverse of every other section's server: a
        # subscriber genuinely subscribes to receive these, over a connection this application
        # opens outbound.
        host: '{subscriberHost}'
        pathname: '{subscriberPath}'
        protocol: https
        variables:
            subscriberHost:
                default: example.com
                description: Host (and port, when non-default) of a subscription's configured URL.
            subscriberPath:
                default: /webhooks/inbox
                description: Path of a subscription's configured URL.
    sseNotificationsLocal:
        host: localhost:3000
        protocol: http
        description: Local HTTP server for SSE (`/notifications/stream`).
channels:
    observability.metrics.snapshot:
        address: observability.metrics.snapshot
        description: Initial metrics snapshot sent on SSE connect.
        # `scripts/contracts/generate-asyncapi-types.ts` reads this to pick the SSE channels — not
        # the `observability.` name prefix, which a channel outside this namespace could share
        # without being SSE at all.
        x-transport: sse
        messages:
            MetricsSnapshotEvent:
                $ref: '#/components/messages/MetricsSnapshotEvent'
    observability.metrics.updated:
        address: observability.metrics.updated
        description: Periodic SSE metrics update.
        x-transport: sse
        messages:
            MetricsUpdatedEvent:
                $ref: '#/components/messages/MetricsUpdatedEvent'
    observability.heartbeat:
        address: observability.heartbeat
        description: SSE heartbeat event.
        x-transport: sse
        messages:
            HeartbeatEvent:
                $ref: '#/components/messages/HeartbeatEvent'
    order.created:
        address: order.created
        description: A new order was placed.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderCreatedEvent:
                $ref: '#/components/messages/OrderCreatedEvent'
    order.paid:
        address: order.paid
        description: An order's payment settled.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderPaidEvent:
                $ref: '#/components/messages/OrderPaidEvent'
    order.shipped:
        address: order.shipped
        description: An order was marked shipped.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderShippedEvent:
                $ref: '#/components/messages/OrderShippedEvent'
    order.cancelled:
        address: order.cancelled
        description: An order was cancelled.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderCancelledEvent:
                $ref: '#/components/messages/OrderCancelledEvent'
    payment.succeeded:
        address: payment.succeeded
        description: A payment settled successfully.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentSucceededEvent:
                $ref: '#/components/messages/PaymentSucceededEvent'
    payment.failed:
        address: payment.failed
        description: A payment attempt was declined.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentFailedEvent:
                $ref: '#/components/messages/PaymentFailedEvent'
    payment.refunded:
        address: payment.refunded
        description: A refund on a payment settled — the whole payment, or a part of it.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentRefundedEvent:
                $ref: '#/components/messages/PaymentRefundedEvent'
    return.requested:
        address: return.requested
        description: A return was opened — a withdrawal or a request.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            ReturnRequestedEvent:
                $ref: '#/components/messages/ReturnRequestedEvent'
    return.received:
        address: return.received
        description: Returned goods arrived and went back on sale.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            ReturnReceivedEvent:
                $ref: '#/components/messages/ReturnReceivedEvent'
    return.closed:
        address: return.closed
        description: A return finished — the money went back.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            ReturnClosedEvent:
                $ref: '#/components/messages/ReturnClosedEvent'
    example.published:
        address: example.published
        description: An example was published. The `example` module's one webhook, there to be copied.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            ExamplePublishedEvent:
                $ref: '#/components/messages/ExamplePublishedEvent'
    notifications.created:
        address: notifications.created
        servers:
            - $ref: '#/servers/sseNotificationsLocal'
        description: A notification was written for the connected user.
        # `scripts/contracts/generate-asyncapi-types.ts` reads this to pick the SSE channels.
        x-transport: sse
        messages:
            NotificationCreatedEvent:
                $ref: '#/components/messages/NotificationCreatedEvent'
    notifications.deleted:
        address: notifications.deleted
        servers:
            - $ref: '#/servers/sseNotificationsLocal'
        description: One or more notifications of the connected user are gone.
        x-transport: sse
        messages:
            NotificationsDeletedEvent:
                $ref: '#/components/messages/NotificationsDeletedEvent'
    notifications.read:
        address: notifications.read
        servers:
            - $ref: '#/servers/sseNotificationsLocal'
        description: The connected user's notifications were marked read.
        x-transport: sse
        messages:
            NotificationsReadEvent:
                $ref: '#/components/messages/NotificationsReadEvent'
operations:
    sseMetricsSnapshot:
        action: send
        channel:
            $ref: '#/channels/observability.metrics.snapshot'
        description: >-
            Sent once, immediately on connect, so a dashboard renders populated instead of waiting out the first 5-second tick with empty cards. Same payload shape as the periodic update — a client handles one message type, not two.
        messages:
            - $ref: '#/channels/observability.metrics.snapshot/messages/MetricsSnapshotEvent'
    sseMetricsUpdated:
        action: send
        channel:
            $ref: '#/channels/observability.metrics.updated'
        description: >-
            Pushed every 5 seconds for as long as the connection is open. Memory is in BYTES, identical to what `GET /observability/health` publishes, so a dashboard showing both compares numbers rather than converting units to find out whether they agree.
        messages:
            - $ref: '#/channels/observability.metrics.updated/messages/MetricsUpdatedEvent'
    sseHeartbeat:
        action: send
        channel:
            $ref: '#/channels/observability.heartbeat'
        description: >-
            A 15-second keep-alive carrying no metrics. Idle proxies close a connection that has been quiet, and an SSE stream between two ticks looks idle to them; this is also what lets a client tell "the stream is alive and nothing changed" from "the stream died".
        messages:
            - $ref: '#/channels/observability.heartbeat/messages/HeartbeatEvent'
    webhookOrderCreated:
        action: send
        channel:
            $ref: '#/channels/order.created'
        summary: An order was written for the first time.
        description: >-
            Fired once per order, from both an admin create and a storefront checkout — see `orders/services/crud.ts`'s `recordCreated`.
        messages:
            - $ref: '#/channels/order.created/messages/OrderCreatedEvent'
    webhookOrderPaid:
        action: send
        channel:
            $ref: '#/channels/order.paid'
        summary: An order moved to the `paid` status.
        description: >-
            Derived from `order.status_changed` (`to: 'paid'`) rather than its own domain event — see `orders/events.ts`: "listeners filter on `to`; the event doesn't know who cares."
        messages:
            - $ref: '#/channels/order.paid/messages/OrderPaidEvent'
    webhookOrderShipped:
        action: send
        channel:
            $ref: '#/channels/order.shipped'
        summary: An order moved to the `shipped` status.
        description: Derived from `order.status_changed` filtered to `to = 'shipped'`, same as `order.paid`.
        messages:
            - $ref: '#/channels/order.shipped/messages/OrderShippedEvent'
    webhookOrderCancelled:
        action: send
        channel:
            $ref: '#/channels/order.cancelled'
        summary: A cancel went through; stock is already back on the shelf.
        description: One-to-one with the `order.cancelled` domain event — see `orders/events.ts`.
        messages:
            - $ref: '#/channels/order.cancelled/messages/OrderCancelledEvent'
    webhookPaymentSucceeded:
        action: send
        channel:
            $ref: '#/channels/payment.succeeded'
        summary: A payment reached `succeeded`.
        description: One-to-one with the `payment.succeeded` domain event — see `payments/events.ts`.
        messages:
            - $ref: '#/channels/payment.succeeded/messages/PaymentSucceededEvent'
    webhookPaymentFailed:
        action: send
        channel:
            $ref: '#/channels/payment.failed'
        summary: A payment reached `declined`.
        description: >-
            One-to-one with the `payment.failed` domain event. Retryable with another method, so this can fire more than once for the same order.
        messages:
            - $ref: '#/channels/payment.failed/messages/PaymentFailedEvent'
    webhookPaymentRefunded:
        action: send
        channel:
            $ref: '#/channels/payment.refunded'
        summary: A refund on a payment settled.
        description: >-
            One-to-one with the `payment.refunded` domain event — see `payments/services/refunds.ts`'s `settleRefund`. Fired once per refund, whether an operator asked for it directly or the `ORDER_REFUND_OWED` retry sweep completed it; never fired for a hand-paid refund left for an operator to confirm by hand.
        messages:
            - $ref: '#/channels/payment.refunded/messages/PaymentRefundedEvent'
    webhookReturnRequested:
        action: send
        channel:
            $ref: '#/channels/return.requested'
        summary: A return was opened — a withdrawal or a request.
        description: >-
            One-to-one with the `return.requested` domain event — see `returns/services/create.ts`. A withdrawal before dispatch fires it too, followed at once by `return.closed`: the return is born closed, and `order.cancelled` says the order was cancelled.
        messages:
            - $ref: '#/channels/return.requested/messages/ReturnRequestedEvent'
    webhookReturnReceived:
        action: send
        channel:
            $ref: '#/channels/return.received'
        summary: Returned goods arrived and went back on sale.
        description: >-
            One-to-one with the `return.received` domain event — see `returns/services/receive.ts`. The stock movement and the status move committed together before this fired.
        messages:
            - $ref: '#/channels/return.received/messages/ReturnReceivedEvent'
    webhookReturnClosed:
        action: send
        channel:
            $ref: '#/channels/return.closed'
        summary: A return finished — the money went back.
        description: >-
            One-to-one with the `return.closed` domain event — see `returns/services/close.ts`. Fired when the refund settles: straight after the goods were received, or later when the payment sweep completed a refund the provider first refused. A withdrawal before dispatch fires it at birth, right after `return.requested`.
        messages:
            - $ref: '#/channels/return.closed/messages/ReturnClosedEvent'
    webhookExamplePublished:
        action: send
        channel:
            $ref: '#/channels/example.published'
        summary: An example was published.
        description: >-
            One-to-one with the `example.published` domain event — see `example/services/crud.ts`. Fired each time an example moves to `published`, including after being archived and brought back.
        messages:
            - $ref: '#/channels/example.published/messages/ExamplePublishedEvent'
    sseNotificationCreated:
        action: send
        channel:
            $ref: '#/channels/notifications.created'
        description: >-
            Pushed when a notification is written for the user, with the whole notification, so a client adds it without a refetch. A message trimmed off the end by the per-user cap arrives as a `notifications.deleted` frame right after.
        messages:
            - $ref: '#/channels/notifications.created/messages/NotificationCreatedEvent'
    sseNotificationsDeleted:
        action: send
        channel:
            $ref: '#/channels/notifications.deleted'
        description: >-
            Pushed when the user deletes one (`DELETE /notifications/{id}`), empties the inbox (`dismiss-all`), or the cap trims the oldest, so a second tab stays in step with the first. `all` is true when the whole inbox went.
        messages:
            - $ref: '#/channels/notifications.deleted/messages/NotificationsDeletedEvent'
    sseNotificationsRead:
        action: send
        channel:
            $ref: '#/channels/notifications.read'
        description: >-
            Pushed when `POST /notifications/read-all` runs, so the badge clears in every open tab.
        messages:
            - $ref: '#/channels/notifications.read/messages/NotificationsReadEvent'
components:
    messages:
        MetricsSnapshotEvent:
            name: MetricsSnapshotEvent
            title: Initial observability metrics snapshot
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
        MetricsUpdatedEvent:
            name: MetricsUpdatedEvent
            title: Periodic observability metrics update
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
        HeartbeatEvent:
            name: HeartbeatEvent
            title: Observability heartbeat
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
        OrderCreatedEvent:
            name: OrderCreatedEvent
            title: Order created
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderCreatedEnvelope'
        OrderPaidEvent:
            name: OrderPaidEvent
            title: Order paid
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderPaidEnvelope'
        OrderShippedEvent:
            name: OrderShippedEvent
            title: Order shipped
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderShippedEnvelope'
        OrderCancelledEvent:
            name: OrderCancelledEvent
            title: Order cancelled
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderCancelledEnvelope'
        PaymentSucceededEvent:
            name: PaymentSucceededEvent
            title: Payment succeeded
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentSucceededEnvelope'
        PaymentFailedEvent:
            name: PaymentFailedEvent
            title: Payment failed
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentFailedEnvelope'
        PaymentRefundedEvent:
            name: PaymentRefundedEvent
            title: Payment refunded
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentRefundedEnvelope'
        ReturnReceivedEvent:
            name: ReturnReceivedEvent
            title: Return received
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/ReturnReceivedEnvelope'
        ReturnClosedEvent:
            name: ReturnClosedEvent
            title: Return closed
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/ReturnClosedEnvelope'
        ExamplePublishedEvent:
            name: ExamplePublishedEvent
            title: Example published
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/ExamplePublishedEnvelope'
        ReturnRequestedEvent:
            name: ReturnRequestedEvent
            title: Return requested
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/ReturnRequestedEnvelope'
        NotificationCreatedEvent:
            name: NotificationCreatedEvent
            title: A notification was written
            payload:
                $ref: '#/components/schemas/NotificationCreatedPayload'
        NotificationsDeletedEvent:
            name: NotificationsDeletedEvent
            title: Notifications were deleted
            payload:
                $ref: '#/components/schemas/NotificationsDeletedPayload'
        NotificationsReadEvent:
            name: NotificationsReadEvent
            title: Notifications were marked read
            payload:
                $ref: '#/components/schemas/NotificationsReadPayload'
    schemas:
        ObservabilityMetricsPayload:
            type: object
            required:
                - timestamp
                - uptimeSeconds
                - memory
                - http
                - realtime
            properties:
                timestamp:
                    type: string
                    format: date-time
                uptimeSeconds:
                    type: integer
                    minimum: 0
                memory:
                    # `title` names the generated TypeScript model — omitting it left Modelina to
                    # invent `AnonymousSchemaN`, renumbered on every unrelated schema addition.
                    title: MemoryUsage
                    type: object
                    required:
                        - rss
                        - heapUsed
                        - heapTotal
                        - external
                    properties:
                        rss:
                            type: integer
                            minimum: 0
                        heapUsed:
                            type: integer
                            minimum: 0
                        heapTotal:
                            type: integer
                            minimum: 0
                        external:
                            type: integer
                            minimum: 0
                    additionalProperties: false
                http:
                    title: HttpMetrics
                    type: object
                    required:
                        - totalRequests
                        - totalErrors
                    properties:
                        totalRequests:
                            type: integer
                            minimum: 0
                        totalErrors:
                            type: integer
                            minimum: 0
                    additionalProperties: false
                realtime:
                    title: RealtimeMetrics
                    type: object
                    required:
                        - sseClients
                    properties:
                        sseClients:
                            type: integer
                            minimum: 0
                    additionalProperties: false
            additionalProperties: false
        WebhookHeaders:
            type: object
            description: >-
                The three Standard Webhooks headers every delivery carries — see `transport/webhook-signing.ts`. Documented here for the subscriber reading this catalogue; nothing in this repo generates types off a message's `headers`.
            required:
                - webhook-id
                - webhook-timestamp
                - webhook-signature
            properties:
                webhook-id:
                    type: string
                    description: >-
                        Shared by every subscription this event fanned out to, and by every retry of one delivery — the id a subscriber dedupes on.
                webhook-timestamp:
                    type: string
                    description: Unix seconds when this attempt was signed, folded into the signature.
                webhook-signature:
                    type: string
                    description: 'One or more space-separated `v1,<base64 HMAC-SHA256>` values.'
        OrderIdPayload:
            type: object
            required:
                - orderId
            properties:
                orderId:
                    type: string
            additionalProperties: false
        OrderCancelledPayload:
            type: object
            required:
                - orderId
                - refund
            properties:
                orderId:
                    type: string
                refund:
                    type: boolean
                    description: >-
                        Whether the cancel carries a refund — a customer cancelling is owed their money, an operator cancelling may not be. See `orders/events.ts`.
            additionalProperties: false
        PaymentEventPayload:
            type: object
            required:
                - paymentId
                - orderId
            properties:
                paymentId:
                    type: string
                orderId:
                    type: string
            additionalProperties: false
        PaymentRefundedPayload:
            type: object
            required:
                - paymentId
                - orderId
                - refundId
                - amount
                - currency
            properties:
                paymentId:
                    type: string
                orderId:
                    type: string
                refundId:
                    type: string
                    description: >-
                        The refund record this delivery is about. A payment can be refunded in parts, so one payment can raise this event more than once.
                amount:
                    type: number
                    description: This refund's amount, two decimal places — the payment's own `amount` for a full refund.
                currency:
                    type: string
                    description: ISO-4217, e.g. `EUR`.
            additionalProperties: false
        ReturnRequestedPayload:
            type: object
            required:
                - returnId
                - orderId
                - reason
            properties:
                returnId:
                    type: string
                orderId:
                    type: string
                reason:
                    type: string
                    description: Why the goods come back — `withdrawal`, `defective`, `wrong_item` or `other`.
            additionalProperties: false
        ReturnReceivedPayload:
            type: object
            required:
                - returnId
                - orderId
            properties:
                returnId:
                    type: string
                orderId:
                    type: string
            additionalProperties: false
        ReturnClosedPayload:
            type: object
            required:
                - returnId
                - orderId
                - refundAmount
                - currency
            properties:
                returnId:
                    type: string
                orderId:
                    type: string
                refundAmount:
                    type: number
                    description: What went back to the customer for this return, two decimal places.
                currency:
                    type: string
                    description: ISO-4217, e.g. `EUR`.
            additionalProperties: false
        ExamplePublishedPayload:
            type: object
            required:
                - exampleId
                - title
            properties:
                exampleId:
                    type: string
                title:
                    type: string
                    description: The fallback-language title.
            additionalProperties: false
        OrderCreatedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    # `title` names the generated model — a bare inline enum-of-one otherwise
                    # becomes Modelina's `AnonymousSchemaN`, renumbered on every unrelated addition.
                    title: OrderCreatedEventType
                    type: string
                    enum:
                        - order.created
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
        OrderPaidEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: OrderPaidEventType
                    type: string
                    enum:
                        - order.paid
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
        OrderShippedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: OrderShippedEventType
                    type: string
                    enum:
                        - order.shipped
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
        OrderCancelledEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: OrderCancelledEventType
                    type: string
                    enum:
                        - order.cancelled
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderCancelledPayload'
            additionalProperties: false
        PaymentSucceededEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: PaymentSucceededEventType
                    type: string
                    enum:
                        - payment.succeeded
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentEventPayload'
            additionalProperties: false
        PaymentFailedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: PaymentFailedEventType
                    type: string
                    enum:
                        - payment.failed
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentEventPayload'
            additionalProperties: false
        PaymentRefundedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: PaymentRefundedEventType
                    type: string
                    enum:
                        - payment.refunded
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentRefundedPayload'
            additionalProperties: false
        ReturnRequestedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: ReturnRequestedEventType
                    type: string
                    enum:
                        - return.requested
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/ReturnRequestedPayload'
            additionalProperties: false
        ReturnReceivedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: ReturnReceivedEventType
                    type: string
                    enum:
                        - return.received
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/ReturnReceivedPayload'
            additionalProperties: false
        ReturnClosedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: ReturnClosedEventType
                    type: string
                    enum:
                        - return.closed
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/ReturnClosedPayload'
            additionalProperties: false
        ExamplePublishedEnvelope:
            type: object
            required:
                - type
