# Shared compliance rule registry. Read by scripts/audit/compliance-backend/SKILL.md and
# scripts/audit/compliance-frontend/SKILL.md, which each filter by `responsibility` and evaluate only
# their own `evidence.<side>` hints. Lives here, once, and the frontend audit reads this copy — see
# docs/build/ai-auditing.md. `rules:` is what either prompt evaluates; `suggested_rules:` is a
# staging area for candidates pending human approval and MUST NOT be read by either prompt.
#
# Evidence hints name the authored contract: a module's `src/modules/<m>/openapi.yaml` fragment, or
# `shared/contracts/openapi.root.yaml`. Never the generated, gitignored root `openapi.yaml`, which a
# worktree may lack. Cite the fragment's line.
#
# A rule is never mandatory on its face — `applies_when` is prose the auditing model evaluates
# against this app's actual shape at run time, not a boolean flag. Promote a rule out of
# `suggested_rules:` by moving the entry under `rules:` and deleting `suggested_reason`.
version: 1

rules:
    - id: legal-pages-published
      title: Privacy policy, cookie policy, and terms/marketing disclosures must exist as reachable pages
      category: consumer-protection
      responsibility: both
      severity: high
      rule: >
          The app must publish a privacy policy, a cookie policy (or a combined policy that
          separately addresses cookies), and terms/marketing disclosures, each reachable via a
          stable, discoverable URL (e.g. footer links) before any personal data is collected, and
          the operator's legal notice (name, address, register, VAT).
      applies_when: >
          Always applicable — any app collecting personal data or setting cookies needs these pages
          published, regardless of jurisdiction.
      evidence:
          backend:
              - src/app/config-routes.ts (`operator`, `termsVersion` on `GET /config`)
              - shared/rules/frontend-links.yaml `staticPages` and src/modules/sitemap/config.ts
              - .env-example `NODE_LEGAL_*`
          frontend:
              - routes `terms`, `privacy` (cookie section `#cookies`, `BrowserStorageTable`) and `legal` in src/app/router/index.ts
              - src/app/views/TermsPage.vue, PrivacyPage.vue, LegalPage.vue
              - footer links in src/app/layouts/LayoutDefault.vue
      references:
          - GDPR Art. 12-14 (transparent information)
          - ePrivacy Directive Art. 5(3)
          - e-Commerce Directive 2000/31 Art. 5(1) (legal notice)
      notes: >
          The pages are frontend routes. This backend's half is the operator identity and
          `termsVersion` on `GET /config`, and the page paths in the sitemap. A shipped
          `<LegalPlaceholder>` (a visible "text missing" warning plus a section checklist, no legal
          wording) is the designed default. Writing the text is the operator's go-live step
          (frontend INSTALL.md, backend docs/use-the-shop/before-you-sell.md). It goes in the view
          template, with a `NODE_TERMS_VERSION` bump in the same deploy. The placeholder never
          decides the verdict: judge the pages, routes, footer links and identity. VIOLATION: a
          page, route or footer link is missing; wording poses as real legal text (Lorem Ipsum, a
          sample policy); or the go-live step is missing from those two docs.

    - id: signup-mandatory-consent-checkbox
      title: Every account records its holder's own acceptance of the Terms before first use (a box that starts unticked, or the notice beside a provider button); the privacy notice is shown, not agreed to
      category: consumer-protection
      responsibility: both
      severity: high
      rule: >
          Every account carries its holder's own record of accepting the terms (when, and which
          version of the text) before its first session. The holder makes it, on the first screen
          they act on, through a checkbox that is NOT pre-checked. A staff member never accepts on
          someone's behalf. Covered paths: self-signup; a sign-in with a third-party provider that
          creates the account, where a notice beside its button ("by continuing you agree to the
          Terms") counts, as it does on the providers' own pages; and the first password set on a
          staff-created account. The privacy notice is shown to the person, never agreed to. The
          first mail to a staff-created account links the privacy notice, as that mail is the
          person's first contact from us. Cookie and analytics consent is asked separately, never
          bundled into the acceptance.
      applies_when: >
          Every path that makes an account usable, including staff creation (`users` admin create
          -> setup link). Demo and test data (scenarios, factories) are out of scope.
      evidence:
          backend:
              - src/modules/account/services/signup.ts, oauth.ts, password-reset.ts (where the record is stamped)
              - src/modules/account/consent-record.ts, src/modules/users/model.ts (`termsAcceptedAt` / `termsVersion`)
              - src/modules/account/openapi.yaml (`SignupRequest`, `PasswordResetConfirmRequest`; the root bundle `openapi.yaml` is generated)
              - src/modules/account/emails.ts (`setupRequestEmail`, links the privacy notice)
          frontend:
              - Signup.vue and the `account-setup` view (PasswordResetConfirm.vue in setup mode); the shared Terms checkbox (default value must be false)
              - routed pages for /terms and /privacy
      references:
          - GDPR Art. 6(1)(b) (the Terms are a contract step, not consent)
          - GDPR Art. 7(1), 7(4) and EDPB Guidelines 05/2020 para 13, para 81 (only for the separate
            analytics opt-in, and for no bundling of consent with the contract)
          - GDPR Art. 13 and Art. 14(3)(b) (the privacy notice is information; due at the latest at
            the first communication)
          - Consumer Rights Directive 2011/83 Art. 6(9) (the trader proves the information duties)
          - e-Commerce Directive 2000/31 Art. 10(3) (the Terms can be stored and reproduced)
          - ePrivacy Directive Art. 5(3) (only for cookie/analytics asked separately)
      notes: >
          The privacy notice is information (Art. 13/14). Copy that asks the user to "accept" or
          "agree to" it presents information as an agreement: flag it. Bundling (Art. 7(4)) is a
          separate fault: consent tied to the contract. A single "I agree to everything" checkbox
          that also carries cookie consent is flagged even where a checkbox exists.

    - id: dmca-agent-published
      title: No published DMCA/copyright takedown agent contact
      category: ip
      responsibility: both
      severity: medium
      rule: >
          A platform that hosts user-generated or third-party content must publish a designated
          copyright agent's contact (name/email or form) and a takedown process, per DMCA safe-harbor
          requirements (US) or an equivalent notice-and-action process (EU DSA Art. 16).
      applies_when: >
          N/A today: no customer-authored content is shown to others (reviews, comments, public
          profiles); re-check when one is added.
      evidence:
          backend:
              - src/modules/tasks/**
              - src/modules/products/** (review/UGC fields)
              - src/modules/example/** (public published page; authoring is staff-only today, re-check if a customer audience gains `create:Example` in `shared/rules/authorization-roles.yaml`)
              - any content-moderation or takedown route
          frontend:
              - a /dmca or /copyright page
              - review/UGC submission UI
      references:
          - DMCA, 17 U.S.C. §512(c)(2)
          - EU Digital Services Act Art. 16
      notes: null

    - id: sensitive-data-plaintext-storage
      title: Passwords, tokens, payment data, and biometric data must never be stored or transmitted in plaintext
      category: data-security
      responsibility: backend
      severity: critical
      rule: >
          Passwords, session/refresh/reset/2FA tokens, full payment card numbers, and any biometric
          template must be hashed, signed, or tokenised at rest and in transit — never persisted or
          logged as recoverable plaintext.
      applies_when: >
          Always applicable — this is a baseline, not context-dependent.
      evidence:
          backend:
              - src/modules/users/model.ts (password hashing call site)
              - docs/understand/security.md (single-use token entropy + sha256-digest-at-rest section)
              - src/modules/payments/** (must show cardLast4 only, never a full PAN field)
              - docs/understand/data-protection.md ("no full PAN ever stored")
              - src/infrastructure/adapters/logger.ts + NODE_LOG_PERSONAL_FIELDS
          frontend: []
      references:
          - GDPR Art. 32 (security of processing)
          - PCI-DSS Requirement 3 (protect stored cardholder data)
      notes: >
          Known-good baseline today: argon2id password hashing, sha256 digest for single-use
          tokens, cardLast4-only payment storage. Expected to audit SATISFIED; a new field storing a
          secret/PAN/biometric value in cleartext is the regression this rule exists to catch.

    - id: ai-usage-policy-disclosure
      title: No AI usage policy/disclosure for AI-driven features
      category: ai-governance
      responsibility: both
      severity: medium
      rule: >
          Where the app uses AI/LLM-driven features (recommendations, generated content, chat,
          automated moderation), it must publish an AI usage policy disclosing what is AI-driven, and
          disclose AI-generated content/decisions to the user at the point of interaction.
      applies_when: >
          Only if the app has AI-driven runtime features. NOT-APPLICABLE as of this registry's
          writing — no AI/LLM runtime feature exists anywhere in src/ (the only AI usage in this repo
          is the human-run scripts/audit/*/SKILL.md prompts themselves, which are tooling, not a product
          feature). Re-evaluate the moment a runtime AI feature is added.
          Frontend: no AI-labelled UI or chat widget, and no AI SDK in package.json (grep
          -rniE "openai|anthropic|\bllm\b|chatbot|gpt-|gemini|ollama|ai-generated").
      evidence:
          backend:
              - src/modules/** (grep for llm/openai/anthropic/ai- prefixed modules or env vars)
          frontend:
              - any AI-labelled UI component or chat widget
      references:
          - EU AI Act Art. 50 (transparency obligations)
          - FTC guidance on AI-generated content
      notes: >
          Currently a clean NOT-APPLICABLE. The rule exists so it fires automatically the day an AI
          feature lands, rather than being forgotten.

    - id: biometric-consent-required
      title: Biometric authentication used without explicit, revocable consent
      category: data-security
      responsibility: both
      severity: critical
      rule: >
          Biometric authentication (FaceID/TouchID/fingerprint) must only be offered with explicit,
          separately revocable consent, and any biometric template must stay device-local unless a
          distinct, explicit consent covers sending it to a server — raw biometric data must never be
          stored server-side.
      applies_when: >
          Only if the app offers biometric login. NOT-APPLICABLE as of this registry's writing — no
          biometric/FaceID code exists in this backend. Re-evaluate the moment biometric auth is
          added, e.g. a WebAuthn platform-authenticator flow. Frontend: no `navigator.credentials` /
          `PublicKeyCredential` / WebAuthn call and no biometric prompt (grep -rniE
          "navigator\.credentials|PublicKeyCredential|webauthn|passkey|biometric").
      evidence:
          backend:
              - src/modules/account/** (any WebAuthn/passkey registration endpoint, and what it stores)
          frontend:
              - any biometric-prompt UI
              - navigator.credentials / WebAuthn calls
      references:
          - GDPR Art. 9 (special category data)
          - BIPA (Illinois) as a stricter US precedent
      notes: >
          WebAuthn passkeys typically keep the biometric template device-local by design — only a
          public key reaches the server. If/when this is added, confirm the server-side storage is a
          public key, not a template, before concluding this rule is satisfied by construction.

    - id: tracking-pixel-before-consent
      title: Third-party tracking pixels firing before cookie/tracking consent
      category: e-privacy
      responsibility: frontend
      severity: high
      rule: >
          A third-party tracking or advertising pixel (Meta Pixel, Google Analytics, TikTok Pixel,
          etc.) must not load or fire before the user has given cookie/tracking consent.
      applies_when: >
          Only if the app embeds a third-party tracking/marketing pixel. The backend's own analytics
          is consent-gated (analyticsConsent field, NODE_ANALYTICS_REQUIRE_CONSENT) and self-hostable
          (Umami by default) — a genuinely different mechanism from a client-side ad pixel, so it does
          not itself satisfy or violate this rule. Check the frontend's <head>/analytics bootstrap for
          any pixel script before concluding either way.
      evidence:
          backend: []
          frontend:
              - index.html / app-shell <head> scripts
              - analytics bootstrap code
              - any consent-manager integration
      references:
          - ePrivacy Directive Art. 5(3)
          - GDPR Art. 6/7
      notes: >
          The backend's existing analyticsConsent gate
          (src/infrastructure/observability/analytics/index.ts) is a working example of the pattern
          this rule wants applied to any pixel on the frontend.

    - id: image-alt-text
      title: User-facing images without meaningful alt text
      category: accessibility
      responsibility: frontend
      severity: medium
      rule: >
          Every meaningful user-facing image carries a non-empty, descriptive alt attribute; purely
          decorative images use an explicit empty alt (alt=""), never an omitted alt attribute.
      applies_when: >
          Always applicable to any page rendering images.
      evidence:
          backend: []
          frontend:
              - product/gallery/avatar image components
              - CMS-driven image rendering
      references:
          - WCAG 2.1 SC 1.1.1 (Non-text Content)
      notes: null

    - id: age-gate-or-parental-consent
      title: No age-gate for restricted content, or no parental-consent path for a child-directed service
      category: child-protection
      responsibility: both
      severity: high
      rule: >
          Where the product or a content category requires a minimum age (alcohol, gambling, mature
          content), an age-gate/verification step must exist before access. Where the service is
          knowingly directed at or likely used by children under 13 (or the local equivalent
          threshold), a verifiable parental-consent path must exist before collecting their data.
      applies_when: >
          Only if the app sells or shows age-restricted goods (alcohol, tobacco/vapes, knives,
          gambling, adult), or is directed at children. Categories and tags are free-form strings
          (src/modules/products/model.ts), so judge the seeded catalogue (scenarios/products.ts,
          scenarios/products-filler.ts) and the demo's audience. A deployer who adds such goods owns
          the age check (docs/use-the-shop/before-you-sell.md, "Age-restricted goods").
          Frontend: no age-gate component and no date-of-birth field at signup or checkout (grep
          -rniE "age-?gate|dateOfBirth|birth").
      evidence:
          backend:
              - src/modules/products/model.ts (free-form `categories`/`tags`)
              - scenarios/products*.ts
              - src/modules/account/** (any date-of-birth field)
          frontend:
              - an age-gate modal/component
              - product category pages
      references:
          - COPPA, 15 U.S.C. §6501-6506
          - GDPR Art. 8 (child's consent, age 13-16 depending on member state)
      notes: null

    - id: marketing-email-unsubscribe
      title: Marketing/bulk email must offer a working unsubscribe mechanism
      category: e-privacy
      responsibility: backend
      severity: high
      rule: >
          Any marketing or bulk email (as opposed to transactional/service email) must carry a
          working, one-click unsubscribe mechanism (link and/or List-Unsubscribe header), and
          honouring it must stop future sends to that address without further action from the
          recipient.
      applies_when: >
          The app sends, or is being extended to send, any email whose primary purpose is promotion.
          NOT applicable today: every template under src/modules/*/templates/*.ejs is transactional
          or a service notice, and none carries an unsubscribe link (the grep below, zero hits, is
          correct). Standing judgement: `stock-alerts.back-in-stock` is a single notice the buyer
          asked for, about the product they named, and the request is deleted once answered
          (src/modules/stock-alerts/module.yaml). Under ePrivacy Art. 13(1) the request is the prior
          consent, and nothing follows to stop. Under CAN-SPAM's primary-purpose test it is a grey
          area: report it as a one-line note, not a finding. It becomes marketing the day it names
          another product, carries an offer, or repeats. Re-evaluate when a newsletter, promo,
          re-engagement or abandoned-cart mail is added.
      evidence:
          backend:
              - src/modules/*/templates/*.ejs
              - src/infrastructure/adapters/mailer.ts
              - 'grep -in "unsubscribe\|list-unsubscribe" across src/'
          frontend: []
      references:
          - CAN-SPAM Act, 15 U.S.C. §7704(a)(3)
          - GDPR Art. 21(2) (right to object to direct marketing)
          - ePrivacy Directive Art. 13
      notes: >
          Transactional email is exempt as long as its primary purpose is not advertising. If a
          template's purpose becomes primarily promotional, treat it as marketing even if it rides
          the existing transactional pipeline.

    - id: security-txt-responsible-disclosure
      title: No published security.txt / responsible-disclosure policy
      category: consumer-protection
      responsibility: backend
      severity: medium
      rule: >
          A security researcher who finds a vulnerability must have a published, non-legal-threat
          channel to report it — a security.txt file at /.well-known/security.txt (RFC 9116) and/or a
          documented disclosure policy.
      applies_when: >
          Applicable to any deployment reachable from the public internet — always, for this app.
      evidence:
          backend:
              - src/app/system-routes.ts (the route serving it, behind a switch)
              - SECURITY.md (the repo's own policy)
          frontend: []
      references:
          - RFC 9116 (A File Format to Aid in Security Vulnerability Disclosure)
      notes: >
          Cheap to satisfy; a route serves it when the deployer sets a contact, and stays off by default so a fork never publishes someone else's.

    - id: ccpa-do-not-sell-link
      title: No CCPA "Do Not Sell or Share My Personal Information" link
      category: consumer-protection
      responsibility: both
      severity: medium
      rule: >
          A business that sells or shares personal information for cross-context behavioural
          advertising must provide a clear "Do Not Sell or Share My Personal Information" link, and
          honour opt-outs including the Global Privacy Control signal.
      applies_when: >
          Only if personal data is sold/shared with a third party for advertising purposes, AND the
          service is reachable by California residents. Likely NOT-APPLICABLE today: analytics is
          opt-in (analyticsConsent) and self-hostable (Umami) — re-check if a hosted PostHog or any ad
          pixel is added, or if any sub-processor relationship changes from processor to independent
          controller. Frontend: no ad pixel or hosted analytics besides `VITE_UMAMI_*`/Faro. If one is
          added, the footer needs a "Do Not Sell or Share" link and the app must honour
          `navigator.globalPrivacyControl`.
      evidence:
          backend:
              - docs/understand/data-protection.md (sub-processor list)
              - NODE_ANALYTICS_PROVIDER / NODE_POSTHOG_HOST config
          frontend:
              - footer / privacy-settings page for a "Do Not Sell" link
      references:
          - CCPA/CPRA, Cal. Civ. Code §1798.135
      notes: >
          This app does not sell data today — promoted anyway as insurance, since it should audit
          SATISFIED/NOT-APPLICABLE cleanly and catch the day that stops being true (a hosted
          analytics/ad integration, a data-sharing partnership).

    - id: marketing-list-double-opt-in
      title: No double opt-in for a marketing email list
      category: e-privacy
      responsibility: backend
      severity: medium
      rule: >
          Adding an address to a marketing/newsletter list must be confirmed by the recipient (double
          opt-in) before bulk sends begin, not merely inferred from an unrelated action like checkout.
      applies_when: >
          Only once a marketing/newsletter email feature exists. NOT-APPLICABLE today — no such
          feature exists (every template is transactional). Pairs with marketing-email-unsubscribe:
          both trigger on the same future feature and should be re-checked together.
      evidence:
          backend:
              - src/modules/*/templates/*.ejs
              - src/modules/account/**, src/modules/users/** (any list-subscription field)
          frontend: []
      references:
          - GDPR Art. 7 (consent)
          - CAN-SPAM Act (implicit best practice, not a strict US requirement)
      notes: >
          Pairs directly with marketing-email-unsubscribe — same trigger condition, same evidence
          location. Both are expected to audit NOT-APPLICABLE together until a marketing/newsletter
          feature is added.

    - id: automated-decision-human-review
      title: No right to human review of a fully automated significant decision
      category: ai-governance
      responsibility: both
      severity: high
      rule: >
          Art. 22(1) is a prohibition in principle (CJEU C-634/21 SCHUFA ¶52-53). A decision based
          solely on automated processing with a legal or similarly significant effect is made only
          under an Art. 22(2) exception: necessary for a contract, authorised by law, or explicit
          consent. Examples of such a decision: an automatic account suspension, order rejection or
          fraud block. Otherwise a person with authority to change it decides before it takes
          effect. Where such a decision is made, the subject is told it was taken, why and until
          when. They can obtain a person's review, give their view and contest it (Art. 22(3),
          13(2)(f), 15(1)(h)).
      applies_when: >
          APPLICABLE. The automatic purchase hold is a rule-only refusal of new checkouts: after a
          buyer's N-th UNPAID cancellation (either door) or expired reservation inside the window
          (orders/services/purchase-hold.ts, counts from orders/config.ts) the account is refused a
          new order until the hold ends, at most 7 days later (cart/services/checkout.ts answers
          409 CART_PURCHASE_HOLD). Paid cancellations are statutory withdrawals and never pause
          anyone; they only flag the account. No person is involved before the pause takes effect;
          staff get an email only after, and the account is flagged for review. Whether it reaches
          the "similarly significant effect" bar of GDPR Art. 22(1) is an open question: it is short,
          capped, self-expiring, one shop, and never blocks paying, cancelling, a withdrawal, a
          return or the account's data rights, but it is an outright refusal to contract. Still checked and NOT-APPLICABLE: the throttle and
          the human check (human-challenge.ts, rate-limit.ts) refuse one request, set no flag on the
          user, and pass next window. The email-policy step (`NODE_ANTIBOT_EMAIL_POLICY`,
          adapters/antibot.ts, off by default) judges the address's domain, not the person: a
          disposable or mail-less domain. Signup answers it with a decoy (account/services/signup.ts
          `guardEmailPolicy`). The contact form files it as spam (tasks/services/contact.ts
          `create`). The person can use another address, and the deployer can allowlist a domain
          (`NODE_ANTIBOT_EMAIL_ALLOWLIST`). Every automatic hold is flagged for a person's review
          even if a contest message is filtered. So it has no significant effect.
          payments/services/settlement.ts only records what the provider reports (a decline
          is retryable with another method); the account inactivity reaper has a built-in self-service
          opt-out and restoration goes through an admin. Re-evaluate if a local fraud-scoring or
          risk-model feature is ever added to payments or antibot.
          Frontend: the cart and profile show the hold's reason, end date and a contact link, and a refused
          checkout (409 CART_PURCHASE_HOLD) shows the same.
      evidence:
          backend:
              - src/modules/orders/services/purchase-hold.ts, src/modules/orders/domain/purchase-hold.ts
              - src/modules/users/services/purchase-hold.ts (the staff doors that set and lift a hold)
              - src/modules/cart/services/checkout.ts (the only door that asks)
              - src/modules/users/emails.ts (the buyer's mail when a hold is placed)
              - src/modules/antibot/**, src/infrastructure/http/middlewares/human-challenge.ts, rate-limit.ts
              - src/infrastructure/adapters/antibot.ts, src/modules/account/services/signup.ts, src/modules/tasks/services/contact.ts
              - src/modules/payments/services/settlement.ts (settlePayment, applyWebhookSettlement, receiveWebhook, applyWebhookDelivery)
              - src/modules/account/jobs.ts
          frontend:
              - boilerplate-vue-frontend src/modules/account/components/PurchaseHoldNotice.vue (reason, end date, contact link)
              - boilerplate-vue-frontend SignedInCart.vue, cart/domain/checkout-errors.ts
      references:
          - GDPR Art. 22(1) and 22(3), Recital 71
          - GDPR Art. 21 (right to object to processing based on legitimate interest)
          - WP251 rev.01 pp.21-23 (meaningful human involvement, significance threshold, exceptions)
          - CJEU C-634/21 SCHUFA (7 Dec 2023) ¶44-46 (broad "decision"), ¶52-54 (prohibition in principle; 22(3) safeguards attach to 22(2)(a)/(c))
      notes: >
          Safeguards present: the buyer is told when a hold is placed, why, until when and what still
          works (mail and an in-app notice on the cart and on the profile); a contact route reaches
          staff who can lift it (POST /users/{id}/lift-purchase-hold, which also restarts the count);
          the processing basis and a legitimate-interest assessment are written down
          (docs/understand/data-retention-holds.md); the pause is capped at 7 days and flags the account so a
          person reviews it (users list filter purchaseHoldReview). Verdict: SATISFIED when the
          Art. 22(3) safeguards hold. The house applies them as a precaution while the Art. 22(1)
          scope is open, so the verdict judges the safeguards, not the prohibition. The mail alone
          carries all of them, so the backend half closes without the frontend (SATISFIED, not
          NEEDS-BOTH-SIDES). The frontend audit checks the in-app notice at the point of refusal.
          Every run's evidence cell adds this line as written: "Art. 22(1) scope open (WP251 p.21:
          the effect must be comparable to a legal effect). If the pause is significant it is
          prohibited (C-634/21 ¶52) and no Art. 22(2) exception fits, so the fix is a person before
          the pause. That is the operator's product choice
          (docs/understand/data-retention-holds.md#the-purchase-hold)." Re-judge the scope question, and report
          VIOLATION if it is then judged significant, when the hold loses its 7-day cap, stops ending
          by itself, stops flagging the account for review, or blocks an order already placed
          (cancelling a contract is a legal effect, WP251 p.21).

suggested_rules:
    - id: policy-material-change-reconsent
      title: No notice to existing accounts when the Terms or privacy notice change materially
      category: consumer-protection
      responsibility: both
      severity: medium
      rule: >
          A material change to the Terms or the privacy notice is told to existing accounts through a
          notice devoted to it (mail or in-app), before it takes effect. Terms: reasonable notice and
          the freedom to close the account; each order stays a contract under the version shown at
          its checkout. Privacy: well in advance when the nature of the processing changes (purpose,
          controller, recipients, transfers, how rights are exercised); a new purpose is told before
          it starts. Neither needs a fresh acceptance; a new consent-based purpose asks for that
          consent separately.
      applies_when: >
          `termsVersion` exists (`GET /config`, `User.termsVersion`). The privacy notice has no
          version field; judge its changes on the notice alone.
      evidence:
          backend:
              - src/modules/users/model.ts (termsVersion)
              - src/app/config-routes.ts (termsVersion)
              - src/modules/orders/model.ts (termsVersion frozen on each checkout order)
              - docs/use-the-shop/before-you-sell.md ("Changing the terms")
          frontend:
              - a notice surface (mail or inbox)
      references:
          - UCTD 93/13 Annex 1(j) and 2(b), second paragraph
