# Production stack for the API.
#
# `docker-compose.yml` is the DEVELOPMENT stack: it bind-mounts the working tree, runs the dev
# server with hot reload, and brings up the full observability estate (Prometheus, Loki, Tempo,
# Grafana, Alloy, Umami) because being able to see everything is the point of a development box.
#
# This file is the deployment. It runs the image built by `docker/Dockerfile.production`, mounts
# no source, exposes no database port to the host, and stops at the four services the application
# cannot run without. Its `setup` service runs `deploy:setup` (indexes plus the shop row) and
# NEVER the demo seeder — `scenarios/apply.ts` refuses NODE_ENV=production outright, so a
# production database starts empty and fills with real rows. Telemetry is exported over OTLP to a collector that is deliberately NOT
# defined here — see the note at the bottom.
#
#   export COMPOSE_PROJECT_NAME=acme
#   docker compose --env-file "clients/acme/.env" -f docker-compose.production.yml up -d --build
#   docker compose --env-file "clients/acme/.env" -f docker-compose.production.yml logs -f app
#   docker compose --env-file "clients/acme/.env" -f docker-compose.production.yml down  # -v: data too
#
# ── ONE DEPLOYMENT PER CLIENT ────────────────────────────────────────────────────────────────────
# This stack serves ONE client organisation. Many clients means many stacks, each with its own
# database and its own domain — never one stack serving many.
#
# `COMPOSE_PROJECT_NAME` is the client's name and does two jobs at once: it namespaces every
# container, network and volume, and it selects that client's config below. Unset, nothing starts.
#
# ── BEFORE THE FIRST DEPLOY ──────────────────────────────────────────────────────────────────────
# Copy `.env-example` to `clients/<name>/.env` and set real values.
#
# The file is named twice on purpose, because compose reads it through two separate channels:
# `--env-file` resolves the `${...}` substitutions in THIS file, while `env_file:` below is what
# the container itself receives. Naming only one of them silently gives every client the same
# application config.
#
# Every client needs its OWN secrets and its OWN NODE_PORT — never copy one client's keys to
# another. `clients/` is in `.dockerignore` and `.gitignore` on purpose — mounted at runtime, never
# baked into the image.
#
# ── SECRETS ARE FILES, AND EACH SERVICE GETS ONLY ITS OWN ───────────────────────────────────────
# The credentials and keys live one per file in `clients/<name>/secrets/` (create the directory
# 0700, each file 0644: compose ignores `uid`/`mode` for a file secret, and Redis (uid 999) and node
# (uid 1000) must both read it). They are NOT in the client's `.env`, so `docker inspect` shows
# none, and a child process of the app inherits none. The app reads them through `NODE_X_FILE`
# variables (docs/tools/configuration.md#secrets-as-files); the data services read the same files.
#
#   mongo_root_password  database, mongo-rs-init    The only place the root account's password exists.
#   mongo_app_password   database, app, cron, setup
#   redis_password       cache, app, cron
#   rabbitmq_password    queue, app, cron
#   the app's keys       app, cron, setup           token_access, token_refresh, totp_encryption_key,
#                                                   pii_encryption_key, webhook_secret_encryption_key,
#                                                   pseudonym_key, metrics_token
#
# `cron` and `setup` hold the app's keys although they use few of them: every script validates the
# whole configuration before it runs, and that gate refuses a missing key.
#
# Compose refuses to start a service whose secret file does not exist. On a managed backing service
# leave its file EMPTY (an empty file reads as unset, so the password inside `NODE_DB_URI` /
# `NODE_REDIS_URL` / `NODE_RABBITMQ_URL` stands), or put the managed password in the file and leave
# it out of the URL. Optional integration secrets (SMTP, payments, OAuth, antibot) stay in the
# client's `.env`, since a file secret cannot be optional here.
# See: docs/getting-started-production.md#secrets
#
# ── BUNDLED OR MANAGED BACKING SERVICES ──────────────────────────────────────────────────────────
# `database`/`cache`/`queue` below carry `profiles: [bundled]` and start only when
# `COMPOSE_PROFILES` includes `bundled` — the client env file's production block sets that by
# default, so a client who changes nothing gets today's all-in-one behaviour. Point at a managed
# MongoDB/Redis/RabbitMQ instead by setting `NODE_DB_URI`/`NODE_REDIS_URL`/`NODE_RABBITMQ_URL` in
# the client env file AND removing `bundled` from `COMPOSE_PROFILES` — the client value then wins
# over the bundled-service default (`required: false` on `depends_on` is what lets `app`/`cron`/
# `setup` start without the bundled containers present).
#
# ── ONE-SHOT SETUP ───────────────────────────────────────────────────────────────────────────────
# `setup` runs `db:sync` and `access:bootstrap` once, then exits — the equivalent of an
# `initContainer`/one-off Job in an orchestrator that isn't Compose. `app` and `cron` wait for it to
# finish successfully before they start, so a fresh deployment gets its indexes and its shop's row
# before anything serves a request.

# ── CONTAINER HARDENING, ONCE ───────────────────────────────────────────────────────────────────
# Merged into `app`, `cron` and `setup` with `<<: *hardening` — all three run the SAME image, so
# they have the same needs and a divergence between them would be an accident rather than a
# decision. `USER node` in the Dockerfile already drops root; these drop what root was not the
# only way to get:
#
#   read_only        the image's own filesystem cannot be modified, so a write primitive gained
#                    through a dependency has nowhere to drop a payload. Every path the app
#                    legitimately writes is mounted per service below — the tmpfs at `/tmp` is
#                    `noexec`; the named volumes (`uploads`, `storage`, `quarantine`) are not, since
#                    Docker mounts a named volume `exec` by default and this repo stays
#                    provider-neutral rather than reaching for a driver-specific opt.
#   cap_drop         these are node processes serving HTTP or running a scheduler: they bind
#                    ports above 1024 as a non-root user and need no Linux capability at all.
#   no-new-privileges  a setuid binary inside the image cannot raise privilege, which closes the
#                    usual escape from the non-root user above.
#   tmpfs /tmp       where an upload waits while the request is checked — `NODE_UPLOAD_STAGING_PATH`
#                    defaults into the system temp directory, and `npm_config_cache` is pointed
#                    here too. `noexec`/`nosuid`: a file the client chose the bytes of lands here,
#                    and nothing should ever run it. Sized because a tmpfs charges real memory —
#                    this bounds concurrent uploads, not one upload's size, which
#                    `NODE_MAX_UPLOAD_BYTES` does.
#
# CIS Docker Benchmark 5.12 / 5.25.
x-hardening: &hardening
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
        - /tmp:mode=1777,size=64m,noexec,nosuid

# ── DATA-SERVICE HARDENING, ONCE ────────────────────────────────────────────────────────────────
# Merged into `database`, `mongo-rs-init`, `cache` and `queue` with `<<: *data-hardening`. A
# SEPARATE block from `x-hardening`: those three run our own code and can afford `read_only`, but
# the official data images start as root, `chown` their data directory and then drop to their own
# user, so their entrypoints need a few capabilities and a writable root.
#
#   cap_drop ALL     start from nothing,
#   cap_add          and give back only what the official entrypoints use: CHOWN (the data
#                    directory), SETUID/SETGID (the drop to `mongodb`/`redis`/`rabbitmq`),
#                    DAC_OVERRIDE and FOWNER (reach files another user owns, as root).
#   no-new-privileges  a setuid binary in the image still cannot raise privilege.
#
# Test-booted for each service (the replica set reached PRIMARY, Redis answered an authenticated
# ping, RabbitMQ authenticated the user). `read_only` is NOT set on any of them: it would break
# `mongo-entrypoint.sh`'s `chown` and the config files written to the container's own filesystem.
# CIS Docker Benchmark 5.3 / 5.25.
x-data-hardening: &data-hardening
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]

x-app-env: &app-env
    NODE_ENV: 'production'
    # Every service here starts through `npm`, and every one runs with a read-only root (see
    # `x-hardening` above). npm's cache — and the `_logs/` it writes a failure report into —
    # default under `$HOME`, which is inside the image and therefore immutable. Pointed at the
    # tmpfs instead so the failure path has somewhere to write; verified that an exit code still
    # propagates either way, this is what keeps the report itself.
    npm_config_cache: '/tmp/.npm'
    # Service hostnames on the compose network, defaulted — not hardcoded — so a client env file
    # setting these to a managed instance wins outright. The URLs carry NO password: it arrives as
    # a secret file and the config loader merges it in (`NODE_DB_PASSWORD_FILE` below, and the
    # Redis and RabbitMQ twins on the services that dial them).
    # No `?authSource=admin` on Mongo: the app user is created ON `MONGO_DB` itself (see
    # `docker/mongo-init.js`), so the database already in the path is its auth source.
    # `?replicaSet=rs0` matches the bundled `database`'s own one-node set (see `database` and
    # `mongo-rs-init` below) — only on the bundled default; a managed URI supplies its own topology.
    # `tls=true&tlsCAFile=...`: `database` requires TLS (`--tlsMode requireTLS`, see its own
    # `command:` below) under a self-signed CA `mongo-entrypoint.sh` mints — `/ca-dir` is the
    # volume that CA's public cert is shared into, mounted read-only on this container too.
    NODE_DB_URI: '${NODE_DB_URI:-mongodb://${MONGO_APP_USER:-api}@database:27017/${MONGO_DB:-api}?replicaSet=rs0&tls=true&tlsCAFile=/ca-dir/mongo-ca.crt}'
    NODE_REDIS_URL: '${NODE_REDIS_URL:-redis://cache:6379}'
    NODE_RABBITMQ_URL: '${NODE_RABBITMQ_URL:-amqp://${RABBITMQ_USER:-guest}@queue:5672}'
    # Every service that runs this image dials Mongo, so every one gets this password.
    NODE_DB_PASSWORD_FILE: '/run/secrets/mongo_app_password'

# The app's own keys, as `_FILE` variables — merged into `app`, `cron` and `setup`, which all hold
# the same set of secret files (see the header). Each file is named in `secrets:` below.
x-app-key-env: &app-key-env
    NODE_TOKEN_ACCESS_FILE: '/run/secrets/token_access'
    NODE_TOKEN_REFRESH_FILE: '/run/secrets/token_refresh'
    NODE_TOTP_ENCRYPTION_KEY_FILE: '/run/secrets/totp_encryption_key'
    NODE_PII_ENCRYPTION_KEY_FILE: '/run/secrets/pii_encryption_key'
    NODE_WEBHOOK_SECRET_ENCRYPTION_KEY_FILE: '/run/secrets/webhook_secret_encryption_key'
    NODE_PSEUDONYM_KEY_FILE: '/run/secrets/pseudonym_key'
    NODE_METRICS_TOKEN_FILE: '/run/secrets/metrics_token'

# The queue and cache clients: `app` and `cron` reach Redis and RabbitMQ, `setup` (indexes and the
# shop row, Mongo only) does not, and so is given neither password.
x-backing-env: &backing-env
    NODE_REDIS_PASSWORD_FILE: '/run/secrets/redis_password'
    NODE_RABBITMQ_PASS_FILE: '/run/secrets/rabbitmq_password'

# The secret files `app` and `cron` hold. A YAML anchor on a list, since compose cannot merge two.
x-service-secrets: &service-secrets
    - mongo_app_password
    - redis_password
    - rabbitmq_password
    - token_access
    - token_refresh
    - totp_encryption_key
    - pii_encryption_key
    - webhook_secret_encryption_key
    - pseudonym_key
    - metrics_token

services:
    app:
        # `image:` alongside `build:`: the image this build produces is tagged once, and `cron`/
        # `setup` reference that same tag by `image:` alone — one build, three containers running
        # it, never three separate builds of the same Dockerfile drifting apart.
        image: '${APP_IMAGE:-boilerplate-api:latest}'
        build:
            context: .
            dockerfile: docker/Dockerfile.production
            args:
                # ~200 MB of Chromium, needed only by the PDF invoice endpoint. See the Dockerfile.
                INSTALL_CHROMIUM: '${INSTALL_CHROMIUM:-false}'

        # `unless-stopped` rather than `always`: a container an operator stopped by hand stays
        # stopped across a daemon restart, which is what someone debugging a live incident expects.
        restart: unless-stopped

        # Runs `dumb-init` as PID 1 already (see the Dockerfile ENTRYPOINT), so compose does not
        # need to inject its own. Left explicit because the graceful shutdown in `src/cluster.ts`
        # depends on SIGTERM arriving, and that is worth stating twice.
        stop_grace_period: 30s

        env_file:
            - clients/${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME to the client's name}/.env

        environment:
            <<: [*app-env, *app-key-env, *backing-env]
            NODE_PORT: '${NODE_PORT:-3000}'
            # One process per container. Scale with `--scale app=N` or with the orchestrator, not
            # with an in-container cluster — see the Dockerfile CMD note.
            NODE_ENABLE_CLUSTERING: '0'
            OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-}'
            NODE_SERVICE_NAME: '${NODE_SERVICE_NAME:-api}'

        secrets: *service-secrets

        ports:
            # Bound to the loopback interface, NOT to 0.0.0.0. Put a TLS-terminating reverse proxy
            # in front of this; publishing the API directly on a public interface means serving it
            # over plain HTTP, and the auth cookies this application sets are not safe that way.
            - '127.0.0.1:${NODE_PORT:-3000}:${NODE_PORT:-3000}'

        <<: *hardening

        volumes:
            # Uploaded images. WITHOUT this the container's own filesystem holds them and a
            # redeploy loses every one. A named volume is the stopgap; it still pins the deployment
            # to one host, and two replicas do not share it. The durable answer is an
            # S3-compatible `ImageStore` backend — see `infrastructure/adapters/image-store.ts`.
            - uploads:/app/public/images

            # `x-hardening`'s `read_only` makes `/app` immutable, so every path the app writes
            # needs a mount of its own. These two are NOT tmpfs, and the reason differs for each.
            #
            # Both live under the code's own `tmp/` default — a local-dev convenience, normally
            # gitignored and throwaway — and it is THIS mount that makes each durable here
            # instead, not the folder name.
            #
            # `tmp/storage/` holds the invoice cache and the MAIL SPOOL — queued outbound mail
            # that a restart must not lose, which rules tmpfs out on its own.
            - storage:/app/tmp/storage
            # `tmp/quarantine/` holds uploads awaiting their scan. `reap:quarantine` counts a file
            # abandoned after `NODE_QUARANTINE_RETENTION_HOURS` (24h), a window that only means
            # anything if the directory survives a restart.
            - quarantine:/app/tmp/quarantine
            # The bundled Mongo's self-signed CA cert (see `mongo-entrypoint.sh`) — what
            # `NODE_DB_URI`'s `tlsCAFile` verifies `database`'s certificate against. Read-only:
            # this container only ever needs to TRUST the CA, never mint from it.
            - mongo-ca-dir:/ca-dir:ro

        depends_on:
            # `required: false`: a managed backing service has no container here to wait on — see
            # the bundled-or-managed note above. Compose ≥ 2.20.
            database:
                condition: service_healthy
                required: false
            cache:
                condition: service_healthy
                required: false
            queue:
                condition: service_healthy
                required: false
            setup:
                condition: service_completed_successfully

        # Liveness, never readiness: `/livez` checks only that the process answers, so a Mongo blip
        # cannot mark a healthy container unhealthy (Swarm would replace it). `/readyz` is for a
        # load balancer's own probe. Kept here although the image declares the same check: Podman
        # builds OCI images by default, and OCI drops `HEALTHCHECK`. `node -e`, not `curl -f`: the
        # runtime image is node:*-alpine and ships no curl. See docs/tools/health-checks.md.
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://localhost:${NODE_PORT:-3000}/livez').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

    # An external scheduler, not an in-process one — see the equivalent service in
    # docker-compose.yml and docs/reference/ops.md#scheduled-jobs for the full reasoning. Same
    # image as `app` — `image:` rather than a second `build:`, so a client is never running two
    # images built from the same Dockerfile at slightly different times — only the command
    # differs, so this container runs `scripts/ops/reap-*`/`sweep:*` against the exact image
    # that was type-checked, never a copy built separately.
    #
    # supercronic (installed by `docker/install-supercronic.mjs`), not busybox `crond`: crond
    # resets group membership before every job, which the unprivileged `node` user may not do, so
    # every job failed. `-passthrough-logs` hands each job's output to the container's log stream
    # untouched. Mounting `docker/crontab` is enough; the image already carries `scripts/ops/`,
    # `scripts/run-script.ts` and `package.json`.
    #
    # `replicas: 1` is what actually keeps two `reap:orders` passes from racing; the Mongo lease
    # (`src/infrastructure/persistence/lease.ts`) is the backstop for a future job that does need it.
    cron:
        image: '${APP_IMAGE:-boilerplate-api:latest}'
        restart: unless-stopped
        deploy:
            replicas: 1
        env_file:
            - clients/${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME to the client's name}/.env
        secrets: *service-secrets
        environment:
            <<: [*app-env, *app-key-env, *backing-env]
            # A dedicated var, not `${NODE_SERVICE_NAME:-api}-cron`: podman-compose 1.6 doubles the
            # suffix when the same base variable is given a different literal suffix in more than
            # one service (verified — `api-cron-cron`), so each derived name gets its own variable.
            NODE_SERVICE_NAME: '${NODE_CRON_SERVICE_NAME:-api-cron}'
        # This container runs the reapers — the jobs that DELETE things — so it is the last one
        # that should be able to rewrite its own image.
        <<: *hardening

        volumes:
            - ./docker/crontab:/app/crontab:ro
            # `reap:quarantine` and `reap:mail-spool` both sweep directories
            # `app` writes, so cron mounts the same two volumes. Without these the jobs would
            # walk an empty read-only path and report nothing to do, every night, silently.
            - storage:/app/tmp/storage
            - quarantine:/app/tmp/quarantine
            # Same reasoning as `app`'s own mount — `scripts/ops/reap-*`/`sweep:*` connect to
            # Mongo too.
            - mongo-ca-dir:/ca-dir:ro
        # `-prometheus-listen-address` makes supercronic serve `/health` (and `/metrics`), bound to
        # loopback so it stays private to the container. It answers `OK` while the scheduler runs.
        # https://github.com/aptible/supercronic
        command:
            [
                'supercronic',
                '-passthrough-logs',
                '-prometheus-listen-address',
                '127.0.0.1:9746',
                '/app/crontab'
            ]
        # This container's own job is the scheduler, so it checks the scheduler — the image's web
        # check would never pass here (nothing listens on the app port). See docs/tools/health-checks.md.
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:9746/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        depends_on:
            database:
                condition: service_healthy
                required: false
            cache:
                condition: service_healthy
                required: false
            queue:
                condition: service_healthy
                required: false
            setup:
                condition: service_completed_successfully

    # Runs once, then exits: `db:sync` reconciles the index set, `access:bootstrap` upserts the one
    # shop and the preset roles. `app`/`cron` both wait on this finishing successfully before they
    # start — the Compose-native form of an orchestrator's initContainer/one-off Job, a shape that
    # carries over unchanged to a Kubernetes deployment of the same image.
    #
    # `image:`, not `build:` — same image `app` built, never a separate build of the same
    # Dockerfile. Build `app` first (`docker compose ... build app`) on a stack's first deploy.
    setup:
        image: '${APP_IMAGE:-boilerplate-api:latest}'
        env_file:
            - clients/${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME to the client's name}/.env
        # Mongo and the app's keys only: it never dials Redis or RabbitMQ.
        secrets:
            - mongo_app_password
            - token_access
            - token_refresh
            - totp_encryption_key
            - pii_encryption_key
            - webhook_secret_encryption_key
            - pseudonym_key
            - metrics_token
        environment:
            <<: [*app-env, *app-key-env]
            # See `cron`'s own comment: a dedicated var sidesteps podman-compose 1.6's suffix bug.
            NODE_SERVICE_NAME: '${NODE_SETUP_SERVICE_NAME:-api-setup}'
        # Writes to Mongo and nothing else, so it needs no volume beyond the CA cert below — but
        # there is no reason for a one-shot bootstrap to hold capabilities either.
        <<: *hardening

        volumes:
            # Same reasoning as `app`'s own mount — `db:sync`/`access:bootstrap` connect to Mongo too.
            - mongo-ca-dir:/ca-dir:ro

        command: ['sh', '-c', 'npm run deploy:setup']
        # A one-shot job: its exit code is the signal, which `depends_on: service_completed_successfully`
        # already reads. The image's web check would only mark it unhealthy while it runs.
        healthcheck:
            disable: true
        depends_on:
            database:
                condition: service_healthy
                required: false
            mongo-rs-init:
                condition: service_completed_successfully
                required: false

    database:
        image: docker.io/library/mongo:8
        restart: unless-stopped
        # Started only when `COMPOSE_PROFILES` includes `bundled` — see the note above `x-app-env`.
        profiles: [bundled]
        <<: *data-hardening
        # A replica set of one, not a standalone: MongoDB's own documented production topology,
        # the only path to a dump consistent across collections while orders keep arriving
        # (`mongodump --oplog`), and the prerequisite for Percona Backup for MongoDB or real PITR
        # later. Converting a live standalone to a set is a data-bearing migration; starting as a
        # set of one is only this line. `--keyFile` is what auth requires once `--replSet` is on,
        # even with a single member — MongoDB refuses `--auth` alone on a replica set.
        #
        # `mongo-entrypoint.sh` wraps the image's own entrypoint purely to get the keyFile and the
        # TLS certificates onto disk with the right ownership first — see its own header for why
        # that isn't a separate one-shot service instead.
        entrypoint: ['bash', '/mongo-entrypoint.sh']
        command: [
                'mongod',
                '--replSet',
                'rs0',
                '--keyFile',
                '/keyfile-dir/mongo-keyfile',
                '--bind_ip_all',
                # This repo's queries all go through Mongoose/the generated repositories — no
                # `$where`, `mapReduce`, `$accumulator` or `$function` anywhere (verified by grep
                # over src/) — so server-side JS is a pure NoSQL-injection escalation surface with
                # nothing depending on it. MongoDB's own security checklist:
                # https://www.mongodb.com/docs/manual/administration/security-checklist/
                '--noscripting',
                # Wire TLS — a keyFile authenticates replica-set members to each other, it does not
                # encrypt anything on the wire. `mongo-entrypoint.sh` mints `mongo-server.pem`
                # (self-signed CA by default; see its own comment for bringing a real one instead).
                # `--tlsCAFile` is required: mongod 8.3 refuses TLS without a chain of trust
                # (SERVER-72839). `--tlsAllowConnectionsWithoutCertificates` keeps it one-way: a
                # client verifies the server and is never asked for a certificate back (mTLS), a
                # heavier control than this deployment chose on top of SCRAM.
                # https://www.mongodb.com/docs/manual/reference/program/mongod/#std-option-mongod.--tlsAllowConnectionsWithoutCertificates
                '--tlsMode',
                'requireTLS',
                '--tlsCertificateKeyFile',
                '/keyfile-dir/mongo-server.pem',
                '--tlsCAFile',
                '/keyfile-dir/mongo-ca.crt',
                '--tlsAllowConnectionsWithoutCertificates'
            ]
        # The ONLY service that holds both Mongo passwords: it creates the root account and, through
        # `mongo-init.js`, the app's.
        secrets:
            - mongo_root_password
            - mongo_app_password
        environment:
            # Root stays maintenance-only — the app authenticates as MONGO_APP_USER instead
            # (see `NODE_DB_URI` above and `docker/mongo-init.js`), so a leaked connection
            # string can never `dropDatabase` on another database or read `admin.system.users`.
            # And the root password is never in the app's container at all: only `database` and
            # `mongo-rs-init` mount it.
            MONGO_INITDB_ROOT_USERNAME: '${MONGO_ROOT_USER:-root}'
            # The official image's own `_FILE` convention. It covers only `MONGO_INITDB_ROOT_*`.
            # https://hub.docker.com/_/mongo (Environment Variables)
            MONGO_INITDB_ROOT_PASSWORD_FILE: '/run/secrets/mongo_root_password'
            MONGO_INITDB_DATABASE: '${MONGO_DB:-api}'
            MONGO_APP_USER: '${MONGO_APP_USER:-api}'
            # Read by `docker/mongo-init.js`, which creates the app user from it.
            MONGO_APP_PASSWORD_FILE: '/run/secrets/mongo_app_password'
        volumes:
            - mongo-data:/data/db
            - mongo-keyfile-dir:/keyfile-dir
            # Read-write here — `mongo-entrypoint.sh` is what copies the CA's public cert out to
            # this volume; every OTHER mount of it (`app`/`cron`/`setup`/`mongo-rs-init`) is `:ro`.
            - mongo-ca-dir:/ca-dir
            - ./docker/mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
            # First-run only, same as the Umami init script: creates MONGO_APP_USER against an
            # empty data directory and never runs again on that volume. Runs during the official
            # image's temporary, flag-stripped standalone boot — which shares this same /data/db —
            # so it needs no change for --replSet/--keyFile; only rs.initiate() is new, see
            # `mongo-rs-init` below.
            - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
        # No `ports:` entry, deliberately. The database is reachable from the compose network and
        # from nowhere else. Reach it for maintenance with
        # `docker compose --env-file "clients/$COMPOSE_PROJECT_NAME/.env" -f docker-compose.production.yml
        # exec database mongosh -u "$MONGO_ROOT_USER" -p` (it prompts; the password is in
        # `clients/$COMPOSE_PROJECT_NAME/secrets/mongo_root_password`).
        healthcheck:
            # `ping` needs no auth even under `--keyFile` (which implies `--auth`), so this keeps
            # gating readiness the same way it did as a standalone. `--tls --tlsCAFile`: mongod
            # requires TLS now (`--tlsMode requireTLS` above), including for this loopback
            # connection — the cert this validates against is `/keyfile-dir/mongo-ca.crt`, reached
            # directly since this check runs inside the same container mongod does.
            test:
                [
                    'CMD',
                    'mongosh',
                    '--quiet',
                    '--tls',
                    '--tlsCAFile',
                    '/keyfile-dir/mongo-ca.crt',
                    '--eval',
                    "db.adminCommand('ping').ok"
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    # A one-shot: calls rs.initiate() once the real, replSet-enabled mongod is up, then waits for
    # PRIMARY before exiting — see docker/mongo-rs-init.sh for why this cannot live in
    # docker-entrypoint-initdb.d. `setup` depends on this finishing successfully, since db:sync and
    # access:bootstrap both need a set that can take writes.
    mongo-rs-init:
        image: docker.io/library/mongo:8
        restart: 'no'
        profiles: [bundled]
        <<: *data-hardening
        entrypoint: ['bash', '/mongo-rs-init.sh']
        # The only other holder of the root password; the script reads it inside its `--eval`.
        secrets:
            - mongo_root_password
        environment:
            MONGO_ROOT_USER: '${MONGO_ROOT_USER:-root}'
        volumes:
            - ./docker/mongo-rs-init.sh:/mongo-rs-init.sh:ro
            # Connects to `database` over the compose network, not the loopback interface the
            # healthcheck uses — needs its own copy of the CA cert, same reasoning as `app`'s mount.
            - mongo-ca-dir:/ca-dir:ro
        depends_on:
            database:
                condition: service_healthy

    cache:
        image: docker.io/library/redis:8-alpine
        restart: unless-stopped
        # Started only when `COMPOSE_PROFILES` includes `bundled` — see the note above `x-app-env`.
        profiles: [bundled]
        <<: *data-hardening
        # `--save 60 1` keeps an RDB snapshot so a restart does not cold-start every cache key at
        # once. The cache is not a source of truth: losing it is a latency event, not a data loss.
        #
        # `requirepass`: this instance also backs the rate-limit store (see
        # `NODE_RATE_LIMIT_REDIS_URL`'s fallback to `NODE_REDIS_URL`), so an unauthenticated
        # reader on the compose network could reset rate-limit budgets or read another user's
        # cached response, not just warm the cache.
        #
        # The password goes into a config file written to this container's own `/tmp` at start, NOT
        # onto the command line (`--requirepass` shows in `ps` and `docker inspect`). `umask 077`,
        # scoped to that one write, makes the file `0600` from the moment it exists; then it is
        # handed to `redis`. The
        # entrypoint is overridden only to run that step first, and then hands over to the image's
        # own `docker-entrypoint.sh`, which sees `redis-server` as its first argument and drops root
        # to `redis` as usual. `$$` is compose's escape for a literal `$`.
        # https://redis.io/docs/latest/operate/oss_and_stack/management/config/
        secrets:
            - redis_password
        entrypoint:
            - 'sh'
            - '-c'
            - >-
                (umask 077 &&
                printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/redis-auth.conf) &&
                chown redis:redis /tmp/redis-auth.conf &&
                exec docker-entrypoint.sh redis-server /tmp/redis-auth.conf --save 60 1 --appendonly no
        volumes:
            - redis-data:/data
        healthcheck:
            # `REDISCLI_AUTH`: redis-cli's own way to take the password from the environment, so
            # nothing is on its command line. Set for this one command only, read from the secret
            # file. `grep PONG`: a refused login prints an error and still exits 0.
            # https://redis.io/docs/latest/operate/rs/references/cli-utilities/redis-cli/
            test:
                [
                    'CMD-SHELL',
                    'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --no-auth-warning ping | grep -q PONG'
                ]
            interval: 10s
            timeout: 3s
            retries: 5

    queue:
        image: docker.io/library/rabbitmq:4-alpine
        restart: unless-stopped
        # Started only when `COMPOSE_PROFILES` includes `bundled` — see the note above `x-app-env`.
        profiles: [bundled]
        <<: *data-hardening
        # The 4.x image REFUSES `RABBITMQ_DEFAULT_PASS_FILE` ("set but deprecated"), so the password
        # is written into a config file the broker reads, in this container's own `/etc/rabbitmq`.
        # The subshell scopes `umask 077` to that one write: left on, it would reach the broker and
        # the Erlang cookie it creates. Then the file is handed to `rabbitmq` and the image's own
        # entrypoint takes over (it drops root with `su-exec`). `$$` is compose's escape for `$`.
        # https://www.rabbitmq.com/docs/configure#config-file
        secrets:
            - rabbitmq_password
        entrypoint:
            - 'sh'
            - '-c'
            - >-
                (umask 077 &&
                printf 'default_pass = %s\n' "$$(cat /run/secrets/rabbitmq_password)" > /etc/rabbitmq/conf.d/20-secret.conf) &&
                chown rabbitmq:rabbitmq /etc/rabbitmq/conf.d/20-secret.conf &&
                exec docker-entrypoint.sh rabbitmq-server
        environment:
            RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER:-guest}'
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 30s

# One file per secret, under the client's own directory — see "SECRETS ARE FILES" in the header.
# `COMPOSE_PROJECT_NAME` selects the client, the same way it selects `env_file:` above.
# https://docs.docker.com/reference/compose-file/secrets/
secrets:
    mongo_root_password:
        file: ./clients/${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME to the client's name}/secrets/mongo_root_password
    mongo_app_password:
        file: ./clients/${COMPOSE_PROJECT_NAME}/secrets/mongo_app_password
    redis_password:
        file: ./clients/${COMPOSE_PROJECT_NAME}/secrets/redis_password
    rabbitmq_password:
        file: ./clients/${COMPOSE_PROJECT_NAME}/secrets/rabbitmq_password
    token_access:
        file: ./clients/${COMPOSE_PROJECT_NAME}/secrets/token_access
    token_refresh:
        file: ./clients/${COMPOSE_PROJECT_NAME}/secrets/token_refresh
    totp_encryption_key:
        file: ./clients/${COMPOSE_PROJECT_NAME}/secrets/totp_encryption_key
    pii_encryption_key:
        file: ./clients/${COMPOSE_PROJECT_NAME}/secrets/pii_encryption_key
    webhook_secret_encryption_key:
        file: ./clients/${COMPOSE_PROJECT_NAME}/secrets/webhook_secret_encryption_key
    pseudonym_key:
        file: ./clients/${COMPOSE_PROJECT_NAME}/secrets/pseudonym_key
    metrics_token:
        file: ./clients/${COMPOSE_PROJECT_NAME}/secrets/metrics_token

volumes:
    mongo-data:
    mongo-keyfile-dir:
    mongo-ca-dir:
    redis-data:
    rabbitmq-data:
    uploads:
    # Both exist because `app` runs with a read-only root — see `app`'s own `volumes:` for why
    # neither may be a tmpfs.
    storage:
    quarantine:
# ── OBSERVABILITY IS NOT IN THIS FILE, ON PURPOSE ───────────────────────────────────────────────
# The development stack runs Prometheus, Loki, Tempo, Grafana and an OTel collector next to the
# API because a developer wants the whole estate on one machine with one command.
#
# A deployment usually does not: telemetry outlives any single service and belongs to a collector
# the application merely points at. So the API exports OTLP to whatever
# `OTEL_EXPORTER_OTLP_ENDPOINT` names — a collector you already run, a managed backend, or nothing
# at all, which is what an empty value means and is a valid choice.
#
# To run the estate here anyway, the definitions are already written: the observability services in
# `docker-compose.yml` and their configuration under `docker/observability/` work unchanged.
# Compose merges files left to right, so
#   docker compose -f docker-compose.production.yml -f docker-compose.yml up -d
# is the wrong way to do it — it drags the bind-mounts and dev commands back in. Copy the services
# you want into an override file instead.
