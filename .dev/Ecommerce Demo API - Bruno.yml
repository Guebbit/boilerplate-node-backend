opencollection: 1.0.0
info:
  name: Ecommerce Demo API
config:
  environments:
    - name: Local
      variables:
        - name: baseUrl
          value: http://localhost:3000
    - name: Production
      variables:
        - name: baseUrl
          value: https://api.example.com
items:
  - info:
      name: System
      type: folder
      seq: 1
    request:
      auth: inherit
    items:
      - info:
          name: API health check
          type: http
          seq: 1
          tags:
            - System
        http:
          method: GET
          url: "{{baseUrl}}/"
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        examples:
          - name: 200 Response
            description: API is running
            request:
              url: "{{baseUrl}}/"
              method: GET
            response:
              status: 200
              statusText: OK
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "success": true,
                    "status": 200,
                    "message": "API is running",
                    "data": {
                      "status": "ok"
                    }
                  }
