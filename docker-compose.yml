# Top level block where each service (container) is defined
services:
    # Single service (container). Name used as network hostname
    app:
        # (Optional) Custom container name
        # container_name: boilerplate-node

        # Build the image from the Dockerfile.
        # The name will be derived from this folder and the container name
        build:
            context: .
            # Better to keep the "Dockerfile" name and use folders to group files per container/service
            dockerfile: .docker/Dockerfile

        # no (default): Don't restart the container automatically
        # always: Always restart the container if it stops for any reason (even manual stop)
        # unless-stopped: same as "always", unless the container is manually stopped
        # on-failure: Restart the container if it exits with a non-zero exit code (on-failure:N to limit to N retries)
        restart: unless-stopped

        # Port mapping HOST:CONTAINER.
        # The requests on the localhost:HOST port get forwarded to the port of the localhost:CONTAINER
        ports:
            - '${NODE_PORT:-3000}:${NODE_PORT:-3000}'

        # Enviroment variables that get injected into the container at runtime
        # If the .env variable change: a rebuild is necessary to apply the change.
        environment:
            # The Mongo connection string comes from `.env` (NODE_DB_URI), which already points at
            # the "database" service hostname. Do not redeclare it here — an entry in this block
            # shadows `.env` and makes an Atlas/external URI impossible to set without editing compose.
            NODE_ENV: 'development' # Node environment (production or development)
            NODE_REDIS_URL: 'redis://redis:6379'
            NODE_RABBITMQ_URL: 'amqp://guest:guest@rabbitmq:5672'
            NODE_ENABLE_CLUSTERING: '${NODE_ENABLE_CLUSTERING:-0}'
            # Per-IP rate limits, sized for one person browsing. A live E2E run drives the whole
            # frontend suite from a single address and exceeds both budgets, at which point the API
            # answers 429 and the failures read as "login is broken" rather than "out of allowance".
            # Declared here so a run can raise them from the shell — `NODE_RATE_LIMIT_MAX=1000
            # NODE_AUTH_RATE_LIMIT_MAX=1000 npm run compose:restart` — instead of editing `.env`.
            # The defaults match `.env`, so an ordinary `up` is unchanged. Two buckets, deliberately
            # decoupled: the auth one is what makes password guessing expensive, so widening the
            # global one must never widen it. Never raise either in a deployed environment.
            NODE_RATE_LIMIT_MAX: '${NODE_RATE_LIMIT_MAX:-100}'
            NODE_AUTH_RATE_LIMIT_MAX: '${NODE_AUTH_RATE_LIMIT_MAX:-10}'
            # Observability: send traces to OTel Collector, which fans out to backends.
            OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
            NODE_SERVICE_NAME: '${NODE_SERVICE_NAME:-api}'

        # Persist data.
        # Compose manages the lifecycle of this volume when up/down
        # WARNING: You muse consider UID/GID mapping when bind-mounting host folders.
        #     Best practice is to run container processes as non-root
        volumes:
            # BIND-MOUNT volume (host path : container path). The container reads the live /app files directly from your host folder (hot reload).
            #     Meaning: "Use the . folder (current) on my machine and make it appear at /app inside the container."
            #     Z is for SELinux that can cause problems (if its present)
            - .:/app:Z
            # ANONYMOUS volume managed by docker/podman mounted at /app/node_modules inside the container.
            #     It preserves/install node_modules independently of the host folder.
            #     Good for ephemeral per-container storage. Use when you don't care about managing the volume later
            - /app/node_modules
            # NAMED volume (need to be listed in the "volumes" section): same as the anonymous volume,
            #     but easy to reuse, inspect, backup, control lifecycle and, more importantly, to SHARE between containers.
            # - example-volume:/data/db

        # Commands to be executed at RUNTIME when the container starts. Replaces Dockerfile commands (if any)
        #
        # `db:bootstrap` runs migrate-mongo (schema/indexes) then the seeder (demo data) before the
        # server starts, so a fresh `compose up` yields a populated, browsable stack instead of empty
        # lists that read as "not wired". Both halves are idempotent, so every later boot is a no-op,
        # and the seeder refuses to run when NODE_ENV=production.
        command:
            [
                'sh',
                '-c',
                'npm run db:bootstrap && if [ "$${NODE_ENABLE_CLUSTERING:-0}" = "1" ]; then npm run dev:docker:cluster; else npm run dev:docker; fi'
            ]

        # Containers which this container depends on. Affects container start order.
        # `database` waits for the healthcheck rather than just for the container to start:
        # `db:bootstrap` runs before the server and needs Mongo actually accepting connections.
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_started
            rabbitmq:
                condition: service_started
            otel-collector:
                condition: service_started

        # Health check to verify the container is ready to accept traffic
        # Inspect with "podman ps" or "podman inspect <container name>"
        healthcheck:
            # `node -e`, not `curl -f`: the image is node:*-alpine and does not ship curl, so the
            # curl form exited non-zero every time and parked the container on `unhealthy` while
            # the API was answering 200 on `/` throughout. Node's built-in fetch needs nothing
            # added to the image.
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://localhost:${NODE_PORT:-3000}/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
                ]
            # How often to run the test
            interval: 2m
            # How long to wait for the test to complete
            timeout: 5s
            # How many consecutive failures needed to consider the container unhealthy
            retries: 3
            # Initial grace period to wait before starting health check
            start_period: 10s

    # Another container
    database:
        # Same
        # container_name: boilerplate-mongodb

        # Official mongo image, downloaded from the web as is
        # from docker hub (if not already present locally)
        image: mongo:8

        # Same
        restart: unless-stopped

        # Same
        environment:
            # Name of the database to create. Must match the database in NODE_DB_URI.
            MONGO_INITDB_DATABASE: ${NODE_MONGODB_NAME:-boilerplate-node-backend}

        # Same
        volumes:
            # NAMED volume. Store mongodb data on the host machine
            - boilerplate_mongodb_volume:/data/db

        # Same
        ports:
            - '${NODE_MONGODB_PORT:-27017}:27017'

        # The app's boot-time db:bootstrap waits on this before it runs.
        healthcheck:
            test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

    # Redis is used as an in-memory cache layer. The app stores response data here with a TTL so repeated
    # requests are served from memory instead of hitting MongoDB again. On restart the cache is cold (data is lost),
    # which is fine since Redis here is cache-only, not a primary store.
    redis:
        image: redis:7
        restart: unless-stopped
        # Redis defaults to `maxmemory 0` — unlimited — and would grow until the host or the
        # container limit stops it. That is the wrong default for a cache: entries here are worth
        # keeping only while they are cheap, and nothing in the app bounds how many accumulate.
        # `GET /products` is public and its answers live for an hour, so entry count follows
        # traffic rather than catalogue size.
        #
        # `allkeys-lru` is what makes the cap a cache policy rather than an error: at the ceiling
        # Redis evicts the least recently used key and accepts the write. The default
        # `noeviction` would instead start REFUSING writes — the app fails open and would keep
        # serving, but it would log a warning per request and never cache again until something
        # expired. `allkeys-` (not `volatile-`) because every key here carries a TTL anyway.
        command: >-
            redis-server
            --maxmemory ${NODE_REDIS_MAXMEMORY:-256mb}
            --maxmemory-policy ${NODE_REDIS_MAXMEMORY_POLICY:-allkeys-lru}
        ports:
            - '${NODE_REDIS_PORT:-6379}:6379'

    # RabbitMQ: message broker for async tasks (email, PDF generation, etc.).
    rabbitmq:
        image: rabbitmq:3-management
        restart: unless-stopped
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        ports:
            - '${RABBITMQ_AMQP_PORT:-5672}:5672' # AMQP protocol
            - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672' # Management UI
        volumes:
            - rabbitmq_volume:/var/lib/rabbitmq

    # Tempo: stores OpenTelemetry traces. Receives OTLP/gRPC from the OTel Collector.
    tempo:
        image: grafana/tempo:2.6.1
        restart: unless-stopped
        command: ['-config.file=/etc/tempo/tempo.yaml']
        volumes:
            - ./.docker/observability/tempo.config.yaml:/etc/tempo/tempo.yaml:Z
            - tempo_volume:/var/tempo
        # Port 4318 is no longer exposed to the host — the collector talks to Tempo internally.

    # OTel Collector: single ingestion point for all telemetry signals from the app.
    # Receives OTLP/HTTP on :4318 and OTLP/gRPC on :4317, then fans out to Tempo.
    otel-collector:
        image: otel/opentelemetry-collector-contrib:0.114.0
        restart: unless-stopped
        command: ['--config=/etc/otel-collector-config.yaml']
        volumes:
            - ./.docker/observability/otel-collector.config.yaml:/etc/otel-collector-config.yaml:Z
        ports:
            - '${OTEL_OTLP_HTTP_PORT:-4318}:4318' # OTLP/HTTP (used by the app)
            - '${OTEL_OTLP_GRPC_PORT:-4317}:4317' # OTLP/gRPC (optional direct use)
        depends_on:
            - tempo

    # Prometheus: scrapes /metrics from the app and stores numeric time-series.
    prometheus:
        image: prom/prometheus:v2.55.1
        restart: unless-stopped
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.retention.time=7d'
        volumes:
            - ./.docker/observability/prometheus.config.yaml:/etc/prometheus/prometheus.yml:Z
            - ./.docker/observability/prometheus.alert-rules.yaml:/etc/prometheus/rules/alerts.yml:Z
            - prometheus_volume:/prometheus
        ports:
            - '${PROMETHEUS_PORT:-9090}:9090'
        depends_on:
            - alertmanager

    # Alertmanager: receives firing alerts from Prometheus and routes notifications.
    alertmanager:
        image: prom/alertmanager:v0.27.0
        restart: unless-stopped
        command: ['--config.file=/etc/alertmanager/alertmanager.yml']
        volumes:
            - ./.docker/observability/alertmanager.config.yaml:/etc/alertmanager/alertmanager.yml:Z
        ports:
            - '${ALERTMANAGER_PORT:-9093}:9093'

    # Loki: stores log lines shipped by Promtail. Grafana queries it for log exploration.
    loki:
        image: grafana/loki:3.3.2
        restart: unless-stopped
        command: ['-config.file=/etc/loki/loki-config.yaml']
        volumes:
            - ./.docker/observability/loki.config.yaml:/etc/loki/loki-config.yaml:Z
            - loki_volume:/var/loki
        ports:
            - '${LOKI_PORT:-3100}:3100'

    # Promtail: tails Docker container log files and ships them to Loki.
    promtail:
        image: grafana/promtail:3.3.2
        restart: unless-stopped
        command: ['-config.file=/etc/promtail/promtail-config.yaml']
        volumes:
            - ./.docker/observability/promtail.config.yaml:/etc/promtail/promtail-config.yaml:Z
        depends_on:
            - loki

    # Grafana: single UI to explore traces (Tempo), metrics (Prometheus), and logs (Loki).
    grafana:
        image: grafana/grafana:11.4.0
        restart: unless-stopped
        environment:
            GF_AUTH_ANONYMOUS_ENABLED: 'true'
            GF_AUTH_ANONYMOUS_ORG_ROLE: 'Admin'
            GF_AUTH_DISABLE_LOGIN_FORM: 'true'
        volumes:
            - ./.docker/observability/grafana.datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:Z
            - ./.docker/observability/grafana.dashboard-providers.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:Z
            - ./.docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:Z
        ports:
            - '${GRAFANA_PORT:-3001}:3000'
        depends_on:
            - tempo
            - prometheus
            - loki

    # Alloy: browser-facing collector for the frontend (Grafana Faro Web SDK).
    # Receives errors/logs/web-vitals/traces from the browser on the Faro port, then fans
    # them into Loki (logs) and the OTel Collector -> Tempo (traces). See the config for wiring.
    alloy:
        image: grafana/alloy:v1.5.1
        restart: unless-stopped
        command:
            - 'run'
            - '--server.http.listen-addr=0.0.0.0:12345'
            - '--storage.path=/tmp/alloy'
            - '/etc/alloy/config.alloy'
        volumes:
            - ./.docker/observability/alloy.config.alloy:/etc/alloy/config.alloy:Z
        ports:
            - '${ALLOY_FARO_PORT:-12347}:12347' # Faro receiver — the frontend posts telemetry here
            - '${ALLOY_UI_PORT:-12345}:12345' # Alloy UI — inspect the ingest pipeline while debugging
        depends_on:
            - loki
            - otel-collector

    # Umami: self-hosted product analytics (pageviews + custom events) — replaces PostHog cloud.
    # The frontend loads its tracking script from this origin; events land in umami-db.
    umami:
        image: ghcr.io/umami-software/umami:postgresql-v2.14.0
        restart: unless-stopped
        environment:
            DATABASE_TYPE: 'postgresql'
            DATABASE_URL: 'postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/${UMAMI_DB_NAME:-umami}'
            # Salt used to hash session IDs. Change this to any random string.
            APP_SECRET: '${UMAMI_APP_SECRET:-change-me-please}'
        ports:
            # 3080, not 8090: 8080-8099 is the paired frontend's port block (see the port map in
            # the README) and 8090 is where its docs container lives.
            - '${UMAMI_PORT:-3080}:3000'
        depends_on:
            umami-db:
                condition: service_healthy

    # Postgres backing store for Umami (kept separate from the app's MongoDB).
    umami-db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${UMAMI_DB_NAME:-umami}'
            POSTGRES_USER: '${UMAMI_DB_USER:-umami}'
            POSTGRES_PASSWORD: '${UMAMI_DB_PASSWORD:-umami}'
        volumes:
            - umami_db_volume:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${UMAMI_DB_USER:-umami} -d ${UMAMI_DB_NAME:-umami}']
            interval: 10s
            timeout: 5s
            retries: 5

    # Umami init: one-shot job that stamps the admin username/password from .env onto
    # Umami's default seeded account, so the stack comes up ready to log in (no manual step).
    umami-init:
        image: postgres:16-alpine
        restart: 'no'
        entrypoint: ['/bin/sh', '/umami-init.sh']
        environment:
            DATABASE_URL: 'postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/${UMAMI_DB_NAME:-umami}'
            UMAMI_ADMIN_USER: '${UMAMI_ADMIN_USER:-admin}'
            UMAMI_ADMIN_PASSWORD: '${UMAMI_ADMIN_PASSWORD:-umami}'
            # Fixed website id so the frontend's data-website-id is known up front.
            UMAMI_WEBSITE_ID: '${UMAMI_WEBSITE_ID:-00000000-0000-4000-8000-000000000001}'
            UMAMI_WEBSITE_NAME: '${UMAMI_WEBSITE_NAME:-Frontend}'
            UMAMI_WEBSITE_DOMAIN: '${UMAMI_WEBSITE_DOMAIN:-localhost}'
        volumes:
            - ./.docker/observability/umami-init.sh:/umami-init.sh:ro,Z
        depends_on:
            umami-db:
                condition: service_healthy
            umami:
                condition: service_started

    # Docs: VitePress static site served by Nginx.
    docs:
        build:
            context: .
            dockerfile: .docker/Dockerfile.docs
        restart: unless-stopped
        ports:
            # 3090 sits in this repo's 3000-3099 block. It used to be 4173, which the paired
            # frontend also claimed — for its own docs AND for its e2e vite server.
            - '${DOCS_PORT:-3090}:80'

# Volumes that will be used by the containers (and will persist unless removed manually)
volumes:
    boilerplate_mongodb_volume:
    tempo_volume:
    rabbitmq_volume:
    prometheus_volume:
    loki_volume:
    umami_db_volume:

# Commands:
# podman ps: list running containers (-a for all)
# podman compose build: Build the images (not the containers) (--no-cache to force fresh build)
# podman compose up: Create (if needed) and start the containers (-d to run in background, stands for "detached")
# podman compose down: Stop and remove the containers and the network (necessary before rebuilding)
# podman logs <container name>: Show logs of a container
# podman exec -it <container name> bash: Open a shell inside a container (-it stands for "interactive")

# How to handle code changes (.dev, .hybrid and .prod yml files for more examples)
# COPY (build-time): The code from host directory (es: this repo) is baked in the image.
#       Changes require rebuilding the image to be reflected inside the container.
#       Great for CI/production, slow for dev iteration.
# BIND (runtime/dev-time): the container reads the code directly from the host directory (container sees host files live)
#       Changes are immediate inside the container (no rebuild)
#       Warning: rootless mode or mismatched UIDs can cause permissions problems (especially on Linux).
# HYBRID: ????
# Notes:
# - Always add .dockerignore with node_modules, .env, etc to prevent slow builds and leaks
# - Use service name (mongo) in Compose. Do NOT use localhost for service-to-service
# - Check UID/GID or run container user mapping. You may need to chown files or run the container process as the host user
