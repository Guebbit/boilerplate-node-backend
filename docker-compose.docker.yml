# Compose override for Docker.
# Mounts the Docker host log path so Promtail can tail container log files.
#
# Applied by the `npm run compose:*` scripts when CONTAINER_ENGINE resolves to docker, which pass
# it with `-f`. Docker Compose would also honour COMPOSE_FILE in .env, but its Podman counterpart
# does not — so both runtimes select their override the same way, through the scripts.
# See docker-compose.podman.yml.

services:
    promtail:
        volumes:
            # Mount the Docker container log directory so Promtail can tail JSON log files.
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
