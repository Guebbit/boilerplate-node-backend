# Compose override for Podman.
# Swaps promtail to use the Podman CRI-format config and mounts the correct host log path.
#
# Applied by the `npm run compose:*` scripts when CONTAINER_ENGINE resolves to podman, which pass
# it with `-f`. Do NOT switch this to
# COMPOSE_FILE in .env: podman-compose ignores that variable there (verified 2026-08-05 against
# podman-compose 1.6.0), so the override would silently not apply and Promtail would tail nothing.
# Needs PODMAN_CONTAINERS_PATH in .env — see .env-example.

services:
    promtail:
        volumes:
            # Swap in the Podman-specific Promtail config (CRI format, Podman paths).
            - ./.docker/observability/promtail.podman.config.yaml:/etc/promtail/promtail-config.yaml:Z
            # Mount the Podman container storage so Promtail can tail the log files.
            # Set PODMAN_CONTAINERS_PATH in .env (see .env-example).
            - ${PODMAN_CONTAINERS_PATH}:/var/lib/containers/overlay-containers:ro
