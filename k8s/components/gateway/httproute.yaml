# Everything goes to the `app` Service. The Service's endpoints are the Ready pods only, which is
# what the controller reads: a pod whose `/readyz` answers 503 is dropped from the route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: app
spec:
    parentRefs:
        - name: app
    rules:
        - backendRefs:
              - name: app
                port: 3000
