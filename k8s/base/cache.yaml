# Redis for the cache, the rate-limit counters and the idempotency/session claims. One instance
# on the rig; `noeviction` on purpose: a counter or a single-use claim must never be evicted
# (compose.production.yaml runs a second instance for the same reason). Nothing persists:
# `--save ""` and no append-only file, so a restart empties it, which the app tolerates.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: cache
    labels:
        app.kubernetes.io/name: cache
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app.kubernetes.io/name: cache
    template:
        metadata:
            labels:
                app.kubernetes.io/name: cache
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
                # The official image's own `redis` user (uid/gid 999).
                runAsUser: 999
                runAsGroup: 999
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: redis
                  image: docker.io/library/redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
                  args:
                      [redis-server, --maxmemory-policy, noeviction, --save, '', --appendonly, 'no']
                  ports:
                      - name: redis
                        containerPort: 6379
                  resources:
                      requests:
                          cpu: 50m
                          memory: 64Mi
                      limits:
                          memory: 256Mi
                  securityContext:
                      readOnlyRootFilesystem: true
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop: [ALL]
                  readinessProbe:
                      exec:
                          command: [redis-cli, ping]
                      periodSeconds: 5
                  volumeMounts:
                      - name: data
                        mountPath: /data
            volumes:
                - name: data
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: cache
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: cache
    ports:
        - name: redis
          port: 6379
          targetPort: redis
