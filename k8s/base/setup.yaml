# `setup`: indexes and the access bootstrap, once per release, before the app rolls out
# (compose's `setup` service). Mongo only: it needs no Redis, no volume and no upload secret
# beyond the keys the config loader insists on.
#
# A Job's pod template is immutable: to run it again (a new image), delete it first and apply again.
# k8s/rig.sh never needs to: `up` always starts a fresh cluster.
apiVersion: batch/v1
kind: Job
metadata:
    name: setup
spec:
    backoffLimit: 6
    template:
        metadata:
            labels:
                app.kubernetes.io/name: setup
        spec:
            automountServiceAccountToken: false
            restartPolicy: OnFailure
            securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: setup
                  image: boilerplate-app
                  # `args`: the image's dumb-init ENTRYPOINT stays. Same command as compose.production.yaml.
                  args:
                      - sh
                      - -c
                      - node --import tsx scripts/db/sync-indexes.ts && node --import tsx scripts/db/bootstrap-access.ts
                  envFrom:
                      - configMapRef:
                            name: app-env
                      - configMapRef:
                            name: edge-env
                  env:
                      - name: NODE_SERVICE_NAME
                        value: api-setup
                  resources:
                      requests:
                          cpu: 100m
                          memory: 640Mi
                      limits:
                          memory: 1Gi
                  securityContext:
                      readOnlyRootFilesystem: true
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop: [ALL]
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
                      - name: secrets
                        mountPath: /run/secrets
                        readOnly: true
            volumes:
                - name: tmp
                  emptyDir:
                      sizeLimit: 64Mi
                - name: secrets
                  secret:
                      secretName: app-secrets
                      defaultMode: 0444
