# The local test cluster: `base`, the gateway component, and Envoy Gateway as the controller.
# Needs the Envoy Gateway CRDs and controller installed first (k8s/rig.sh does: its pinned release,
# checked against a sha256). Not for a real cluster: no TLS, a NodePort and a throwaway Mongo.
# https://gateway.envoyproxy.io/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boilerplate

resources:
    - ../../base
    - gatewayclass.yaml
    - envoyproxy.yaml

components:
    - ../../components/gateway

# The component's Gateway names no class; this overlay's controller is Envoy Gateway's `eg`.
patches:
    - target:
          group: gateway.networking.k8s.io
          kind: Gateway
          name: app
      patch: |-
          - op: replace
            path: /spec/gatewayClassName
            value: eg
    # The rig has no broker (base/app.env sets no NODE_RABBITMQ_URL): the app runs its jobs in its
    # own process, so a `worker` or `worker-heavy` would consume nothing. Zero copies save about 0.5 GB on the one node.
    # A cluster with a broker keeps the base's one copy.
    - target:
          group: apps
          kind: Deployment
          name: worker
      patch: |-
          - op: replace
            path: /spec/replicas
            value: 0
    - target:
          group: apps
          kind: Deployment
          name: worker-heavy
      patch: |-
          - op: replace
            path: /spec/replicas
            value: 0
