    items:
      - info:
          name: List shipping methods
          type: http
          seq: 1
          tags:
            - Delivery
        http:
          method: GET
          url: "{{baseUrl}}/delivery/methods"
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        examples:
          - name: 200 Response
            description: The methods
            request:
              url: "{{baseUrl}}/delivery/methods"
              method: GET
            response:
              status: 200
              statusText: OK
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "success": true,
                    "status": 200,
                    "message": "The methods",
                    "data": {
                      "methods": [
                        {
                          "id": "65dc8a99604c307b702b5ccc",
                          "price": 100,
                          "freeAbove": 0
                        }
                      ]
                    }
                  }
          - name: 500 Response
            description: Internal server error
            request:
              url: "{{baseUrl}}/delivery/methods"
              method: GET
            response:
              status: 500
              statusText: Internal Server Error
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "success": false,
                    "status": 500,
                    "message": "Internal server error",
                    "errors": [
                      {
                        "code": "VALIDATION_ERROR",
                        "message": "Field \"email\" is required",
                        "details": "string"
                      }
                    ]
                  }
