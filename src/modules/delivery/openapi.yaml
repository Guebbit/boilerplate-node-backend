openapi: 3.0.3
info:
    title: delivery — module contract
    version: '2.0.0'

paths:
    /delivery/methods:
        get:
            tags: [Delivery]
            summary: List shipping methods
            description: Every shipping method this shop offers — flat rates and free-above thresholds, unfiltered. Public, because what shipping costs is pre-purchase information; the authoritative pricing and weight-fit check happen server-side, against the caller's real basket, at `PUT /cart/shipping-method` and again at checkout — this list is a catalogue, not a quote.
            operationId: listShippingMethods
            security: []
            responses:
                '200':
                    description: The methods
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ShippingMethodsResponseEnvelope'
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /delivery/order/{orderId}:
        get:
            tags: [Delivery]
            summary: Get the shipment behind an order
            description: The parcel for one of the caller's orders — tracking code and whether it has arrived. Ownership is the order's, read through the same scope every order read uses. No parcel yet (the order has not reached `shipped`) is a 404 — absence is the answer.
            operationId: getShipmentByOrder
            security:
                - bearerAuth: []
            parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: One of the caller's own orders
            responses:
                '200':
                    description: The shipment
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ShipmentEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /delivery/order/{orderId}/ship:
        post:
            tags: [Delivery]
            summary: Record a parcel's handover to the carrier
            description: Creates the parcel record and sends the shipped email, then reports the fact to `orders` — the order moves `processing → shipped`. `trackingCode` is required exactly when the order's shipping method is `tracked` (looked up live, not frozen); refused with a named 422 when a tracked method's code is missing. Refuses an order that is not `processing` with a named 409 — this door is how that move happens now, not `PUT /orders/{id}`. Refuses a digital-only order outright, also 409 (`ORDER_NOTHING_TO_SHIP`) — nothing on it would ever ride in a parcel; `POST /delivery/order/{orderId}/fulfill` is that order's door instead.
            operationId: shipOrder
            security:
                - bearerAuth: []
            parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: The order to ship
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ShipOrderRequest'
            responses:
                '200':
                    description: The shipment
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ShipmentEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /delivery/order/{orderId}/start:
        post:
            tags: [Delivery]
            summary: Begin fulfilling a paid order
            description: >-
                Reports that fulfilment has started — the order moves `paid → processing`. No
                parcel exists yet at this point; that comes later, at
                `POST /delivery/order/{orderId}/ship`. Narrower than `orders.any.update` on
                purpose — `delivery.any.start` lets the warehouse begin work on an order without
                being handed the run of the order record. Refuses an order that is not `paid`
                with a named 409.
            operationId: startFulfilment
            security:
                - bearerAuth: []
            parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: The order to start fulfilling
            responses:
                '200':
                    description: The order, now `processing`
                    content:
                        application/json:
                            schema:
                                $ref: '../orders/openapi.yaml#/components/schemas/OrderEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /delivery/order/{orderId}/deliver:
        post:
            tags: [Delivery]
            summary: Record a parcel's arrival
            description: Stamps the shipment delivered and reports the fact to `orders` — the order moves `shipped → delivered`. Refuses an order that is not `shipped` with a named 409.
            operationId: deliverOrder
            security:
                - bearerAuth: []
            parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: The order that arrived
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeliverOrderRequest'
            responses:
                '200':
                    description: The shipment
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ShipmentEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /delivery/order/{orderId}/fulfill:
        post:
            tags: [Delivery]
            summary: Mark a digital-only order fulfilled, with no shipment
            description: >-
                The digital-only alternative to `ship`/`deliver` — reports that a `processing`
                order with no physical lines is done, moving it straight to `delivered` with no
                parcel record. Refuses an order that is not `processing` with a named 409
                (`ORDER_NOT_PROCESSING`), and one that carries any line that still needs shipping
                with a named 409 (`ORDER_NOT_DIGITAL_ONLY`) — that order ships through the ordinary
                door instead.
            operationId: fulfillOrder
            security:
                - bearerAuth: []
            parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: The digital-only order to mark fulfilled
            responses:
                '200':
                    description: The order, now `delivered`
                    content:
                        application/json:
                            schema:
                                $ref: '../orders/openapi.yaml#/components/schemas/OrderEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # ── Delivery module ─────────────────────────────────────────────────────
        # Owned by src/modules/delivery. The methods are the checkout's selector; the shipment
        # is the carrier's record of one order's parcel.

        ShippingMethod:
            type: object
            additionalProperties: false
            required: [id, price, tracked, requiresAddress]
            properties:
                id:
                    type: string
                    description: Stable id, frozen onto orders at checkout (standard, express, pickup).
                price:
                    type: number
                    format: double
                    minimum: 0
                    description: Flat rate, in the shop's currency.
                freeAbove:
                    type: number
                    format: double
                    minimum: 0
                    description: Items total at which this method becomes free. Absent — it never does.
                tracked:
                    type: boolean
                    description: Whether a parcel sent by this method carries a tracking code. Looked up live by the order's shippingMethod id when it ships — not frozen at checkout — so a rate change also changes what the shipping door requires.
                requiresAddress:
                    type: boolean
                    description: Whether this method needs a shipping address to deliver to (a courier does; a counter pickup does not). Checkout enforces it — a basket needing shipping refuses with `CART_ADDRESS_REQUIRED` when the chosen method requires one and none is on file.
                maxInsuredValue:
                    type: number
                    format: double
                    minimum: 0
                    description: The most this method insures a parcel for. Informational only — nothing in this application enforces it against an order's total.
                minWeight:
                    type: integer
                    minimum: 0
                    description: Grams. Absent means no floor. Enforced server-side — `PUT /cart/shipping-method` refuses a basket that doesn't reach it, and checkout refuses one chosen outside its range.
                maxWeight:
                    type: integer
                    minimum: 0
                    description: Grams. Absent means no ceiling. Enforced the same way as minWeight.

        ShippingMethodsResponse:
            type: object
            additionalProperties: false
            required: [methods]
            properties:
                methods:
                    type: array
                    items:
                        $ref: '#/components/schemas/ShippingMethod'

        ShippingMethodsResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/ShippingMethodsResponse'

        Shipment:
            type: object
            additionalProperties: false
            required: [id, orderId, status]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                trackingCode:
                    type: string
                    description: The carrier's handle on the parcel. Absent for a method that carries no tracking (ShippingMethod.tracked is false).
                status:
                    type: string
                    enum: [shipped, delivered]
                    description: The tail of the order's lifecycle, as the carrier sees it.
                deliveredAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        ShipOrderRequest:
            type: object
            additionalProperties: false
            properties:
                trackingCode:
                    type: string
                    description: The carrier's handle on the parcel. Required when the order's shipping method is tracked; optional otherwise.
                forced:
                    type: boolean
                    description: Skip the normal `processing`-only gate — the caller must hold `orders.any.override`, and `reason` is then required. Still creates the parcel record and sends the shipped email; still refuses a tracked method with no `trackingCode`.
                reason:
                    type: string
                    minLength: 1
                    description: Required exactly when `forced` is `true` — why the normal door didn't apply. Recorded on the order's override history.

        DeliverOrderRequest:
            type: object
            additionalProperties: false
            properties:
                forced:
                    type: boolean
                    description: Skip the normal `shipped`-only gate — the caller must hold `orders.any.override`, and `reason` is then required. Still stamps the shipment delivered and reports the fact.
                reason:
                    type: string
                    minLength: 1
                    description: Required exactly when `forced` is `true`.

        ShipmentEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/Shipment'

        # Used by `POST /account/export` (`shared/contracts/openapi.root.yaml`) — mirrors
        # `Shipment` exactly, kept as its own schema since an export's shape is free to diverge
        # from the admin response even though it doesn't today; every field here is already the
        # caller's own, so nothing needs stripping.
        ExportShipment:
            type: object
            additionalProperties: false
            required: [id, orderId, trackingCode, status]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                trackingCode:
                    type: string
                status:
                    type: string
                    enum: [shipped, delivered]
                deliveredAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

