# The observability module’s async contract — the SSE stream it serves.
#
# A complete AsyncAPI document, for the same reason `./openapi.yaml` beside it is a complete
# OpenAPI one: it can be linted (`npm run lint:asyncapi:modules`) and read on its own, without the
# rest of the contract. What makes it a SLICE is only that the bundler merges its
# server, channels, operations and components into the contracts at the repo root — the
# service-wide facts (tags, the real `info`) come from `shared/contracts/asyncapi.root.yaml`, so
# the `info` block below exists purely to make this file valid on its own.
#
# This module owns the SSE channels because it serves `/observability/events`: whoever holds the
# route decides what goes down it. It owns `sseLocal` for the same reason — a server is only
# reachable through the channels bound to it, so it is declared beside them rather than in the
# root, and a bundle that leaves this module out leaves the server out with it.
#
# The payload shape is `stream.ts`’s `buildObservabilityPayload`, and `npm run gen:asyncapi` turns
# the schemas here into the types that function is checked against — which is what stops the wire
# and the producer drifting apart.
asyncapi: 3.0.0
info:
    title: Observability async contract
    version: 1.0.0
    description: Server-sent metrics events for the observability dashboard.
servers:
    sseLocal:
        host: localhost:3000
        protocol: http
        description: Local HTTP server for SSE (`/observability/events`).
channels:
    observability.metrics.snapshot:
        address: observability.metrics.snapshot
        description: Initial metrics snapshot sent on SSE connect.
        messages:
            MetricsSnapshotEvent:
                $ref: '#/components/messages/MetricsSnapshotEvent'
    observability.metrics.updated:
        address: observability.metrics.updated
        description: Periodic SSE metrics update.
        messages:
            MetricsUpdatedEvent:
                $ref: '#/components/messages/MetricsUpdatedEvent'
    observability.heartbeat:
        address: observability.heartbeat
        description: SSE heartbeat event.
        messages:
            HeartbeatEvent:
                $ref: '#/components/messages/HeartbeatEvent'
operations:
    sseMetricsSnapshot:
        action: send
        channel:
            $ref: '#/channels/observability.metrics.snapshot'
        description: >-
            Sent once, immediately on connect, so a dashboard renders populated instead of
            waiting out the first 5-second tick with empty cards. Same payload shape as the
            periodic update — a client handles one message type, not two.
        messages:
            - $ref: '#/channels/observability.metrics.snapshot/messages/MetricsSnapshotEvent'
    sseMetricsUpdated:
        action: send
        channel:
            $ref: '#/channels/observability.metrics.updated'
        description: >-
            Pushed every 5 seconds for as long as the connection is open. Memory is in BYTES,
            identical to what `GET /observability/health` publishes, so a dashboard showing both
            compares numbers rather than converting units to find out whether they agree.
        messages:
            - $ref: '#/channels/observability.metrics.updated/messages/MetricsUpdatedEvent'
    sseHeartbeat:
        action: send
        channel:
            $ref: '#/channels/observability.heartbeat'
        description: >-
            A 15-second keep-alive carrying no metrics. Idle proxies close a connection that has
            been quiet, and an SSE stream between two ticks looks idle to them; this is also what
            lets a client tell "the stream is alive and nothing changed" from "the stream died".
        messages:
            - $ref: '#/channels/observability.heartbeat/messages/HeartbeatEvent'
components:
    messages:
        MetricsSnapshotEvent:
            name: MetricsSnapshotEvent
            title: Initial observability metrics snapshot
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
        MetricsUpdatedEvent:
            name: MetricsUpdatedEvent
            title: Periodic observability metrics update
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
        HeartbeatEvent:
            name: HeartbeatEvent
            title: Observability heartbeat
            payload:
                $ref: '#/components/schemas/ObservabilityMetricsPayload'
    schemas:
        ObservabilityMetricsPayload:
            type: object
            required:
                - timestamp
                - uptimeSeconds
                - memory
                - http
                - realtime
            properties:
                timestamp:
                    type: string
                    format: date-time
                uptimeSeconds:
                    type: integer
                    minimum: 0
                memory:
                    type: object
                    required:
                        - rss
                        - heapUsed
                        - heapTotal
                        - external
                    properties:
                        rss:
                            type: integer
                            minimum: 0
                        heapUsed:
                            type: integer
                            minimum: 0
                        heapTotal:
                            type: integer
                            minimum: 0
                        external:
                            type: integer
                            minimum: 0
                    additionalProperties: false
                http:
                    type: object
                    required:
                        - totalRequests
                        - totalErrors
                    properties:
                        totalRequests:
                            type: integer
                            minimum: 0
                        totalErrors:
                            type: integer
                            minimum: 0
                    additionalProperties: false
                realtime:
                    type: object
                    required:
                        - sseClients
                    properties:
                        sseClients:
                            type: integer
                            minimum: 0
                    additionalProperties: false
            additionalProperties: false
