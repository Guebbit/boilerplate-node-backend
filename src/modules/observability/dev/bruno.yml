  - info:
      name: Observability
      type: folder
      seq: 3
    request:
      auth: inherit
    items:
      - info:
          name: Observability SSE stream
          type: http
          seq: 1
          tags:
            - Observability
        http:
          method: GET
          url: "{{baseUrl}}/observability/events"
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        examples:
          - name: 200 Response
            description: Server-Sent Events stream
            request:
              url: "{{baseUrl}}/observability/events"
              method: GET
            response:
              status: 200
              statusText: OK
              headers:
                - name: Content-Type
                  value: application/json
          - name: 401 Response
            description: Unauthorized
            request:
              url: "{{baseUrl}}/observability/events"
              method: GET
            response:
              status: 401
              statusText: Unauthorized
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "success": false,
                    "status": 401,
                    "message": "Unauthorized",
                    "errors": [
                      {
                        "code": "VALIDATION_ERROR",
                        "message": "Field \"email\" is required",
                        "details": "string"
                      }
                    ]
                  }
          - name: 403 Response
            description: Forbidden
            request:
              url: "{{baseUrl}}/observability/events"
              method: GET
            response:
              status: 403
              statusText: Forbidden
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "success": false,
