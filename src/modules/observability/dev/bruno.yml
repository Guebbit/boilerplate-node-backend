          maxRedirects: 5
        examples:
          - name: 200 Response
            description: Prometheus exposition text
            request:
              url: "{{baseUrl}}/observability/metrics"
              method: GET
            response:
              status: 200
              statusText: OK
              headers:
                - name: Content-Type
                  value: application/json
          - name: 401 Response
            description: Unauthorized
            request:
              url: "{{baseUrl}}/observability/metrics"
              method: GET
            response:
              status: 401
              statusText: Unauthorized
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "success": false,
                    "status": 401,
                    "message": "Unauthorized",
                    "errors": [
                      {
                        "code": "VALIDATION_ERROR",
                        "message": "Field \"email\" is required",
                        "details": "string"
                      }
                    ]
                  }
          - name: 503 Response
            description: |
              `NODE_METRICS_TOKEN` is not configured. The endpoint denies by default
              rather than opening: an unauthenticated metrics endpoint is not a state
              to arrive at by forgetting an environment variable.
            request:
              url: "{{baseUrl}}/observability/metrics"
              method: GET
            response:
              status: 503
              statusText: Service Unavailable
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "success": false,
                    "status": 503,
                    "message": "`NODE_METRICS_TOKEN` is not configured. The endpoint denies by default\nrather than opening: an unauthenticated metrics endpoint is not a state\nto arrive at by forgetting an environment variable.\n",
                    "errors": [
                      {
                        "code": "VALIDATION_ERROR",
                        "message": "Field \"email\" is required",
                        "details": "string"
                      }
                    ]
                  }
