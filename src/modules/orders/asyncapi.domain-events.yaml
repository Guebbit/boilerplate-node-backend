# The domain events the orders module emits — merged into the `domain-events` section
# (`shared/contracts/asyncapi.domain-events.yaml`), backend-only. A fragment, not a document.
channels:
    domain.order.canceled:
        address: order.canceled
        description: >-
            A cancel went through; stock is already back on the shelf. Written to the transactional
            outbox in the cancel's own transaction (`./services/cancel.ts`), so it exists exactly
            when the cancel does — the `$in` guard makes the write at-most-once, the relay makes
            delivery at-least-once: a listener dedupes on `meta.eventId`.


            `refund` carries the policy with the fact rather than letting the listener infer it: a
            customer cancelling is owed their money, an operator cancelling may not be. It is also
            the only durable promise of that money: `payments` opens its refund record from this
            event, and the relay retries the event until the record exists.


            `cause` says why: it picks the buyer's mail (`orders` sends it from this event, see
            `./services/cancel-mail.ts`), and `reservation_expired` is the cancel a transfer nobody
            sent is answered for by `payments`, any other hold by `orders`.


            `informedAt` (ISO 8601) is when the shop was told, on the two causes that are the
            buyer's own act (`customer`, `withdrawal`): the day the 14-day refund deadline counts
            from. A withdrawal the buyer stated by phone or letter carries the stated day. Never
            published.
        x-transport: outbox
        messages:
            OrderCanceledDomainEvent:
                $ref: '#/components/messages/OrderCanceledDomainEvent'
    domain.order.status_changed:
        address: order.status_changed
        description: >-
            An order's status moved, whoever moved it — a status-only admin override
            (`services/override.ts`) included, indistinguishable here from an ordinary system move.
            Listeners filter on `to`; the event doesn't know or care who moved it or through which
            door, only that it moved. Webhooks fire either way — a subscriber cares that the status
            changed, not by which door.


            Moves forward, with two exceptions: a shipment reported lost steps a `shipped` order
            back to `processing` (the `reopen` event of the lifecycle). The other backward move is
            `reship`, a replacement on a `delivered` order. A listener that assumes statuses only
            advance must allow for both.


            Written to the transactional outbox in the transaction of the status write itself
            (`./services/announce.ts`): at-least-once, so a listener dedupes on `meta.eventId`.
        x-transport: outbox
        messages:
            OrderStatusChangedDomainEvent:
                $ref: '#/components/messages/OrderStatusChangedDomainEvent'
    domain.order.created:
        address: order.created
        description:
            A new order was written — emitted by `services/place.ts`'s `placeOrder`, the one
            function that writes a new order, so this fires exactly once per order regardless of
            which caller (the admin create, the storefront checkout) reached it. `webhooks` is the
            listener that needs this fact as an event rather than as audit/analytics noise. Written
            to the transactional outbox with the order itself, so a placed order is always
            announced.
        x-transport: outbox
        messages:
            OrderCreatedDomainEvent:
                $ref: '#/components/messages/OrderCreatedDomainEvent'
    domain.order.status_overridden:
        address: order.status_overridden
        description:
            "An admin override moved the status forward by hand (`services/override.ts`), written
            to the outbox in the override's own transaction beside its `order.status_changed`.
            `delivery` listens so its fulfillment orders and shipments agree with the status:
            forward to `shipped` ships every remainder, forward to `delivered` delivers them, both
            at `at`. A forced shipment recorded through `delivery` is NOT this event: it never moves
            the order by override."
        x-transport: outbox
        messages:
            OrderStatusOverriddenDomainEvent:
                $ref: '#/components/messages/OrderStatusOverriddenDomainEvent'
    domain.order.billing_corrected:
        address: order.billing_corrected
        description:
            Staff corrected who the order is invoiced to (`./services/billing.ts`). `invoicing`
            listens and, when the order already has an invoice, cancels it with a credit note and
            issues a new one; it dedupes on `meta.eventId`, since one redelivery would burn two
            numbers of a gap-free series. Written to the outbox in the correction's own transaction.
        x-transport: outbox
        messages:
            OrderBillingCorrectedDomainEvent:
                $ref: '#/components/messages/OrderBillingCorrectedDomainEvent'
    domain.order.redacted:
        address: order.redacted
        description:
            "`reap:orders` scrubbed an order's remaining personal data (email, addresses, notes),
            committed in the same transaction as the scrub. The erasure itself only detaches
            `userId`, so this is the moment the data actually goes. No in-process subscriber; it
            exists for the `order.redacted` webhook (GDPR Art. 19)."
        x-transport: outbox
        messages:
            OrderRedactedDomainEvent:
                $ref: '#/components/messages/OrderRedactedDomainEvent'
    domain.order.purchase_hold_placed:
        address: order.purchase_hold_placed
        description:
            The shop's cancellation rule paused a buyer's checkout (`./services/purchase-hold.ts`),
            emitted once per hold actually taken — a redelivered cancel finds the hold already there
            and says nothing. `notifications` turns it into a work notice for the staff who can ban.
        x-transport: in-process
        messages:
            OrderPurchaseHoldPlacedDomainEvent:
                $ref: '#/components/messages/OrderPurchaseHoldPlacedDomainEvent'
operations:
    domainOrderCanceled:
        action: send
        channel:
            $ref: '#/channels/domain.order.canceled'
        summary: A cancel went through; stock is already back on the shelf.
        messages:
            - $ref: '#/channels/domain.order.canceled/messages/OrderCanceledDomainEvent'
    domainOrderStatusChanged:
        action: send
        channel:
            $ref: '#/channels/domain.order.status_changed'
        summary: An order's status moved, whoever moved it.
        messages:
            - $ref: '#/channels/domain.order.status_changed/messages/OrderStatusChangedDomainEvent'
    domainOrderCreated:
        action: send
        channel:
            $ref: '#/channels/domain.order.created'
        summary: A new order was written, once per order.
        messages:
            - $ref: '#/channels/domain.order.created/messages/OrderCreatedDomainEvent'
    domainOrderStatusOverridden:
        action: send
        channel:
            $ref: '#/channels/domain.order.status_overridden'
        summary: An admin override moved the status forward by hand.
        messages:
            - $ref: '#/channels/domain.order.status_overridden/messages/OrderStatusOverriddenDomainEvent'
    domainOrderBillingCorrected:
        action: send
        channel:
            $ref: '#/channels/domain.order.billing_corrected'
        summary: Staff corrected who the order is invoiced to (`./services/billing.ts`).
        messages:
            - $ref: '#/channels/domain.order.billing_corrected/messages/OrderBillingCorrectedDomainEvent'
    domainOrderRedacted:
        action: send
        channel:
            $ref: '#/channels/domain.order.redacted'
        summary:
            "`reap:orders` scrubbed an order's remaining personal data (email, addresses, notes),
            committed in the same transaction as the scrub."
        messages:
            - $ref: '#/channels/domain.order.redacted/messages/OrderRedactedDomainEvent'
    domainOrderPurchaseHoldPlaced:
        action: send
        channel:
            $ref: '#/channels/domain.order.purchase_hold_placed'
        summary: The shop's cancellation rule paused a buyer's checkout.
        messages:
            - $ref: '#/channels/domain.order.purchase_hold_placed/messages/OrderPurchaseHoldPlacedDomainEvent'
components:
    messages:
        OrderCanceledDomainEvent:
            name: OrderCanceledDomainEvent
            title: Order canceled
            payload:
                $ref: '#/components/schemas/OrderCanceledDomainEventPayload'
        OrderStatusChangedDomainEvent:
            name: OrderStatusChangedDomainEvent
            title: Order status changed
            payload:
                $ref: '#/components/schemas/OrderStatusChangedDomainEventPayload'
        OrderCreatedDomainEvent:
            name: OrderCreatedDomainEvent
            title: Order created
            payload:
                $ref: '#/components/schemas/OrderCreatedDomainEventPayload'
        OrderStatusOverriddenDomainEvent:
            name: OrderStatusOverriddenDomainEvent
            title: Order status overridden
            payload:
                $ref: '#/components/schemas/OrderStatusOverriddenDomainEventPayload'
        OrderBillingCorrectedDomainEvent:
            name: OrderBillingCorrectedDomainEvent
            title: Order billing corrected
            payload:
                $ref: '#/components/schemas/OrderBillingCorrectedDomainEventPayload'
        OrderRedactedDomainEvent:
            name: OrderRedactedDomainEvent
            title: Order redacted
            payload:
                $ref: '#/components/schemas/OrderRedactedDomainEventPayload'
        OrderPurchaseHoldPlacedDomainEvent:
            name: OrderPurchaseHoldPlacedDomainEvent
            title: Order purchase hold placed
            payload:
                $ref: '#/components/schemas/OrderPurchaseHoldPlacedDomainEventPayload'
    schemas:
        OrderCanceledDomainEventPayload:
            type: object
            required:
                - orderId
                - refund
                - cause
            properties:
                orderId:
                    type: string
                refund:
                    type: boolean
                cause:
                    title: OrderCancelCause
                    type: string
                    enum:
                        - customer
                        - operator
                        - withdrawal
                        - reservation_expired
                        - erasure
                        - payment_mismatch
                        - lost
                informedAt:
                    type: string
            additionalProperties: false
        OrderStatusChangedDomainEventPayload:
            type: object
            required:
                - orderId
                - from
                - to
            properties:
                orderId:
                    type: string
                from:
                    $ref: ./openapi.yaml#/components/schemas/OrderStatus
                to:
                    $ref: ./openapi.yaml#/components/schemas/OrderStatus
            additionalProperties: false
        OrderCreatedDomainEventPayload:
            type: object
            required:
                - orderId
            properties:
                orderId:
                    type: string
            additionalProperties: false
        OrderStatusOverriddenDomainEventPayload:
            type: object
            required:
                - orderId
                - from
                - to
                - at
                - mode
            properties:
                orderId:
                    type: string
                from:
                    $ref: ./openapi.yaml#/components/schemas/OrderStatus
                to:
                    $ref: ./openapi.yaml#/components/schemas/OrderStatus
                at:
                    type: string
                    description: ISO instant of the override — the instant `withdrawUntil` was counted from.
                mode:
                    type: string
                    enum:
                        - status
            additionalProperties: false
        OrderBillingCorrectedDomainEventPayload:
            type: object
            required:
                - orderId
            properties:
                orderId:
                    type: string
            additionalProperties: false
        OrderRedactedDomainEventPayload:
            type: object
            required:
                - orderId
            properties:
                orderId:
                    type: string
            additionalProperties: false
        OrderPurchaseHoldPlacedDomainEventPayload:
            type: object
            required:
                - tenantId
                - userId
                - until
            properties:
                tenantId:
                    type: string
                userId:
                    type: string
                    description: The buyer whose checkout was paused.
                until:
                    type: string
                    description: ISO instant the pause ends by itself.
            additionalProperties: false
