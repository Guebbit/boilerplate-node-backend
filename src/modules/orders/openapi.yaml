openapi: 3.0.3
info:
    title: orders — module contract
    version: '2.0.0'

paths:
    /orders:
        get:
            tags: [Orders]
            summary: List orders (paginated)
            description: |
                Returns a paginated list of orders.
                Non-admin users are automatically scoped to their own orders; the `userId` filter is ignored for non-admin callers.
            operationId: listOrders
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/UserIdParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/ProductIdParam'
                - name: email
                  in: query
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
            responses:
                '200':
                    description: Orders page
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrdersResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        post:
            tags: [Orders]
            summary: Create order
            description: Creates a new order directly from the supplied payload.
            operationId: createOrder
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateOrderRequest'
            responses:
                '201':
                    description: Created order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        put:
            tags: [Orders]
            summary: Update order
            description: Updates an existing order identified by id in the request body.
            operationId: updateOrder
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateOrderRequest'
            responses:
                '200':
                    description: Updated order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Three refusals share this status, told apart by `errors[].code`:
                #  - `ORDER_TRANSITION_NOT_ALLOWED` — a move the lifecycle does not have, such as
                #    `delivered` on a `pending` order, or `paid` on anything (only a confirmed
                #    payment writes that). `errors[].details` carries `{ from, to, allowed }` so a
                #    client can offer the moves that ARE open.
                #  - `ORDER_CANCEL_VIA_CANCEL_ENDPOINT` — `cancelled` is a legal move and not a
                #    field: it releases the held stock and refunds. Use `POST /orders/{id}/cancel`.
                #  - `ORDER_ITEMS_HELD` — `items` cannot be rewritten while the order's stock is
                #    still held or already sold, because the reservation froze the old lines.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        delete:
            tags: [Orders]
            summary: Delete order
            description: Deletes the order identified by the `id` field in the request body. Set `hardDelete` to `true` to permanently remove the record
            operationId: deleteOrder
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeleteOrderRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    # Same as GET /orders, but with JSON body, more suitable for DTOs and multi-language codegen
    /orders/search:
        post:
            tags: [Orders]
            summary: Search orders (DTO-friendly)
            description: |
                Searches and filters orders via a JSON request body. Functionally equivalent to `GET /orders`.
                Non-admin users are automatically scoped to their own orders; the `userId` filter is ignored for non-admin callers.
            operationId: searchOrders
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchOrdersRequest'
            responses:
                '200':
                    description: Orders search results
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrdersResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /orders/{id}:
        # Same as GET /orders?id={id}
        get:
            tags: [Orders]
            summary: Order details
            description: Returns the full details of the order identified by `{id}`. Functionally equivalent to `GET /orders?id={id}`.
            operationId: getOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: Order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        put:
            tags: [Orders]
            summary: Edit order
            description: Updates the order identified by `{id}` in the path.
            operationId: updateOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateOrderByIdRequest'
            responses:
                '200':
                    description: Updated order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Three refusals share this status, told apart by `errors[].code`:
                #  - `ORDER_TRANSITION_NOT_ALLOWED` — a move the lifecycle does not have, such as
                #    `delivered` on a `pending` order, or `paid` on anything (only a confirmed
                #    payment writes that). `errors[].details` carries `{ from, to, allowed }` so a
                #    client can offer the moves that ARE open.
                #  - `ORDER_CANCEL_VIA_CANCEL_ENDPOINT` — `cancelled` is a legal move and not a
                #    field: it releases the held stock and refunds. Use `POST /orders/{id}/cancel`.
                #  - `ORDER_ITEMS_HELD` — `items` cannot be rewritten while the order's stock is
                #    still held or already sold, because the reservation froze the old lines.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        # Same as DELETE /orders
        delete:
            tags: [Orders]
            summary: Delete order
            description: Deletes the order identified by `{id}` in the path. Pass the `hardDelete` query parameter as `true` to permanently remove the record. Functionally equivalent to `DELETE /orders`.
            operationId: deleteOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - name: hardDelete
                  in: query
                  schema:
                      type: boolean
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/HardDeleteRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    # Same as DELETE /orders/{id}?hardDelete=true — the flag spelled in the path instead of
    # in the query. Both reach the same handler; neither is the canonical one.
    /orders/{id}/hard:
        delete:
            tags: [Orders]
            summary: Permanently delete order
            description: Permanently removes the order identified by `{id}`, rather than soft-deleting it. Functionally equivalent to `DELETE /orders/{id}?hardDelete=true`.
            operationId: hardDeleteOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /orders/{id}/cancel:
        post:
            tags: [Orders]
            summary: Cancel order
            description: >-
                Cancels the order identified by `{id}` — the one order write a customer can make.
                Which statuses allow it is the caller's `Order.actions.cancel`; a customer may
                cancel while `pending` or `paid`, an operator one step further. Cancelling releases
                the order's held stock in every case. Whether the MONEY goes back is `refund`:
                a customer is always refunded and cannot waive it, an operator chooses. Later
                statuses need their own flow (a return), driven through `PUT /orders/{id}`. A
                non-admin can cancel only their own orders; an admin can cancel anyone's. The check
                and the write are one atomic statement, so a cancel racing a status change resolves
                to exactly one winner.
            operationId: cancelOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancelOrderRequest'
            responses:
                '200':
                    description: The cancelled order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # The order exists and is visible to the caller, but its status is past the
                # cancellable pair (pending, paid). `errors[].code` is `ORDER_NOT_CANCELLABLE`.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /orders/{id}/invoice:
        get:
            tags: [Orders]
            summary: Download order invoice (PDF)
            description: Generates and returns the invoice for the order identified by `{id}` as a binary PDF file. The client should save or stream the response with an appropriate `Content-Disposition` header.
            operationId: getOrderInvoice
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: Invoice PDF
                    content:
                        application/pdf:
                            schema:
                                type: string
                                format: binary
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # ---------- orders — the schemas only this module's paths reference. ----------
        OrderEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Order'

        OrdersResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/OrdersResponse'

        CancelOrderRequest:
            type: object
            additionalProperties: false
            description: >-
                The operator's choice of whether the money goes back with the cancellation. Ignored
                for a customer, who is always refunded. Omit the body entirely for the default.
            properties:
                refund:
                    type: boolean
                    default: true
                    description: >-
                        `false` cancels and releases the stock without returning the money — a
                        replacement going out, a correction, or a refund handled separately through
                        `POST /payments/order/{orderId}/refund`.

        SearchOrdersRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Page'
                pageSize:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PageSize'
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                userId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'

        CreateOrderRequest:
            type: object
            additionalProperties: false
            required: [userId, email, items]
            properties:
                userId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CartItem'
            description: Create a new order.

        UpdateOrderRequest:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                status:
                    type: string
                    enum: [pending, paid, processing, shipped, delivered, cancelled]
                    description: Updated order status
                userId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CartItem'

        UpdateOrderByIdRequest:
            type: object
            additionalProperties: false
            properties:
                status:
                    type: string
                    enum: [pending, paid, processing, shipped, delivered, cancelled]
                    description: Updated order status
                userId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CartItem'

        DeleteOrderRequest:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                hardDelete:
                    type: boolean
                    default: false

        OrdersResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Order'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'
