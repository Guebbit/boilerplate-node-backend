    parameters:
        # Shared by every module that acts on one of an order's `{orderId}` routes (`dependsOn: orders`);
        # each use restates its own `description` beside the `$ref` (OpenAPI 3.1 allows it).
        OrderIdPathParam:
            name: orderId
            in: path
            required: true
            schema:
                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
            description: Order identifier

        OrderNumberParam:
            name: orderNumber
            in: query
            required: false
            description: >-
                The order's number as the customer quotes it (`2026-000041`); a leading `#`, spaces and
                an unpadded sequence (`#2026-41`) are tolerated. Exact and indexed. Anything that is
                not an order number finds nothing: an empty page, not an error. A caller holding
                `read:Order` alone still sees only their own orders.
            schema:
                type: string
                maxLength: 32

        UserIdParam:
            name: userId
            in: query
            required: false
            schema:
                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        ProductIdParam:
            name: productId
            in: query
            required: false
            schema:
                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
