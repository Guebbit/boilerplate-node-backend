openapi: 3.1.0
info:
    title: orders — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Orders
      x-family: Buying
      description: Placing, reading and managing orders and their lifecycle.

x-error-codes:
    ORDER_INSUFFICIENT_STOCK: { status: 409, description: 'An admin-created order references a quantity beyond the product''s available stock. `errors[].details.lines` names each short line with its `productId`, `title` and `requested` quantity; `available` is added only for a caller who reads stock (`read:StockLevel`).' }
    ORDER_PRODUCT_UNAVAILABLE: { status: 409, description: 'An admin-created order names a product that has been removed (soft-deleted). Hidden and off-sale products can be sold by hand, so only a removed one is refused. `errors[].details.productIds` names each one.' }
    ORDER_EXPORT_TOO_LARGE: { status: 422, description: 'The export would carry more orders than `NODE_ORDER_EXPORT_MAX_ROWS` allows. The message names the cap; narrow the filters and ask again.' }
    ORDER_INVOICED: { status: 409, description: 'This action is not allowed once an order has been invoiced.' }
    ORDER_LINE_LIMIT_EXCEEDED: { status: 422, description: 'An admin-created order has more lines, or a larger quantity on one line, than this deployment allows (`NODE_ADMIN_ORDER_MAX_LINES`, `NODE_ADMIN_ORDER_MAX_LINE_QUANTITY`). The message names the limit.' }
    ORDER_NOT_CANCELABLE: { status: 409, description: 'The order is not in a state that can still be canceled.' }
    ORDER_NOT_CANCELED: { status: 409, description: 'A delete, soft or hard, needs a canceled order: this one is still open. Cancel it first (`POST /orders/{id}/cancel`), which refunds a paid one.' }
    ORDER_HAS_MONEY_HISTORY: { status: 409, description: 'A hard delete is refused: money was recorded on the order after it was canceled (a late payment and its refund still point at it). Soft delete it instead.' }
    ORDER_NOT_DELETED: { status: 409, description: 'A restore is refused: the order is not soft-deleted.' }
    ORDER_OVERRIDE_NOT_ALLOWED: { status: 409, description: 'This status transition is not on the admin override''s allowed list.' }
    ORDER_ADDRESS_LOCKED: { status: 409, description: 'The order cannot be redirected: nothing is left to send (every unit has shipped or been canceled), it is over, or it has no shipping address (a pickup, a digital order).' }
    ORDER_SHIP_TO_COUNTRY_NOT_SUPPORTED: { status: 422, description: 'The corrected shipping address names a country outside the shop''s ship-to list (`Shop.shipToCountries`), the list checkout refuses by; VAT is charged at the shop''s own rates.' }
    ORDER_OVERRIDE_AWAITING_STOCK: { status: 409, description: 'The order still has units awaiting stock; overriding it forward to `shipped` or `delivered` would ship goods the stock ledger never counted out.' }

# This module's section of the account data export (`POST /account/export`): the bundler
# adds it to `AccountExportResponse`. Removing the module removes the section.
x-personal-data:
    orders:
        schema:
            type: array
            items:
                $ref: '#/components/schemas/ExportOrder'
    # The whole timeline of the account's own orders, staff reasons included: the export is the
    # buyer's data, not the buyer's screen. An `actor` appears only when it is the account itself;
    # which staff member wrote a row stays in the audit log (CJEU Pankki S, C-579/21).
    orderTimeline:
        schema:
            type: array
            items:
                $ref: '#/components/schemas/OrderTimelineExportEntry'

paths:
    /orders:
        get:
            x-cache: private-no-cache
            tags: [Orders]
            summary: List orders (paginated)
            description: |
                Returns a paginated list of orders.
                A caller holding `read:Order` alone sees their own orders, and the `userId` filter is ignored for them; `display:Order` reads every order and may narrow by `userId`.
            operationId: listOrders
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: sort
                  in: query
                  required: false
                  # JSON:API grammar: `?sort=-price,title` — comma-separated, `-` for descending.
                  style: form
                  explode: false
                  schema:
                      $ref: '#/components/schemas/OrderSort'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdParam'
                - $ref: '#/components/parameters/UserIdParam'
                - $ref: '#/components/parameters/ProductIdParam'
                - name: email
                  in: query
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                - $ref: '#/components/parameters/OrderNumberParam'
                - name: status
                  in: query
                  schema:
                      $ref: '#/components/schemas/OrderStatus'
                - name: fulfillmentStatus
                  in: query
                  description: >-
                      Filter to orders whose goods stand here — the same derived value
                      `Order.fulfillmentStatus` carries, so `on_hold` and `partially_fulfilled`
                      can be listed.
                  schema:
                      $ref: '#/components/schemas/OrderFulfillmentStatus'
                - name: paymentMethod
                  in: query
                  description: >-
                      Filter to orders placed with this method — the admin "awaiting transfer"
                      view combines this with `status=pending`.
                  schema:
                      $ref: '#/components/schemas/PaymentMethodId'
                - name: deleted
                  in: query
                  description: >-
                      `true` lists only soft-deleted rows, `false` only live ones; absent lists
                      both. Admin-effective: a caller who cannot see deleted rows at all gets an
                      empty page for `true`.
                  schema:
                      type: boolean
                - name: createdFrom
                  in: query
                  schema: { type: string, format: date-time }
                - name: createdTo
                  in: query
                  schema: { type: string, format: date-time }
                - name: paidFrom
                  in: query
                  description: Orders paid at or after this instant. Unpaid orders never match.
                  schema: { type: string, format: date-time }
                - name: paidTo
                  in: query
                  schema: { type: string, format: date-time }
                - name: paymentStatus
                  in: query
                  schema:
                      $ref: '#/components/schemas/OrderPaymentStatus'
                - name: returnStatus
                  in: query
                  schema:
                      $ref: '#/components/schemas/OrderReturnStatus'
            responses:
                '200':
                    description: Orders page
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrdersResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
        post:
            tags: [Orders]
            summary: Create order
            description: >-
                Creates a new order directly from the supplied payload, for the account named in
                `userId`. Raising one for oneself is allowed.

                Staff may sell a hidden (`active: false`) or off-sale (`purchasable: false`) product by
                hand, as Solidus and Shopify draft orders allow; only a removed (soft-deleted) one is
                refused, with `409 ORDER_PRODUCT_UNAVAILABLE`. A product the caller may not read
                (hidden, to a role without `display:Product`) answers `404` like an unknown id, so an
                order never widens what the caller reads. Stock is held as at checkout
                (`409 ORDER_INSUFFICIENT_STOCK`).

                A body is bounded twice. The schema caps it at 1000 lines of at most 999999 units
                (what the contract promises); a deployment may set a lower limit in
                `NODE_ADMIN_ORDER_MAX_LINES` and `NODE_ADMIN_ORDER_MAX_LINE_QUANTITY`, and a body over
                it answers `422` with `ORDER_LINE_LIMIT_EXCEEDED`.
            operationId: createOrder
            x-error-codes:
                '409': [IDEMPOTENCY_IN_FLIGHT, ORDER_INSUFFICIENT_STOCK, ORDER_PRODUCT_UNAVAILABLE]
                '422': [IDEMPOTENCY_KEY_MISMATCH, ORDER_LINE_LIMIT_EXCEEDED]
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateOrderRequest'
            responses:
                '201':
                    description: Created order
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Also answered when `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                # Also answered when `Idempotency-Key` was already used with a different body.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    # Same as GET /orders, but with JSON body, more suitable for DTOs and multi-language codegen
    /orders/export:
        get:
            tags: [Orders]
            summary: Export orders as CSV
            description: |
                The list's filters, answered as one `text/csv` file: every matching order in the list's own
                order, one line each, streamed. Columns: `createdAt`, `orderNumber`, `status`,
                `paymentStatus`, `fulfillmentStatus`, `returnStatus`, `email`, `lines`, `units`, `total`,
                `currency`, `paymentMethod`, `paidAt`. No address: both are encrypted at rest and an export is
                no reason to read them.

                Requires `export:Order` (manager and admin), which is step-up gated (`sensitive`): the file
                carries every customer's email, so the caller must have proved themselves recently. An API key
                holds no session and cannot export. Over `NODE_ORDER_EXPORT_MAX_ROWS` rows the answer is `422`
                `ORDER_EXPORT_TOO_LARGE`, before any byte of the file; narrow the filters. A cell that would
                start a formula in a spreadsheet (`=`, `+`, `-`, `@`, tab, carriage return) is prefixed with
                `'`. Every export is audited (`admin.orders.exported`: the filter and the row count, never a
                row) and has its own per-account rate budget.

                The response is never cached: `Cache-Control: private, no-store`.
            operationId: exportOrders
            x-error-codes:
                '422': [ORDER_EXPORT_TOO_LARGE]
            security:
                - bearerAuth: []
            parameters:
                - name: sort
                  in: query
                  required: false
                  style: form
                  explode: false
                  schema:
                      $ref: '#/components/schemas/OrderSort'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdParam'
                - $ref: '#/components/parameters/UserIdParam'
                - $ref: '#/components/parameters/ProductIdParam'
                - name: email
                  in: query
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                - $ref: '#/components/parameters/OrderNumberParam'
                - name: status
                  in: query
                  schema:
                      $ref: '#/components/schemas/OrderStatus'
                - name: fulfillmentStatus
                  in: query
                  schema:
                      $ref: '#/components/schemas/OrderFulfillmentStatus'
                - name: paymentMethod
                  in: query
                  schema:
                      $ref: '#/components/schemas/PaymentMethodId'
                - name: deleted
                  in: query
                  schema:
                      type: boolean
                - name: createdFrom
                  in: query
                  schema: { type: string, format: date-time }
                - name: createdTo
                  in: query
                  schema: { type: string, format: date-time }
                - name: paidFrom
                  in: query
                  schema: { type: string, format: date-time }
                - name: paidTo
                  in: query
                  schema: { type: string, format: date-time }
                - name: paymentStatus
                  in: query
                  schema:
                      $ref: '#/components/schemas/OrderPaymentStatus'
                - name: returnStatus
                  in: query
                  schema:
                      $ref: '#/components/schemas/OrderReturnStatus'
            responses:
                '200':
                    description: The orders, as CSV
                    headers:
                        Content-Disposition:
                            description: '`attachment; filename="orders-<shop date>.csv"`, e.g. `orders-2026-10-27.csv`; the date is the shop''s calendar day.'
                            schema: { type: string }
                        Cache-Control:
                            description: '`private, no-store`'
                            schema: { type: string }
                    content:
                        text/csv:
                            schema:
                                type: string
                                format: binary
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `ordersExportLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }

    /orders/search:
        post:
            tags: [Orders]
            summary: Search orders (DTO-friendly)
            description: |
                Searches and filters orders via a JSON request body. Functionally equivalent to `GET /orders`.
                A caller holding `read:Order` alone sees their own orders, and the `userId` filter is ignored for them; `display:Order` reads every order and may narrow by `userId`.
            operationId: searchOrders
            x-alias-of: listOrders
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchOrdersRequest'
            responses:
                '200':
                    description: Orders search results
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrdersResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /orders/{id}:
        # Bundler: adds the `If-Match` parameter and 412 to the writes listed, and `ETag` to the 200s.
        x-versioned: [get, put, patch, delete]
        # Same as GET /orders?id={id}
        get:
            x-cache: private-no-cache
            tags: [Orders]
            summary: Order details
            description: Returns the full details of the order identified by `{id}`. Functionally equivalent to `GET /orders?id={id}`.
            operationId: getOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: Order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
        put:
            tags: [Orders]
            summary: Replace order
            description: >-
                Replaces the order identified by `{id}` in the path (RFC 9110 §9.3.4). `email` is
                the only writable field — `status` moves only through an action endpoint
                (`POST /orders/{id}/cancel`, `POST /orders/{id}/status-override`), never a field
                on this body. See `docs/theory/tactical-ddd.md#who-writes-the-status`.
            operationId: replaceOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReplaceOrderByIdRequest'
            responses:
                '200':
                    description: Replaced order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
        # Merges, unlike the replacing PUT above.
        patch:
            tags: [Orders]
            summary: Edit order
            description: >-
                Updates the order identified by `{id}` in the path, merging — an omitted `email`
                leaves the stored one untouched. `status` moves only through an action endpoint
                (`POST /orders/{id}/cancel`, `POST /orders/{id}/status-override`), never a field
                on this body. See `docs/theory/tactical-ddd.md#who-writes-the-status`.
            operationId: updateOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateOrderByIdRequest'
                    application/merge-patch+json:
                        schema:
                            $ref: '#/components/schemas/UpdateOrderByIdRequest'
            responses:
                '200':
                    description: Updated order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
        # Same as DELETE /orders/{id}
        delete:
            tags: [Orders]
            summary: Delete order
            description: Deletes the order identified by `{id}` in the path. Pass the `hardDelete` query parameter as `true` to permanently remove the record, which is only allowed for an order that is canceled and was never paid (409 `ORDER_NOT_CANCELED` while it is open, 409 `ORDER_INVOICED` once paid, 409 `ORDER_HAS_MONEY_HISTORY` once money was recorded after the cancel). A soft delete hides a canceled order from its buyer (409 `ORDER_NOT_CANCELED` while it is open), is safe to repeat, and is undone with `POST /orders/{id}/restore`. Functionally equivalent to `DELETE /orders`.
            operationId: deleteOrderById
            x-error-codes:
                '409': [ORDER_HAS_MONEY_HISTORY, ORDER_INVOICED, ORDER_NOT_CANCELED]
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/HardDeleteParam'
            responses:
                '204': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NoContent' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    # Undoes a soft delete. A separate verb because DELETE must be safe to repeat (RFC 9110
    # §9.2.2): a retried DELETE never brings a record back.
    /orders/{id}/restore:
        post:
            tags: [Orders]
            summary: Restore order
            description: Undoes the soft delete of the order identified by `{id}`. Answers 409 `ORDER_NOT_DELETED` when the order is not soft-deleted, so a restore can never be mistaken for an ordinary read.
            operationId: restoreOrderById
            x-error-codes:
                '409': [ORDER_NOT_DELETED]
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: Restored order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }

    # Same as DELETE /orders/{id}?hardDelete=true — the flag spelled in the path instead of
    # in the query. Both reach the same handler; neither is the canonical one.
    /orders/{id}/hard:
        # Bundler: adds the `If-Match` parameter and 412 to the writes listed, and `ETag` to the 200s.
        x-versioned: [delete]
        delete:
            tags: [Orders]
            summary: Permanently delete order
            description: Permanently removes the order identified by `{id}`, rather than soft-deleting it. Functionally equivalent to `DELETE /orders/{id}?hardDelete=true`, and only for an order that is canceled and was never paid (409 `ORDER_NOT_CANCELED` while it is open, 409 `ORDER_INVOICED` once paid).
            operationId: hardDeleteOrderById
            x-error-codes:
                '409': [ORDER_HAS_MONEY_HISTORY, ORDER_INVOICED, ORDER_NOT_CANCELED]
            x-alias-of: deleteOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '204': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NoContent' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /orders/{id}/cancel:
        post:
            tags: [Orders]
            summary: Cancel order
            description: >-
                Cancels the order identified by `{id}` — the one order write a customer can make.
                Which statuses allow it is the caller's `Order.actions.cancel`; a customer may
                cancel while `pending` or `paid`, an operator one step further. Cancelling releases
                the order's held stock in every case. Whether the MONEY goes back is `refund`:
                a customer is always refunded and cannot waive it, an operator chooses. Later
                statuses need their own flow (a return). A customer can cancel only their own
                orders; an operator (a caller holding `update:Order`) can cancel anyone's, and must have proved
                themselves recently: a stale session answers `401 REAUTH_REQUIRED`, while the buyer's own
                cancel is never prompted. The check and the write are one atomic statement, so a cancel racing a status change resolves
                to exactly one winner.

                The refund of a paid order runs AFTER this answer, so a 200 does not say the money
                is back: follow it on the payment (`displayStatus` `refund_pending`, then
                `refunded`) and on `GET /payments/attention`. A provider that refuses it leaves the
                refund open and retried; the cancel stays done.
            operationId: cancelOrderById
            x-error-codes:
                '401': [REAUTH_REQUIRED]
                # A customer's own order cancels only while pending or paid; an operator's also while processing,
                # until anything ships.
                '409': [ORDER_NOT_CANCELABLE]
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancelOrderRequest'
            responses:
                '200':
                    description: The canceled order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /orders/{id}/timeline:
        get:
            x-cache: private-no-cache
            tags: [Orders]
            summary: The order's timeline
            description: >-
                What happened to the order, oldest first: status moves, payments and refunds,
                shipments, returns, documents. Every caller who may read the order may read this,
                but not the same rows. A caller holding `display:Order` sees every row, with the
                `actor` who made it and any `text` staff wrote. The buyer sees only the
                buyer-visible types and never an `actor`: a manual correction, a hold and a failed
                refund stay with staff.
            operationId: getOrderTimeline
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The order's timeline, oldest first
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderTimelineResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }

    /orders/{id}/timeline/notes:
        post:
            tags: [Orders]
            summary: Leave a staff note on an order
            description: >-
                Appends a `note_added` row to the order's timeline: a call, an agreement, anything staff
                want the next person to know. Needs `update:Order`. The row is staff-only (`audience:
                staff`): the buyer's timeline never shows it, but it is the buyer's data and so it is in
                their `POST /account/export`. The text is stored encrypted, unset when the order's personal
                data is erased and after `NODE_ORDER_EVENT_TEXT_RETENTION_DAYS`, and never written to the
                audit log (only its length is). Answers the entry, with the `Location` of its `DELETE`.
            operationId: addOrderNote
            x-error-codes:
                '409': [IDEMPOTENCY_IN_FLIGHT]
                '422': [IDEMPOTENCY_KEY_MISMATCH]
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateOrderNoteRequest'
            responses:
                '201':
                    description: The note's timeline entry
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderTimelineEntry'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Also answered when `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                # Also answered when `Idempotency-Key` was already used with a different body.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }

    /orders/{id}/timeline/notes/{eventId}:
        delete:
            tags: [Orders]
            summary: Remove the text of a wrong staff note
            description: >-
                Unsets the text of one `note_added` row: the row stays in the timeline, without its
                text, so the history still shows that a note was written and withdrawn (GDPR Art. 16 and
                17). Needs `update:Order`. An id that is not a note of this order is a 404. Writes an audit
                row with the note's length, never its text. A second call on the same note is a 404.
            operationId: deleteOrderNote
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - name: eventId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: The note's timeline entry `id`, from `POST /orders/{id}/timeline/notes` or `GET /orders/{id}/timeline`
            responses:
                '204': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NoContent' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }

    /orders/{id}/shipping-address:
        put:
            tags: [Orders]
            summary: Correct where an unshipped order ships (staff)
            description: >-
                Replaces the order's shipping address, as staff do when a fulfillment order was held
                for `incorrect_address` and the buyer wrote back. Needs `update:Order`. Allowed while
                units remain to send (held and awaiting-stock ones included) and the order has a
                shipping address at all (`409 ORDER_ADDRESS_LOCKED` otherwise). A parcel already cut
                keeps the address it went to: each shipment stores its own `destination`. The country
                must be on the shop's ship-to list (`422 ORDER_SHIP_TO_COUNTRY_NOT_SUPPORTED`). Leaves a staff-only timeline row,
                `address_corrected`, and an audit row naming who changed it, never what it says.
                `OrderActions.correctAddress` says whether this would be accepted.
            operationId: correctOrderShippingAddress
            x-error-codes:
                '409': [ORDER_ADDRESS_LOCKED]
                '422': [ORDER_SHIP_TO_COUNTRY_NOT_SUPPORTED]
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReplaceShippingAddressRequest'
            responses:
                '200':
                    description: The order, with its new address
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /orders/{id}/status-override:
        post:
            tags: [Orders]
            summary: Force-correct an order's status by hand
            description: >-
                Moves the order identified by `{id}` forward to `to` with no shipped email — for a
                manual correction, never for the ordinary shipping flow
                (`POST /delivery/fulfillment-orders/{id}/shipments` and
                `POST /delivery/shipments/{id}/deliver` are that door). Delivery then keeps its own records in step: forward to `shipped` ships every
                remainder, forward to `delivered` delivers them, all stamped with the same instant.
                A forward move to `shipped` or `delivered` is refused while any unit still awaits stock
                (`ORDER_OVERRIDE_AWAITING_STOCK`); a move to `processing` ships nothing and is allowed. Only `processing`, `shipped` and `delivered` are legal
                destinations, and only moving forward from wherever the order currently stands,
                which is `paid` or later: an order still `pending` is refused, since leaving
                `pending` goes only through the offline-payment door, which records the money and
                issues the invoice. Never into `paid` (that stays system-only in absolute terms)
                and never `canceled` (`POST /orders/{id}/cancel` is that door). Requires `override:Order`, itself
                step-up gated, and a non-empty `reason` recorded on the order's timeline (`status_overridden`).
                Webhooks still fire for this move; no shipped email does.
            operationId: overrideOrderStatus
            x-error-codes:
                '409': [ORDER_OVERRIDE_AWAITING_STOCK, ORDER_OVERRIDE_NOT_ALLOWED]
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StatusOverrideRequest'
            responses:
                '200':
                    description: The order, moved
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

components:
    schemas:
        # The ONE sort grammar, shared with every list (docs/api/sorting.md). `-` sorts
        # descending; earlier entries rank first; ties end on the id. Text fields sort
        # case-insensitively.
        OrderSort:
            type: array
            minItems: 1
            maxItems: 5
            items:
                type: string
                enum: [createdAt, -createdAt, status, -status, email, -email, payBy, -payBy, paidAt, -paidAt]

        # ---------- orders — the schemas only this module's paths reference. ----------
        # One row of an order's history. The set of types is closed here; which audience each type
        # is for is the server's own table (`orders/domain/timeline.ts`), answered per caller.
        OrderTimelineType:
            type: string
            enum:
                - created
                - paid
                - processing
                - shipped
                - delivered
                - canceled
                - status_overridden
                - payment_declined
                - refund_issued
                - refund_settled
                - refund_failed
                - refund_canceled
                - refund_reversed
                - dispute_opened
                - dispute_closed
                - shipment_shipped
                - shipment_delivered
                - shipment_lost
                - fulfillment_held
                - fulfillment_released
                - remainder_canceled
                - return_requested
                - return_approved
                - return_declined
                - return_received
                - return_closed
                - return_canceled
                - proof_of_sending_recorded
                - invoice_issued
                - credit_note_issued
                - release_date_moved
                - delay_notice_sent
                - address_corrected
                - note_added
            description: >-
                What happened. Order: `created`, `paid`, `processing`, `shipped`, `delivered`,
                `canceled`, `status_overridden`. Payment: `payment_declined`, `refund_issued`,
                `refund_settled`, `refund_failed`, `refund_canceled`, `refund_reversed`, `dispute_opened`, `dispute_closed`. Shipments: `shipment_shipped`,
                `shipment_delivered`, `shipment_lost`, `fulfillment_held`, `fulfillment_released`,
                `remainder_canceled`. Returns: `return_requested`, `return_approved`,
                `return_declined`, `return_received`, `return_closed`, `return_canceled`, `proof_of_sending_recorded`. Documents: `invoice_issued`,
                `credit_note_issued`. Preorders: `release_date_moved`, `delay_notice_sent`. Staff: `note_added`.
                Which of these a buyer sees is the row's own `audience` (`buyer` or `staff`), set per type by the server.

        # ---- The timeline's `data`: one shape per kind of entry, shared by the types that store it. ----
        # Read from the writers (`appendTimeline`'s callers), not from prose. A code a sibling module owns is
        # a plain string: `orders` cannot `$ref` a module that depends on it, so the description names it.
        OrderTimelineDataNone:
            type: object
            additionalProperties: false
            description: >-
                No data: the type says everything. Closed and empty.

        OrderTimelineDataStatusOverridden:
            type: object
            additionalProperties: false
            required: [mode, from, to]
            description: >-
                A staff member moved the status by hand. `text` (on the entry) is their reason.
            properties:
                mode:
                    type: string
                    enum: [status]
                    description: >-
                        What was overridden. Only the status today.
                from:
                    $ref: '#/components/schemas/OrderStatus'
                to:
                    $ref: '#/components/schemas/OrderStatus'

        OrderTimelineDataPaid:
            type: object
            additionalProperties: false
            description: >-
                The order was paid.
            properties:
                method:
                    type: string
                    description: >-
                        How it was paid, as the payment row records it (`PaymentMethod` in `payments`, or an offline
                        method). Absent when unknown.

        OrderTimelineDataDelivered:
            type: object
            additionalProperties: false
            required: [withdrawUntil]
            description: >-
                The last shipment arrived.
            properties:
                withdrawUntil:
                    type: string
                    format: date-time
                    description: >-
                        When the withdrawal window closes; frozen at the first delivery.

        OrderTimelineDataCanceled:
            type: object
            additionalProperties: false
            required: [by, cause, refund]
            description: >-
                The order was canceled.
            properties:
                by:
                    type: string
                    enum: [customer, admin, withdrawal, system]
                    description: >-
                        Who: the buyer, a staff member, a withdrawal, or the system (`reservation_expired`, `erasure`,
                        `payment_mismatch`, `lost`).
                cause:
                    type: string
                    enum: [customer, operator, withdrawal, reservation_expired, erasure, payment_mismatch, lost]
                    description: >-
                        Why. `lost`: a lost parcel refunded with nothing ever delivered.
                refund:
                    type: boolean
                    description: >-
                        Whether the cancel returned the money.

        OrderTimelineDataPaymentDeclined:
            type: object
            additionalProperties: false
            required: [paymentId]
            description: >-
                The provider declined a payment. The provider's wording is never copied.
            properties:
                paymentId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        OrderTimelineDataRefund:
            type: object
            additionalProperties: false
            required: [refundId, amount, currency, reason]
            description: >-
                A refund opened, settled or voided.
            properties:
                refundId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                amount:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/DecimalAmount'
                currency:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CurrencyCode'
                reason:
                    type: string
                    description: >-
                        The refund's closed reason code (`RefundReason` in `payments`).

        OrderTimelineDataRefundFailure:
            type: object
            additionalProperties: false
            required: [refundId, amount, currency, reason, failureReason]
            description: >-
                A refund the provider refused, or took back after it settled.
            properties:
                refundId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                amount:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/DecimalAmount'
                currency:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CurrencyCode'
                reason:
                    type: string
                    description: >-
                        The refund's closed reason code (`RefundReason` in `payments`).
                failureReason:
                    type: string
                    description: >-
                        Why the provider refused (`RefundFailureReason` in `payments`).

        OrderTimelineDataDispute:
            type: object
            additionalProperties: false
            required: [disputeId, kind, status, reason, amount, currency]
            description: >-
                A payment dispute opened or reached a closed status.
            properties:
                disputeId:
                    type: string
                    description: >-
                        The provider's reference for the dispute.
                kind:
                    type: string
                    description: >-
                        `DisputeKind` in `payments`.
                status:
                    type: string
                    description: >-
                        `DisputeStatus` in `payments`.
                reason:
                    type: string
                    description: >-
                        `DisputeReason` in `payments`.
                amount:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/DecimalAmount'
                currency:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CurrencyCode'

        OrderTimelineDataShipmentShipped:
            type: object
            additionalProperties: false
            required: [shipmentId, fulfillmentOrderId, number]
            description: >-
                A shipment left.
            properties:
                shipmentId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                number:
                    type: integer
                    minimum: 1
                    description: >-
                        The shipment's 1-based position within the order.
                trackingCode:
                    type: string
                    description: >-
                        Absent when none was given.

        OrderTimelineDataShipmentDelivered:
            type: object
            additionalProperties: false
            required: [shipmentId, fulfillmentOrderId, number]
            description: >-
                A shipment arrived.
            properties:
                shipmentId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                number:
                    type: integer
                    minimum: 1
                    description: >-
                        The shipment's 1-based position within the order.

        OrderTimelineDataShipmentLost:
            type: object
            additionalProperties: false
            required: [shipmentId, fulfillmentOrderId, number, reason]
            description: >-
                A shipment will not arrive.
            properties:
                shipmentId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                number:
                    type: integer
                    minimum: 1
                    description: >-
                        The shipment's 1-based position within the order.
                reason:
                    type: string
                    description: >-
                        `ShipmentLostReason` in `delivery`.

        OrderTimelineDataFulfillmentHeld:
            type: object
            additionalProperties: false
            required: [reason]
            description: >-
                A fulfillment order was put on hold.
            properties:
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                reason:
                    type: string
                    description: >-
                        `FulfillmentHoldReason` in `delivery`.

        OrderTimelineDataFulfillmentOrderRef:
            type: object
            additionalProperties: false
            required: [fulfillmentOrderId]
            description: >-
                What the row is about is one fulfillment order.
            properties:
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        OrderTimelineDataReturnRequested:
            type: object
            additionalProperties: false
            required: [returnId, reason]
            description: >-
                A return was opened.
            properties:
                returnId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                reason:
                    type: string
                    description: >-
                        `ReturnReason` in `returns`.

        OrderTimelineDataReturnApproved:
            type: object
            additionalProperties: false
            required: [returnId]
            description: >-
                A return was approved.
            properties:
                returnId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                reason:
                    type: string
                    description: >-
                        `ReturnReason` in `returns`. Present when the return was opened already approved (a withdrawal,
                        or one staff opened).

        OrderTimelineDataReturnRef:
            type: object
            additionalProperties: false
            required: [returnId]
            description: >-
                What the row is about is one return.
            properties:
                returnId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        OrderTimelineDataReturnReceived:
            type: object
            additionalProperties: false
            required: [returnId, refundAmount, currency]
            description: >-
                The returned goods were checked in.
            properties:
                returnId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                refundAmount:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/DecimalAmount'
                currency:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CurrencyCode'

        OrderTimelineDataReturnClosed:
            type: object
            additionalProperties: false
            required: [returnId, refundAmount, currency]
            description: >-
                A return was closed, refunded or settled.
            properties:
                returnId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                refundAmount:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/DecimalAmount'
                currency:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CurrencyCode'
                remedy:
                    type: string
                    description: >-
                        `ReturnRemedy` in `returns`. Absent when none was chosen.

        OrderTimelineDataInvoiceIssued:
            type: object
            additionalProperties: false
            required: [invoiceId, number]
            description: >-
                The order's invoice was issued.
            properties:
                invoiceId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                number:
                    type: string
                    description: >-
                        The invoice number.

        OrderTimelineDataCreditNoteIssued:
            type: object
            additionalProperties: false
            required: [creditNoteId, number, refundId]
            description: >-
                A credit note corrected the invoice for a refund.
            properties:
                creditNoteId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                number:
                    type: string
                    description: >-
                        The credit note number.
                refundId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        OrderTimelineDataReleaseDateMoved:
            type: object
            additionalProperties: false
            required: [fulfillmentOrderId]
            description: >-
                A preorder's release date moved.
            properties:
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                from:
                    type: string
                    format: date
                    description: >-
                        The shop's day expected before. Absent when there was no date.
                to:
                    type: string
                    format: date
                    description: >-
                        The shop's day expected now. Absent when the date was removed.

        OrderTimelineDataDelayNoticeSent:
            type: object
            additionalProperties: false
            required: [fulfillmentOrderId, reason]
            description: >-
                The buyer was told a preorder is late.
            properties:
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                reason:
                    type: string
                    description: >-
                        Why the notice went out: `moved` or `due` (`FulfillmentOrderDelayed` in `delivery`).
                expectedAt:
                    type: string
                    format: date
                    description: >-
                        The shop's day now expected. Absent when there is no date yet.

        # What every timeline entry carries; each variant adds its `type` and its `data`. The base is open
        # on purpose: each variant closes the whole entry with `unevaluatedProperties: false`, which sees
        # the properties every `allOf` branch declares (a closed base would refuse the variant's own).
        OrderTimelineEntryBase:
            type: object
            required: [id, at, audience]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                at:
                    type: string
                    format: date-time
                audience:
                    type: string
                    enum: [buyer, staff]
                    description: >-
                        Who the row is for, decided per `type` by the server. `staff` rows are
                        private (an override's reason, a hold, a provider's refusal): a buyer's
                        timeline never contains one, so a client only tells staff which of their
                        rows the buyer cannot see. The account export carries both.
                actor:
                    allOf:
                        - $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                    description: >-
                        The account that made the change. Staff view only, and absent for the system
                        or once that account was erased. In the account export it is present only
                        when it is the exporting account itself, never a staff member's id.

        # `POST /account/export`'s row: the entry's base plus the order it belongs to. Flat for the same reason
        # as `ExportOrder`; the drift test allows only `orderId` to differ. Export variants sit on this base
        # directly, never on `OrderTimelineEntryBase` (a nested `allOf` breaks the strict Zod generation).
        OrderTimelineExportEntryBase:
            type: object
            required: [id, at, audience, orderId]
            properties:
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                at:
                    type: string
                    format: date-time
                audience:
                    type: string
                    enum: [buyer, staff]
                    description: >-
                        Who the row is for, decided per `type` by the server. `staff` rows are
                        private (an override's reason, a hold, a provider's refusal): a buyer's
                        timeline never contains one, so a client only tells staff which of their
                        rows the buyer cannot see. The account export carries both.
                actor:
                    allOf:
                        - $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                    description: >-
                        The account that made the change. Staff view only, and absent for the system
                        or once that account was erased. In the account export it is present only
                        when it is the exporting account itself, never a staff member's id.

        OrderTimelineEntryPlain:
            unevaluatedProperties: false
            allOf:
                - $ref: '#/components/schemas/OrderTimelineEntryBase'
                - type: object
                  required: [type, data]
                  properties:
                      type:
                          type: string
                          enum: [created, processing, shipped, address_corrected]
                      data:
                          $ref: '#/components/schemas/OrderTimelineDataNone'

        OrderTimelineEntryStatusOverridden:
            unevaluatedProperties: false
            allOf:
                - $ref: '#/components/schemas/OrderTimelineEntryBase'
