openapi: 3.1.0
info:
    title: orders — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Orders
      description: Placing, reading and managing orders and their lifecycle.

x-error-codes:
    ORDER_INSUFFICIENT_STOCK: { status: 409, description: 'An admin-created order references a quantity beyond the product''s available stock. `errors[].details.lines` names each short line with its `productId`, `title` and `requested` quantity; `available` is added only for a caller who reads stock (`read:StockLevel`).' }
    ORDER_PRODUCT_UNAVAILABLE: { status: 409, description: 'An admin-created order names a product that is hidden (`active: false`), off sale (`purchasable: false`) or soft-deleted: refused exactly as checkout refuses it. `errors[].details.productIds` names each one.' }
    ORDER_EXPORT_TOO_LARGE: { status: 422, description: 'The export would carry more orders than `NODE_ORDER_EXPORT_MAX_ROWS` allows. The message names the cap; narrow the filters and ask again.' }
    ORDER_INVOICED: { status: 409, description: 'This action is not allowed once an order has been invoiced.' }
    ORDER_LINE_LIMIT_EXCEEDED: { status: 422, description: 'An admin-created order has more lines, or a larger quantity on one line, than this deployment allows (`NODE_ADMIN_ORDER_MAX_LINES`, `NODE_ADMIN_ORDER_MAX_LINE_QUANTITY`). The message names the limit.' }
    ORDER_NOT_CANCELLABLE: { status: 409, description: 'The order is not in a state that can still be cancelled.' }
    ORDER_NOT_CANCELLED: { status: 409, description: 'A delete, soft or hard, needs a cancelled order: this one is still open. Cancel it first (`POST /orders/{id}/cancel`), which refunds a paid one.' }
    ORDER_OVERRIDE_NOT_ALLOWED: { status: 409, description: 'This status transition is not on the admin override''s allowed list.' }
    ORDER_ADDRESS_LOCKED: { status: 409, description: 'The order cannot be redirected: something has shipped, or it has no shipping address (a pickup, a digital order).' }
    ORDER_OVERRIDE_AWAITING_STOCK: { status: 409, description: 'The order still has units awaiting stock; overriding it forward would ship goods the stock ledger never counted out.' }

# This module's section of the account data export (`POST /account/export`): the bundler
# adds it to `AccountExportResponse`. Removing the module removes the section.
x-personal-data:
    orders:
        schema:
            type: array
            items:
                $ref: '#/components/schemas/Order'
    # The whole timeline of the account's own orders, staff reasons and actors included: the
    # export is the buyer's data, not the buyer's screen.
    orderTimeline:
        schema:
            type: array
            items:
                $ref: '#/components/schemas/OrderTimelineExportEntry'

paths:
    /orders:
        get:
            tags: [Orders]
            summary: List orders (paginated)
            description: |
                Returns a paginated list of orders.
                A caller holding `read:Order` alone sees their own orders, and the `userId` filter is ignored for them; `display:Order` reads every order and may narrow by `userId`.
            operationId: listOrders
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: sort
                  in: query
                  required: false
                  # JSON:API grammar: `?sort=-price,title` — comma-separated, `-` for descending.
                  style: form
                  explode: false
                  schema:
                      $ref: '#/components/schemas/OrderSort'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdParam'
                - $ref: '#/components/parameters/UserIdParam'
                - $ref: '#/components/parameters/ProductIdParam'
                - name: email
                  in: query
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                - name: status
                  in: query
                  schema:
                      $ref: '#/components/schemas/OrderStatus'
                - name: fulfillmentStatus
                  in: query
                  description: >-
                      Filter to orders whose goods stand here — the same derived value
                      `Order.fulfillmentStatus` carries, so `on_hold` and `partially_fulfilled`
                      can be listed.
                  schema:
                      $ref: '#/components/schemas/OrderFulfillmentStatus'
                - name: paymentMethod
                  in: query
                  description: >-
                      Filter to orders placed with this method — the admin "awaiting transfer"
                      view combines this with `status=pending`.
                  schema:
                      $ref: '#/components/schemas/PaymentMethodId'
                - name: deleted
                  in: query
                  description: >-
                      `true` lists only soft-deleted rows, `false` only live ones; absent lists
                      both. Admin-effective: a caller who cannot see deleted rows at all gets an
                      empty page for `true`.
                  schema:
                      type: boolean
                - name: createdFrom
                  in: query
                  schema: { type: string, format: date-time }
                - name: createdTo
                  in: query
                  schema: { type: string, format: date-time }
                - name: paidFrom
                  in: query
                  description: Orders paid at or after this instant. Unpaid orders never match.
                  schema: { type: string, format: date-time }
                - name: paidTo
                  in: query
                  schema: { type: string, format: date-time }
                - name: paymentStatus
                  in: query
                  schema:
                      $ref: '#/components/schemas/OrderPaymentStatus'
                - name: returnStatus
                  in: query
                  schema:
                      $ref: '#/components/schemas/OrderReturnStatus'
            responses:
                '200':
                    description: Orders page
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrdersResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        post:
            tags: [Orders]
            summary: Create order
            description: >-
                Creates a new order directly from the supplied payload, for the account named in
                `userId`. Raising one for oneself is allowed.

                It sells the shelf a shopper buys from: a hidden, off-sale or soft-deleted product is
                refused with `409 ORDER_PRODUCT_UNAVAILABLE`, exactly as checkout refuses it, and
                stock is held the same way (`409 ORDER_INSUFFICIENT_STOCK`).

                A body is bounded twice. The schema caps it at 1000 lines of at most 999999 units
                (what the contract promises); a deployment may set a lower limit in
                `NODE_ADMIN_ORDER_MAX_LINES` and `NODE_ADMIN_ORDER_MAX_LINE_QUANTITY`, and a body over
                it answers `422` with `ORDER_LINE_LIMIT_EXCEEDED`.
            operationId: createOrder
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateOrderRequest'
            responses:
                '201':
                    description: Created order
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderEnvelope'
                    links:
                        PayOrder:
                            operationId: createPaymentIntent
                            parameters:
                                orderId: '$response.body#/data/id'
                            description: The new order's id is the `orderId` to freeze into a payment intent.
                        CancelOrder:
                            operationId: cancelOrderById
                            parameters:
                                id: '$response.body#/data/id'
                            description: The new order's id can be cancelled directly.
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Also answered when `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                # Also answered when `Idempotency-Key` was already used with a different body.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        delete:
            tags: [Orders]
            summary: Delete order
            description: Deletes the order identified by the `id` field in the request body. Set `hardDelete` to `true`, in the query or the body, to permanently remove the record, which is only allowed for an order that is cancelled and was never paid (409 `ORDER_NOT_CANCELLED` while it is open, 409 `ORDER_INVOICED` once paid); a `true` from any source wins, so a `false` sent elsewhere does not cancel it. A soft delete hides a cancelled order from its buyer (409 `ORDER_NOT_CANCELLED` while it is open), is safe to repeat, and is undone with `POST /orders/{id}/restore`.
            operationId: deleteOrder
            x-alias-of: deleteOrderById
            security:
                - bearerAuth: []
            # The flag is readable from the query here too, exactly as it is on the `{id}` form:
            # one controller serves both, and `surface: 'delete'` reads params, query and body on
            # whichever route it is mounted on. Declared rather than merely tolerated.
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/HardDeleteParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeleteOrderRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # A delete refused. `errors[].code` is `ORDER_NOT_CANCELLED` for an order still open
                # (soft or hard: only a cancelled order may be deleted), and `ORDER_INVOICED` for a
                # hard delete of an order that was paid.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    # Same as GET /orders, but with JSON body, more suitable for DTOs and multi-language codegen
    /orders/export:
        get:
            tags: [Orders]
            summary: Export orders as CSV
            description: |
                The list's filters, answered as one `text/csv` file: every matching order in the list's own
                order, one line each, streamed. Columns: `createdAt`, `orderNumber`, `status`,
                `paymentStatus`, `fulfillmentStatus`, `returnStatus`, `email`, `lines`, `units`, `total`,
                `currency`, `paymentMethod`, `paidAt`. No address: both are encrypted at rest and an export is
                no reason to read them.

                Requires `export:Order` (manager and admin), which is step-up gated (`sensitive`): the file
                carries every customer's email, so the caller must have proved themselves recently. An API key
                holds no session and cannot export. Over `NODE_ORDER_EXPORT_MAX_ROWS` rows the answer is `422`
                `ORDER_EXPORT_TOO_LARGE`, before any byte of the file; narrow the filters. A cell that would
                start a formula in a spreadsheet (`=`, `+`, `-`, `@`, tab, carriage return) is prefixed with
                `'`. Every export is audited (`admin.orders.exported`: the filter and the row count, never a
                row) and has its own per-account rate budget.

                The response is never cached: `Cache-Control: private, no-store`.
            operationId: exportOrders
            security:
                - bearerAuth: []
            parameters:
                - name: sort
                  in: query
                  required: false
                  style: form
                  explode: false
                  schema:
                      $ref: '#/components/schemas/OrderSort'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdParam'
                - $ref: '#/components/parameters/UserIdParam'
                - $ref: '#/components/parameters/ProductIdParam'
                - name: email
                  in: query
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                - name: status
                  in: query
                  schema:
                      $ref: '#/components/schemas/OrderStatus'
                - name: fulfillmentStatus
                  in: query
                  schema:
                      $ref: '#/components/schemas/OrderFulfillmentStatus'
                - name: paymentMethod
                  in: query
                  schema:
                      $ref: '#/components/schemas/PaymentMethodId'
                - name: deleted
                  in: query
                  schema:
                      type: boolean
                - name: createdFrom
                  in: query
                  schema: { type: string, format: date-time }
                - name: createdTo
                  in: query
                  schema: { type: string, format: date-time }
                - name: paidFrom
                  in: query
                  schema: { type: string, format: date-time }
                - name: paidTo
                  in: query
                  schema: { type: string, format: date-time }
                - name: paymentStatus
                  in: query
                  schema:
                      $ref: '#/components/schemas/OrderPaymentStatus'
                - name: returnStatus
                  in: query
                  schema:
                      $ref: '#/components/schemas/OrderReturnStatus'
            responses:
                '200':
                    description: The orders, as CSV
                    headers:
                        Content-Disposition:
                            description: '`attachment; filename="orders.csv"`'
                            schema: { type: string }
                        Cache-Control:
                            description: '`private, no-store`'
                            schema: { type: string }
                    content:
                        text/csv:
                            schema:
                                type: string
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # The result is larger than the cap. `errors[].code` is `ORDER_EXPORT_TOO_LARGE`.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `ordersExportLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /orders/search:
        post:
            tags: [Orders]
            summary: Search orders (DTO-friendly)
            description: |
                Searches and filters orders via a JSON request body. Functionally equivalent to `GET /orders`.
                A caller holding `read:Order` alone sees their own orders, and the `userId` filter is ignored for them; `display:Order` reads every order and may narrow by `userId`.
            operationId: searchOrders
            x-alias-of: listOrders
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchOrdersRequest'
            responses:
                '200':
                    description: Orders search results
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrdersResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /orders/{id}:
        # Bundler: adds the `If-Match` parameter and 412 to the writes listed, and `ETag` to the 200s.
        x-versioned: [get, put, patch, delete]
        # Same as GET /orders?id={id}
        get:
            tags: [Orders]
            summary: Order details
            description: Returns the full details of the order identified by `{id}`. Functionally equivalent to `GET /orders?id={id}`.
            operationId: getOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: Order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        put:
            tags: [Orders]
            summary: Replace order
            description: >-
                Replaces the order identified by `{id}` in the path (RFC 9110 §9.3.4). `email` is
                the only writable field — `status` moves only through an action endpoint
                (`POST /orders/{id}/cancel`, `POST /orders/{id}/status-override`), never a field
                on this body. See `docs/theory/tactical-ddd.md#who-writes-the-status`.
            operationId: replaceOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReplaceOrderByIdRequest'
            responses:
                '200':
                    description: Replaced order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        # Merges, unlike the replacing PUT above.
        patch:
            tags: [Orders]
            summary: Edit order
            description: >-
                Updates the order identified by `{id}` in the path, merging — an omitted `email`
                leaves the stored one untouched. `status` moves only through an action endpoint
                (`POST /orders/{id}/cancel`, `POST /orders/{id}/status-override`), never a field
                on this body. See `docs/theory/tactical-ddd.md#who-writes-the-status`.
            operationId: updateOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateOrderByIdRequest'
                    application/merge-patch+json:
                        schema:
                            $ref: '#/components/schemas/UpdateOrderByIdRequest'
            responses:
                '200':
                    description: Updated order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        # Same as DELETE /orders
        delete:
            tags: [Orders]
            summary: Delete order
            description: Deletes the order identified by `{id}` in the path. Pass the `hardDelete` query parameter as `true` to permanently remove the record, which is only allowed for an order that is cancelled and was never paid (409 `ORDER_NOT_CANCELLED` while it is open, 409 `ORDER_INVOICED` once paid). A soft delete hides a cancelled order from its buyer (409 `ORDER_NOT_CANCELLED` while it is open), is safe to repeat, and is undone with `POST /orders/{id}/restore`. Functionally equivalent to `DELETE /orders`.
            operationId: deleteOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/HardDeleteParam'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/HardDeleteRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # A delete refused. `errors[].code` is `ORDER_NOT_CANCELLED` for an order still open
                # (soft or hard: only a cancelled order may be deleted), and `ORDER_INVOICED` for a
                # hard delete of an order that was paid.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    # Undoes a soft delete. A separate verb because DELETE must be safe to repeat (RFC 9110
    # §9.2.2): a retried DELETE never brings a record back.
    /orders/{id}/restore:
        post:
            tags: [Orders]
            summary: Restore order
            description: Undoes the soft delete of the order identified by `{id}`. Answers 409 when the order is not soft-deleted, so a restore can never be mistaken for an ordinary read.
            operationId: restoreOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: Restored order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    # Same as DELETE /orders/{id}?hardDelete=true — the flag spelled in the path instead of
    # in the query. Both reach the same handler; neither is the canonical one.
    /orders/{id}/hard:
        # Bundler: adds the `If-Match` parameter and 412 to the writes listed, and `ETag` to the 200s.
        x-versioned: [delete]
        delete:
            tags: [Orders]
            summary: Permanently delete order
            description: Permanently removes the order identified by `{id}`, rather than soft-deleting it. Functionally equivalent to `DELETE /orders/{id}?hardDelete=true`, and only for an order that is cancelled and was never paid (409 `ORDER_NOT_CANCELLED` while it is open, 409 `ORDER_INVOICED` once paid).
            operationId: hardDeleteOrderById
            x-alias-of: deleteOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # A delete refused. `errors[].code` is `ORDER_NOT_CANCELLED` for an order still open
                # (soft or hard: only a cancelled order may be deleted), and `ORDER_INVOICED` for a
                # hard delete of an order that was paid.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /orders/{id}/cancel:
        post:
            tags: [Orders]
            summary: Cancel order
            description: >-
                Cancels the order identified by `{id}` — the one order write a customer can make.
                Which statuses allow it is the caller's `Order.actions.cancel`; a customer may
                cancel while `pending` or `paid`, an operator one step further. Cancelling releases
                the order's held stock in every case. Whether the MONEY goes back is `refund`:
                a customer is always refunded and cannot waive it, an operator chooses. Later
                statuses need their own flow (a return). A customer can cancel only their own
                orders; an operator (a caller holding `update:Order`) can cancel anyone's, and must have proved
                themselves recently: a stale session answers `401 REAUTH_REQUIRED`, while the buyer's own
                cancel is never prompted. The check and the write are one atomic statement, so a cancel racing a status change resolves
                to exactly one winner.
            operationId: cancelOrderById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancelOrderRequest'
            responses:
                '200':
                    description: The cancelled order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # The order exists and is visible to the caller, but its status is past what THIS
                # caller may cancel: a customer's own order only while pending or paid; an operator's
                # also while processing, until anything ships. `errors[].code` is `ORDER_NOT_CANCELLABLE`.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /orders/{id}/timeline:
        get:
            tags: [Orders]
            summary: The order's timeline
            description: >-
                What happened to the order, oldest first: status moves, payments and refunds,
                shipments, returns, documents. Every caller who may read the order may read this,
                but not the same rows. A caller holding `display:Order` sees every row, with the
                `actor` who made it and any `text` staff wrote. The buyer sees only the
                buyer-visible types and never an `actor`: a manual correction, a hold and a failed
                refund stay with staff.
            operationId: getOrderTimeline
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The order's timeline, oldest first
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderTimelineEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /orders/{id}/shipping-address:
        put:
            tags: [Orders]
            summary: Correct where an unshipped order ships (staff)
            description: >-
                Replaces the order's shipping address, as staff do when a fulfillment order was held
                for `incorrect_address` and the buyer wrote back. Needs `update:Order`. Allowed only
                while nothing has shipped and the order has a shipping address at all: after that the
                parcel went where it went (`409 ORDER_ADDRESS_LOCKED`). Leaves a staff-only timeline row,
                `address_corrected`, and an audit row naming who changed it, never what it says.
                `OrderActions.correctAddress` says whether this would be accepted.
            operationId: correctOrderShippingAddress
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReplaceShippingAddressRequest'
            responses:
                '200':
                    description: The order, with its new address
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `errors[].code` is `ORDER_ADDRESS_LOCKED`.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /orders/{id}/status-override:
        post:
            tags: [Orders]
            summary: Force-correct an order's status by hand
            description: >-
                Moves the order identified by `{id}` forward to `to` with no shipped email — for a
                manual correction, never for the ordinary shipping flow
                (`POST /delivery/fulfillment-orders/{id}/shipments` and
                `POST /delivery/shipments/{id}/deliver` are that door, with their own `forced`
                option). Delivery then keeps its own records in step: forward to `shipped` ships every
                remainder, forward to `delivered` delivers them, all stamped with the same instant.
                Refused while any unit still awaits stock (`ORDER_OVERRIDE_AWAITING_STOCK`). Only `processing`, `shipped` and `delivered` are legal
                destinations, and only moving forward from wherever the order currently stands,
                which is `paid` or later: an order still `pending` is refused, since leaving
                `pending` goes only through the offline-payment door, which records the money and
                issues the invoice. Never into `paid` (that stays system-only in absolute terms)
                and never `cancelled` (`POST /orders/{id}/cancel` is that door). Requires `override:Order`, itself
                step-up gated, and a non-empty `reason` recorded on the order's timeline (`status_overridden`).
                Webhooks still fire for this move; no shipped email does.
            operationId: overrideOrderStatus
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StatusOverrideRequest'
            responses:
                '200':
                    description: The order, moved
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `to` is not a legal forward override from the order's current status.
                # `errors[].code` is `ORDER_OVERRIDE_NOT_ALLOWED`.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # The ONE sort grammar, shared with every list (docs/api/sorting.md). `-` sorts
        # descending; earlier entries rank first; ties end on the id. Text fields sort
        # case-insensitively.
        OrderSort:
            type: array
            minItems: 1
            maxItems: 5
            items:
                type: string
                enum: [createdAt, -createdAt, status, -status, email, -email, payBy, -payBy, paidAt, -paidAt]

        # ---------- orders — the schemas only this module's paths reference. ----------
        OrderEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/Order'

        OrdersResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/OrdersResponse'

        # One row of an order's history. The set of types is closed here; which audience each type
        # is for is the server's own table (`orders/domain/timeline.ts`), answered per caller.
        OrderTimelineType:
            type: string
            enum:
                - created
                - paid
                - processing
                - shipped
                - delivered
                - cancelled
                - status_overridden
                - payment_declined
                - refund_issued
                - refund_settled
                - refund_failed
                - shipment_shipped
                - shipment_delivered
                - fulfillment_held
                - fulfillment_released
                - remainder_cancelled
                - return_requested
                - return_approved
                - return_declined
                - return_received
                - return_closed
                - invoice_issued
                - credit_note_issued
                - release_date_moved
                - delay_notice_sent
                - wait_confirmed
                - wait_expired
                - address_corrected
            description: >-
                What happened. Order: `created`, `paid`, `processing`, `shipped`, `delivered`,
                `cancelled`, `status_overridden`. Payment: `payment_declined`, `refund_issued`,
                `refund_settled`, `refund_failed`. Shipments: `shipment_shipped`,
                `shipment_delivered`, `fulfillment_held`, `fulfillment_released`,
                `remainder_cancelled`. Returns: `return_requested`, `return_approved`,
                `return_declined`, `return_received`, `return_closed`. Documents: `invoice_issued`,
                `credit_note_issued`. Preorders: `release_date_moved`, `delay_notice_sent`,
                `wait_confirmed`, `wait_expired`. Staff-only: `address_corrected`.

        OrderTimelineEntry:
            type: object
            additionalProperties: false
            required: [id, at, type, data]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                at:
                    type: string
                    format: date-time
                type:
                    $ref: '#/components/schemas/OrderTimelineType'
                actor:
                    allOf:
                        - $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                    description: >-
                        The account that made the change. Staff view only, and absent for the system
                        or once that account was erased.
                text:
                    type: string
                    description: >-
                        Free text staff wrote with the change — an override's reason. Unset after
                        `NODE_ORDER_EVENT_TEXT_RETENTION_DAYS`; the row stays.
                data:
                    type: object
                    additionalProperties: true
                    description: >-
                        What the type needs to say, as ids, codes and numbers — never another
                        module's free text. `status_overridden`: `mode` (`status` or `forced`),
                        `from`, `to`. `paid`: `method`. `delivered`: `withdrawUntil`. `cancelled`:
                        `by`, `refund` (whether the cancel returned the money). Shipment and hold rows: `shipmentId` or `fulfillmentOrderId`,
                        `trackingCode`, `reason` (a hold's reason code). Refund rows: `refundId`,
                        `amount`, `currency`, `reason`, and `failureReason` on a failure. Return
                        rows: `returnId`. Document rows: `number`.

        OrderTimelineEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/OrderTimelineEntry'

        # `POST /account/export`'s row for one timeline entry: the entry plus the order it belongs to.
        OrderTimelineExportEntry:
            allOf:
                - $ref: '#/components/schemas/OrderTimelineEntry'
                - type: object
                  required: [orderId]
                  properties:
                      orderId:
                          $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        CancelOrderRequest:
            type: object
            additionalProperties: false
            description: >-
                The operator's choice of whether the money goes back with the cancellation. Ignored
                for a customer, who is always refunded. Omit the body entirely for the default.
            properties:
                refund:
                    type: boolean
                    default: true
                    description: >-
                        `false` cancels and releases the stock without returning the money — a
                        replacement going out, a correction, or a refund handled separately through
                        `POST /payments/order/{orderId}/refund`.

        StatusOverrideRequest:
            type: object
            additionalProperties: false
            required: [to, reason]
            properties:
                to:
                    allOf:
                        - $ref: '#/components/schemas/OrderStatus'
                    description: Must be `processing`, `shipped` or `delivered`, and forward of the order's current status — every other value is a 409.
                reason:
                    type: string
                    maxLength: 1000
                    minLength: 1
                    description: Why the normal door didn't apply. Recorded on the order's timeline, never optional.

        SearchOrdersRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Page'
                pageSize:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PageSize'
                sort:
                    $ref: '#/components/schemas/OrderSort'
                id:
                    type: array
                    minItems: 1
                    maxItems: 100
                    items: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id' }
                userId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                # Narrows a listing already scoped to the caller: a customer filtering by
                # status is filtering their own orders, and staff see the same shape.
                status:
                    $ref: '#/components/schemas/OrderStatus'
                # Filters on the derived value `Order.fulfillmentStatus` carries, so the two always agree.
                fulfillmentStatus:
                    $ref: '#/components/schemas/OrderFulfillmentStatus'
                paymentMethod:
                    $ref: '#/components/schemas/PaymentMethodId'
                # `true`: only soft-deleted rows; `false`: only live ones; absent: both.
                # Admin-effective, like `active`: a caller who cannot see deleted rows at all
                # gets an empty page for `true`.
                deleted:
                    type: boolean
                # Instants, inclusive at both ends. `paidFrom`/`paidTo` never match an unpaid order.
                createdFrom: { type: string, format: date-time }
                createdTo: { type: string, format: date-time }
                paidFrom: { type: string, format: date-time }
                paidTo: { type: string, format: date-time }
                # Each value maps back to the stored fields behind it.
                paymentStatus:
                    $ref: '#/components/schemas/OrderPaymentStatus'
                returnStatus:
                    $ref: '#/components/schemas/OrderReturnStatus'

        CreateOrderRequest:
            type: object
            additionalProperties: false
            required: [userId, email, items]
            properties:
                userId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                items:
                    type: array
                    minItems: 1
                    maxItems: 1000
                    items:
                        $ref: '#/components/schemas/OrderLineInput'
            description: Create a new order.

        # One line of an admin-created order. Not the cart's `CartItem`: the cart caps a quantity
        # at what a shopper buys, an operator may book a bulk order. The stock guard is the real
        # bound; this ceiling only keeps the schema finite (OWASP API4:2023, unrestricted resource
        # consumption). A deployment lowers it with `NODE_ADMIN_ORDER_MAX_LINE_QUANTITY`.
        OrderLineInput:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                quantity:
                    type: integer
                    minimum: 1
                    maximum: 999999

        # `status` is deliberately not a field here — see the route's own description. Writing it
        # through this body would let an admin skip `processing` by writing `paid → shipped`
        # directly, and could save `email` before a refused status move answers 409 — a
        # half-applied write. Neither is possible with `status` excluded by construction.
        # PUT names the whole resource: `email` is not nullable (an order always has one), so it
        # is required rather than treated as clearable-by-omission.
        ReplaceOrderByIdRequest:
            type: object
            additionalProperties: false
            required: [email]
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'

        # PATCH merges: an omitted `email` leaves the stored one untouched.
        UpdateOrderByIdRequest:
            type: object
            additionalProperties: false
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'

        DeleteOrderRequest:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                hardDelete:
                    type: boolean
                    default: false

        OrdersResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Order'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        # Shared by `Order.paymentMethod`, `CheckoutRequest.paymentMethod` and
        # `PaymentMethod.id` (`payments`' own module contract) — one enum, so a third method
        # added later cannot land in one of the three and not the others.
        PaymentMethodId:
            type: string
            enum: [card, bank_transfer]
            description: >-
                How an order is being paid for. A preference recorded at checkout, not a lock — a
                card payment still settles normally regardless of this value.

        # An address an order freezes, as `shippingAddress` or `billingAddress` — a SNAPSHOT,
        # exactly like the product snapshots the items embed: an order must keep where it was
        # going and who it was billed to, not what the address book says today. No `id`, no
        # `default` — those are facts about the book entry, not the order.
        ReplaceShippingAddressRequest:
            allOf:
                - $ref: '#/components/schemas/OrderAddress'
            description: The corrected shipping address; the whole of it replaces the old one.

        OrderAddress:
            type: object
            additionalProperties: false
            required: [fullName, street, city, zip, country]
            properties:
                fullName:
                    type: string
                    maxLength: 100
                street:
                    type: string
                    maxLength: 200
                city:
                    type: string
                    maxLength: 100
                zip:
                    type: string
                    maxLength: 20
                country:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CountryCode'
                phone:
                    type: string
                    maxLength: 32

        # `Product`, without `onHand`/`reserved`/`available`, and without an image — see
        # `OrderLineCurrent`. An order line is a purchase-time SNAPSHOT — the price and title a
        # customer actually bought — and those two fields are the opposite of that: they describe
        # the WAREHOUSE, right now, and publishing them on every past order republished live stock
        # as if it were history. `id`/`title`/`price` stay `required`, same as `Product` itself.
        OrderLineProduct:
            type: object
            additionalProperties: false
            required: [id, title, price, taxRate]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                title:
                    type: string
                price:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        Gross — what the customer paid, VAT included, frozen at checkout. Same
                        convention as `Product.price`.
                description:
                    type: string
                requiresShipping:
                    type: boolean
                    default: true
                # Art. 16 CRD, frozen at order-creation time — `returns` refuses a line marked so.
                noWithdrawal:
                    type: boolean
                sku:
                    $ref: '../products/openapi.yaml#/components/schemas/Sku'
                # Grams, frozen at order-creation time — same convention as `Product.weight`,
                # same "absent counts as 0" rule the shipping-method filter/refusal already apply.
                weight:
                    type: integer
                    minimum: 0
                # The date the buyer was promised, frozen at checkout (CRD Art. 18: the date shown
                # when ordering is the agreed one). Never re-read from the catalogue, where an admin
                # may have moved it since.
                releaseDate:
                    $ref: '../products/openapi.yaml#/components/schemas/ReleaseDate'
                preorder:
                    type: boolean
                    description: >-
                        The line was sold before its release date, frozen at checkout. `delivery`
                        reads it, never the catalogue, to decide which fulfillment order the line
                        belongs to: a bank transfer may be paid a week after the order was placed.
                categories:
                    type: array
                    items:
                        type: string
                tags:
                    type: array
                    items:
                        type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                deletedAt:
                    type: string
                    format: date-time
                # The decimal rate this line was actually taxed at, resolved from the product's
                # `taxClass` and frozen here at checkout — a rate change in config must not
                # re-state what a past order was charged, and never re-resolved from the
                # product's CURRENT tax class.
                taxRate:
                    type: number
                    format: double
                    minimum: 0
                    maximum: 1
                    description: >-
                        The VAT rate this line was actually charged, as a decimal (0.22 for 22%).
                        Frozen at checkout, same reasoning as `price`.
                # Unlike `taxClass` — resolved into `taxRate` and then discarded — `rateType` is
                # copied here AS IS, same as `sku`/`weight`: there is no numeric rate for it to
                # resolve into, and an invoice needs the category (Z vs E) the order was actually
                # placed under, not whatever the product's config says today. See
                # `orders/services/snapshot.ts#freezeOrderLines`.
                rateType:
                    $ref: '../products/openapi.yaml#/components/schemas/RateType'

        # The picture, resolved LIVE from the catalogue product `OrderItem.product.id` still
        # names — never frozen, so a hard-deleted or replaced image can never leak through order
        # history. `null` means the product no longer exists; that is what lets "buy again" tell
        # a deleted product apart from one that simply never had a picture (`imageUrl` absent).
        OrderLineCurrent:
            type: object
            additionalProperties: false
            properties:
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageUrl'
                thumbnailUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ThumbnailUrl'

        OrderItem:
            type: object
            additionalProperties: false
            required: [product, quantity, locale, current, taxAmount, netAmount]
            properties:
                product:
                    $ref: '#/components/schemas/OrderLineProduct'
                quantity:
                    type: integer
                    minimum: 1
                # The language `product.title`/`description` were resolved into when this line was
                # frozen — the buyer's, not the request's. A historical record, not a preference:
                # re-reading the order later must reproduce what was actually bought, in whatever
                # language it was bought in, regardless of the reader's own locale.
                locale:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Locale'
                # Frozen at checkout, like the rest of the line: how many of `quantity` the shelf
                # could not cover and the shop owes. Absent when the shelf covered the whole line.
                backorderedQuantity:
                    type: integer
                    minimum: 1
                    description: >-
                        How many of `quantity` were owed rather than on the shelf when the order was
                        placed. Absent when the shelf covered the whole line.
                promisedAt:
                    type: string
                    format: date-time
                    description: >-
                        When the owed units were promised: the product's `restockDate`, or the day the
                        order was placed plus 30 days when it had none. Present with `backorderedQuantity`
                        and frozen with it, so a later change to the catalogue moves no promise.
                promiseDated:
                    type: boolean
                    description: >-
                        Whether `promisedAt` was a date the product named. `false` means the buyer was
                        promised delivery "within 30 days" of the order. Present with `promisedAt`.
                current:
                    oneOf:
                        - $ref: '#/components/schemas/OrderLineCurrent'
                        - type: 'null'
                    description: >-
                        The product's picture, resolved live — `null` when the catalogue product
                        (`product.id`) has been hard-deleted. Never the terms of the sale, so it
                        is never frozen; see `OrderLineCurrent`.
                # Both derived at serialization from `product.price`/`quantity`/`product.taxRate`
                # — never stored. See `src/modules/orders/domain/tax.ts`.
                taxAmount:
                    type: number
                    format: double
                    minimum: 0
                    readOnly: true
                    description: VAT included in this line's total, at its own frozen `taxRate`.
                netAmount:
                    type: number
                    format: double
                    minimum: 0
                    readOnly: true
                    description: This line's total excluding VAT — `price × quantity` minus `taxAmount`.

        OrderStatus:
            type: string
            enum: [pending, paid, processing, shipped, delivered, cancelled]
            description: >-
                Where an order is in its lifecycle. The set is closed here; which value may FOLLOW
                which is the server's own lifecycle rules, answered per caller by `OrderActions`.

        OrderPaymentStatus:
            type: string
            enum: [unpaid, paid, partially_refunded, refunded]
            description: >-
                Where the order's MONEY stands, beside `status` — Shopify's `financial_status`.
                `unpaid` until a payment lands; `paid`; then `partially_refunded` once some but not
                all of it went back, and `refunded` once all of it did. Read-only: `payments`
                stamps the refund states, `orders` derives the first two.

        OrderFulfillmentStatus:
            type: string
            enum: [unfulfilled, in_progress, on_hold, partially_fulfilled, shipped, fulfilled]
            description: >-
                Where the goods stand, beside `status` — Shopify's `fulfillment_status`. Derived
                from the status and the fulfilment summary delivery reports. First match wins:
                `fulfilled` once everything arrived; `shipped` once everything has left;
                `partially_fulfilled` once something left and more remains; `on_hold` while every
                remaining unit is held back; `in_progress` while being prepared; `unfulfilled` before
                work starts, and for a pending or cancelled order. Read-only.

        OrderReturnStatus:
            type: string
            enum: [none, requested, in_progress, partially_returned, returned]
            description: >-
                Where any return on the order stands — Shopify's `returnStatus`. `none` when no
                return holds goods; `requested` while one awaits staff; `in_progress` once approved
                and awaiting its goods; `partially_returned` / `returned` once received goods cover
                some / every unit on the order. Read-only: `returns` stamps it, and `delivered`
                stays terminal — a return is its own object, not an order status.

        WithdrawBlockedReason:
            type: string
            enum: [all_excluded, window_closed, nothing_left]
            description: >-
                Why the buyer's withdrawal button is not offered, first reason that applies.
                `all_excluded`: every line is goods Art. 16 CRD takes the right of withdrawal away
                from (made to order, perishable), so there is nothing to withdraw from — an unpaid
                or paid order can still be cancelled with the ordinary cancel. `window_closed`:
                the withdrawal period ended. `nothing_left`: every unit is already back with the
                shop.

        OrderActions:
            type: object
            additionalProperties: false
            required:
                [
                    transitions,
                    cancel,
                    pay,
                    recordPayment,
                    start,
                    override,
                    correctAddress,
                    invoice,
                    withdraw
                ]
            description: >-
                What the requesting caller may do to this order, decided by the server. A client
                renders its controls from this rather than re-implementing the lifecycle: the rules
                depend on the caller's role, and a second copy in a separately deployed client is
                how the two come to disagree. Pay is the BUYER's (reading an order is not owning
                it); an operator who holds the key moves any order, a staff member's own included.
            properties:
                transitions:
                    type: array
                    items:
                        $ref: '#/components/schemas/OrderStatus'
                    description: >-
                        The statuses this caller may move the order to. Empty on a terminal order,
                        and never contains the order's current status.
                    example: [processing, cancelled]
                cancel:
                    type: boolean
                    description: >-
                        Whether `POST /orders/{id}/cancel` would be accepted for this caller. A
                        customer may cancel while unpaid or paid; an operator one step further — and
                        only while nothing has shipped: once any shipment left, what remains is
                        cancelled one fulfillment order at a time (`POST /returns`, `kind: cancellation`).
                pay:
                    type: boolean
                    description: >-
                        Whether this order is still awaiting payment — it can reach `paid`, which
                        only a confirmed charge writes — and the caller may pay it: the buyer, who
                        holds the shopper's checkout key (staff and administrators do not). Not in `transitions`, because no request may
                        make that move: a client starts the flow with `POST /payments/intent` and
                        the provider's yes does the rest.
                recordPayment:
                    type: boolean
                    description: >-
                        Whether `POST /payments/order/{orderId}/offline` would be accepted for this
                        caller: an operator recording money that arrived another way. True while
                        the order is still awaiting payment and the caller holds the key that records
                        one. A buyer's own step is `pay`; a buyer who is staff may also record.
                start:
                    type: boolean
                    description: >-
                        Whether `POST /delivery/order/{id}/start` would be accepted for this
                        caller. Not in `transitions`: `paid → processing` is `system`-only there,
                        reached only by reporting the fact through `delivery`'s own door.
                override:
                    type: array
                    items:
                        $ref: '#/components/schemas/OrderStatus'
                    description: >-
                        The statuses `POST /orders/{id}/status-override` would accept as a
                        destination for this caller right now — empty for anyone without
                        `override:Order`, or once the order has left every overridable status.
                    example: [processing, shipped, delivered]
                correctAddress:
                    type: boolean
                    description: >-
                        Whether `PUT /orders/{id}/shipping-address` would be accepted for this caller:
                        they hold `update:Order`, the order has a shipping address, and nothing has
                        shipped.
                withdraw:
                    type: boolean
                    description: >-
                        Whether the "withdraw from contract here" button is offered — EU Consumer
                        Rights Directive Art. 11a. `true` for the order's own buyer while the order
                        is withdrawable (paid or awaiting payment, in the shop's hands or on its way,
                        or delivered) and the withdrawal window has not closed. Always `false` for
                        anyone else, an operator included: the right is the consumer's. The client
                        never counts the days — the server says when. Made with
                        `POST /returns` and `reason: withdrawal`. A mixed order is not a reason to
                        hide it: before dispatch the withdrawal takes the eligible goods (the whole
                        order while it is unpaid or paid, the eligible shipment groups once it is
                        `processing`); only an order made wholly of excluded goods is blocked.
                withdrawBlocked:
                    $ref: '#/components/schemas/WithdrawBlockedReason'
                    description: >-
                        Why `withdraw` is `false`, for the order's own buyer on an order that is
                        otherwise withdrawable. Absent when `withdraw` is `true`, for anyone who is
                        not the buyer, and for an order whose status offers no withdrawal (cancelled).
                        A client shows the button disabled with this reason rather than hiding it.
                withdrawUntil:
                    type: string
                    format: date-time
                    description: >-
                        The last instant a withdrawal is valid, frozen when the period started —
                        delivery for goods, payment for digital content. Absent before that: the
                        right already exists, the window has no end yet.
                invoice:
                    type: boolean
                    description: >-
                        Whether `GET /orders/{id}/invoice` would answer a PDF rather than a 404 —
                        `true` once the order has been invoiced (its `pending → paid` transition
                        landed), regardless of anything that happened to it since. A gap between
                        this and the actual download is possible but rare, the same "gaps are
                        acceptable" policy `orderNumber` already lives under — see
                        `docs/modules/invoicing.md`.

        # One VAT rate's slice of the whole order — goods and shipping folded into the same row,
        # since shipping is taxed at each line's own rate rather than carrying one of its own. See
        # `src/modules/orders/domain/tax.ts`.
        OrderTaxSummaryRow:
            type: object
            additionalProperties: false
            required: [rate, netAmount, taxAmount, grossAmount]
            properties:
                rate:
                    type: number
                    format: double
                    minimum: 0
                    description: The decimal rate this row is for (`0.22` for 22%) — never repeated across rows.
                netAmount:
                    type: number
                    format: double
                    minimum: 0
                taxAmount:
                    type: number
                    format: double
                    minimum: 0
                grossAmount:
                    type: number
                    format: double
                    minimum: 0
                    description: '`netAmount + taxAmount`, not re-derived from a price.'

        Order:
            type: object
            additionalProperties: false
            required:
                [
                    id,
                    email,
                    items,
                    totalItems,
                    totalQuantity,
                    totalPrice,
                    status,
                    paymentStatus,
                    fulfillmentStatus,
                    returnStatus,
                    currency,
                    orderNumber,
                    netTotal,
                    taxTotal,
                    shippingNetAmount,
                    shippingTaxAmount,
                    taxSummary
                ]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                # Absent once the account that placed this order has been erased. The order
                # survives (it is the invoice); the foreign key does not, because the account it
                # named no longer exists.
                userId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/OrderItem'
                totalItems:
                    type: integer
                    minimum: 0
                    description: >-
                        Number of distinct line items in this order. Not to be confused with
                        `PaginationMeta.totalItems`, which counts orders matching a search.
                    example: 2
                totalQuantity:
                    type: integer
                    minimum: 0
                    description: Sum of `quantity` across every line item.
                    example: 5
                totalPrice:
                    type: number
                    format: double
                    minimum: 0
                    description: Sum of `product.price × quantity` across every line item, plus `shippingCost` when the checkout chose a method.
                    example: 149.97
                # Frozen from `NODE_DEFAULT_CURRENCY` the moment the order was placed — a later
                # change to the shop's own setting must not rewrite what an old order actually
                # charged.
                currency:
                    type: string
                    readOnly: true
                    description: ISO-4217 currency code this order was priced in (e.g. EUR).
                # Both derived at serialization from the lines' frozen `taxRate` — never stored.
                # See `src/modules/orders/domain/tax.ts`.
                netTotal:
                    type: number
                    format: double
                    minimum: 0
                    readOnly: true
                    description: >-
                        Sum of every line's `netAmount` — the goods total excluding VAT, GOODS
                        ONLY. Shipping's own net amount is `shippingNetAmount`, not folded in here.
                taxTotal:
                    type: number
                    format: double
                    minimum: 0
                    readOnly: true
                    description: >-
                        Every VAT collected on this order: the lines' own `taxAmount`, plus the VAT
                        on `shippingCost` — apportioned pro-rata across the lines by value and
                        taxed at each line's own rate, since delivery is taxed as ancillary to what
                        it delivers.
                shippingNetAmount:
                    type: number
                    format: double
                    minimum: 0
                    readOnly: true
                    description: >-
                        Shipping's own net amount, summed across every line it was apportioned
                        onto — `netTotal` stays goods-only, this is the rest of the split. Zero on
                        an order with no delivery method or free shipping.
                shippingTaxAmount:
                    type: number
                    format: double
                    minimum: 0
                    readOnly: true
                    description: >-
                        Shipping's own tax amount, summed across every line it was apportioned
                        onto — already folded into `taxTotal`, published separately so an invoice
                        can print it as its own line. Zero on an order with no delivery method or
                        free shipping.
                taxSummary:
                    type: array
                    readOnly: true
                    items:
                        $ref: '#/components/schemas/OrderTaxSummaryRow'
                    description: >-
                        One row per distinct VAT rate charged on this order, sorted ascending.
                        Reconciles exactly: summed `netAmount` is `netTotal` + `shippingNetAmount`,
                        summed `taxAmount` is `taxTotal`, and summed `grossAmount` is `totalPrice`.
                        Empty on an order with no lines.
                notes:
                    type: string
                    description: Optional order notes
                # Absent on an admin-created order (no checkout), or an all-digital basket — nothing
                # ships, so no method applies.
                # Present on every other order: a physical line makes a shipping method required.
                shippingMethod:
                    type: string
                    description: The shipping method's id as the checkout froze it (e.g. standard, express, pickup).
                shippingCost:
                    type: number
                    format: double
                    minimum: 0
                    description: What that method cost at checkout time — a later rate change cannot re-price history.
                # Where the goods go — present only when a line ships to an address. Absent under
                # the same conditions as `shippingMethod` above, when the chosen method itself
                # needs no address (`requiresAddress: false`, e.g. pickup), on an all-digital
                # order: nothing travels, so nothing is frozen here, and once the order is
                # anonymised. `billingAddress` is the one every checkout order carries.
                shippingAddress:
                    $ref: '#/components/schemas/OrderAddress'
                # Who the order is invoiced to — the address the invoice prints as the buyer's
                # (EU VAT Directive Art. 226). Present on every order a checkout places: the
                # shipping address when the buyer chose "same as shipping", otherwise the book
                # entry they named, otherwise their default. Absent on an admin-created order
                # (`POST /orders` runs no checkout), and once the order is anonymised.
                billingAddress:
                    $ref: '#/components/schemas/OrderAddress'
                # Absent on order creation that isn't a checkout (the admin `POST /orders` path
                # names no method).
                paymentMethod:
                    $ref: '#/components/schemas/PaymentMethodId'
                # When this order's stock hold ends — `NODE_RESERVATION_TTL_MINUTES` for `card`,
                # `NODE_BANK_TRANSFER_HOLD_HOURS` for `bank_transfer`. Past this with no payment,
                # the sweep releases the stock and cancels the order. Absent once paid or
                # cancelled: the hold is over either way.
                payBy:
                    type: string
                    format: date-time
                # `{year}-{sequence}`, assigned once at order-creation time — never recomputed.
                # Not a tax invoice number: this order is a receipt, not an invoice (no national
                # e-invoicing system is involved) — see `docs/modules/orders.md`. Gaps are
                # acceptable, the same way Shopify's `#1001` skips a number a failed write burned.
                orderNumber:
                    type: string
                    readOnly: true
                    example: '2026-000041'
                status:
                    $ref: '#/components/schemas/OrderStatus'
                # Three read-only projections beside `status`, so a client never infers "was this
                # refunded?" or "did a return come back?" from `status` — which `delivered` keeps
                # terminal on purpose. Each says where one object stands: the money, the goods, and
                # any return. See docs/modules/orders.md#the-status-projections.
                paymentStatus:
                    $ref: '#/components/schemas/OrderPaymentStatus'
                fulfillmentStatus:
                    $ref: '#/components/schemas/OrderFulfillmentStatus'
                returnStatus:
                    $ref: '#/components/schemas/OrderReturnStatus'
                # Computed per CALLER, not stored: what this requester may do to this order right
                # now. Present on every response carrying ONE order — the read, the writes and the
                # cancel — so a client that replaces its cached record from a write does not lose
                # the block and collapse its own controls. Absent from the list, where it would be
                # answered per row for a question only the detail view asks.
                # See docs/theory/tactical-ddd.md.
                actions:
                    $ref: '#/components/schemas/OrderActions'
                # When the order reached `paid`: the buyer's own fact, and the date a sale is
                # counted on. Absent while unpaid. An offline payment's is when the admin recorded
                # it, not when the money arrived.
                paidAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                # Unlike a product or a user, an order carries no `active` flag, so this is the
                # only thing that distinguishes a hidden order from a live one. A non-admin never
                # sees a record where it is set — `visibleScope` filters them out — so it appears
                # only on admin reads.
                deletedAt:
                    type: string
                    format: date-time
    parameters:
        # Shared by every module that acts on one of an order's `{orderId}` routes (`dependsOn: orders`);
        # each use restates its own `description` beside the `$ref` (OpenAPI 3.1 allows it).
        OrderIdPathParam:
            name: orderId
            in: path
            required: true
            schema:
                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
            description: Order identifier

        UserIdParam:
            name: userId
            in: query
            required: false
            schema:
                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        ProductIdParam:
            name: productId
            in: query
            required: false
            schema:
                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
