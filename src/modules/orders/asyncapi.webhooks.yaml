# The orders module's webhook events: `order.*`.
#
# A FRAGMENT, not a document: it refs `#/servers/subscriberEndpoint` and
# `#/components/schemas/WebhookHeaders`, which `webhooks/asyncapi.yaml` declares. The bundler
# merges it into the `webhooks` section only while that module exists
# (`scripts/contracts/asyncapi-webhook-events.ts`), and `GET /webhooks/events` lists it only while
# this module is registered. Delete the module and its events leave the contract with it.
# Each event is the Standard Webhooks envelope `{ type, timestamp, data }`; the module's
# `publicEvents` (`module.ts`) is what actually fires it.
channels:
    order.created:
        address: order.created
        description: A new order was placed.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderCreatedEvent:
                $ref: '#/components/messages/OrderCreatedEvent'
    order.paid:
        address: order.paid
        description: An order's payment settled.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderPaidEvent:
                $ref: '#/components/messages/OrderPaidEvent'
    order.cancelled:
        address: order.cancelled
        description: An order was cancelled.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderCancelledEvent:
                $ref: '#/components/messages/OrderCancelledEvent'
    order.redacted:
        address: order.redacted
        description: An order's personal data was scrubbed.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderRedactedEvent:
                $ref: '#/components/messages/OrderRedactedEvent'
operations:
    webhookOrderCreated:
        action: send
        channel:
            $ref: '#/channels/order.created'
        summary: An order was written for the first time.
        description: >-
            Fired once per order, from both an admin create and a storefront checkout — see
            `orders/services/crud.ts`'s `recordCreated`.
        messages:
            - $ref: '#/channels/order.created/messages/OrderCreatedEvent'
    webhookOrderPaid:
        action: send
        channel:
            $ref: '#/channels/order.paid'
        summary: An order moved to the `paid` status.
        description: >-
            Derived from `order.status_changed` (`to: 'paid'`) rather than its own domain
            event — see `orders/events.ts`: "listeners filter on `to`; the event doesn't know
            who cares."
        messages:
            - $ref: '#/channels/order.paid/messages/OrderPaidEvent'
    webhookOrderCancelled:
        action: send
        channel:
            $ref: '#/channels/order.cancelled'
        summary: A cancel went through; stock is back on the shelf, except for `cause` lost.
        description: >-
            The `order.cancelled` domain event, without its refund policy: whether the cancel owes the
            buyer money back is for `payments`, and a subscriber learns that money actually moved from
            `payment.refunded`. `cause` says why. A `lost` parcel's units are not restocked: they were
            never on the shelf to come back to. See `orders/events.ts`.
        messages:
            - $ref: '#/channels/order.cancelled/messages/OrderCancelledEvent'
    webhookOrderRedacted:
        action: send
        channel:
            $ref: '#/channels/order.redacted'
        summary: An order's email, addresses and notes were scrubbed.
        description: >-
            Fired once per order by the nightly retention sweep (`reap:orders`), in the scrub's own
            transaction, when the order's personal-data window ends: after the buyer's erasure, or
            for an inactive account's orders. Not fired at the erasure itself, which only detaches
            the account. A recipient drops the buyer's email, addresses and notes it holds for
            `orderId` (GDPR Art. 19). The order row itself is kept as the invoice.
        messages:
            - $ref: '#/channels/order.redacted/messages/OrderRedactedEvent'
components:
    messages:
        OrderCreatedEvent:
            name: OrderCreatedEvent
            title: Order created
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderCreatedEnvelope'
        OrderPaidEvent:
            name: OrderPaidEvent
            title: Order paid
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderPaidEnvelope'
        OrderCancelledEvent:
            name: OrderCancelledEvent
            title: Order cancelled
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderCancelledEnvelope'
        OrderRedactedEvent:
            name: OrderRedactedEvent
            title: Order redacted
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderRedactedEnvelope'
    schemas:
        OrderIdPayload:
            type: object
            required:
                - orderId
            properties:
                orderId:
                    $ref: '#/components/schemas/Id'
            additionalProperties: false
        OrderCreatedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    # `title` names the generated model — a bare inline enum-of-one otherwise
                    # becomes Modelina's `AnonymousSchemaN`, renumbered on every unrelated addition.
                    title: OrderCreatedEventType
                    type: string
                    enum:
                        - order.created
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
        OrderPaidEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: OrderPaidEventType
                    type: string
                    enum:
                        - order.paid
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
        OrderCancelledPayload:
            type: object
            required:
                - orderId
                - cause
            properties:
                orderId:
                    $ref: '#/components/schemas/Id'
                cause:
                    title: OrderCancelCause
                    description: Why the order was cancelled.
                    type: string
                    enum:
                        - customer
                        - operator
                        - withdrawal
                        - reservation_expired
                        - erasure
                        - payment_mismatch
                        - lost
            additionalProperties: false
        OrderCancelledEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: OrderCancelledEventType
                    type: string
                    enum:
                        - order.cancelled
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderCancelledPayload'
            additionalProperties: false
        OrderRedactedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: OrderRedactedEventType
                    type: string
                    enum:
                        - order.redacted
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
