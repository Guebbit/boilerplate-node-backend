        # ---------- orders — the schemas only this module's paths reference. ----------
        OrderEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/Order'

        OrdersResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/OrdersResponse'

        SearchOrdersRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    $ref: '#/components/schemas/Page'
                pageSize:
                    $ref: '#/components/schemas/PageSize'
                id:
                    $ref: '#/components/schemas/Id'
                userId:
                    $ref: '#/components/schemas/Id'
                productId:
                    $ref: '#/components/schemas/Id'
                email:
                    $ref: '#/components/schemas/Email'

        CreateOrderRequest:
            type: object
            additionalProperties: false
            required: [userId, email, items]
            properties:
                userId:
                    $ref: '#/components/schemas/Id'
                email:
                    $ref: '#/components/schemas/Email'
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/CartItem'
            description: Create a new order.

        UpdateOrderRequest:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                status:
                    type: string
                    enum: [pending, paid, processing, shipped, delivered, cancelled]
                    description: Updated order status
                userId:
                    $ref: '#/components/schemas/Id'
                email:
                    $ref: '#/components/schemas/Email'
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/CartItem'

        UpdateOrderByIdRequest:
            type: object
            additionalProperties: false
            properties:
                status:
                    type: string
                    enum: [pending, paid, processing, shipped, delivered, cancelled]
                    description: Updated order status
                userId:
                    $ref: '#/components/schemas/Id'
                email:
                    $ref: '#/components/schemas/Email'
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/CartItem'

        DeleteOrderRequest:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                hardDelete:
                    type: boolean
                    default: false

        OrdersResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Order'
                meta:
                    $ref: '#/components/schemas/PaginationMeta'

