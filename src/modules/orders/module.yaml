summary: 'What a checkout produces: its status machine, its totals and its invoice link.'
subdomain: core
group: shop
dependsOn:
    - access # ownOrderFlag: the audit flag of a cancel on the caller's own order
    - inventory # a claim on units, released on cancel or RESERVATION_EXPIRED
    - products # a line copies the catalogue row's fields at purchase time
    - shop # the currency a total is frozen in, and the seller on its emails
    - users # a buyer's stored locale for emails; its hard delete runs the erase hook
rateLimits:
    ordersExport:
        name: Order CSV exports
        namespace: orders-export
        environmentVariable: NODE_ORDER_EXPORT_RATE_LIMIT_MAX
        defaultMax: 10
        windowMs: shared
        bounds:
            Exports against `GET /orders/export`, keyed on the ACCOUNT — the step-up already makes the
            caller a person, and an address-keyed budget would let one signed-in manager behind a
            shared address starve every other caller on it.
        audited: true
jobs:
    reapOrders:
        name: reap:orders
        schedule: 10 2 * * *
        summary:
            Anonymizes an order's remaining PII once its retention window has passed, and unsets
            a timeline row's staff text once its own window has.
