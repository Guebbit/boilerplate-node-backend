# The orders module's OWN queue — private, unlike a module's public event catalogue. `orders` has
# none of those (nobody outside this service reads its domain events), so unlike
# `webhooks/asyncapi.yaml` there is no sibling public file this one sits beside — only this
# internal one. Merged only into `asyncapi.yaml`, never `asyncapi.public.yaml` — this is a
# `backend`-only section (`scripts/contracts/asyncapi-bundles.ts`'s `SHARED_SECTIONS`), so the
# paired frontend never sees it, matching every other `worker.*` queue.
#
# A fragment, not a complete document on its own, unlike a normal module section: it declares no
# `asyncapi`/`info`/`servers` of its own, and is deliberately left out of
# `lint:asyncapi:modules`'s glob for that reason. Its one channel binds to `rabbitmqLocal`, which
# `shared/contracts/asyncapi.workers.yaml`'s `workers` section already declares — a second
# declaration here would collide when the two sections merge into one document
# (`asyncapi-bundles.ts`'s `mergeInto` refuses any duplicate key on purpose). Validated as part of
# the BUNDLED output instead (`npm run lint:asyncapi`), where `rabbitmqLocal` is already present.
#
# This channel's payload carries an `orderId` only; the worker resolves its own template and
# output location, never anything the message says — a producer-chosen template or output path
# would be a latent arbitrary-file-write/RCE the moment anything published to it.
channels:
    worker.orders.invoice-generate:
        address: worker.orders.invoice-generate
        description: >-
            Invoice PDF generation job queue — the `orders` module enqueues one message per order
            created, the invoice worker consumes it and writes the stored PDF.
        servers:
            - $ref: '#/servers/rabbitmqLocal'
        messages:
            OrderInvoicePdfJobMessage:
                $ref: '#/components/messages/OrderInvoicePdfJobMessage'
operations:
    ordersInvoicePdfPublish:
        action: receive
        channel:
            $ref: '#/channels/worker.orders.invoice-generate'
        summary: Enqueue invoice PDF generation for a just-created order.
        description: >-
            Published from the module's own `order.created` listener — see `orders/events.ts`:
            fires exactly once per order, regardless of which of the two creation paths made it.
        messages:
            - $ref: '#/channels/worker.orders.invoice-generate/messages/OrderInvoicePdfJobMessage'
    ordersInvoicePdfConsume:
        action: send
        channel:
            $ref: '#/channels/worker.orders.invoice-generate'
        summary: Invoice worker renders and stores the PDF, then marks the order ready.
        description: >-
            Resolves the order by `orderId`, renders the same EJS template
            `GET /orders/{id}/invoice` renders synchronously for orders that predate this queue,
            writes the PDF to private storage, and flips `invoicePdfStatus` to `ready`. A failed
            render is left to reject, so the broker redelivers it.
        messages:
            - $ref: '#/channels/worker.orders.invoice-generate/messages/OrderInvoicePdfJobMessage'
components:
    messages:
        OrderInvoicePdfJobMessage:
            name: OrderInvoicePdfJobMessage
            title: Order invoice PDF generation job
            payload:
                $ref: '#/components/schemas/OrderInvoicePdfJobPayload'
    schemas:
        OrderInvoicePdfJobPayload:
            type: object
            required:
                - orderId
            properties:
                orderId:
                    type: string
                    description: >-
                        The order to render. Deliberately the ONLY field: the worker resolves its
                        own template path and output location from this id, never from anything
                        the message carries — see this file's header for why.
            additionalProperties: false
