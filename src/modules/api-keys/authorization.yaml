rules:
    # -- api-keys --------------------------------------------------------------------------------
    - action: read
      subject: ApiKey
      module: api-keys
      scope: tenant
      credential: false
      description: List this shop's machine-to-machine credentials. Never returns a key's secret.
    - action: create
      subject: ApiKey
      module: api-keys
      scope: tenant
      description: >-
          Mint a credential. Carries its own floor on top of this key: a credential can never hold
          a permission the minter lacks.
      # A minted credential outlives the session that made it, so a stolen access token that
      # could mint one would turn ten minutes of access into a long-lived key. GitHub's sudo mode
      # asks for the same before creating a token.
      stepUp: critical
    - action: delete
      subject: ApiKey
      module: api-keys
      scope: tenant
      credential: false
      description: Revoke a credential. Soft and immediate; the row stays readable.

sets:
    - name: ApiKeyDisplay
      module: api-keys
      description: List the shop's credentials.
      rules:
          - read:ApiKey
    - name: ApiKeyManagement
      module: api-keys
      description: Mint and revoke credentials.
      rules:
          - create:ApiKey
          - delete:ApiKey
