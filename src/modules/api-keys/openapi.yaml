openapi: 3.1.0
info:
    title: api-keys — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: ApiKeys
      description: Machine-to-machine credentials — list, mint, revoke.

# This module's section of the account data export (`POST /account/export`): the bundler
# adds it to `AccountExportResponse`. Removing the module removes the section.
x-personal-data:
    # `api-keys` records `createdByUserId`, so the keys an account minted are its data.
    # Metadata only, same as the admin's own list: no `hash`, no way to forge a
    # credential from what a caller downloads about themselves.
    apiKeys:
        schema:
            type: array
            items:
                $ref: '#/components/schemas/ExportApiKey'

paths:
    /api-keys:
        get:
            tags: [ApiKeys]
            summary: List this shop's machine-to-machine credentials
            description: Newest first unless `sort` says otherwise. Never returns a credential's secret — that exists only in the response of the call that minted it.
            operationId: listApiKeys
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: sort
                  in: query
                  required: false
                  # JSON:API grammar: `?sort=-lastUsedAt,expiresAt` — comma-separated, `-` for descending.
                  style: form
                  explode: false
                  schema:
                      $ref: '#/components/schemas/ApiKeySort'
            responses:
                '200':
                    description: Credential list
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiKeysResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        post:
            tags: [ApiKeys]
            summary: Mint a machine-to-machine credential
            description: |
                Mints `sk_<prefix>_<secret>` and returns it in plaintext, once — the only response
                that ever carries it. `permissions` must be a non-empty subset of the CALLER's own
                currently-held tenant permissions: a key can never reach further than the person
                who minted it, and that floor is re-checked on every request the key later makes,
                not just at mint time — see `docs/tools/security.md#machine-to-machine-credentials`.
                A key whose minter is banned, soft-deleted or erased is refused with 401 like a
                revoked one; an unban or a restore brings it back.
                A permission no credential can use is refused with 422 too: one that demands a freshly
                proved session, and one whose routes are session-only (`read:Stats`, the inbox, the
                key list itself), which would grant nothing while looking like it grants something.

                Minting needs a critically fresh session (`401 REAUTH_REQUIRED`): a key outlives the
                session that made it. `expiresAt` is required and at most one year ahead, or the
                request is refused with 422. The minter is mailed that a key was created, and every
                key a person minted is revoked (and listed to them by mail) when they log out
                everywhere, reset their password or report an email change as not theirs.
            operationId: mintApiKey
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MintApiKeyRequest'
            responses:
                '201':
                    description: The minted credential, with its one-time secret
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiKeyCreated'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /api-keys/{id}:
        get:
            tags: [ApiKeys]
            summary: Get a machine-to-machine credential
            description: One credential of this shop, with the same `status` the list gives it. Never its secret — that exists only in the response of the call that minted it. Another shop's credential, an unknown id and a malformed one are the same 404.
            operationId: getApiKey
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The credential
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiKey'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        delete:
            tags: [ApiKeys]
            summary: Revoke a machine-to-machine credential
            description: |
                A soft state change, not a delete: `revokedAt` is stamped and every future
                presentation of the credential is refused, but its row (and audit history) stays
                readable. Immediate — there is no grace window.
            operationId: revokeApiKey
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '204': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NoContent' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # ---------- api-keys — the schemas only this module's paths reference. ----------
        # The ONE sort grammar, shared with every list (docs/api/sorting.md). `-` sorts
        # descending; earlier entries rank first; ties end on the id.
        ApiKeySort:
            type: array
            minItems: 1
            maxItems: 3
            items:
                type: string
                enum: [createdAt, -createdAt, expiresAt, -expiresAt, lastUsedAt, -lastUsedAt]

        ApiKeyStatus:
            type: string
            enum: [active, expired, revoked, suspended]
            description: >-
                Whether the credential works right now, decided by the server. `revoked` and
                `expired` are final. `suspended` means the person who minted it can no longer sign
                in (banned, soft-deleted or erased): the key is refused with 401 and comes back
                by itself if they do. Checked in that order, so a revoked key never reads as
                `suspended`.

        ApiKey:
            type: object
            additionalProperties: false
            required: [id, name, publicPrefix, permissions, status, expiresAt, createdAt, updatedAt, actions]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                name:
                    type: string
                publicPrefix:
                    type: string
                    description: The credential's non-secret prefix, e.g. `a1b2c3d4` — shown in a list so an operator can recognise which key is which.
                status:
                    $ref: '#/components/schemas/ApiKeyStatus'
                permissions:
                    type: array
                    items: { type: string }
                    minItems: 1
                    description: The permission rules this credential was minted with, each spelled `<action>:<Subject>` (`display:Order`). Re-floored against the minter's CURRENT permissions on every request; this is the snapshot taken at mint time.
                lastUsedAt:
                    type: string
                    format: date-time
                expiresAt:
                    type: string
                    format: date-time
                revokedAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                actions:
                    $ref: '#/components/schemas/ApiKeyActions'

        ApiKeyActions:
            type: object
            additionalProperties: false
            required: [revoke]
            description: >-
                What the requesting caller may do to this credential, decided by the server.
            properties:
                revoke:
                    type: boolean
                    description: Whether `DELETE /api-keys/{id}` would revoke this credential for this caller. False for a caller without `delete:ApiKey`, and for a credential that is revoked already (the call would change nothing).

        # A credential as the account's data export carries it: `actions` is per caller, so it
        # never leaves in an export.
        ExportApiKey:
            type: object
            additionalProperties: false
            required: [id, name, publicPrefix, permissions, status, expiresAt, createdAt, updatedAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                name:
                    type: string
                publicPrefix:
                    type: string
                status:
                    $ref: '#/components/schemas/ApiKeyStatus'
                permissions:
                    type: array
                    items: { type: string }
                    minItems: 1
                lastUsedAt:
                    type: string
                    format: date-time
                expiresAt:
                    type: string
                    format: date-time
                revokedAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        ApiKeyCreated:
            # Flat, not `allOf: [ApiKey, {...}]` — two sibling schemas each declaring
            # `additionalProperties: false` is a well-known JSON Schema trap (see
            # `webhooks/openapi.yaml`'s `WebhookSubscriptionCreated` for the same note): ajv
            # validates the instance against EACH branch independently, so every field the OTHER
            # branch owns reads as "additional" and the whole document fails. Restated flat instead.
            type: object
            additionalProperties: false
            required: [id, name, publicPrefix, permissions, expiresAt, secret, createdAt, updatedAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                name:
                    type: string
                publicPrefix:
                    type: string
                permissions:
                    type: array
                    items: { type: string }
                    minItems: 1
                lastUsedAt:
                    type: string
                    format: date-time
                expiresAt:
                    type: string
                    format: date-time
                revokedAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                secret:
                    type: string
                    description: The newly minted credential, in plaintext — `sk_<prefix>_<secret>`. Shown here once, on creation, and never again.

        MintApiKeyRequest:
            type: object
            additionalProperties: false
            required: [name, permissions, expiresAt]
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 200
                    description: A caller-chosen label — what this credential is for, shown back in the list.
                permissions:
                    type: array
                    items: { type: string, maxLength: 100 }
                    minItems: 1
                    description: The permission rules to mint this credential with, each spelled `<action>:<Subject>` (`display:Order`). Must be a subset of the caller's own current permissions, or the request is refused with 422.
                expiresAt:
                    type: string
                    format: date-time
                    description: Required, and at most one year from now (422 beyond it). Once past, the credential is refused exactly like a revoked one.

        ApiKeysResponse:
            type: object
            additionalProperties: false
            required: [items, meta, maxExpiresAt]
            properties:
                items:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKey' }
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'
                maxExpiresAt:
                    type: string
                    format: date-time
                    description: The latest `expiresAt` a mint accepts right now (one calendar year from this response). A later one is refused with 422, so a form can bound its date picker without copying the rule.

