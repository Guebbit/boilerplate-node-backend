keys:
    # -- account -------------------------------------------------------------------------------
    # `account` is otherwise keyless on purpose — what you may do to your OWN record follows from
    # being signed in. This one is the exception because it is not about your own record: it prunes
    # expired credentials across every account, which is an operational lever.
    - key: tokens.any.delete
      module: account
      subject: AccountToken
      action: delete
      scope: tenant
      description: Remove expired tokens from every account. Operational, not self-service.
