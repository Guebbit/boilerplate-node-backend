openapi: 3.0.3
info:
    title: account — module contract
    version: '0.1.0'

x-error-codes:
    EMAIL_CHANGE_TOO_SOON: { status: 429, description: 'An email change was already requested for this account in the last minute — carries `details.retryAfter`.' }
    EMAIL_VERIFY_RESEND_TOO_SOON: { status: 429, description: 'A verification email was already sent recently — carries `details.retryAfter`.' }
    TWO_FACTOR_RESEND_TOO_SOON: { status: 429, description: 'A two-factor code was already sent recently — carries `details.retryAfter`.' }

paths:
    # --------- What this caller may do ---------
    # The plan calls this `/me/abilities`. It lives under `/account` instead, because a module
    # here mounts at one `basePath` and a second mount point for a single route would make the
    # account module two things. Same endpoint, same shape, inside the module that owns the
    # caller's own record.
    /account/abilities:
        get:
            tags: [Account]
            summary: The caller's own authorization rules
            description: |
                The rules the SERVER enforces, packed for a client to evaluate.

                Published so a client can grey out what it would be refused, from the same rules
                rather than from a copy of them — a hand-maintained duplicate of "what may I do"
                drifts, and the drift is silent until somebody is shown a button that answers 403.

                Answered in BOTH scopes, as two separate lists. A request acts in exactly one — the
                one its key declares — but a client renders the shop's screens and the
                installation's health dashboard from a single navigation, so it needs both and must
                never merge them.

                **The client's copy has no authority.** It decides what to RENDER, never what is
                allowed; every request is re-evaluated server-side. Published here because the
                alternative is every client inventing the same guess.

                Answered for an anonymous caller too: a stranger holds the `guest` role, which is
                a value in the model rather than an absence, and a shop front that greys nothing
                out for a visitor is a shop front that lies twice.
            operationId: getMyAbilities
            responses:
                '200':
                    description: The caller's packed rules.
                    content:
                        application/json:
                            schema:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/AbilitiesEnvelope'

    # --------- Authentication and profile ---------
    /account:
        # Bundler: adds the `If-Match` parameter and 412 to the writes listed, and `ETag` to the 200s.
        x-versioned: [get, put, patch]
        get:
            tags: [Account]
            summary: Current user info
            description: Returns the full profile of the currently authenticated user
            operationId: getAccount
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Current user info
                    content:
                        application/json:
                            schema:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/UserEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
        put:
            tags: [Account]
            summary: Replace own profile
            description: Replaces every writable field of the authenticated user's own profile — email, username, locale (RFC 9110 §9.3.4, an omitted optional field is cleared). The image is outside the representation — set by an upload, cleared by an explicit `imageUrl` null, kept when a PUT never mentions it. `analyticsConsent` is required — it has no cleared state, so a PUT always states it and consent is never reset or withdrawn by a forgotten field. Role, account state and password are out of scope — the first two belong to the admin `/users` endpoints, the password to `POST /account/password`. Changing the email does NOT take effect immediately — it is held as `pendingEmail` until `POST /account/email-change-confirm` proves the new address, and a notice carrying a 7-day one-time undo link (`POST /account/email-change-undo`) is sent to the OLD address the moment the change is requested. Changing the email needs a fresh session; an account with a second factor armed also needs an `otp` proof in it (`401 REAUTH_REQUIRED` with `details.methods`). Sending the CURRENT address, the address already PENDING, or any other value that resolves to no change is a no-op — it neither starts, restarts nor cancels anything; cancel an already-pending change with `DELETE /account/pending-email`, or have its link mailed again with `POST /account/pending-email/resend`.
            operationId: replaceAccount
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReplaceAccountRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/ReplaceAccountRequestMultipart'
            responses:
                '200':
                    description: Replaced profile
                    content:
                        application/json:
                            schema:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/UserEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # Changing the email to an address another account already holds.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `uploadLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        patch:
            tags: [Account]
            summary: Update own profile
            description: Merges the given fields into the authenticated user's own profile — email, username, locale, image (RFC 7396, an omitted field is left unchanged, `null` clears an optional one). Role, account state and password are out of scope — the first two belong to the admin `/users` endpoints, the password to `POST /account/password`. Changing the email does NOT take effect immediately — it is held as `pendingEmail` until `POST /account/email-change-confirm` proves the new address, and a notice carrying a 7-day one-time undo link (`POST /account/email-change-undo`) is sent to the OLD address the moment the change is requested. Changing the email needs a fresh session; an account with a second factor armed also needs an `otp` proof in it (`401 REAUTH_REQUIRED` with `details.methods`). Sending the CURRENT address, or the address already PENDING, is a no-op — it neither starts, restarts nor cancels anything; cancel an already-pending change with `DELETE /account/pending-email`, or have its link mailed again with `POST /account/pending-email/resend`.
            operationId: updateAccount
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateAccountRequest'
                    application/merge-patch+json:
                        schema:
                            $ref: '#/components/schemas/UpdateAccountRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/UpdateAccountRequestMultipart'
            responses:
                '200':
                    description: Updated profile
                    content:
                        application/json:
                            schema:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/UserEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # Changing the email to an address another account already holds.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `uploadLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        delete:
            tags: [Account]
            summary: Request account deletion
            description: Initiates the account-deletion flow for the authenticated user. A one-time confirmation token is sent to the user's email address. The token must then be submitted to `/account/delete-confirm` to complete the deletion. Needs a critically fresh session; an account with a second factor armed also needs an `otp` proof in it (`401 REAUTH_REQUIRED` with `details.methods`).
            operationId: requestAccountDelete
            security:
                - bearerAuth: []
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/pending-email:
        delete:
            tags: [Account]
            summary: Cancel a pending email change
            description: Discards a pending `pendingEmail` change started by `PUT`/`PATCH /account`, without proving it. A no-op when nothing is pending — a client does not need to check `GET /account` first.
            operationId: cancelPendingEmailChange
            security:
                - bearerAuth: []
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/pending-email/resend:
        post:
            tags: [Account]
            summary: Resend the pending email confirmation
            description: Mails the NEW (pending) address a fresh confirmation link — and only that address; the old one is not told again. The previous link stops working, since only the newest one counts. Answers 200 with `resendAfter`, the seconds a client counts down before offering the button again — the same shape as `POST /account/verify-request`. A no-op, answering 200 with `resendAfter` 0 and mailing nothing, when nothing is pending, so a client does not need to check `GET /account` first. Sending the pending address again through `PUT`/`PATCH /account` does nothing, which is why this route exists. Answers 429 inside the previous send's cooldown (the same 60 seconds as `POST /account/verify-request`, with `details.retryAfter` naming the wait) and spends the same per-account budget on a failure, so a client that waits never sees one. No fresh-auth guard — it mails an address the caller already asked for and changes nothing about the account.
            operationId: resendPendingEmail
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: The confirmation link is on its way to the pending address, or nothing was pending (then `resendAfter` is 0)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EmailVerificationRequestedEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # `credentialLimiters` sits in front of this route, and the service refuses a send
                # inside the previous one's cooldown — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/password:
        post:
            tags: [Auth]
            summary: Change password
            description: Changes the authenticated user's password. Unlike the reset flow this proves possession of the current password rather than of the mailbox, so it needs no email round-trip. Every session is revoked and every pending one-time link and login challenge is purged; the response carries a fresh access token for the calling session, and sets fresh session cookies. An account with a second factor armed also needs a fresh session that proved an `otp` (`401 REAUTH_REQUIRED` with `details.methods`); an account without one is asked nothing new.
            operationId: changePassword
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangePasswordRequest'
            responses:
                '200':
                    description: |
                        Password changed. `data` normally carries a fresh access token for this
                        session, but is ABSENT on the rare degraded success where the re-mint
                        itself fails after the password write already committed — see B23 on
                        `ChangePasswordResponseEnvelope`.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChangePasswordResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # A wrong current password is a 422 with a translated message, NOT a 401: a 401
                # here would read as "your token expired" to every client interceptor and log
                # the user out of a session that is perfectly valid.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `credentialLimiters` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/password/check:
        post:
            tags: [Auth]
            summary: Check a candidate password's breach status
            description: Advisory only — never blocks anything itself. Reports whether a CANDIDATE password (not yet required to satisfy `PasswordNew`) matches a known-breached password, so a signup or password-change form can warn before submission. Unauthenticated, since signup needs it before an account exists. The four password-SET paths remain the actual gate, checked again server-side regardless of what this endpoint answered.
            operationId: checkPasswordBreached
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasswordCheckRequest'
            responses:
                '200':
                    description: The candidate's breach status
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PasswordCheckEnvelope'
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/reauth:
        get:
            tags: [Auth]
            summary: How this account can re-authenticate
            description: 'The ways THIS account can answer a `401 REAUTH_REQUIRED` challenge, in the order a client should offer them. An account with a password gets `password`; an account with none (it signed up through an OAuth provider) gets `email`, a code mailed to its verified address. Empty when the account has no password and this deployment cannot deliver mail, so a client shows a dead end instead of a form nobody can pass. The list is a server fact, not a client guess: the kernel that raises the challenge cannot see account data.'
            operationId: getReauthMethods
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: The applicable methods
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReauthMethodsEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

        post:
            tags: [Auth]
            summary: Re-authenticate (step-up)
            description: Re-proves who the caller is to refresh how recently they authenticated, without ending the session — the answer to a `401 REAUTH_REQUIRED` challenge from a route gated by freshness (checkout, payments, deleting the account, changing the email, session management). The body is tagged by `method`, one of those `GET /account/reauth` lists, and may carry an `otp` code from an armed second factor. Re-mints the session and returns a fresh access token, same as `POST /account/password`. The new session carries ONLY what this call proved (`pwd` or `email`, plus `otp` when a code was given and verified). Proofs from the login are not carried over, so a password-only re-authentication no longer passes a route that demands `otp`. The refresh token the call was made with is retired.
            operationId: reauth
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReauthRequest'
            responses:
                '200':
                    description: Re-authenticated; a fresh access token for this session
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthTokensEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # A wrong password or code, or a method the account does not have, is a 422 with a
                # translated message, NOT a 401 — same reasoning as changePassword above: a 401 here
                # would read as "your session expired" to every client interceptor and log out a
                # session that is, in fact, still valid.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `credentialLimiters` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/reauth/methods/{method}/send:
        post:
            tags: [Auth]
            summary: Send a code to re-authenticate
            description: Mails the caller a one-time code for step-up, for an account that has no password to prove instead. Answers 422 for an account that has a password, or that has no verified address or no way to deliver mail, and 429 inside the per-code cooldown or once the account's hourly delivery budget is spent (shared with `POST /account/2fa/methods/{method}/send`, since both spend the same mailbox). Needs no fresh auth — it is what earns one.
            operationId: sendReauthCode
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/ReauthMethodPath'
            responses:
                '200':
                    description: A code is on its way
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwoFactorDeliveryEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/2fa:
        get:
            tags: [Auth]
            summary: Two-factor status
            description: 'What second factors this account has armed, and what it could still add. `available` crosses a deployment fact with an account fact — a method this deployment cannot reach at all (no SMTP configured) is absent entirely, while one the account is not yet eligible for (an unverified email address) is listed with `enrollable: false`.'
            operationId: getTwoFactorStatus
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: The account's second factors, armed and available
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwoFactorStatusEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        delete:
            tags: [Auth]
            summary: Disable two-factor authentication
            description: 'Drops EVERY enrolled method and every unused backup code. Requires a valid code from any enrolled method — or an unused backup code — in the body, on top of the route''s own fresh-auth requirement: disabling from a stolen-but-fresh session is otherwise the cheapest way around the whole feature. Removing one method and keeping the rest is DELETE /account/2fa/methods/{method}.'
            operationId: disableTwoFactor
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TwoFactorCodeRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/2fa/methods/{method}/setup:
        post:
            tags: [Auth]
            summary: Start enrolling one second factor
            description: Begins — or restarts — enrollment of one method. A device method answers with the secret to scan; a delivered method sends a code and answers with where it went. Nothing is armed until POST /account/2fa/methods/{method}/confirm proves the caller received it. Calling this again replaces whatever that method had pending, and disarms it if it was already confirmed. The FIRST factor an account arms needs only the fresh critical auth the route already demands. Once any factor is armed, every setup — a replace or a second method — also needs `code`, from an armed factor or an unused backup code, because a stolen-but-fresh session must not be able to swap the factor it would otherwise have to pass (OWASP MFA Cheat Sheet, "Changing MFA Factors"; NIST SP 800-63B). A caller whose only factor is delivered gets that code from POST /account/2fa/methods/{method}/send.
            operationId: setupTwoFactorMethod
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/TwoFactorMethodPath'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TwoFactorSetupRequest'
            responses:
                '200':
                    description: What the caller needs to finish enrolling this method
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwoFactorSetupEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # 422 rather than 403 for a method the account cannot enroll (an unverified email
                # address): the caller can fix it, and the message says how.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/2fa/methods/{method}/send:
        post:
            tags: [Auth]
            summary: Send a code to prove an armed factor
            description: Delivers a fresh code for one ARMED delivered method to a signed-in caller, so an account whose only factor is delivered (email) can satisfy the code that removing, replacing or disabling a factor asks for without spending a backup code. Answers 422 for a method that is not armed or does not deliver, and 429 inside the per-code cooldown or once the account's hourly delivery budget is spent. Needs fresh critical auth, like the calls it serves.
            operationId: sendTwoFactorMethodCode
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/TwoFactorMethodPath'
            responses:
                '200':
                    description: A code is on its way
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwoFactorDeliveryEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/2fa/methods/{method}/confirm:
        post:
            tags: [Auth]
            summary: Arm one second factor
            description: Arms the method pending from its setup call, against a code the caller has demonstrably received. Backup codes are minted here — but only by the FIRST factor an account arms, since they recover the account, not the method.
            operationId: confirmTwoFactorMethod
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/TwoFactorMethodPath'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TwoFactorConfirmRequest'
            responses:
                '200':
                    description: The method is armed; backup codes if this was the first one
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwoFactorConfirmEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/2fa/methods/{method}:
        delete:
            tags: [Auth]
            summary: Remove one second factor
            description: Drops one method and leaves the others armed. Requires a valid code — from any enrolled method, or a backup code — for the same reason the full disable does. Removing the LAST armed method turns two-factor authentication off and discards the backup codes with it, exactly as DELETE /account/2fa would.
            operationId: removeTwoFactorMethod
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/TwoFactorMethodPath'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TwoFactorCodeRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/2fa/backup-codes:
        post:
            tags: [Auth]
            summary: Regenerate backup codes
            description: Mints a fresh set of ten one-time backup codes and discards whatever was left of the old set — the answer to burning through them with no way back in short of admin-assisted recovery. Requires a valid code from any armed method, or an unused backup code, on top of the route's own fresh-auth requirement, same reasoning as disabling a factor.
            operationId: regenerateBackupCodes
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TwoFactorCodeRequest'
            responses:
                '200':
                    description: The account's new backup codes, in the clear, shown exactly once
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwoFactorBackupCodesRegeneratedEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # No factor armed at all — there is nothing to regenerate a recovery list for.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/logout:
        post:
            tags: [Auth]
            summary: Logout this session
            description: Logs out the CURRENT session only — revokes the refresh token carried by the `jwt` cookie and clears the authentication cookies. Other devices stay signed in; `POST /account/logout-all` is the one that revokes everything. Answers 200 whether or not a live session was found, because the caller's goal — not being logged in here — is met either way.
            operationId: logout
            security: []
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/sessions:
        get:
            tags: [Account]
            summary: List active sessions
            description: Lists the authenticated user's live refresh tokens as sessions — issue-agnostic handles with an expiry and a `current` marker, never the token values themselves. The one carried by the caller's own refresh cookie is flagged `current`.
            operationId: getSessions
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Active sessions
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionsEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/sessions/{sessionId}:
        delete:
            tags: [Account]
            summary: Revoke one session
            description: Revokes a single refresh token by its session id — "log out that device". Revoking the current session is allowed and equivalent to `POST /account/logout`, except that the cookies of OTHER clients cannot be cleared from here; their next refresh simply fails.
            operationId: revokeSession
            security:
                - bearerAuth: []
            parameters:
                - name: sessionId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: Session identifier from `GET /account/sessions`
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # Well-formed session id that matches none of the caller's live sessions.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/verify-request:
        post:
            tags: [Auth]
            summary: Request email verification
            description: Sends a one-time verification token to the authenticated user's email address. The token must then be submitted to `/account/verify-confirm`. Signup already sends one automatically; this endpoint re-sends it for the mail that never arrived. Answers 429 inside the previous send's cooldown, so a client that respects `resendAfter` never sees one — unlike a login guess, a SUCCESSFUL call here is the expensive one, since each publishes mail.
            operationId: requestEmailVerification
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: A verification email is on its way
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EmailVerificationRequestedEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # The account is already verified — there is nothing to send.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/verify-confirm:
        post:
            tags: [Auth]
            summary: Confirm email verification
            description: Completes the email-verification flow. Validates the one-time token issued at signup or by `/account/verify-request` and, if valid, marks the account's email address as verified.
            operationId: confirmEmailVerification
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VerifyEmailConfirmRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `credentialLimiters` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/email-change-confirm:
        post:
            tags: [Auth]
            summary: Confirm a pending email change
            description: Completes the email-change flow started by `PUT /account`. Validates the one-time `email-change` token sent to the NEW address and, if valid, swaps `pendingEmail` into `email`, marks the account verified, and revokes every refresh token — the same treatment `POST /account/password` gives a password change, since an email change is the stronger takeover primitive of the two. A `verify` token from the signup flow is refused here, and this token is refused by `/account/verify-confirm` — the two prove different things.
            operationId: confirmEmailChange
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VerifyEmailConfirmRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                # The new address was claimed by another account between the request and this
                # confirm — the same race `PUT /account` itself declares 409 for.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `credentialLimiters` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/email-change-undo:
        post:
            tags: [Auth]
            summary: Undo an email change
            description: Reverts an email change from the one-time link in the notice mailed to the OLD address when the change was requested. Valid for 7 days from that request, and untouched by a password change, so a person who reads mail weekly can still use it. While the change is only pending it is cancelled; once the new address was confirmed the previous one is restored, and every session is ended (a refresh token cannot outlive the address it was issued under). Public, like `POST /account/email-change-confirm`, the token in the body is the credential. Answers 409 when the previous address was meanwhile claimed by another account.
            operationId: undoEmailChange
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VerifyEmailConfirmRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `credentialLimiters` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/delete-confirm:
        delete:
            tags: [Account]
            summary: Confirm account deletion
            description: Completes the account-deletion flow. Validates the one-time token issued by `DELETE /account` and, if valid, permanently removes the user account.
            operationId: confirmAccountDelete
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountDeleteConfirmRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/login:
        post:
            tags: [Auth]
            summary: Login
            description: Authenticates a user with email and password credentials. On success, returns a JWT access token that must be passed as a Bearer token on subsequent authenticated requests — OR, when the account has two-factor authentication enabled, a short-lived challenge that must be submitted to `POST /account/login/2fa` instead.
            operationId: login
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                '200':
                    description: Auth tokens, or a two-factor challenge
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LoginResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `credentialLimiters` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/login/2fa:
        post:
            tags: [Auth]
            summary: Complete a two-factor login
            description: The second step of a login for an account with two-factor authentication enabled — submits the challenge from `POST /account/login` and a 6-digit code (or an unused backup code). On success, returns the same auth tokens `POST /account/login` returns for an account with no second factor.
            operationId: loginTwoFactor
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginTwoFactorRequest'
            responses:
                '200':
                    description: Auth tokens
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthTokensEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # A wrong code is a 422, same reasoning as /account/reauth: a 401 here would read
                # as an expired challenge and send a caller back to /account/login for no reason.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `credentialLimiters` and `mfaChallengeLimiter` both sit in front of this route —
                # see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/login/2fa/send:
        post:
            tags: [Auth]
            summary: Send a login code
            description: Delivers a fresh code for one armed delivered method, against a live challenge. Public like the rest of the login flow — the challenge token is the credential. Answers 429 while the previous code is still inside its cooldown, so a client that respects `resendAfter` never sees one; the cooldown exists because this endpoint sends mail on an unauthenticated caller's say-so.
            operationId: sendTwoFactorCode
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TwoFactorSendRequest'
            responses:
                '200':
                    description: A code is on its way
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwoFactorDeliveryEnvelope'
                # An expired or forged challenge, and an account with no such method armed, answer
                # alike: neither should tell a caller which one they hit.
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/oauth/providers:
        get:
            tags: [Auth]
            summary: List enabled OAuth providers
            description: The OAuth providers this deployment holds credentials for — an empty list means none are configured. The frontend uses this to decide which "Continue with…" buttons to render.
            operationId: listOAuthProviders
            security: []
            responses:
                '200':
                    description: Enabled provider names
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OAuthProvidersEnvelope'
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/oauth/links:
        get:
            tags: [Auth]
            summary: List the caller's connected accounts
            description: The sign-in providers linked to the authenticated account (Google, GitHub), with when each was connected. Never carries a provider's own identifier. An empty list means the account signs in with a password alone.
            operationId: listOAuthLinks
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: The linked providers
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OAuthLinksEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/oauth/links/{provider}:
        delete:
            tags: [Auth]
            summary: Disconnect a linked sign-in provider
            description: Removes the link between the account and `provider`, so that provider can no longer sign in to it. Needs a fresh session (`401 REAUTH_REQUIRED`). There is no guard on removing the last sign-in method, by decision (forgot-password recovers an account that was left with none). Answers 404 when `provider` is not linked.
            operationId: unlinkOAuthProvider
            security:
                - bearerAuth: []
            parameters:
                - name: provider
                  in: path
                  required: true
                  schema:
                      type: string
                      maxLength: 32
                  description: One of the `provider` names `GET /account/oauth/links` lists.
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/oauth/{provider}:
        get:
            tags: [Auth]
            summary: Start an OAuth login
            description: 'Browser-navigated only: redirects to `provider`''s consent screen, having minted the CSRF `state` as a cookie. Not called programmatically — the frontend points a plain `<a href>` at this URL.'
            operationId: startOAuthLogin
            security: []
            parameters:
                - name: provider
                  in: path
                  required: true
                  schema:
                      type: string
                      maxLength: 32
                  description: One of the names `GET /account/oauth/providers` lists.
                - name: continue
                  in: query
                  required: false
                  description: Same-origin relative path to send the browser back to once the login completes — the OAuth equivalent of the password-login flow's own `?continue=`. Saved as a cookie for the round trip to the provider and back; anything that is not a same-origin relative path (an absolute URL, a protocol-relative `//host/path`) is dropped silently rather than refused, since a browser navigation has nowhere to show a validation error.
                  schema: { type: string, maxLength: 512 }
                - name: locale
                  in: query
                  required: false
                  description: The language tag (`it`, `pt-BR`) of the page the visitor started from. Saved as a cookie for the round trip and echoed back as `?locale=` on the frontend redirect, so a visitor with no `continue` target and no saved language preference lands in the language they were reading. Anything not shaped like a tag is dropped silently, like `continue`.
                  schema: { type: string, maxLength: 35 }
            responses:
                '302':
                    description: Redirect to the provider's consent screen
                    headers:
                        Location:
                            schema: { type: string }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `credentialLimiters` sits in front of this route — see routes.ts. Answered as the
                # shared JSON error envelope, not a redirect, same as every other limited route.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }

    /account/oauth/{provider}/callback:
        get:
            tags: [Auth]
            summary: Complete an OAuth login
            description: 'Browser-navigated only: where `provider` sends the browser back after consent. Validates `state`, exchanges the code, finds-or-creates the account, and redirects to the frontend with the session cookies set — or with `?error=<code>` on failure. When the account has two-factor authentication armed, no session is minted: the redirect instead carries `?mfaRequired=1&expiresAt=...&methods=...&defaultMethod=...` (the same fields MfaChallenge carries, minus the token itself), and the challenge token travels in a short-lived httpOnly cookie that POST /account/login/2fa and .../2fa/send read when their body omits `challenge`. Either success redirect also carries `?continue=<path>` when `GET /account/oauth/{provider}` saved one and it is still a valid same-origin path; every redirect, a failure''s included, carries `?locale=<tag>` likewise.'
            operationId: completeOAuthLogin
            security: []
            parameters:
                - name: provider
                  in: path
                  required: true
                  schema:
                      type: string
                      maxLength: 32
                - name: code
                  in: query
                  required: false
                  schema: { type: string, maxLength: 2048 }
                - name: state
                  in: query
                  required: false
                  schema: { type: string, maxLength: 512 }
                - name: error
                  in: query
                  required: false
                  description: Set by the provider instead of `code` when the user declines consent.
                  schema: { type: string, maxLength: 256 }
            responses:
                '302':
                    description: Redirect to the frontend, session cookies set on success
                    headers:
                        Location:
                            schema: { type: string }
                '400':
                    description: Missing or mismatched CSRF state
                    content:
                        application/json:
                            schema:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ErrorResponse'
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `credentialLimiters` sits in front of this route — see routes.ts. Answered as the
                # shared JSON error envelope, not a redirect, same as every other limited route.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }

    /account/signup:
        post:
            tags: [Auth]
            summary: Signup
            description: 'Registers a new user account. Takes no image — a stranger writes nothing to the store before registering; the signed-in caller sets an avatar with `PATCH /account`. Returns the newly created user profile on success, and signs the caller in — the refresh cookie is set here, so a client reaches a usable access token through `GET /account/refresh` rather than by calling `POST /account/login` again. The new account holds `unverified` until `POST /account/verify-confirm` proves the address — it browses freely and is stopped only at `cart.checkout`.'
            operationId: signup
            security: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/AntibotChallengeTokenHeader'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SignupRequest'
            responses:
                '201':
                    description: Created
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/UserEnvelope'
                # The BODY is identical when rung 2 of the anti-automation ladder refuses the
                # address: a fabricated profile from a document that was never saved, so a script
                # gets nothing to iterate on. Only the refresh cookie tells the two apart, since
                # a refusal has no account to mint a session for.
                # Also answered when a human-challenge provider is active and the caller's
                # token is missing or refused — see antibot/openapi.yaml.
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # Signing up with an email that is already registered, a challenge token already
                # spent (rung 3), or `Idempotency-Key` naming a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                # Also answered when `Idempotency-Key` was already used with a different body.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `signupLimiters` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/reset:
        post:
            tags: [Auth]
            summary: Request password reset
            operationId: requestPasswordReset
            description: Initiates the password-reset flow by sending a one-time reset token to the provided email address. The token should then be submitted to `/account/reset-confirm`.
            security: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/AntibotChallengeTokenHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasswordResetRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                # A human-challenge provider is active and the caller's token is missing or refused.
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `resetRequestLimiters` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/reset-confirm:
        post:
            tags: [Auth]
            summary: Confirm password reset
            operationId: confirmPasswordReset
            description: Completes the password-reset flow. Validates the one-time reset token issued by `/account/reset` and, if valid, updates the user's password to the supplied value.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasswordResetConfirmRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `credentialLimiters` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/refresh:
        get:
            tags: [Auth]
            summary: Refresh access token
            description: Creates a new short-lived access token from the refresh token in the `jwt` cookie. The cookie is `HttpOnly`, so the token is never readable by page scripts and never appears in a URL, a proxy log or a `Referer` header.
            operationId: refreshToken
            security: []
            responses:
                '200':
                    description: New access token
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RefreshTokenEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/logout-all:
        post:
            tags: [Auth]
            summary: Logout from all devices
            description: Logs out the authenticated user from ALL devices by removing all refresh tokens from the database and clearing authentication cookies.
            operationId: logoutAll
            security:
                - bearerAuth: []
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/export:
        post:
            tags: [Auth]
            summary: Request an export of the caller's own data
            description: >-
                Starts "give me my data" (Art. 15, 20) and answers at once with `202` and the export's
                `id` and `status`. The file is built in the background from every collection that holds
                something of the caller's — profile, address book, orders, payments, shipments, cart,
                wishlist, live sessions (metadata only, never a token value), and their own audit
                trail — and a LINK to it is mailed to the account's address when it is ready, never
                the data itself. Fetch it with `GET /account/export/{id}`.


                One live export per account. Asking while one is `building` returns that one; asking
                after one is `ready` or `failed` replaces it (the old file and record are deleted
                first). A file is kept for `NODE_ACCOUNT_EXPORT_TTL_DAYS` days. Requires a FRESH session
                (`requireFreshAuth`) rather than a request body — a personal-data dump is worth
                re-proving identity for, and this repository already has the mechanism.
            operationId: requestAccountExport
            security:
                - bearerAuth: []
            responses:
                '202':
                    description: The export is queued (or is the one already building)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountExportRequestEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/export/{id}:
        get:
            tags: [Auth]
            summary: Download an export of the caller's own data
            description: >-
                Streams the finished export — the JSON document `AccountExportResponse` describes — as
                an attachment. This is the page the mailed link opens. Owner only, and a FRESH session
                (`requireFreshAuth`), same as the request. `404` for an export that is not the
                caller's, is still `building`, `failed`, or is already gone (past its retention, or
                replaced by a newer request): the caller cannot tell these apart, by design.
            operationId: downloadAccountExport
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The caller's own data
                    headers:
                        Content-Disposition:
                            description: '`attachment`, with the file name `account-export.json`.'
                            schema: { type: string }
                    content:
                        application/json:
                            schema:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/AccountExportResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # ---------- account — the schemas only this module's paths reference. ----------
        AccountExportRequest:
            type: object
            additionalProperties: false
            required: [id, status]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                status:
                    type: string
                    enum: [building, ready, failed]
                    description: >-
                        `building` on a fresh request. A request never answers `ready` or `failed`:
                        asking again after either REPLACES the export with a new `building` one.

        AccountExportRequestEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/AccountExportRequest'

        OAuthProviders:
            type: object
            additionalProperties: false
            required: [providers]
            properties:
                providers:
                    type: array
                    items: { type: string }
                    description: Registry names this deployment holds credentials for, e.g. `["google", "github"]`.

        OAuthLink:
            type: object
            additionalProperties: false
            required: [provider, connectedAt]
            properties:
                provider:
                    type: string
                    description: Registry name of the linked provider, e.g. `google`.
                connectedAt:
                    type: string
                    format: date-time
                    description: When the account was linked to this provider.

        OAuthLinks:
            type: object
            additionalProperties: false
            required: [links]
            properties:
                links:
                    type: array
                    items:
                        $ref: '#/components/schemas/OAuthLink'

        OAuthLinksEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/OAuthLinks'

        OAuthProvidersEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/OAuthProviders'

        AuthTokensEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/AuthTokens'

        # `POST /account/password` alone can degrade to 200 with `data` absent — the
        # password write and the session revoke already committed by the time the re-mint runs,
        # so a 500 would misreport a change that DID succeed. `reauth` and `loginTwoFactor` never
        # degrade this way (see their controllers), so they keep the stricter AuthTokensEnvelope;
        # only this operation's 200 uses this schema.
        ChangePasswordResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/AuthTokens'

        RefreshTokenEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/RefreshTokenResponse'

        AuthTokens:
            type: object
            additionalProperties: false
            required: [token]
            properties:
                token:
                    type: string
                    description: Access JWT
                refreshToken:
                    type: string
                    description: Refresh token if returned by backend
                expiresIn:
                    type: integer
                    description: Access token expiry in seconds

        RefreshTokenResponse:
            type: object
            additionalProperties: false
            required: [token]
            properties:
                token:
                    type: string
                    description: New access JWT
                refreshToken:
                    type: string
                    description: New refresh token if returned by backend
                expiresIn:
                    type: integer
                    description: New access token expiry in seconds

        MfaChallenge:
            type: object
            additionalProperties: false
            required: [mfaRequired, challenge, expiresAt, methods]
            properties:
                mfaRequired:
                    type: boolean
                    enum: [true]
                    description: Always true — the credential check passed, but a second factor is required before a session is issued.
                challenge:
                    type: string
                    description: A claim check for this half-finished login, not a code — nothing is sent to the user to obtain it. Submit it, with a code, to POST /account/login/2fa, or to POST /account/login/2fa/send to have a code delivered first.
                expiresAt:
                    type: string
                    format: date-time
                    description: When the challenge stops being accepted. Longer for an account with a delivered method armed, since the code has to survive an email round-trip.
                methods:
                    type: array
                    items:
                        $ref: '#/components/schemas/TwoFactorMethodSummary'
                    description: The factors armed on this account, in the order a client should offer them.
                defaultMethod:
                    type: string
                    description: Which of `methods` to offer first — the cheapest one for the user, which is a device method when there is one.

        LoginOutcome:
            oneOf:
                - $ref: '#/components/schemas/AuthTokens'
                - $ref: '#/components/schemas/MfaChallenge'
            description: Either a full session (AuthTokens) or a step-up challenge (MfaChallenge) when the account has two-factor authentication enabled.

        LoginResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/LoginOutcome'

        LoginTwoFactorRequest:
            type: object
            additionalProperties: false
            required: [code]
            properties:
                challenge:
                    type: string
                    maxLength: 128
                    minLength: 1
                    description: The challenge token from POST /account/login. Omit it for an OAuth-originated login — that challenge was never sent to the client, and this endpoint reads it from the httpOnly cookie the callback set instead.
                code:
                    type: string
                    maxLength: 64
                    description: A code from any armed method, or an unused backup code. Which method it came from is the server's problem, not the client's.
                remember:
                    $ref: '#/components/schemas/RememberTier'

        TwoFactorSendRequest:
            type: object
            additionalProperties: false
            required: [method]
            properties:
                challenge:
                    type: string
                    maxLength: 128
                    minLength: 1
                    description: The challenge token from POST /account/login. Omit it for an OAuth-originated login — see LoginTwoFactorRequest.challenge.
                method:
                    type: string
                    maxLength: 32
                    description: Which armed delivered method to send through — a `method` from the challenge's own `methods` list whose `delivers` is true.

        TwoFactorMethodSummary:
            type: object
            additionalProperties: false
            required: [method, delivers]
            properties:
                method:
                    type: string
                    description: 'Wire name of the factor — `totp`, `email`. A string rather than an enum on purpose: a deployment that gains a channel must not need a new contract to name it.'
                delivers:
                    type: boolean
                    description: Whether the server sends the code (email, SMS) or the caller reads it off their own device (TOTP). A client renders a "send me a code" button for the former and nothing for the latter.
                target:
                    type: string
                    description: Where a delivered code goes, MASKED by the server — never a full address, so no client has to decide how to redact one. Absent for device methods.
                enrolledAt:
                    type: string
                    format: date-time
                    description: When this factor was armed. Absent while its enrollment is still pending confirmation.
                resendAfter:
                    type: integer
                    description: Seconds between two deliveries of this method. Absent for device methods.
                enrollable:
                    type: boolean
                    description: Whether this account may add this method right now. Only meaningful in `TwoFactorStatus.available`; `false` comes with `reason`.
                reason:
                    type: string
                    description: Why `enrollable` is false — a translated sentence a client can show as-is.

        TwoFactorStatus:
            type: object
            additionalProperties: false
            required: [enabled, methods, available, backupCodesRemaining]
            properties:
                enabled:
                    type: boolean
                    description: Whether a login on this account is challenged for a second factor. True exactly when `methods` holds at least one armed entry.
                methods:
                    type: array
                    items:
                        $ref: '#/components/schemas/TwoFactorMethodSummary'
                    description: The factors armed on this account, plus any enrollment still pending confirmation.
                available:
                    type: array
                    items:
                        $ref: '#/components/schemas/TwoFactorMethodSummary'
                    description: 'What this account could still add. A method this deployment cannot reach at all is absent; one the account is not yet eligible for is present with `enrollable: false` and a `reason`.'
                backupCodesRemaining:
                    type: integer
                    description: How many unused backup codes are left. Zero with `enabled` true is the state worth warning about — a lost device then means admin-assisted recovery.

        TwoFactorStatusEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/TwoFactorStatus'

        TwoFactorSetup:
            type: object
            additionalProperties: false
            required: [method, delivers]
            properties:
                method:
                    type: string
                    description: The method being enrolled, echoed back.
                delivers:
                    type: boolean
                    description: Which half of this object to read. True — a code was just sent, see `sentTo`. False — enroll from `secret`/`otpauthUri`.
                secret:
                    type: string
                    description: A device method's secret, base32-encoded, shown once for manual entry as a fallback to scanning. Absent when `delivers`.
                otpauthUri:
                    type: string
                    description: An otpauth:// URI the client renders as a QR code — this API generates no image, so the secret crosses the wire once rather than twice. Absent when `delivers`.
                sentTo:
                    type: string
                    description: Masked destination the enrollment code just went to. Absent unless `delivers`.
                resendAfter:
                    type: integer
                    description: Seconds before another code may be requested. Absent unless `delivers`.
                expiresAt:
                    type: string
                    format: date-time
                    description: When the delivered code stops being accepted. Absent unless `delivers`.

        TwoFactorSetupEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/TwoFactorSetup'

        TwoFactorDelivery:
            type: object
            additionalProperties: false
            required: [method, sentTo, resendAfter, expiresAt]
            properties:
                method:
                    type: string
                    description: The method the code went through, echoed back.
                sentTo:
                    type: string
                    description: Masked destination — enough for the user to recognise the mailbox, not enough to learn a new address from.
                resendAfter:
                    type: integer
                    description: Seconds before another code may be requested. A client counts down from this rather than inventing its own cooldown, so it never disagrees with the rate limiter.
                expiresAt:
                    type: string
                    format: date-time
                    description: When this code stops being accepted.

        TwoFactorDeliveryEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/TwoFactorDelivery'

        EmailVerificationRequested:
            type: object
            additionalProperties: false
            required: [resendAfter]
            properties:
                resendAfter:
                    type: integer
                    description: Seconds before another verification email may be requested. A client counts down from this rather than inventing its own cooldown, so it never disagrees with the server.

        EmailVerificationRequestedEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/EmailVerificationRequested'

        TwoFactorSetupRequest:
            type: object
            additionalProperties: false
            properties:
                code:
                    type: string
                    maxLength: 64
                    description: A code from any armed method, or an unused backup code. Required once any factor is armed — a replace, or adding a second method — and ignored for the account's first factor.

        TwoFactorConfirmRequest:
            type: object
            additionalProperties: false
            required: [code]
            properties:
                code:
                    type: string
                    maxLength: 64
                    description: 'The code for the method being armed — read off the device, or received through its channel. A backup code is NOT accepted here: the point of this call is to prove the new factor works.'

        TwoFactorCodeRequest:
            type: object
            additionalProperties: false
            required: [code]
            properties:
                code:
                    type: string
                    maxLength: 64
                    description: A code from any armed method, or an unused backup code. Used to prove the factor being removed — or the account it protects — really belongs to the caller.

        TwoFactorConfirmed:
            type: object
            additionalProperties: false
            required: [method, backupCodesRemaining]
            properties:
                method:
                    type: string
                    description: The method just armed, echoed back.
                backupCodes:
                    type: array
                    items:
                        type: string
                    description: One-time recovery codes, in the clear, shown exactly once and never retrievable again. Present ONLY when this was the first factor the account armed — they recover the account, not the method, so a second factor mints none.
                backupCodesRemaining:
                    type: integer
                    description: How many unused backup codes the account now holds.

        TwoFactorConfirmEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/TwoFactorConfirmed'

        TwoFactorBackupCodesRegenerated:
            type: object
            additionalProperties: false
            required: [backupCodes, backupCodesRemaining]
            properties:
                backupCodes:
                    type: array
                    items:
                        type: string
                    description: The account's new one-time recovery codes, in the clear, shown exactly once — the old set no longer verifies.
                backupCodesRemaining:
                    type: integer
                    description: How many unused backup codes the account now holds — `BACKUP_CODE_COUNT`, fresh off a regenerate.

        TwoFactorBackupCodesRegeneratedEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/TwoFactorBackupCodesRegenerated'

        LoginRequest:
            type: object
            additionalProperties: false
            required: [email, password]
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                password:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Password'
                remember:
                    $ref: '#/components/schemas/RememberTier'

        RememberTier:
            type: string
            enum: [short, medium, long]
            description: >-
                The "remember me" choice, sized by the deployment (`short`, `medium`, `long`).
                Ticked: the refresh cookie persists for that tier. Omitted: a browser-session
                cookie (gone when the browser closes) whose token still lives for the `short`
                tier server-side. Refresh rotation, reauth and a password change keep the choice.

        SignupRequest:
            type: object
            additionalProperties: false
            required: [email, username, password, passwordConfirm, termsAccepted]
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                username:
                    type: string
                    minLength: 3
                    maxLength: 50
                password:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PasswordNew'
                passwordConfirm:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Password'
                # Must be `true` — the checkbox gating the Terms of Service / Privacy Policy.
                # Server-enforced (see `accountService.signup`), not just a client-side gate.
                termsAccepted:
                    type: boolean
                    enum: [true]
                # Optional, unlike `termsAccepted`: the second signup checkbox, opt-in and
                # unchecked by default. Absent is the same as `false` — there is no "leave it
                # alone" reading at signup, unlike `UpdateAccountRequest`'s.
                analyticsConsent:
                    type: boolean

        PasswordResetRequest:
            type: object
            additionalProperties: false
            required: [email]
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'

        PasswordResetConfirmRequest:
            type: object
            additionalProperties: false
            required: [token, password, passwordConfirm]
            properties:
                token:
                    type: string
                    maxLength: 128
                    minLength: 1
                    description: One-time password reset token (NOT a JWT).
                password:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PasswordNew'
                passwordConfirm:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Password'

        AccountDeleteConfirmRequest:
            type: object
            additionalProperties: false
            required: [token]
            properties:
                token:
                    type: string
                    maxLength: 128
                    minLength: 1
                    description: One-time account deletion token (NOT a JWT).

        # Self-service profile update. Deliberately narrower than `UpdateUserRequest`: no
        # `admin`, no `active`, no `password` — role and account state are the admin
        # endpoints' to change, and the password has its own flow (`POST /account/password`)
        # because it must prove knowledge of the current one.
        # PATCH /account — RFC 7396: every field optional, omitted means unchanged.
        UpdateAccountRequest:
            type: object
            additionalProperties: false
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                username:
                    type: string
                    minLength: 3
                    maxLength: 50
                # `null` clears the override, falling back to the deployment default/negotiated locale.
                locale:
                    type: string
                    nullable: true
                    allOf:
                        - $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Locale'
                # `null` removes the image. Omitted leaves it unchanged; `''` is
                # invalid (`ImageUrl`'s own `minLength: 1`), never a third spelling of "no image".
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageRemoval'
                phone:
                    type: string
                    maxLength: 32
                    minLength: 1
                    nullable: true
                website:
                    type: string
                    maxLength: 2048
                    minLength: 1
                    nullable: true
                # Absent means "leave it alone" like every other field here — a client withdraws
                # consent by sending `false` explicitly, never by omission.
                analyticsConsent:
                    type: boolean

        # A multipart part is a string or a file, never `null`: a clear cannot travel here. Send it as a JSON PATCH.
        UpdateAccountRequestMultipart:
            type: object
            additionalProperties: false
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                username:
                    type: string
                    minLength: 3
                    maxLength: 50
                locale:
                    type: string
                    allOf:
                        - $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Locale'
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional user profile image
                phone:
                    type: string
                    maxLength: 32
                    minLength: 1
                website:
                    type: string
                    maxLength: 2048
                    minLength: 1
                analyticsConsent:
                    type: boolean

        # PUT /account — RFC 9110 §9.3.4: the body IS the new resource, so every writable field
        # this resource has must be nameable and the identity fields are genuinely required.
        ReplaceAccountRequest:
            type: object
            additionalProperties: false
            required: [email, username, analyticsConsent]
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                username:
                    type: string
                    minLength: 3
                    maxLength: 50
                locale:
                    type: string
                    nullable: true
                    allOf:
                        - $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Locale'
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageRemoval'
                phone:
                    type: string
                    maxLength: 32
                    minLength: 1
                    nullable: true
                website:
                    type: string
                    maxLength: 2048
                    minLength: 1
                    nullable: true
                analyticsConsent:
                    type: boolean

        # A multipart part is a string or a file, never `null`: a clear cannot travel here. Send it as a JSON PATCH.
        ReplaceAccountRequestMultipart:
            type: object
            additionalProperties: false
            required: [email, username, analyticsConsent]
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                username:
                    type: string
                    minLength: 3
                    maxLength: 50
                locale:
                    type: string
                    allOf:
                        - $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Locale'
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional user profile image
                phone:
                    type: string
                    maxLength: 32
                    minLength: 1
                website:
                    type: string
                    maxLength: 2048
                    minLength: 1
                analyticsConsent:
                    type: boolean

        ChangePasswordRequest:
            type: object
            additionalProperties: false
            required: [currentPassword, password, passwordConfirm]
            properties:
                currentPassword:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Password'
                password:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PasswordNew'
                passwordConfirm:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Password'

        ReauthMethod:
            type: string
            enum: [password, email]
            description: 'One way to re-authenticate. `password` proves the account password; `email` proves control of the account''s verified address with a mailed code.'

        ReauthPasswordRequest:
            type: object
            additionalProperties: false
            required: [method, password]
            properties:
                method:
                    type: string
                    enum: [password]
                password:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Password'
                otp:
                    type: string
                    maxLength: 64
                    minLength: 1
                    description: A code from an armed second factor, or an unused backup code. Required to pass an identity route (changing the email or password, deleting the account) when the account has 2FA armed; the `401 REAUTH_REQUIRED` that asks for it carries `details.methods` of `[otp]`. Answers 422 when the account has no second factor armed.

        ReauthEmailRequest:
            type: object
            additionalProperties: false
            required: [method, code]
            properties:
                method:
                    type: string
                    enum: [email]
                code:
                    type: string
                    maxLength: 64
                    minLength: 1
                    description: The code from `POST /account/reauth/methods/email/send`.
                otp:
                    type: string
                    maxLength: 64
                    minLength: 1
                    description: A code from an armed second factor, or an unused backup code. Required to pass an identity route (changing the email or password, deleting the account) when the account has 2FA armed; the `401 REAUTH_REQUIRED` that asks for it carries `details.methods` of `[otp]`. Answers 422 when the account has no second factor armed.

        ReauthRequest:
            oneOf:
                - $ref: '#/components/schemas/ReauthPasswordRequest'
                - $ref: '#/components/schemas/ReauthEmailRequest'
            discriminator:
                propertyName: method
                mapping:
                    password: '#/components/schemas/ReauthPasswordRequest'
                    email: '#/components/schemas/ReauthEmailRequest'

        ReauthMethods:
            type: object
            additionalProperties: false
            required: [methods]
            properties:
                methods:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReauthMethod'
                    description: The methods this account can use now, in the order to offer them. Empty means none can.

        ReauthMethodsEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/ReauthMethods'

        PasswordCheckRequest:
            type: object
            additionalProperties: false
            required: [password]
            properties:
                password:
                    type: string
                    maxLength: 128
                    minLength: 1
                    description: A CANDIDATE password, not `PasswordNew` — this runs while someone is still typing, so it accepts anything non-empty rather than the contract's own composition rule.

        PasswordCheck:
            type: object
            additionalProperties: false
            required: [breached]
            properties:
                breached:
                    type: boolean
                    description: >-
                        Whether the candidate matches a known-breached password — the bundled list
                        or, when enabled, the HIBP range lookup. Advisory: the four password-SET
                        paths are the actual gate, not this field.
                count:
                    type: integer
                    minimum: 0
                    description: >-
                        How many times HIBP has seen this exact password. Present only when HIBP
                        is what caught it — never for a bundled-list hit, and never when rung 2 is
                        disabled or unreachable.

        PasswordCheckEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/PasswordCheck'

        VerifyEmailConfirmRequest:
            type: object
            additionalProperties: false
            required: [token]
            properties:
                token:
                    type: string
                    maxLength: 128
                    minLength: 1
                    description: One-time email verification token (NOT a JWT).

        # One live refresh token, presented as a session. The token VALUE is never exposed —
        # a live refresh token is as good as a password — so the subdocument id is the handle
        # revocation takes.
        Session:
            type: object
            additionalProperties: false
            required: [id, current]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                expiration:
                    type: string
                    format: date-time
                    description: Absent on a token issued without an expiry tier.
                lastUsedAt:
                    type: string
                    format: date-time
                    description: >-
                        When this session last made a request. Absent until it makes one, which is
                        what makes an idle session visible as idle in the list.
                current:
                    type: boolean
                    description: >-
                        Whether this session is the one making the request, matched through the
                        refresh cookie. Always `false` for a caller authenticating by bearer
                        token alone — an access token does not identify a session.

        SessionsResponse:
            type: object
            additionalProperties: false
            required: [sessions]
            properties:
                sessions:
                    type: array
                    items:
                        $ref: '#/components/schemas/Session'

        SessionsEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/SessionsResponse'

    parameters:
        # ---------- account — the parameters only this module's paths reference. ----------
        ReauthMethodPath:
            name: method
            in: path
            required: true
            schema:
                type: string
                enum: [email]
            description: A re-authentication method that delivers a code — a `method` from `GET /account/reauth` other than `password`.

        TwoFactorMethodPath:
            name: method
            in: path
            required: true
            schema:
                type: string
                maxLength: 32
            description: 'Wire name of a second factor — a `method` from `GET /account/2fa`. A bare string, not an enum: the set of methods is a deployment fact, and a contract that enumerated them would need regenerating to add a channel.'