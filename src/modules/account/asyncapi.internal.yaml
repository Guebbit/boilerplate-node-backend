# The account module's OWN queue — private, like `webhooks/asyncapi.internal.yaml`. Merged only into
# `asyncapi.yaml`, never `asyncapi.public.yaml`: a `backend`-only section, so the paired frontend
# never sees it.
#
# A fragment, not a complete document on its own: it declares no `asyncapi`/`info`/`servers`, and is
# left out of `lint:asyncapi:modules`'s glob for that reason. Its channel binds to `rabbitmqLocal`,
# which `shared/contracts/asyncapi.workers.yaml` already declares. Validated as part of the BUNDLED
# output (`npm run lint:asyncapi`).
channels:
    worker.account.export:
        address: worker.account.export
        description: >-
            Personal-data export job queue — `POST /account/export` enqueues one message per request,
            the account module's consumer builds the file.
        servers:
            - $ref: '#/servers/rabbitmqLocal'
        messages:
            AccountExportJobMessage:
                $ref: '#/components/messages/AccountExportJobMessage'
operations:
    workerAccountExportPublish:
        action: receive
        channel:
            $ref: '#/channels/worker.account.export'
        summary: Enqueue one account's export build.
        description: >-
            One live export per account, so at most one job per account is outstanding. The job
            carries the subject the request saw, so the file answers exactly what the caller was
            entitled to when they asked.
        messages:
            - $ref: '#/channels/worker.account.export/messages/AccountExportJobMessage'
    workerAccountExportConsume:
        action: send
        channel:
            $ref: '#/channels/worker.account.export'
        summary: The worker collects every section, writes the file, and mails the link.
        description: >-
            Sections are collected one at a time and written to the private export store, so peak
            memory is one section, not the whole export. A failure marks the record `failed`; a
            record still `building` past the job's time limit counts as `failed` too.
        messages:
            - $ref: '#/channels/worker.account.export/messages/AccountExportJobMessage'
components:
    messages:
        AccountExportJobMessage:
            name: AccountExportJobMessage
            title: Account export job
            payload:
                $ref: '#/components/schemas/AccountExportJobPayload'
    schemas:
        AccountExportJobPayload:
            type: object
            required:
                - exportId
                - userId
                - email
                - emailVerified
                - locale
            properties:
                exportId:
                    type: string
                    description: >-
                        The `accountexports` row this job fills in — created `building` before the
                        job is published, so a lost message still leaves a queryable trace (Claim
                        Check, EIP: the row is the source of truth for the rest).
                userId:
                    type: string
                    description: The account the export is about.
                email:
                    type: string
                    description: >-
                        The address the request saw. The mailbox the link goes to, and the key the
                        `feedback` section matches by.
                emailVerified:
                    type: boolean
                    description: >-
                        Whether the account had proved `email` when it asked. A section that matches
                        by address answers only when this is true (GDPR Art. 12(6)).
                locale:
                    type: string
                    description: The language the mail is written in.
            additionalProperties: false
