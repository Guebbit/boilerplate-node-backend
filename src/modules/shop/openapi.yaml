openapi: 3.1.0
info:
    title: shop — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Shop
      x-family: Running the shop
      description: The shop itself — who it is, where it ships, and what it trades in.

paths:
    /shop:
        get:
            x-cache: "max-age: 60"
            tags: [Shop]
            summary: The shop's commerce settings (currency, ship-to countries, return address)
            description: >-
                The shop's commerce settings: the one currency every price is quoted in, the countries
                the shop ships to, where returned goods go, who pays the postage and the backorder
                promise in days. The shop's time zone (an IANA name) is published so a screen can name
                the calendar a promised day belongs to. Who runs the site (the legal identity) and the
                Terms version are on `GET /config`. Public and cheap to read; it never changes without a
                redeploy. Not published: the bank-transfer details, which travel on each order.
            operationId: getShop
            security: []
            responses:
                '200':
                    description: The shop
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Shop'

components:
    schemas:
        # ---------- shop — the schemas only this module's paths reference. ----------
        ReturnPostagePayer:
            type: string
            enum: [consumer, shop]
            description: >-
                Who pays to send returned goods back: the customer, or the shop. The shop's setting is
                `NODE_RETURN_POSTAGE_PAYER`; a return freezes the value it was opened under.

        ShopAddress:
            type: object
            additionalProperties: false
            required: [street, city, zip, country]
            description: >-
                Where returned goods are sent: the configured return address
                (`NODE_RETURN_ADDRESS_*`), or the operator's postal address when none is fully set.
            properties:
                name:
                    type: string
                    description: Who the parcel is addressed to.
                street:
                    type: string
                city:
                    type: string
                zip:
                    type: string
                country:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CountryCode'

        Shop:
            type: object
            additionalProperties: false
            required:
                [
                    currency,
                    minorUnits,
                    shipToCountries,
                    returnAddress,
                    returnPostagePayer,
                    backorderPromiseDays,
                    timeZone
                ]
            properties:
                currency:
                    allOf: [{ $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CurrencyCode' }]
                    description: ISO-4217 currency code (e.g. EUR) — the shop's one currency, the same one `Product.currency` reports.
                minorUnits:
                    type: integer
                    minimum: 0
                    maximum: 4
                    description: >-
                        How many decimal places `currency` has (ISO 4217's "minor unit": EUR 2, JPY 0, KWD 3).
                        A client building a price input reads it here; an amount it receives already carries
                        its own places.
                shipToCountries:
                    type: array
                    items:
                        $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CountryCode'
                    description: >-
                        Every country this deployment ships a physical order to
                        (`NODE_SHIP_TO_COUNTRIES`) — checkout refuses a method that
                        `requiresAddress` once the resolved address falls outside it.
                returnAddress:
                    $ref: '#/components/schemas/ShopAddress'
                returnPostagePayer:
                    $ref: '#/components/schemas/ReturnPostagePayer'
                backorderPromiseDays:
                    type: integer
                    minimum: 1
                    description: >-
                        Days a buyer is promised when a backorder names no restock date: "ships
                        within N days". A legal value the server fixes (CRD Art. 18(1)), not a setting.
                timeZone:
                    type: string
                    description: >-
                        The shop's calendar, a canonical IANA zone name such as `Europe/Rome`. The promised
                        days (`releaseDate`, `restockDate`, `agreedAt`, `expectedAt`) are days on this
                        calendar; they are sent and answered as plain days, so a screen never converts them.

