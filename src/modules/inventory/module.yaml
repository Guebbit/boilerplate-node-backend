summary: 'The only writer of stock in the application.'
subdomain: supporting
group: shop
dependsOn:
    - products # a shortfall's title, and syncing the catalogue's read-only stock cache
jobs:
    sweepReservations:
        name: sweep:reservations
        # Every 5 minutes, well inside the card window and the 168-hour bank-transfer one.
        schedule: '*/5 * * * *'
        summary: Drains every stale checkout hold (batches of 200) and cancels the order behind each.
