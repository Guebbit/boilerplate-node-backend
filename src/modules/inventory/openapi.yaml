openapi: 3.1.0
info:
    title: inventory — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Inventory
      x-family: Catalogue
      description: Stock counters and the holds placed against them.

x-error-codes:
    INVENTORY_BELOW_RESERVED: { status: 409, description: 'The requested on-hand count is below what is already reserved by open orders.' }

paths:
    /inventory/levels:
        get:
            tags: [Inventory]
            summary: Stock levels
            description: The stock board — every product with its three counters and the availability derived from them. Admin (`read:StockLevel`), the raw counts. A customer sees `availability`, `availabilityDate` and `quantityAvailable` from `GET /products/{id}/availability`, never `onHand` or `reserved`. Answers the question a catalogue listing cannot, which is WHY something is unbuyable — nothing on the shelf, or everything on it already spoken for.
            operationId: listInventoryLevels
            security:
                - bearerAuth: ['read:StockLevel']
                - apiKeyAuth: ['read:StockLevel']
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: lowOnly
                  in: query
                  required: false
                  schema:
                      type: boolean
                      default: false
                  description: Only products at or under the deployment's low-availability threshold.
            responses:
                '200':
                    description: A page of levels, most scarce first (a queue, so no `sort`)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryLevelsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /inventory/preorders:
        get:
            tags: [Inventory]
            summary: Preorder allowances
            description: |
                Every product with a preorder allowance or an outstanding preorder, for the admin's preorder board: the cap, what is outstanding against it and how that splits between orders still unpaid and orders already paid. `backordered` is OUTSTANDING units, not units ever sold: it falls when stock arrives and is allocated, and when an order is canceled or expires. `ordered` is the lifetime count, read off the ledger.

                The release date and the title come from the catalogue. Never public: exact counts are what a competitor wants.
            operationId: listPreorderLevels
            security:
                - bearerAuth: ['read:StockLevel']
                - apiKeyAuth: ['read:StockLevel']
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
            responses:
                '200':
                    description: A page of preorder allowances, the most outstanding first (a queue, so no `sort`)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PreorderLevelsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /inventory/levels/{productId}:
        get:
            tags: [Inventory]
            summary: Get one product's stock level
            description: One row of the stock board by product, with its raw counters and the `available` derived from them — the record `receive`, `adjust` and the `PATCH` act on. Same audience as the board (`read:StockLevel`). An unknown product, one with no level row and a malformed id are the same 404.
            operationId: getInventoryLevel
            security:
                - bearerAuth: ['read:StockLevel']
                - apiKeyAuth: ['read:StockLevel']
            parameters:
                - name: productId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
            responses:
                '200':
                    description: The level
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryLevel'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
        patch:
            tags: [Inventory]
            summary: Edit a product's stock level
            description: |
                Merges the given fields into the level (RFC 7396). Only the preorder limit is editable; the counters move through `receive` and `adjust`. `backorderLimit` is how many units of the product may be backordered at once: the allowance an order claims when it is placed. `0` closes it; `null` removes the cap, so the shop keeps selling whatever the date promises. Lowering it below what is already outstanding is allowed and leaves those orders alone; only new ones are refused. A body that names no field changes nothing and answers the level as it is. Absolute and idempotent, so a retry is safe.

                Not a stock movement: nothing on the shelf changes, so it leaves no ledger row (it is audited). Needs `update:StockLevel`.
            operationId: updateInventoryLevel
            security:
                - bearerAuth: ['update:StockLevel']
                - apiKeyAuth: ['update:StockLevel']
            parameters:
                - name: productId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateInventoryLevelRequest'
                    application/merge-patch+json:
                        schema:
                            $ref: '#/components/schemas/UpdateInventoryLevelRequest'
            responses:
                '200':
                    description: The level after the change
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryLevel'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /inventory/movements:
        get:
            tags: [Inventory]
            summary: List stock movements
            description: A page of the ledger, newest first — one row per counter change, with every counter delta and the reason attached. Every row was written by the same call that moved the counter, so the ledger cannot have gaps. Paged rather than capped, and `meta.totalItems` counts everything matching the filters — this is the record an audit works through, and a read that returned only the newest rows would misreport history as complete.
            operationId: listStockMovements
            security:
                - bearerAuth: ['read:StockLevel']
                - apiKeyAuth: ['read:StockLevel']
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: productId
                  in: query
                  required: false
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: Narrow to one product's movements
                - name: reason
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/StockMovementReason'
                  description: Narrow to one kind of transition
            responses:
                '200':
                    description: The latest movements, newest first (a log, so no `sort`)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StockMovementsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /inventory/levels/{productId}/receive:
        post:
            tags: [Inventory]
            summary: Receive stock
            description: Units arrive from a supplier — `onHand` rises, `reserved` does not, so the delivery becomes available immediately. The only transition that can create units, and the reason a shop that has sold out can sell again. Requires an `Idempotency-Key` header — a retried receipt with the same key replays the first answer instead of counting the delivery twice, and a request without it answers 400 `IDEMPOTENCY_KEY_REQUIRED`. If the first attempt never reported an outcome, the same key answers 409 `IDEMPOTENCY_OUTCOME_UNKNOWN` and runs nothing; read the stock level back before receiving again with a new key.
            operationId: receiveStock
            x-error-codes:
                '400': [IDEMPOTENCY_KEY_REQUIRED]
                '409': [IDEMPOTENCY_IN_FLIGHT, IDEMPOTENCY_OUTCOME_UNKNOWN]
                '422': [IDEMPOTENCY_KEY_MISMATCH]
            security:
                - bearerAuth: ['create:StockMovement']
                - apiKeyAuth: ['create:StockMovement']
            parameters:
                - name: productId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: The product whose counter moves.
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/RequiredIdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReceiptRequest'
            responses:
                '200':
                    description: The counters after the delivery landed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryLevel'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # An `Idempotency-Key` still being processed by another in-flight request.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /inventory/levels/{productId}/adjust:
        post:
            tags: [Inventory]
            summary: Adjust stock
            description: A stocktake correction — signed, because shrinkage is the common case and it is negative. Refuses to take `onHand` below what is already reserved, because those units are promised to orders that exist — the fix for finding fewer units than were sold is to cancel orders, not to make availability negative. Requires an `Idempotency-Key` header — a retried correction with the same key replays the first answer instead of applying the delta twice, and a request without it answers 400 `IDEMPOTENCY_KEY_REQUIRED`. If the first attempt never reported an outcome, the same key answers 409 `IDEMPOTENCY_OUTCOME_UNKNOWN` and runs nothing; read the stock level back before adjusting again with a new key.
            operationId: adjustStock
            x-error-codes:
                '400': [IDEMPOTENCY_KEY_REQUIRED]
                '409': [IDEMPOTENCY_IN_FLIGHT, IDEMPOTENCY_OUTCOME_UNKNOWN, INVENTORY_BELOW_RESERVED]
                '422': [IDEMPOTENCY_KEY_MISMATCH]
            security:
                - bearerAuth: ['create:StockMovement']
                - apiKeyAuth: ['create:StockMovement']
            parameters:
                - name: productId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: The product whose counter moves.
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/RequiredIdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AdjustmentRequest'
            responses:
                '200':
                    description: The counters after the correction
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryLevel'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409':
                    description: The correction would leave fewer units than are already reserved
                    headers:
                        Cache-Control:
                            $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/CacheControlNoStore'
                    content:
                        application/problem+json:
                            schema:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Problem'
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /inventory/reservations/sweep:
        post:
            tags: [Inventory]
            summary: Expire stale reservations
            description: |
                Releases every hold whose window has closed and announces each one, so the orders behind them get canceled.

                A job behind an admin endpoint rather than an internal schedule. The application ships no scheduler, so the tick is driven from outside — a cron entry, the platform's scheduled job, or an operator. Idempotent; running it twice releases nothing the first run already released.
            operationId: sweepReservations
            security:
                - bearerAuth: ['sweep:StockLevel']
                - apiKeyAuth: ['sweep:StockLevel']
            responses:
                '200':
                    description: How many holds were expired
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReservationSweepResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }

    /products/availability:
        # Inventory's second mount, under the catalogue's URL. It must be answered before products'
        # `/{id}`, which would read the word `availability` as an id (see src/modules.ts).
        get:
            x-cache: revalidate
            tags: [Inventory]
            summary: Availability of many products
            description: |
                What a shopper is told about each product's stock, in Google Merchant's words: `availability` and, for a preorder or a backorder, the day it ships. One call for a catalogue page, a cart or a wishlist, at most 100 ids (a 101st is a 422).

                A product the caller may not see, or that does not exist, is left out of `items`: the answer for the rest is still good, which is why this is not the strict 404 of Google AIP-231. The same product reads the same to every caller who may see it; staff see hidden products here, a guest does not.

                The answer is kept for a minute and cleared by every stock move and every edit to the product's sale settings. A browser keeps nothing without asking: `Cache-Control: public, no-cache`, then a `304` while the ETag still matches.
            operationId: listProductAvailability
            security:
                - {}
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdParam'
            responses:
                '200':
                    description: The availability of every product asked for that the caller may see, in no particular order
                    headers:
                        Cache-Control:
                            description: '`public, no-cache`: a browser re-checks every time.'
                            schema: { type: string }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductAvailabilityResponse'
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /products/{id}/availability:
        get:
            x-cache: revalidate
            tags: [Inventory]
            summary: Availability of one product
            description: |
                What a shopper is told about one product's stock: `availability` and, for a preorder or a backorder, the day it ships. An unknown product, a hidden one the caller may not see and a malformed id are the same 404, the rule of `GET /products/{id}`.

                `availability` is Google Merchant's: `in_stock`, `out_of_stock` (every case that cannot be ordered: sold out, not on sale, or a preorder whose allowance is full), `preorder` and `backorder`. `availabilityDate` is the release date of a preorder, or the restock date of a backorder (30 days from today when none is set).
            operationId: getProductAvailability
            security:
                - {}
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The product's availability
                    headers:
                        Cache-Control:
                            description: '`public, no-cache`: a browser re-checks every time.'
                            schema: { type: string }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductAvailability'
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }

components:
    schemas:
        # ── Inventory module ────────────────────────────────────────────────────
        # Owned by src/modules/inventory. This module is the ONLY writer of the three counters
        # `onHand`, `reserved` and `backordered`; the product answer carries none of them, so
        # they are read from `GET /inventory/levels/{productId}`.

        # Why the units moved. Each reason implies a fixed set of three deltas — see
        # `domain/transitions.ts`, which is the one place that mapping is written.
        StockMovementReason:
            type: string
            enum: [reserve, ship, release, expire, receive, adjust, restock, backorder, owed, allocate]
            description: |
                * `reserve` — an order claimed units. `reserved` up, `onHand` unchanged.
                * `ship` — the parcel left (or a digital order was fulfilled). Both down: the units are off the shelf.
                * `release` — the hold was given up (the order was canceled, paid or not). `reserved` down.
                * `expire` — the hold timed out unpaid. Same counters as `release`, different story.
                * `receive` — a supplier delivery. `onHand` up.
                * `adjust` — a stocktake correction, signed. `onHand` moves either way.
                * `restock` — returned goods were received back on the shelf. `onHand` up.
                * `backorder` — an order claimed units that do not exist yet. `backordered` up; the shelf is untouched.
                * `owed` — units a lost parcel's order is still owed that the shelf could not cover. `backordered` up, the shelf untouched, outside the preorder cap: the shop owes it, the allowance is for new sales.
                * `allocate` — stock arrived for a paid preorder. `backordered` down, `reserved` up: the claim is now a real hold. Written in the receipt's own transaction, oldest payment first.

                `release` and `expire` of a preorder claim give back the allowance (`backordered` down) instead of `reserved`.

        # One row of the ledger. Append-only: there is no update path, and a wrong row is
        # corrected by the next movement, the way accountants do it.
        StockMovement:
            type: object
            additionalProperties: false
            required: [id, productId, reason, onHandDelta, reservedDelta, backorderedDelta]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                reason:
                    $ref: '#/components/schemas/StockMovementReason'
                # Every delta on every row, all signed, any possibly zero. Recording each
                # counter's column rather than one number is what makes the ledger replayable: summing
                # each column over a product's rows reproduces the counter it describes, which
                # is asserted as a property in the module's tests.
                onHandDelta:
                    type: integer
                reservedDelta:
                    type: integer
                backorderedDelta:
                    type: integer
                reference:
                    type: string
                    description: The order the movement belongs to, when one does.
                note:
                    type: string
                    description: Why an adjustment was made — the operator's own words.
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        StockMovementsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/StockMovement'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        # One product's stock, as the admin board shows it. `available` is repeated from the
        # product rather than left to be computed by the client, for the same reason it is
        # derived server-side there: two subtractions in two codebases is one too many.
        Availability:
            type: string
            enum: [in_stock, out_of_stock, preorder, backorder]
            description: |
                Google Merchant's `availability`: whether the item can be ordered now.
                * `in_stock` — there are units to sell.
                * `out_of_stock` — it cannot be ordered: sold out, not on sale, or a preorder whose allowance is full.
                * `preorder` — it ships from its release date and can be ordered now.
                * `backorder` — the shelf is empty but it can be ordered and ships when stock returns.

        ProductAvailability:
            type: object
            additionalProperties: false
            required: [productId, availability]
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                availability:
                    $ref: '#/components/schemas/Availability'
                availabilityDate:
                    type: string
                    format: date
                    description: Google's `availability_date`, a calendar day in the shop's time zone. Present only with `preorder` (the release date) and `backorder` (the restock date, or 30 days from today when none is set).
                quantityAvailable:
                    type: integer
                    minimum: 0
                    description: |
                        How many units can be bought now (Shopify's `quantityAvailable`). The shelf, plus the room left under the backorder cap for a product open to backorder; only the room left for a preorder. `0` exactly when `availability` is `out_of_stock`, which includes a product that is not on sale. Absent means no limit (a backorder with no cap).
                        The raw `onHand` and `reserved` stay behind `read:StockLevel`.

        ProductAvailabilityResponse:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProductAvailability'

        InventoryLevel:
            type: object
            additionalProperties: false
            required: [productId, title, onHand, reserved, available, backordered]
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                title:
                    type: string
                    description: Carried so the board reads as a list of products rather than of ids.
                onHand:
                    type: integer
                    minimum: 0
                reserved:
                    type: integer
                    minimum: 0
                available:
                    type: integer
                    minimum: 0
                backorderLimit:
                    type: integer
                    minimum: 0
                    description: How many units may be backordered at once. `0` means it is closed; absent means there is no cap.
                backordered:
                    type: integer
                    minimum: 0
                    description: Preorder units outstanding against the limit, paid or not, until stock arrives and is allocated to them.

        InventoryLevelsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/InventoryLevel'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        ReceiptRequest:
            type: object
            additionalProperties: false
            required: [quantity]
            properties:
                quantity:
                    type: integer
                    minimum: 1
                    description: How many units arrived. Strictly positive — a delivery that removes units is an adjustment.
                note:
                    type: string
                    maxLength: 1000
                    minLength: 1
                    description: Optional — the supplier, the delivery note number, whatever the operator wants on the row.

        AdjustmentRequest:
            type: object
            additionalProperties: false
            required: [delta]
            properties:
                # Signed and non-zero. There is no `quantity` + `direction` pair here on
                # purpose: two fields that must agree are two fields that can disagree, and the
                # ledger stores a signed delta anyway.
                delta:
                    type: integer
                    description: Signed and non-zero (0 is a 422 naming `delta`). Negative is shrinkage or damage; positive is a miscount found in your favour.
                note:
                    type: string
                    maxLength: 1000
                    minLength: 1
                    description: Why. An unexplained correction is the thing an audit is looking for.

        ReservationSweepResponse:
            type: object
            additionalProperties: false
            required: [expired]
            properties:
                expired:
                    type: integer
                    minimum: 0
                    description: How many holds this run released.

        PreorderLevel:
            type: object
            additionalProperties: false
            required: [productId, title, backordered, held, paid, ordered]
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                title:
                    type: string
                releaseDate:
                    $ref: '../products/openapi.yaml#/components/schemas/ReleaseDate'
                backorderLimit:
                    type: integer
                    minimum: 0
                    description: The cap on owed units. Absent means there is no cap.
                backordered:
                    type: integer
                    minimum: 0
                    description: Outstanding units, `held + paid`. Drops when stock is allocated, so it is not "units sold".
                held:
                    type: integer
                    minimum: 0
                    description: Outstanding units on orders still unpaid. They free themselves when the hold expires.
                paid:
                    type: integer
                    minimum: 0
                    description: Outstanding units on paid orders, waiting for stock oldest payment first.
                left:
                    type: integer
                    minimum: 0
                    description: '`backorderLimit - backordered`, never below zero: how many more may be ordered. Absent when there is no number to show: no cap (the row has no `backorderLimit` either), or the product is neither a preorder nor open to backorder, so its cap promises nothing.'
                ordered:
                    type: integer
                    minimum: 0
                    description: Lifetime units claimed through `backorder` movements in the ledger, given back or not.

        PreorderLevelsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/PreorderLevel'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        UpdateInventoryLevelRequest:
            type: object
            additionalProperties: false
            properties:
                backorderLimit:
                    type: [integer, 'null']
                    minimum: 0
