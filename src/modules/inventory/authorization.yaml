rules:
    # -- inventory -----------------------------------------------------------------------------
    - action: read
      subject: StockLevel
      module: inventory
      scope: tenant
      description: Read stock levels and the movements behind them.
    - action: create
      subject: StockMovement
      module: inventory
      scope: tenant
      description: Record a receipt or an adjustment. Stock never moves without one.
    - action: update
      subject: StockLevel
      module: inventory
      scope: tenant
      description: Edit a product's stock level, i.e. set its preorder limit. The counters move only through stock movements.
    # Not a CRUD verb — see `actions:` above. Guards the one route that clears expired reservation
    # holds on a schedule; granted to no preset role but `admin`, who holds it by name like every
    # other key. See `inventory/routes.ts`.
    - action: sweep
      subject: StockLevel
      module: inventory
      scope: tenant
      description: Clear expired reservation holds. The expiry tick, not a role's own tool.

sets:
    - name: InventoryDisplay
      module: inventory
      description: Read stock levels and the movements behind them.
      rules:
          - read:StockLevel
    - name: InventoryManagement
      module: inventory
      description: Record a receipt or an adjustment, or set a product's preorder limit.
      rules:
          - create:StockMovement
          - update:StockLevel
    - name: InventorySweep
      module: inventory
      description: Clear expired reservation holds.
      rules:
          - sweep:StockLevel
