    /wishlist:
        get:
            tags: [Wishlist]
            summary: Get wishlist
            description: Returns the authenticated user's saved products — ids only, like the cart's lines; clients render them from their own product store. Absence and emptiness are the same state, so this never answers 404.
            operationId: getWishlist
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Saved products
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WishlistResponseEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '500': { $ref: '#/components/responses/InternalError' }
        post:
            tags: [Wishlist]
            summary: Save a product
            description: Adds a product to the authenticated user's wishlist. Idempotent — saving what is already saved answers the same 200, because a double-clicked heart icon is not an error. The product must be publicly visible; a hidden or soft-deleted product answers 404 exactly as it would from the catalogue.
            operationId: addWishlistItem
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddWishlistItemRequest'
            responses:
                '200':
                    description: The updated wishlist
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WishlistResponseEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                # Well-formed product id that matches no publicly visible product.
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    /wishlist/{productId}:
        delete:
            tags: [Wishlist]
            summary: Remove a saved product
            description: Removes the line for the product identified by `{productId}` from the authenticated user's wishlist. A line the caller does not hold is a 404 — the client's view is stale and it needs to know.
            operationId: removeWishlistItem
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/ProductIdPathParam'
            responses:
                '200':
                    description: The updated wishlist
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WishlistResponseEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    /wishlist/{productId}/move-to-cart:
        post:
            tags: [Wishlist]
            summary: Move a saved product into the cart
            description: The wishlist's exit — the saved line becomes one cart line (quantity 1, incremented if the cart already holds the product) and leaves the wishlist. The cart is written before the wishlist line is removed, so a failure part-way leaves the product SAVED rather than lost. Returns the updated wishlist; read the cart for its own new state.
            operationId: moveWishlistItemToCart
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/ProductIdPathParam'
            responses:
                '200':
                    description: The updated wishlist
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WishlistResponseEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                # Not on the wishlist, or no longer purchasable — the cart's own validation
                # answers for the product the same way `POST /cart` would.
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }
