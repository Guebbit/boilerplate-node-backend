        # ---------- wishlist — the schemas only this module's paths reference. ----------
        # A line is a product reference and nothing else — no quantity, deliberately: a wishlist
        # answers "do I want this", not "how many". The moment an amount matters the line belongs
        # in the cart, which is what the move-to-cart operation is for.
        WishlistItem:
            type: object
            additionalProperties: false
            required: [productId]
            properties:
                productId:
                    $ref: '#/components/schemas/Id'

        WishlistResponse:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/WishlistItem'

        WishlistResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/WishlistResponse'

        AddWishlistItemRequest:
            type: object
            additionalProperties: false
            required: [productId]
            properties:
                productId:
                    $ref: '#/components/schemas/Id'
