openapi: 3.0.3
info:
    title: wishlist — module contract
    version: '0.1.0'

paths:
    /wishlist:
        get:
            tags: [Wishlist]
            summary: Get wishlist
            description: Returns the authenticated user's saved products — ids only, like the cart's lines; clients render them from their own product store. Absence and emptiness are the same state, so this never answers 404.
            operationId: getWishlist
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Saved products
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WishlistResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /wishlist/{productId}:
        put:
            tags: [Wishlist]
            summary: Save a product
            description: >-
                Saves the product identified by `{productId}` to the authenticated user's
                wishlist. "This product is saved" is a yes/no state on a URI, which is what PUT
                states — no body, and saving what is already saved answers the same 200 and fires
                nothing a second time (RFC 9110 §9.3.4), because a double-clicked heart icon is
                not an error. Pairs with the `DELETE` on the same URI (GitHub's
                `PUT`/`DELETE /user/starred/{owner}/{repo}` is the same pattern). The product must
                be publicly visible; a hidden or soft-deleted product answers 404 exactly as it
                would from the catalogue.
            operationId: addWishlistItem
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/ProductIdPathParam'
            responses:
                '200':
                    description: The updated wishlist
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WishlistResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # Well-formed product id that matches no publicly visible product.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        delete:
            tags: [Wishlist]
            summary: Remove a saved product
            description: Removes the line for the product identified by `{productId}` from the authenticated user's wishlist. A line the caller does not hold is a 404 — the client's view is stale and it needs to know.
            operationId: removeWishlistItem
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/ProductIdPathParam'
            responses:
                '200':
                    description: The updated wishlist
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WishlistResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /wishlist/{productId}/move-to-cart:
        post:
            tags: [Wishlist]
            summary: Move a saved product into the cart
            description: >-
                The wishlist's exit — the saved line becomes one cart line (quantity 1, incremented if the cart
                already holds the product) and leaves the wishlist. The cart is written before the wishlist line
                is removed, so a failure part-way leaves the product SAVED rather than lost. Needs a basket, so
                it is a shopper's step: staff and administrators are refused with `403`. Returns the updated
                wishlist; read the cart for its own new state.
            operationId: moveWishlistItemToCart
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/ProductIdPathParam'
            responses:
                '200':
                    description: The updated wishlist
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WishlistResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # The move writes a basket, and only shoppers hold a basket: staff and
                # administrators, who may still keep a wishlist, answer 403.
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # Not on the wishlist, or no longer publicly visible. The second of those is the
                # CART's answer, not this module's: a saved line outlives the catalogue, and
                # whether a product may be in a basket is decided once, where every caller of the
                # cart inherits it.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Also the cart's answer: the product's existing cart line is already at 999,
                # so adding this one more would pass it. `errors[].code` is `CART_QUANTITY_LIMIT`.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # ---------- wishlist — the schemas only this module's paths reference. ----------
        # A line is a product reference and nothing else — no quantity, deliberately: a wishlist
        # answers "do I want this", not "how many". The moment an amount matters the line belongs
        # in the cart, which is what the move-to-cart operation is for.
        WishlistItem:
            type: object
            additionalProperties: false
            required: [productId]
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        WishlistResponse:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/WishlistItem'

        WishlistResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/WishlistResponse'
