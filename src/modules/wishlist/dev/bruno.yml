            token: "{{token}}"
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        examples:
          - name: 200 Response
            description: Saved products
            request:
              url: "{{baseUrl}}/wishlist"
              method: GET
            response:
              status: 200
              statusText: OK
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "success": true,
                    "status": 200,
                    "message": "Saved products",
                    "data": {
                      "items": [
                        {
                          "productId": "65dc8a99604c307b702b5ccc"
                        }
                      ]
                    }
                  }
          - name: 401 Response
            description: Unauthorized
            request:
              url: "{{baseUrl}}/wishlist"
              method: GET
            response:
              status: 401
              statusText: Unauthorized
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "success": false,
                    "status": 401,
                    "message": "Unauthorized",
                    "errors": [
                      {
                        "code": "VALIDATION_ERROR",
                        "message": "Field \"email\" is required",
                        "details": "string"
