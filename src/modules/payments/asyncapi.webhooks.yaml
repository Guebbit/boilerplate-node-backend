# The payments module's webhook events: `payment.*`.
#
# A FRAGMENT, not a document: it refs `#/servers/subscriberEndpoint` and
# `#/components/schemas/WebhookHeaders`, which `webhooks/asyncapi.yaml` declares. The bundler
# merges it into the `webhooks` section only while that module exists
# (`scripts/contracts/asyncapi-webhook-events.ts`), and `GET /webhooks/events` lists it only while
# this module is registered. Delete the module and its events leave the contract with it.
# Each event is the Standard Webhooks envelope `{ type, timestamp, data }`; the module's
# `publicEvents` (`module.ts`) is what actually fires it.
channels:
    payment.succeeded:
        address: payment.succeeded
        description: A payment settled successfully.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentSucceededEvent:
                $ref: '#/components/messages/PaymentSucceededEvent'
    payment.failed:
        address: payment.failed
        description: A payment attempt was declined.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentFailedEvent:
                $ref: '#/components/messages/PaymentFailedEvent'
    payment.refunded:
        address: payment.refunded
        description: A refund on a payment settled — the whole payment, or a part of it.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentRefundedEvent:
                $ref: '#/components/messages/PaymentRefundedEvent'
    payment.refund_failed:
        address: payment.refund_failed
        description: The provider refused a refund, or reported one failed.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentRefundFailedEvent:
                $ref: '#/components/messages/PaymentRefundFailedEvent'
    payment.refund_reversed:
        address: payment.refund_reversed
        description: The provider took back a refund it had settled.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentRefundReversedEvent:
                $ref: '#/components/messages/PaymentRefundReversedEvent'
operations:
    webhookPaymentSucceeded:
        action: send
        channel:
            $ref: '#/channels/payment.succeeded'
        summary: A payment reached `succeeded`.
        description: One-to-one with the `payment.succeeded` domain event — see `payments/events.ts`.
        messages:
            - $ref: '#/channels/payment.succeeded/messages/PaymentSucceededEvent'
    webhookPaymentFailed:
        action: send
        channel:
            $ref: '#/channels/payment.failed'
        summary: A payment reached `declined`.
        description: >-
            One-to-one with the `payment.failed` domain event. Retryable with another method,
            so this can fire more than once for the same order.
        messages:
            - $ref: '#/channels/payment.failed/messages/PaymentFailedEvent'
    webhookPaymentRefunded:
        action: send
        channel:
            $ref: '#/channels/payment.refunded'
        summary: A refund on a payment settled.
        description: >-
            One-to-one with the `payment.refunded` domain event — see `payments/services/refunds.ts`'s
            `settleRefund`. Fired once per refund, whether an operator asked for it directly, a cancel
            opened it, or the refund retry sweep completed it; never fired while a hand-paid refund
            waits for an operator to confirm it by hand. It may fire again for the same `refundId`
            after a `payment.refund_reversed`, once the money is returned another way and an
            operator marks the refund returned. A refund made in the provider's own dashboard is
            imported and announced here too, with `reason: external`.
        messages:
            - $ref: '#/channels/payment.refunded/messages/PaymentRefundedEvent'
    webhookPaymentRefundFailed:
        action: send
        channel:
            $ref: '#/channels/payment.refund_failed'
        summary: The provider refused a refund, or reported one failed.
        description: >-
            One-to-one with the `payment.refund_failed` domain event. Fired once per NEW refusal of a
            refund record (the first, or a changed reason), not on every retry. `final` says the
            refusal ends the retrying and the money has to go back another way; `false` means the
            sweep retries it.
        messages:
            - $ref: '#/channels/payment.refund_failed/messages/PaymentRefundFailedEvent'
    webhookPaymentRefundReversed:
        action: send
        channel:
            $ref: '#/channels/payment.refund_reversed'
        summary: The provider took back a refund it had settled.
        description: >-
            One-to-one with the `payment.refund_reversed` domain event. The refund is owed again,
            another way; the credit note issued when it settled stays.
        messages:
            - $ref: '#/channels/payment.refund_reversed/messages/PaymentRefundReversedEvent'
components:
    messages:
        PaymentSucceededEvent:
            name: PaymentSucceededEvent
            title: Payment succeeded
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentSucceededEnvelope'
        PaymentFailedEvent:
            name: PaymentFailedEvent
            title: Payment failed
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentFailedEnvelope'
        PaymentRefundedEvent:
            name: PaymentRefundedEvent
            title: Payment refunded
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentRefundedEnvelope'
        PaymentRefundFailedEvent:
            name: PaymentRefundFailedEvent
            title: Payment refund failed
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentRefundFailedEnvelope'
        PaymentRefundReversedEvent:
            name: PaymentRefundReversedEvent
            title: Payment refund reversed
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentRefundReversedEnvelope'
    schemas:
        PaymentEventPayload:
            type: object
            required:
                - paymentId
                - orderId
            properties:
                paymentId:
                    type: string
                orderId:
                    type: string
            additionalProperties: false
        PaymentRefundedPayload:
            type: object
            required:
                - paymentId
                - orderId
                - refundId
                - amount
                - currency
            properties:
                paymentId:
                    type: string
                orderId:
                    type: string
                refundId:
                    type: string
                    description: >-
                        The refund record this delivery is about. A payment can be refunded in
                        parts, so one payment can raise this event more than once.
                amount:
                    type: number
                    description: This refund's amount, two decimal places — the payment's own `amount` for a full refund.
                currency:
                    type: string
                    description: ISO-4217, e.g. `EUR`.
            additionalProperties: false
        PaymentRefundReversedPayload:
            type: object
            required:
                - paymentId
                - orderId
                - refundId
                - amount
                - currency
                - failureReason
            properties:
                paymentId:
                    type: string
                orderId:
                    type: string
                refundId:
                    type: string
                amount:
                    type: number
                    description: This refund's amount, two decimal places.
                currency:
                    type: string
                    description: ISO-4217, e.g. `EUR`.
                failureReason:
                    type: string
                    description: >-
                        The closed code for why the provider took it back (`declined`,
                        `expired_or_canceled_card`, `lost_or_stolen_card`, …); never the provider's wording.
            additionalProperties: false
        PaymentRefundFailedPayload:
            type: object
            required:
                - paymentId
                - orderId
                - refundId
                - amount
                - currency
                - failureReason
                - final
            properties:
                paymentId:
                    type: string
                orderId:
                    type: string
                refundId:
                    type: string
                amount:
                    type: number
                    description: This refund's amount, two decimal places.
                currency:
                    type: string
                    description: ISO-4217, e.g. `EUR`.
                failureReason:
                    type: string
                    description: The closed code for the refusal; never the provider's wording.
                final:
                    type: boolean
                    description: >-
                        `true` when the refusal ends the retrying: the money has to go back another
                        way. `false` when the sweep retries it.
            additionalProperties: false
        PaymentSucceededEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: PaymentSucceededEventType
                    type: string
                    enum:
                        - payment.succeeded
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentEventPayload'
            additionalProperties: false
        PaymentFailedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: PaymentFailedEventType
                    type: string
                    enum:
                        - payment.failed
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentEventPayload'
            additionalProperties: false
        PaymentRefundedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: PaymentRefundedEventType
                    type: string
                    enum:
                        - payment.refunded
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentRefundedPayload'
            additionalProperties: false
        PaymentRefundFailedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: PaymentRefundFailedEventType
                    type: string
                    enum:
                        - payment.refund_failed
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentRefundFailedPayload'
            additionalProperties: false
        PaymentRefundReversedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: PaymentRefundReversedEventType
                    type: string
                    enum:
                        - payment.refund_reversed
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentRefundReversedPayload'
            additionalProperties: false
