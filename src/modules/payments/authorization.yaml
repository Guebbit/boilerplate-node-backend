rules:
    # -- payments ------------------------------------------------------------------------------
    - action: read
      subject: Payment
      module: payments
      scope: tenant
      description: Read the caller's own payments.
      conditions:
          userId: $caller.id
    - action: display
      subject: Payment
      module: payments
      scope: tenant
      description: Read every payment in the shop — the support desk helping with an order that is never their own, and the shop manager seeing the money behind the orders they handle.
    - action: create
      subject: Payment
      module: payments
      scope: tenant
      description: Record a payment that arrived outside the provider — cash, a transfer, by hand.
      # Money the shop is now on the hook to have actually received. Same tier as
      # create:Refund: the admin's word is the only proof, and a stolen access token proves
      # nothing about how recently its holder typed their password.
      stepUp: critical
    - action: create
      subject: Refund
      module: payments
      scope: tenant
      description: Return money to the payer — refund a payment, whole or in part.
      # Money leaving the shop. The one action here whose damage cannot be undone by another
      # request.
      stepUp: critical

sets:
    - name: PaymentOwn
      module: payments
      description: Read one's own payments.
      rules:
          - read:Payment
    - name: PaymentDisplay
      module: payments
      description: Read every payment in the shop.
      rules:
          - display:Payment
    - name: PaymentRecording
      module: payments
      description: Record a payment that arrived outside the provider.
      rules:
          - create:Payment
    - name: PaymentRefunding
      module: payments
      description: Return money to the payer.
      rules:
          - create:Refund
