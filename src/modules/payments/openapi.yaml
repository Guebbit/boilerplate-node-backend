openapi: 3.1.0
info:
    title: payments — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Payments
      description: Paying for an order - payment intents, confirmation, offline payments and refunds.

x-error-codes:
    PAYMENT_DECLINED: { status: 409, description: 'The card issuer or gateway declined the charge.' }
    PAYMENT_IN_FLIGHT: { status: 409, description: 'Another payment attempt for this order is already being recorded.' }
    PAYMENT_NOT_CONFIRMABLE: { status: 409, description: 'The payment is not in a state this confirmation can apply to.' }
    PAYMENT_NOT_REFUNDABLE: { status: 409, description: 'The payment is not in a state that can still be refunded, or nothing of it is left to refund.' }
    PAYMENT_DISPUTED: { status: 409, description: 'The buyer disputed the card payment (a chargeback is open), so the shop cannot refund it: the bank has taken the money back already and the answer goes to the provider as evidence.' }
    PAYMENT_REFUND_EXCEEDS_REMAINING: { status: 422, description: 'The refund asks for more than the payment still has left to give back.' }
    PAYMENT_ORDER_NOT_PAYABLE: { status: 409, description: 'The order is not in a state that can still accept a payment.' }
    PAYMENT_REFUND_NOT_OPEN: { status: 409, description: 'The refund was already settled (another operator confirmed it first).' }
    PAYMENT_REFUND_IN_FLIGHT: { status: 409, description: 'The card refund has no final answer yet (an attempt is running, or the provider did not say whether the money moved), so it cannot be marked returned by hand.' }
    PAYMENT_CARD_NOT_AVAILABLE: { status: 409, description: 'This deployment has no card payment provider, so a card payment cannot be started.' }

# This module's section of the account data export (`POST /account/export`): the bundler
# adds it to `AccountExportResponse`. Removing the module removes the section.
x-personal-data:
    payments:
        schema:
            type: array
            items:
                $ref: '#/components/schemas/ExportPayment'

paths:
    /payments/methods:
        get:
            tags: [Payments]
            summary: List payment methods
            description: Which methods this deployment offers, so the frontend hard-codes none. `card` is present only when a card payment provider is configured; `bank_transfer` only once its beneficiary and IBAN are configured. With neither the list is empty, and checkout is off until a method is configured. Public — like `GET /delivery/methods`, this is pre-purchase information.
            operationId: listPaymentMethods
            security: []
            responses:
                '200':
                    description: The methods
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentMethodsResponse'
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments:
        get:
            tags: [Payments]
            summary: List payments (staff)
            description: >-
                Every payment in the shop, newest first, for the staff Payments page. Needs
                `display:Payment`; the payer reads their own through `GET /payments/orders/{orderId}`.
                `displayStatus` filters by the label the page shows, and the server maps each label to
                the stored fields behind it. Each row carries its order's `orderNumber` and `email`,
                composed from `orders`. Each row carries `actions` for the caller, so a client never
                decides `refund` from the status; `actions.pay` is false on a list row (paying is the
                payer's own step, read on the order page). The provider references (`providerRef`, each
                refund's `providerRefundRef`) and a failed refund's `failureReason` are sent here and
                nowhere a payer reads.
            operationId: listPayments
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: sort
                  in: query
                  required: false
                  style: form
                  explode: false
                  schema:
                      $ref: '#/components/schemas/PaymentSort'
                - name: displayStatus
                  in: query
                  schema:
                      $ref: '#/components/schemas/PaymentDisplayStatus'
                - name: method
                  in: query
                  schema:
                      $ref: '#/components/schemas/PaymentMethodKind'
                - name: provider
                  in: query
                  schema:
                      type: string
                      maxLength: 64
                - name: createdFrom
                  in: query
                  schema: { type: string, format: date-time }
                - name: createdTo
                  in: query
                  schema: { type: string, format: date-time }
                - name: receivedFrom
                  in: query
                  description: Offline payments only — when the money arrived.
                  schema: { type: string, format: date-time }
                - name: receivedTo
                  in: query
                  schema: { type: string, format: date-time }
                - name: amountMin
                  in: query
                  schema: { type: number, format: double, minimum: 0 }
                - name: amountMax
                  in: query
                  schema: { type: number, format: double, minimum: 0 }
                - name: orderId
                  in: query
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                - name: disputed
                  in: query
                  description: >-
                      `true` keeps only payments with a dispute still open (an inquiry or a chargeback
                      the shop has not answered or the bank has not decided). `false` or absent is
                      no filter.
                  schema: { type: boolean }
                - name: reference
                  in: query
                  schema: { type: string, maxLength: 120 }
                - name: transferReference
                  in: query
                  description: >-
                      The RF creditor reference of a bank transfer, spaces and case tolerated exactly
                      as a customer might type it (`RF13 2EY8 H44V JAVZ KX80 JRL`). Matched in its
                      canonical form; a code that is not a valid RF reference finds nothing, so the
                      page is empty rather than an error and nothing says an almost-right code was
                      close. Answers with the payment, whose `orderId` is the order it pays.
                  schema: { type: string, maxLength: 64 }
            responses:
                '200':
                    description: Payments page
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        post:
            tags: [Payments]
            summary: Create a payment
            description: Freezes one of the caller's `pending` orders into a payment intent — the amount is taken from the order's own lines, so the intent cannot quote a different number than the order shows. Asking again refreshes the same intent (one payment per order is a database fact) and answers 200, so a retry needs no `Idempotency-Key` (a stored replay would hand back the first answer's `clientSecret` for as long as the ledger keeps it). The caller's intents and syncs share one budget per hour (429) — 201 says a payment was created, and a refresh created nothing (RFC 9110 §15.3.2). An order whose money already moved answers 409, and so does a deployment with no card payment provider (`PAYMENT_CARD_NOT_AVAILABLE`). The intent is the thing the card dialog confirms.
            operationId: createPayment
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreatePaymentRequest'
            responses:
                '201':
                    description: The payment intent, ready to confirm
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Payment'
                    links:
                        ConfirmPayment:
                            operationId: confirmPayment
                            parameters:
                                id: '$response.body#/id'
                '200':
                    description: The order already had an intent; it was refreshed and is ready to confirm
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Payment'
                    links:
                        ConfirmPayment:
                            operationId: confirmPayment
                            parameters:
                                id: '$response.body#/id'
                            description: The intent's id is confirmed here to complete the charge.
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Not `pending`, or already paid (`PAYMENT_ORDER_NOT_PAYABLE`), or no card provider
                # is configured (`PAYMENT_CARD_NOT_AVAILABLE`), or the provider opened a second
                # intent for a payment that already holds one (`PAYMENT_IN_FLIGHT`).
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `paymentIntentLimiter`, one budget per account shared with `POST /payments/{id}/sync`.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/search:
        post:
            tags: [Payments]
            summary: Search payments (staff, DTO-friendly)
            description: Same as `GET /payments`, with the filters in a JSON body.
            operationId: searchPayments
            x-alias-of: listPayments
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchPaymentsRequest'
            responses:
                '200':
                    description: Payments search results
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/refunds:
        get:
            tags: [Payments]
            summary: List refunds (staff)
            description: >-
                One row per refund across every payment, newest first, for the Refunds tab. Read
                only: a refund is opened and settled through `POST /payments/{id}/refunds`
                and the cancel path. Needs `display:Payment`.
            operationId: listRefunds
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: status
                  in: query
                  schema:
                      $ref: '#/components/schemas/RefundStatus'
                - name: reason
                  in: query
                  schema:
                      $ref: '#/components/schemas/RefundReason'
                - name: orderId
                  in: query
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                - name: createdFrom
                  in: query
                  schema: { type: string, format: date-time }
                - name: createdTo
                  in: query
                  schema: { type: string, format: date-time }
            responses:
                '200':
                    description: Refunds page, newest first (a log, so no `sort`)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RefundsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/attention:
        get:
            tags: [Payments]
            summary: Payments that need a person (staff)
            description: >-
                Only problems still recorded on a document, so a fixed one disappears: refunds
                open past `NODE_PAYMENT_ATTENTION_MINUTES` (`stale_refund`), card refunds the
                provider refused for good (`refused_refund`: shown at once, the money has to go back
                another way), and refunds owed by hand on a `manual` payment
                (`manual_refund_owed`: the sweep never finishes those, so they show at any age). A cancelled order's refund is one of them, because its
                record opens before the provider is asked. Oldest first, each source capped at
                100 rows. An amount mismatch is not here: it is an audit row
                (`payment.amount_mismatch`), not stored state. Needs `display:Payment`.
            operationId: listPaymentAttention
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: The rows
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentAttentionResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/{id}/refunds:
        post:
            tags: [Payments]
            summary: Refund a payment
            description: >-
                Returns money without touching the order's status — the operator action for a
                goodwill refund, and the second half of "cancel and refund" when a client sends both.
                Needs `create:Refund`. Refunding one's own order is allowed and the audit row
                is flagged `ownOrder`. Without a body it returns everything still refundable; with an `amount`
                it returns that part, and the payment stays `succeeded` until the parts add up to
                what was paid. Each call is one `Refund` record on the payment. Answers 201 with
                the new `Refund` record and its address in `Location`; read the payment again
                (`GET /payments/{id}`) for the running total. The reservation of the amount is conditional on the payment
                still having that much left, so a double submit cannot return the money twice — the
                second call answers 409 (nothing left to refund) or 422 (asks for more than is
                left). A refund still open counts against what is left, so a second partial refund
                beside it is allowed while money remains.

                The 201 is the answer for every outcome of the record the request wrote; its
                `status` carries the result. `succeeded`: the money is back. `failed`: the provider
                refused, the record is kept and counts against what is left, and it is either
                retried by the refund sweep or, when `actions.settleByHand` lists it, final and
                waiting for the money to be returned another way. `pending`: hand-paid money
                waiting for an operator. A refusal is never a 5xx. The reason of a refusal
                (`failureReason`) is sent to `display:Payment` callers only.

                On a hand-paid payment (cash, a transfer) the record is only OPENED: it stays
                `pending` and the payment's `actions.settleByHand` lists it, because nobody here
                can tell the money went back. `POST /payments/{id}/refunds/{refundId}/settle` is
                what confirms it.

                There is no list at this path: a payment's refunds are listed by `GET /payments/{id}`
                (`refunds`), and one by `GET /payments/{id}/refunds/{refundId}`.

                Requires an `Idempotency-Key` header: a retry that repeats the key replays the first
                answer instead of returning the money again, and a request without it answers 400
                `IDEMPOTENCY_KEY_REQUIRED`.
                Requires a session that has re-proved itself within the last few minutes — a
                valid-but-stale token answers 401 with `errors[].code` `REAUTH_REQUIRED`, and the
                caller re-authenticates and retries the same request.
            operationId: createRefund
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/RequiredIdempotencyKeyHeader'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RefundPaymentRequest'
            responses:
                '201':
                    description: The refund record this request wrote, whatever became of it (`succeeded`, `failed` with its reason, or `pending`). The payment stays `succeeded`; its `displayStatus` says how much of it went back
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Refund'
                # `IDEMPOTENCY_KEY_REQUIRED`: the `Idempotency-Key` header is missing.
                '400': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/BadRequest' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Nothing to return: the payment never succeeded, or all of it already went back
                # (`PAYMENT_NOT_REFUNDABLE`), a chargeback is open on it (`PAYMENT_DISPUTED`) — or
                # `Idempotency-Key` names a request still in flight.
                # A provider refusal is not here: it answers 201 with the failed record.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/{id}/refunds/{refundId}:
        get:
            tags: [Payments]
            summary: Get a refund
            description: >-
                One refund record of a payment, which is where `Location` points after
                `POST /payments/{id}/refunds`. Scoped like `GET /payments/{id}`: the payer's own, or
                any with `display:Payment`; another account's payment, or a record the payment does
                not hold, is the same 404. The provider's refund id and a failed refund's
                `failureReason` are sent to `display:Payment` callers only.
            operationId: getRefund
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - name: refundId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: The refund record
            responses:
                '200':
                    description: The refund
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Refund'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/{id}/refunds/{refundId}/settle:
        post:
            tags: [Payments]
            summary: Mark a hand-paid refund as returned
            description: >-
                An operator confirming that money was handed back outside the application (cash
                given back, a bank transfer sent). Nothing is sent anywhere: the refund record
                settles with `settledByHand`, `payment.refunded` fires as for any refund (the credit
                note is issued, a return waiting on it closes), and the audit row is
                `admin.payment.refund_settled_by_hand`. The refund is named by its own id, so one
                payment carrying several open refunds settles each separately.

                Which refunds may be settled: a hand-paid (`manual`) payment's `pending` refund; and
                a card refund the provider refused in a way that proves the money did not move
                (`RefundFailureReason`: `declined`, `insufficient_funds`,
                `expired_or_canceled_card`, `lost_or_stolen_card`, `provider_removed`). The
                payment's `actions.settleByHand` lists exactly these ids. A card refund that is
                `pending` (an attempt is running) or `failed` for an unclear reason
                (`provider_unavailable`, `unknown`) answers 409 `PAYMENT_REFUND_IN_FLIGHT`: the
                money may have moved, and the sweep settles it from the provider. A refund two
                operators settle at once settles once, and the loser answers 409
                `PAYMENT_REFUND_NOT_OPEN`. Needs `create:Refund`, which carries the same fresh-session
                requirement as the refund itself: a valid-but-stale token answers 401 with
                `errors[].code` `REAUTH_REQUIRED`. `Idempotency-Key` is optional.
            operationId: settleRefundByHand
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                  description: The payment carrying the refund
                - name: refundId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: The refund record to mark as returned
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            responses:
                '200':
                    description: >-
                        The refund as it now stands (`succeeded`, `settledByHand` set).
                        `GET /payments/{id}` for the totals and the actions.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Refund'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # The payment, or a refund with that id on it, does not exist.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Already settled (`PAYMENT_REFUND_NOT_OPEN`), a card refund with no final answer
                # (`PAYMENT_REFUND_IN_FLIGHT`), or `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/{id}/refunds/{refundId}/cancel:
        post:
            tags: [Payments]
            summary: Cancel a refund that must never be paid
            description: >-
                A local void for a refund the shop will not pay: a duplicate opened by mistake, or one
                the provider's dashboard already covered. The record goes `failed` with
                `failureReason: canceled` and the amount it held returns to what is refundable. Nothing
                is sent to the provider, no credit note is issued and the buyer is not mailed:
                the money never moved, so there is nothing to report. The sweep never sends a canceled
                refund. The note says why, and is kept in the audit row `admin.payment.refund_canceled`
                with the order's timeline row `refund_canceled` (staff only) and the
                `payment.refund_canceled` event.

                Which refunds may be canceled: exactly the ones `actions.cancelRefund` lists, the same
                set as `actions.settleByHand`: a hand-paid (`manual`) payment's `pending` refund, and a
                card refund the provider refused in a way that proves the money did not move
                (`RefundFailureReason`: `declined`, `insufficient_funds`, `expired_or_canceled_card`,
                `lost_or_stolen_card`, `provider_removed`). A `succeeded` refund, or one already
                canceled, answers 409 `PAYMENT_REFUND_NOT_OPEN`: the money moved, and cancelling it
                would falsify the books. A card refund that is `pending` (an attempt is running) or
                `failed` for an unclear reason (`provider_unavailable`, `unknown`) answers 409
                `PAYMENT_REFUND_IN_FLIGHT`: the money may have moved. Needs `create:Refund`, with the
                same fresh-session requirement as creating one: a valid-but-stale token answers 401
                with `errors[].code` `REAUTH_REQUIRED`. `Idempotency-Key` is optional.
            operationId: cancelRefund
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                  description: The payment carrying the refund
                - name: refundId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: The refund record to cancel
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancelRefundRequest'
            responses:
                '200':
                    description: >-
                        The refund as it now stands (`failed`, `failureReason: canceled`).
                        `GET /payments/{id}` for the totals and the actions.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Refund'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # The payment, or a refund with that id on it, does not exist.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Not open (`PAYMENT_REFUND_NOT_OPEN`), a card refund with no final answer
                # (`PAYMENT_REFUND_IN_FLIGHT`), or `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /orders/{id}/payments:
        get:
            tags: [Payments]
            summary: List the payments of an order
            description: >-
                The payment record of one of the caller's orders, so a reload mid-flow finds the intent
                and its status again. Unpaged: an order has one payment row, so `items` holds none or
                one, like `GET /orders/{id}/credit-notes`. No payment started yet is `{ "items": [] }`,
                not a 404: absence is an answer, and the client starts the flow with `POST /payments`.
                `404` only for an order the caller cannot see. A caller holding `display:Payment` reads
                anyone's.
            operationId: listOrderPayments
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                  description: The order
            responses:
                '200':
                    description: The order's payments
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderPaymentsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        post:
            tags: [Payments]
            summary: Record a payment on an order
            description: >-
                The payment is a child of the order: Solidus' `POST /api/orders/{number}/payments`. An admin recording money the card provider never saw — cash at the counter, a
                phone order paid by transfer, a bank transfer that landed. Recording one's own order is
                allowed and the audit row is flagged `ownOrder`. Writes the payment as
                `manual` and runs it through the same settlement `POST /payments/{id}/confirm`
                does: the order moves `pending → paid`, stock commits, and `ORDER_STATUS_CHANGED`
                and `PAYMENT_SUCCEEDED` fire as usual. The amount is always the order's own total —
                there is no partial or over-payment here, those are handled by hand, off-system.
                Answers 201 when the payment row is new, and 200 when it converted a row that
                already existed: a card intent nobody paid, or the open payment of a `bank_transfer`
                order (the very payment being recorded).

                A transfer that arrives after its order was cancelled is recorded too, onto the
                payment the cancel closed: the money is real, the order cannot be paid any more, so
                it answers 200 with the payment `succeeded` and a refund record left open (a hand-paid
                refund is returned by the operator, off-system, and then marked done).

                Requires a session that has re-proved itself within the last few minutes — a
                valid-but-stale token answers 401 with `errors[].code` `REAUTH_REQUIRED`, and the
                caller re-authenticates and retries the same request.
            operationId: recordOrderPayment
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                  description: The order the money arrived for. Must still be `pending`
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RecordOfflinePaymentRequest'
            responses:
                '201':
                    description: The payment, `succeeded`, with the order now `paid`
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Payment'
                '200':
                    description: The payment, `succeeded` — it converted the row of an unpaid card intent — with the order now `paid`
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Payment'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Order not pending (`PAYMENT_ORDER_NOT_PAYABLE`), a card charge already in flight
                # at the provider (`PAYMENT_IN_FLIGHT` — recording money too could charge twice),
                # or `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/{id}:
        get:
            tags: [Payments]
            summary: Get a payment
            description: One payment by its own id, which is where `Location` points after `POST /payments`. The payer reads their own; a caller holding `display:Payment` reads anyone's. Another account's payment is the same 404 as a missing one. The provider's `clientSecret` is never part of a read, only of the answer to `POST /payments`.
            operationId: getPayment
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The payment
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Payment'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/{id}/confirm:
        post:
            tags: [Payments]
            summary: Confirm a payment
            description: >-
                Attaches a payment method the browser tokenised and asks the provider to take the
                money. The answer is not always final: a card that needs a 3-D Secure challenge
                comes back `requires_action` and one that settles asynchronously `processing`, both
                as a 200 — the browser finishes the challenge against the provider and then calls
                `POST /payments/{id}/sync`. Only `succeeded` moves the order to `paid`, and the
                webhook remains the authority for that even when this endpoint saw it first. A
                decline answers 409 with `errors[].code` `PAYMENT_DECLINED` and is retryable —
                submit the same payment again with another method. Requires a session that has
                re-proved itself within the last few minutes — a valid-but-stale token answers 401
                with `errors[].code` `REAUTH_REQUIRED`, and the caller re-authenticates and retries
                the same request.
            operationId: confirmPayment
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ConfirmPaymentRequest'
            responses:
                '200':
                    description: >-
                        The payment as it now stands — `succeeded` with the order `paid`, or
                        `requires_action`/`processing` with the browser's next step still to come.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Payment'
                    links:
                        SyncPayment:
                            operationId: syncPayment
                            parameters:
                                id: '$response.body#/id'
                            description: An in-flight payment is resolved by re-reading the provider here.
                        RefundPayment:
                            operationId: createRefund
                            parameters:
                                orderId: '$response.body#/orderId'
                            description: A succeeded payment can be refunded without touching the order status.
                        CancelOrder:
                            operationId: cancelOrderById
                            parameters:
                                id: '$response.body#/orderId'
                            description: A paid order can still be cancelled, which refunds it too.
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # Also a missing or refused human-check token, after one decline.
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Declined by the card issuer (`PAYMENT_DECLINED`), not awaiting confirmation
                # (`PAYMENT_NOT_CONFIRMABLE`), the order slipped away between charge and
                # write (`PAYMENT_ORDER_NOT_PAYABLE` — the charge was refunded on the spot), or
                # `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `paymentConfirmAttemptLimiter` and `paymentConfirmDeclineLimiter` both sit in
                # front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/{id}/sync:
        post:
            tags: [Payments]
            summary: Re-read a payment from the provider and settle it
            description: >-
                The browser saying "I have finished at the provider". Re-reads the provider's own
                record and applies whatever it says, which is what makes the happy path feel
                synchronous while the webhook stays the source of truth. Idempotent and safe to
                call repeatedly: a payment already settled answers itself unchanged. Answers 409
                `PAYMENT_DECLINED` when the provider's answer is a refusal, exactly as the confirm
                does. Requires a session that has re-proved itself within the last few minutes — a
                valid-but-stale token answers 401 with `errors[].code` `REAUTH_REQUIRED`, and the
                caller re-authenticates and retries the same request.
            operationId: syncPayment
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The payment as the provider now reports it
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Payment'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Declined (`PAYMENT_DECLINED`), or the payment never reached the provider
                # (`PAYMENT_NOT_CONFIRMABLE`).
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                # `paymentIntentLimiter`, one budget per account shared with `POST /payments`.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/webhook/{provider}:
        post:
            tags: [Payments]
            summary: Provider webhook
            description: >-
                Where the provider says a payment changed — a thin event naming the intent. The
                server then asks the provider for the payment's state and settles that answer, so
                the authority is the provider's own, never the browser's and never this body's.
                **Not session-authenticated**: the caller is
                a machine with no account, and it authenticates by signing the raw body instead,
                which is stronger than any cookie this API could ask it for. A provider retrying for
                days settles once: the delivery is a pointer, the provider is re-read, and every
                write of the settlement is conditional.

                One endpoint per provider, named in the path and resolved from the registry of
                installed adapters, not from `NODE_PAYMENT_PROVIDER`: a provider that is no longer
                the one new checkouts use still delivers its in-flight payments' events, and each
                adapter verifies its own signature with its own secret.

                Answers 204 to anything it has authenticated, including events it does not act on
                and a delivery naming a payment another provider took (logged, left alone): a
                provider reads a non-2xx as a failure and retries harder. Answers 404 when no
                adapter is installed under that name, and 400 for a signature that does not verify
                or a body that is not an event. An unverifiable delivery is never acknowledged.
            operationId: receivePaymentWebhook
            security: []
            parameters:
                - name: provider
                  in: path
                  required: true
                  schema:
                      type: string
                      maxLength: 100
                  description: The name the payment provider adapter is registered under (for example `stripe`).
                - name: Payment-Signature
                  in: header
                  required: false
                  schema:
                      type: string
                      maxLength: 200
                  description: >-
                      The reference HMAC scheme (the fake provider's); a real adapter reads its own
                      provider's header instead (Stripe: `Stripe-Signature`), so this one is
                      documented as the reference and not required by the contract.
                      `t=<unix seconds>,v1=<hex hmac-sha256 of "<t>.<raw body>">`. `t` must be
                      within 300 seconds of the server's clock or the delivery is rejected as
                      stale, replay protection against a captured signature being resent later.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PaymentWebhookEvent'
            responses:
                '204':
                    description: Accepted — acted on, or knowingly ignored. No body.
                # The signature did not verify, is stale, or the body is not an event.
                '400': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/BadRequest' }
                # No adapter is installed under that provider name.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Keyed on the caller's address, not a signed identity — see
                # docs/tools/security.md#the-rate-limit-budgets.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # ── Payments module ─────────────────────────────────────────────────────
        # Owned by src/modules/payments. The Payment is the provider-facing record of an
        # order's money; the order's own status stays the customer-facing lifecycle.

        # What the buyer has to do for a waiting payment to move, keyed by `type` so a later kind of
        # wait (a redirect to a provider's page, say) is one more member and not a new field.
        PaymentNextAction:
            oneOf:
                - $ref: '#/components/schemas/PaymentBankTransferAction'
            discriminator:
                propertyName: type
                mapping:
                    bank_transfer: '#/components/schemas/PaymentBankTransferAction'

        # The instructions of a `bank_transfer` payment, shown while it is `requires_action`: the
        # beneficiary, IBAN and BIC are deployment config, read at the moment of the request and
        # never frozen on the payment; `reference` and `payBy` belong to this payment. The amount to
        # send is the payment's own `amount` and `currency`.
        PaymentBankTransferAction:
            type: object
            additionalProperties: false
            required: [type, beneficiary, iban, reference, payBy]
            properties:
                type:
                    type: string
                    enum: [bank_transfer]
                beneficiary:
                    type: string
                iban:
                    type: string
                    description: Grouped into blocks of four, the way a bank's own transfer form shows one.
                bic:
                    type: string
                    description: Absent when the deployment has not configured one.
                reference:
                    type: string
                    description: >-
                        The ISO 11649 "RF" creditor reference of this payment — what the buyer writes
                        into the transfer's description, so an operator can match the incoming money
                        back via `GET /payments?transferReference=`. A malformed or unmatched
                        reference finds nothing; a raw order id is not a reference.
                payBy:
                    type: string
                    format: date-time
                    description: When the order's stock hold ends. Past it, with no money received, the order is cancelled.

        OrderPaymentsResponse:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Payment'

        Payment:
            type: object
            additionalProperties: false
            required: [id, orderId, amount, currency, status, displayStatus, provider, method, amountRefunded, refunds, actions]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                # Absent once the account that made this payment has been erased.
                userId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                amount:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        The order's total as the intent froze it. Always two decimal places,
                        rounded half-up at the point of calculation. If the provider reports a success for
                        a different amount or currency, the payment reads `succeeded` with what
                        ARRIVED here, its order is cancelled and the money is returned.
                currency:
                    type: string
                    description: ISO-4217 currency code (e.g. EUR)
                amountRefunded:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        How much of `amount` has been asked back, pending and succeeded together —
                        the same reading as Stripe's `amount_refunded`. Counted when a refund is
                        opened, so two racing partial refunds cannot return more than was paid.
                refunds:
                    type: array
                    items:
                        $ref: '#/components/schemas/Refund'
                    description: One record per refund attempt, oldest first.
                status:
                    type: string
                    enum: [requires_confirmation, requires_action, processing, succeeded, declined, cancelled]
                    description: >-
                        The provider-facing lifecycle. A refunded payment, whole or in part, stays
                        `succeeded`: `displayStatus` and `amountRefunded` say how much went back.
                        `cancelled` means the order was cancelled and the provider confirmed the
                        intent closed; money that still arrives on it is settled and returned.
                        `requires_action` means the buyer has something to do: the bank wants a
                        challenge answered in the browser (3-D Secure), or a bank transfer is waiting to be
                        sent (`nextAction` says how) — and `processing` that the
                        provider has taken the payment but not settled it — both are in flight, and
                        `POST /payments/{id}/sync` is what resolves them without waiting for the
                        webhook. `declined` is retryable: the confirm endpoint accepts the same
                        payment again with another method. Full transition
                        table: docs/modules/payments.md#status-transitions
                displayStatus:
                    $ref: '#/components/schemas/PaymentDisplayStatus'
                # Present only while the payment is waiting on the buyer, and only for a kind of
                # wait this deployment can still serve.
                nextAction:
                    $ref: '#/components/schemas/PaymentNextAction'
                # Staff only (`display:Payment`): the handle that finds the payment at the provider.
                providerRef:
                    type: string
                    description: >-
                        The provider's own id for the payment intent (Stripe's `pi_…`). Sent only to
                        a caller holding `display:Payment`, so support can look the payment up at
                        the provider; never to the payer. Absent on a `manual` payment.
                # Only on the staff lists, composed from `orders`.
                orderNumber:
                    type: string
                    description: The order's number. Present on `GET /payments` rows only.
                email:
                    type: string
                    description: The order's customer email. Present on `GET /payments` rows only.
                provider:
                    type: string
                    description: >-
                        Which provider implementation handled it — the name the deployment registered
                        (`NODE_PAYMENT_PROVIDER`), or `manual` for a payment recorded by hand
                        (`POST /orders/{id}/payments`).
                method:
                    type: string
                    enum: [card, bank_transfer, cash, other]
                    description: >-
                        How the money moved. `card` for anything that went through the provider
                        port; the other three are set only by `POST
                        /payments/orders/{orderId}/offline`, from what the admin chose there.
                reference:
                    type: string
                    maxLength: 120
                    description: >-
                        Free text identifying an offline payment — a bank transaction id, a receipt
                        number. Set only by `POST /orders/{id}/payments`; absent from a
                        card payment.
                receivedAt:
                    type: string
                    format: date-time
                    description: >-
                        When the money actually arrived, as the admin recording it reported —
                        possibly earlier than `createdAt`. Set only by `POST
                        /payments/orders/{orderId}/offline`; absent from a card payment.
                clientSecret:
                    type: string
                    description: >-
                        Returned by `POST /payments` alone, never stored and never read
                        back: it authorises completing this payment against the provider from the
                        browser. Absent from every other response.
                cardLast4:
                    type: string
                    description: >-
                        The only card digits a payment system may remember. Survives a refund —
                        refunding does not clear it.
                # Staff only (`display:Payment`): a payer is not shown the shop's dispute file.
                disputes:
                    type: array
                    items:
                        $ref: '#/components/schemas/Dispute'
                    description: >-
                        Disputes the buyer's bank opened on this card payment, oldest first. Sent only
                        to a caller holding `display:Payment`. A payment with none omits the field. An
                        open chargeback blocks refunds (`actions.refund` is false and the refund door
                        answers 409 `PAYMENT_DISPUTED`); a lost one shrinks what is left to refund by
                        its amount. `displayStatus` does not change: a dispute is a separate fact.
                # Computed per CALLER, not stored — the same idea as `Order.actions`, for the half
                # of the question this module owns.
                actions:
                    $ref: '#/components/schemas/PaymentActions'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        Refund:
            type: object
            additionalProperties: false
            required: [id, amount, currency, status, reason, createdAt]
            description: >-
                One attempt to give money back — a record per attempt, not a field on the payment.
                The idempotency key is stored but never published. The provider's refund id and a
                failed refund's `failureReason` go to staff only (`display:Payment`); the
                provider's own error wording stays in the logs.
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                amount:
                    type: number
                    format: double
                    minimum: 0
                    description: The amount returned, in the payment's own `currency`.
                currency:
                    type: string
                    description: ISO-4217 currency code, copied from the payment.
                status:
                    allOf:
                        - $ref: '#/components/schemas/RefundStatus'
                    description: >-
                        `pending` while the provider is being asked (or, on a hand-paid payment,
                        until an operator reports the money back); `failed` when it refused — the
                        sweep retries it with the same idempotency key unless the refusal is final,
                        and an operator may report it returned by hand when the money provably did
                        not move (see `RefundFailureReason`); `succeeded` once the money is
                        confirmed back, or reported back by the operator. A `failed` refund with
                        `failureReason: canceled` was voided by staff and is closed for good.
                reason:
                    $ref: '#/components/schemas/RefundReason'
                # The return this refund pays for — present when `reason` is `return`, or `cancellation` of a remainder.
                returnId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                settledAt:
                    type: string
                    format: date-time
                    description: When the refund succeeded. Absent while it has not.
                settledByHand:
                    type: boolean
                    description: >-
                        `true` when an operator reported this refund's money returned outside the
                        application (`POST /payments/{id}/refunds/{refundId}/settle`): a hand-paid
                        payment's refund, or a card refund the provider refused. Per refund. Absent
                        otherwise.
                providerRefundRef:
                    type: string
                    description: The provider's id for the refund (Stripe's `re_…`). Staff only.
                failureReason:
                    $ref: '#/components/schemas/RefundFailureReason'
                owedAnotherWay:
                    type: boolean
                    description: >-
                        `true` while this refund is open and the money cannot go back to the card: the
                        provider refused it for good, or took it back after settling it. The buyer is
                        emailed to agree how they would like to receive it, at no cost to them (Consumer
                        Rights Directive Art. 13(1)), and the order page says so instead of "retried
                        automatically". Carries no reason: that stays staff-only. Absent otherwise.
                reversedAt:
                    type: string
                    format: date-time
                    description: >-
                        When the provider took this refund back (a bank sent the money back, or the
                        provider reported the refund failed). Set once; a reversed refund is `failed`
                        again, counts against what is left, and is owed another way: an operator
                        pays it and presses mark-returned (`actions.settleByHand`). The credit note
                        issued when it first settled stays. Absent otherwise.
                createdAt:
                    type: string
                    format: date-time

        # Stripe's `failure_reason` shape: a closed list, so the page can translate it.
        RefundFailureReason:
            type: string
            enum: [declined, insufficient_funds, expired_or_canceled_card, lost_or_stolen_card, provider_removed, provider_unavailable, unknown, canceled, disputed]
            description: >-
                Why the provider last refused a refund, as a closed code. Staff only
                (`display:Payment`). `unknown` is anything the provider's adapter did not
                classify; the raw wording stays in the logs.

                Money did NOT move for `declined`, `insufficient_funds`,
                `expired_or_canceled_card`, `lost_or_stolen_card` and `provider_removed` (the
                payment's provider is no longer installed, so nothing was asked): the refund may be
                marked returned by hand once the money went back another way. `declined`,
                `expired_or_canceled_card`, `lost_or_stolen_card` and `provider_removed` are final
                and are not retried; `insufficient_funds` (the shop's own provider balance is
                short) and the unclear `provider_unavailable` and `unknown` are retried with a
                growing delay. An unclear refusal may have gone through, so it is never offered for
                hand settlement.

                `disputed`: the buyer's bank took the money back in a dispute (chargeback). It is
                final like the refusals above, and it is not offered for hand settlement while the
                chargeback is open: the bank already returned the money. Once the chargeback is
                lost for an amount that covers the refund, the refund may be marked returned (the
                bank paid the buyer); once the dispute is decided in the shop's favour the refund
                may only be canceled.

                `canceled` is not a refusal: staff voided the refund
                (`POST /payments/{id}/refunds/{refundId}/cancel`). Nothing was sent, it is never
                retried and it can neither be settled by hand nor canceled again.

        DisputeKind:
            type: string
            enum: [inquiry, chargeback]
            description: >-
                `inquiry` — the bank asks for information before taking any money (Stripe's
                `warning_*` states); refunds stay allowed, and a full refund ends it. `chargeback` —
                the bank took the money back and the shop may send evidence.

        DisputeStatus:
            type: string
            enum: [needs_response, under_review, won, lost, accepted, closed]
            description: >-
                `needs_response` — waiting for the shop's evidence; `under_review` — evidence sent,
                the bank decides; `won` — decided for the shop (funds reinstated); `lost` — decided
                against it; `accepted` — the shop gave up and accepted the chargeback; `closed` — an
                inquiry that ended without a charge. `needs_response` and `under_review` are open.
                A closed dispute can still flip (a late win, a second chargeback).

        DisputeReason:
            type: string
            enum: [bank_cannot_process, check_returned, credit_not_processed, customer_initiated, debit_not_authorized, duplicate, fraudulent, general, incorrect_account_details, insufficient_funds, product_not_received, product_unacceptable, subscription_canceled, unrecognized]
            description: Why the buyer's bank says the charge is disputed — Stripe's closed list, which an adapter for another provider maps its own codes onto.

        DisputeReport:
            type: object
            additionalProperties: false
            required: [disputeRef, kind, status, reason, amount, currency, fundsWithdrawn, observedAt]
            description: >-
                One dispute as the provider reports it, inside a webhook delivery. It is not
                re-read: some providers cannot be asked about a dispute, so the body of a verified
                delivery is the state. A report is applied only if `observedAt` is newer than the one
                already stored for the same `disputeRef`, so an out-of-order delivery changes nothing.
            properties:
                disputeRef:
                    type: string
                    maxLength: 200
                    description: The provider's dispute id (Stripe's `dp_…`). One dispute per id on a payment.
                kind:
                    $ref: '#/components/schemas/DisputeKind'
                status:
                    $ref: '#/components/schemas/DisputeStatus'
                reason:
                    $ref: '#/components/schemas/DisputeReason'
                amount:
                    type: number
                    format: double
                    minimum: 0
                    description: The disputed amount, in `currency`.
                currency:
                    type: string
                    maxLength: 3
                    description: ISO-4217 code, upper case.
                evidenceDueBy:
                    type: string
                    format: date-time
                    description: When the provider stops accepting evidence. Absent when it gave no deadline.
                fundsWithdrawn:
                    type: boolean
                    description: Whether the bank has taken the money out of the shop's balance (`false` for an inquiry, and again after a win reinstated it).
                observedAt:
                    type: string
                    format: date-time
                    description: The provider's own time for this event, which orders deliveries.
                dashboardUrl:
                    type: string
                    maxLength: 500
                    description: Where staff answer the dispute, in the provider's dashboard.

        Dispute:
            type: object
            additionalProperties: false
            required: [disputeRef, kind, status, reason, amount, currency, fundsWithdrawn, openedAt, observedAt]
            description: >-
                A dispute on a payment, as the last delivery left it. Staff only. Answered in the
                provider's dashboard: this API shows it and alerts, it never sends evidence.
            properties:
                disputeRef:
                    type: string
                    description: The provider's dispute id.
                kind:
                    $ref: '#/components/schemas/DisputeKind'
                status:
                    $ref: '#/components/schemas/DisputeStatus'
                reason:
                    $ref: '#/components/schemas/DisputeReason'
                amount:
                    type: number
                    format: double
                    minimum: 0
                currency:
                    type: string
                evidenceDueBy:
                    type: string
                    format: date-time
                fundsWithdrawn:
                    type: boolean
                openedAt:
                    type: string
                    format: date-time
                    description: The provider's time of the first report of this dispute.
                closedAt:
                    type: string
                    format: date-time
                    description: When it last reached a closed status (`won`, `lost`, `accepted`, `closed`). Absent while open, and cleared if a closed one reopens.
                observedAt:
                    type: string
                    format: date-time
                    description: The provider's time of the newest report applied.
                dashboardUrl:
                    type: string

        CancelRefundRequest:
            type: object
            additionalProperties: false
            required: [note]
            properties:
                note:
                    type: string
                    minLength: 1
                    maxLength: 1000
                    description: >-
                        Why the refund is voided (who refunded it elsewhere and where, or that it was a
                        duplicate). Staff-only free text, kept in the audit row and nowhere the buyer
                        reads.

        RefundStatus:
            type: string
            enum: [pending, succeeded, failed]

        PaymentMethodKind:
            type: string
            enum: [card, bank_transfer, cash, other]

        PaymentDisplayStatus:
            type: string
            enum: [incomplete, pending, succeeded, refund_pending, partially_refunded, refunded, failed, cancelled]
            description: >-
                The label a payment shows, derived from the stored status and its refund records
                (Shopify's `displayFinancialStatus`). `incomplete` — awaiting confirmation or
                action; `pending` — processing; `succeeded` — paid, no refund record;
                `refund_pending` — any refund still pending or failed (wins over the next two);
                `partially_refunded` — paid with at least one settled refund; `refunded` — fully
                returned (every unit of `amount`, no refund still open); `failed` — declined;
                `cancelled` — the order was cancelled before the payment settled.

        PaymentSort:
            description: >-
                `payBy` sorts on the bank-transfer deadline in `nextAction.payBy`. A payment with
                none (any other method) counts as the earliest: first ascending, last descending.
            type: array
            minItems: 1
            maxItems: 2
            items:
                type: string
                enum: [createdAt, -createdAt, amount, -amount, payBy, -payBy]

        SearchPaymentsRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Page'
                pageSize:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PageSize'
                sort:
                    $ref: '#/components/schemas/PaymentSort'
                displayStatus:
                    $ref: '#/components/schemas/PaymentDisplayStatus'
                method:
                    $ref: '#/components/schemas/PaymentMethodKind'
                provider:
                    type: string
                    maxLength: 64
                createdFrom: { type: string, format: date-time }
                createdTo: { type: string, format: date-time }
                receivedFrom: { type: string, format: date-time }
                receivedTo: { type: string, format: date-time }
                amountMin: { type: number, format: double, minimum: 0 }
                amountMax: { type: number, format: double, minimum: 0 }
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                disputed:
                    type: boolean
                    description: >-
                        `true` keeps only payments with a dispute still open. `false` or absent is no
                        filter.
                reference: { type: string, maxLength: 120 }
                transferReference:
                    type: string
                    maxLength: 64
                    description: >-
                        The RF creditor reference of a bank transfer, in any spacing and case; a
                        code that is not a valid reference finds nothing.

        PaymentsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Payment'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        # One row per refund, with the payment it belongs to.
        RefundListItem:
            type: object
            additionalProperties: false
            required: [id, paymentId, orderId, amount, currency, status, reason, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                paymentId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                amount: { type: number, format: double, minimum: 0 }
                currency: { type: string }
                status:
                    $ref: '#/components/schemas/RefundStatus'
                reason:
                    $ref: '#/components/schemas/RefundReason'
                returnId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                providerRefundRef: { type: string }
                failureReason:
                    $ref: '#/components/schemas/RefundFailureReason'
                settledAt: { type: string, format: date-time }
                reversedAt: { type: string, format: date-time }
                createdAt: { type: string, format: date-time }

        RefundsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/RefundListItem'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        PaymentAttentionKind:
            type: string
            enum: [stale_refund, refused_refund, reversed_refund, refund_exceeds_remaining, manual_refund_owed, dispute_needs_response]
            description: >-
                `stale_refund` — a provider refund open past the threshold, still waiting for the
                provider's answer or its next retry;
                `refused_refund` — a card refund the provider refused for good (a final
                `RefundFailureReason`), shown at once: the money has to go back another way;
                `reversed_refund` — a refund the provider took back after settling it (a bank sent
                it back), shown at once with `since` = when it was reversed: the money is owed
                another way, agreed with the buyer;
                `refund_exceeds_remaining` — a refund made in the provider's dashboard took the room an
                open refund here counted on: the open one is held unsent (the provider would refuse it)
                and `exceedsBy` says by how much. Staff cancel it or mark it returned;
                `manual_refund_owed` — money to hand back outside the system on a `manual` payment.
                Each of those is an open refund record on a payment: a cancel or a refund opens it
                before anything is asked of a provider, so no refund is owed without one;
                `dispute_needs_response` — the buyer's bank opened a dispute the shop has to answer
                in the provider's own dashboard before `dueBy`. It names the dispute (`disputeId`),
                not a refund, and says what was already refunded (`alreadyRefunded`) because that
                refund is the evidence for a refund-then-chargeback.

        PaymentAttentionItem:
            type: object
            additionalProperties: false
            required: [kind, orderId, paymentId, amount, currency, since]
            properties:
                kind:
                    $ref: '#/components/schemas/PaymentAttentionKind'
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                paymentId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                refundId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                disputeId:
                    type: string
                    maxLength: 200
                    description: The provider's dispute id, on a `dispute_needs_response` row (which has no `refundId`).
                dueBy:
                    type: string
                    format: date-time
                    description: >-
                        On a `dispute_needs_response` row, when the provider's evidence window closes.
                        Absent when the provider gave none. A past date means the window has gone.
                alreadyRefunded:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        On a `dispute_needs_response` row, how much of the payment was already
                        refunded successfully, in its currency. Above zero it is a refund-then-chargeback:
                        send the refund as evidence. Absent when nothing was refunded.
                amount: { type: number, format: double, minimum: 0 }
                currency: { type: string }
                failureReason:
                    $ref: '#/components/schemas/RefundFailureReason'
                since:
                    type: string
                    format: date-time
                    description: When the problem was recorded, so the page can sort by age.
                exceedsBy:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        On a `refund_exceeds_remaining` row, by how much this open refund overshoots
                        what the provider can still give back, in the payment's currency.
                refundDueBy:
                    type: string
                    format: date-time
                    description: >-
                        The legal deadline to give the money back, on a `refused_refund` that pays for a
                        withdrawal or a return: the refund's creation plus 14 days (Consumer Rights
                        Directive Art. 13). Absent for any other refund, which shows its age only. The
                        client shows the days left; a past date means the deadline has gone.

        PaymentAttentionResponse:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/PaymentAttentionItem'

        RefundReason:
            type: string
            enum: [cancellation, goodwill, return, late_payment, external]
            description: >-
                Why the money went back. `cancellation` — the order was cancelled after payment, or the
                unshipped remainder of one fulfillment order was (then `returnId` names that cancellation);
                `return` — goods came back and were received; `goodwill` — an operator chose to;
                `late_payment` — the money arrived after the order could no longer be paid (its stock
                reservation had expired or it was cancelled), so the sale was lost and the money went back.
                The buyer is mailed it like a cancellation's refund. `external` — the refund was made in
                the payment provider's own dashboard, not here: the application found it and recorded
                it so the credit note, the buyer's mail and the order's state follow; it is `succeeded`
                from the start and carries the provider's own amount and date.

        RefundPaymentRequest:
            type: object
            additionalProperties: false
            properties:
                amount:
                    type: number
                    format: double
                    exclusiveMinimum: 0
                    description: >-
                        How much to return, a decimal in the payment's own currency. Absent means
                        everything still refundable.
                currency:
                    type: string
                    maxLength: 3
                    description: >-
                        ISO-4217 code of `amount`. Optional; when sent it must equal the payment's
                        own currency, so an amount written in another unit is refused instead of
                        being read as this one.

        PaymentActions:
            type: object
            additionalProperties: false
            required: [pay, sync, refund, settleByHand, cancelRefund]
            description: >-
                What the requesting caller may do to this payment. Money is this module's to answer
                for; the order's own moves are on `Order.actions`, and a client that needs both
                composes them rather than deciding either for itself. Every response that carries a
                payment carries these, including the answer to each write, so a client never has to
                re-read to learn the next step.
            properties:
                pay:
                    type: boolean
                    description: >-
                        Whether the buyer may start or retry paying — the payment is awaiting
                        confirmation or retryable after a decline (then `POST /payments/{id}/confirm`),
                        or it is a bank transfer still waiting for its money and a card provider is
                        configured (then `POST /payments` takes it over with a card), AND the
                        order can still reach `paid`, AND the caller is the payer and holds
                        `checkout:Cart` (staff reading the payment are never offered it). An
                        in-flight payment is deliberately not payable: its next step is `sync`.
                sync:
                    type: boolean
                    description: >-
                        Whether the buyer may finish at the provider with `POST /payments/{id}/sync` —
                        the payment is `requires_action` or `processing`, it went through the
                        provider, and the caller is the payer holding `checkout:Cart`. Narrower than
                        the route on purpose: the route also accepts a payment that is awaiting
                        confirmation or was declined, whose next step is `pay`. Never true together
                        with `pay`.
                refund:
                    type: boolean
                    description: >-
                        Whether `POST /payments/{id}/refunds` would be accepted: the caller
                        holds `create:Refund`, the payment is `succeeded` and something is left to
                        refund. False once nothing is left (fully refunded, or the rest already asked
                        back, or a lost chargeback took the rest) or a chargeback is open on the
                        payment (`PAYMENT_DISPUTED`), which is what greys the control out rather
                        than letting the operator discover it by clicking. A refund still open counts against what
                        is left but does not hide the control while money remains. On a hand-paid
                        payment the refund only opens a record; `settleByHand` confirms it.
                settleByHand:
                    type: array
                    items:
                        $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                    description: >-
                        The ids of the refunds this caller may mark as returned with
                        `POST /payments/{id}/refunds/{refundId}/settle`: the caller holds
                        `create:Refund`, the payment is `succeeded`, and the refund is either a
                        hand-paid payment's `pending` one or a card refund `failed` with a reason
                        that proves the money did not move (`RefundFailureReason`). The server
                        decides; a client never rebuilds this rule. An array because the route
                        takes a target; empty when there is none.
                cancelRefund:
                    type: array
                    items:
                        $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                    description: >-
                        The ids of the refunds this caller may void with
                        `POST /payments/{id}/refunds/{refundId}/cancel`: the same set as
                        `settleByHand` (money that provably did not move), so a hand-paid `pending`
                        refund or a card refund refused for a clear reason. The server decides.
                        Empty when there is none.

        PaymentWebhookEvent:
            type: object
            additionalProperties: false
            required: [id]
            description: >-
                One delivery, in this module's normalised shape: which event it is, which intent
                it names and, for a refund event (`refund.created`, `refund.updated`, `refund.failed`,
                `charge.refunded`), which refund, and nothing about what happened — except a dispute
                event (`charge.dispute.created`, `.updated`, `.closed`), which carries the
                dispute's own state because a provider such as Adyen cannot be asked about one. A refund made in the
                provider's own dashboard arrives the same way and is imported. A real provider sends its OWN event
                shape and its implementation of the provider port translates it into this. The
                outcome is never read from the body: once the delivery is authenticated, the
                server asks the provider for the payment's state, because providers do not
                guarantee the order events arrive in.
            properties:
                id:
                    type: string
                    maxLength: 200
                    description: The provider's event id, logged. A retry settles nothing twice because each effect is a conditional write, not because the id is remembered.
                providerRef:
                    type: string
                    maxLength: 200
                    description: Which intent the event is about. Absent for an event this API ignores.
                refundRef:
                    type: string
                    maxLength: 200
                    description: >-
                        Which refund the event is about, when it is about one (Stripe's
                        `refund.updated`, `refund.failed`, `charge.refunded`). Still only a pointer:
                        the server re-reads that refund's own status from the provider, so a refund
                        that settled and then bounced is noticed even days later.
                dispute:
                    $ref: '#/components/schemas/DisputeReport'

        CreatePaymentRequest:
            type: object
            additionalProperties: false
            required: [orderId]
            properties:
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        ConfirmPaymentRequest:
            type: object
            additionalProperties: false
            required: [paymentMethodRef]
            properties:
                paymentMethodRef:
                    type: string
                    minLength: 3
                    maxLength: 255
                    pattern: '^[\w-]+$'
                    description: >-
                        The provider's opaque handle for the payment method, produced in the
                        BROWSER by the provider's own widget. Never a card number — a card number
                        reaching this API would put the whole deployment in the heavyweight PCI
                        bracket, which is the reason this field is shaped the way it is.

        PaymentMethodOption:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '../orders/openapi.yaml#/components/schemas/PaymentMethodId'
                holdHours:
                    type: number
                    minimum: 0
                    description: >-
                        How long checkout holds stock for an order choosing this method
                        (`NODE_BANK_TRANSFER_HOLD_HOURS`). Present on `bank_transfer` only —
                        `card`'s hold is `NODE_RESERVATION_TTL_MINUTES`, a different unit, owned
                        by `inventory` rather than a deployment choice this module makes.

        PaymentMethodsResponse:
            type: object
            additionalProperties: false
            required: [methods]
            properties:
                methods:
                    type: array
                    items:
                        $ref: '#/components/schemas/PaymentMethodOption'

        RecordOfflinePaymentRequest:
            type: object
            additionalProperties: false
            required: [method]
            properties:
                method:
                    type: string
                    enum: [bank_transfer, cash, other]
                    description: How the money arrived. `card` is not offered here — that path is `POST /payments`.
                reference:
                    type: string
                    minLength: 1
                    maxLength: 120
                    description: A bank transaction id, a receipt number — whatever ties this record to the money.
                receivedAt:
                    type: string
                    format: date-time
                    description: When the money arrived. Must not be in the future. Defaults to now.

        # Used by `POST /account/export` (`shared/contracts/openapi.root.yaml`) — minus `userId`
        # and `actions`: `userId` is redundant (an export already scopes every payment to the
        # caller) and `actions` is computed PER CALLER by `paymentService`'s own read path, which
        # this endpoint's bulk read (`paymentService.findOwnPaymentsForExport`) deliberately bypasses.
        ExportPayment:
            type: object
            additionalProperties: false
            required: [id, orderId, amount, currency, status, provider, amountRefunded, refunds]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                amount:
                    type: number
                    format: double
                    minimum: 0
                currency:
                    type: string
                amountRefunded:
                    type: number
                    format: double
                    minimum: 0
                refunds:
                    type: array
                    items:
                        $ref: '#/components/schemas/Refund'
                status:
                    type: string
                    enum: [requires_confirmation, requires_action, processing, succeeded, declined, cancelled]
                provider:
                    type: string
                cardLast4:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
