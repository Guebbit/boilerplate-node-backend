openapi: 3.0.3
info:
    title: payments — module contract
    version: '3.0.0'

paths:
    /payments/methods:
        get:
            tags: [Payments]
            summary: List payment methods
            description: Which methods this deployment offers, so the frontend hard-codes none. `card` is always present; `bank_transfer` only once its beneficiary and IBAN are configured. Public — like `GET /delivery/methods`, this is pre-purchase information.
            operationId: listPaymentMethods
            security: []
            responses:
                '200':
                    description: The methods
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentMethodsResponseEnvelope'
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/intent:
        post:
            tags: [Payments]
            summary: Create a payment intent
            description: Freezes one of the caller's `pending` orders into a payment intent — the amount is taken from the order's own lines, so the intent cannot quote a different number than the order shows. Asking again refreshes the same intent (one payment per order is a database fact); an order whose money already moved answers 409. The intent is the thing the card dialog confirms.
            operationId: createPaymentIntent
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreatePaymentIntentRequest'
            responses:
                '201':
                    description: The payment intent, ready to confirm
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentEnvelope'
                    links:
                        ConfirmPayment:
                            operationId: confirmPayment
                            parameters:
                                id: '$response.body#/data/id'
                            description: The intent's id is confirmed here to complete the charge.
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Not `pending`, or already paid (`PAYMENT_ORDER_NOT_PAYABLE`), or
                # `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/order/{orderId}:
        get:
            tags: [Payments]
            summary: Get the payment behind an order
            description: The payment record for one of the caller's orders, so a reload mid-flow finds the intent and its status again. Admins read anyone's. No intent yet is a 404 — absence is an answer, the client starts the flow with `POST /payments/intent`.
            operationId: getPaymentByOrder
            security:
                - bearerAuth: []
            parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: One of the caller's own orders
            responses:
                '200':
                    description: The payment
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/order-by-reference:
        get:
            tags: [Payments]
            summary: Find the order behind an RF reference
            description: >-
                The admin's own step before `POST /payments/order/{orderId}/offline`: paste the RF
                creditor reference read off the bank's own website and get back the order it pays.
                Admin only — reading who owes what by reference is no less than recording that the
                money arrived. A malformed or unmatched reference both answer 404,
                indistinguishably: nothing here confirms that an almost-right code was close. An
                order placed before this field existed has no reference at all and is not
                reachable here — find it by id through the normal order search instead. Requires a
                session that has re-proved itself within the last few minutes — a valid-but-stale
                token answers 401 with `errors[].code` `REAUTH_REQUIRED`, and the caller
                re-authenticates and retries the same request.
            operationId: getOrderByReference
            security:
                - bearerAuth: []
            parameters:
                - name: ref
                  in: query
                  required: true
                  schema:
                      type: string
                      minLength: 1
                      maxLength: 64
                  description: >-
                      The RF reference, spaces and case tolerated exactly as a customer might type
                      it — e.g. `RF13 2EY8 H44V JAVZ KX80 JRL`.
            responses:
                '200':
                    description: The order this reference pays
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderByReferenceResponseEnvelope'
                    links:
                        RecordOfflinePayment:
                            operationId: recordOfflinePayment
                            parameters:
                                orderId: '$response.body#/data/id'
                            description: The order this reference names is what the admin then marks paid.
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # Malformed (fails the mod-97 check), or well-formed but matching no order.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/order/{orderId}/refund:
        post:
            tags: [Payments]
            summary: Refund an order's payment
            description: >-
                Returns the money without touching the order's status — the operator action for a
                goodwill refund, and the second half of "cancel and refund" when a client sends both.
                Admin only. The write is conditional on the payment still being `succeeded`, so a
                double submit refunds once and answers 409 the second time. Requires a session that
                has re-proved itself within the last few minutes — a valid-but-stale token answers
                401 with `errors[].code` `REAUTH_REQUIRED`, and the caller re-authenticates and
                retries the same request.
            operationId: refundPaymentByOrder
            security:
                - bearerAuth: []
            parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: The order whose payment is being returned
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            responses:
                '200':
                    description: The payment, `refunded`
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Nothing to return: the payment never succeeded, or it is already refunded
                # (`PAYMENT_NOT_REFUNDABLE`) — or `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/order/{orderId}/offline:
        post:
            tags: [Payments]
            summary: Record a payment that arrived outside the provider
            description: >-
                An admin recording money the card provider never saw — cash at the counter, a
                phone order paid by transfer, a bank transfer that landed. Writes the payment as
                `manual` and runs it through the same settlement `POST /payments/{id}/confirm`
                does: the order moves `pending → paid`, stock commits, and `ORDER_STATUS_CHANGED`
                and `PAYMENT_SUCCEEDED` fire as usual. The amount is always the order's own total —
                there is no partial or over-payment here, those are handled by hand, off-system.
                Requires a session that has re-proved itself within the last few minutes — a
                valid-but-stale token answers 401 with `errors[].code` `REAUTH_REQUIRED`, and the
                caller re-authenticates and retries the same request.
            operationId: recordOfflinePayment
            security:
                - bearerAuth: []
            parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: The order the money arrived for. Must still be `pending`
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RecordOfflinePaymentRequest'
            responses:
                '201':
                    description: The payment, `succeeded`, with the order now `paid`
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Order not pending (`PAYMENT_ORDER_NOT_PAYABLE`), a card charge already in flight
                # at the provider (`PAYMENT_IN_FLIGHT` — recording money too could charge twice),
                # or `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/{id}/confirm:
        post:
            tags: [Payments]
            summary: Confirm a payment
            description: >-
                Attaches a payment method the browser tokenised and asks the provider to take the
                money. The answer is not always final: a card that needs a 3-D Secure challenge
                comes back `requires_action` and one that settles asynchronously `processing`, both
                as a 200 — the browser finishes the challenge against the provider and then calls
                `POST /payments/{id}/sync`. Only `succeeded` moves the order to `paid`, and the
                webhook remains the authority for that even when this endpoint saw it first. A
                decline answers 409 with `errors[].code` `PAYMENT_DECLINED` and is retryable —
                submit the same payment again with another method. Requires a session that has
                re-proved itself within the last few minutes — a valid-but-stale token answers 401
                with `errors[].code` `REAUTH_REQUIRED`, and the caller re-authenticates and retries
                the same request.
            operationId: confirmPayment
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ConfirmPaymentRequest'
            responses:
                '200':
                    description: >-
                        The payment as it now stands — `succeeded` with the order `paid`, or
                        `requires_action`/`processing` with the browser's next step still to come.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentEnvelope'
                    links:
                        SyncPayment:
                            operationId: syncPayment
                            parameters:
                                id: '$response.body#/data/id'
                            description: An in-flight payment is resolved by re-reading the provider here.
                        RefundPayment:
                            operationId: refundPaymentByOrder
                            parameters:
                                orderId: '$response.body#/data/orderId'
                            description: A succeeded payment can be refunded without touching the order status.
                        CancelOrder:
                            operationId: cancelOrderById
                            parameters:
                                id: '$response.body#/data/orderId'
                            description: A paid order can still be cancelled, which refunds it too.
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Declined by the card issuer (`PAYMENT_DECLINED`), not awaiting confirmation
                # (`PAYMENT_NOT_CONFIRMABLE`), the order slipped away between charge and
                # write (`PAYMENT_ORDER_NOT_PAYABLE` — the charge was refunded on the spot), or
                # `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `paymentConfirmAttemptLimiter` and `paymentConfirmDeclineLimiter` both sit in
                # front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/{id}/sync:
        post:
            tags: [Payments]
            summary: Re-read a payment from the provider and settle it
            description: >-
                The browser saying "I have finished at the provider". Re-reads the provider's own
                record and applies whatever it says, which is what makes the happy path feel
                synchronous while the webhook stays the source of truth. Idempotent and safe to
                call repeatedly: a payment already settled answers itself unchanged. Answers 409
                `PAYMENT_DECLINED` when the provider's answer is a refusal, exactly as the confirm
                does. Requires a session that has re-proved itself within the last few minutes — a
                valid-but-stale token answers 401 with `errors[].code` `REAUTH_REQUIRED`, and the
                caller re-authenticates and retries the same request.
            operationId: syncPayment
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The payment as the provider now reports it
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Declined (`PAYMENT_DECLINED`), or the payment never reached the provider
                # (`PAYMENT_NOT_CONFIRMABLE`).
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /payments/webhook:
        post:
            tags: [Payments]
            summary: Provider webhook
            description: >-
                Where the provider reports what actually happened to a payment, and the authority
                for it — the browser's word never is. **Not session-authenticated**: the caller is
                a machine with no account, and it authenticates by signing the raw body instead,
                which is stronger than any cookie this API could ask it for. Deliveries are
                deduplicated by event id, so a provider retrying for days settles once.

                Answers 200 to anything it has authenticated, including events it does not act on:
                a provider reads a non-2xx as a failure and retries harder.
            operationId: receivePaymentWebhook
            security: []
            parameters:
                - name: x-payment-signature
                  in: header
                  required: true
                  schema:
                      type: string
                  description: >-
                      `t=<unix seconds>,v1=<hex hmac-sha256 of "<t>.<raw body>">`. `t` must be
                      within 300 seconds of the server's clock or the delivery is rejected as
                      stale, replay protection against a captured signature being resent later.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PaymentWebhookEvent'
            responses:
                '200':
                    description: Accepted — acted on, or knowingly ignored
                    content:
                        application/json:
                            schema:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/MessageResponse'
                # The signature did not verify, is stale, or the body is not an event.
                '400': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/BadRequest' }
                # Keyed on the caller's address, not a signed identity — see
                # docs/tools/security.md#the-rate-limit-budgets.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # ── Payments module ─────────────────────────────────────────────────────
        # Owned by src/modules/payments. The Payment is the provider-facing record of an
        # order's money; the order's own status stays the customer-facing lifecycle.

        Payment:
            type: object
            additionalProperties: false
            required: [id, orderId, amount, currency, status, provider, method]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                # Absent once the account that made this payment has been erased.
                userId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                amount:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        The order's total as the intent froze it. Always two decimal places,
                        rounded half-up at the point of calculation.
                currency:
                    type: string
                    description: ISO-4217 currency code (e.g. EUR)
                status:
                    type: string
                    enum: [requires_confirmation, requires_action, processing, succeeded, declined, refunded]
                    description: >-
                        The provider-facing lifecycle. `requires_action` means the bank wants a
                        challenge answered in the browser (3-D Secure) and `processing` that the
                        provider has taken the payment but not settled it — both are in flight, and
                        `POST /payments/{id}/sync` is what resolves them without waiting for the
                        webhook. `declined` is retryable: the confirm endpoint accepts the same
                        payment again with another method. `refunded` is terminal. Full transition
                        table: docs/modules/payments.md#status-transitions
                provider:
                    type: string
                    description: >-
                        Which provider implementation handled it — `fake` in the demo, `manual` for
                        a payment recorded by hand (`POST /payments/order/{orderId}/offline`), or a
                        real PSP's name.
                method:
                    type: string
                    enum: [card, bank_transfer, cash, other]
                    description: >-
                        How the money moved. `card` for anything that went through the provider
                        port; the other three are set only by `POST
                        /payments/order/{orderId}/offline`, from what the admin chose there.
                reference:
                    type: string
                    maxLength: 120
                    description: >-
                        Free text identifying an offline payment — a bank transaction id, a receipt
                        number. Set only by `POST /payments/order/{orderId}/offline`; absent from a
                        card payment.
                receivedAt:
                    type: string
                    format: date-time
                    description: >-
                        When the money actually arrived, as the admin recording it reported —
                        possibly earlier than `createdAt`. Set only by `POST
                        /payments/order/{orderId}/offline`; absent from a card payment.
                refundedByHand:
                    type: boolean
                    description: >-
                        `true` once a refunded `manual` payment has had its money returned to the
                        customer outside this application — there is no provider to ask, so this is
                        the admin's own record that it was done. Absent otherwise.
                clientSecret:
                    type: string
                    description: >-
                        Returned by `POST /payments/intent` alone, never stored and never read
                        back: it authorises completing this payment against the provider from the
                        browser. Absent from every other response.
                cardLast4:
                    type: string
                    description: >-
                        The only card digits a payment system may remember. Survives a refund —
                        refunding does not clear it.
                # Computed per CALLER, not stored — the same idea as `Order.actions`, for the half
                # of the question this module owns.
                actions:
                    $ref: '#/components/schemas/PaymentActions'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        PaymentActions:
            type: object
            additionalProperties: false
            required: [pay, refund]
            description: >-
                What the requesting caller may do to this payment. Money is this module's to answer
                for; the order's own moves are on `Order.actions`, and a client that needs both
                composes them rather than deciding either for itself.
            properties:
                pay:
                    type: boolean
                    description: >-
                        Whether `POST /payments/{id}/confirm` would be accepted — the payment is
                        awaiting confirmation or retryable after a decline, AND the order can still
                        reach `paid`.
                refund:
                    type: boolean
                    description: >-
                        Whether `POST /payments/order/{orderId}/refund` would be accepted. False
                        once refunded, which is what greys the control out rather than letting the
                        operator discover it by clicking.

        PaymentWebhookEvent:
            type: object
            additionalProperties: false
            required: [id]
            description: >-
                One delivery, in this module's normalised shape. A real provider sends its OWN
                event shape and its implementation of the provider port translates it into this —
                the endpoint is documented in the terms the module acts on, not in any one
                vendor's vocabulary.

                FLAT on purpose. The provider's report could have been nested under a `state`
                object, mirroring how most vendors wrap theirs, but the adapter is where a vendor's
                shape is absorbed and nothing downstream reads these fields as a unit — so the
                nesting would have bought a second level for no reader.
            properties:
                id:
                    type: string
                    description: The provider's event id. Deduplicated, so a retry settles nothing twice.
                providerRef:
                    type: string
                    description: Which intent the event is about. Absent for an event this API ignores.
                status:
                    type: string
                    enum: [requires_action, processing, succeeded, declined]
                    description: The provider's own vocabulary — `refunded` is not here, because a refund is a later act of ours. Absent for an event this API ignores.
                cardLast4:
                    type: string
                    description: The only card digits a payment system may remember, as the provider reports them.

        PaymentEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/Payment'

        CreatePaymentIntentRequest:
            type: object
            additionalProperties: false
            required: [orderId]
            properties:
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        ConfirmPaymentRequest:
            type: object
            additionalProperties: false
            required: [paymentMethodRef]
            properties:
                paymentMethodRef:
                    type: string
                    minLength: 3
                    maxLength: 255
                    pattern: '^[\w-]+$'
                    description: >-
                        The provider's opaque handle for the payment method, produced in the
                        BROWSER by the provider's own widget. Never a card number — a card number
                        reaching this API would put the whole deployment in the heavyweight PCI
                        bracket, which is the reason this field is shaped the way it is. The fake
                        provider recognises `pm_card_visa` (succeeds), `pm_card_declined`,
                        `pm_card_authentication_required` and `pm_card_processing`; anything else
                        succeeds.

        PaymentMethodOption:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaymentMethodId'
                holdHours:
                    type: number
                    minimum: 0
                    description: >-
                        How long checkout holds stock for an order choosing this method
                        (`NODE_BANK_TRANSFER_HOLD_HOURS`). Present on `bank_transfer` only —
                        `card`'s hold is `NODE_RESERVATION_TTL_MINUTES`, a different unit, owned
                        by `inventory` rather than a deployment choice this module makes.

        PaymentMethodsResponse:
            type: object
            additionalProperties: false
            required: [methods]
            properties:
                methods:
                    type: array
                    items:
                        $ref: '#/components/schemas/PaymentMethodOption'

        PaymentMethodsResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/PaymentMethodsResponse'

        # The envelope for `GET /payments/order-by-reference` — `data` is the shared `Order`
        # itself, not a `Payment`: the lookup answers "which order", the settlement that follows
        # (the existing `POST /payments/order/{orderId}/offline`) is what answers with a payment.
        OrderByReferenceResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Order'

        RecordOfflinePaymentRequest:
            type: object
            additionalProperties: false
            required: [method]
            properties:
                method:
                    type: string
                    enum: [bank_transfer, cash, other]
                    description: How the money arrived. `card` is not offered here — that path is `POST /payments/intent`.
                reference:
                    type: string
                    maxLength: 120
                    description: A bank transaction id, a receipt number — whatever ties this record to the money.
                receivedAt:
                    type: string
                    format: date-time
                    description: When the money arrived. Must not be in the future. Defaults to now.

        # Used by `POST /account/export` (`shared/contracts/openapi.root.yaml`) — minus `userId`
        # and `actions`: `userId` is redundant (an export already scopes every payment to the
        # caller) and `actions` is computed PER CALLER by `paymentService`'s own read path, which
        # this endpoint's bulk read (`paymentService.findOwnPayments`) deliberately bypasses.
        ExportPayment:
            type: object
            additionalProperties: false
            required: [id, orderId, amount, currency, status, provider]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                amount:
                    type: number
                    format: double
                    minimum: 0
                currency:
                    type: string
                status:
                    type: string
                    enum: [requires_confirmation, requires_action, processing, succeeded, declined, refunded]
                provider:
                    type: string
                cardLast4:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
