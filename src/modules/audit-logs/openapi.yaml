openapi: 3.1.0
info:
    title: audit-logs — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Audit
      description: The tenant's own action history — who did what, when, to which row. Read-only, and separate from Observability's operational audit, which is the platform operator's view across every shop.

# This module's section of the account data export (`POST /account/export`): the bundler
# adds it to `AccountExportResponse`. Removing the module removes the section.
x-personal-data:
    auditLog:
        schema:
            type: array
            items:
                $ref: '#/components/schemas/AuditEntryItem'

paths:
    /audit:
        get:
            tags: [Audit]
            summary: The shop's own action history
            description: |
                A filtered, paged read over the same trail `GET /observability/audit` serves — but
                scoped to one shop and reached with a role a shop actually has, not a platform one.
                Newest first. `meta.totalItems` counts every entry matching the filters, not just
                the page.

                Requires `read:AuditLog` — held by `manager`, `support` and `moderator` in the demo.
            operationId: listAuditEntries
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - name: actor
                  in: query
                  schema: { type: string, maxLength: 64 }
                  description: Filter by actor user ID
                - name: action
                  in: query
                  schema: { type: string, maxLength: 100 }
                  description: 'Filter by action name (e.g. order.created)'
                - name: outcome
                  in: query
                  schema:
                      type: string
                      enum: [success, failure]
                  description: Filter by outcome
                - name: target
                  in: query
                  schema: { type: string, maxLength: 100 }
                  description: Filter by the id of the row the action was taken on (e.g. an order or a user)
                - name: since
                  in: query
                  schema:
                      type: string
                      format: date-time
                  description: Return events strictly after this ISO-8601 timestamp — an exclusive bound
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
            responses:
                '200':
                    description: Action history
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditEntriesResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # ---------- audit-logs — the schemas only this module's paths reference. ----------
        # One row shape for every audit read: `GET /audit`, `GET /observability/audit` and the
        # account export all `$ref` it. One serializer (`applyAuditLogTransform`) answers all three.
        AuditEntryItem:
            type: object
            additionalProperties: false
            required: [actorUserId, actorRole, actorScope, action, outcome, timestamp, level]
            properties:
                actorUserId: { type: string }
                actorCredentialId:
                    {
                        type: string,
                        description: 'The API key the action was done with. Absent when a person did it themselves.'
                    }
                actorRole:
                    type: string
                    enum: [admin, user, anonymous, system]
                actorRoleName:
                    {
                        type: string,
                        description: 'The tenant role behind actorRole, e.g. moderator. Absent when the request never resolved one.'
                    }
                actorScope:
                    {
                        type: string,
                        enum: [tenant, platform],
                        description: 'Which world this action happened in — a shop or the installation.'
                    }
                action:
                    {
                        type: string,
                        description: 'Dot-notation action name (e.g. order.created)'
                    }
                outcome:
                    type: string
                    enum: [success, failure]
                ip:
                    {
                        type: string,
                        description: 'The caller address as recorded. The platform trail (`GET /observability/audit`) answers a keyed digest instead: `hmac:` and 12 hex characters.'
                    }
                userAgent: { type: string }
                requestId: { type: string }
                traceId: { type: string }
                targetType: { type: string }
                targetId: { type: string }
                metadata:
                    type: object
                    additionalProperties: true
                timestamp: { type: string, format: date-time }
                level:
                    type: string
                    enum: [info, warn]

        AuditEntriesResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntryItem' }
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        AuditEntriesResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/AuditEntriesResponse'
