rules:
    # -- users ---------------------------------------------------------------------------------
    - action: read
      subject: User
      module: users
      scope: tenant
      description: Read other people's accounts. Reading your own is `account`, not a key.
    - action: create
      subject: User
      module: users
      scope: tenant
      description: Create an account for someone else.
    - action: update
      subject: User
      module: users
      scope: tenant
      description: >-
          Change someone else's profile: username, image, locale, phone, website, and the role
          (only for a holder of `assign:Role`). Never a credential, and never `active`.
    - action: ban
      subject: User
      module: users
      scope: tenant
      description: Deactivate someone else's account, or lift the deactivation.
    - action: delete
      subject: User
      module: users
      scope: tenant
      description: Erase someone else's account.
      # Irreversible and about somebody else. A stolen session should not be able to reach it on
      # the strength of a login that happened this morning.
      stepUp: critical

sets:
    - name: UserDisplay
      module: users
      description: Read other people's accounts.
      rules:
          - read:User
    - name: UserCreation
      module: users
      description: Create an account for someone else.
      rules:
          - create:User
    - name: UserEditing
      module: users
      description: Change someone else's profile.
      rules:
          - update:User
    - name: UserBanning
      module: users
      description: Deactivate an account, or lift it.
      rules:
          - ban:User
    - name: UserErasure
      module: users
      description: Erase someone else's account.
      rules:
          - delete:User
