keys:
    # -- users ---------------------------------------------------------------------------------
    - key: users.any.read
      module: users
      subject: User
      action: read
      scope: tenant
      description: Read other people's accounts. Reading your own is `account`, not a key.
    - key: users.any.create
      module: users
      subject: User
      action: create
      scope: tenant
      description: Create an account for someone else.
    - key: users.any.update
      module: users
      subject: User
      action: update
      scope: tenant
      description: >-
          Change someone else's profile: username, image, locale, phone, website, and the role
          (within the keys the caller holds). Never a credential, and never `active`.
    - key: users.any.ban
      module: users
      subject: User
      action: ban
      scope: tenant
      description: Deactivate someone else's account, or lift the deactivation.
    - key: users.any.delete
      module: users
      subject: User
      action: delete
      scope: tenant
      description: Erase someone else's account.
      # Irreversible and about somebody else. A stolen session should not be able to reach it on
      # the strength of a login that happened this morning.
      stepUp: critical
