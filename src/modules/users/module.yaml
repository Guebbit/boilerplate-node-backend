summary: 'Admin-side user management; the self-service half is account.'
subdomain: generic
group: foundation
dependsOn:
    - access # assignRole/revokeRole/promoteVerifiedCustomer/rolesOf, the role half of a user's write ops
jobs:
    reapPurchaseHolds:
        name: reap:purchase-holds
        # Nightly with the other reapers: an expired hold is already ignored by every reader, so
        # this only trims what is kept. Idempotent: a reduced account has no hold left to match.
        schedule: 12 2 * * *
        summary:
            Reduces every expired purchase hold to the date that restarts the count of cancellations,
            dropping its note and who set it.
