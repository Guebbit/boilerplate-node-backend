        # ---------- users — the schemas only this module's paths reference. ----------
        UsersResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/UsersResponse'

        SearchUsersRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    $ref: '#/components/schemas/Page'
                pageSize:
                    $ref: '#/components/schemas/PageSize'
                text:
                    $ref: '#/components/schemas/Text'
                id:
                    $ref: '#/components/schemas/Id'
                email:
                    $ref: '#/components/schemas/Email'
                username:
                    type: string
                # Filters the stored `active` column. It does NOT filter soft-deletion: the two
                # are independent facts, and `deletedAt` is not exposed on `User` at all, so
                # there is no filter for it here. `active: false` means "deactivated", never
                # "deleted".
                active:
                    type: boolean

        CreateUserRequest:
            type: object
            additionalProperties: false
            required: [email, username, password]
            properties:
                email:
                    $ref: '#/components/schemas/Email'
                username:
                    type: string
                password:
                    $ref: '#/components/schemas/Password'
                admin:
                    type: boolean
                # Same reasoning as `CreateProductRequest.active`: independent of soft-deletion,
                # and defaulted here so both implementations derive it rather than each choosing.
                # Create bodies only — an omitted `active` on an update means "leave it alone".
                active:
                    type: boolean
                    default: true
                imageUrl:
                    $ref: '#/components/schemas/ImageUrl'
                locale:
                    $ref: '#/components/schemas/Locale'

        CreateUserRequestMultipart:
            type: object
            additionalProperties: false
            required: [email, username, password]
            properties:
                email:
                    $ref: '#/components/schemas/Email'
                username:
                    type: string
                password:
                    $ref: '#/components/schemas/Password'
                admin:
                    type: boolean
                # Same default, same reasoning as `CreateUserRequest.active` above.
                active:
                    type: boolean
                    default: true
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional user profile image
                locale:
                    $ref: '#/components/schemas/Locale'

        UpdateUserRequest:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                email:
                    $ref: '#/components/schemas/Email'
                username:
                    type: string
                password:
                    $ref: '#/components/schemas/Password'
                admin:
                    type: boolean
                active:
                    type: boolean
                imageUrl:
                    $ref: '#/components/schemas/ImageUrl'
                locale:
                    $ref: '#/components/schemas/Locale'

        UpdateUserRequestMultipart:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                email:
                    $ref: '#/components/schemas/Email'
                username:
                    type: string
                password:
                    $ref: '#/components/schemas/Password'
                admin:
                    type: boolean
                active:
                    type: boolean
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional user profile image
                locale:
                    $ref: '#/components/schemas/Locale'

        UpdateUserByIdRequest:
            type: object
            additionalProperties: false
            properties:
                email:
                    $ref: '#/components/schemas/Email'
                password:
                    $ref: '#/components/schemas/Password'
                username:
                    type: string
                admin:
                    type: boolean
                active:
                    type: boolean
                imageUrl:
                    $ref: '#/components/schemas/ImageUrl'

        UpdateUserByIdRequestMultipart:
            type: object
            additionalProperties: false
            properties:
                email:
                    $ref: '#/components/schemas/Email'
                password:
                    $ref: '#/components/schemas/Password'
                username:
                    type: string
                admin:
                    type: boolean
                active:
                    type: boolean
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional user profile image

        DeleteUserRequest:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                hardDelete:
                    type: boolean
                    default: false

        UsersResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/User'
                meta:
                    $ref: '#/components/schemas/PaginationMeta'

