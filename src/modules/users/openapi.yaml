openapi: 3.0.3
info:
    title: users — module contract
    version: '0.1.0'

paths:
    # --------- Users ---------
    /users:
        get:
            tags: [Users]
            summary: List users (paginated)
            description: Returns a paginated list of user accounts.
            operationId: listUsers
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: sort
                  in: query
                  required: false
                  # JSON:API grammar: `?sort=-price,title` — comma-separated, `-` for descending.
                  style: form
                  explode: false
                  schema:
                      $ref: '#/components/schemas/UserSort'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/TextParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdParam'
                - name: email
                  in: query
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                - name: username
                  in: query
                  schema:
                      type: string
                - name: active
                  in: query
                  schema:
                      type: boolean
                - name: deleted
                  in: query
                  description: >-
                      `true` lists only soft-deleted rows, `false` only live ones; absent lists
                      both. Admin-effective: a caller who cannot see deleted rows at all gets an
                      empty page for `true`.
                  schema:
                      type: boolean
            responses:
                '200':
                    description: Users list page
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UsersResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        post:
            tags: [Users]
            summary: Create user
            description: Creates a new user account with the supplied email and username. A password may be supplied directly, or omitted and left to `sendSetupEmail` — see that field. Optional image can be uploaded.
            operationId: createUser
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUserRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/CreateUserRequestMultipart'
            responses:
                '201':
                    description: Created user
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/UserEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # An undeclared role or a privilege escalation the caller may not grant.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `uploadLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        delete:
            tags: [Users]
            summary: Delete user
            description: Deletes the user identified by the `id` field in the request body. Set `hardDelete` to `true`, in the query or the body, to permanently remove the record; a `true` from any source wins, so a `false` sent elsewhere does not cancel it. A soft delete is one-way and safe to repeat — undo it with `POST /users/{id}/restore`.
            operationId: deleteUser
            x-alias-of: deleteUserById
            security:
                - bearerAuth: []
            # The flag is readable from the query here too, exactly as it is on the `{id}` form:
            # one controller serves both, and `surface: 'delete'` reads params, query and body on
            # whichever route it is mounted on. Declared rather than merely tolerated.
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/HardDeleteParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeleteUserRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /users/{id}:
        # Bundler: adds the `If-Match` parameter and 412 to the writes listed, and `ETag` to the 200s.
        x-versioned: [get, put, patch, delete]
        # Same as GET /users?id={id}
        get:
            tags: [Users]
            summary: User details
            description: Returns the full profile of the user identified by `{id}`. Functionally equivalent to `GET /users?id={id}`.
            operationId: getUserById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: User
                    content:
                        application/json:
                            schema:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/UserEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        put:
            tags: [Users]
            summary: Replace user
            description: Replaces every writable field of the user identified by `{id}` in the path — RFC 9110 §9.3.4, an omitted optional field is cleared. `password` keeps its own flow and is never cleared this way; leave it out to keep it unchanged. The image is outside the representation too — set by an upload, cleared by an explicit `imageUrl` null, kept when a PUT never mentions it.
            operationId: replaceUserById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReplaceUserByIdRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/ReplaceUserByIdRequestMultipart'
            responses:
                '200':
                    description: Replaced user
                    content:
                        application/json:
                            schema:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/UserEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # An undeclared role or a privilege escalation the caller may not grant.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `uploadLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        patch:
            tags: [Users]
            summary: Edit user
            description: Merges the given fields into the user identified by `{id}` in the path — RFC 7396, an omitted field is left unchanged, `null` clears an optional one. Optional image can be uploaded.
            operationId: updateUserById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateUserByIdRequest'
                    application/merge-patch+json:
                        schema:
                            $ref: '#/components/schemas/UpdateUserByIdRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/UpdateUserByIdRequestMultipart'
            responses:
                '200':
                    description: Updated user
                    content:
                        application/json:
                            schema:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/UserEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # An undeclared role or a privilege escalation the caller may not grant.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `uploadLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        # Same as DELETE /users
        delete:
            tags: [Users]
            summary: Delete user
            description: Deletes the user identified by `{id}` in the path. Pass the `hardDelete` query parameter as `true` to permanently remove the record. A soft delete is one-way and safe to repeat — undo it with `POST /users/{id}/restore`. Functionally equivalent to `DELETE /users`.
            operationId: deleteUserById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/HardDeleteParam'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/HardDeleteRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    # Undoes a soft delete. A separate verb because DELETE must be safe to repeat (RFC 9110
    # §9.2.2): a retried DELETE never brings a record back.
    /users/{id}/restore:
        post:
            tags: [Users]
            summary: Restore user
            description: Undoes the soft delete of the user identified by `{id}`. Answers 409 when the user is not soft-deleted, so a restore can never be mistaken for an ordinary read.
            operationId: restoreUserById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: Restored user
                    content:
                        application/json:
                            schema:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/UserEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    # Same as DELETE /users/{id}?hardDelete=true — the flag spelled in the path instead of
    # in the query. Both reach the same handler; neither is the canonical one.
    /users/{id}/hard:
        # Bundler: adds the `If-Match` parameter and 412 to the writes listed, and `ETag` to the 200s.
        x-versioned: [delete]
        delete:
            tags: [Users]
            summary: Permanently delete user
            description: Permanently removes the user identified by `{id}`, rather than soft-deleting it. Functionally equivalent to `DELETE /users/{id}?hardDelete=true`.
            operationId: hardDeleteUserById
            x-alias-of: deleteUserById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /users/{id}/2fa:
        delete:
            tags: [Users]
            summary: Admin-assisted 2FA recovery
            description: Strips the user's second factor, no code required — unlike the self-service `DELETE /account/2fa`, which demands one. The one deliberate exception to "prove the factor to remove it", for an account whose owner has lost both their authenticator and their backup codes. Every call is audited.
            operationId: adminDisableUserTwoFactor
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    # Same as GET /users, but with JSON body, more suitable for DTOs and multi-language codegen
    /users/search:
        post:
            tags: [Users]
            summary: Search users (DTO-friendly)
            description: Searches and filters users via a JSON request body. Functionally equivalent to `GET /users` with query parameters
            operationId: searchUsers
            x-alias-of: listUsers
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchUsersRequest'
            responses:
                '200':
                    description: Users search results
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UsersResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # The ONE sort grammar, shared with every list (docs/api/sorting.md). `-` sorts
        # descending; earlier entries rank first; ties end on the id. Text fields sort
        # case-insensitively.
        UserSort:
            type: array
            minItems: 1
            maxItems: 3
            uniqueItems: true
            items:
                type: string
                enum: [createdAt, -createdAt, email, -email, username, -username]

        # ---------- users — the schemas only this module's paths reference. ----------
        UsersResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/UsersResponse'

        SearchUsersRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Page'
                pageSize:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PageSize'
                sort:
                    $ref: '#/components/schemas/UserSort'
                text:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Text'
                id:
                    type: array
                    minItems: 1
                    maxItems: 100
                    items: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id' }
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                username:
                    type: string
                # Filters the stored `active` column. It does NOT filter soft-deletion — that is
                # `deleted` below: the two are independent facts. `active: false` means
                # "deactivated", never "deleted".
                active:
                    type: boolean
                # `true`: only soft-deleted rows; `false`: only live ones; absent: both.
                # Admin-effective, like `active`: a caller who cannot see deleted rows at all
                # gets an empty page for `true`.
                deleted:
                    type: boolean

        CreateUserRequest:
            type: object
            additionalProperties: false
            required: [email, username]
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                username:
                    type: string
                    minLength: 3
                # Optional: an admin may set it directly (as if the user had registered it
                # themselves), or leave it out and use `sendSetupEmail` to have the user pick their
                # own instead.
                password:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PasswordNew'
                # Only meaningful when `password` is omitted. Queues the same email as
                # "forgot your password", worded for "you have no password yet" instead, carrying a
                # token the user completes their own registration with — see
                # `POST /account/reset-confirm`. Ignored when `password` is supplied.
                sendSetupEmail:
                    type: boolean
                    default: false
                role:
                    type: string
                    minLength: 1
                # Same reasoning as `CreateProductRequest.active`: independent of soft-deletion,
                # and defaulted here so both implementations derive it rather than each choosing.
                # Create bodies only — an omitted `active` on an update means "leave it alone".
                active:
                    type: boolean
                    default: true
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageRemoval'
                locale:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Locale'

        # A multipart part is a string or a file, never `null`: a clear cannot travel here. Send it as a JSON PATCH.
        CreateUserRequestMultipart:
            type: object
            additionalProperties: false
            required: [email, username]
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                username:
                    type: string
                    minLength: 3
                # Same as `CreateUserRequest.password` — optional, see `sendSetupEmail` below.
                password:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PasswordNew'
                # Same as `CreateUserRequest.sendSetupEmail`.
                sendSetupEmail:
                    type: boolean
                    default: false
                role:
                    type: string
                    minLength: 1
                # Same default, same reasoning as `CreateUserRequest.active` above.
                active:
                    type: boolean
                    default: true
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional user profile image
                locale:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Locale'

        # PATCH /users/{id} — RFC 7396: every field optional, omitted means unchanged. `password`
        # keeps its own flow (never cleared, never required) so it is optional-non-nullable on
        # both this and the Replace schema below, and never listed as clearable — the factory
        # reads clearable fields from the schema's `nullable` properties.
        UpdateUserByIdRequest:
            type: object
            additionalProperties: false
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                password:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PasswordNew'
                username:
                    type: string
                    minLength: 3
                role:
                    type: string
                    minLength: 1
                active:
                    type: boolean
                # `null` removes the image. Omitted leaves it unchanged; `''` is
                # invalid (`ImageUrl`'s own `minLength: 1`), never a third spelling of "no image".
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageRemoval'
                # `null` clears the override, falling back to the deployment default/negotiated locale.
                locale:
                    type: string
                    nullable: true
                    allOf:
                        - $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Locale'
                phone:
                    type: string
                    minLength: 1
                    nullable: true
                website:
                    type: string
                    minLength: 1
                    nullable: true

        # A multipart part is a string or a file, never `null`: a clear cannot travel here. Send it as a JSON PATCH.
        UpdateUserByIdRequestMultipart:
            type: object
            additionalProperties: false
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                password:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PasswordNew'
                username:
                    type: string
                    minLength: 3
                role:
                    type: string
                    minLength: 1
                active:
                    type: boolean
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional user profile image
                locale:
                    type: string
                    allOf:
                        - $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Locale'
                phone:
                    type: string
                    minLength: 1
                website:
                    type: string
                    minLength: 1

        # PUT /users/{id} — RFC 9110 §9.3.4: the body IS the new resource, so every writable field
        # this resource has must be nameable and the identity fields are genuinely required.
        # `password` stays optional-non-nullable, same reasoning as the Patch schema above — a PUT
        # that omits it leaves the stored hash untouched, it does not clear it.
        ReplaceUserByIdRequest:
            type: object
            additionalProperties: false
            required: [email, username, role, active]
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                password:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PasswordNew'
                username:
                    type: string
                    minLength: 3
                role:
                    type: string
                    minLength: 1
                active:
                    type: boolean
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageRemoval'
                locale:
                    type: string
                    nullable: true
                    allOf:
                        - $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Locale'
                phone:
                    type: string
                    minLength: 1
                    nullable: true
                website:
                    type: string
                    minLength: 1
                    nullable: true

        # A multipart part is a string or a file, never `null`: a clear cannot travel here. Send it as a JSON PATCH.
        ReplaceUserByIdRequestMultipart:
            type: object
            additionalProperties: false
            required: [email, username, role, active]
            properties:
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                password:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PasswordNew'
                username:
                    type: string
                    minLength: 3
                role:
                    type: string
                    minLength: 1
                active:
                    type: boolean
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional user profile image
                locale:
                    type: string
                    allOf:
                        - $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Locale'
                phone:
                    type: string
                    minLength: 1
                website:
                    type: string
                    minLength: 1

        DeleteUserRequest:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                hardDelete:
                    type: boolean
                    default: false

        UsersResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/User'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        # A live refresh session, metadata only — never the token value, which is as good as a
        # password. Used by `POST /account/export` (`shared/contracts/openapi.root.yaml`); this
        # module owns the shape since it owns the `Token` sub-document sessions live on.
        ExportSession:
            type: object
            additionalProperties: false
            required: [id, type]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                type:
                    type: string
                    enum: [refresh]
                expiration:
                    type: string
                    format: date-time
                lastUsedAt:
                    type: string
                    format: date-time
