# The users module's webhook events: `user.*`.
#
# A FRAGMENT, not a document: it refs `#/servers/subscriberEndpoint` and
# `#/components/schemas/WebhookHeaders`, which `webhooks/asyncapi.yaml` declares. The bundler
# merges it into the `webhooks` section only while that module exists
# (`scripts/contracts/asyncapi-webhook-events.ts`). Each event is the Standard Webhooks envelope
# `{ type, timestamp, data }`, ids only: a recipient got the person's data through the API, so it
# holds the `userId` (GDPR Art. 19, `docs/theory/data-protection.md`). The module's `publicEvents`
# (`module.ts`) is what fires it.
channels:
    user.erased:
        address: user.erased
        description: An account was erased.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            UserErasedEvent:
                $ref: '#/components/messages/UserErasedEvent'
    user.updated:
        address: user.updated
        description: A personal-data field of an account was rectified.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            UserUpdatedEvent:
                $ref: '#/components/messages/UserUpdatedEvent'
operations:
    webhookUserErased:
        action: send
        channel:
            $ref: '#/channels/user.erased'
        summary: An account's row was hard-deleted.
        description: >-
            Fired once per erasure, in the erasure's own transaction: an admin hard delete, the purge
            after the self-deletion grace, or the inactivity erase. Never at the lock or the start of
            the grace, never for a soft delete. The payload is the id alone, so the delivery log never
            holds a fresh copy of an erased person's address. A recipient drops what it holds under
            that `userId`.
        messages:
            - $ref: '#/channels/user.erased/messages/UserErasedEvent'
    webhookUserUpdated:
        action: send
        channel:
            $ref: '#/channels/user.updated'
        summary: A person's username, email, phone, website or picture changed.
        description: >-
            Fired once per committed change, from an admin edit, the owner's own profile edit, an
            email-change confirmation and its undo. `changed` names the fields that moved and never
            carries a value, so a recipient refetches the account through the API. A request that
            resends what is stored, an email-change request not yet confirmed, a change of
            preferences (locale, consent) and the address book fire nothing.
        messages:
            - $ref: '#/channels/user.updated/messages/UserUpdatedEvent'
components:
    messages:
        UserErasedEvent:
            name: UserErasedEvent
            title: User erased
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/UserErasedEnvelope'
        UserUpdatedEvent:
            name: UserUpdatedEvent
            title: User updated
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/UserUpdatedEnvelope'
    schemas:
        UserIdPayload:
            type: object
            required:
                - userId
            properties:
                userId:
                    $ref: '#/components/schemas/Id'
            additionalProperties: false
        UserErasedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: UserErasedEventType
                    type: string
                    enum:
                        - user.erased
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/UserIdPayload'
            additionalProperties: false
        UserUpdatedPayload:
            type: object
            required:
                - userId
                - changed
            properties:
                userId:
                    $ref: '#/components/schemas/Id'
                changed:
                    type: array
                    minItems: 1
                    items:
                        title: UserChangedField
                        type: string
                        enum:
                            - username
                            - email
                            - phone
                            - website
                            - imageUrl
            additionalProperties: false
        UserUpdatedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: UserUpdatedEventType
                    type: string
                    enum:
                        - user.updated
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/UserUpdatedPayload'
            additionalProperties: false
