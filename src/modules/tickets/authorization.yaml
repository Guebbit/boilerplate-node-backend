rules:
    # -- tickets ------------------------------------------------------------------------------
    - action: read
      subject: Ticket
      module: tickets
      scope: tenant
      description: Read tickets — contact messages, and the system tickets of a permission set the caller holds.
    - action: update
      subject: Ticket
      module: tickets
      scope: tenant
      description: Work a ticket — resolve, mark as spam, reopen, assign, add a note. A system ticket also needs the ticket's own permission set.
    - action: delete
      subject: Ticket
      module: tickets
      scope: tenant
      description: Remove a ticket. A system ticket also needs the ticket's own permission set.

sets:
    - name: TicketDisplay
      module: tickets
      description: Read tickets.
      rules:
          - read:Ticket
    - name: TicketManagement
      module: tickets
      description: Work a ticket, or remove it.
      rules:
          - update:Ticket
          - delete:Ticket
