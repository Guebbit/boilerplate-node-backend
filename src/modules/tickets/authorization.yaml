rules:
    # -- tickets ------------------------------------------------------------------------------
    - action: read
      subject: Ticket
      module: tickets
      scope: tenant
      description: Read messages sent through the contact form.
    - action: update
      subject: Ticket
      module: tickets
      scope: tenant
      description: Change a message's handling status.
    - action: delete
      subject: Ticket
      module: tickets
      scope: tenant
      description: Remove a message.

sets:
    - name: TicketDisplay
      module: tickets
      description: Read contact-form messages.
      rules:
          - read:Ticket
    - name: TicketManagement
      module: tickets
      description: Change a message's handling status, or remove it.
      rules:
          - update:Ticket
          - delete:Ticket
