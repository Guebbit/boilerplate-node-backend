openapi: 3.1.0
info:
    title: tickets — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Tickets
      description: Situations someone must take and close — what visitors tell the shop, and what the system opens for staff.

# The error codes this module answers, with the status each is sent with.
x-error-codes:
    TICKET_ALREADY_RESOLVED: { status: 409, description: 'The ticket is already resolved.' }
    TICKET_ALREADY_SPAM: { status: 409, description: 'The ticket is already marked as spam.' }
    TICKET_ALREADY_OPEN: { status: 409, description: 'The ticket is already open (new or in progress), so there is nothing to reopen.' }
    TICKET_SUPERSEDED: { status: 409, description: 'A newer open ticket already covers the same situation, so this one cannot be reopened. `details.ticketId` names the newer one.' }
    TICKET_NOT_OPEN: { status: 409, description: 'The ticket is closed; reopen it before assigning it.' }
    TICKET_ASSIGNEE_INVALID: { status: 422, description: 'The person does not exist, or does not hold the permission set that works this ticket.' }

# This module's sections of the account data export (`POST /account/export`): the bundler
# adds them to `AccountExportResponse`. Removing the module removes the sections.
x-personal-data:
    tickets:
        required: true
        schema:
            type: array
            description: >
                The contact messages this person owns: what they sent while signed in, plus what
                was sent under their verified email address. Staff notes are included without
                their author. Always present, empty when there are none.
            items:
                $ref: '#/components/schemas/ExportTicket'
    systemTickets:
        required: true
        schema:
            type: array
            description: >
                The tickets the system opened about this person (a refund owed, an account under
                review, an export that failed). Every field except the staff who handled them.
                Always present, empty when there are none.
            items:
                $ref: '#/components/schemas/ExportSystemTicket'

paths:
    /tickets:
        post:
            tags: [Tickets]
            summary: Submit contact request
            description: >
                Creates a contact ticket and notifies the support mailbox by email. Open to
                anyone. A valid session bearer token, when one is sent, records the sender's
                account on the ticket (`subjectId`), so the account's data export and erasure
                include it; an absent or expired token files it as anonymous.
            operationId: createContactTicket
            security: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/AntibotChallengeTokenHeader'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateContactTicketRequest'
            responses:
                '201':
                    description: Created ticket
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ticket'
                # A human-challenge provider is active and the caller's token is missing or refused.
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                # Also answered when `Idempotency-Key` was already used with a different body.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `contactLimiters` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
        get:
            tags: [Tickets]
            summary: List tickets
            description: >
                Returns the tickets the caller may work: every visitor message, and the system
                tickets whose route set the caller holds (an administrator holds them all). Open
                work first when sorted by `dueAt`.
            operationId: listTickets
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            # Query only, and the DTO form of the same filters is `POST /tickets/search`. A body
            # on a GET has no defined semantics (RFC 9110 9.3.1) and the Fetch spec rejects it
            # outright, so the paired frontend could never have sent one; worse, `setCache` keys
            # on the declared query parameters, so a body-borne filter was invisible to the key
            # and two different filters shared one entry for the cache's whole lifetime.
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: sort
                  in: query
                  required: false
                  # JSON:API grammar: `?sort=-price,title` — comma-separated, `-` for descending.
                  style: form
                  explode: false
                  schema:
                      $ref: '#/components/schemas/TicketSort'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/TextParam'
                - name: email
                  in: query
                  required: false
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                - name: status
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/TicketStatus'
                - name: category
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/TicketCategory'
                - name: source
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/TicketSource'
                - name: kind
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/TicketKind'
                - name: assignee
                  in: query
                  required: false
                  description: '`me`, `none` (unassigned) or a user id.'
                  schema:
                      $ref: '#/components/schemas/TicketAssigneeFilter'
                - name: overdue
                  in: query
                  required: false
                  description: Only open tickets whose `dueAt` has passed.
                  schema:
                      type: boolean
            responses:
                '200':
                    description: Ticket list
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TicketsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /tickets/search:
        post:
            tags: [Tickets]
            summary: Search tickets (DTO-friendly)
            description: Searches and filters tickets via a JSON request body. Functionally equivalent to `GET /tickets` with query parameters.
            operationId: searchTickets
            x-alias-of: listTickets
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchTicketsRequest'
            responses:
                '200':
                    description: Ticket search results
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TicketsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /tickets/summary:
        get:
            tags: [Tickets]
            summary: Counts for the staff badge
            description: >
                How much work the caller's jurisdiction holds: open tickets, the caller's own,
                the overdue ones and the unassigned ones. Never cached: it is one person's view.
            operationId: getTicketSummary
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                '200':
                    description: The counts
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TicketSummary'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }

    /tickets/{id}:
        get:
            tags: [Tickets]
            summary: Get a ticket
            description: >
                One ticket with its notes, assignee and the earlier tickets about the same record.
                A visitor ticket names a person, so staff reading it is audited. An unknown, malformed
                or out-of-jurisdiction id is a 404.
            operationId: getTicket
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The ticket
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ticket'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
        delete:
            tags: [Tickets]
            summary: Delete a ticket
            description: Permanently removes the ticket identified by `{id}`. Needs `delete:Ticket` and, for a system ticket, the ticket's route set.
            operationId: deleteTicket
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '204': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NoContent' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }

    /tickets/{id}/resolve:
        post:
            tags: [Tickets]
            summary: Resolve a ticket
            description: >
                From `new`, `in_progress` or `spam` to `resolved`, with `resolution: staff`. Stamps
                `closedAt` (kept when it was already closed) and `respondedAt` (once), and releases
                the dedup key. No body. Needs `update:Ticket` and, for a system ticket, its route set.
                The move is conditional on the status read, so a repeat answers 409.
            operationId: resolveTicket
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The ticket as it now stands
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ticket'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # TICKET_ALREADY_RESOLVED
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }

    /tickets/{id}/mark-spam:
        post:
            tags: [Tickets]
            summary: Mark a ticket as spam
            description: >
                From `new`, `in_progress` or `resolved` to `spam`, with `resolution: spam`. Same stamps
                as a resolve, without `respondedAt`. Also undoes a false resolve. No body. Needs
                `update:Ticket` and, for a system ticket, its route set.
            operationId: markTicketSpam
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The ticket as it now stands
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ticket'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # TICKET_ALREADY_SPAM
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }

    /tickets/{id}/reopen:
        post:
            tags: [Tickets]
            summary: Reopen a ticket
            description: >
                From `resolved` or `spam` to `in_progress` when it has an assignee, else `new`. Clears
                `closedAt` and `resolution` (the retention clock stops) and restores the dedup key
                of a linked ticket. `dueAt` is kept: the deadline belongs to the situation, not to
                the reopen. When a newer open ticket already covers the same situation the answer is
                409 `TICKET_SUPERSEDED` with `details.ticketId`. No body. Needs `update:Ticket` and,
                for a system ticket, its route set.
            operationId: reopenTicket
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The ticket as it now stands
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ticket'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # TICKET_ALREADY_OPEN or TICKET_SUPERSEDED
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }

    /tickets/{id}/assignee:
        put:
            tags: [Tickets]
            summary: Assign a ticket
            description: >
                Hands the ticket to one person (taking it is assigning yourself). A `new` ticket
                becomes `in_progress`. The person must hold the permission set that works the ticket.
                Replaces any earlier assignee. A closed ticket answers 409 `TICKET_NOT_OPEN`.
            operationId: assignTicket
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AssignTicketRequest'
            responses:
                '200':
                    description: The ticket as it now stands
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ticket'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
        delete:
            tags: [Tickets]
            summary: Give a ticket back
            description: Clears the assignee. An `in_progress` ticket goes back to `new`. Answers 200 whether or not anyone held it.
            operationId: unassignTicket
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The ticket as it now stands
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ticket'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
    /tickets/{id}/notes:
        post:
            tags: [Tickets]
            summary: Add a staff note
            description: >
                Appends a note to the staff thread: append-only, with its author and time. Notes are
                written and read by staff, and the data subject's export carries them without the author.
                Write each one as if the customer will read it.
            operationId: createTicketNote
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateTicketNoteRequest'
            responses:
                '201':
                    description: The ticket with the note appended
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Ticket'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

components:
    schemas:
        # The ONE sort grammar, shared with every list (docs/api/sorting.md). `-` sorts
        # descending; earlier entries rank first; ties end on the id. Text fields sort
        # case-insensitively.
        TicketSort:
            type: array
            minItems: 1
            maxItems: 3
            items:
                type: string
                enum: [createdAt, -createdAt, dueAt, -dueAt, status, -status, email, -email]

        # The closed set, written ONCE. READ-ONLY on a ticket: it moves only through the doors
        # (`resolve`, `mark-spam`, `reopen`) and through assignment, never by writing the field.
        TicketStatus:
            type: string
            enum: [new, in_progress, resolved, spam]

        # What the visitor says the message is about, so staff can triage without reading it first
        # (Q-W2 of the withdrawal decision: an order page links to `/contact?category=cancellation`).
        # `privacy` is the data-protection door (GDPR requests start here). A closed set, written
        # once, so the form, the inbox filter and the stored value cannot drift.
        TicketCategory:
            type: string
            enum: [order, cancellation, return, payment, account, privacy, other]

        # Who opened it.
        TicketSource:
            type: string
            enum: [visitor, system]

        # What the ticket is about. Each kind has one route set (the jurisdiction), frozen when it opens.
        TicketKind:
            type: string
            enum:
                [
                    contact,
                    account_review,
                    manual_refund_owed,
                    amount_mismatch,
                    paid_without_hold,
                    export_failed,
                    consent_due,
                    refund_refused,
                    dispute
                ]

        # How a closed ticket was closed: by a person, by the situation clearing itself, or as spam.
        TicketResolution:
            type: string
            enum: [staff, cleared, spam]

        TicketLinkType:
            type: string
            enum: [order, user, payment, refund, fulfillment_order, export]

        # `me`, `none`, or a user id.
        TicketAssigneeFilter:
            type: string
            minLength: 2
            maxLength: 24

        TicketLink:
            type: object
            additionalProperties: false
            required: [type, id]
            description: The record a system ticket is about.
            properties:
                type:
                    $ref: '#/components/schemas/TicketLinkType'
                id:
                    type: string

        TicketNote:
            type: object
            additionalProperties: false
            required: [body, at]
            properties:
                authorId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                    description: Absent once the author's account is erased.
                body:
                    type: string
                at:
                    type: string
                    format: date-time

        TicketRef:
            type: object
            additionalProperties: false
            required: [id, status, createdAt]
            description: An earlier ticket about the same record.
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                kind:
                    $ref: '#/components/schemas/TicketKind'
                status:
                    $ref: '#/components/schemas/TicketStatus'
                createdAt:
                    type: string
                    format: date-time

        # Computed per CALLER, not stored — present on every response carrying a ticket, list rows included.
        TicketActions:
            type: object
            additionalProperties: false
            required: [resolve, markSpam, reopen, assign, unassign, note, delete]
            description: >-
                What the requesting caller may do to this ticket, decided by the server, so a client
                renders its controls from this rather than re-implementing the lifecycle. Each needs
                the right to work the ticket (and its route set, for a system ticket) and a status
                the act can run from. `assign` covers taking it and assigning someone else.
            properties:
                resolve:
                    type: boolean
                    description: Whether `POST /tickets/{id}/resolve` would be accepted.
                markSpam:
                    type: boolean
                    description: Whether `POST /tickets/{id}/mark-spam` would be accepted.
                reopen:
                    type: boolean
                    description: Whether `POST /tickets/{id}/reopen` would be accepted.
                assign:
                    type: boolean
                    description: Whether `PUT /tickets/{id}/assignee` would be accepted.
                unassign:
                    type: boolean
                    description: Whether `DELETE /tickets/{id}/assignee` would change anything.
                note:
                    type: boolean
                    description: Whether `POST /tickets/{id}/notes` would be accepted.
                delete:
                    type: boolean
                    description: Whether `DELETE /tickets/{id}` would be accepted.

        # ---------- tickets — the schemas only this module's paths reference. ----------
        Ticket:
            type: object
            additionalProperties: false
            required: [id, source, kind, subject, message, status, routeSet, notes, overdue, createdAt, actions]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                source:
                    $ref: '#/components/schemas/TicketSource'
                kind:
                    $ref: '#/components/schemas/TicketKind'
                name:
                    type: string
                subjectId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                    description: >
                        The account the sender was signed in as; absent for an anonymous sender. On a
                        system ticket, the account the situation is about.
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                    description: The sender's address. Present on a visitor ticket, absent on a system one.
                subject:
                    type: string
                message:
                    type: string
                category:
                    $ref: '#/components/schemas/TicketCategory'
                orderNumber:
                    type: string
                    description: The order the visitor said this is about, as they typed it. Not checked against any order.
                link:
                    $ref: '#/components/schemas/TicketLink'
                routeSet:
                    type: string
                    description: The permission set that works this ticket, frozen when it opened.
                assigneeId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                assigneeName:
                    type: string
                    description: The assignee's username.
                notes:
                    type: array
                    items:
                        $ref: '#/components/schemas/TicketNote'
                dueAt:
                    type: string
                    format: date-time
                    description: When it falls overdue. Kept across a reopen.
                overdue:
                    type: boolean
                    description: Open and past `dueAt`, computed at read time.
                lastSeenAt:
                    type: string
                    format: date-time
                seenCount:
                    type: integer
                    minimum: 1
                status:
                    $ref: '#/components/schemas/TicketStatus'
                    readOnly: true
                closedAt:
                    type: string
                    format: date-time
                resolution:
                    $ref: '#/components/schemas/TicketResolution'
                respondedAt:
                    type: string
                    format: date-time
                earlierTickets:
                    type: array
                    description: Present on `GET /tickets/{id}` only.
                    items:
                        $ref: '#/components/schemas/TicketRef'
                actions:
                    $ref: '#/components/schemas/TicketActions'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        CreateContactTicketRequest:
            type: object
            additionalProperties: false
            required: [email, subject, message]
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 120
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                subject:
                    type: string
                    minLength: 1
                    maxLength: 200
                message:
                    type: string
                    minLength: 1
                    maxLength: 5000
                category:
                    $ref: '#/components/schemas/TicketCategory'
                orderNumber:
                    type: string
                    minLength: 1
                    maxLength: 40
                    description: The order the visitor says this is about, free text. Not checked against any order.
                website:
                    type: string
                    maxLength: 200
                    description: >
                        Honeypot. Hidden in the form and always submitted empty by a real client; a
                        non-empty value marks the submission as spam. Named for what a scraper
                        expects to find. Never persisted and never returned — see
                        `Ticket`, which does not declare it.

        SearchTicketsRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Page'
                pageSize:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PageSize'
                sort:
                    $ref: '#/components/schemas/TicketSort'
                text:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Text'
                status:
                    $ref: '#/components/schemas/TicketStatus'
                category:
                    $ref: '#/components/schemas/TicketCategory'
                source:
                    $ref: '#/components/schemas/TicketSource'
                kind:
                    $ref: '#/components/schemas/TicketKind'
                assignee:
                    $ref: '#/components/schemas/TicketAssigneeFilter'
                overdue:
                    type: boolean
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'

        AssignTicketRequest:
            type: object
            additionalProperties: false
            required: [userId]
            properties:
                userId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        CreateTicketNoteRequest:
            type: object
            additionalProperties: false
            required: [body]
            properties:
                body:
                    type: string
                    minLength: 1
                    maxLength: 5000

        TicketsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Ticket'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        TicketSummary:
            type: object
            additionalProperties: false
            required: [open, mine, overdue, unassigned]
            description: Counts over the caller's jurisdiction.
            properties:
                open:
                    type: integer
                    minimum: 0
                mine:
                    type: integer
                    minimum: 0
                overdue:
                    type: integer
                    minimum: 0
                unassigned:
                    type: integer
                    minimum: 0

        # What the data subject's own copy of a staff note carries: the words and the time. The
        # author stays out (the Pankki S ruling, C-579/21).
        ExportTicketNote:
            type: object
            additionalProperties: false
            required: [body, at]
            properties:
                body:
                    type: string
                at:
                    type: string
                    format: date-time

        # Used by `POST /account/export` (`shared/contracts/openapi.root.yaml`). Staff notes are
        # included WITHOUT their author: a note is an assessment of the person (CJEU C-434/16), and
        # who wrote it is the colleague's data, not theirs. `toExportTicket` in `service.ts` builds it.
        ExportTicket:
            type: object
            additionalProperties: false
            required: [id, email, subject, message, status, notes]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                name:
                    type: string
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                subject:
                    type: string
                message:
                    type: string
                category:
                    $ref: '#/components/schemas/TicketCategory'
                orderNumber:
                    type: string
                status:
                    $ref: '#/components/schemas/TicketStatus'
                notes:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExportTicketNote'
                respondedAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time

        # A ticket the system opened about the person. Every field except the staff behind it
        # (`assigneeId`, the notes' authors) and the dedup key.
        ExportSystemTicket:
            type: object
            additionalProperties: false
            required: [id, kind, subject, message, status, routeSet, notes]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                kind:
                    $ref: '#/components/schemas/TicketKind'
                subject:
                    type: string
                message:
                    type: string
                link:
                    $ref: '#/components/schemas/TicketLink'
                routeSet:
                    type: string
                status:
                    $ref: '#/components/schemas/TicketStatus'
                resolution:
                    $ref: '#/components/schemas/TicketResolution'
                notes:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExportTicketNote'
                dueAt:
                    type: string
                    format: date-time
                lastSeenAt:
                    type: string
                    format: date-time
                seenCount:
                    type: integer
                    minimum: 1
                respondedAt:
                    type: string
                    format: date-time
                closedAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
