rules:
    # -- examples ------------------------------------------------------------------------------
    # The plain actions are the caller's own rows (the condition rides into the query). `display`
    # and `admin` are the staff doors: every row, whoever owns it. An admin holds both; delete this
    # file with the module and its rules and sets leave with it.
    - action: read
      subject: Example
      module: example
      scope: tenant
      credential: false
      description: Read the caller's own examples, drafts included.
      conditions:
          userId: $caller.id
    - action: create
      subject: Example
      module: example
      scope: tenant
      credential: false
      description: Write a new example of one's own.
    - action: update
      subject: Example
      module: example
      scope: tenant
      credential: false
      description: Edit the caller's own examples, and move them through draft, published and archived.
      conditions:
          userId: $caller.id
    - action: delete
      subject: Example
      module: example
      scope: tenant
      credential: false
      description: Remove the caller's own examples.
      conditions:
          userId: $caller.id
    - action: display
      subject: Example
      module: example
      scope: tenant
      credential: false
      description: Read every example, whoever owns it.
    - action: admin
      subject: Example
      module: example
      scope: tenant
      credential: false
      description: Edit or remove any example, whoever owns it.

sets:
    - name: ExampleAuthoring
      module: example
      description: Read, write, edit and remove one's own examples. Staff-only, since a shopper authors no storefront content.
      rules:
          - read:Example
          - create:Example
          - update:Example
          - delete:Example
    - name: ExampleManagement
      module: example
      description: Read, edit and remove every example, whoever owns it.
      rules:
          - display:Example
          - admin:Example
