summary: 'The example to copy when starting a new domain: a small note with a draft, published, archived life. Delete it once you have your own.'
subdomain: generic
group: example
dependsOn:
    - users # the owner's display name, and the address a publish mail goes to
rateLimits:
    exampleCreate:
        name: Example creation
        namespace: example-create
        environmentVariable: NODE_EXAMPLE_RATE_LIMIT_MAX
        defaultMax: 30
        windowMs: shared
        bounds: Examples created through `POST /examples`, spent by success.
        audited: true
