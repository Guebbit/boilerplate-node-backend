openapi: 3.1.0
info:
    title: example — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Examples
      description: The example module - the small, complete domain to copy when starting a new one. Safe to delete.

x-error-codes:
    EXAMPLE_NOT_PUBLISHABLE: { status: 409, description: 'Only a draft can be published, or another request moved the example first. `errors[].details` is `{ status }`, the status it holds now; `Example.actions.publish` says whether the door is open.' }
    EXAMPLE_NOT_ARCHIVABLE: { status: 409, description: 'Only a draft or a published example can be archived, or another request moved it first. `errors[].details` is `{ status }`; `Example.actions.archive` says whether the door is open.' }
    EXAMPLE_NOT_UNARCHIVABLE: { status: 409, description: 'Only an archived example can go back to draft, or another request moved it first. `errors[].details` is `{ status }`; `Example.actions.unarchive` says whether the door is open.' }

# This module's section of the account data export (`POST /account/export`): the bundler
# adds it to `AccountExportResponse`. Removing the module removes the section.
x-personal-data:
    # Every example this account owns, drafts and archived included. Empty, never absent.
    examples:
        schema:
            type: array
            items:
                $ref: '#/components/schemas/ExportExample'

paths:
    /examples:
        get:
            tags: [Examples]
            summary: List examples
            description: Returns the caller's own examples, newest first by default. A caller holding `display:Example` sees everyone's.
            operationId: listExamples
            security:
                - bearerAuth: []
            # Query only; the DTO form of the same filters is `POST /examples/search`.
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: sort
                  in: query
                  required: false
                  # JSON:API grammar: `?sort=-createdAt,title` — comma-separated, `-` for descending.
                  style: form
                  explode: false
                  schema:
                      $ref: '#/components/schemas/ExampleSort'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/TextParam'
                - name: status
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/ExampleStatus'
            responses:
                '200':
                    description: Example list
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExamplesResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        post:
            tags: [Examples]
            summary: Create an example
            description: Creates a draft example owned by the caller. Sending `Idempotency-Key` makes a retry safe, since the same key replays the first answer.
            operationId: createExample
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateExampleRequest'
            responses:
                '201':
                    description: Created example
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Example'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                # Also a key reused with a different body.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `createExampleLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /examples/search:
        post:
            tags: [Examples]
            summary: Search examples (DTO-friendly)
            description: Searches and filters examples via a JSON request body. Functionally equivalent to `GET /examples` with query parameters.
            operationId: searchExamples
            x-alias-of: listExamples
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchExamplesRequest'
            responses:
                '200':
                    description: Example search results
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExamplesResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /examples/{id}:
        # Bundler: adds the `If-Match` parameter and 412 to the writes listed, and `ETag` to the 200s.
        x-versioned: [get, put, patch, delete]
        get:
            tags: [Examples]
            summary: Read an example
            description: >-
                Returns one example, scoped by the caller as `GET /products/{id}` is. A `published`
                example is open to anyone, signed in or not. The owner also reads their own drafts
                and archived ones, and a caller holding `display:Example` reads any. Everything else
                answers `404`, never `403`, so an id reveals nothing about who owns it or whether a
                draft exists. The answer varies by caller and language, so it is never shared-cached.
            operationId: getExampleById
            security:
                - {}
                - bearerAuth: []
                - cookieAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The example
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Example'
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        put:
            tags: [Examples]
            summary: Replace an example
            description: Replaces the example's writable fields (RFC 9110 §9.3.4). `title` and `body` are required, since a PUT names the whole representation. The status moves through `POST /examples/{id}/publish|archive|unarchive`.
            operationId: replaceExampleById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReplaceExampleRequest'
            responses:
                '200':
                    description: Replaced example
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Example'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        patch:
            tags: [Examples]
            summary: Update an example
            description: Merges a change into the example (RFC 7396, an omitted field is left unchanged).
            operationId: updateExampleById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateExampleRequest'
                    application/merge-patch+json:
                        schema:
                            $ref: '#/components/schemas/UpdateExampleRequest'
            responses:
                '200':
                    description: Updated example
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Example'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        delete:
            tags: [Examples]
            summary: Delete an example
            description: Permanently removes the example identified by `{id}`, and its cover image with it.
            operationId: deleteExampleById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '204': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NoContent' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    # One door per lifecycle event, not a PATCH field and not one generic door: a move into
    # `published` writes an outbox event and mails the owner, and `update` does not decide
    # (docs/theory/tactical-ddd.md). No `If-Match`: the write is conditional on the status read, so
    # of two racing moves exactly one lands.
    /examples/{id}/publish:
        post:
            tags: [Examples]
            summary: Publish an example
            description: >-
                Moves a draft to `published`. Stamps `publishedAt` the first time, announces
                `example.published` and mails the owner. Whether the door is open is the caller's
                `Example.actions.publish`. Another person's example answers `404`, as every write here
                does. Answers `409` `EXAMPLE_NOT_PUBLISHABLE` from any other status.
            operationId: publishExample
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The example, published
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Example'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `errors[].code` is `EXAMPLE_NOT_PUBLISHABLE`: not a move from the current status, or a racing
                # move landed first.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /examples/{id}/archive:
        post:
            tags: [Examples]
            summary: Archive an example
            description: >-
                Moves a draft or a published example to `archived`. Whether the door is open is the
                caller's `Example.actions.archive`. Another person's example answers `404`. Answers
                `409` `EXAMPLE_NOT_ARCHIVABLE` from any other status.
            operationId: archiveExample
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The example, archived
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Example'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `errors[].code` is `EXAMPLE_NOT_ARCHIVABLE`: not a move from the current status, or a racing
                # move landed first.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /examples/{id}/unarchive:
        post:
            tags: [Examples]
            summary: Return an archived example to draft
            description: >-
                Moves an archived example back to `draft`; publishing it again keeps the original
                `publishedAt`. Whether the door is open is the caller's `Example.actions.unarchive`.
                Another person's example answers `404`. Answers `409` `EXAMPLE_NOT_UNARCHIVABLE` from
                any other status.
            operationId: unarchiveExample
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The example, back in draft
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Example'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `errors[].code` is `EXAMPLE_NOT_UNARCHIVABLE`: not a move from the current status, or a racing
                # move landed first.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    # Its own route rather than a field on create and update: an upload travels as multipart, and
    # keeping it apart leaves the JSON writes above plain. Delete `controllers/put-example-cover.ts`,
    # `cover.ts` and this path to drop the capability.
    /examples/{id}/cover:
        put:
            tags: [Examples]
            summary: Set an example's cover image
            description: Replaces the cover image of the example identified by `{id}`. The image is digested in the background; until it is, `imageUrl` is a placeholder.
            operationId: replaceExampleCover
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/ReplaceExampleCoverRequestMultipart'
            responses:
                '200':
                    description: The example, with its new cover
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Example'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `uploadLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # The ONE sort grammar, shared with every list (docs/api/sorting.md). `-` sorts
        # descending; earlier entries rank first; ties end on the id.
        ExampleSort:
            type: array
            minItems: 1
            maxItems: 3
            items:
                type: string
                enum: [createdAt, -createdAt, title, -title, status, -status]

        # draft -> published -> archived, and archived -> draft to bring one back. Nothing else:
        # a published example is withdrawn by archiving it, never by turning it back into a draft.
        ExampleStatus:
            type: string
            enum: [draft, published, archived]

        Example:
            type: object
            additionalProperties: false
            required: [id, title, body, status, userId, ownerName, createdAt, actions]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                title:
                    type: string
                    description: The fallback-language title. Other languages are written through `/locales/translations/example/{id}`.
                body:
                    type: string
                status:
                    $ref: '#/components/schemas/ExampleStatus'
                userId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                # Read from `users` when the example is presented, never stored here.
                ownerName:
                    type: string
                    description: The owner's display name.
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageUrl'
                thumbnailUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ThumbnailUrl'
                publishedAt:
                    type: string
                    format: date-time
                    description: Stamped the first time the example is published, never moved again.
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                # Always present. A stranger on the public read gets every flag false and no moves.
                actions:
                    $ref: '#/components/schemas/ExampleActions'

        # An example as the account's data export carries it: `actions` is per caller, so it
        # never leaves in an export.
        ExportExample:
            type: object
            additionalProperties: false
            required: [id, title, body, status, userId, ownerName, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                title:
                    type: string
                body:
                    type: string
                status:
                    $ref: '#/components/schemas/ExampleStatus'
                userId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                ownerName:
                    type: string
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageUrl'
                thumbnailUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ThumbnailUrl'
                publishedAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        ExampleActions:
            type: object
            additionalProperties: false
            required: [publish, archive, unarchive, update, delete]
            description: >-
                What the requesting caller may do to this example, decided by the server. A client
                renders its controls from this instead of re-implementing the lifecycle or the
                ownership rule: both depend on who asks, and a second copy in a separately deployed
                client is how the two come to disagree.
            properties:
                publish:
                    type: boolean
                    description: Whether `POST /examples/{id}/publish` would be accepted for this caller, from the status the example holds now.
                archive:
                    type: boolean
                    description: Whether `POST /examples/{id}/archive` would be accepted for this caller, from the status the example holds now.
                unarchive:
                    type: boolean
                    description: Whether `POST /examples/{id}/unarchive` would be accepted for this caller, from the status the example holds now.
                update:
                    type: boolean
                    description: Whether `PATCH`/`PUT /examples/{id}` and `PUT /examples/{id}/cover` would be accepted for this caller.
                delete:
                    type: boolean
                    description: Whether `DELETE /examples/{id}` would be accepted for this caller.

        CreateExampleRequest:
            type: object
            additionalProperties: false
            required: [title, body]
            properties:
                title:
                    type: string
                    minLength: 1
                    maxLength: 200
                # The hard ceiling. A deployment may set a lower one with `NODE_EXAMPLE_BODY_MAX_LENGTH`.
                body:
                    type: string
                    minLength: 1
                    maxLength: 20000

        SearchExamplesRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Page'
                pageSize:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PageSize'
                sort:
                    $ref: '#/components/schemas/ExampleSort'
                text:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Text'
                status:
                    $ref: '#/components/schemas/ExampleStatus'

        # PUT /examples/{id} — the body IS the new representation, so every writable field is required.
        ReplaceExampleRequest:
            type: object
            additionalProperties: false
            required: [title, body]
            properties:
                title:
                    type: string
                    minLength: 1
                    maxLength: 200
                body:
                    type: string
                    minLength: 1
                    maxLength: 20000

        # PATCH /examples/{id} — RFC 7396: every field optional, omitted means unchanged.
        UpdateExampleRequest:
            type: object
            additionalProperties: false
            properties:
                title:
                    type: string
                    minLength: 1
                    maxLength: 200
                body:
                    type: string
                    minLength: 1
                    maxLength: 20000

        ReplaceExampleCoverRequestMultipart:
            type: object
            additionalProperties: false
            required: [imageUpload]
            properties:
                imageUpload:
                    type: string
                    format: binary

        ExamplesResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Example'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'
