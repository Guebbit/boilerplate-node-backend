        # ---------- feedback — the schemas only this module's paths reference. ----------
        FeedbackRequestEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/FeedbackRequest'

        FeedbackRequestsResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success: *envelopeSuccess
                status: *envelopeStatus
                message: *envelopeMessage
                data:
                    $ref: '#/components/schemas/FeedbackRequestsResponse'

        FeedbackRequest:
            type: object
            additionalProperties: false
            required: [id, email, subject, message, status, createdAt]
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
                email:
                    $ref: '#/components/schemas/Email'
                subject:
                    type: string
                message:
                    type: string
                status:
                    type: string
                    enum: [new, in_progress, resolved, spam]
                adminNotes:
                    type: string
                respondedAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        CreateFeedbackRequest:
            type: object
            additionalProperties: false
            required: [email, subject, message]
            properties:
                name:
                    type: string
                email:
                    $ref: '#/components/schemas/Email'
                subject:
                    type: string
                message:
                    type: string

        SearchFeedbackRequestsRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    $ref: '#/components/schemas/Page'
                pageSize:
                    $ref: '#/components/schemas/PageSize'
                text:
                    $ref: '#/components/schemas/Text'
                status:
                    type: string
                    enum: [new, in_progress, resolved, spam]
                email:
                    $ref: '#/components/schemas/Email'

        UpdateFeedbackRequestStatusRequest:
            type: object
            additionalProperties: false
            properties:
                status:
                    type: string
                    enum: [new, in_progress, resolved, spam]
                adminNotes:
                    type: string

        FeedbackRequestsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/FeedbackRequest'
                meta:
                    $ref: '#/components/schemas/PaginationMeta'

