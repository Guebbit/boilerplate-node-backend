    /feedback/contact:
        post:
            tags: [Feedback]
            summary: Submit contact request
            description: Creates a user feedback/contact request and notifies admins via email.
            operationId: createFeedbackRequest
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateFeedbackRequest'
            responses:
                '201':
                    description: Created feedback request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedbackRequestEnvelope'
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    /feedback:
        get:
            tags: [Feedback]
            summary: List feedback requests
            description: Returns feedback/contact requests for admin review.
            operationId: listFeedbackRequests
            security:
                - bearerAuth: []
            # The controller merges query and body, so every filter below is reachable either way.
            # The body stays declared because it is read; unlike the other three resources this
            # one has no `POST /feedback/search` sibling to carry the DTO form.
            parameters:
                - $ref: '#/components/parameters/PageParam'
                - $ref: '#/components/parameters/PageSizeParam'
                - $ref: '#/components/parameters/TextParam'
                - name: email
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/Email'
                - name: status
                  in: query
                  required: false
                  schema:
                      type: string
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchFeedbackRequestsRequest'
            responses:
                '200':
                    description: Feedback request list
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedbackRequestsResponseEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    /feedback/{id}:
        put:
            tags: [Feedback]
            summary: Update feedback request status
            description: Updates status/notes of a feedback request.
            operationId: updateFeedbackRequestStatus
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateFeedbackRequestStatusRequest'
            responses:
                '200':
                    description: Updated feedback request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedbackRequestEnvelope'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '500': { $ref: '#/components/responses/InternalError' }

    # ----- Products -----

