openapi: 3.0.3
info:
    title: feedback — module contract
    version: '2.0.0'

paths:
    /feedback/contact:
        post:
            tags: [Feedback]
            summary: Submit contact request
            description: Creates a user feedback/contact request and notifies admins via email.
            operationId: createFeedbackRequest
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateFeedbackRequest'
            responses:
                '201':
                    description: Created feedback request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedbackRequestEnvelope'
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /feedback:
        get:
            tags: [Feedback]
            summary: List feedback requests
            description: Returns feedback/contact requests for admin review.
            operationId: listFeedbackRequests
            security:
                - bearerAuth: []
            # Query only, and the DTO form of the same filters is `POST /feedback/search`. A body
            # on a GET has no defined semantics (RFC 9110 9.3.1) and the Fetch spec rejects it
            # outright, so the paired frontend could never have sent one; worse, `setCache` keys
            # on the declared query parameters, so a body-borne filter was invisible to the key
            # and two different filters shared one entry for the cache's whole lifetime.
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/TextParam'
                - name: email
                  in: query
                  required: false
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                - name: status
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/FeedbackRequestStatus'
            responses:
                '200':
                    description: Feedback request list
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedbackRequestsResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /feedback/search:
        post:
            tags: [Feedback]
            summary: Search feedback requests (DTO-friendly)
            description: Searches and filters feedback requests via a JSON request body. Functionally equivalent to `GET /feedback` with query parameters.
            operationId: searchFeedbackRequests
            x-alias-of: listFeedbackRequests
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchFeedbackRequestsRequest'
            responses:
                '200':
                    description: Feedback request search results
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedbackRequestsResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /feedback/{id}:
        put:
            tags: [Feedback]
            summary: Update feedback request status
            description: Updates status/notes of a feedback request.
            operationId: updateFeedbackRequestStatus
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateFeedbackRequestStatusRequest'
            responses:
                '200':
                    description: Updated feedback request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedbackRequestEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        delete:
            tags: [Feedback]
            summary: Delete feedback request
            description: Permanently removes the feedback request identified by `{id}`.
            operationId: deleteFeedbackRequest
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # ---------- feedback — the schemas only this module's paths reference. ----------
        FeedbackRequestEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/FeedbackRequest'

        FeedbackRequestsResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/FeedbackRequestsResponse'

        FeedbackRequest:
            type: object
            additionalProperties: false
            required: [id, email, subject, message, status, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                name:
                    type: string
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                subject:
                    type: string
                message:
                    type: string
                status:
                    $ref: '#/components/schemas/FeedbackRequestStatus'
                adminNotes:
                    type: string
                respondedAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        # The closed set, written ONCE. Named for the type orval ALREADY derived from the inline
        # copy on `FeedbackRequest.status`, so extracting it renames nothing: the paired frontend
        # imports `FeedbackRequestStatus` in five places. A tidier `FeedbackStatus` would have
        # been a silent breaking change to a generated type — the duplication is what goes away,
        # not the name.
        #
        # It was written out four times and omitted from a fifth —
        # `GET /feedback`'s `status` query parameter declared a bare `type: string` while
        # `POST /feedback/search` declared the enum, so the two spellings of one filter validated
        # differently. That is the drift a duplicated filter set invites; `$ref` is the answer.
        FeedbackRequestStatus:
            type: string
            enum: [new, in_progress, resolved, spam]

        CreateFeedbackRequest:
            type: object
            additionalProperties: false
            required: [email, subject, message]
            properties:
                name:
                    type: string
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'
                subject:
                    type: string
                message:
                    type: string
                website:
                    type: string
                    maxLength: 200
                    description: >
                        Honeypot. Hidden in the form and always submitted empty by a real client; a
                        non-empty value marks the submission as spam. Named for what a scraper
                        expects to find. Never persisted and never returned — see
                        `FeedbackRequest`, which does not declare it.

        SearchFeedbackRequestsRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Page'
                pageSize:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PageSize'
                text:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Text'
                status:
                    $ref: '#/components/schemas/FeedbackRequestStatus'
                email:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Email'

        UpdateFeedbackRequestStatusRequest:
            type: object
            additionalProperties: false
            properties:
                status:
                    $ref: '#/components/schemas/FeedbackRequestStatus'
                adminNotes:
                    type: string

        FeedbackRequestsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/FeedbackRequest'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'
