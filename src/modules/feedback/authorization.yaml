rules:
    # -- feedback ------------------------------------------------------------------------------
    - action: read
      subject: Feedback
      module: feedback
      scope: tenant
      description: Read messages sent through the contact form.
    - action: update
      subject: Feedback
      module: feedback
      scope: tenant
      description: Change a message's handling status.
    - action: delete
      subject: Feedback
      module: feedback
      scope: tenant
      description: Remove a message.

sets:
    - name: FeedbackDisplay
      module: feedback
      description: Read contact-form messages.
      rules:
          - read:Feedback
    - name: FeedbackManagement
      module: feedback
      description: Change a message's handling status, or remove it.
      rules:
          - update:Feedback
          - delete:Feedback
