rules:
    # -- webhooks --------------------------------------------------------------------------------
    - action: read
      subject: WebhookSubscription
      module: webhooks
      scope: tenant
      description: Read this shop's webhook subscriptions, delivery log and event catalogue.
    - action: create
      subject: WebhookSubscription
      module: webhooks
      scope: tenant
      description: Add a subscription, minting its first secret.
    - action: update
      subject: WebhookSubscription
      module: webhooks
      scope: tenant
      description: >-
          Change a subscription, rotate or drop a secret from its ring, and replay a delivery. The
          blast radius of all three is the same — a party this shop did not intend gets signed
          deliveries — so they share one key.
    - action: delete
      subject: WebhookSubscription
      module: webhooks
      scope: tenant
      description: Remove a subscription. Separate from update because the blast radius is.

sets:
    - name: WebhookDisplay
      module: webhooks
      description: Read subscriptions, deliveries and the event catalogue.
      rules:
          - read:WebhookSubscription
    - name: WebhookManagement
      module: webhooks
      description: Add, change, replay and remove subscriptions.
      rules:
          - create:WebhookSubscription
          - update:WebhookSubscription
          - delete:WebhookSubscription
