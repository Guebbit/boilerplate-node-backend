summary: "Outbound event delivery to a subscriber's own URL."
subdomain: generic
group: foundation
dependsOn: []
jobs:
    sweepWebhookRetries:
        name: sweep:webhook-retries
        # Every minute: the sweep interval IS the retry granularity.
        schedule: '* * * * *'
        summary: Re-enqueues a webhook delivery whose `nextAttemptAt` has come — the delayed-retry
            story's other half.
