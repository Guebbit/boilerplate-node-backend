# The webhooks module's async contract — the public event catalogue.
#
# A complete AsyncAPI document on its own (see `observability/asyncapi.yaml`'s header for why),
# merged by the bundler into `asyncapi.yaml` AND `asyncapi.public.yaml` — this is a `shared`
# section (`scripts/contracts/asyncapi-bundles.ts`), unlike the queue this module also owns
# (`worker.webhook.deliver`, in `./asyncapi.internal.yaml`, backend-only — its own private
# section, since this file's `shared` scope is exactly what a queue must never be). That split IS
# the module's whole point: `GET /webhooks/events` serves this section straight out of this very
# file, so the catalogue a subscriber reads and the events this module can actually fire can never
# drift apart.
#
# `webhooks/module.ts`'s `onRegistered` hook subscribes generically to every domain event a
# registered module's manifest names a `publicEvents` entry for (`kernel/registry.ts`'s
# `PublicEventTarget`) and republishes the ones a subscription's filter matches, signed, to
# the URL it names. `orders`/`payments` own the MAPPING — which domain event, projected how,
# becomes which public name — on their own `module.ts`; nothing here or in `webhooks` imports the
# other module's event constants.
#
# This file still owns the CHANNEL CATALOGUE below, though, rather than each event's owning module
# splitting off its own channel: every one binds to the single `subscriberEndpoint` server and
# every envelope shares the single `WebhookHeaders` schema declared once here, and the bundler's
# merge refuses two sections declaring the same key (`asyncapi-bundles.ts`'s `mergeInto`) while a
# section is also required to be a complete, standalone-valid document — a channel `$ref`-ing a
# server or schema it does not itself declare fails `lint:asyncapi:modules` on that section alone.
# Splitting the channel catalogue by owning module is therefore its own follow-up decision, not
# assumed here. The shop's names below are its worked example (`example.published` is the `example` module's, there to be copied); a deployment with no orders
# removes `orders`/`payments` and their `publicEvents` declarations, and deletes the now-unreachable
# channels here by hand — this file is authored, not generated from those modules.
#
# Every body is the Standard Webhooks envelope, `{ type, timestamp, data }` — `type` names the
# event (so a subscriber on more than one event type can tell them apart without inspecting
# `data`'s shape), `timestamp` is when the underlying event occurred (stable across retries of the
# same delivery), and `data` is the per-event payload below, unchanged. The `webhook-id`/
# `webhook-timestamp`/`webhook-signature` headers carry the delivery id and signature — see
# `transport/webhook-signing.ts`; `id` is NOT repeated in the body.
asyncapi: 3.0.0
info:
    title: Webhooks async contract
    version: 0.1.0
    description: The events a webhook subscription may receive.
servers:
    subscriberEndpoint:
        # A VARIABLE server, not a fixed host: every subscription names its own HTTPS URL, so there
        # is no one address this document can print. `asyncapi-servers`/`asyncapi-channel-servers`
        # (`spectral.asyncapi.modules.yaml`) still pass, because the channels below DO bind to a
        # declared server — it just resolves per subscription instead of per deployment.
        #
        # Not a server this application runs — the reverse of every other section's server: a
        # subscriber genuinely subscribes to receive these, over a connection this application
        # opens outbound.
        host: '{subscriberHost}'
        pathname: '{subscriberPath}'
        protocol: https
        variables:
            subscriberHost:
                default: example.com
                description: Host (and port, when non-default) of a subscription's configured URL.
            subscriberPath:
                default: /webhooks/inbox
                description: Path of a subscription's configured URL.
channels:
    order.created:
        address: order.created
        description: A new order was placed.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderCreatedEvent:
                $ref: '#/components/messages/OrderCreatedEvent'
    order.paid:
        address: order.paid
        description: An order's payment settled.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderPaidEvent:
                $ref: '#/components/messages/OrderPaidEvent'
    order.shipped:
        address: order.shipped
        description: An order was marked shipped.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderShippedEvent:
                $ref: '#/components/messages/OrderShippedEvent'
    order.cancelled:
        address: order.cancelled
        description: An order was cancelled.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            OrderCancelledEvent:
                $ref: '#/components/messages/OrderCancelledEvent'
    payment.succeeded:
        address: payment.succeeded
        description: A payment settled successfully.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentSucceededEvent:
                $ref: '#/components/messages/PaymentSucceededEvent'
    payment.failed:
        address: payment.failed
        description: A payment attempt was declined.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentFailedEvent:
                $ref: '#/components/messages/PaymentFailedEvent'
    payment.refunded:
        address: payment.refunded
        description: A refund on a payment settled — the whole payment, or a part of it.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            PaymentRefundedEvent:
                $ref: '#/components/messages/PaymentRefundedEvent'
    return.requested:
        address: return.requested
        description: A return was opened — a withdrawal or a request.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            ReturnRequestedEvent:
                $ref: '#/components/messages/ReturnRequestedEvent'
    return.received:
        address: return.received
        description: Returned goods arrived and went back on sale.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            ReturnReceivedEvent:
                $ref: '#/components/messages/ReturnReceivedEvent'
    return.closed:
        address: return.closed
        description: A return finished — the money went back.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            ReturnClosedEvent:
                $ref: '#/components/messages/ReturnClosedEvent'
    example.published:
        address: example.published
        description: An example was published. The `example` module's one webhook, there to be copied.
        servers:
            - $ref: '#/servers/subscriberEndpoint'
        messages:
            ExamplePublishedEvent:
                $ref: '#/components/messages/ExamplePublishedEvent'
operations:
    webhookOrderCreated:
        action: send
        channel:
            $ref: '#/channels/order.created'
        summary: An order was written for the first time.
        description: >-
            Fired once per order, from both an admin create and a storefront checkout — see
            `orders/services/crud.ts`'s `recordCreated`.
        messages:
            - $ref: '#/channels/order.created/messages/OrderCreatedEvent'
    webhookOrderPaid:
        action: send
        channel:
            $ref: '#/channels/order.paid'
        summary: An order moved to the `paid` status.
        description: >-
            Derived from `order.status_changed` (`to: 'paid'`) rather than its own domain
            event — see `orders/events.ts`: "listeners filter on `to`; the event doesn't know
            who cares."
        messages:
            - $ref: '#/channels/order.paid/messages/OrderPaidEvent'
    webhookOrderShipped:
        action: send
        channel:
            $ref: '#/channels/order.shipped'
        summary: An order moved to the `shipped` status.
        description: Derived from `order.status_changed` filtered to `to = 'shipped'`, same as `order.paid`.
        messages:
            - $ref: '#/channels/order.shipped/messages/OrderShippedEvent'
    webhookOrderCancelled:
        action: send
        channel:
            $ref: '#/channels/order.cancelled'
        summary: A cancel went through; stock is already back on the shelf.
        description: One-to-one with the `order.cancelled` domain event — see `orders/events.ts`.
        messages:
            - $ref: '#/channels/order.cancelled/messages/OrderCancelledEvent'
    webhookPaymentSucceeded:
        action: send
        channel:
            $ref: '#/channels/payment.succeeded'
        summary: A payment reached `succeeded`.
        description: One-to-one with the `payment.succeeded` domain event — see `payments/events.ts`.
        messages:
            - $ref: '#/channels/payment.succeeded/messages/PaymentSucceededEvent'
    webhookPaymentFailed:
        action: send
        channel:
            $ref: '#/channels/payment.failed'
        summary: A payment reached `declined`.
        description: >-
            One-to-one with the `payment.failed` domain event. Retryable with another method,
            so this can fire more than once for the same order.
        messages:
            - $ref: '#/channels/payment.failed/messages/PaymentFailedEvent'
    webhookPaymentRefunded:
        action: send
        channel:
            $ref: '#/channels/payment.refunded'
        summary: A refund on a payment settled.
        description: >-
            One-to-one with the `payment.refunded` domain event — see `payments/services/refunds.ts`'s
            `settleRefund`. Fired once per refund, whether an operator asked for it directly or the
            `ORDER_REFUND_OWED` retry sweep completed it; never fired for a hand-paid refund left
            for an operator to confirm by hand.
        messages:
            - $ref: '#/channels/payment.refunded/messages/PaymentRefundedEvent'
    webhookReturnRequested:
        action: send
        channel:
            $ref: '#/channels/return.requested'
        summary: A return was opened — a withdrawal or a request.
        description: >-
            One-to-one with the `return.requested` domain event — see `returns/services/create.ts`.
            A withdrawal before dispatch fires it too, followed at once by `return.closed`: the
            return is born closed, and `order.cancelled` says the order was cancelled.
        messages:
            - $ref: '#/channels/return.requested/messages/ReturnRequestedEvent'
    webhookReturnReceived:
        action: send
        channel:
            $ref: '#/channels/return.received'
        summary: Returned goods arrived and went back on sale.
        description: >-
            One-to-one with the `return.received` domain event — see `returns/services/receive.ts`.
            The stock movement and the status move committed together before this fired.
        messages:
            - $ref: '#/channels/return.received/messages/ReturnReceivedEvent'
    webhookReturnClosed:
        action: send
        channel:
            $ref: '#/channels/return.closed'
        summary: A return finished — the money went back.
        description: >-
            One-to-one with the `return.closed` domain event — see `returns/services/close.ts`.
            Fired when the refund settles: straight after the goods were received, or later when
            the payment sweep completed a refund the provider first refused. A withdrawal before
            dispatch fires it at birth, right after `return.requested`.
        messages:
            - $ref: '#/channels/return.closed/messages/ReturnClosedEvent'
    webhookExamplePublished:
        action: send
        channel:
            $ref: '#/channels/example.published'
        summary: An example was published.
        description: >-
            One-to-one with the `example.published` domain event — see `example/services/crud.ts`. Fired
            each time an example moves to `published`, including after being archived and brought back.
        messages:
            - $ref: '#/channels/example.published/messages/ExamplePublishedEvent'
components:
    messages:
        OrderCreatedEvent:
            name: OrderCreatedEvent
            title: Order created
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderCreatedEnvelope'
        OrderPaidEvent:
            name: OrderPaidEvent
            title: Order paid
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderPaidEnvelope'
        OrderShippedEvent:
            name: OrderShippedEvent
            title: Order shipped
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderShippedEnvelope'
        OrderCancelledEvent:
            name: OrderCancelledEvent
            title: Order cancelled
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/OrderCancelledEnvelope'
        PaymentSucceededEvent:
            name: PaymentSucceededEvent
            title: Payment succeeded
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentSucceededEnvelope'
        PaymentFailedEvent:
            name: PaymentFailedEvent
            title: Payment failed
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentFailedEnvelope'
        PaymentRefundedEvent:
            name: PaymentRefundedEvent
            title: Payment refunded
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/PaymentRefundedEnvelope'
        ReturnReceivedEvent:
            name: ReturnReceivedEvent
            title: Return received
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/ReturnReceivedEnvelope'
        ReturnClosedEvent:
            name: ReturnClosedEvent
            title: Return closed
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/ReturnClosedEnvelope'
        ExamplePublishedEvent:
            name: ExamplePublishedEvent
            title: Example published
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/ExamplePublishedEnvelope'
        ReturnRequestedEvent:
            name: ReturnRequestedEvent
            title: Return requested
            headers:
                $ref: '#/components/schemas/WebhookHeaders'
            payload:
                $ref: '#/components/schemas/ReturnRequestedEnvelope'
    schemas:
        WebhookHeaders:
            type: object
            description: >-
                The three Standard Webhooks headers every delivery carries — see
                `transport/webhook-signing.ts`. Documented here for the subscriber reading this
                catalogue; nothing in this repo generates types off a message's `headers`.
            required:
                - webhook-id
                - webhook-timestamp
                - webhook-signature
            properties:
                webhook-id:
                    type: string
                    description: >-
                        Shared by every subscription this event fanned out to, and by every retry
                        of one delivery — the id a subscriber dedupes on.
                webhook-timestamp:
                    type: string
                    description: Unix seconds when this attempt was signed, folded into the signature.
                webhook-signature:
                    type: string
                    description: 'One or more space-separated `v1,<base64 HMAC-SHA256>` values.'
        OrderIdPayload:
            type: object
            required:
                - orderId
            properties:
                orderId:
                    type: string
            additionalProperties: false
        OrderCancelledPayload:
            type: object
            required:
                - orderId
                - refund
            properties:
                orderId:
                    type: string
                refund:
                    type: boolean
                    description: >-
                        Whether the cancel carries a refund — a customer cancelling is owed their
                        money, an operator cancelling may not be. See `orders/events.ts`.
            additionalProperties: false
        PaymentEventPayload:
            type: object
            required:
                - paymentId
                - orderId
            properties:
                paymentId:
                    type: string
                orderId:
                    type: string
            additionalProperties: false
        PaymentRefundedPayload:
            type: object
            required:
                - paymentId
                - orderId
                - refundId
                - amount
                - currency
            properties:
                paymentId:
                    type: string
                orderId:
                    type: string
                refundId:
                    type: string
                    description: >-
                        The refund record this delivery is about. A payment can be refunded in
                        parts, so one payment can raise this event more than once.
                amount:
                    type: number
                    description: This refund's amount, two decimal places — the payment's own `amount` for a full refund.
                currency:
                    type: string
                    description: ISO-4217, e.g. `EUR`.
            additionalProperties: false
        ReturnRequestedPayload:
            type: object
            required:
                - returnId
                - orderId
                - reason
            properties:
                returnId:
                    type: string
                orderId:
                    type: string
                reason:
                    type: string
                    description: Why the goods come back — `withdrawal`, `defective`, `wrong_item` or `other`.
            additionalProperties: false
        ReturnReceivedPayload:
            type: object
            required:
                - returnId
                - orderId
            properties:
                returnId:
                    type: string
                orderId:
                    type: string
            additionalProperties: false
        ReturnClosedPayload:
            type: object
            required:
                - returnId
                - orderId
                - refundAmount
                - currency
            properties:
                returnId:
                    type: string
                orderId:
                    type: string
                refundAmount:
                    type: number
                    description: What went back to the customer for this return, two decimal places.
                currency:
                    type: string
                    description: ISO-4217, e.g. `EUR`.
            additionalProperties: false
        ExamplePublishedPayload:
            type: object
            required:
                - exampleId
                - title
            properties:
                exampleId:
                    type: string
                title:
                    type: string
                    description: The fallback-language title.
            additionalProperties: false
        OrderCreatedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    # `title` names the generated model — a bare inline enum-of-one otherwise
                    # becomes Modelina's `AnonymousSchemaN`, renumbered on every unrelated addition.
                    title: OrderCreatedEventType
                    type: string
                    enum:
                        - order.created
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
        OrderPaidEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: OrderPaidEventType
                    type: string
                    enum:
                        - order.paid
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
        OrderShippedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: OrderShippedEventType
                    type: string
                    enum:
                        - order.shipped
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderIdPayload'
            additionalProperties: false
        OrderCancelledEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: OrderCancelledEventType
                    type: string
                    enum:
                        - order.cancelled
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/OrderCancelledPayload'
            additionalProperties: false
        PaymentSucceededEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: PaymentSucceededEventType
                    type: string
                    enum:
                        - payment.succeeded
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentEventPayload'
            additionalProperties: false
        PaymentFailedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: PaymentFailedEventType
                    type: string
                    enum:
                        - payment.failed
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentEventPayload'
            additionalProperties: false
        PaymentRefundedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: PaymentRefundedEventType
                    type: string
                    enum:
                        - payment.refunded
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/PaymentRefundedPayload'
            additionalProperties: false
        ReturnRequestedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: ReturnRequestedEventType
                    type: string
                    enum:
                        - return.requested
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/ReturnRequestedPayload'
            additionalProperties: false
        ReturnReceivedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: ReturnReceivedEventType
                    type: string
                    enum:
                        - return.received
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/ReturnReceivedPayload'
            additionalProperties: false
        ReturnClosedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: ReturnClosedEventType
                    type: string
                    enum:
                        - return.closed
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/ReturnClosedPayload'
            additionalProperties: false
        ExamplePublishedEnvelope:
            type: object
            required:
                - type
                - timestamp
                - data
            properties:
                type:
                    title: ExamplePublishedEventType
                    type: string
                    enum:
                        - example.published
                timestamp:
                    type: string
                    format: date-time
                data:
                    $ref: '#/components/schemas/ExamplePublishedPayload'
            additionalProperties: false
