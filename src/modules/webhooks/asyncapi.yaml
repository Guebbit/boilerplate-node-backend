# The webhooks module's async contract — the public event catalogue.
#
# The shared half of the public event catalogue: the server and headers every event uses. Merged
# by the bundler into `asyncapi.yaml` AND `asyncapi.public.yaml` (a `shared` section,
# `scripts/contracts/asyncapi-bundles.ts`), unlike the queue this module also owns
# (`worker.webhook.deliver`, in `./asyncapi.internal.yaml`, backend-only). `GET /webhooks/events`
# lists the events of the registered modules' fragments, the same files the bundle merges, so the
# catalogue a subscriber reads and the events that can fire cannot drift apart.
#
# `webhooks/module.ts`'s `onRegistered` hook subscribes generically to every domain event a
# registered module's manifest names a `publicEvents` entry for (`kernel/registry.ts`'s
# `PublicEventTarget`) and republishes the ones a subscription's filter matches, signed, to
# the URL it names. `orders`/`payments` own the MAPPING — which domain event, projected how,
# becomes which public name — on their own `module.ts`; nothing here or in `webhooks` imports the
# other module's event constants.
#
# The CHANNELS are not here. Each event belongs to the module that fires it, in that module's own
# `asyncapi.webhooks.yaml` (`orders`, `payments`, `returns`, `example`), and the bundler merges
# those fragments into this section (`scripts/contracts/asyncapi-webhook-events.ts`) while this
# module exists. What stays here is what every event shares: the `subscriberEndpoint` server and
# the `WebhookHeaders` schema. A new webhook is one fragment in the owning module; `example`
# shows the shape.
#
# Every body is the Standard Webhooks envelope, `{ type, timestamp, data }` — `type` names the
# event (so a subscriber on more than one event type can tell them apart without inspecting
# `data`'s shape), `timestamp` is when the underlying event occurred (stable across retries of the
# same delivery), and `data` is the per-event payload below, unchanged. The `webhook-id`/
# `webhook-timestamp`/`webhook-signature` headers carry the delivery id and signature — see
# `transport/webhook-signing.ts`; `id` is NOT repeated in the body.
asyncapi: 3.0.0
info:
    title: Webhooks async contract
    version: 0.1.0
    description: The events a webhook subscription may receive.
servers:
    subscriberEndpoint:
        # A VARIABLE server, not a fixed host: every subscription names its own HTTPS URL, so there
        # is no one address this document can print. `asyncapi-servers`/`asyncapi-channel-servers`
        # (`spectral.asyncapi.modules.yaml`) still pass, because the channels merged in from the
        # modules' fragments DO bind to this server — it just resolves per subscription instead of per deployment.
        #
        # Not a server this application runs — the reverse of every other section's server: a
        # subscriber genuinely subscribes to receive these, over a connection this application
        # opens outbound.
        host: '{subscriberHost}'
        pathname: '{subscriberPath}'
        protocol: https
        variables:
            subscriberHost:
                default: example.com
                description: Host (and port, when non-default) of a subscription's configured URL.
            subscriberPath:
                default: /webhooks/inbox
                description: Path of a subscription's configured URL.
components:
    schemas:
        WebhookHeaders:
            type: object
            description: >-
                The three Standard Webhooks headers every delivery carries — see
                `transport/webhook-signing.ts`. Documented here for the subscriber reading this
                catalogue; nothing in this repo generates types off a message's `headers`.
            required:
                - webhook-id
                - webhook-timestamp
                - webhook-signature
            properties:
                webhook-id:
                    type: string
                    description: >-
                        Shared by every subscription this event fanned out to, and by every retry
                        of one delivery — the id a subscriber dedupes on.
                webhook-timestamp:
                    type: string
                    description: Unix seconds when this attempt was signed, folded into the signature.
                webhook-signature:
                    type: string
                    description: 'One or more space-separated `v1,<base64 HMAC-SHA256>` values.'
