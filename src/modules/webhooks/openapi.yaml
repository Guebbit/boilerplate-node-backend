openapi: 3.1.0
info:
    title: webhooks — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Webhooks
      description: Outbound webhook subscriptions, the delivery log, replay, and the public event catalogue.

x-error-codes:
    WEBHOOK_DELIVERY_IN_PROGRESS: { status: 409, description: 'A retry of this delivery is already in flight.' }
    WEBHOOK_SUBSCRIPTION_LIMIT_REACHED: { status: 409, description: 'This shop already holds the most webhook subscriptions it may; delete one first.' }
    WEBHOOK_SUBSCRIPTION_ALREADY_ENABLED: { status: 409, description: 'The subscription is already enabled.' }
    WEBHOOK_SUBSCRIPTION_ALREADY_DISABLED: { status: 409, description: 'The subscription is already disabled.' }
    WEBHOOK_SUBSCRIPTION_DISABLED: { status: 409, description: 'The delivery belongs to a subscription that is disabled, so nothing can be sent until it is enabled.' }

paths:
    /webhooks/subscriptions:
        get:
            tags: [Webhooks]
            summary: List this shop's webhook subscriptions
            description: |
                Newest first unless `sort` says otherwise. Never returns a secret — the ring's
                plaintext exists only in the response of the call that minted it (`POST` here, or
                `POST .../{id}/secrets`).
            operationId: listWebhookSubscriptions
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: sort
                  in: query
                  required: false
                  # JSON:API grammar: `?sort=-createdAt,url` — comma-separated, `-` for descending.
                  style: form
                  explode: false
                  schema:
                      $ref: '#/components/schemas/WebhookSubscriptionSort'
                - name: enabled
                  in: query
                  required: false
                  schema: { type: boolean }
                  description: Filter by whether the subscription is currently enabled (`true`) or switched off for any reason (`false`).
                - name: autoDisabled
                  in: query
                  required: false
                  schema: { type: boolean }
                  description: Filter by who switched it off. `true` keeps only the subscriptions the failure guard disabled (`autoDisabledAt` set); `false` keeps the rest, enabled ones and pauses by hand. Combine with `enabled=false` to list the pauses by hand.
            responses:
                '200':
                    description: Subscription list
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookSubscriptionsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
        post:
            tags: [Webhooks]
            summary: Create a webhook subscription
            description: |
                Mints the ring's first secret and returns it in plaintext, once — the only
                response that ever carries it. `url` must be `https://` and must not resolve to a
                private, loopback or link-local address. The host is resolved here, so a refusal is a
                422 naming the field (`errors[].details` `{ field: url }`, no reason: the refusal does not
                say which internal address it hit) instead of a
                delivery that fails later; `PUT` and `PATCH` run the same check when the `url`
                changes. It runs again on every delivery, since a subscription's DNS can change
                after it is created.
            operationId: createWebhookSubscription
            x-error-codes:
                '409': [WEBHOOK_SUBSCRIPTION_LIMIT_REACHED]
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateWebhookSubscriptionRequest'
            responses:
                '201':
                    description: Created subscription, with its one-time secret
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookSubscriptionCreated'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /webhooks/subscriptions/{id}:
        get:
            tags: [Webhooks]
            summary: Get one webhook subscription
            description: |
                The same shape the list rows carry (and never a secret). 404 for an id outside this
                shop's subscriptions, whether it never existed or belongs to another shop.
            operationId: getWebhookSubscription
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The subscription
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookSubscription'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
        put:
            tags: [Webhooks]
            summary: Replace a webhook subscription
            description: |
                Full replace of url/description/eventTypes — an omitted `description` is cleared.
                Never touches the secret ring or whether the subscription is on; rotate or drop a
                secret, enable or disable it, through its own action route below.
            operationId: replaceWebhookSubscription
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReplaceWebhookSubscriptionRequest'
            responses:
                '200':
                    description: Replaced subscription
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookSubscription'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
        patch:
            tags: [Webhooks]
            summary: Update a webhook subscription
            description: |
                Partial update of url/description/eventTypes. Never touches the secret ring or
                whether the subscription is on; rotate or drop a secret, enable or disable it,
                through its own action route below.
            operationId: updateWebhookSubscription
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateWebhookSubscriptionRequest'
                    application/merge-patch+json:
                        schema:
                            $ref: '#/components/schemas/UpdateWebhookSubscriptionRequest'
            responses:
                '200':
                    description: Updated subscription
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookSubscription'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
        delete:
            tags: [Webhooks]
            summary: Delete a webhook subscription
            description: Permanently removes the subscription. Its delivery log is left in place, so past attempts stay auditable.
            operationId: deleteWebhookSubscription
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '204': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NoContent' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }

    /webhooks/subscriptions/{id}/enable:
        post:
            tags: [Webhooks]
            summary: Enable a webhook subscription
            description: |
                Turns a subscription back on, whether it was switched off by hand or by the
                auto-disable guard: clears `disabledAt` and `autoDisabledAt` and resets the failure
                streak, so the guard starts counting from zero. Refused with 409
                `WEBHOOK_SUBSCRIPTION_ALREADY_ENABLED` when it is already on — the streak of a
                healthy subscription is never reset by a repeated call.
            operationId: enableWebhookSubscription
            x-error-codes:
                '409': [WEBHOOK_SUBSCRIPTION_ALREADY_ENABLED]
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The subscription, now enabled
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookSubscription'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }

    /webhooks/subscriptions/{id}/disable:
        post:
            tags: [Webhooks]
            summary: Disable a webhook subscription
            description: |
                Pauses a subscription by hand: sets `disabledAt` (and leaves `autoDisabledAt`
                absent, which is how a pause is told from the guard's work). Nothing is sent to it
                while it is off, and an event that fires meanwhile is not queued for it. Refused with 409
                `WEBHOOK_SUBSCRIPTION_ALREADY_DISABLED` when it is already off.
            operationId: disableWebhookSubscription
            x-error-codes:
                '409': [WEBHOOK_SUBSCRIPTION_ALREADY_DISABLED]
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The subscription, now disabled
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookSubscription'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }

    /webhooks/subscriptions/{id}/secrets:
        post:
            tags: [Webhooks]
            summary: Add a secret to a webhook subscription's ring (rotate)
            description: |
                Adds a new secret to the ring and returns its plaintext once, in `newSecret` — the
                ring then carries two active secrets, and deliveries sign with both (two
                space-separated `v1,` values in `webhook-signature`) until the old one is dropped
                through `DELETE .../secrets/{secretId}` or its overlap window ends (24 hours by
                default, `NODE_WEBHOOK_SECRET_OVERLAP_HOURS`; `retiringSecrets` names the exact
                instant), after which it stops signing and disappears from `secretIds`. A ring holds at
                most two: adding a third drops the oldest, which is already superseded. A secret is a
                line of the subscription, so adding one is a `POST` on the line collection and answers
                200 with the whole subscription (docs/api/write-methods.md).
            operationId: createWebhookSubscriptionSecret
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: Subscription with a newly minted secret
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookSubscriptionCreated'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }

    /webhooks/subscriptions/{id}/secrets/{secretId}:
        delete:
            tags: [Webhooks]
            summary: Drop one secret from a subscription's ring
            description: |
                The other half of a rotation, once every consumer has switched. Refuses to empty
                the ring — a subscription with no secret can never sign a delivery. The remove twin
                of `POST .../secrets`.
            operationId: removeWebhookSubscriptionSecret
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - name: secretId
                  in: path
                  required: true
                  schema: { type: string, maxLength: 64 }
                  description: A ring entry's id, from `secretIds`.
            responses:
                '200':
                    description: Subscription with that secret removed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookSubscription'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /webhooks/deliveries:
        get:
            tags: [Webhooks]
            summary: The delivery log
            description: Every attempt, newest first, optionally filtered by subscription and status. The order is fixed - this is a log.
            operationId: listWebhookDeliveries
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: subscriptionId
                  in: query
                  required: false
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                - name: status
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/WebhookDeliveryStatus'
            responses:
                '200':
                    description: Delivery list, newest first (a log, so no `sort`)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookDeliveriesResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /webhooks/deliveries/{id}:
        get:
            tags: [Webhooks]
            summary: Get one delivery
            description: One row of this shop's delivery log, the same shape the list gives it, with `actions.replay`. Another shop's delivery, an unknown id and a malformed one are the same 404.
            operationId: getWebhookDelivery
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The delivery
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookDelivery'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }

    /webhooks/deliveries/{id}/replay:
        post:
            tags: [Webhooks]
            summary: Re-send one delivery
            description: |
                Signs and POSTs again, synchronously, against the subscription's CURRENT url and
                secret ring — not the ones this row was originally attempted with. Updates the same
                row: `attempt` advances exactly like a real queued attempt would (one step forward
                on a failure with backoff tiers left, unchanged on success or exhaustion), and
                `status`/`responseCode`/`durationMs`/`error` reflect this replay. The single
                most-requested support action, per the design doc. Refused while the subscription is
                disabled (`actions.replay` is false): enable it first.
            operationId: replayWebhookDelivery
            x-error-codes:
                '409': [WEBHOOK_DELIVERY_IN_PROGRESS, WEBHOOK_SUBSCRIPTION_DISABLED]
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The delivery, as it stands after the replay
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookDelivery'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }

    /webhooks/events:
        get:
            tags: [Webhooks]
            summary: The public event catalogue
            description: |
                The events of the modules this deployment runs, read from each one's own
                `asyncapi.webhooks.yaml` — the same files `asyncapi.public.yaml` is generated from —
                so this list and what can actually fire can never drift apart. A module that is
                not deployed lists nothing. See `docs/api/asyncapi-workflow.md`.
            operationId: listWebhookEvents
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            responses:
                '200':
                    description: Every event a subscription may filter on
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookEventCatalogueResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }

components:
    schemas:
        # ---------- webhooks — the schemas only this module's paths reference. ----------
        #
        # Every `url` field's `pattern` below is wrapped in a non-capturing group, `(?:^https://)`
        # rather than the bare `^https://`: orval's zod generator strips a pattern's trailing `/`
        # on the assumption it's a `/regex/` literal's own delimiter, which silently turned
        # `^https://` into the one-slash `^https:/` — a check almost nothing fails. The group's
        # closing `)` isn't a `/`, so the strip never fires; the anchor and match are unchanged.
        WebhookSubscription:
            type: object
            additionalProperties: false
            required: [id, url, eventTypes, enabled, consecutiveFailures, secretIds, retiringSecrets, actions, createdAt, updatedAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                url:
                    type: string
                    format: uri
                    pattern: '(?:^https://)'
                description:
                    type: string
                eventTypes:
                    type: array
                    items:
                        $ref: '#/components/schemas/WebhookEventFilter'
                    minItems: 1
                    description: Names from `GET /webhooks/events` this subscription receives, or `*` for every event.
                enabled:
                    type: boolean
                    description: Read-only, derived — true while `disabledAt` is absent. Change it with `POST .../enable` or `POST .../disable`.
                consecutiveFailures:
                    type: integer
                    minimum: 0
                disabledAt:
                    type: string
                    format: date-time
                    description: When the subscription was switched off, by hand or by the auto-disable guard. Absent while it is enabled.
                autoDisabledAt:
                    type: string
                    format: date-time
                    description: Set (together with `disabledAt`) only when the auto-disable guard switched it off after sustained failures; absent for a pause by hand.
                secretIds:
                    type: array
                    items: { type: string }
                    description: The ring's secret ids, oldest first — never the plaintext.
                retiringSecrets:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookRetiringSecret' }
                    description: The ring entries that are still signing but have been superseded, with when each stops. Empty when the ring holds one secret.
                actions:
                    $ref: '#/components/schemas/WebhookSubscriptionActions'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        WebhookRetiringSecret:
            type: object
            additionalProperties: false
            required: [id, retiresAt]
            properties:
                id:
                    type: string
                    description: A ring entry's id, one of `secretIds`.
                retiresAt:
                    type: string
                    format: date-time
                    description: When this secret stops signing deliveries — the end of its overlap window (`NODE_WEBHOOK_SECRET_OVERLAP_HOURS` after its successor was minted), unless it is dropped sooner.

        WebhookSubscriptionActions:
            type: object
            additionalProperties: false
            required: [update, delete, enable, disable, createSecret, removeSecret]
            properties:
                update:
                    type: boolean
                    description: Whether `PUT` or `PATCH /webhooks/subscriptions/{id}` would be accepted.
                delete:
                    type: boolean
                    description: Whether `DELETE /webhooks/subscriptions/{id}` would be accepted.
                enable:
                    type: boolean
                    description: Whether `POST /webhooks/subscriptions/{id}/enable` would be accepted — false while it is already enabled.
                disable:
                    type: boolean
                    description: Whether `POST /webhooks/subscriptions/{id}/disable` would be accepted — false while it is already disabled.
                createSecret:
                    type: boolean
                    description: Whether `POST /webhooks/subscriptions/{id}/secrets` would be accepted.
                removeSecret:
                    type: boolean
                    description: Whether `DELETE /webhooks/subscriptions/{id}/secrets/{secretId}` would be accepted — false while the ring holds a single secret.

        WebhookSubscriptionCreated:
            # Flat, not `allOf: [WebhookSubscription, {...}]`: two sibling schemas each declaring
            # `additionalProperties: false` is a well-known JSON Schema trap — ajv validates the
            # instance against EACH branch independently, so every field the OTHER branch owns
            # reads as "additional" and the whole document fails. Restated flat instead.
            type: object
            additionalProperties: false
            required: [id, url, eventTypes, enabled, consecutiveFailures, secretIds, retiringSecrets, actions, createdAt, updatedAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                url:
                    type: string
                    format: uri
                    pattern: '(?:^https://)'
                description:
                    type: string
                eventTypes:
                    type: array
                    items:
                        $ref: '#/components/schemas/WebhookEventFilter'
                    minItems: 1
                enabled:
                    type: boolean
                consecutiveFailures:
                    type: integer
                    minimum: 0
                disabledAt:
                    type: string
                    format: date-time
                autoDisabledAt:
                    type: string
                    format: date-time
                secretIds:
                    type: array
                    items: { type: string }
                retiringSecrets:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookRetiringSecret' }
                actions:
                    $ref: '#/components/schemas/WebhookSubscriptionActions'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                secret:
                    type: string
                    description: The newly minted secret, in plaintext. Shown here once, on creation, and never again.
                newSecret:
                    type: string
                    description: A rotated-in secret's plaintext, present only in the response of `POST .../secrets`.

        # The ONE sort grammar, shared with every list (docs/api/sorting.md). `-` sorts
        # descending; earlier entries rank first; ties end on the id.
        WebhookSubscriptionSort:
            type: array
            minItems: 1
            maxItems: 2
            items:
                type: string
                enum: [createdAt, -createdAt, url, -url]

        WebhookDeliveryStatus:
            type: string
            enum: [pending, in-flight, succeeded, exhausted]

        WebhookDelivery:
            type: object
            additionalProperties: false
            required: [id, subscriptionId, eventId, eventType, attempt, status, actions, createdAt, updatedAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                subscriptionId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                eventId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                eventType:
                    $ref: '#/components/schemas/WebhookEventName'
                attempt:
                    type: integer
                    minimum: 1
                status:
                    $ref: '#/components/schemas/WebhookDeliveryStatus'
                responseCode:
                    type: integer
                    minimum: 100
                    maximum: 599
                durationMs:
                    type: integer
                    minimum: 0
                error:
                    type: string
                nextAttemptAt:
                    type: string
                    format: date-time
                actions:
                    $ref: '#/components/schemas/WebhookDeliveryActions'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        WebhookDeliveryActions:
            type: object
            additionalProperties: false
            required: [replay]
            properties:
                replay:
                    type: boolean
                    description: Whether `POST /webhooks/deliveries/{id}/replay` would be accepted — false while the delivery's subscription is disabled or gone.

        # The events the shop can fire: the channel names of every module's `asyncapi.webhooks.yaml`.
        # Never written here — `x-enum-from` makes the bundler fill it (`scripts/contracts/fill-enum.ts`).
        WebhookEventName:
            type: string
            x-enum-from: webhook-events
            description: The name of one event a subscription can receive, as `GET /webhooks/events` lists it.

        # What a subscription may filter on: one event name, or `*` for every event, present and future.
        WebhookEventFilter:
            type: string
            x-enum-from: webhook-events
            x-enum-also: ['*']
            maxLength: 100
            description: One event name from `GET /webhooks/events`, or `*` for every event.

        WebhookEventCatalogueEntry:
            type: object
            additionalProperties: false
            required: [name]
            properties:
                name:
                    $ref: '#/components/schemas/WebhookEventName'
                description:
                    type: string

        CreateWebhookSubscriptionRequest:
            type: object
            additionalProperties: false
            required: [url, eventTypes]
            properties:
                url:
                    type: string
                    maxLength: 2048
                    format: uri
                    pattern: '(?:^https://)'
                    description: Must be `https://`. Validated again, against the resolved IP, on every delivery.
                description:
                    type: string
                    maxLength: 500
                    minLength: 1
                eventTypes:
                    type: array
                    items:
                        $ref: '#/components/schemas/WebhookEventFilter'
                    minItems: 1
                    description: A name from `GET /webhooks/events`, or `*` for every event. Any other name is a 422 naming `eventTypes`.

        ReplaceWebhookSubscriptionRequest:
            type: object
            additionalProperties: false
            required: [url, eventTypes]
            properties:
                url:
                    type: string
                    maxLength: 2048
                    format: uri
                    pattern: '(?:^https://)'
                    description: Must be `https://` — same rule `CreateWebhookSubscriptionRequest` states.
                # `null` clears it, same as PATCH — a PUT names every field, and an omitted one
                # here clears too, since it has nothing to say by default.
                description:
                    type: [string, 'null']
                    maxLength: 500
                    minLength: 1
                eventTypes:
                    type: array
                    items:
                        $ref: '#/components/schemas/WebhookEventFilter'
                    minItems: 1
                    description: A name from `GET /webhooks/events`, or `*` for every event. Any other name is a 422 naming `eventTypes`.

        UpdateWebhookSubscriptionRequest:
            type: object
            additionalProperties: false
            properties:
                url:
                    type: string
                    maxLength: 2048
                    format: uri
                    pattern: '(?:^https://)'
                    description: Must be `https://` — same rule `CreateWebhookSubscriptionRequest` states.
                # `null` clears it. Omitted leaves it unchanged; `''` is invalid.
                description:
                    type: [string, 'null']
                    maxLength: 500
                    minLength: 1
                eventTypes:
                    type: array
                    items:
                        $ref: '#/components/schemas/WebhookEventFilter'
                    minItems: 1
                    description: A name from `GET /webhooks/events`, or `*` for every event. Any other name is a 422 naming `eventTypes`.

        WebhookSubscriptionsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookSubscription' }
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        WebhookDeliveriesResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        WebhookEventCatalogueResponse:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/WebhookEventCatalogueEntry'

