      - url: "{{ _.baseURL }}/cart/checkout"
        name: "Probe: checkout with an empty cart"
        meta:
          id: req_e4edcc2a5df62e1be6c8601ad321f0f0
          created: 1767225600000
          modified: 1767225600000
          isPrivate: false
          description: "The failure half of the funnel. Clear the cart first, then send this: the API refuses and emits `checkout_failed`, the event the frontend also reports from its cart store. It is the only way to see that event without breaking something, and the seeded non-admin user starts with an empty cart precisely so the state is reachable."
          sortKey: 7009
        method: POST
        headers:
          - name: Accept
            value: application/json
        authentication:
          type: bearer
          token: "{{ _.token }}"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseURL }}/cart"
        name: "Probe: add a product that does not exist"
        meta:
          id: req_fc7e94b368e9ba50f8b2a02f1b41c061
          created: 1767225600000
          modified: 1767225600000
          isPrivate: false
          description: A well-formed body naming an id nothing owns. The contract can describe the 404 but not a request that earns one, and this is the boundary where a cart would happily store a dangling reference if the service ever stopped checking.
          sortKey: 7010
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "productId": "000000000000000000000000",
              "quantity": 1
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Accept
            value: application/json
        authentication:
