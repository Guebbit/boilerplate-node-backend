openapi: 3.0.3
info:
    title: cart — module contract
    version: '0.1.0'

x-error-codes:
    CART_ADDRESS_NOT_APPLICABLE: { status: 409, description: 'Nothing in this checkout ships to an address (all-digital, or a method that ships to none), so a shipping `addressId` cannot apply.' }
    CART_ADDRESS_NOT_FOUND: { status: 404, description: 'The named address does not exist, or does not belong to the caller.' }
    CART_ADDRESS_REQUIRED: { status: 422, description: 'A shipping address is required and none was supplied or found on file.' }
    CART_BILLING_ADDRESS_REQUIRED: { status: 422, description: 'No billing address could be resolved — none was named, nothing ships, and the address book has no default.' }
    CART_CHANGED: { status: 409, description: 'The cart changed between the request that read it and this write — reload and retry.' }
    CART_EMPTY: { status: 409, description: 'Checkout was attempted on a cart with no lines.' }
    CART_INSUFFICIENT_STOCK: { status: 409, description: 'One or more lines exceed the product''s available stock — see `errors[].details.lines`, one entry per short line with its `productId`, `title` and the `requested` quantity. The number left is not part of the answer: exact stock is for callers who read it (`inventory.any.read`).' }
    CART_OPEN_ORDER_LIMIT: { status: 409, description: 'The account already holds `NODE_MAX_OPEN_UNPAID_ORDERS_PER_ACCOUNT` unpaid orders, whatever their payment method — each holds stock. `errors[].details.orderIds` names them: pay one (`POST /payments/intent`) or cancel one (`POST /orders/{id}/cancel`), then check out again.' }
    CART_PAYMENT_METHOD_NOT_AVAILABLE: { status: 409, description: 'The chosen payment method is not enabled for this deployment or this cart.' }
    CART_PRODUCT_UNAVAILABLE: { status: 409, description: 'A line references a product that was deleted or deactivated since it was added.' }
    CART_QUANTITY_LIMIT: { status: 422, description: 'The requested quantity exceeds the per-line limit.' }
    CART_SHIPPING_METHOD_NOT_FOUND: { status: 404, description: 'The named shipping method does not exist or is not offered.' }
    CART_SHIPPING_METHOD_REQUIRED: { status: 422, description: 'A shipping method is required and none is set on the cart.' }
    CART_SHIPPING_METHOD_WEIGHT: { status: 409, description: 'The cart''s total weight falls outside the chosen shipping method''s configured range.' }
    CART_SHIPPING_NOT_APPLICABLE: { status: 409, description: 'The chosen shipping method does not apply to an all-digital cart.' }
    CART_TOTAL_CHANGED: { status: 409, description: 'The total the buyer was shown is not the total this checkout would charge — a price, a shipping cost or the cart itself changed. `errors[].details` carries `expected` (what the request named) and `actual` (what the order would cost now), each `{ amount, currency }` in minor units; show the new total and let the buyer confirm.' }
    CART_SHIP_TO_COUNTRY_NOT_SUPPORTED: { status: 422, description: 'The address''s country is outside this deployment''s configured ship-to list.' }
    EMAIL_NOT_VERIFIED: { status: 403, description: 'Checkout requires a verified email address — see `POST /account/verify-email`.' }
    REORDER_UNAVAILABLE: { status: 409, description: 'The past order named for reorder no longer has any purchasable lines.' }

paths:
    /cart:
        get:
            tags: [Cart]
            summary: Get cart
            description: Returns all items currently in the authenticated user's cart along with a computed summary
            operationId: getCart
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Cart items
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        post:
            tags: [Cart]
            summary: Add to cart
            description: >-
                "Add to cart": a product with no line in the caller's cart gets one, and a line
                already there GROWS by `quantity` — pressing the button twice makes two (Shopify's
                `/cart/add`, commercetools' `addLineItem`). Answers 201 with the cart and the
                line's `Location` when a line was created, 200 when an existing one grew; the line
                may not pass the per-line cap (422). To SET a quantity, `PUT /cart/{productId}`.
            operationId: addCartItem
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddCartItemRequest'
            responses:
                '201':
                    description: The product had no line; the cart now holds one
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponseEnvelope'
                '200':
                    description: The product already had a line, which grew
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # Well-formed product id that matches no product. 422 covers the malformed case.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        delete:
            tags: [Cart]
            summary: Remove item from cart
            description: Removes the cart line for the product identified by `productId` in the body from the authenticated user's cart. Alternate spelling of `DELETE /cart/{productId}`, for a caller that would rather carry the id in the body. To empty the cart entirely, use `DELETE /cart/all` instead — a stripped or malformed body here 422s rather than falling back to clearing everything. Returns the updated cart.
            operationId: removeCartItemByBody
            x-alias-of: removeCartItem
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RemoveCartItemRequest'
            responses:
                '200':
                    description: Updated cart
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # Well-formed product id that matches no cart line. 422 covers the malformed case.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # A missing or malformed `productId` in the body — the controller answers before querying.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /cart/all:
        delete:
            tags: [Cart]
            summary: Clear cart
            description: Empties the authenticated user's cart entirely. Bodyless on purpose — the destructive spelling gets its own URL instead of being what `DELETE /cart` falls back to when a body goes missing, so a body stripped in transit 422s there instead of silently landing here.
            operationId: clearCart
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Cart cleared
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /cart/{productId}:
        put:
            tags: [Cart]
            summary: Set cart item quantity
            description: Sets the quantity of the cart line for the product identified by `{productId}` in the path — the quantity, not an increment; `POST /cart` is the door that adds. Answers 201 when it created the line (RFC 9110 §9.3.4) and 200 when it wrote one already there; repeating it changes nothing. Returns the updated cart.
            operationId: updateCartItemById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/ProductIdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCartItemByIdRequest'
            responses:
                '201':
                    description: The product had no line; the cart now holds one
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponseEnvelope'
                '200':
                    description: Updated cart
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        delete:
            tags: [Cart]
            summary: Remove item from cart
            description: Removes the cart line for the product identified by `{productId}` in the path from the authenticated user's cart. Returns the updated cart.
            operationId: removeCartItem
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/ProductIdPathParam'
            responses:
                '200':
                    description: Updated cart
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # Well-formed product id that matches no cart line. 422 covers the malformed case.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `{productId}` is not a usable ObjectId — the controller answers before querying.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /cart/shipping-method:
        put:
            tags: [Cart]
            summary: Choose (or clear) the cart's shipping method
            description: Sets which shipping method (see `GET /delivery/methods`) the cart plans to ship by, ahead of checkout — priced and validated against the basket as it stands right now. `null` clears the choice. Checkout re-validates from scratch regardless of what this endpoint accepted, since the basket may change afterward. Returns the updated cart, including the priced `summary.shippingCost`/`summary.totalPrice`.
            operationId: setCartShippingMethod
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetCartShippingMethodRequest'
            responses:
                '200':
                    description: Updated cart
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # A named method that matches none of `GET /delivery/methods`'.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # A basket made entirely of `requiresShipping: false` products
                # (`CART_SHIPPING_NOT_APPLICABLE`), or one whose weight falls outside the chosen
                # method's `minWeight`/`maxWeight` range (`CART_SHIPPING_METHOD_WEIGHT`).
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /cart/summary:
        get:
            tags: [Cart]
            summary: Get cart summary
            description: Returns a lightweight summary of the authenticated user's cart.
            operationId: getCartSummary
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Cart summary
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartSummaryResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /cart/checkout:
        post:
            tags: [Orders]
            summary: Checkout (place order from cart)
            description: Converts the authenticated user's current cart into a new order. The cart is cleared upon success. The request names the total the buyer was shown (`expectedTotal`); a checkout that would charge anything else is refused with 409 `CART_TOTAL_CHANGED` and the new total, before any stock is held. Optional order notes can be supplied in the request body. Answers 201 with the created order itself as `data` — the same shape `POST /orders` answers — and its `Location`. The order's email is always the authenticated caller's own — checkout is account-bound; a future guest checkout would bring an `email` field back.
            operationId: checkout
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckoutRequest'
            responses:
                '201':
                    description: Order created
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CheckoutResponseEnvelope'
                    links:
                        PayOrder:
                            operationId: createPaymentIntent
                            parameters:
                                orderId: '$response.body#/data/id'
                            description: The new order's id is the `orderId` to freeze into a payment intent.
                        CancelOrder:
                            operationId: cancelOrderById
                            parameters:
                                id: '$response.body#/data/id'
                            description: The new order's id can be cancelled directly.
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # An `addressId` that names none of the caller's saved addresses — the checkout
                # refuses rather than shipping nowhere. `errors[].code` is `CART_ADDRESS_NOT_FOUND`.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Checking out an empty cart (`CART_EMPTY`), insufficient stock
                # (`CART_INSUFFICIENT_STOCK`, naming each short line but not the number left), a race with another checkout (`CART_CHANGED`), an
                # `addressId` sent for a chosen method whose `requiresAddress` is false
                # (`CART_ADDRESS_NOT_APPLICABLE`: that method ships to no address at all — and
                # neither does an all-digital basket — so naming one is a client error, not a
                # lookup that might resolve), a `paymentMethod` this
                # deployment does not offer (`CART_PAYMENT_METHOD_NOT_AVAILABLE`), or the caller
                # already has `NODE_MAX_OPEN_UNPAID_ORDERS_PER_ACCOUNT` unpaid orders, of any
                # payment method (`CART_OPEN_ORDER_LIMIT`, naming them in `details.orderIds`). A stored shipping choice the basket no
                # longer fits (gone digital-only, lost its last physical line, outgrown the method)
                # is not a refusal here: it reads as no choice, as in `GET /cart`'s `shipping.selected`.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                # A basket holding any `requiresShipping: true` line with no shipping method chosen
                # on the cart (`CART_SHIPPING_METHOD_REQUIRED` — see `PUT /cart/shipping-method`),
                # a chosen method whose `requiresAddress` is true with no `addressId` and no
                # default address on file (`CART_ADDRESS_REQUIRED`) — nobody would know how or
                # where to send the order — that method's resolved address naming a country
                # outside `NODE_SHIP_TO_COUNTRIES` (`CART_SHIP_TO_COUNTRY_NOT_SUPPORTED`), or no
                # billing address resolvable: none named, no shipping address to reuse (an
                # all-digital or pickup basket) and no default on file
                # (`CART_BILLING_ADDRESS_REQUIRED`). A `billingAddressId` that names none of the
                # caller's addresses is the same 404 as `addressId`.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # The per-account checkout budget (`NODE_CHECKOUT_RATE_LIMIT_MAX`, 10 per window).
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /cart/merge:
        post:
            tags: [Cart]
            summary: Merge a guest cart into the cart
            description: >-
                Adds every line of a cart built while signed out, in one call, by the same rule as
                `POST /cart`: a product already in the cart GROWS by the line's quantity, a new one
                gets a line. The answer holds the cart as it now stands and ONE RESULT PER SUBMITTED
                LINE, in request order, saying what the line asked for (`requested`), what the cart
                holds for that product now (`resulting`) and, when the two differ or the line did
                not land cleanly, why (`reason`). A line the cart cannot take is not a failure: the
                call still answers 200, because one bad line must not strand the rest. Stock is CHECKED,
                not enforced: a line that is short is still added (a stock-out is temporary) and
                flagged `insufficientStock`, with the quantity left as the sum, so the answer never
                says how many are for sale. The same rule runs at checkout, which refuses, and in
                `GET /cart`, which flags, all three reading the stock ledger. Lines that could not be
                added at all (`unavailable`: the product is deleted or hidden) are also written as ONE notification
                (`notifications.cart-merge-refused`); nothing is written when there are none. Safe to
                retry with an `Idempotency-Key`: a lost answer replays instead of adding the same
                quantities twice. The caller empties its local guest cart once this answers.
            operationId: mergeCart
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MergeCartRequest'
            responses:
                '200':
                    description: The updated cart, and what happened to each guest line
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MergeCartResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # `IDEMPOTENCY_IN_FLIGHT`: another request with this key is still running.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                # Also `IDEMPOTENCY_KEY_MISMATCH`: this key was used with a different body.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /cart/reorder/{orderId}:
        post:
            tags: [Cart]
            summary: Reorder (refill cart from a past order)
            description: Copies the lines of one of the authenticated user's own orders back into their cart — quantities from the order, added on top of what the cart already holds. The order stores product snapshots, so each line is re-resolved against the catalogue as it is today; products that have since been removed, deactivated or hidden are skipped, and the returned cart view is the record of what actually landed. A line that would pass 999 is clamped to what room is left instead, and skipped outright once there is none — the same best-effort treatment as an unavailable product. Admins are scoped to their own orders too — the cart being filled is the caller's.
            operationId: reorder
            security:
                - bearerAuth: []
            parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: One of the caller's own orders
            responses:
                '200':
                    description: The updated cart
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # Well-formed order id that matches none of the caller's own orders.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # Every product on the order has left the public catalogue — nothing to add.
                # `errors[].code` is `REORDER_UNAVAILABLE`.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # ---------- cart — the schemas only this module's paths reference. ----------
        CartResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/CartResponse'

        CartSummaryResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/CartSummaryResponse'

        CheckoutResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Order'

        CartQuantity:
            type: integer
            minimum: 1
            maximum: 999
            description: >-
                Bounded at both ends, and this bound is on the STORED line, not only the request:
                `POST /cart` and `PUT /cart/{productId}` set a line to exactly this value, which
                already fits; a caller that instead adds to an existing line (the wishlist's
                move-to-cart) is refused past it with 422 `CART_QUANTITY_LIMIT` rather than
                silently overflowing. The ceiling is not a stock check — stock is verified at
                checkout, which refuses with `CART_INSUFFICIENT_STOCK` and is the real boundary.
                This stops a cart holding a quantity no order could ever be, whose only effect is
                a nonsense summary total and arithmetic far outside any range the money code is
                exercised over.

        AddCartItemRequest:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                quantity:
                    $ref: '#/components/schemas/CartQuantity'

        MergeCartRequest:
            type: object
            additionalProperties: false
            required: [lines]
            properties:
                lines:
                    type: array
                    minItems: 1
                    maxItems: 100
                    description: The guest cart's lines. A product listed twice is two lines, summed like two `POST /cart`s.
                    items:
                        $ref: '#/components/schemas/AddCartItemRequest'

        MergeLineReason:
            type: string
            description: >-
                Why a guest line did not land exactly as asked. Absent when it did.

                - `summed`: the cart already held some of the product, so `resulting` is the sum.
                - `capped`: the sum would pass the per-line cap (`NODE_CART_LINE_MAX`); `resulting` is the cap.
                - `unavailable`: the product is not publicly visible any more (deleted or hidden);
                  nothing was added, `resulting` is what the cart already held (often 0). A product
                  that is merely sold out is NOT unavailable: it is added and flagged
                  `insufficientStock`.
            enum: [summed, capped, unavailable]

        MergeLineResult:
            type: object
            additionalProperties: false
            required: [productId, requested, resulting, insufficientStock]
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                requested:
                    type: integer
                    minimum: 1
                    description: What the guest line asked for.
                resulting:
                    type: integer
                    minimum: 0
                    description: What the cart holds for this product after the merge.
                reason:
                    $ref: '#/components/schemas/MergeLineReason'
                insufficientStock:
                    type: boolean
                    description: >-
                        True when `resulting` is more than is for sale. A flag, never the number left.
                        Independent of `reason`: a line can be `summed` and short.

        MergeCartResponse:
            type: object
            additionalProperties: false
            required: [cart, lines]
            properties:
                cart:
                    $ref: '#/components/schemas/CartResponse'
                lines:
                    type: array
                    description: One result per submitted line, in request order.
                    items:
                        $ref: '#/components/schemas/MergeLineResult'

        MergeCartResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/MergeCartResponse'

        UpdateCartItemByIdRequest:
            type: object
            additionalProperties: false
            required: [quantity]
            properties:
                quantity:
                    $ref: '#/components/schemas/CartQuantity'

        RemoveCartItemRequest:
            type: object
            additionalProperties: false
            required: [productId]
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        SetCartShippingMethodRequest:
            type: object
            additionalProperties: false
            required: [shippingMethodId]
            properties:
                shippingMethodId:
                    type: string
                    maxLength: 64
                    minLength: 1
                    nullable: true
                    description: >-
                        Which shipping method (see `GET /delivery/methods`) the cart plans to ship
                        by. `null` clears the choice. An id that matches no method refuses with
                        404, `errors[].code` `CART_SHIPPING_METHOD_NOT_FOUND`; one that does not
                        apply to the basket refuses with 409 (`CART_SHIPPING_NOT_APPLICABLE`,
                        `CART_SHIPPING_METHOD_WEIGHT`).

        ExpectedTotal:
            type: object
            additionalProperties: false
            required: [amount, currency]
            description: >-
                An order total as the buyer saw it, or as the checkout would charge it. The amount is
                in minor units (cents), so two totals compare as integers and never as floats.
            properties:
                amount:
                    type: integer
                    minimum: 0
                    description: The total in minor units of `currency` (EUR 71.00 is 7100).
                currency:
                    type: string
                    minLength: 3
                    maxLength: 3
                    description: The ISO-4217 code the total is priced in.

        CheckoutRequest:
            type: object
            additionalProperties: false
            required: [expectedTotal]
            properties:
                expectedTotal:
                    $ref: '#/components/schemas/ExpectedTotal'
                    # What the screen showed right before the press (EU Directive 2011/83 Art. 8(2)): items
                    # plus shipping, from `GET /cart`'s `summary`. Required, so a client that did not show
                    # a total cannot place the order.
                notes:
                    type: string
                    maxLength: 1000
                    minLength: 1
                    description: Optional order notes. Left out when there are none; an empty string is a 422.
                addressId:
                    allOf: [{ $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id' }]
                    description: >-
                        Which of the caller's saved addresses to SHIP to — meaningful only when a
                        line ships to an address. Omitted, the default address is used; an id that
                        matches none of the caller's addresses refuses the checkout with 404 rather
                        than shipping nowhere. A method with `requiresAddress: true` and no address
                        resolved refuses with 422, `errors[].code` `CART_ADDRESS_REQUIRED`. Sent for
                        a basket that ships to no address (all-digital, or a pickup method) it
                        refuses with 409, `CART_ADDRESS_NOT_APPLICABLE`. The shipping method itself
                        is not part of this request — it is the cart's own choice, set ahead of time
                        via `PUT /cart/shipping-method`.
                billingAddressId:
                    allOf: [{ $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id' }]
                    description: >-
                        Which of the caller's saved addresses the order is INVOICED to (the order's
                        `billingAddress`). Omitted, it is "same as the shipping address" when one
                        was resolved, otherwise the default address; with neither the checkout
                        refuses with 422, `errors[].code` `CART_BILLING_ADDRESS_REQUIRED`. An
                        all-digital checkout asks for this one only. An id that matches none of the
                        caller's addresses refuses with 404, `CART_ADDRESS_NOT_FOUND`. Unlike the
                        shipping address, billing is not held to `NODE_SHIP_TO_COUNTRIES`.
                paymentMethod:
                    allOf:
                        [
                            {
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaymentMethodId'
                            }
                        ]
                    default: card
                    description: >-
                        How the customer intends to pay (see `GET /payments/methods`). `card`
                        holds stock for `NODE_RESERVATION_TTL_MINUTES`; `bank_transfer` holds it
                        for `NODE_BANK_TRANSFER_HOLD_HOURS` instead, and the response carries
                        `transferInstructions`. A method this deployment does not offer refuses
                        the checkout with 409, `errors[].code` `CART_PAYMENT_METHOD_NOT_AVAILABLE`.
                        That includes the default: a request that names no method asks for `card`,
                        so a deployment with no card provider refuses it the same way.

        CartSummaryResponse:
            type: object
            additionalProperties: false
            required: [itemsCount, totalQuantity, itemsTotal, shippingCost, totalPrice, currency]
            properties:
                itemsCount:
                    type: integer
                    minimum: 0
                    description: Number of distinct cart lines/items
                totalQuantity:
                    type: integer
                    minimum: 0
                    description: Sum of quantities across all items
                itemsTotal:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        Sum of item prices * quantity. Gross — VAT included, same as each product's
                        own `price` — before shipping. There are no discounts to net out.
                shippingCost:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        What the cart's chosen shipping method (`PUT /cart/shipping-method`) costs
                        against `itemsTotal` right now (free-above thresholds included). `0` with
                        no method chosen, a digital-only basket, or a method that no longer fits
                        the basket's weight — the same real-time pricing `POST /cart/checkout`
                        freezes onto the order, priced early so a shopper sees the true total
                        before paying.
                totalPrice:
                    type: number
                    format: double
                    minimum: 0
                    description: itemsTotal + shippingCost
                currency:
                    type: string
                    description: ISO-4217 currency code (e.g. USD)

        CartResponse:
            type: object
            additionalProperties: false
            required: [items, summary, shipping]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/CartResponseItem'
                summary:
                    $ref: '#/components/schemas/CartSummaryResponse'
                shipping:
                    $ref: '#/components/schemas/CartShipping'

        CartResponseItem:
            type: object
            additionalProperties: false
            required: [productId, quantity, insufficientStock]
            description: >-
                One line of the basket as the cart answers it: the stored line plus whether it fits
                what is for sale. Not `CartItem`, which stays the bare stored line the export and the
                order request use.
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                quantity:
                    type: integer
                    minimum: 1
                insufficientStock:
                    type: boolean
                    description: >-
                        True when `quantity` is more than is for sale right now. A flag and never the
                        number left: exact stock is for callers holding `inventory.any.read`, the same
                        level of disclosure as checkout's `CART_INSUFFICIENT_STOCK`. Read from the stock
                        ledger by the cart view, the merge and checkout through one rule; `POST /cart`
                        and `PUT` still do not refuse a line for stock, so a client polling `GET /cart`
                        is how it learns a line has gone short.

        CartShippingOption:
            type: object
            additionalProperties: false
            required: [id, price, requiresAddress, tracked]
            description: >-
                One shipping method as it applies to THIS basket right now — a narrowed,
                already-priced projection of `GET /delivery/methods`' `ShippingMethod`, so a client
                never re-derives what it costs or whether it fits.
            properties:
                id:
                    type: string
                    description: Matches a `ShippingMethod.id` from `GET /delivery/methods`.
                price:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        What this method costs against `summary.itemsTotal` right now (free-above
                        thresholds included) — the same figure `PUT /cart/shipping-method` would
                        freeze into `summary.shippingCost` if chosen.
                requiresAddress:
                    type: boolean
                    description: Whether choosing this method requires a shipping address.
                tracked:
                    type: boolean
                    description: Whether a parcel sent by this method carries a tracking code.

        CartShipping:
            type: object
            additionalProperties: false
            required: [required, selected, options]
            description: >-
                What this basket needs from shipping, and what it may choose from — replaces a
                client computing its own basket weight and free-above math against the unfiltered
                `GET /delivery/methods` catalogue.
            properties:
                required:
                    type: boolean
                    description: >-
                        Whether this basket needs a shipping method at all — `false` for an
                        all-digital cart, which `PUT /cart/shipping-method` and checkout both
                        refuse a method against (`CART_SHIPPING_NOT_APPLICABLE`).
                selected:
                    type: string
                    nullable: true
                    description: >-
                        The cart's chosen shipping method (`PUT /cart/shipping-method`). `null`
                        when none is chosen, when `required` is `false`, or once the stored choice
                        no longer fits the basket's weight — the same "reads as none" state
                        checkout itself falls back to (`CART_SHIPPING_METHOD_REQUIRED`).
                options:
                    type: array
                    items:
                        $ref: '#/components/schemas/CartShippingOption'
                    description: >-
                        Every method that currently fits this basket, already priced against
                        `summary.itemsTotal` — empty whenever `required` is `false`.
                        `GET /delivery/methods` remains the full, unfiltered catalogue this is
                        drawn from.

        # ---------- Observability ----------
