openapi: 3.1.0
info:
    title: cart — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Cart
      description: The signed-in user's cart, and turning it into an order.

x-error-codes:
    CART_ADDRESS_NOT_APPLICABLE: { status: 409, description: 'Nothing in this checkout ships to an address (all-digital, or a method that ships to none), so a shipping `addressId` cannot apply.' }
    CART_ADDRESS_NOT_FOUND: { status: 404, description: 'The named address does not exist, or does not belong to the caller.' }
    CART_ADDRESS_REQUIRED: { status: 422, description: 'A shipping address is required and none was supplied or found on file.' }
    CART_BILLING_ADDRESS_REQUIRED: { status: 422, description: 'No billing address could be resolved — none was named, nothing ships, and the address book has no default.' }
    CART_CHANGED: { status: 409, description: 'The cart changed between the request that read it and this write — reload and retry.' }
    CART_EMPTY: { status: 409, description: 'Checkout was attempted on a cart with no lines.' }
    CART_INSUFFICIENT_STOCK: { status: 409, description: 'One or more lines cannot be bought as they stand — see `errors[].details.lines`, one entry per refused line with its `productId`, `title`, the `requested` quantity and its `availability` (`insufficient_stock`, `out_of_stock` or `unavailable`, so the client picks the message). The number left is not part of the answer: exact stock is for callers who read it (`read:StockLevel`).' }
    CART_OPEN_ORDER_LIMIT_REACHED: { status: 409, description: 'The account already holds `NODE_MAX_OPEN_UNPAID_ORDERS_PER_ACCOUNT` unpaid orders, whatever their payment method — each holds stock. `errors[].details.orderIds` names them: pay one (`POST /payments`) or cancel one (`POST /orders/{id}/cancel`), then check out again.' }
    CART_PAYMENT_METHOD_NOT_AVAILABLE: { status: 409, description: 'The chosen payment method is not enabled for this deployment or this cart.' }
    CART_PRODUCT_UNAVAILABLE: { status: 409, description: 'A line references a product that was deleted or hidden (`active: false`) since it was added: its `availability` is `removed`. A product merely taken off sale is `unavailable` and refused as `CART_INSUFFICIENT_STOCK`.' }
    CART_PURCHASE_HOLD: { status: 409, description: 'The account is under a purchase hold: a protective pause after repeated cancellations, or one set by staff. `errors[].details` carries `until` (when checkout opens again), `reason` (`repeated_cancellations` or `staff`) and, for a staff hold, the `note` written for the buyer. Paying an existing order, cancelling, a withdrawal and a return are never blocked; the buyer can contest it through the contact form.' }
    CART_QUANTITY_LIMIT: { status: 422, description: 'The requested quantity exceeds the per-line limit.' }
    CART_SHIPPING_METHOD_NOT_FOUND: { status: 404, description: 'The named shipping method does not exist or is not offered.' }
    CART_SHIPPING_METHOD_REQUIRED: { status: 422, description: 'A shipping method is required and none is set on the cart.' }
    CART_SHIPPING_METHOD_WEIGHT: { status: 409, description: 'The cart''s total weight falls outside the chosen shipping method''s configured range.' }
    CART_SHIPPING_NOT_APPLICABLE: { status: 409, description: 'The chosen shipping method does not apply to an all-digital cart.' }
    CART_TOTAL_CHANGED: { status: 409, description: 'The total the buyer was shown is not the total this checkout would charge — a price, a shipping cost or the cart itself changed. `errors[].details` carries `expected` (what the request named) and `actual` (what the order would cost now), each `{ amount, currency }` in minor units; show the new total and let the buyer confirm.' }
    CART_SHIP_TO_COUNTRY_NOT_SUPPORTED: { status: 422, description: 'The address''s country is outside this deployment''s configured ship-to list.' }
    EMAIL_NOT_VERIFIED: { status: 403, description: 'Checkout requires a verified email address — see `POST /account/email-verification/resend`.' }
    REORDER_UNAVAILABLE: { status: 409, description: 'The past order named for reorder no longer has any purchasable lines.' }

# This module's section of the account data export (`POST /account/export`): the bundler
# adds it to `AccountExportResponse`. Removing the module removes the section.
x-personal-data:
    cart:
        schema:
            type: array
            items:
                $ref: '#/components/schemas/CartItem'

paths:
    /cart:
        get:
            tags: [Cart]
            summary: Get cart
            description: Returns all items currently in the authenticated user's cart along with a computed summary
            operationId: getCart
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Cart items
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }

    /cart/items:
        post:
            tags: [Cart]
            summary: Add to cart
            description: >-
                "Add to cart": a product with no line in the caller's cart gets one, and a line
                already there GROWS by `quantity` — pressing the button twice makes two (Shopify's
                `/cart/add`, commercetools' `addLineItem`). A line is written through its parent, so
                the answer is always 200 with the whole cart: no `Location`, no read of a line. The
                line may not pass the per-line cap (422). To SET a quantity,
                `PATCH /cart/items/{productId}`.
            operationId: addCartItem
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddCartItemRequest'
            responses:
                '200':
                    description: The cart after the add; a new line was pushed, or the existing one grew
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # Well-formed product id that matches no product. 422 covers the malformed case.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
        delete:
            tags: [Cart]
            summary: Clear cart
            description: Empties the authenticated user's cart entirely. Bodyless on purpose — the destructive spelling gets its own URL, and any body on it is refused (415), so a body can never turn a one-line delete into this. Returns the (empty) cart; clearing an already-empty cart is the state the caller asked for, so also 200.
            operationId: clearCart
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Cart cleared
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }

    /cart/items/{productId}:
        patch:
            tags: [Cart]
            summary: Set cart item quantity
            description: Sets the quantity of the cart line for the product identified by `{productId}` in the path — the quantity, not an increment; `POST /cart/items` is the door that adds. A change never creates, so a product the cart holds no line for is 404 `cart.item-not-found`, and a held line whose product the storefront no longer shows is 404 `products.not-found`. Repeating it changes nothing. Returns the updated cart.
            operationId: updateCartItemById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/ProductIdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCartItemByIdRequest'
                    application/merge-patch+json:
                        schema:
                            $ref: '#/components/schemas/UpdateCartItemByIdRequest'
            responses:
                '200':
                    description: Updated cart
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '415': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/UnsupportedMediaType' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
        delete:
            tags: [Cart]
            summary: Remove item from cart
            description: Removes the cart line for the product identified by `{productId}` in the path from the authenticated user's cart. Returns the updated cart.
            operationId: removeCartItem
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/ProductIdPathParam'
            responses:
                '200':
                    description: Updated cart
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # Well-formed product id that matches no cart line. A malformed id is the same 404.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }

    /cart/shipping-method:
        put:
            tags: [Cart]
            summary: Choose (or clear) the cart's shipping method
            description: Sets which shipping method (see `GET /delivery/methods`) the cart plans to ship by, ahead of checkout — priced and validated against the basket as it stands right now. `null` clears the choice. Checkout re-validates from scratch regardless of what this endpoint accepted, since the basket may change afterward. Returns the updated cart, including the priced `summary.shippingCost`/`summary.totalPrice`.
            operationId: setCartShippingMethod
            x-error-codes:
                '409': [CART_SHIPPING_METHOD_WEIGHT, CART_SHIPPING_NOT_APPLICABLE]
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetCartShippingMethodRequest'
            responses:
                '200':
                    description: Updated cart
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # A named method that matches none of `GET /delivery/methods`'.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /cart/summary:
        get:
            tags: [Cart]
            summary: Get cart summary
            description: Returns a lightweight summary of the authenticated user's cart.
            operationId: getCartSummary
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Cart summary
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CartSummaryResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }

    /cart/checkout:
        post:
            tags: [Orders]
            summary: Checkout (place order from cart)
            description: Converts the authenticated user's current cart into a new order. Needs a critically fresh session (`401 REAUTH_REQUIRED`), asked after the verified-address key, so a caller who can never pass is refused first. The cart is cleared upon success. The request names the total the buyer was shown (`expectedTotal`); a checkout that would charge anything else is refused with 409 `CART_TOTAL_CHANGED` and the new total, before any stock is held. Optional order notes can be supplied in the request body. Answers 201 with the created order itself as the body — the same shape `POST /orders` answers — and its `Location`. The order's email is always the authenticated caller's own — checkout is account-bound; a future guest checkout would bring an `email` field back.
            operationId: checkout
            x-error-codes:
                '401': [REAUTH_REQUIRED]
                '404': [CART_ADDRESS_NOT_FOUND]
                # A stored shipping choice the basket no longer fits (gone digital-only, outgrown the method) is not a
                # refusal here: it reads as no choice, as in `GET /cart`'s `shipping.selected`.
                '409': [CART_ADDRESS_NOT_APPLICABLE, CART_CHANGED, CART_EMPTY, CART_INSUFFICIENT_STOCK, CART_OPEN_ORDER_LIMIT_REACHED, CART_PAYMENT_METHOD_NOT_AVAILABLE, CART_PURCHASE_HOLD, CART_TOTAL_CHANGED, IDEMPOTENCY_IN_FLIGHT]
                # A `billingAddressId` that names none of the caller's addresses is the same 404 as `addressId`.
                '422': [CART_ADDRESS_REQUIRED, CART_BILLING_ADDRESS_REQUIRED, CART_SHIPPING_METHOD_REQUIRED, CART_SHIP_TO_COUNTRY_NOT_SUPPORTED, IDEMPOTENCY_KEY_MISMATCH]
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckoutRequest'
            responses:
                '201':
                    description: Order created
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '../orders/openapi.yaml#/components/schemas/Order'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # The per-account checkout budget (`NODE_CHECKOUT_RATE_LIMIT_MAX`, 10 per window).
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }

    /cart/merge:
        post:
            tags: [Cart]
            summary: Merge a guest cart into the cart
            description: >-
                Adds every line of a cart built while signed out, in one call, by the same rule as
                `POST /cart/items`: a product already in the cart GROWS by the line's quantity, a new one
                gets a line. The answer holds the cart as it now stands and ONE RESULT PER SUBMITTED
                LINE, in request order, saying what the line asked for (`requested`), what the cart
                holds for that product now (`resulting`) and, when the two differ or the line did
                not land cleanly, why (`reason`). A line the cart cannot take is not a failure: the
                call still answers 200, because one bad line must not strand the rest. Stock is CHECKED,
                not enforced: a line that is short is still added (a stock-out is temporary) and
                flagged through its `availability` (`insufficient_stock`, `out_of_stock`, or `unavailable` for a
                product taken off sale), with the quantity left as the sum, so the answer never
                says how many are for sale. The same rule runs at checkout, which refuses, and in
                `GET /cart`, which flags, all three reading the stock ledger. Lines that could not be
                added at all (`removed`: the product is deleted or hidden) are also written as ONE notification
                (`shop-tasks.cart-merge-refused`); nothing is written when there are none. Safe to
                retry with an `Idempotency-Key`: a lost answer replays instead of adding the same
                quantities twice. The caller empties its local guest cart once this answers.
            operationId: mergeCart
            x-error-codes:
                '409': [IDEMPOTENCY_IN_FLIGHT]
                '422': [IDEMPOTENCY_KEY_MISMATCH]
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MergeCartRequest'
            responses:
                '200':
                    description: The updated cart, and what happened to each guest line
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MergeCartResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    /cart/reorder:
        post:
            tags: [Cart]
            summary: Reorder (refill cart from a past order)
            description: Copies the lines of one of the authenticated user's own orders back into their cart — quantities from the order, added on top of what the cart already holds. The order stores product snapshots, so each line is re-resolved against the catalogue as it is today; products that have since been removed, deactivated or hidden are skipped, and the answer holds the cart as it now stands and ONE RESULT PER ORDER LINE, in the order's own order, by the same rule and in the same shape as `POST /cart/merge` (`requested`, `resulting`, `reason`, `availability`). A line that would pass the per-line ceiling (`NODE_CART_LINE_MAX`) is clamped to what room is left (`capped`), and adds nothing once there is none; an unavailable product is `removed`. Neither is a failure. Any signed-in account, staff included, reorders only its own orders — the cart being filled is the caller's.
            operationId: reorder
            x-error-codes:
                '409': [REORDER_UNAVAILABLE]
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReorderRequest'
            responses:
                '200':
                    description: The updated cart, and what happened to each order line
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReorderResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # Well-formed order id that matches none of the caller's own orders. A malformed one is
                # a 422 on `orderId`: the id is a body field, so it is an argument, not a URL.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

components:
    schemas:
        # ---------- cart — the schemas only this module's paths reference. ----------
        CartQuantity:
            type: integer
            minimum: 1
            maximum: 999
            description: >-
                Bounded at both ends, and this bound is on the STORED line, not only the request:
                `PATCH /cart/items/{productId}` sets a line to exactly this value, which already fits;
                a caller that instead adds to an existing line (`POST /cart/items`, the wishlist's
                move-to-cart) is refused past it with 422 `CART_QUANTITY_LIMIT` rather than
                silently overflowing. The ceiling is not a stock check — stock is verified at
                checkout, which refuses with `CART_INSUFFICIENT_STOCK` and is the real boundary.
                This stops a cart holding a quantity no order could ever be, whose only effect is
                a nonsense summary total and arithmetic far outside any range the money code is
                exercised over.

        AddCartItemRequest:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                quantity:
                    $ref: '#/components/schemas/CartQuantity'

        # An action on the cart with its input in the body, like `POST /cart/merge {lines}` (AIP-136).
        ReorderRequest:
            type: object
            additionalProperties: false
            required: [orderId]
            properties:
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                    description: One of the caller's own orders

        MergeCartRequest:
            type: object
            additionalProperties: false
            required: [lines]
            properties:
                lines:
                    type: array
                    minItems: 1
                    maxItems: 100
                    description: The guest cart's lines. A product listed twice is two lines, summed like two `POST /cart/items`s.
                    items:
                        $ref: '#/components/schemas/AddCartItemRequest'

        # One value for a cart line, a wishlist line and a merge result. Google's feed vocabulary.
        # First match wins: removed, unavailable, out_of_stock, insufficient_stock, preorder, backorder, in_stock.
        LineAvailability:
            type: string
            description: >-
                Whether a saved line can be bought right now.

                - `in_stock`: buyable, enough stock.
                - `preorder`: buyable before its release date; it ships from `releaseDate`. Judged
                  against the preorder allowance, so `out_of_stock` and `insufficient_stock` mean
                  the allowance is full or short, not that the shelf is empty.
                - `backorder`: a released product the shop keeps selling while it is out of stock.
                  The shelf covers less than the line asks for (or nothing, for a wishlist line), and
                  the rest is owed, to arrive by the product's `restockDate` or within 30 days. Judged
                  against the shelf and the room under the cap together, so `out_of_stock` and
                  `insufficient_stock` mean both are used up.
                - `insufficient_stock`: some left, fewer than the line wants (cart lines only).
                - `out_of_stock`: none left.
                - `unavailable`: the product is taken off sale (`purchasable: false`).
                - `removed`: the product is hidden (`active: false`) or deleted. The line is kept,
                  and returns to a stock value if the product is shown again.

                Never a number: exact stock stays behind `read:StockLevel`.
            enum: [in_stock, preorder, backorder, insufficient_stock, out_of_stock, unavailable, removed]

        MergeLineReason:
            type: string
            description: >-
                Why a merged guest line or a reordered order line did not land exactly as asked. Absent when it did.

                - `summed`: the cart already held some of the product, so `resulting` is the sum.
                - `capped`: the sum would pass the per-line cap (`NODE_CART_LINE_MAX`); `resulting` is the cap.
                - `removed`: the product is not publicly visible any more (deleted or hidden);
                  nothing was added, `resulting` is what the cart already held (often 0). A product
                  that is merely sold out, or taken off sale, is NOT removed: it is added and
                  flagged through `availability`.
            enum: [summed, capped, removed]

        MergeLineResult:
            type: object
            additionalProperties: false
            required: [productId, requested, resulting, availability]
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                requested:
                    type: integer
                    minimum: 1
                    description: What the guest line (or the order line) asked for.
                resulting:
                    type: integer
                    minimum: 0
                    description: What the cart holds for this product after the merge or reorder.
                reason:
                    $ref: '#/components/schemas/MergeLineReason'
                # What `resulting` can do right now. Never the number left. Independent of
                # `reason`: a line can be `summed` and short.
                availability:
                    $ref: '#/components/schemas/LineAvailability'

        MergeCartResponse:
            type: object
            additionalProperties: false
            required: [cart, lines]
            properties:
                cart:
                    $ref: '#/components/schemas/CartResponse'
                lines:
                    type: array
                    description: One result per submitted line, in request order.
                    items:
                        $ref: '#/components/schemas/MergeLineResult'

        ReorderResponse:
            type: object
            additionalProperties: false
            required: [cart, lines]
            properties:
                cart:
                    $ref: '#/components/schemas/CartResponse'
                lines:
                    type: array
                    description: One result per order line, in the order's own order.
                    items:
                        $ref: '#/components/schemas/MergeLineResult'

        UpdateCartItemByIdRequest:
            type: object
            additionalProperties: false
            required: [quantity]
            properties:
                quantity:
                    $ref: '#/components/schemas/CartQuantity'

        SetCartShippingMethodRequest:
            type: object
            additionalProperties: false
            required: [shippingMethodId]
            properties:
                shippingMethodId:
                    type: [string, 'null']
                    maxLength: 64
                    minLength: 1
                    description: >-
                        Which shipping method (see `GET /delivery/methods`) the cart plans to ship
                        by. `null` clears the choice. An id that matches no method refuses with
                        404, `errors[].code` `CART_SHIPPING_METHOD_NOT_FOUND`; one that does not
                        apply to the basket refuses with 409 (`CART_SHIPPING_NOT_APPLICABLE`,
                        `CART_SHIPPING_METHOD_WEIGHT`).

        ExpectedTotal:
            type: object
            additionalProperties: false
            required: [amount, currency]
            description: >-
                An order total as the buyer saw it, or as the checkout would charge it. The amount is
                in minor units (cents), so two totals compare as integers and never as floats.
            properties:
                amount:
                    type: integer
                    minimum: 0
                    description: The total in minor units of `currency` (EUR 71.00 is 7100).
                currency:
                    allOf: [{ $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CurrencyCode' }]
                    description: The ISO-4217 code the total is priced in.

        CheckoutRequest:
            type: object
            additionalProperties: false
            required: [expectedTotal]
            properties:
                expectedTotal:
                    $ref: '#/components/schemas/ExpectedTotal'
                    # What the screen showed right before the press (EU Directive 2011/83 Art. 8(2)): items
                    # plus shipping, from `GET /cart`'s `summary`. Required, so a client that did not show
                    # a total cannot place the order.
                notes:
                    type: string
                    maxLength: 1000
                    minLength: 1
                    description: Optional order notes. Left out when there are none; an empty string is a 422.
                addressId:
                    allOf: [{ $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id' }]
                    description: >-
                        Which of the caller's saved addresses to SHIP to — meaningful only when a
                        line ships to an address. Omitted, the default address is used; an id that
                        matches none of the caller's addresses refuses the checkout with 404 rather
                        than shipping nowhere. A method with `requiresAddress: true` and no address
                        resolved refuses with 422, `errors[].code` `CART_ADDRESS_REQUIRED`. Sent for
                        a basket that ships to no address (all-digital, or a pickup method) it
                        refuses with 409, `CART_ADDRESS_NOT_APPLICABLE`. The shipping method itself
                        is not part of this request — it is the cart's own choice, set ahead of time
                        via `PUT /cart/shipping-method`.
                billingAddressId:
                    allOf: [{ $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id' }]
                    description: >-
                        Which of the caller's saved addresses the order is INVOICED to (the order's
                        `billingAddress`). Omitted, it is "same as the shipping address" when one
                        was resolved, otherwise the default address; with neither the checkout
                        refuses with 422, `errors[].code` `CART_BILLING_ADDRESS_REQUIRED`. An
                        all-digital checkout asks for this one only. An id that matches none of the
                        caller's addresses refuses with 404, `CART_ADDRESS_NOT_FOUND`. Unlike the
                        shipping address, billing is not held to `NODE_SHIP_TO_COUNTRIES`.
                paymentMethod:
                    allOf:
                        [
                            {
                                $ref: '../orders/openapi.yaml#/components/schemas/PaymentMethodId'
                            }
                        ]
                    default: card
                    description: >-
                        How the customer intends to pay (see `GET /payments/methods`). `card`
                        holds stock for `NODE_RESERVATION_TTL_MINUTES`; `bank_transfer` holds it
                        for `NODE_BANK_TRANSFER_HOLD_HOURS` instead, and the response carries
                        `transferInstructions`. A method this deployment does not offer refuses
                        the checkout with 409, `errors[].code` `CART_PAYMENT_METHOD_NOT_AVAILABLE`.
                        That includes the default: a request that names no method asks for `card`,
                        so a deployment with no card provider refuses it the same way.

        CartSummaryResponse:
            type: object
            additionalProperties: false
            required: [itemsCount, totalQuantity, itemsTotal, shippingCost, totalPrice, currency, expectedTotal]
            properties:
                itemsCount:
                    type: integer
                    minimum: 0
                    description: Number of distinct cart lines/items
                totalQuantity:
                    type: integer
                    minimum: 0
                    description: Sum of quantities across all items
                itemsTotal:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        Sum of item prices * quantity. Gross — VAT included, same as each product's
                        own `price` — before shipping. There are no discounts to net out.
                shippingCost:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        What the cart's chosen shipping method (`PUT /cart/shipping-method`) costs
                        against `itemsTotal` right now (free-above thresholds included). `0` with
                        no method chosen, a digital-only basket, or a method that no longer fits
                        the basket's weight — the same real-time pricing `POST /cart/checkout`
                        freezes onto the order, priced early so a shopper sees the true total
                        before paying.
                totalPrice:
                    type: number
                    format: double
                    minimum: 0
                    description: itemsTotal + shippingCost
                currency:
                    allOf: [{ $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CurrencyCode' }]
                    description: ISO-4217 currency code (e.g. USD)
                expectedTotal:
                    allOf: [{ $ref: '#/components/schemas/ExpectedTotal' }]
                    description: >-
                        `totalPrice` in minor units, exactly as `POST /cart/checkout` compares it:
                        send it back unchanged as the checkout's `expectedTotal`. A client never
                        converts the decimal itself, so it needs no table of currency exponents.

        CartResponse:
            type: object
            additionalProperties: false
            required: [items, summary, shipping, checkoutable]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/CartResponseItem'
                summary:
                    $ref: '#/components/schemas/CartSummaryResponse'
                shipping:
                    $ref: '#/components/schemas/CartShipping'
                checkoutable:
                    type: boolean
                    description: >-
                        Whether every line can be bought as it stands (each line's `availability`
                        is `in_stock`, `preorder` or `backorder`) and the cart is not empty. Checkout
                        refuses the others (`CART_INSUFFICIENT_STOCK`, `CART_PRODUCT_UNAVAILABLE`);
                        a shipping method and an address are separate steps and not part of this.

        CartResponseItem:
            type: object
            additionalProperties: false
            required: [productId, quantity, availability, canIncrease]
            description: >-
                One line of the basket as the cart answers it: the stored line plus whether it can
                be bought as it stands. Not `CartItem`, which stays the bare stored line the export and the
                order request use.
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                quantity:
                    type: integer
                    minimum: 1
                # Whether `quantity` can be bought right now, never the number left: exact
                # stock is for callers holding `read:StockLevel`, the same level of
                # disclosure as checkout's `CART_INSUFFICIENT_STOCK`. Read from the stock
                # ledger and the catalogue by the cart view, the merge and checkout
                # through one rule; `POST /cart/items` and `PATCH` do not refuse a line for stock
                # or for being off sale, so a client polling `GET /cart` is how it learns
                # a line has gone short or unavailable.
                availability:
                    $ref: '#/components/schemas/LineAvailability'
                canIncrease:
                    type: boolean
                    description: >-
                        Whether the line can hold one more unit: `quantity` is below the shop's
                        per-line ceiling (`NODE_CART_LINE_MAX`). Stock plays no part, as for
                        `POST /cart/items`. A client disables its "+" on `false` instead of copying
                        the ceiling.

        CartShippingOption:
            type: object
            additionalProperties: false
            required: [id, price, requiresAddress, tracked]
            description: >-
                One shipping method as it applies to THIS basket right now — a narrowed,
                already-priced projection of `GET /delivery/methods`' `ShippingMethod`, so a client
                never re-derives what it costs or whether it fits.
            properties:
                id:
                    type: string
                    description: Matches a `ShippingMethod.id` from `GET /delivery/methods`.
                price:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        What this method costs against `summary.itemsTotal` right now (free-above
                        thresholds included) — the same figure `PUT /cart/shipping-method` would
                        freeze into `summary.shippingCost` if chosen.
                requiresAddress:
                    type: boolean
                    description: Whether choosing this method requires a shipping address.
                tracked:
                    type: boolean
                    description: Whether a parcel sent by this method carries a tracking code.

        CartShipping:
            type: object
            additionalProperties: false
            required: [required, options]
            description: >-
                What this basket needs from shipping, and what it may choose from — replaces a
                client computing its own basket weight and free-above math against the unfiltered
                `GET /delivery/methods` catalogue.
            properties:
                required:
                    type: boolean
                    description: >-
                        Whether this basket needs a shipping method at all — `false` for an
                        all-digital cart, which `PUT /cart/shipping-method` and checkout both
                        refuse a method against (`CART_SHIPPING_NOT_APPLICABLE`).
                selected:
                    type: string
                    description: >-
                        The cart's chosen shipping method (`PUT /cart/shipping-method`). Absent
                        when none is chosen, when `required` is `false`, or once the stored choice
                        no longer fits the basket's weight — the same "reads as none" state
                        checkout itself falls back to (`CART_SHIPPING_METHOD_REQUIRED`).
                options:
                    type: array
                    items:
                        $ref: '#/components/schemas/CartShippingOption'
                    description: >-
                        Every method that currently fits this basket, already priced against
                        `summary.itemsTotal` — empty whenever `required` is `false`.
                        `GET /delivery/methods` remains the full, unfiltered catalogue this is
                        drawn from.

        # ---------- Observability ----------

        CartItem:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                quantity:
                    type: integer
                    minimum: 1
