summary: 'One document per user, and checkout, the transaction the whole shop turns on.'
subdomain: core
group: shop
dependsOn:
    - addresses # the checkout's delivery address
    - delivery # shipping price, pure functions
    - inventory # how much can be sold, read from the ledger
    - orders # placeOrder — the one function every order is written through
    - payments # listPaymentMethods, to validate the requested method
    - products # prices and availability
    - shop # the currency and the countries the shop ships to
    - users # the buyer
rateLimits:
    checkout:
        name: Checkouts attempted
        namespace: checkout
        environmentVariable: NODE_CHECKOUT_RATE_LIMIT_MAX
        defaultMax: 10
        windowMs: shared
        bounds:
            'Requests to `POST /cart/checkout`, keyed on the ACCOUNT: each placed order holds stock and
            writes an order, a mail and a cache wipe, and an address-keyed budget would let one
            signed-in account behind a shared address starve every other caller on it.'
        audited: true
    cartMerge:
        name: Cart merges
        namespace: cart-merge
        environmentVariable: NODE_CART_MERGE_RATE_LIMIT_MAX
        defaultMax: 10
        windowMs: shared
        bounds:
            '`POST /cart/merge`: up to 100 lines per call, each a catalogue read and a cart write. Every
            request counts.'
        audited: true
