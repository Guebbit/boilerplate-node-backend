openapi: 3.1.0
info:
    title: products — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Products
      description: The catalogue - browsing, searching and managing products and their images.

paths:
    /products:
        get:
            tags: [Products]
            summary: List products (paginated)
            description: Returns a paginated list of products.
            operationId: listProducts
            security:
                - {}
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: sort
                  in: query
                  required: false
                  # JSON:API grammar: `?sort=-price,title` — comma-separated, `-` for descending.
                  style: form
                  explode: false
                  schema:
                      $ref: '#/components/schemas/ProductSort'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/TextParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdParam'
                # Declared here as well as in SearchProductsRequest: the controller merges query
                # and body, so `GET /products?category=x` and `POST /products/search {category}`
                # are one filter reached two ways.
                - name: category
                  in: query
                  required: false
                  schema:
                      type: string
                      maxLength: 200
                - name: tag
                  in: query
                  required: false
                  schema:
                      type: string
                      maxLength: 200
                - name: minPrice
                  in: query
                  required: false
                  schema:
                      type: number
                      format: double
                      minimum: 0
                - name: maxPrice
                  in: query
                  required: false
                  schema:
                      type: number
                      format: double
                      minimum: 0
                - name: title
                  in: query
                  schema:
                      type: string
                      maxLength: 200
                - name: active
                  in: query
                  schema:
                      type: boolean
                - name: purchasable
                  in: query
                  description: >-
                      `true` lists only products that can be bought, `false` only the ones taken
                      off sale. Open to every caller: an off-sale product is publicly listed.
                  schema:
                      type: boolean
                - name: deleted
                  in: query
                  description: >-
                      `true` lists only soft-deleted rows, `false` only live ones; absent lists
                      both. Admin-effective: a caller who cannot see deleted rows at all gets an
                      empty page for `true`.
                  schema:
                      type: boolean
            responses:
                '200':
                    description: Products page
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductsResponseEnvelope'
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        post:
            tags: [Products]
            summary: Create product
            description: >-
                Creates a new product with optional image upload. Words live in `translations`,
                one entry per locale — the fallback locale (`NODE_FALLBACK_LOCALE`) MUST be
                present and non-null, since a product with nothing to fall back to cannot exist.
                See `PATCH /products/{id}` for the three-way table a locale entry follows. A new
                product starts with no stock: units enter only through `POST /inventory/receipts`, the
                one transition that creates them, which needs `create:StockMovement` and leaves a ledger
                row. A client that wants an opening count creates the product, then receives it.
            operationId: createProduct
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateProductRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/CreateProductRequestMultipart'
            responses:
                '201':
                    description: Created product
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # SH4: a `sku` colliding with another product's.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `uploadLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        delete:
            tags: [Products]
            summary: Delete product
            description: Deletes the product identified by the `id` field in the request body. Set `hardDelete` to `true`, in the query or the body, to permanently remove the record; a `true` from any source wins, so a `false` sent elsewhere does not cancel it. A soft delete is one-way and safe to repeat — undo it with `POST /products/{id}/restore`.
            operationId: deleteProduct
            x-alias-of: deleteProductById
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            # The flag is readable from the query here too, exactly as it is on the `{id}` form:
            # one controller serves both, and `surface: 'delete'` reads params, query and body on
            # whichever route it is mounted on. Declared rather than merely tolerated.
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/HardDeleteParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeleteProductRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /products/categories:
        get:
            tags: [Products]
            summary: Catalogue facets
            description: Every category and tag the PUBLIC catalogue carries, each with how many visible products hold it — what a storefront renders as filter chips. Sorted by count descending, then name. Counts follow the same visibility rule the listing does, so a chip can never lead to an empty page.
            operationId: getCatalogueFacets
            security: []
            responses:
                '200':
                    description: Categories and tags with counts
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CatalogueFacetsEnvelope'
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /products/{id}:
        # Bundler: adds the `If-Match` parameter and 412 to the writes listed, and `ETag` to the 200s.
        x-versioned: [get, put, patch, delete]
        # Same as /products/id={id}
        get:
            tags: [Products]
            summary: Product details
            description: Returns the full details of the product identified by `{id}`. Functionally equivalent to `GET /products?id={id}`.
            operationId: getProductById
            security:
                - {}
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: Product
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductEnvelope'
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        put:
            tags: [Products]
            summary: Replace product
            description: |
                Replaces the product identified by `{id}` in the path (RFC 9110 §9.3.4) — every
                writable scalar field is required, since none of them but `taxClass`/`rateType`/
                `sku`/`weight`/`releaseDate` has a legal "cleared" state, and an omitted one of
                those five is cleared, not left alone. The image is outside the representation: it is set by an
                upload, cleared by an explicit `imageUrl: null`, and kept when a PUT never mentions
                it — a client cannot send the current path back. `translations` is the whole set as well: it must
                name the fallback locale, and every stored locale it leaves out is deleted. To
                change one locale without restating the others, use `PATCH`.
            operationId: replaceProductById
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReplaceProductRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/ReplaceProductRequestMultipart'
            responses:
                '200':
                    description: Replaced product
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # SH4: a `sku` colliding with another product's.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `uploadLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        # Merges, unlike the replacing PUT above — an omitted locale is left alone here.
        patch:
            tags: [Products]
            summary: Edit product
            description: |
                Updates the product identified by `{id}` in the path, merging. Every field but
                `translations` replaces the stored value when sent; `translations` merges (RFC
                7396) — three signals for a locale, and one level down for its fields:

                | the body says                   | the server does                                |
                | ------------------------------- | ----------------------------------------------- |
                | `"it"` absent                   | leaves the Italian row exactly as it is          |
                | `"it": { "title": "x" }`        | changes the Italian title only; the rest is kept |
                | `"it": { "description": null }` | clears the Italian description only              |
                | `"it": null`                    | deletes the Italian row                          |

                An empty translation object is a 422, never a delete — deletion is `null`, spent
                deliberately, so a mis-click can never delete translated work. `""` is never a
                value: clear a description with `null`. A title cannot be cleared. `null` on the
                fallback locale is a 422: deleting it would leave the product with nothing to fall
                back to. A validation failure names the locale in its pointer, e.g.
                `translations.it.title`.
            operationId: updateProductById
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateProductRequest'
                    application/merge-patch+json:
                        schema:
                            $ref: '#/components/schemas/UpdateProductRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/UpdateProductRequestMultipart'
            responses:
                '200':
                    description: Updated product
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # SH4: a `sku` colliding with another product's.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `uploadLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        # Same as DELETE /products
        delete:
            tags: [Products]
            summary: Delete product
            description: Deletes the product identified by `{id}` in the path. Pass the `hardDelete` query parameter as `true` to permanently remove the record. A soft delete is one-way and safe to repeat — undo it with `POST /products/{id}/restore`. Functionally equivalent to `DELETE /products`.
            operationId: deleteProductById
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/HardDeleteParam'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/HardDeleteRequest'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    # The editor's own read: every language a product has, not the caller's resolved one.
    /products/{id}/admin:
        # Bundler: adds the `If-Match` parameter and 412 to the writes listed, and `ETag` to the 200s.
        x-versioned: [get]
        get:
            tags: [Products]
            summary: Product, every language at once
            description: >-
                Every language this product has a row for, plus its price/stock/image — the shape
                the editor's form reads to populate its tabs. Unlike `GET /products/{id}`, this
                does not resolve to one language and is never cached: it's the screen someone is
                actively editing, the same reasoning `GET /locales/{locale}/entries` already
                applies.
            operationId: getProductAdmin
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: Product, every language
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductAdminEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    # Undoes a soft delete. A separate verb because DELETE must be safe to repeat (RFC 9110
    # §9.2.2): a retried DELETE never brings a record back.
    /products/{id}/restore:
        post:
            tags: [Products]
            summary: Restore product
            description: Undoes the soft delete of the product identified by `{id}`. Answers 409 when the product is not soft-deleted, so a restore can never be mistaken for an ordinary read.
            operationId: restoreProductById
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: Restored product
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    # Same as DELETE /products/{id}?hardDelete=true — the flag spelled in the path instead of
    # in the query. Both reach the same handler; neither is the canonical one.
    /products/{id}/hard:
        # Bundler: adds the `If-Match` parameter and 412 to the writes listed, and `ETag` to the 200s.
        x-versioned: [delete]
        delete:
            tags: [Products]
            summary: Permanently delete product
            description: Permanently removes the product identified by `{id}`, rather than soft-deleting it. Functionally equivalent to `DELETE /products/{id}?hardDelete=true`.
            operationId: hardDeleteProductById
            x-alias-of: deleteProductById
            security:
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Success' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    # Same as GET /products, but with JSON body, more suitable for DTOs and multi-language codegen
    /products/search:
        post:
            tags: [Products]
            summary: Search products (DTO-friendly)
            description: Searches and filters products via a JSON request body. Functionally equivalent to `GET /products` with query parameters.
            operationId: searchProducts
            security:
                - {}
                - bearerAuth: []
                - apiKeyAuth: []
            x-alias-of: listProducts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchProductsRequest'
            responses:
                '200':
                    description: Products search results
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductsResponseEnvelope'
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # The ONE sort grammar, shared with every list (docs/api/sorting.md). `-` sorts
        # descending; earlier entries rank first; ties end on the id. Text fields sort
        # case-insensitively.
        ProductSort:
            type: array
            minItems: 1
            maxItems: 3
            items:
                type: string
                enum: [createdAt, -createdAt, price, -price, title, -title]

        # ---------- products — the schemas only this module's paths reference. ----------
        ProductEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/Product'

        # One locale's words for a product, as read. The write shapes below carry the title's
        # length rules, enforced per locale — see the write operations' descriptions.
        ProductTranslationFields:
            type: object
            additionalProperties: false
            required: [title]
            properties:
                title:
                    type: string
                description:
                    type: string

        # `POST` and `PUT`'s locale entry: the whole locale, so `title` is required and an absent
        # `description` is no description. `""` is never a description.
        ProductTranslationFieldsWrite:
            type: object
            additionalProperties: false
            required: [title]
            properties:
                title:
                    type: string
                    minLength: 5
                    maxLength: 200
                description:
                    type: string
                    maxLength: 10000
                    minLength: 1

        # `PATCH`'s locale entry — RFC 7396 one level down: only the fields named change.
        ProductTranslationFieldsPatch:
            type: object
            additionalProperties: false
            properties:
                title:
                    type: string
                    minLength: 5
                    maxLength: 200
                    description: A title is never cleared — an empty locale is deleted with the locale's own `null`.
                description:
                    type: [string, 'null']
                    maxLength: 10000
                    minLength: 1
                    description: A string sets the description, `null` clears it, absent keeps it. `""` is a 422.

        ProductTranslationsPatch:
            type: object
            additionalProperties:
                oneOf:
                    - $ref: '#/components/schemas/ProductTranslationFieldsPatch'
                    - type: 'null'
            description: >-
                One or more locales, keyed by BCP 47 tag. A key absent from this map leaves that
                locale untouched; a key mapped to an object merges into it field by field (the
                fields it names change, the others keep what they have); a key mapped to null
                deletes it. An empty object is an error. The fallback locale
                (`NODE_FALLBACK_LOCALE`) MUST NOT be null.
            example:
                it:
                    description: null

        ProductTranslationsWrite:
            type: object
            additionalProperties:
                oneOf:
                    - $ref: '#/components/schemas/ProductTranslationFieldsWrite'
                    - type: 'null'
            description: >-
                One or more locales, keyed by BCP 47 tag, each stated WHOLE: a `PUT` replaces the
                set, so a stored locale this map omits is deleted and a `description` a locale
                omits is cleared. The fallback locale (`NODE_FALLBACK_LOCALE`) MUST be present and
                non-null on create and on `PUT`.
            example:
                en:
                    title: Orthopedic Memory Foam Dog Bed
                    description: Extra support for joints during rest.
                it:
                    title: Cuccia ortopedica in memory foam
                    description: Un supporto extra per le articolazioni durante il riposo.

        # Flat rather than `allOf: [Product, {...}]`: two `additionalProperties: false` schemas
        # composed with `allOf` each validate the WHOLE instance on their own, so the `Product`
        # branch alone would reject `translations` regardless of what the second branch allows.
        # `Product`'s own fields are restated here for that reason — the same trade-off
        # `CreateProductRequestMultipart` already makes against `CreateProductRequest`.
        ProductAdmin:
            type: object
            additionalProperties: false
            required: [id, title, price, currency, inStock, lowStock, translations]
            description: >-
                A product with every language it has a row for, not just the caller's resolved
                one — what the editor's form needs to populate its tabs. `title`/`description`
                stay the resolved (fallback-locale-derived) values; `translations` is the
                per-locale source.
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                title:
                    type: string
                price:
                    type: number
                    format: double
                    minimum: 0
                    description: Gross — VAT included. Same convention as `Product.price`.
                currency:
                    type: string
                    readOnly: true
                    description: ISO-4217 currency code (e.g. EUR) — see `Product.currency`.
                taxClass:
                    $ref: '#/components/schemas/TaxClass'
                rateType:
                    $ref: '#/components/schemas/RateType'
                sku:
                    $ref: '#/components/schemas/Sku'
                inStock:
                    type: boolean
                    readOnly: true
                    description: See `Product.inStock`.
                lowStock:
                    type: boolean
                    readOnly: true
                    description: See `Product.lowStock`.
                # The three counters follow `Product`: present only for a caller holding
                # `read:StockLevel`.
                onHand:
                    type: integer
                    minimum: 0
                    readOnly: true
                reserved:
                    type: integer
                    minimum: 0
                    readOnly: true
                available:
                    type: integer
                    minimum: 0
                    readOnly: true
                description:
                    type: string
                active:
                    type: boolean
                # Visible but not for sale right now: listed, add-to-cart accepted like a sold-out
                # product, checkout refused. Ignored while `active` is false (hidden wins).
                purchasable:
                    type: boolean
                releaseDate:
                    $ref: '#/components/schemas/ReleaseDate'
                allowBackorder:
                    type: boolean
                restockDate:
                    $ref: '#/components/schemas/RestockDate'
                # Derived, never stored: `active && purchasable && releaseDate > now`. Turns false by
                # itself when the date passes, so nothing has to run on the release day.
                preorder:
                    type: boolean
                    readOnly: true
                    description: >-
                        The product is on sale before its release date: buyers can order it now and it
                        ships from `releaseDate`.
                # Derived, never stored: `allowBackorder` on a released, visible, buyable product whose
                # restock date has not passed and whose cap has room.
                backorder:
                    type: boolean
                    readOnly: true
                    description: >-
                        The product may be ordered while its shelf is empty: the units arrive by
                        `restockDate`, or within 30 days when there is none. Always shown with that promise.
                requiresShipping:
                    type: boolean
                    default: true
                # Art. 16(c)-(d) CRD: goods made to order or clearly personalised, and perishable ones, carry no
                # right of withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                    default: false
                weight:
                    type: integer
                    minimum: 0
                    description: Grams. Absent counts as 0 for shipping-method filtering — the editor warns when it's missing.
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageUrl'
                thumbnailUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ThumbnailUrl'
                categories:
                    type: array
                    items:
                        type: string
                tags:
                    type: array
                    items:
                        type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                deletedAt:
                    type: string
                    format: date-time
                translations:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/ProductTranslationFields'

        ProductAdminEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
