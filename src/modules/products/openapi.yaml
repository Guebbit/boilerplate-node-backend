openapi: 3.1.0
info:
    title: products — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Products
      x-family: Catalogue
      description: The catalogue - browsing, searching and managing products and their images.

x-error-codes:
    PRODUCT_NOT_DELETED: { status: 409, description: 'A restore named a product that is not soft-deleted, so there is nothing to undo.' }

paths:
    /products:
        # Bundler: adds `ETag` and `Content-Location` to the 2xx answers: they name the resource this answers.
        x-versioned: [post]
        get:
            x-cache: revalidate
            tags: [Products]
            summary: List products (paginated)
            description: Returns a paginated list of products. Staff holding `display:Locale` may preview a draft language here (see the API description's Language paragraph); that answer is never cached. Each row's `actions` is all `false` for a caller answered from the shared cache; only a caller who sees more than a guest gets a `true`.
            operationId: listProducts
            security:
                - {}
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: sort
                  in: query
                  required: false
                  # JSON:API grammar: `?sort=-price,title` — comma-separated, `-` for descending.
                  style: form
                  explode: false
                  schema:
                      $ref: '#/components/schemas/ProductSort'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/TextParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdParam'
                # Declared here as well as in SearchProductsRequest: the controller merges query
                # and body, so `GET /products?category=x` and `POST /products/search {category}`
                # are one filter reached two ways.
                - name: category
                  in: query
                  required: false
                  schema:
                      type: string
                      maxLength: 200
                - name: tag
                  in: query
                  required: false
                  schema:
                      type: string
                      maxLength: 200
                - name: priceMin
                  in: query
                  required: false
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/NonNegativeDecimalAmount'
                - name: priceMax
                  in: query
                  required: false
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/NonNegativeDecimalAmount'
                - name: title
                  in: query
                  schema:
                      type: string
                      maxLength: 200
                - name: active
                  in: query
                  schema:
                      type: boolean
                - name: purchasable
                  in: query
                  description: >-
                      `true` lists only products that can be bought, `false` only the ones taken
                      off sale. Open to every caller: an off-sale product is publicly listed.
                  schema:
                      type: boolean
                - name: deleted
                  in: query
                  description: >-
                      `true` lists only soft-deleted rows, `false` only live ones; absent lists
                      both. Admin-effective: a caller who cannot see deleted rows at all gets an
                      empty page for `true`.
                  schema:
                      type: boolean
            responses:
                '200':
                    description: Products page
                    headers:
                        Cache-Control:
                            description: '`public, no-cache` for a caller who reads what a guest reads, who shares one cached answer: the server keeps it for an hour, the browser re-checks every time and gets a 304 while nothing changed; `private, no-cache` for staff who see more (inactive products, every language); `private, no-store` for a draft-language preview.'
                            schema: { type: string }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
        post:
            tags: [Products]
            summary: Create product
            description: >-
                Creates a new product with optional image upload. `title` and `description` are the
                product's own words, in the default language (`NODE_FALLBACK_LOCALE`); `translations`
                holds the OTHER languages, one entry per locale, and may be left out. A default-language
                key in `translations` is a 422: the top-level text already is that language. See
                `PATCH /products/{id}` for the three-way table a locale entry follows. A new
                product starts with no stock: units enter only through `POST /inventory/levels/{productId}/receive`, the
                one transition that creates them, which needs `create:StockMovement` and leaves a ledger
                row. A client that wants an opening count creates the product, then receives it.
            operationId: createProduct
            x-error-codes:
                '409': [IDEMPOTENCY_IN_FLIGHT]
                '422': [IDEMPOTENCY_KEY_MISMATCH]
            security:
                - bearerAuth: ['create:Product', 'update:Translation']
                - apiKeyAuth: ['create:Product', 'update:Translation']
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateProductRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/CreateProductRequestMultipart'
            responses:
                '201':
                    description: Created product
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Product'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # A `sku` colliding with another product's, or `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                # Also answered when `Idempotency-Key` was already used with a different body.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                # `uploadLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }

    /products/facets:
        get:
            x-cache: "max-age: 3600"
            tags: [Products]
            summary: Catalogue facets
            description: >-
                Every category and tag the PUBLIC catalogue carries, each with how many visible products hold it — what a storefront renders as filter chips. Sorted by count descending, then name. Counts follow the same visibility rule the listing does, so one chip alone never leads to an empty page. Counts are catalogue-wide: they do not follow the filters already chosen.
            operationId: getCatalogFacets
            security: []
            responses:
                '200':
                    description: Categories and tags with counts
                    headers:
                        Cache-Control:
                            description: '`public, max-age=3600, stale-while-revalidate=60, stale-if-error=300`: the shared cache and the browser may both keep it.'
                            schema: { type: string }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CatalogFacetsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }

    /products/{id}:
        # Bundler: adds the `If-Match` parameter and 412 to the writes listed, and `ETag` to the 200s.
        x-versioned: [get, put, patch, delete]
        # Same as /products/id={id}
        get:
            x-cache: revalidate
            tags: [Products]
            summary: Product details
            description: >-
                Returns the full details of the product identified by `{id}`. Functionally equivalent
                to `GET /products?id={id}`. `title` and `description` are always resolved to one
                language. A caller holding `read:Translation` also gets `translations`, every other
                language the product has a row for (drafts included), and `source`, the stored
                default-language text, for the editor's form: what the caller may see shapes the body,
                there is no separate staff URL. Staff holding `display:Locale`
                may preview a draft language here (see the API description's Language paragraph). A
                body that differs by caller is never served from, or stored in, the shared cache.
            operationId: getProductById
            security:
                - {}
                - bearerAuth: []
                - apiKeyAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: Product
                    headers:
                        Cache-Control:
                            description: '`public, no-cache`: the shared cache keeps it, a browser revalidates first. A caller who sees more than the public answer gets `private, no-cache`.'
                            schema: { type: string }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Product'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
        put:
            tags: [Products]
            summary: Replace product
            description: |
                Replaces the product identified by `{id}` in the path (RFC 9110 §9.3.4) — every
                writable scalar field is required, since none of them but `taxClass`/`rateType`/
                `sku`/`weight`/`releaseDate`/`restockDate` has a legal "cleared" state, and an omitted one of
                those six is cleared, not left alone. The image is outside the representation: it is set by an
                upload, cleared by an explicit `imageUrl: null`, and kept when a PUT never mentions
                it — a client cannot send the current path back. `title` is required and `description`
                is one of the cleared-by-omission fields: both are the default language's own words.
                `translations` is the whole set of OTHER languages as well: every stored locale it
                leaves out is deleted (`{}` deletes them all), and a default-language key is a 422. To
                change one locale without restating the others, use `PATCH`.
            operationId: replaceProductById
            security:
                - bearerAuth: ['update:Product', 'update:Translation']
                - apiKeyAuth: ['update:Product', 'update:Translation']
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReplaceProductRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/ReplaceProductRequestMultipart'
            responses:
                '200':
                    description: Replaced product
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Product'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # A `sku` colliding with another product's.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `uploadLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
        # Merges, unlike the replacing PUT above — an omitted locale is left alone here.
        patch:
            tags: [Products]
            summary: Edit product
            description: |
                Updates the product identified by `{id}` in the path, merging. Every field but
                `translations` replaces the stored value when sent (`title` and `description` are the
                default language's words; `description: null` clears it); `translations` merges (RFC
                7396), and holds the other languages only — three signals for a locale, and one level
                down for its fields:

                | the body says                   | the server does                                |
                | ------------------------------- | ----------------------------------------------- |
                | `"it"` absent                   | leaves the Italian row exactly as it is          |
                | `"it": { "title": "x" }`        | changes the Italian title only; the rest is kept |
                | `"it": { "description": null }` | clears the Italian description only              |
                | `"it": null`                    | deletes the Italian row                          |

                An empty translation object is a 422, never a delete — deletion is `null`, spent
                deliberately, so a mis-click can never delete translated work. `""` is never a
                value: clear a description with `null`. A title cannot be cleared. Any entry for the
                default language, `null` included, is a 422: that language is the top-level `title` and
                `description`. A validation failure names the locale in its pointer, e.g.
                `translations.it.title`.
            operationId: updateProductById
            security:
                - bearerAuth: ['update:Product', 'update:Translation']
                - apiKeyAuth: ['update:Product', 'update:Translation']
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateProductRequest'
                    application/merge-patch+json:
                        schema:
                            $ref: '#/components/schemas/UpdateProductRequest'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/UpdateProductRequestMultipart'
            responses:
                '200':
                    description: Updated product
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Product'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # A `sku` colliding with another product's.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `uploadLimiter` sits in front of this route — see routes.ts.
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
        delete:
            tags: [Products]
            summary: Delete product
            description: Deletes the product identified by `{id}` in the path. Pass the `hardDelete` query parameter as `true` to permanently remove the record. A soft delete is one-way and safe to repeat — undo it with `POST /products/{id}/restore`.
            operationId: deleteProductById
            security:
                - bearerAuth: ['delete:Product']
                - apiKeyAuth: ['delete:Product']
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/HardDeleteParam'
            responses:
                '204': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NoContent' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    # Undoes a soft delete. A separate verb because DELETE must be safe to repeat (RFC 9110
    # §9.2.2): a retried DELETE never brings a record back.
    /products/{id}/restore:
        # Bundler: adds `ETag` and `Content-Location` to the 2xx answers: they name the resource this answers.
        x-versioned: [post]
        post:
            tags: [Products]
            summary: Restore product
            description: Undoes the soft delete of the product identified by `{id}`. Answers 409 when the product is not soft-deleted, so a restore can never be mistaken for an ordinary read.
            operationId: restoreProductById
            x-error-codes:
                '409': [PRODUCT_NOT_DELETED]
            security:
                - bearerAuth: ['delete:Product']
                - apiKeyAuth: ['delete:Product']
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: Restored product
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Product'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }

    # Same as DELETE /products/{id}?hardDelete=true — the flag spelled in the path instead of
    # in the query. Both reach the same handler; `DELETE /products/{id}` is the canonical one
    # (`x-alias-of` below).
    /products/{id}/hard:
        # Bundler: adds the `If-Match` parameter and 412 to the writes listed, and `ETag` to the 200s.
        x-versioned: [delete]
        delete:
            tags: [Products]
            summary: Permanently delete product
            description: Permanently removes the product identified by `{id}`, rather than soft-deleting it. Functionally equivalent to `DELETE /products/{id}?hardDelete=true`.
            operationId: hardDeleteProductById
            x-alias-of: deleteProductById
            security:
                - bearerAuth: ['delete:Product']
                - apiKeyAuth: ['delete:Product']
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '204': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NoContent' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

    # Same as GET /products, but with JSON body, more suitable for DTOs and multi-language codegen
    /products/search:
        post:
            tags: [Products]
            summary: Search products (DTO-friendly)
            description: Searches and filters products via a JSON request body. Functionally equivalent to `GET /products` with query parameters. Staff holding `display:Locale` may preview a draft language here (see the API description's Language paragraph); that answer is never cached.
            operationId: searchProducts
            security:
                - {}
                - bearerAuth: []
                - apiKeyAuth: []
            x-alias-of: listProducts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchProductsRequest'
            responses:
                '200':
                    description: Products search results
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }

components:
    schemas:
        # The ONE sort grammar, shared with every list (docs/reference/sorting.md). `-` sorts
        # descending; earlier entries rank first; ties end on the id. Text fields sort
        # case-insensitively.
        ProductSort:
            type: array
            minItems: 1
            maxItems: 3
            items:
                type: string
                enum: [createdAt, -createdAt, price, -price, title, -title]

        # ---------- products — the schemas only this module's paths reference. ----------
        # One locale's words for a product, as read. The write shapes below carry the title's
        # length rules, enforced per locale — see the write operations' descriptions.
        ProductTranslationFields:
            type: object
            additionalProperties: false
            required: [title]
            properties:
                title:
                    type: string
                description:
                    type: string

        # One title and one description rule, for the product's own words (the default language) and for every
        # translation's fields alike.
        ProductTitleWrite:
            type: string
            minLength: 5
            maxLength: 200

        ProductDescriptionWrite:
            type: string
            minLength: 1
            maxLength: 10000

        # `POST` and `PUT`'s locale entry: the whole locale, so `title` is required and an absent
        # `description` is no description. `""` is never a description.
        ProductTranslationFieldsWrite:
            type: object
            additionalProperties: false
            required: [title]
            properties:
                title:
                    $ref: '#/components/schemas/ProductTitleWrite'
                description:
                    $ref: '#/components/schemas/ProductDescriptionWrite'

        # `PATCH`'s locale entry — RFC 7396 one level down: only the fields named change.
        ProductTranslationFieldsPatch:
            type: object
            additionalProperties: false
            properties:
                title:
                    $ref: '#/components/schemas/ProductTitleWrite'
                    description: A title is never cleared — an empty locale is deleted with the locale's own `null`.
                description:
                    type: [string, 'null']
                    maxLength: 10000
                    minLength: 1
                    description: A string sets the description, `null` clears it, absent keeps it. `""` is a 422.

        ProductTranslationsPatch:
            type: object
            additionalProperties:
                oneOf:
                    - $ref: '#/components/schemas/ProductTranslationFieldsPatch'
                    - type: 'null'
            description: >-
                The OTHER languages, keyed by BCP 47 tag. A key absent from this map leaves that
                locale untouched; a key mapped to an object merges into it field by field (the
                fields it names change, the others keep what they have); a key mapped to null
                deletes it. An empty object is an error. The default language
                (`NODE_FALLBACK_LOCALE`) is not a key here, whatever it maps to: it is the top-level
                `title` and `description`. A tag this deployment has no language for
                is a 422. A registered language that is switched off is accepted and stored as a
                draft: it is not served, searched or copied into a message until the language is
                switched on.
            example:
                it:
                    description: null

        ProductTranslationsWrite:
            type: object
            additionalProperties:
                oneOf:
                    - $ref: '#/components/schemas/ProductTranslationFieldsWrite'
                    - type: 'null'
            description: >-
                The OTHER languages, keyed by BCP 47 tag, each stated WHOLE: a `PUT` replaces the
                set, so a stored locale this map omits is deleted and a `description` a locale
                omits is cleared, drafts included. The default language (`NODE_FALLBACK_LOCALE`) is
                not a key here: it is the top-level `title` and `description`. A tag this deployment
                has no language for is a 422. A registered language that is switched off is accepted and
                stored as a draft: it is not served, searched or copied into a message until the
                language is switched on.
            example:
                en:
                    title: Orthopedic Memory Foam Dog Bed
                    description: Extra support for joints during rest.
                it:
                    title: Cuccia ortopedica in memory foam
                    description: Un supporto extra per le articolazioni durante il riposo.

        # `POST /products`'s locale map: a create has no locale to delete, so a `null` entry is a 422.
        ProductTranslationsCreate:
            type: object
            additionalProperties:
                $ref: '#/components/schemas/ProductTranslationFieldsWrite'
            description: >-
                The OTHER languages, keyed by BCP 47 tag, each stated whole. The default language
                (`NODE_FALLBACK_LOCALE`) is not a key here: it is the top-level `title` and
                `description`. A tag this deployment has no language for is a 422. A registered language that is switched off is accepted and stored as a
                draft: it is not served, searched or copied into a message until the language is
                switched on.
            example:
                en:
                    title: Orthopedic Memory Foam Dog Bed
                    description: Extra support for joints during rest.
                it:
                    title: Cuccia ortopedica in memory foam
                    description: Un supporto extra per le articolazioni durante il riposo.

        # One value of `categories`/`tags`, with how many PUBLIC products carry it. Counts
        # follow `publicScope` — a category held only by hidden products does not exist to the
        # storefront, and a filter chip that finds nothing is worse than no chip.
        FacetCount:
            type: object
            additionalProperties: false
            required: [name, count]
            properties:
                name:
                    type: string
                count:
                    type: integer
                    minimum: 1

        CatalogFacetsResponse:
            type: object
            additionalProperties: false
            required: [categories, tags]
            properties:
                categories:
                    type: array
                    items:
                        $ref: '#/components/schemas/FacetCount'
                tags:
                    type: array
                    items:
                        $ref: '#/components/schemas/FacetCount'

        SearchProductsRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Page'
                pageSize:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PageSize'
                sort:
                    $ref: '#/components/schemas/ProductSort'
                text:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Text'
                id:
                    type: array
                    minItems: 1
                    maxItems: 100
                    items: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id' }
                priceMin:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/NonNegativeDecimalAmount'
                priceMax:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/NonNegativeDecimalAmount'
                category:
                    type: string
                    maxLength: 200
                tag:
                    type: string
                    maxLength: 200
                # A title fragment, and the only one of this pair a stranger can use.
                title:
                    type: string
                    maxLength: 200
                # Admin-effective: a stranger sending `active: false` meets the visibility
                # scope, which pins `active: true` for them, so the two clauses contradict
                # and the page is empty rather than revealing the unlisted catalogue.
                active:
                    type: boolean
                # Public, unlike `active`: an off-sale product is listed for everyone.
                purchasable:
                    type: boolean
                # `true`: only soft-deleted rows; `false`: only live ones; absent: both.
                # Admin-effective, like `active`: a caller who cannot see deleted rows at all
                # gets an empty page for `true`.
                deleted:
                    type: boolean

        CreateProductRequest:
            type: object
            additionalProperties: false
            required: [price, title]
            properties:
                title:
                    $ref: '#/components/schemas/ProductTitleWrite'
                description:
                    $ref: '#/components/schemas/ProductDescriptionWrite'
                translations:
                    $ref: '#/components/schemas/ProductTranslationsCreate'
                price:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/NonNegativeDecimalAmount'
                    description: Gross — VAT included. Same convention as `Product.price`.
                taxClass:
                    $ref: '#/components/schemas/TaxClass'
                rateType:
                    $ref: '#/components/schemas/RateType'
                sku:
                    $ref: '#/components/schemas/Sku'
                # ---------- On `active`, and why it is declared here but not on the updates ----------
                #
                # `active` and `deletedAt` are INDEPENDENT. A record can be active or not regardless
                # of whether it has been soft-deleted, and the two are stored separately. What they
                # share is an effect, not a value: a non-admin sees a record only when it is active
                # AND not soft-deleted (`publicScope()` in the products repository requires both).
                # So a soft-deleted record behaves exactly like an inactive one from outside, while
                # remaining a distinct state inside.
                #
                # The default is declared rather than left to each implementation. Undeclared, the
                # API and the paired frontend's mock each pick their own, and the same request
                # yields a publicly visible product against one and a hidden one against the
                # other — a disagreement no contract test on either side can see.
                #
                # It appears on the CREATE bodies only. On an update, an omitted `active` means
                # "leave it as it is" — a default there would silently republish a deactivated
                # record on any unrelated edit.
                active:
                    type: boolean
                    default: true
                # Same default and reasoning as `active` above: a declared default, create bodies only.
                purchasable:
                    type: boolean
                    default: true
                releaseDate:
                    $ref: '#/components/schemas/ReleaseDate'
                allowBackorder:
                    type: boolean
                    default: false
                restockDate:
                    $ref: '#/components/schemas/RestockDate'
                # Default true: most products are physical. false is a digital good — checkout
                # never needs a shipping method for a cart made entirely of these.
                requiresShipping:
                    type: boolean
                    default: true
                # Art. 16(c)-(d) CRD: goods made to order or clearly personalised, and perishable ones, carry no
                # right of withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                    default: false
                weight:
                    type: integer
                    minimum: 0
                    description: Grams. Absent counts as 0 for shipping-method filtering.
                # No `imageUrl`: a create has no image to remove, so `null` is a 422 here. The picture
                # arrives as multipart `imageUpload` bytes.
                categories:
                    type: array
                    items:
                        type: string
                        maxLength: 100
                        minLength: 1
                tags:
                    type: array
                    items:
                        type: string
                        maxLength: 50
                        minLength: 1

        # A multipart part is a string or a file, never `null`: a clear cannot travel here. Send it as a JSON PATCH.
        CreateProductRequestMultipart:
            type: object
            additionalProperties: false
            required: [price, title]
            properties:
                title:
                    $ref: '#/components/schemas/ProductTitleWrite'
                description:
                    $ref: '#/components/schemas/ProductDescriptionWrite'
                # A multipart part carries no nested objects, only strings — so the translations
                # map travels as a JSON-encoded string in this field, the same shape
                # `ProductTranslationsWrite` describes, parsed before validation.
                translations:
                    type: string
                    maxLength: 100000
                    description: JSON-encoded `ProductTranslationsWrite`.
                price:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/NonNegativeDecimalAmount'
                    description: Gross — VAT included. Same convention as `Product.price`.
                taxClass:
                    $ref: '#/components/schemas/TaxClass'
                rateType:
                    $ref: '#/components/schemas/RateType'
                sku:
                    $ref: '#/components/schemas/Sku'
                # Same default, same reasoning as `CreateProductRequest.active` above.
                active:
                    type: boolean
                    default: true
                # Same default and reasoning as `active` above: a declared default, create bodies only.
                purchasable:
                    type: boolean
                    default: true
                releaseDate:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/ReleaseDate'
                allowBackorder:
                    type: boolean
                    default: false
                restockDate:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/RestockDate'
                requiresShipping:
                    type: boolean
                    default: true
                # Art. 16(c)-(d) CRD: goods made to order or clearly personalised, and perishable ones, carry no
                # right of withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                    default: false
                weight:
                    type: integer
                    minimum: 0
                    description: Grams. Absent counts as 0 for shipping-method filtering.
                imageUpload:
                    type: string
                    format: binary
                    description: Optional product image
                categories:
                    type: array
                    items:
                        type: string
                        maxLength: 100
                        minLength: 1
                tags:
                    type: array
                    items:
                        type: string
                        maxLength: 50
                        minLength: 1

        # PUT /products/{id} — RFC 9110 §9.3.4: every scalar field the resource has is required,
        # since none of them but taxClass/rateType/sku/weight/description/releaseDate has a legal "cleared"
        # state; those stay optional-nullable, same as PATCH. `imageUrl` is outside the representation: an
        # omission keeps the image. `translations` is the whole set of the OTHER languages: a
        # stored locale it leaves out is deleted.
        ReplaceProductRequest:
            type: object
            additionalProperties: false
            required: [price, title, translations, active, purchasable, allowBackorder, requiresShipping, noWithdrawal, categories, tags]
            properties:
                title:
                    $ref: '#/components/schemas/ProductTitleWrite'
                # Omitted on a PUT is the same as `null`: the default-language description is cleared.
                description:
                    oneOf:
                        - $ref: '#/components/schemas/ProductDescriptionWrite'
                        - type: 'null'
                translations:
                    $ref: '#/components/schemas/ProductTranslationsWrite'
                price:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/NonNegativeDecimalAmount'
                    description: Gross — VAT included. Same convention as `Product.price`.
                # `null` clears the class back to the shop's standard rate. Omitted on a PUT is
                # the same as `null` — see the operation description.
                taxClass:
                    oneOf:
                        - $ref: '#/components/schemas/TaxClass'
                        - type: 'null'
                # `null` clears it back to `standard`, same as `taxClass`. Omitted on a PUT is
                # the same as `null` — see the operation description.
                rateType:
                    oneOf:
                        - $ref: '#/components/schemas/RateType'
                        - type: 'null'
                sku:
                    oneOf:
                        - $ref: '#/components/schemas/Sku'
                        - type: 'null'
                active:
                    type: boolean
                purchasable:
                    type: boolean
                # `null` clears the date, and so does omitting it — a PUT states the whole product.
                releaseDate:
                    oneOf:
                        - $ref: '#/components/schemas/ReleaseDate'
                        - type: 'null'
                allowBackorder:
                    type: boolean
                restockDate:
                    oneOf:
                        - $ref: '#/components/schemas/RestockDate'
                        - type: 'null'
                requiresShipping:
                    type: boolean
                # Art. 16(c)-(d) CRD: goods made to order or clearly personalised, and perishable ones, carry no
                # right of withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                weight:
                    type: [integer, 'null']
                    minimum: 0
                    description: Grams. Absent counts as 0 for shipping-method filtering.
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageRemoval'
                categories:
                    type: array
                    items:
                        type: string
                        maxLength: 100
                        minLength: 1
                tags:
                    type: array
                    items:
                        type: string
                        maxLength: 50
                        minLength: 1

        # A multipart part is a string or a file, never `null`: a clear cannot travel here. Send it as a JSON PATCH.
        ReplaceProductRequestMultipart:
            type: object
            additionalProperties: false
            required: [price, title, translations, active, purchasable, allowBackorder, requiresShipping, noWithdrawal, categories, tags]
            properties:
                title:
                    $ref: '#/components/schemas/ProductTitleWrite'
                description:
                    $ref: '#/components/schemas/ProductDescriptionWrite'
                translations:
                    type: string
                    maxLength: 100000
                    description: JSON-encoded `ProductTranslationsWrite`.
                price:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/NonNegativeDecimalAmount'
                    description: Gross — VAT included. Same convention as `Product.price`.
                taxClass:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/TaxClass'
                rateType:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/RateType'
                sku:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/Sku'
                active:
                    type: boolean
                purchasable:
                    type: boolean
                releaseDate:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/ReleaseDate'
                allowBackorder:
                    type: boolean
                restockDate:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/RestockDate'
                requiresShipping:
                    type: boolean
                # Art. 16(c)-(d) CRD: goods made to order or clearly personalised, and perishable ones, carry no
                # right of withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                weight:
                    type: integer
                    minimum: 0
                    description: Grams. Absent counts as 0 for shipping-method filtering.
                imageUpload:
                    type: string
                    format: binary
                    description: Optional product image
                categories:
                    type: array
                    items:
                        type: string
                        maxLength: 100
                        minLength: 1
                tags:
                    type: array
                    items:
                        type: string
                        maxLength: 50
                        minLength: 1

        # PATCH /products/{id} — every field optional, since a merge may touch just one of them.
        # No `id`: it travels in the path.
        UpdateProductRequest:
            type: object
            additionalProperties: false
            properties:
                title:
                    $ref: '#/components/schemas/ProductTitleWrite'
                # `null` clears the default-language description; absent keeps it.
                description:
                    oneOf:
                        - $ref: '#/components/schemas/ProductDescriptionWrite'
                        - type: 'null'
                translations:
                    $ref: '#/components/schemas/ProductTranslationsPatch'
                price:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/NonNegativeDecimalAmount'
                    description: Gross — VAT included. Same convention as `Product.price`.
                # `null` clears the class back to the shop's standard rate. Omitted leaves the
                # stored value alone.
                taxClass:
                    oneOf:
                        - $ref: '#/components/schemas/TaxClass'
                        - type: 'null'
                # `null` clears it back to `standard`, same as `taxClass`. Omitted leaves the
                # stored value alone.
                rateType:
                    oneOf:
                        - $ref: '#/components/schemas/RateType'
                        - type: 'null'
                sku:
                    oneOf:
                        - $ref: '#/components/schemas/Sku'
                        - type: 'null'
                active:
                    type: boolean
                purchasable:
                    type: boolean
                # `null` clears the date: the product is no longer a preorder. Omitted leaves the
                # stored value alone.
                releaseDate:
                    oneOf:
                        - $ref: '#/components/schemas/ReleaseDate'
                        - type: 'null'
                allowBackorder:
                    type: boolean
                restockDate:
                    oneOf:
                        - $ref: '#/components/schemas/RestockDate'
                        - type: 'null'
                requiresShipping:
                    type: boolean
                # Art. 16(c)-(d) CRD: goods made to order or clearly personalised, and perishable ones, carry no
                # right of withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                # `null` clears a recorded weight back to unset (read as 0 for shipping-method
                # filtering, same as an absent one) — omitted leaves the stored value alone.
                weight:
                    type: [integer, 'null']
                    minimum: 0
                    description: Grams. Absent counts as 0 for shipping-method filtering.
                # `null` removes the image. Omitted leaves it unchanged; `''` is
                # invalid (`ImageUrl`'s own `minLength: 1`), never a third spelling of "no image".
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageRemoval'
                categories:
                    type: array
                    items:
                        type: string
                        maxLength: 100
                        minLength: 1
                tags:
                    type: array
                    items:
                        type: string
                        maxLength: 50
                        minLength: 1

        # A multipart part is a string or a file, never `null`: a clear cannot travel here. Send it as a JSON PATCH.
        UpdateProductRequestMultipart:
            type: object
            additionalProperties: false
            properties:
                title:
                    $ref: '#/components/schemas/ProductTitleWrite'
                description:
                    $ref: '#/components/schemas/ProductDescriptionWrite'
                # See `CreateProductRequestMultipart.translations` above — same JSON-string-in-a-
                # field shape, same `ProductTranslationsPatch` contents.
                translations:
                    type: string
                    maxLength: 100000
                    description: JSON-encoded `ProductTranslationsPatch`.
                price:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/NonNegativeDecimalAmount'
                    description: Gross — VAT included. Same convention as `Product.price`.
                taxClass:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/TaxClass'
                rateType:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/RateType'
                sku:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/Sku'
                active:
                    type: boolean
                purchasable:
                    type: boolean
                releaseDate:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/ReleaseDate'
                allowBackorder:
                    type: boolean
                restockDate:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/RestockDate'
                requiresShipping:
                    type: boolean
                # Art. 16(c)-(d) CRD: goods made to order or clearly personalised, and perishable ones, carry no
                # right of withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                weight:
                    type: integer
                    minimum: 0
                    description: Grams. Absent counts as 0 for shipping-method filtering.
                imageUpload:
                    type: string
                    format: binary
                    description: Optional product image
                categories:
                    type: array
                    items:
                        type: string
                        maxLength: 100
                        minLength: 1
                tags:
                    type: array
                    items:
                        type: string
                        maxLength: 50
                        minLength: 1

        ProductsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Product'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        # Overrides the shop's default VAT rate for this product. Absent — most products — means
        # the standard rate (`NODE_VAT_RATE_DEFAULT`) applies; every product resolves to SOME
        # rate, this field only ever narrows it. `reduced` uses `NODE_VAT_RATE_REDUCED`; `zero`
        # is always 0%, no configuration needed. The RESOLVED decimal rate, not this class, is
        # what gets frozen onto an order line — see `OrderLineProduct.taxRate`.
        TaxClass:
            type: string
            enum: [reduced, zero]
            description: >-
                A category of goods taxed below the shop's standard VAT rate — books, food,
                medicine and similar, depending on the deployment's own jurisdiction. Absent means
                the standard rate.

        # EN 16931's VAT category codes distinguish a 0%-rated line (`Z`) from an exempt one
        # (`E`) — reasons that both resolve `TaxClass: zero` to the same 0% rate but print a
        # different code on an invoice. `standard` covers every non-zero rate (`reduced` and the
        # shop's default alike); absent means `standard`, same convention as `TaxClass` itself.
        # the products service does not enforce `taxClass: zero` alongside a non-`standard`
        # value here — an invoice's category-code render (`invoicing/emails.ts`) only consults
        # this field once the frozen rate is actually 0, so a mismatched pair is inert rather
        # than rejected.
        RateType:
            type: string
            enum: [standard, zero_rated, exempt]
            description: >-
                WHY a product's resolved VAT rate is 0%, when it is — `TaxClass: zero` alone
                cannot say. Meaningless when the resolved rate isn't 0%.

        ReleaseDate:
            type: string
            format: date
            description: >-
                The day a product ships from, a day on the shop's calendar (`Shop.timeZone`) as
                `YYYY-MM-DD`; stored as the UTC instant of that day's midnight in the shop's zone and
                always answered back as the same day. A product with a future date that is active and
                purchasable is a preorder. At most one year ahead (Google's `availability_date` rule);
                a day in the past is accepted and simply means "released". Moving it later notifies
                the buyers who already paid (`delivery`).

        RestockDate:
            type: string
            format: date
            description: >-
                The day stock is expected back, for a product that allows backorder: a day on the
                shop's calendar (`Shop.timeZone`) as `YYYY-MM-DD`; stored as the UTC instant of that
                day's midnight in the shop's zone and always answered back as the same day. At most
                one year ahead. Without one the shop promises delivery within 30 days. A day in the
                past is accepted and the product then reads sold out until staff set a new date or
                clear it. Moving it later notifies the buyers who already paid (`delivery`).

        # A stock-keeping unit, deliberately just a string — this deployment's own numbering
        # scheme, unvalidated beyond "not empty". Product VARIANTS (one SKU per size/colour) are
        # a separate, larger feature, on the roadmap and not built here; today's SKU is one per
        # product, same cardinality as `Product` itself.
        Sku:
            type: string
            maxLength: 64
            minLength: 1
            description: >-
                An optional, deployment-chosen stock-keeping unit — unique across the catalogue
                when set. `''` is invalid, same reasoning as `ImageUrl`'s own `minLength: 1`:
                never a second spelling of "absent". Frozen onto an order line at checkout
                (`OrderLineProduct.sku`), same as every other field a purchase must remember
                regardless of what the catalogue does with the product afterwards.

        ProductActions:
            type: object
            additionalProperties: false
            required: [update, delete, restore, hardDelete]
            description: >-
                What THIS caller may do to THIS product right now, so a client never restates the
                rules. A caller answered from the cache shared with every guest gets every flag
                `false`: only a caller who sees more than a guest (`display:Product`) is answered
                fresh, and only they can read a `true`.
            properties:
                update:
                    type: boolean
                    description: >-
                        Whether `PUT` or `PATCH /products/{id}` would be accepted: the caller holds
                        `update:Product` AND `update:Translation`.
                delete:
                    type: boolean
                    description: >-
                        Whether `DELETE /products/{id}` (a soft delete) would be accepted: the
                        caller holds `delete:Product` and the product is not already deleted.
                restore:
                    type: boolean
                    description: >-
                        Whether `POST /products/{id}/restore` would be accepted: the caller holds
                        `delete:Product` and the product is soft-deleted (a live one answers 409
                        `PRODUCT_NOT_DELETED`).
                hardDelete:
                    type: boolean
                    description: >-
                        Whether `DELETE /products/{id}/hard` would be accepted: the caller holds
                        `delete:Product`.

        Product:
            type: object
            additionalProperties: false
            required: [id, title, price, currency, actions]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                title:
                    type: string
                price:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/NonNegativeDecimalAmount'
                    description: >-
                        Gross — what the customer pays, VAT included. Never net-of-tax: the invoice
                        derives the net amount and the VAT amount FROM this, at whatever rate
                        applies, rather than the other way around.
                currency:
                    allOf: [{ $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CurrencyCode' }]
                    readOnly: true
                    description: >-
                        ISO-4217 currency code (e.g. EUR) — this deployment's own
                        `NODE_DEFAULT_CURRENCY`, read live, never stored on the product itself. An
                        order freezes it onto its own `currency` at checkout; this field always
                        reports the shop's CURRENT setting.
                taxClass:
                    $ref: '#/components/schemas/TaxClass'
                rateType:
                    $ref: '#/components/schemas/RateType'
                sku:
                    $ref: '#/components/schemas/Sku'
                description:
                    type: string
                active:
                    type: boolean
                # Visible but not for sale right now. Hidden (`active: false`) wins over it. Reads as
                # "Not available right now": add-to-cart is accepted, as for a sold-out product, and
                # checkout refuses it. Stock is unrelated: it is `availability`'s question, read from `/products/{id}/availability`.
                purchasable:
                    type: boolean
                    default: true
                releaseDate:
                    $ref: '#/components/schemas/ReleaseDate'
                allowBackorder:
                    type: boolean
                restockDate:
                    $ref: '#/components/schemas/RestockDate'
                # Default true: most products are physical. false is a digital good — checkout
                # never needs a shipping method for a cart made entirely of these.
                requiresShipping:
                    type: boolean
                    default: true
                # Art. 16 CRD: personalised, sealed-hygiene or perishable goods carry no right of
                # withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                    default: false
                # Grams. Absent counts as 0 for shipping-method filtering (`GET /delivery/methods`,
                # checkout's weight-range refusal) — a product missing this is silently routed as
                # weightless, not refused, so the admin form warns rather than requiring it outright.
                weight:
                    type: integer
                    minimum: 0
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageUrl'
                thumbnailUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ThumbnailUrl'
                categories:
                    type: array
                    items:
                        type: string
                tags:
                    type: array
                    items:
                        type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                deletedAt:
                    type: string
                    format: date-time
                actions:
                    $ref: '#/components/schemas/ProductActions'
                translations:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/ProductTranslationFields'
                    description: >-
                        Every language but the default one the product has a row for, drafts
                        included, keyed by locale: the editor's form fills one tab per entry. Present
                        only on `GET /products/{id}` and only for a caller holding `read:Translation`;
                        every other read, and every other caller, gets the resolved
                        `title`/`description` alone.
                source:
                    $ref: '#/components/schemas/ProductTranslationFields'
                    description: >-
                        The stored default-language text (`NODE_FALLBACK_LOCALE`), whatever language
                        the request resolves `title` to. Present on the same reads as `translations`.
