                title:
                    type: string
                    maxLength: 200
                # Admin-effective: a stranger sending `active: false` meets the visibility
                # scope, which pins `active: true` for them, so the two clauses contradict
                # and the page is empty rather than revealing the unlisted catalogue.
                active:
                    type: boolean
                # Public, unlike `active`: an off-sale product is listed for everyone.
                purchasable:
                    type: boolean
                # `true`: only soft-deleted rows; `false`: only live ones; absent: both.
                # Admin-effective, like `active`: a caller who cannot see deleted rows at all
                # gets an empty page for `true`.
                deleted:
                    type: boolean

        CreateProductRequest:
            type: object
            additionalProperties: false
            required: [price, translations]
            properties:
                translations:
                    $ref: '#/components/schemas/ProductTranslationsWrite'
                price:
                    type: number
                    format: double
                    minimum: 0
                    description: Gross — VAT included. Same convention as `Product.price`.
                taxClass:
                    $ref: '#/components/schemas/TaxClass'
                rateType:
                    $ref: '#/components/schemas/RateType'
                sku:
                    $ref: '#/components/schemas/Sku'
                # ---------- On `active`, and why it is declared here but not on the updates ----------
                #
                # `active` and `deletedAt` are INDEPENDENT. A record can be active or not regardless
                # of whether it has been soft-deleted, and the two are stored separately. What they
                # share is an effect, not a value: a non-admin sees a record only when it is active
                # AND not soft-deleted (`publicScope()` in the products repository requires both).
                # So a soft-deleted record behaves exactly like an inactive one from outside, while
                # remaining a distinct state inside.
                #
                # The default is declared rather than left to each implementation. Undeclared, the
                # API and the paired frontend's mock each pick their own, and the same request
                # yields a publicly visible product against one and a hidden one against the
                # other — a disagreement no contract test on either side can see.
                #
                # It appears on the CREATE bodies only. On an update, an omitted `active` means
                # "leave it as it is" — a default there would silently republish a deactivated
                # record on any unrelated edit.
                active:
                    type: boolean
                    default: true
                # Same default and reasoning as `active` above: a declared default, create bodies only.
                purchasable:
                    type: boolean
                    default: true
                releaseDate:
                    $ref: '#/components/schemas/ReleaseDate'
                allowBackorder:
                    type: boolean
                    default: false
                restockDate:
                    $ref: '#/components/schemas/RestockDate'
                # Default true: most products are physical. false is a digital good — checkout
                # never needs a shipping method for a cart made entirely of these.
                requiresShipping:
                    type: boolean
                    default: true
                # Art. 16(c)-(d) CRD: goods made to order or clearly personalised, and perishable ones, carry no
                # right of withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                    default: false
                weight:
                    type: integer
                    minimum: 0
                    description: Grams. Absent counts as 0 for shipping-method filtering.
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageRemoval'
                categories:
                    type: array
                    items:
                        type: string
                        maxLength: 100
                        minLength: 1
                tags:
                    type: array
                    items:
                        type: string
                        maxLength: 50
                        minLength: 1

        # A multipart part is a string or a file, never `null`: a clear cannot travel here. Send it as a JSON PATCH.
        CreateProductRequestMultipart:
            type: object
            additionalProperties: false
            required: [price, translations]
            properties:
                # A multipart part carries no nested objects, only strings — so the translations
                # map travels as a JSON-encoded string in this field, the same shape
                # `ProductTranslationsWrite` describes, parsed before validation.
                translations:
                    type: string
                    maxLength: 100000
                    description: JSON-encoded `ProductTranslationsWrite`.
                price:
                    type: number
                    format: double
                    minimum: 0
                    description: Gross — VAT included. Same convention as `Product.price`.
                taxClass:
                    $ref: '#/components/schemas/TaxClass'
                rateType:
                    $ref: '#/components/schemas/RateType'
                sku:
                    $ref: '#/components/schemas/Sku'
                # Same default, same reasoning as `CreateProductRequest.active` above.
                active:
                    type: boolean
                    default: true
                # Same default and reasoning as `active` above: a declared default, create bodies only.
                purchasable:
                    type: boolean
                    default: true
                releaseDate:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/ReleaseDate'
                allowBackorder:
                    type: boolean
                    default: false
                restockDate:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/RestockDate'
                requiresShipping:
                    type: boolean
                    default: true
                # Art. 16(c)-(d) CRD: goods made to order or clearly personalised, and perishable ones, carry no
                # right of withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                    default: false
                weight:
                    type: integer
                    minimum: 0
                    description: Grams. Absent counts as 0 for shipping-method filtering.
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional product image
                categories:
                    type: array
                    items:
                        type: string
                        maxLength: 100
                        minLength: 1
                tags:
                    type: array
                    items:
                        type: string
                        maxLength: 50
                        minLength: 1

        # PUT /products/{id} — RFC 9110 §9.3.4: every scalar field the resource has is required,
        # since none of them but taxClass/rateType/sku/weight/releaseDate has a legal "cleared" state;
        # those five stay optional-nullable, same as PATCH. `imageUrl` is outside the representation: an
        # omission keeps the image. `translations` is the whole set: a
        # stored locale it leaves out is deleted, and the fallback locale is required.
        ReplaceProductRequest:
            type: object
            additionalProperties: false
            required: [price, translations, active, purchasable, requiresShipping, categories, tags]
            properties:
                translations:
                    $ref: '#/components/schemas/ProductTranslationsWrite'
                price:
                    type: number
                    format: double
                    minimum: 0
                    description: Gross — VAT included. Same convention as `Product.price`.
                # `null` clears the class back to the shop's standard rate. Omitted on a PUT is
                # the same as `null` — see the operation description.
                taxClass:
                    oneOf:
                        - $ref: '#/components/schemas/TaxClass'
                        - type: 'null'
                # `null` clears it back to `standard`, same as `taxClass`. Omitted on a PUT is
                # the same as `null` — see the operation description.
                rateType:
                    oneOf:
                        - $ref: '#/components/schemas/RateType'
                        - type: 'null'
                sku:
                    oneOf:
                        - $ref: '#/components/schemas/Sku'
                        - type: 'null'
                active:
                    type: boolean
                purchasable:
                    type: boolean
                # `null` clears the date, and so does omitting it — a PUT states the whole product.
                releaseDate:
                    oneOf:
                        - $ref: '#/components/schemas/ReleaseDate'
                        - type: 'null'
                allowBackorder:
                    type: boolean
                restockDate:
                    oneOf:
                        - $ref: '#/components/schemas/RestockDate'
                        - type: 'null'
                requiresShipping:
                    type: boolean
                # Art. 16(c)-(d) CRD: goods made to order or clearly personalised, and perishable ones, carry no
                # right of withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                weight:
                    type: [integer, 'null']
                    minimum: 0
                    description: Grams. Absent counts as 0 for shipping-method filtering.
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageRemoval'
                categories:
                    type: array
                    items:
                        type: string
                        maxLength: 100
                        minLength: 1
                tags:
                    type: array
                    items:
                        type: string
                        maxLength: 50
                        minLength: 1

        # A multipart part is a string or a file, never `null`: a clear cannot travel here. Send it as a JSON PATCH.
        ReplaceProductRequestMultipart:
            type: object
            additionalProperties: false
            required: [price, translations, active, purchasable, requiresShipping, categories, tags]
            properties:
                translations:
                    type: string
                    maxLength: 100000
                    description: JSON-encoded `ProductTranslationsWrite`.
                price:
                    type: number
                    format: double
                    minimum: 0
                    description: Gross — VAT included. Same convention as `Product.price`.
                taxClass:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/TaxClass'
                rateType:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/RateType'
                sku:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/Sku'
                active:
                    type: boolean
                purchasable:
                    type: boolean
                releaseDate:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/ReleaseDate'
                allowBackorder:
                    type: boolean
                restockDate:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/RestockDate'
                requiresShipping:
                    type: boolean
                # Art. 16(c)-(d) CRD: goods made to order or clearly personalised, and perishable ones, carry no
                # right of withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                weight:
                    type: integer
                    minimum: 0
                    description: Grams. Absent counts as 0 for shipping-method filtering.
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional product image
                categories:
                    type: array
                    items:
                        type: string
                        maxLength: 100
                        minLength: 1
                tags:
                    type: array
                    items:
                        type: string
                        maxLength: 50
                        minLength: 1

        # PATCH /products/{id} — every field optional, since a merge may touch just one of them.
        # No `id`: it travels in the path.
        UpdateProductRequest:
            type: object
            additionalProperties: false
            properties:
                translations:
                    $ref: '#/components/schemas/ProductTranslationsPatch'
                price:
                    type: number
                    format: double
                    minimum: 0
                    description: Gross — VAT included. Same convention as `Product.price`.
                # `null` clears the class back to the shop's standard rate. Omitted leaves the
                # stored value alone.
                taxClass:
                    oneOf:
                        - $ref: '#/components/schemas/TaxClass'
                        - type: 'null'
                # `null` clears it back to `standard`, same as `taxClass`. Omitted leaves the
                # stored value alone.
                rateType:
                    oneOf:
                        - $ref: '#/components/schemas/RateType'
                        - type: 'null'
                sku:
                    oneOf:
                        - $ref: '#/components/schemas/Sku'
                        - type: 'null'
                active:
                    type: boolean
                purchasable:
                    type: boolean
                # `null` clears the date: the product is no longer a preorder. Omitted leaves the
                # stored value alone.
                releaseDate:
                    oneOf:
                        - $ref: '#/components/schemas/ReleaseDate'
                        - type: 'null'
                allowBackorder:
                    type: boolean
                restockDate:
                    oneOf:
                        - $ref: '#/components/schemas/RestockDate'
                        - type: 'null'
                requiresShipping:
                    type: boolean
                # Art. 16(c)-(d) CRD: goods made to order or clearly personalised, and perishable ones, carry no
                # right of withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                # `null` clears a recorded weight back to unset (read as 0 for shipping-method
                # filtering, same as an absent one) — omitted leaves the stored value alone.
                weight:
                    type: [integer, 'null']
                    minimum: 0
                    description: Grams. Absent counts as 0 for shipping-method filtering.
                # `null` removes the image. Omitted leaves it unchanged; `''` is
                # invalid (`ImageUrl`'s own `minLength: 1`), never a third spelling of "no image".
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageRemoval'
                categories:
                    type: array
                    items:
                        type: string
                        maxLength: 100
                        minLength: 1
                tags:
                    type: array
                    items:
                        type: string
                        maxLength: 50
                        minLength: 1

        # A multipart part is a string or a file, never `null`: a clear cannot travel here. Send it as a JSON PATCH.
        UpdateProductRequestMultipart:
            type: object
            additionalProperties: false
            properties:
                # See `CreateProductRequestMultipart.translations` above — same JSON-string-in-a-
                # field shape, same `ProductTranslationsPatch` contents.
                translations:
                    type: string
                    maxLength: 100000
                    description: JSON-encoded `ProductTranslationsPatch`.
                price:
                    type: number
                    format: double
                    minimum: 0
                    description: Gross — VAT included. Same convention as `Product.price`.
                taxClass:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/TaxClass'
                rateType:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/RateType'
                sku:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/Sku'
                active:
                    type: boolean
                purchasable:
                    type: boolean
                releaseDate:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/ReleaseDate'
                allowBackorder:
                    type: boolean
                restockDate:
                    type: string
                    allOf:
                        - $ref: '#/components/schemas/RestockDate'
                requiresShipping:
                    type: boolean
                # Art. 16(c)-(d) CRD: goods made to order or clearly personalised, and perishable ones, carry no
                # right of withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                weight:
                    type: integer
                    minimum: 0
                    description: Grams. Absent counts as 0 for shipping-method filtering.
                imageUpload:
                    # No maxLength/contentMediaType by design — see the note under `ImageUrl`.
                    type: string
                    format: binary
                    description: Optional product image
                categories:
                    type: array
                    items:
                        type: string
                        maxLength: 100
                        minLength: 1
                tags:
                    type: array
                    items:
                        type: string
                        maxLength: 50
                        minLength: 1

        DeleteProductRequest:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                hardDelete:
                    type: boolean
                    default: false

        ProductsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Product'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        # Overrides the shop's default VAT rate for this product. Absent — most products — means
        # the standard rate (`NODE_VAT_RATE_DEFAULT`) applies; every product resolves to SOME
        # rate, this field only ever narrows it. `reduced` uses `NODE_VAT_RATE_REDUCED`; `zero`
        # is always 0%, no configuration needed. The RESOLVED decimal rate, not this class, is
        # what gets frozen onto an order line — see `OrderLineProduct.taxRate`.
        TaxClass:
            type: string
            enum: [reduced, zero]
            description: >-
                A category of goods taxed below the shop's standard VAT rate — books, food,
                medicine and similar, depending on the deployment's own jurisdiction. Absent means
                the standard rate.

        # EN 16931's VAT category codes distinguish a 0%-rated line (`Z`) from an exempt one
        # (`E`) — reasons that both resolve `TaxClass: zero` to the same 0% rate but print a
        # different code on an invoice. `standard` covers every non-zero rate (`reduced` and the
        # shop's default alike); absent means `standard`, same convention as `TaxClass` itself.
        # the products service does not enforce `taxClass: zero` alongside a non-`standard`
        # value here — an invoice's category-code render (`invoicing/emails.ts`) only consults
        # this field once the frozen rate is actually 0, so a mismatched pair is inert rather
        # than rejected.
        RateType:
            type: string
            enum: [standard, zero-rated, exempt]
            description: >-
                WHY a product's resolved VAT rate is 0%, when it is — `TaxClass: zero` alone
                cannot say. Meaningless when the resolved rate isn't 0%.

        ReleaseDate:
            type: string
            format: date-time
            description: >-
                When a product ships from, as an ISO 8601 date-time with a zone. A product with a
                future date that is active and purchasable is a preorder. At most one year ahead
                (Google's `availability_date` rule); a date in the past is accepted and simply means
                "released". Moving it later notifies the buyers who already paid (`delivery`).

        RestockDate:
            type: string
            format: date-time
            description: >-
                When stock is expected back, as an ISO 8601 date-time with a zone, for a product that
                allows backorder. At most one year ahead. Without one the shop promises delivery within
                30 days. A date in the past is accepted and the product then reads sold out until staff
                set a new date or clear it. Moving it later notifies the buyers who already paid
                (`delivery`).

        # SH4: a stock-keeping unit, deliberately just a string — this deployment's own numbering
        # scheme, unvalidated beyond "not empty". Product VARIANTS (one SKU per size/colour) are
        # a separate, larger feature, on the roadmap and not built here; today's SKU is one per
        # product, same cardinality as `Product` itself.
        Sku:
            type: string
            maxLength: 64
            minLength: 1
            description: >-
                An optional, deployment-chosen stock-keeping unit — unique across the catalogue
                when set. `''` is invalid, same reasoning as `ImageUrl`'s own `minLength: 1`:
                never a second spelling of "absent". Frozen onto an order line at checkout
                (`OrderLineProduct.sku`), same as every other field a purchase must remember
                regardless of what the catalogue does with the product afterwards.

        Product:
            type: object
            additionalProperties: false
            required: [id, title, price, currency, inStock, lowStock]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                title:
                    type: string
                price:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        Gross — what the customer pays, VAT included. Never net-of-tax: the invoice
                        derives the net amount and the VAT amount FROM this, at whatever rate
                        applies, rather than the other way around.
                currency:
                    type: string
                    readOnly: true
                    description: >-
                        ISO-4217 currency code (e.g. EUR) — this deployment's own
                        `NODE_DEFAULT_CURRENCY`, read live, never stored on the product itself. An
                        order freezes it onto its own `currency` at checkout; this field always
                        reports the shop's CURRENT setting.
                taxClass:
                    $ref: '#/components/schemas/TaxClass'
                rateType:
                    $ref: '#/components/schemas/RateType'
                sku:
                    $ref: '#/components/schemas/Sku'
                # ── What a shopper may know about stock, and what only a stock reader sees ──
                #
                # `inStock` and `lowStock` are on every response, for every caller. The exact
                # numbers behind them are not: `onHand`, `reserved` and `available` are present
                # ONLY for a caller holding `read:StockLevel` (the manager, the warehouse and
                # the admin), because exact counters leak sales velocity to a competitor and help
                # plan a denial of inventory. A storefront reads the two flags; an admin screen
                # reads the counters so it can explain a low availability ("forty here,
                # thirty-eight spoken for") rather than merely assert it.
                #
                # Every field here is read-only. No request body anywhere in this contract accepts
                # a counter: stock moves only through the `/inventory` transitions, which are
                # signed, conditional, and leave a ledger row.
                inStock:
                    type: boolean
                    readOnly: true
                    description: >-
                        Something is for sale. `false` renders as out of stock — the catalogue
                        still lists the product, and checkout is what refuses it
                        (`CART_INSUFFICIENT_STOCK`). For a `preorder` it reads the allowance, not
                        the shelf: `true` while any of it is left, `false` the day it is full (or
                        was never set).
                lowStock:
                    type: boolean
                    readOnly: true
                    description: >-
                        What is left is at or under the shop's low-stock threshold
                        (`NODE_LOW_STOCK_THRESHOLD`) while something is still for sale. Never
                        true together with `inStock` false.
                onHand:
                    type: integer
                    minimum: 0
                    readOnly: true
                    description: Units physically present, whether or not they are spoken for. Only for a caller holding `read:StockLevel`.
                reserved:
                    type: integer
                    minimum: 0
                    readOnly: true
                    description: Units held by an open order — present, but not for sale. Only for a caller holding `read:StockLevel`.
                # Derived (`onHand - reserved`), never stored, so it cannot disagree with the
                # pair it comes from.
                available:
                    type: integer
                    minimum: 0
                    readOnly: true
                    description: >-
                        Units a customer may actually buy, derived from the two counters above. For a
                        `preorder` it is what is left of the preorder allowance instead (the shelf is
                        empty by definition). Only for a caller holding `read:StockLevel`.
                description:
                    type: string
                active:
                    type: boolean
                # Visible but not for sale right now. Hidden (`active: false`) wins over it. Reads as
                # "Not available right now": add-to-cart is accepted, as for a sold-out product, and
                # checkout refuses it. Stock is unrelated — see `inStock`.
                purchasable:
                    type: boolean
                    default: true
                releaseDate:
                    $ref: '#/components/schemas/ReleaseDate'
                allowBackorder:
                    type: boolean
                restockDate:
                    $ref: '#/components/schemas/RestockDate'
                # Derived, never stored: `active && purchasable && releaseDate > now`. Turns false by
                # itself when the date passes, so nothing has to run on the release day.
                preorder:
                    type: boolean
                    readOnly: true
                    description: >-
                        The product is on sale before its release date: buyers can order it now and it
                        ships from `releaseDate`.
                # Derived, never stored: `allowBackorder` on a released, visible, buyable product whose
                # restock date has not passed and whose cap has room.
                backorder:
                    type: boolean
                    readOnly: true
                    description: >-
                        The product may be ordered while its shelf is empty: the units arrive by
                        `restockDate`, or within 30 days when there is none. Always shown with that promise.
                # Default true: most products are physical. false is a digital good — checkout
                # never needs a shipping method for a cart made entirely of these.
                requiresShipping:
                    type: boolean
                    default: true
                # Art. 16 CRD: personalised, sealed-hygiene or perishable goods carry no right of
                # withdrawal. Frozen onto each order line; `returns` refuses those lines.
                noWithdrawal:
                    type: boolean
                    default: false
                # Grams. Absent counts as 0 for shipping-method filtering (`GET /delivery/methods`,
                # checkout's weight-range refusal) — a product missing this is silently routed as
                # weightless, not refused, so the admin form warns rather than requiring it outright.
                weight:
                    type: integer
                    minimum: 0
                imageUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ImageUrl'
                thumbnailUrl:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/ThumbnailUrl'
                categories:
                    type: array
                    items:
                        type: string
                tags:
                    type: array
                    items:
                        type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                deletedAt:
                    type: string
                    format: date-time
