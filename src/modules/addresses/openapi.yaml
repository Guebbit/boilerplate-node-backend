openapi: 3.0.3
info:
    title: addresses — module contract
    version: '1.0.0'

paths:
    /account/addresses:
        get:
            tags: [Account]
            summary: List saved addresses
            description: The authenticated user's address book. Whenever it is non-empty, exactly one entry carries `default` — the one checkout ships to when no `addressId` is named.
            operationId: getAddresses
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: The address book
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AddressesEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        post:
            tags: [Account]
            summary: Add an address
            description: Adds an entry to the authenticated user's address book and answers the entry it created, with its `Location`. The first entry becomes the default automatically; a later entry claims the default slot only by sending `default true`, which demotes the previous holder — a different row, so a client showing the book refetches it.
            operationId: addAddress
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddressInput'
            responses:
                '201':
                    description: The created address
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AddressEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/addresses/{addressId}:
        put:
            tags: [Account]
            summary: Replace an address
            description: Replaces every writable field of one entry of the caller's own book (RFC 9110 §9.3.4, an omitted optional field is cleared). The default assignment is not part of the address — it is the book's pointer, moved by `PUT /account/addresses/{addressId}/default`, so `default` is not accepted here.
            operationId: replaceAddress
            security:
                - bearerAuth: []
            parameters:
                - name: addressId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: Address identifier from `GET /account/addresses`
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReplaceAddressRequest'
            responses:
                '200':
                    description: The address as it now stands
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AddressEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # Well-formed id that names none of the CALLER's addresses — someone else's
                # entry answers the same 404 as an invented one.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        patch:
            tags: [Account]
            summary: Update an address
            description: Merges the given fields into one entry of the caller's own book (RFC 7396, an omitted field is left unchanged, `null` clears an optional one). The default assignment is not part of the address — it is the book's pointer, moved by `PUT /account/addresses/{addressId}/default`, so `default` is not accepted here.
            operationId: updateAddress
            security:
                - bearerAuth: []
            parameters:
                - name: addressId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: Address identifier from `GET /account/addresses`
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateAddressRequest'
                    application/merge-patch+json:
                        schema:
                            $ref: '#/components/schemas/UpdateAddressRequest'
            responses:
                '200':
                    description: The address as it now stands
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AddressEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # Well-formed id that names none of the CALLER's addresses — someone else's
                # entry answers the same 404 as an invented one.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        delete:
            tags: [Account]
            summary: Remove an address
            description: Removes one entry of the caller's own book. Removing the default promotes the oldest remaining entry, so a non-empty book always has exactly one default.
            operationId: removeAddress
            security:
                - bearerAuth: []
            parameters:
                - name: addressId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: Address identifier from `GET /account/addresses`
            responses:
                '200':
                    description: The updated address book
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AddressesEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/addresses/{addressId}/default:
        put:
            tags: [Account]
            summary: Make an address the default
            description: Makes one entry of the caller's own book the default — the one checkout ships to when no `addressId` is named — and demotes the previous holder in the same write. The URI is the whole statement, so there is no body and repeating it changes nothing (RFC 9110 §9.3.4). Answers the entry, now `default true`; the demoted entry is another row, so a client showing the book refetches it. Shopify's `PUT /customers/{id}/addresses/{address_id}/default` is the same shape.
            operationId: setDefaultAddress
            security:
                - bearerAuth: []
            parameters:
                - name: addressId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: Address identifier from `GET /account/addresses`
            responses:
                '200':
                    description: The address, now the default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AddressEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # Well-formed id that names none of the CALLER's addresses — someone else's
                # entry answers the same 404 as an invented one.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # ---------- addresses — the schemas only this module's paths reference. ----------
        # A saved address — `OrderAddress` (the shared snapshot an order embeds) plus the two
        # facts that belong to the BOOK entry rather than to any shipment: its handle and
        # whether it is the default. Exactly one entry is default whenever the book is
        # non-empty; the API maintains that, not the client.
        Address:
            type: object
            additionalProperties: false
            required: [id, fullName, street, city, zip, country, default]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                label:
                    type: string
                    description: The caller's own name for the entry — "home", "office".
                fullName:
                    type: string
                street:
                    type: string
                city:
                    type: string
                zip:
                    type: string
                country:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CountryCode'
                phone:
                    type: string
                default:
                    type: boolean

        AddressInput:
            type: object
            additionalProperties: false
            required: [fullName, street, city, zip, country]
            properties:
                label:
                    type: string
                    minLength: 1
                fullName:
                    type: string
                    minLength: 1
                street:
                    type: string
                    minLength: 1
                city:
                    type: string
                    minLength: 1
                zip:
                    type: string
                    minLength: 1
                country:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CountryCode'
                phone:
                    type: string
                    minLength: 1
                # `true` claims the default slot, absent means "first entry becomes default, later
                # ones do not". Only a create names it — afterwards the default is the book's
                # pointer, moved by `PUT /account/addresses/{addressId}/default`.
                default:
                    type: boolean

        # PATCH /account/addresses/{addressId} — RFC 7396: every field optional, omitted means
        # unchanged.
        UpdateAddressRequest:
            type: object
            additionalProperties: false
            properties:
                # `null` clears the nickname; `fullName`/`street`/`city`/`zip`/`country` below stay
                # NON-nullable — omitting one leaves it unchanged, but a `null` is a 422: those are
                # required on the resource itself, an address is not valid without them.
                label:
                    type: string
                    minLength: 1
                    nullable: true
                fullName:
                    type: string
                    minLength: 1
                street:
                    type: string
                    minLength: 1
                city:
                    type: string
                    minLength: 1
                zip:
                    type: string
                    minLength: 1
                country:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CountryCode'
                phone:
                    type: string
                    minLength: 1
                    nullable: true

        # PUT /account/addresses/{addressId} — RFC 9110 §9.3.4: the body IS the new resource, so
        # every writable field this resource has must be nameable and the identity fields are
        # genuinely required.
        ReplaceAddressRequest:
            type: object
            additionalProperties: false
            required: [fullName, street, city, zip, country]
            properties:
                label:
                    type: string
                    minLength: 1
                    nullable: true
                fullName:
                    type: string
                    minLength: 1
                street:
                    type: string
                    minLength: 1
                city:
                    type: string
                    minLength: 1
                zip:
                    type: string
                    minLength: 1
                country:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/CountryCode'
                phone:
                    type: string
                    minLength: 1
                    nullable: true

        AddressesResponse:
            type: object
            additionalProperties: false
            required: [addresses]
            properties:
                addresses:
                    type: array
                    items:
                        $ref: '#/components/schemas/Address'

        AddressesEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/AddressesResponse'

        AddressEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/Address'
