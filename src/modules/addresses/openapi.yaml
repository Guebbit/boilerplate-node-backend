openapi: 3.0.3
info:
    title: addresses — module contract
    version: '1.0.0'

paths:
    /account/addresses:
        get:
            tags: [Account]
            summary: List saved addresses
            description: The authenticated user's address book. Whenever it is non-empty, exactly one entry carries `default` — the one checkout ships to when no `addressId` is named.
            operationId: getAddresses
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: The address book
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AddressesEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        post:
            tags: [Account]
            summary: Add an address
            description: Adds an entry to the authenticated user's address book. The first entry becomes the default automatically; a later entry claims the default slot only by sending `default true`, which demotes the previous holder.
            operationId: addAddress
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddressInput'
            responses:
                '200':
                    description: The updated address book
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AddressesEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /account/addresses/{addressId}:
        put:
            tags: [Account]
            summary: Replace an address
            description: Replaces every writable field of one entry of the caller's own book (RFC 9110 §9.3.4, an omitted optional field is cleared). `default true` claims the default slot and demotes the previous holder; `default false` and an absent `default` both leave the assignment alone — demoting without naming a successor would leave the book with none.
            operationId: replaceAddress
            security:
                - bearerAuth: []
            parameters:
                - name: addressId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: Address identifier from `GET /account/addresses`
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReplaceAddressRequest'
            responses:
                '200':
                    description: The updated address book
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AddressesEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # Well-formed id that names none of the CALLER's addresses — someone else's
                # entry answers the same 404 as an invented one.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        patch:
            tags: [Account]
            summary: Update an address
            description: Merges the given fields into one entry of the caller's own book (RFC 7396, an omitted field is left unchanged, `null` clears an optional one). `default true` claims the default slot and demotes the previous holder; `default false` and an absent `default` both leave the assignment alone — demoting without naming a successor would leave the book with none.
            operationId: updateAddress
            security:
                - bearerAuth: []
            parameters:
                - name: addressId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: Address identifier from `GET /account/addresses`
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateAddressRequest'
            responses:
                '200':
                    description: The updated address book
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AddressesEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # Well-formed id that names none of the CALLER's addresses — someone else's
                # entry answers the same 404 as an invented one.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        delete:
            tags: [Account]
            summary: Remove an address
            description: Removes one entry of the caller's own book. Removing the default promotes the oldest remaining entry, so a non-empty book always has exactly one default.
            operationId: removeAddress
            security:
                - bearerAuth: []
            parameters:
                - name: addressId
                  in: path
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                  description: Address identifier from `GET /account/addresses`
            responses:
                '200':
                    description: The updated address book
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AddressesEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        # ---------- addresses — the schemas only this module's paths reference. ----------
        # A saved address — `OrderAddress` (the shared snapshot an order embeds) plus the two
        # facts that belong to the BOOK entry rather than to any shipment: its handle and
        # whether it is the default. Exactly one entry is default whenever the book is
        # non-empty; the API maintains that, not the client.
        Address:
            type: object
            additionalProperties: false
            required: [id, fullName, street, city, zip, country, default]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                label:
                    type: string
                    description: The caller's own name for the entry — "home", "office".
                fullName:
                    type: string
                street:
                    type: string
                city:
                    type: string
                zip:
                    type: string
                country:
                    type: string
                phone:
                    type: string
                default:
                    type: boolean

        AddressInput:
            type: object
            additionalProperties: false
            required: [fullName, street, city, zip, country]
            properties:
                label:
                    type: string
                fullName:
                    type: string
                    minLength: 1
                street:
                    type: string
                    minLength: 1
                city:
                    type: string
                    minLength: 1
                zip:
                    type: string
                    minLength: 1
                country:
                    type: string
                    minLength: 1
                phone:
                    type: string
                # On create: `true` claims the default slot, absent means "first entry becomes
                # default, later ones do not". On update: `true` claims the slot, `false` and
                # absent both leave the assignment alone — demoting the default without naming
                # a successor would leave the book with none.
                default:
                    type: boolean

        # PATCH /account/addresses/{addressId} — RFC 7396: every field optional, omitted means
        # unchanged.
        UpdateAddressRequest:
            type: object
            additionalProperties: false
            properties:
                # `null` clears the nickname; `fullName`/`street`/`city`/`zip`/`country` below stay
                # NON-nullable — omitting one leaves it unchanged, but a `null` is a 422: those are
                # required on the resource itself, an address is not valid without them.
                label:
                    type: string
                    minLength: 1
                    nullable: true
                fullName:
                    type: string
                    minLength: 1
                street:
                    type: string
                    minLength: 1
                city:
                    type: string
                    minLength: 1
                zip:
                    type: string
                    minLength: 1
                country:
                    type: string
                    minLength: 1
                phone:
                    type: string
                    minLength: 1
                    nullable: true
                # Absent and `false` are both "no promotion asked" — see this operation's own
                # description.
                default:
                    type: boolean

        # PUT /account/addresses/{addressId} — RFC 9110 §9.3.4: the body IS the new resource, so
        # every writable field this resource has must be nameable and the identity fields are
        # genuinely required.
        ReplaceAddressRequest:
            type: object
            additionalProperties: false
            required: [fullName, street, city, zip, country]
            properties:
                label:
                    type: string
                    minLength: 1
                    nullable: true
                fullName:
                    type: string
                    minLength: 1
                street:
                    type: string
                    minLength: 1
                city:
                    type: string
                    minLength: 1
                zip:
                    type: string
                    minLength: 1
                country:
                    type: string
                    minLength: 1
                phone:
                    type: string
                    minLength: 1
                    nullable: true
                # Not nullable, so a PUT that omits it leaves the default assignment alone.
                default:
                    type: boolean

        AddressesResponse:
            type: object
            additionalProperties: false
            required: [addresses]
            properties:
                addresses:
                    type: array
                    items:
                        $ref: '#/components/schemas/Address'

        AddressesEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/AddressesResponse'
