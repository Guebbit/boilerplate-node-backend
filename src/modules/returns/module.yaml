summary: 'Sending goods back, including the EU withdrawal button.'
subdomain: supporting
group: shop
dependsOn:
    - access # ownOrderFlag: the audit flag of an approve or receive on the caller's own order
    - delivery # the return address, and the cheapest standard delivery a withdrawal refunds
    - inventory # putting received goods back on sale
    - orders # the order a return is about: its lines, its owner, and the cancel a pre-dispatch withdrawal becomes
    - payments # the refund for received goods, and PAYMENT_REFUNDED — the fact that closes a return
    - shop # where goods come back to, and who pays the postage
rateLimits:
    returnsWrite:
        name: Returns and withdrawals opened
        namespace: returns-write
        environmentVariable: NODE_RETURNS_RATE_LIMIT_MAX
        defaultMax: 20
        windowMs: shared
        bounds:
            Requests to `POST /returns`, keyed on the ACCOUNT — each opens a row staff must read and
            mails the shop pays for, and an address-keyed budget would let one signed-in account
            behind a shared address starve every other caller on it.
        audited: true
