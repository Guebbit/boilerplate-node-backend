openapi: 3.1.0
info:
    title: returns — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Returns
      description: Sending goods back — including the EU withdrawal button, which is a return with `reason` `withdrawal`.

x-error-codes:
    RETURN_DEDUCTION_INVALID: { status: 422, description: 'The handling deduction is more than the refund is worth, or is kept back on a defect or a wrong item (a guarantee remedy is free of charge, Directive 2019/771 Art. 14(1)).' }
    RETURN_REMEDY_INVALID: { status: 422, description: 'A remedy other than a refund is named for a reason that has no guarantee behind it (only a `defective` or `wrong_item` return can be repaired or replaced), or a preferred remedy is named for such a reason.' }
    RETURN_LINES_INVALID: { status: 422, description: 'A line names a product that is not on the order, asks for more than is left of it, is excluded from the right of withdrawal (Art. 16), or nothing on the order is left to return.' }
    RETURN_NOT_RECEIVABLE: { status: 409, description: 'The return is not an approved one awaiting its goods.' }
    RETURN_NOT_CLOSABLE: { status: 409, description: 'The return is not one that was received and still awaits its money, so it cannot be closed by hand.' }
    RETURN_NOT_CANCELABLE: { status: 409, description: 'The return is not an approved one awaiting goods that never came, so it cannot be canceled.' }
    RETURN_RESTOCK_INVALID: { status: 422, description: 'A restock count names a product that is not on the return, names one twice, or is more than the line holds.' }
    RETURN_NOT_DECIDABLE: { status: 409, description: 'The return has already been decided.' }
    RETURN_ORDER_NOT_RETURNABLE: { status: 409, description: 'The order is not in a state a return can be opened on — cancelled, or (for a reason other than withdrawal) still in the shop''s hands.' }
    RETURN_CANCELLATION_INVALID: { status: 422, description: 'A cancellation names no fulfillment order of this order, or sends `lines` (the remainder is its lines), or a return names a fulfillment order. Also the reason does not fit the caller: the order''s buyer cancels only as a `withdrawal`.' }
    RETURN_STATEMENT_INVALID: { status: 422, description: 'The date or the channel of what the buyer stated is missing where staff must give it (a withdrawal recorded for the buyer), given where it does not belong (by the buyer, or on a reason that is not a withdrawal), in the future, or before the order was made.' }
    RETURN_NOTHING_TO_CANCEL: { status: 409, description: 'The fulfillment order has nothing left to cancel, or nothing has shipped from the order yet (cancel the whole order instead).' }
    RETURN_WINDOW_CLOSED: { status: 409, description: 'The period for the reason named has ended: the withdrawal period for a withdrawal or other, two years from delivery for a defect or a wrong item.' }

# This module's section of the account data export (`POST /account/export`): the bundler
# adds it to `AccountExportResponse`. Removing the module removes the section.
x-personal-data:
    # Every return on one of this account's OWN orders — a withdrawal included — found by
    # `orderId`, since a return is keyed by the order and never by the user. Empty, never
    # absent, for an account that has returned nothing.
    returns:
        schema:
            type: array
            items:
                $ref: '#/components/schemas/ExportReturn'

paths:
    /returns:
        get:
            tags: [Returns]
            summary: List returns (paginated)
            description: >-
                Staff (`read:Return`) see every return; anyone else sees the returns on their
                own orders. Filter by `orderId` to see one order's, which is how an order page
                shows what has happened to a withdrawal.
            operationId: listReturns
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: orderId
                  in: query
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                - name: status
                  in: query
                  schema:
                      $ref: '#/components/schemas/ReturnStatus'
                - name: reason
                  in: query
                  schema:
                      $ref: '#/components/schemas/ReturnReason'
                - name: sort
                  in: query
                  required: false
                  # JSON:API grammar: `?sort=-createdAt,status` — comma-separated, `-` for descending.
                  style: form
                  explode: false
                  schema:
                      $ref: '#/components/schemas/ReturnSort'
            responses:
                '200':
                    description: A page of returns, newest first unless `sort` says otherwise
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReturnsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        post:
            tags: [Returns]
            summary: Open a return, or withdraw from the contract
            description: >-
                The customer's one door for sending goods back — and the EU "withdraw from
                contract here" button (Consumer Rights Directive Art. 11a): a withdrawal is a
                return with `reason: withdrawal`, not a separate endpoint.

                Always answers a `Return` (201, with `Location`); where the goods are decides what
                it is. Once they have shipped, a withdrawal is born `approved` and any other reason
                waits for staff. Before dispatch there is nothing to send back, so a withdrawal
                cancels the order — refunded in full, stock released — and the `Return` is born
                `closed`: `reason: withdrawal`, no `lines`, `refundAmount` what the order cost (zero
                when nothing was paid). Either way the customer gets an acknowledgement email
                carrying the exact date and time, and `Return.orderId` is where the client reloads
                the order from. `Order.actions.withdraw` says whether the button is offered; the
                client never counts the days.

                `kind: cancellation` cancels what has not shipped yet — the remainder of ONE fulfillment
                order (`fulfillmentOrderId`) once something has shipped from the order. It is born
                `closed`, its `lines` are the remainder, and the refund of those lines follows (plus
                the delivery when it takes the last unit of the order). The buyer uses it as part of
                their withdrawal, and names `reason: withdrawal`; staff may use it too (out of stock
                for good), name any other reason, and need `create:Refund` — the refund key,
                `stepUp: critical`. A staff cancellation asks a fresh session; the buyer's own
                withdrawal never does. `GET /returns/options` says what each door would take and
                refund, and whether this caller may use it (`cancel`).

                A return answers for goods that left (`kind: return`, the default). The order's buyer
                opens one for any reason whose deadline is open. Staff holding `update:Return` open
                one on a buyer's behalf, the way a phone call or an email asks for it: it is born
                `approved`, opening it IS the decision, and the buyer is told where to send the goods.
                Staff are not stopped by the deadline or by goods Art. 16 excludes for the shop's own
                reasons (`defective`, `wrong_item`, `other`): what they waived is recorded on the
                return, in `policyExceptions`. `requestedAt` says when the buyer asked (default now,
                never in the future, never before the order existed); the deadline is judged on it.

                Staff can also record a withdrawal the buyer stated outside the shop: `reason:
                withdrawal` with `requestedAt` (when the buyer sent it, Art. 11(2)) and `statedVia`
                (`phone`, `email`, `letter`, `other`), both required. The withdrawal keeps its legal
                window, judged on `requestedAt`, and its Art. 16 exclusion. It does everything the
                buyer's own withdrawal does, and the customer is told when they stated it and when the
                shop recorded it. Shipped goods need `update:Return`; before dispatch the order is
                cancelled and refunded, which needs `create:Refund` (money out) and `update:Order` (the
                cancel); a remainder cancel needs `create:Refund`. Any request carrying `statedVia`
                asks a fresh session: the record is a legal act, and the check fails closed. The
                buyer sends neither `requestedAt` nor `statedVia` (422): the server sets them. Sending
                `Idempotency-Key` makes a retry safe.
            operationId: createReturn
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateReturnRequest'
            responses:
                '201':
                    description: The return, opened — or, for a withdrawal before dispatch, closed at birth with the order cancelled and refunded
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Return'
                # Also `REAUTH_REQUIRED`: a staff `cancellation`, or any request carrying `statedVia`, from a session past the critical window.
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # A staff `cancellation`, or a staff withdrawal before dispatch, by a caller without the keys it needs (`create:Refund`, `update:Order`).
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # Not the caller's order and no `update:Return` to act for the buyer, or no such order.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `RETURN_ORDER_NOT_RETURNABLE`, `RETURN_WINDOW_CLOSED`, `RETURN_NOTHING_TO_CANCEL` — or
                # `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                # `RETURN_LINES_INVALID`, `RETURN_CANCELLATION_INVALID`, `RETURN_STATEMENT_INVALID`, or a malformed body.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /returns/options:
        get:
            tags: [Returns]
            summary: What an order can still send back or cancel
            description: >-
                The server's answer to "what can I still return, and what can I still cancel?" for one
                order, so no client counts. `returnable` is the quantity per product that has SHIPPED
                and has not already been returned, offered while a reason in `reasons` is open: the
                buyer's `reasons` are the ones whose deadline is open (none past every deadline), and
                staff holding `update:Return` get every reason, since they may open a return or record
                a withdrawal on a buyer's behalf. `exceptions` lists, for staff, the reasons that are
                past their deadline now, so a client can label what opening one would waive.
                `cancellable` lists each fulfillment order that
                still has a remainder, with the exact refund cancelling it would owe (the delivery
                included when it takes the last unit of the order). `cancellable` is empty while
                nothing has shipped — the whole order is cancelled instead (`Order.actions.cancel`).
                The caller must own the order, or hold `read:Return`.
            operationId: getReturnOptions
            security:
                - bearerAuth: []
            parameters:
                - name: orderId
                  in: query
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
            responses:
                '200':
                    description: What the order can still return and cancel
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReturnOptions'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /returns/{id}:
        get:
            tags: [Returns]
            summary: Get a return
            description: >-
                One return with the caller's `actions`. A return on someone else's order answers
                404, the same as one that does not exist.
            operationId: getReturnById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The return
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Return'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /returns/{id}/approve:
        post:
            tags: [Returns]
            summary: Approve a return request
            description: >-
                Staff accept a `requested` return; the customer is told they may send the goods
                back. The write is conditional on the return still being `requested`, so two staff
                members deciding at once cannot both win — the second answers 409.
            operationId: approveReturn
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The return, `approved`
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Return'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `RETURN_NOT_DECIDABLE`
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /returns/{id}/decline:
        post:
            tags: [Returns]
            summary: Decline a return request
            description: >-
                Staff refuse a `requested` return with a reason code, and a message to the buyer that
                `other` requires — the customer is mailed the code's sentence, in their own language,
                and the message. Same conditional write as `approve`. A decline is final: a mistaken one
                is fixed by opening a new return for the same lines. A decline is a complaint the shop
                does not settle, so the mail does not carry the ADR information Directive 2013/11
                Art. 13(3) asks for; that is the shop's to add.
            operationId: declineReturn
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeclineReturnRequest'
            responses:
                '200':
                    description: The return, `declined`
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Return'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /returns/{id}/close:
        post:
            tags: [Returns]
            summary: Close a return by hand
            description: >-
                Staff finish a `received` return whose refund will not follow the usual way: it was
                canceled, or the money went back outside the application. The return becomes `closed`
                and the order's timeline and the audit row `admin.return.closed` say so, with the
                note in the audit row only. No money moves, no stock moves (the units went back on
                sale when the goods were received), no credit note is issued and the customer is not
                mailed that their money went back: closing is bookkeeping, not a refund. A return that
                is not `received` (a `requested` one is declined, an `approved` one whose goods never came is
                canceled, not closed) answers 409
                `RETURN_NOT_CLOSABLE`. Needs `receive:Return`, the key that receives the goods, which
                carries a fresh-session requirement.
            operationId: closeReturn
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CloseReturnRequest'
            responses:
                '200':
                    description: The return, `closed`
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Return'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `RETURN_NOT_CLOSABLE`
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /returns/{id}/cancel:
        post:
            tags: [Returns]
            summary: Cancel an approved return whose goods never came
            description: >-
                Staff end an `approved` return whose goods will never arrive: the buyer never sent
                them, or changed their mind. The return becomes `canceled`, a final state that is
                not `closed`: it holds no units (the same lines can be returned again) and counts
                as no goods back, so the order's return status leaves `in_progress` and the
                delivery refund is not taken by it. A withdrawal, born `approved`, can be canceled
                too.

                Bookkeeping only. No money moves, no stock moves, no event is published and the
                customer is not mailed. The order's timeline and the audit row
                `admin.return.canceled` say so, with the note in the audit row only. A return that
                is not `approved` answers 409 `RETURN_NOT_CANCELABLE`: a `requested` one is
                declined, a `received` one is closed.

                A parcel lost on its way back is NOT canceled: the shop bears that risk, so the
                refund may be owed. Receive it with a restock count of 0 instead. Needs
                `update:Return`; no fresh session, since nothing moves.
            operationId: cancelReturn
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancelReturnRequest'
            responses:
                '200':
                    description: The return, `canceled`
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Return'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `RETURN_NOT_CANCELABLE`
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /returns/{id}/receive:
        post:
            tags: [Returns]
            summary: Record that the returned goods arrived
            description: >-
                The warehouse (or a manager) says the goods are back: the units go on sale again,
                the customer is owed the money for them, and the return finishes. Requires an
                `approved` return — a withdrawal is born approved, anything else was approved by
                staff first. The status move and the restock are one transaction, so a return is
                never half-received; the move is conditional, so a second click answers 409.

                What is refunded: the returned lines, plus the delivery paid when the return
                carries every unit on the order (a withdrawal gets back up to the cheapest standard
                delivery on offer; faulty or wrong goods get all of it), less an optional
                `handlingDeduction` for damage the customer caused (Art. 14(2)). Which of the returned
                units go back on sale is staff's call, per line: `lines[].restock` (absent means all
                of them). A broken unit set to 0 never reaches the shelf, so it is never handed to a
                backorder buyer, and the refund does not change: restocking is about the goods, not the
                money. A defect or a wrong item has a ladder of remedies (Directive 2019/771 Art. 13): `remedy`
                says which one staff give — `refund` (the default, as above), `replace` (the same product is
                sent again on the SAME order through the ordinary shipping door; the return closes with no
                money moving) or `repair` (the goods are repaired and posted back by staff; the return closes
                with no money moving and the guarantee is extended by 12 months, once per order, Directive
                2024/1799). Staff may pick a remedy other than the buyer's `preferredRemedy`. A withdrawal and
                a goodwill return always refund (`RETURN_REMEDY_INVALID` otherwise), and a defect or a wrong
                item never takes a `handlingDeduction`. A replacement the order cannot send again answers
                409 `DELIVERY_NOT_REOPENABLE`. A parcel lost on its way back is received with 0 on every line: the shop bears
                that risk, so the refund is owed, and nothing goes on sale. The amount is fixed
                when the goods are received and shown as `refundAmount`. If the payment provider
                refuses, the return stays `received` and the refund is retried by the payment sweep;
                the return closes when it lands. The answer is 200 either way: `received` means the
                money is still owed (its refund record is already on the payment, follow it there
                and on `GET /payments/attention`), `closed` means it went back. Sends `Idempotency-Key`-safe retries. Requires a
                session that has re-proved itself within the last few minutes — a valid-but-stale
                token answers 401 with `errors[].code` `REAUTH_REQUIRED`.
            operationId: receiveReturn
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReceiveReturnRequest'
            responses:
                '200':
                    description: The return — `closed` once the money went back, `received` while a refused refund waits for the sweep
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Return'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `RETURN_NOT_RECEIVABLE`, `DELIVERY_NOT_REOPENABLE` — or `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                # `RETURN_DEDUCTION_INVALID`, `RETURN_RESTOCK_INVALID`, `RETURN_REMEDY_INVALID`, or a malformed body.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        ReturnStatus:
            type: string
            enum: [requested, approved, declined, received, closed, canceled]
            description: >-
                Where a return stands: `requested → approved → received → closed`, or `requested →
                declined`, or `approved → canceled` (the goods never came). `canceled` is final and
                is not `closed`: it holds no units and counts as no goods back. A withdrawal is born `approved` — or `closed`, when it reached the order
                before dispatch. Which move may follow which is the
                server's rule, answered per caller by `Return.actions`.

        # The ONE sort grammar, shared with every list (docs/api/sorting.md). `-` sorts
        # descending; earlier entries rank first; ties end on the id.
        ReturnSort:
            type: array
            minItems: 1
            maxItems: 2
            items:
                type: string
                enum: [createdAt, -createdAt, status, -status]

        ReturnReason:
            type: string
            enum: [withdrawal, defective, wrong_item, other]
            description: >-
                Why the goods come back. `withdrawal` is the EU right of withdrawal — the same object
                a faulty-goods return uses, with a legal deadline and an acknowledgement attached.

        ReturnRemedy:
            type: string
            enum: [refund, replace, repair]
            description: >-
                What the buyer is given for a faulty or wrong item (Directive 2019/771 Art. 13):
                `repair` and `replace` come first and the buyer chooses; `refund` is the money back.
                Choosing `repair` extends the guarantee by 12 months (Directive 2024/1799). Only a
                `defective` or `wrong_item` return has a choice; every other reason is refunded.

        ReturnDeclineReason:
            type: string
            enum: [return_period_ended, not_returnable, no_defect_found, other]
            description: >-
                Why staff declined, as a code the buyer reads in their own language and a shop can count:
                `return_period_ended` — past the window; `not_returnable` — exempt from returns (an Art. 16
                exception) or sold as final sale; `no_defect_found` — a guarantee claim where the goods
                conform; `other` — see the message.

        ReturnOpenedBy:
            type: string
            enum: [buyer, staff]
            description: Who opened the return — the order's buyer, or staff on the buyer's behalf.

        ReturnPolicyException:
            type: string
            enum: [window_closed, excluded_goods]
            description: >-
                A rule staff waived when they opened the return for a buyer: `window_closed` — the
                reason's deadline had passed when the buyer asked; `excluded_goods` — a line is goods
                Art. 16 takes the right of withdrawal away from.

        ReturnStatementChannel:
            type: string
            enum: [online, phone, email, letter, other]
            description: >-
                How the buyer stated a withdrawal. `online` is the shop's own button; the rest are
                what staff record.

        StaffStatementChannel:
            type: string
            enum: [phone, email, letter, other]
            description: How the buyer stated a withdrawal outside the shop, as staff record it.

        ReturnKind:
            type: string
            enum: [return, cancellation]
            description: >-
                What the record is: `return` — goods that left coming back; `cancellation` — the
                unshipped remainder of one fulfillment order, cancelled and refunded, closed when
                made.

        ReturnLine:
            type: object
            additionalProperties: false
            required: [productId, quantity, title, unitPrice]
            description: One line of a return — a snapshot of what is coming back, so it reads the same later.
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                quantity:
                    type: integer
                    minimum: 1
                title:
                    type: string
                    description: The product's title as the order froze it.
                unitPrice:
                    type: number
                    format: double
                    minimum: 0
                    description: The gross unit price the order froze.
                restocked:
                    type: integer
                    minimum: 0
                    description: >-
                        How many of the `quantity` went back on sale when the goods were received. Set
                        at receipt, never more than `quantity`; absent before then.

        ReturnActions:
            type: object
            additionalProperties: false
            required: [approve, decline, receive, close, cancel]
            description: >-
                What the requesting caller may do to this return, decided by the server, so a client
                renders its controls from this rather than re-implementing the lifecycle. Each needs
                the key that names the act and a status the act can run from.
            properties:
                approve:
                    type: boolean
                    description: Whether `POST /returns/{id}/approve` would be accepted.
                decline:
                    type: boolean
                    description: Whether `POST /returns/{id}/decline` would be accepted.
                receive:
                    type: boolean
                    description: Whether `POST /returns/{id}/receive` would be accepted.
                close:
                    type: boolean
                    description: Whether `POST /returns/{id}/close` would be accepted.
                cancel:
                    type: boolean
                    description: Whether `POST /returns/{id}/cancel` would be accepted.

        Return:
            type: object
            additionalProperties: false
            required: [id, orderId, orderNumber, currency, status, reason, kind, lines, returnPostage, requestedAt, openedBy, policyExceptions, createdAt, actions]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderNumber:
                    type: string
                    description: The order's human number.
                currency:
                    type: string
                    description: ISO-4217 code of the order's own currency.
                status:
                    $ref: '#/components/schemas/ReturnStatus'
                reason:
                    $ref: '#/components/schemas/ReturnReason'
                kind:
                    $ref: '#/components/schemas/ReturnKind'
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                note:
                    type: string
                    maxLength: 1000
                    description: What the customer wrote. Free text.
                lines:
                    type: array
                    description: What is coming back — or, for a `cancellation`, the remainder that was cancelled. Empty on a withdrawal before dispatch — no goods are expected.
                    items:
                        $ref: '#/components/schemas/ReturnLine'
                returnPostage:
                    description: >-
                        Who pays to send the goods back — frozen when the return was opened, from the
                        shop's configuration, so it is what the customer was told beforehand (Art.
                        14(1)).
                    $ref: '../shop/openapi.yaml#/components/schemas/ReturnPostagePayer'
                requestedAt:
                    type: string
                    format: date-time
                    description: >-
                        When the buyer asked (or, for a withdrawal, stated it). The server sets it for
                        the buyer; staff may backdate it to the day the buyer actually phoned or wrote.
                        The deadline is judged on it.
                statedVia:
                    $ref: '#/components/schemas/ReturnStatementChannel'
                openedBy:
                    $ref: '#/components/schemas/ReturnOpenedBy'
                policyExceptions:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReturnPolicyException'
                    description: What staff waived when they opened it. Empty when the buyer opened it, or nothing was waived.
                declineReason:
                    $ref: '#/components/schemas/ReturnDeclineReason'
                declineMessage:
                    type: string
                    maxLength: 500
                    description: >-
                        What staff wrote to the buyer beside the reason code; required when the code is
                        `other`. Free text, so `reap:returns` unsets it after the retention window; the
                        code stays.
                decidedAt:
                    type: string
                    format: date-time
                    description: When staff decided it — or, for a withdrawal, when it was opened already approved.
                preferredRemedy:
                    $ref: '#/components/schemas/ReturnRemedy'
                    description: >-
                        What the buyer asked for when they opened a `defective` or `wrong_item` return.
                        A wish, not a promise: staff choose the `remedy` when the goods arrive.
                receivedAt:
                    type: string
                    format: date-time
                    description: When the goods arrived and went back on sale.
                remedy:
                    $ref: '#/components/schemas/ReturnRemedy'
                    description: >-
                        What staff gave when the goods arrived. Absent until then, and on a return born
                        closed. `replace` and `repair` close the return with no money moving and hand its
                        units back to the buyer, so they are returnable again.
                handlingDeduction:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        An amount kept back from the refund for handling damage (Art. 14(2)),
                        entered when the goods were received. Absent when nothing was kept.
                refundAmount:
                    type: number
                    format: double
                    minimum: 0
                    description: What the customer is owed for this return, fixed when the goods were received.
                closedAt:
                    type: string
                    format: date-time
                    description: When the money went back and the return finished.
                canceledAt:
                    type: string
                    format: date-time
                    description: When staff canceled the return. Present only on a `canceled` return.
                # Computed per CALLER, not stored — present on every response carrying a return, list rows included.
                actions:
                    $ref: '#/components/schemas/ReturnActions'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        CreateReturnRequest:
            type: object
            additionalProperties: false
            required: [orderId, reason]
            properties:
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                reason:
                    $ref: '#/components/schemas/ReturnReason'
                note:
                    type: string
                    minLength: 1
                    maxLength: 1000
                kind:
                    $ref: '#/components/schemas/ReturnKind'
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                    description: Required exactly when `kind` is `cancellation` — the fulfillment order whose remainder is cancelled.
                requestedAt:
                    type: string
                    format: date-time
                    description: >-
                        Staff only: when the buyer asked, or for a withdrawal when they stated it
                        (Art. 11(2) judges timing on the day it was sent). Required for a staff
                        withdrawal, optional otherwise (default now). Never in the future, never
                        before the order was made. The buyer does not send it.
                statedVia:
                    $ref: '#/components/schemas/StaffStatementChannel'
                preferredRemedy:
                    $ref: '#/components/schemas/ReturnRemedy'
                    description: >-
                        What the buyer would like for a faulty or wrong item: a repair, a replacement or
                        the money back. Only for `defective` and `wrong_item` (422
                        `RETURN_REMEDY_INVALID` otherwise). Staff decide at receipt; the buyer is told
                        that choosing repair extends the guarantee by 12 months.
                lines:
                    type: array
                    minItems: 1
                    items:
                        type: object
                        additionalProperties: false
                        required: [productId, quantity]
                        properties:
                            productId:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                            quantity:
                                type: integer
                                minimum: 1
                    description: >-
                        What comes back. Absent means everything on the order that is still left to
                        return — the usual shape of a withdrawal. Not allowed on a `cancellation`: the
                        whole remainder is its lines.

        ReceiveReturnRequest:
            type: object
            additionalProperties: false
            properties:
                remedy:
                    $ref: '#/components/schemas/ReturnRemedy'
                    description: >-
                        What the buyer is given. Absent means `refund`. `replace` and `repair` are for a
                        `defective` or `wrong_item` return only (422 `RETURN_REMEDY_INVALID` otherwise).
                handlingDeduction:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        Handling damage to keep back from the refund (Art. 14(2)), a decimal in the
                        return's currency. Absent means none. More than the refund is worth is refused,
                        and so is any amount on a `defective` or `wrong_item` return (a guarantee remedy
                        is free of charge).
                lines:
                    type: array
                    description: >-
                        How many units of each returned product go back on sale. A product not listed
                        goes back in full, and absent `lines` puts everything back. A unit that is
                        broken is set to 0. An unknown or repeated product, or a count over the line's
                        quantity, is refused.
                    items:
                        type: object
                        additionalProperties: false
                        required: [productId, restock]
                        properties:
                            productId:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                            restock:
                                type: integer
                                minimum: 0

        CloseReturnRequest:
            type: object
            additionalProperties: false
            properties:
                note:
                    type: string
                    minLength: 1
                    maxLength: 1000
                    description: >-
                        Why the return is closed by hand. Optional, staff-only free text, kept in the
                        audit row and nowhere the customer reads.

        CancelReturnRequest:
            type: object
            additionalProperties: false
            properties:
                note:
                    type: string
                    minLength: 1
                    maxLength: 500
                    description: >-
                        Why the return is canceled. Optional, staff-only free text, kept in the audit
                        row and nowhere the customer reads.

        DeclineReturnRequest:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
                reason:
                    $ref: '#/components/schemas/ReturnDeclineReason'
                message:
                    type: string
                    minLength: 1
                    maxLength: 500
                    description: >-
                        Text for the buyer, mailed beside the reason. Required when `reason` is `other`
                        ("other" alone tells the buyer nothing); optional otherwise.

        ReturnOptionLine:
            type: object
            additionalProperties: false
            required: [productId, title, quantity, withdrawable]
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                title:
                    type: string
                quantity:
                    type: integer
                    minimum: 1
                withdrawable:
                    type: boolean
                    description: >-
                        Whether the right of withdrawal reaches this line. False for goods Art. 16
                        excludes (made to order, perishable): only `defective` or `wrong_item` may
                        name them, and a request that names them with another reason is a 422.

        CancelOptionLine:
            type: object
            additionalProperties: false
            required: [productId, title, quantity]
            description: 'A line of the remainder a cancel would take, which is what has not shipped, per product.'
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                title:
                    type: string
                quantity:
                    type: integer
                    minimum: 1

        CancellableFulfillmentOrder:
            type: object
            additionalProperties: false
            required: [fulfillmentOrderId, number, lines, refundAmount, shippingRefund, cancel]
            description: A fulfillment order with a remainder that can still be cancelled, and what cancelling it would refund.
            properties:
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                number:
                    type: integer
                    minimum: 1
                lines:
                    type: array
                    items:
                        $ref: '#/components/schemas/CancelOptionLine'
                refundAmount:
                    type: number
                    format: double
                    minimum: 0
                    description: What the cancel would refund, in `ReturnOptions.currency` — the lines plus `shippingRefund`.
                shippingRefund:
                    type: number
                    format: double
                    minimum: 0
                    description: The delivery inside `refundAmount` — non-zero only when this cancel takes the last unit of the order.
                cancel:
                    type: boolean
                    description: >-
                        Whether THIS caller may cancel this remainder, so a client offers only a door that
                        opens. The order's buyer: within the withdrawal window, and only when the remainder
                        holds no goods excluded from withdrawal (Art. 16). Anyone else: holding `create:Refund`.

        ReturnOptions:
            type: object
            additionalProperties: false
            required: [orderId, currency, exceptions, returnable, cancellable]
            properties:
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                currency:
                    type: string
                    description: ISO-4217 code of the order's own currency.
                reasons:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReturnReason'
                    description: >-
                        The reasons THIS caller can still name, so a client offers no door that is shut.
                        The buyer's are the ones whose deadline is open: empty once every deadline
                        has passed. `withdrawal` and `other` last for the withdrawal period;
                        `defective` and `wrong_item` for two years from delivery (the legal guarantee
                        of conformity), made-to-order goods included. Staff holding `update:Return`
                        get every reason: they open a return, or record a withdrawal, for the buyer.
                exceptions:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReturnReason'
                    description: >-
                        For staff, the non-withdrawal reasons that are past their deadline now: opening
                        a return for one is recorded as an exception (`window_closed`). Empty for the
                        buyer. A preview: the server judges the deadline on `requestedAt` when it opens.
                returnable:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReturnOptionLine'
                    description: >-
                        Per product, what has shipped and not yet been returned. Empty unless `reasons`
                        is not. Goods excluded from withdrawal (Art. 16) are listed to the buyer only
                        while a `defective` or `wrong_item` reason is open, and to staff always; they
                        carry `withdrawable: false`.
                cancellable:
                    type: array
                    items:
                        $ref: '#/components/schemas/CancellableFulfillmentOrder'

        ReturnsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Return'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        # Used by `POST /account/export` (`shared/contracts/openapi.root.yaml`) — what the customer
        # wrote, what staff wrote back (`declineReason` and `declineMessage`, the customer's own data under Art. 15) and
        # where it stands. The deciding staff member and the frozen unit prices are left out: an
        # export answers "what did I ask for and what was I told", not the shop's working records.
        ExportReturn:
            type: object
            additionalProperties: false
            required: [id, orderId, status, reason, lines]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                status:
                    $ref: '#/components/schemas/ReturnStatus'
                reason:
                    $ref: '#/components/schemas/ReturnReason'
                note:
                    type: string
                declineReason:
                    $ref: '#/components/schemas/ReturnDeclineReason'
                declineMessage:
                    type: string
                lines:
                    type: array
                    items:
                        type: object
                        additionalProperties: false
                        required: [productId, quantity, title]
                        properties:
                            productId:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                            quantity:
                                type: integer
                                minimum: 1
                            title:
                                type: string
                createdAt:
                    type: string
                    format: date-time
