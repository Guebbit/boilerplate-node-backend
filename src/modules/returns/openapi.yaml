openapi: 3.1.0
info:
    title: returns — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Returns
      description: Sending goods back — including the EU withdrawal button, which is a return with `reason` `withdrawal`.

x-error-codes:
    RETURN_DEDUCTION_INVALID: { status: 422, description: 'The handling deduction is more than the refund is worth.' }
    RETURN_LINES_INVALID: { status: 422, description: 'A line names a product that is not on the order, asks for more than is left of it, is excluded from the right of withdrawal (Art. 16), or nothing on the order is left to return.' }
    RETURN_NOT_RECEIVABLE: { status: 409, description: 'The return is not an approved one awaiting its goods.' }
    RETURN_NOT_DECIDABLE: { status: 409, description: 'The return has already been decided.' }
    RETURN_ORDER_NOT_RETURNABLE: { status: 409, description: 'The order is not in a state a return can be opened on — cancelled, or (for a reason other than withdrawal) still in the shop''s hands.' }
    RETURN_CANCELLATION_INVALID: { status: 422, description: 'A cancellation names no fulfillment order of this order, or sends `lines` (the remainder is its lines), or a return names a fulfillment order. Also the reason does not fit the caller: the order''s buyer cancels only as a `withdrawal`; anyone else (staff) may name any reason but `withdrawal`, which is the buyer''s own right.' }
    RETURN_NOTHING_TO_CANCEL: { status: 409, description: 'The fulfillment order has nothing left to cancel, or nothing has shipped from the order yet (cancel the whole order instead).' }
    RETURN_WINDOW_CLOSED: { status: 409, description: 'The period for the reason named has ended: the withdrawal period for a withdrawal or other, two years from delivery for a defect or a wrong item.' }

# This module's section of the account data export (`POST /account/export`): the bundler
# adds it to `AccountExportResponse`. Removing the module removes the section.
x-personal-data:
    # Every return on one of this account's OWN orders — a withdrawal included — found by
    # `orderId`, since a return is keyed by the order and never by the user. Empty, never
    # absent, for an account that has returned nothing.
    returns:
        schema:
            type: array
            items:
                $ref: '#/components/schemas/ExportReturn'

paths:
    /returns:
        get:
            tags: [Returns]
            summary: List returns (paginated)
            description: >-
                Staff (`read:Return`) see every return; anyone else sees the returns on their
                own orders. Filter by `orderId` to see one order's, which is how an order page
                shows what has happened to a withdrawal.
            operationId: listReturns
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/PageSizeParam'
                - name: orderId
                  in: query
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                - name: status
                  in: query
                  schema:
                      $ref: '#/components/schemas/ReturnStatus'
                - name: reason
                  in: query
                  schema:
                      $ref: '#/components/schemas/ReturnReason'
            responses:
                '200':
                    description: A page of returns
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReturnsResponseEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }
        post:
            tags: [Returns]
            summary: Open a return, or withdraw from the contract
            description: >-
                The customer's one door for sending goods back — and the EU "withdraw from
                contract here" button (Consumer Rights Directive Art. 11a): a withdrawal is a
                return with `reason: withdrawal`, not a separate endpoint.

                Always answers a `Return` (201, with `Location`); where the goods are decides what
                it is. Once they have shipped, a withdrawal is born `approved` and any other reason
                waits for staff. Before dispatch there is nothing to send back, so a withdrawal
                cancels the order — refunded in full, stock released — and the `Return` is born
                `closed`: `reason: withdrawal`, no `lines`, `refundAmount` what the order cost (zero
                when nothing was paid). Either way the customer gets an acknowledgement email
                carrying the exact date and time, and `Return.orderId` is where the client reloads
                the order from. `Order.actions.withdraw` says whether the button is offered; the
                client never counts the days.

                `kind: cancellation` cancels what has not shipped yet — the remainder of ONE fulfillment
                order (`fulfillmentOrderId`) once something has shipped from the order. It is born
                `closed`, its `lines` are the remainder, and the refund of those lines follows (plus
                the delivery when it takes the last unit of the order). The buyer uses it as part of
                their withdrawal, and names `reason: withdrawal`; staff may use it too (out of stock
                for good), name any other reason, and need `create:Refund` — the refund key,
                `stepUp: critical`. Staff naming `withdrawal` on someone else's order are refused
                (`RETURN_CANCELLATION_INVALID`): that reason is the buyer's right, and writing it for
                them would falsify a legal record. A staff cancellation asks a fresh session; the
                buyer's own withdrawal never does. `GET /returns/options` says what each door would
                take and refund, and whether this caller may use it (`cancel`).

                A return answers for goods that left (`kind: return`, the default); only the order's
                own buyer opens one, an operator included. Sending `Idempotency-Key` makes a retry safe.
            operationId: createReturn
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateReturnRequest'
            responses:
                '201':
                    description: The return, opened — or, for a withdrawal before dispatch, closed at birth with the order cancelled and refunded
                    headers:
                        Location: { $ref: '../../../shared/contracts/openapi.root.yaml#/components/headers/Location' }
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReturnEnvelope'
                # Also `REAUTH_REQUIRED`: a staff `cancellation` from a session past the critical window.
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                # A staff `cancellation` by a caller without the refund key (`create:Refund`).
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                # Not the caller's order, or no such order.
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `RETURN_ORDER_NOT_RETURNABLE`, `RETURN_WINDOW_CLOSED`, `RETURN_NOTHING_TO_CANCEL` — or
                # `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                # `RETURN_LINES_INVALID`, `RETURN_CANCELLATION_INVALID`, or a malformed body.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '429': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/TooManyRequests' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /returns/options:
        get:
            tags: [Returns]
            summary: What an order can still send back or cancel
            description: >-
                The server's answer to "what can I still return, and what can I still cancel?" for one
                order, so no client counts. `returnable` is the quantity per product that has SHIPPED
                and has not already been returned, offered to the buyer only and only while a
                deadline in `reasons` is open: staff get an empty list (cancelling is theirs, returning
                is the buyer's right), and so does a buyer past every deadline. `cancellable` lists each fulfillment order that
                still has a remainder, with the exact refund cancelling it would owe (the delivery
                included when it takes the last unit of the order). `cancellable` is empty while
                nothing has shipped — the whole order is cancelled instead (`Order.actions.cancel`).
                The caller must own the order, or hold `read:Return`.
            operationId: getReturnOptions
            security:
                - bearerAuth: []
            parameters:
                - name: orderId
                  in: query
                  required: true
                  schema:
                      $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
            responses:
                '200':
                    description: What the order can still return and cancel
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReturnOptionsEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /returns/{id}:
        get:
            tags: [Returns]
            summary: Get a return
            description: >-
                One return with the caller's `actions`. A return on someone else's order answers
                404, the same as one that does not exist.
            operationId: getReturnById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The return
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReturnEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /returns/{id}/approve:
        post:
            tags: [Returns]
            summary: Approve a return request
            description: >-
                Staff accept a `requested` return; the customer is told they may send the goods
                back. The write is conditional on the return still being `requested`, so two staff
                members deciding at once cannot both win — the second answers 409.
            operationId: approveReturn
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The return, `approved`
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReturnEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `RETURN_NOT_DECIDABLE`
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /returns/{id}/decline:
        post:
            tags: [Returns]
            summary: Decline a return request
            description: >-
                Staff refuse a `requested` return, saying why — the customer is mailed the reason.
                Same conditional write as `approve`.
            operationId: declineReturn
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeclineReturnRequest'
            responses:
                '200':
                    description: The return, `declined`
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReturnEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

    /returns/{id}/receive:
        post:
            tags: [Returns]
            summary: Record that the returned goods arrived
            description: >-
                The warehouse (or a manager) says the goods are back: the units go on sale again,
                the customer is owed the money for them, and the return finishes. Requires an
                `approved` return — a withdrawal is born approved, anything else was approved by
                staff first. The status move and the restock are one transaction, so a return is
                never half-received; the move is conditional, so a second click answers 409.

                What is refunded: the returned lines, plus the delivery paid when the return
                carries every unit on the order (a withdrawal gets back up to the cheapest standard
                delivery on offer; faulty or wrong goods get all of it), less an optional
                `handlingDeduction` for damage the customer caused (Art. 14(2)). The amount is fixed
                when the goods are received and shown as `refundAmount`. If the payment provider
                refuses, the return stays `received` and the refund is retried by the payment sweep;
                the return closes when it lands. Sends `Idempotency-Key`-safe retries. Requires a
                session that has re-proved itself within the last few minutes — a valid-but-stale
                token answers 401 with `errors[].code` `REAUTH_REQUIRED`.
            operationId: receiveReturn
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdempotencyKeyHeader'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReceiveReturnRequest'
            responses:
                '200':
                    description: The return — `closed` once the money went back, `received` while a refused refund waits for the sweep
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReturnEnvelope'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
                # `RETURN_NOT_RECEIVABLE` — or `Idempotency-Key` names a request still in flight.
                '409': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Conflict' }
                # `RETURN_DEDUCTION_INVALID`, or a malformed body.
                '422': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/ValidationError' }
                '500': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/InternalError' }

components:
    schemas:
        ReturnStatus:
            type: string
            enum: [requested, approved, declined, received, closed]
            description: >-
                Where a return stands: `requested → approved → received → closed`, or `requested →
                declined`. A withdrawal is born `approved` — or `closed`, when it reached the order
                before dispatch. Which move may follow which is the
                server's rule, answered per caller by `Return.actions`.

        ReturnReason:
            type: string
            enum: [withdrawal, defective, wrong_item, other]
            description: >-
                Why the goods come back. `withdrawal` is the EU right of withdrawal — the same object
                a faulty-goods return uses, with a legal deadline and an acknowledgement attached.

        ReturnKind:
            type: string
            enum: [return, cancellation]
            description: >-
                What the record is: `return` — goods that left coming back; `cancellation` — the
                unshipped remainder of one fulfillment order, cancelled and refunded, closed when
                made.

        ReturnLine:
            type: object
            additionalProperties: false
            required: [productId, quantity, title, unitPrice]
            description: One line of a return — a snapshot of what is coming back, so it reads the same later.
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                quantity:
                    type: integer
                    minimum: 1
                title:
                    type: string
                    description: The product's title as the order froze it.
                unitPrice:
                    type: number
                    format: double
                    minimum: 0
                    description: The gross unit price the order froze.

        ReturnActions:
            type: object
            additionalProperties: false
            required: [approve, decline, receive]
            description: >-
                What the requesting caller may do to this return, decided by the server, so a client
                renders its controls from this rather than re-implementing the lifecycle. Each needs
                the key that names the act and a status the act can run from.
            properties:
                approve:
                    type: boolean
                    description: Whether `POST /returns/{id}/approve` would be accepted.
                decline:
                    type: boolean
                    description: Whether `POST /returns/{id}/decline` would be accepted.
                receive:
                    type: boolean
                    description: Whether `POST /returns/{id}/receive` would be accepted.

        Return:
            type: object
            additionalProperties: false
            required: [id, orderId, orderNumber, currency, status, reason, kind, lines, returnPostage, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderNumber:
                    type: string
                    description: The order's human number.
                currency:
                    type: string
                    description: ISO-4217 code of the order's own currency.
                status:
                    $ref: '#/components/schemas/ReturnStatus'
                reason:
                    $ref: '#/components/schemas/ReturnReason'
                kind:
                    $ref: '#/components/schemas/ReturnKind'
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                note:
                    type: string
                    maxLength: 1000
                    description: What the customer wrote. Free text.
                lines:
                    type: array
                    description: What is coming back — or, for a `cancellation`, the remainder that was cancelled. Empty on a withdrawal before dispatch — no goods are expected.
                    items:
                        $ref: '#/components/schemas/ReturnLine'
                returnPostage:
                    description: >-
                        Who pays to send the goods back — frozen when the return was opened, from the
                        shop's configuration, so it is what the customer was told beforehand (Art.
                        14(1)).
                    $ref: '../shop/openapi.yaml#/components/schemas/ReturnPostagePayer'
                declineReason:
                    type: string
                    description: Why staff declined. Present only on a `declined` return.
                decidedAt:
                    type: string
                    format: date-time
                    description: When staff decided it — or, for a withdrawal, when it was opened already approved.
                receivedAt:
                    type: string
                    format: date-time
                    description: When the goods arrived and went back on sale.
                handlingDeduction:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        An amount kept back from the refund for handling damage (Art. 14(2)),
                        entered when the goods were received. Absent when nothing was kept.
                refundAmount:
                    type: number
                    format: double
                    minimum: 0
                    description: What the customer is owed for this return, fixed when the goods were received.
                closedAt:
                    type: string
                    format: date-time
                    description: When the money went back and the return finished.
                # Computed per CALLER, not stored — present on every response carrying ONE return.
                actions:
                    $ref: '#/components/schemas/ReturnActions'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        CreateReturnRequest:
            type: object
            additionalProperties: false
            required: [orderId, reason]
            properties:
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                reason:
                    $ref: '#/components/schemas/ReturnReason'
                note:
                    type: string
                    minLength: 1
                    maxLength: 1000
                kind:
                    $ref: '#/components/schemas/ReturnKind'
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                    description: Required exactly when `kind` is `cancellation` — the fulfillment order whose remainder is cancelled.
                lines:
                    type: array
                    minItems: 1
                    items:
                        type: object
                        additionalProperties: false
                        required: [productId, quantity]
                        properties:
                            productId:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                            quantity:
                                type: integer
                                minimum: 1
                    description: >-
                        What comes back. Absent means everything on the order that is still left to
                        return — the usual shape of a withdrawal. Not allowed on a `cancellation`: the
                        whole remainder is its lines.

        ReceiveReturnRequest:
            type: object
            additionalProperties: false
            properties:
                handlingDeduction:
                    type: number
                    format: double
                    minimum: 0
                    description: >-
                        Handling damage to keep back from the refund (Art. 14(2)), a decimal in the
                        return's currency. Absent means none. More than the refund is worth is refused.

        DeclineReturnRequest:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
                reason:
                    type: string
                    minLength: 1
                    maxLength: 500
                    description: What the customer is told. Required — a refusal nobody explains is not one.

        ReturnOptionLine:
            type: object
            additionalProperties: false
            required: [productId, title, quantity, withdrawable]
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                title:
                    type: string
                quantity:
                    type: integer
                    minimum: 1
                withdrawable:
                    type: boolean
                    description: >-
                        Whether the right of withdrawal reaches this line. False for goods Art. 16
                        excludes (made to order, perishable): only `defective` or `wrong_item` may
                        name them, and a request that names them with another reason is a 422.

        CancelOptionLine:
            type: object
            additionalProperties: false
            required: [productId, title, quantity]
            description: 'A line of the remainder a cancel would take, which is what has not shipped, per product.'
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                title:
                    type: string
                quantity:
                    type: integer
                    minimum: 1

        CancellableFulfillmentOrder:
            type: object
            additionalProperties: false
            required: [fulfillmentOrderId, number, lines, refundAmount, shippingRefund, cancel]
            description: A fulfillment order with a remainder that can still be cancelled, and what cancelling it would refund.
            properties:
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                number:
                    type: integer
                    minimum: 1
                lines:
                    type: array
                    items:
                        $ref: '#/components/schemas/CancelOptionLine'
                refundAmount:
                    type: number
                    format: double
                    minimum: 0
                    description: What the cancel would refund, in `ReturnOptions.currency` — the lines plus `shippingRefund`.
                shippingRefund:
                    type: number
                    format: double
                    minimum: 0
                    description: The delivery inside `refundAmount` — non-zero only when this cancel takes the last unit of the order.
                cancel:
                    type: boolean
                    description: >-
                        Whether THIS caller may cancel this remainder, so a client offers only a door that
                        opens. The order's buyer: within the withdrawal window, and only when the remainder
                        holds no goods excluded from withdrawal (Art. 16). Anyone else: holding `create:Refund`.

        ReturnOptions:
            type: object
            additionalProperties: false
            required: [orderId, currency, returnable, cancellable]
            properties:
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                currency:
                    type: string
                    description: ISO-4217 code of the order's own currency.
                reasons:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReturnReason'
                    description: >-
                        The reasons THIS caller can still name, so a client offers no door that is shut.
                        Empty for staff (the right is the buyer's own) and once every deadline has
                        passed. `withdrawal` and `other` last for the withdrawal period; `defective`
                        and `wrong_item` for two years from delivery (the legal guarantee of
                        conformity), made-to-order goods included.
                returnable:
                    type: array
                    items:
                        $ref: '#/components/schemas/ReturnOptionLine'
                    description: >-
                        Per product, what has shipped and not yet been returned. Empty unless `reasons`
                        is not. Goods excluded from withdrawal (Art. 16) are listed only while a
                        `defective` or `wrong_item` reason is open, and carry `withdrawable: false`.
                cancellable:
                    type: array
                    items:
                        $ref: '#/components/schemas/CancellableFulfillmentOrder'

        ReturnOptionsEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/ReturnOptions'

        ReturnEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/Return'

        ReturnsResponse:
            type: object
            additionalProperties: false
            required: [items, meta]
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Return'
                meta:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/PaginationMeta'

        ReturnsResponseEnvelope:
            type: object
            additionalProperties: false
            required: [success, status, message, data]
            properties:
                success:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeSuccess'
                status:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeStatus'
                message:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/EnvelopeMessage'
                data:
                    $ref: '#/components/schemas/ReturnsResponse'

        # Used by `POST /account/export` (`shared/contracts/openapi.root.yaml`) — what the customer
        # wrote, what staff wrote back (`declineReason`, the customer's own data under Art. 15) and
        # where it stands. The deciding staff member and the frozen unit prices are left out: an
        # export answers "what did I ask for and what was I told", not the shop's working records.
        ExportReturn:
            type: object
            additionalProperties: false
            required: [id, orderId, status, reason, lines]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                status:
                    $ref: '#/components/schemas/ReturnStatus'
                reason:
                    $ref: '#/components/schemas/ReturnReason'
                note:
                    type: string
                declineReason:
                    type: string
                lines:
                    type: array
                    items:
                        type: object
                        additionalProperties: false
                        required: [productId, quantity, title]
                        properties:
                            productId:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                            quantity:
                                type: integer
                                minimum: 1
                            title:
                                type: string
                createdAt:
                    type: string
                    format: date-time
