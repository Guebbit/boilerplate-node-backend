summary: 'Frozen invoice and credit-note documents, issued from payment and refund events.'
subdomain: supporting
group: shop
dependsOn:
    - orders # the VAT breakdown, the seller's jurisdiction, and an auth-scoped order read
    - payments # PAYMENT_REFUNDED — the fact a credit note is issued from
    - shop # the seller block frozen on every document, and the zone its numbers are counted in
rateLimits:
    invoicingRender:
        name: Invoice / credit-note renders
        namespace: invoicing-render
        environmentVariable: NODE_INVOICING_RATE_LIMIT_MAX
        defaultMax: 20
        windowMs: shared
        bounds: Renders against `GET /orders/{id}/invoice` and `GET
            /orders/{id}/credit-notes/{creditNoteId}`, keyed on the ACCOUNT — every hit spawns a
            Chromium launch, so an address-keyed budget would let one signed-in account behind a
            shared address starve every other caller on it.
        audited: true
jobs:
    reapInvoicePdfs:
        name: reap:invoice-pdfs
        schedule: 8 2 * * *
        summary: Deletes stored invoice and credit-note PDFs past their retention window; the next
            download renders again.
    reapInvoices:
        name: reap:invoices
        schedule: 14 2 * * *
        summary: Blanks an invoice's or credit note's buyer block once its tax retention has ended;
            the numbered document stays and its cached PDF is deleted.
