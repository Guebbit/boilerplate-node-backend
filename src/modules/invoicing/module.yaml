summary: 'Frozen invoice and credit-note documents, issued from payment and refund events.'
subdomain: supporting
group: shop
dependsOn:
    - orders # the VAT breakdown, the seller's jurisdiction, and an auth-scoped order read
    - payments # PAYMENT_REFUNDED — the fact a credit note is issued from
frontend:
    counterparts: [orders]
    why: "It has no screen of its own: `GET /orders/{id}/invoice` and `/credit-notes` are two buttons on the frontend's own Order.vue, gated on the order's `actions.invoice` flag."
