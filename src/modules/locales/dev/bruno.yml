  - info:
      name: Locales
      type: folder
      seq: 2
    request:
      auth: inherit
    items:
      - info:
          name: Supported languages
          type: http
          seq: 1
          tags:
            - System
        http:
          method: GET
          url: "{{baseUrl}}/locales"
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        examples:
          - name: 200 Response
            description: Locale capabilities
            request:
              url: "{{baseUrl}}/locales"
              method: GET
            response:
              status: 200
              statusText: OK
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "success": true,
                    "status": 200,
                    "message": "Locale capabilities",
                    "data": {
                      "locales": [
                        "it"
                      ],
                      "default": "it",
                      "fallback": "it"
                    }
                  }
          - name: 500 Response
            description: Internal server error
            request:
              url: "{{baseUrl}}/locales"
              method: GET
            response:
              status: 500
              statusText: Internal Server Error
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "success": false,
                    "status": 500,
                    "message": "Internal server error",
                    "errors": [
                      {
                        "code": "VALIDATION_ERROR",
                        "message": "Field \"email\" is required",
                        "details": "string"
                      }
                    ]
                  }
      - info:
          name: API message dictionary
          type: http
          seq: 2
          tags:
            - System
        http:
          method: GET
          url: "{{baseUrl}}/locales/en"
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        examples:
          - name: 200 Response
            description: Dictionary for the requested locale
            request:
              url: "{{baseUrl}}/locales/en"
              method: GET
            response:
              status: 200
              statusText: OK
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "success": true,
                    "status": 200,
                    "message": "Dictionary for the requested locale",
                    "data": {
                      "locale": "it",
                      "messages": "string"
                    }
                  }
          - name: 404 Response
            description: Resource not found
            request:
              url: "{{baseUrl}}/locales/en"
              method: GET
            response:
              status: 404
              statusText: Not Found
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "success": false,
                    "status": 404,
                    "message": "Resource not found",
                    "errors": [
                      {
                        "code": "VALIDATION_ERROR",
                        "message": "Field \"email\" is required",
                        "details": "string"
                      }
                    ]
                  }
          - name: 500 Response
            description: Internal server error
            request:
              url: "{{baseUrl}}/locales/en"
              method: GET
            response:
              status: 500
              statusText: Internal Server Error
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "success": false,
                    "status": 500,
                    "message": "Internal server error",
                    "errors": [
                      {
                        "code": "VALIDATION_ERROR",
                        "message": "Field \"email\" is required",
                        "details": "string"
                      }
                    ]
                  }
