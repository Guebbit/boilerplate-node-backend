rules:
    # -- locales -------------------------------------------------------------------------------
    - action: read
      subject: Locale
      module: locales
      scope: tenant
      description: Read active locales and their dictionaries — the storefront's own view.
      conditions:
          active: true
    - action: display
      subject: Locale
      module: locales
      scope: tenant
      description: Read every locale regardless of publish state — what staff need to see a draft language.
    - action: create
      subject: Locale
      module: locales
      scope: tenant
      description: Add a locale.
    - action: update
      subject: Locale
      module: locales
      scope: tenant
      description: Change a locale or one of its entries.
    - action: delete
      subject: Locale
      module: locales
      scope: tenant
      description: Remove a locale or one of its entries.

sets:
    - name: LocaleStorefront
      module: locales
      description: Active locales and their dictionaries.
      rules:
          - read:Locale
    - name: LocaleDisplay
      module: locales
      description: Every locale, drafts included.
      rules:
          - display:Locale
    - name: LocaleManagement
      module: locales
      description: Add, change and remove locales and their entries.
      rules:
          - create:Locale
          - update:Locale
          - delete:Locale
