openapi: 3.1.0
info:
    title: zammad — module contract
    version: '0.1.0'

# This module's section of the account data export (`POST /account/export`): the bundler adds it
# to `AccountExportResponse`. Removing the module removes the section. It serves no route.
x-personal-data:
    zammad:
        required: true
        schema:
            type: object
            description: >
                What the help-desk hand-over holds about this person: the contact messages still
                waiting to be sent to Zammad, and the Zammad customer their account is linked to.
                Always present; the list is empty and `customerId` absent when there is nothing.
            required: [pendingContacts]
            properties:
                pendingContacts:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExportZammadPendingContact'
                customerId:
                    type: integer
                    description: The Zammad customer id the account is linked to. Absent when no ticket ever linked it.

paths: {}

components:
    schemas:
        ExportZammadPendingContact:
            type: object
            description: A contact message not yet handed to Zammad.
            required: [id, email, subject, message]
            properties:
                id:
                    type: string
                name:
                    type: string
                email:
                    type: string
                subject:
                    type: string
                message:
                    type: string
                category:
                    type: string
                orderNumber:
                    type: string
                createdAt:
                    type: string
                    format: date-time
