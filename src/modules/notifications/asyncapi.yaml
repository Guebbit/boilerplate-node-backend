# The notifications module’s async contract — the per-user SSE stream it serves.
#
# A complete AsyncAPI document, for the same reason `./openapi.yaml` beside it is a complete
# OpenAPI one: it can be linted (`npm run lint:asyncapi:modules`) and read on its own. The bundler
# merges its channels, operations and components into the contracts at the repo root.
#
# This module owns these channels because it serves `/notifications/stream`. The stream is per
# user: a frame reaches only the connections of the user it is about. It declares its own server
# (`sseNotificationsLocal`) rather than sharing the observability module's: the bundler gives a
# server to exactly one section, and a document with no server does not lint on its own.
asyncapi: 3.0.0
info:
    title: Notifications async contract
    version: 0.1.0
    description: Server-sent events for a user's notification inbox.
servers:
    sseNotificationsLocal:
        host: localhost:3000
        protocol: http
        description: Local HTTP server for SSE (`/notifications/stream`).
channels:
    notifications.created:
        address: notifications.created
        servers:
            - $ref: '#/servers/sseNotificationsLocal'
        description: A notification was written for the connected user.
        # `scripts/contracts/generate-asyncapi-types.ts` reads this to pick the SSE channels.
        x-transport: sse
        messages:
            NotificationCreatedEvent:
                $ref: '#/components/messages/NotificationCreatedEvent'
    notifications.deleted:
        address: notifications.deleted
        servers:
            - $ref: '#/servers/sseNotificationsLocal'
        description: One or more notifications of the connected user are gone.
        x-transport: sse
        messages:
            NotificationsDeletedEvent:
                $ref: '#/components/messages/NotificationsDeletedEvent'
    notifications.read:
        address: notifications.read
        servers:
            - $ref: '#/servers/sseNotificationsLocal'
        description: The connected user's notifications were marked read.
        x-transport: sse
        messages:
            NotificationsReadEvent:
                $ref: '#/components/messages/NotificationsReadEvent'
operations:
    sseNotificationCreated:
        action: send
        channel:
            $ref: '#/channels/notifications.created'
        description: >-
            Pushed when a notification is written for the user, with the whole notification, so a
            client adds it without a refetch. A message trimmed off the end by the per-user cap
            arrives as a `notifications.deleted` frame right after.
        messages:
            - $ref: '#/channels/notifications.created/messages/NotificationCreatedEvent'
    sseNotificationsDeleted:
        action: send
        channel:
            $ref: '#/channels/notifications.deleted'
        description: >-
            Pushed when the user deletes one (`DELETE /notifications/{id}`), empties the inbox
            (`DELETE /notifications`), or the cap trims the oldest, so a second tab stays in step with the
            first. `all` is true when the whole inbox went. A filtered delete
            (`DELETE /notifications?audience=`) sends `all: false` and the ids that left; it also
            removes staff rows the caller no longer sees, so a frame may name ids the tab never held.
        messages:
            - $ref: '#/channels/notifications.deleted/messages/NotificationsDeletedEvent'
    sseNotificationsRead:
        action: send
        channel:
            $ref: '#/channels/notifications.read'
        description: >-
            Pushed when `POST /notifications/read-all` runs, so the badge clears in every open tab.
        messages:
            - $ref: '#/channels/notifications.read/messages/NotificationsReadEvent'
components:
    messages:
        NotificationCreatedEvent:
            name: NotificationCreatedEvent
            title: A notification was written
            payload:
                $ref: '#/components/schemas/NotificationCreatedPayload'
        NotificationsDeletedEvent:
            name: NotificationsDeletedEvent
            title: Notifications were deleted
            payload:
                $ref: '#/components/schemas/NotificationsDeletedPayload'
        NotificationsReadEvent:
            name: NotificationsReadEvent
            title: Notifications were marked read
            payload:
                $ref: '#/components/schemas/NotificationsReadPayload'
    schemas:
        # Mirrors `Notification` in `./openapi.yaml`, variant for variant. Repeated rather than
        # referenced: an AsyncAPI document is validated and generated on its own, and the two are
        # held together by the producer being typed against both. Members are listed before the
        # union that names them, because the generated Zod schemas are `const`s. A module that adds
        # notices appends its payloads with an `x-extends` fragment.
        WebhookDisabledParamsPayload:
            title: WebhookDisabledParamsPayload
            type: object
            required:
                - subscriptionId
            properties:
                subscriptionId:
                    type: string
            additionalProperties: false
        NotificationStaffWebhookDisabledPayload:
            title: NotificationStaffWebhookDisabledPayload
            type: object
            required:
                - id
                - audience
                - code
                - params
                - severity
                - createdAt
            properties:
                id:
                    type: string
                audience:
                    description: Whose message it is — `own`, or a `staff` work notice.
                    type: string
                    enum:
                        - own
                        - staff
                code:
                    type: string
                    enum:
                        - notifications.staff.webhook-disabled
                params:
                    $ref: '#/components/schemas/WebhookDisabledParamsPayload'
                severity:
                    type: string
                    enum:
                        - info
                        - success
                        - warning
                        - error
                readAt:
                    description: When the owner read it; absent while unread.
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
            additionalProperties: false
        TaskOpenedParamsPayload:
            title: TaskOpenedParamsPayload
            type: object
            required:
                - taskId
                - kind
            properties:
                taskId:
                    type: string
                kind:
                    type: string
                category:
                    type: string
                work:
                    description: The staff screen that does the work, when the opener named one; absent means the to-do's own page.
                    type: string
            additionalProperties: false
        TaskAssignedParamsPayload:
            title: TaskAssignedParamsPayload
            type: object
            required:
                - taskId
                - kind
            properties:
                taskId:
                    type: string
                kind:
                    type: string
            additionalProperties: false
        NotificationStaffTaskOpenedPayload:
            title: NotificationStaffTaskOpenedPayload
            type: object
            required:
                - id
                - audience
                - code
                - params
                - severity
                - createdAt
            properties:
                id:
                    type: string
                audience:
                    description: Whose message it is — `own`, or a `staff` work notice.
                    type: string
                    enum:
                        - own
                        - staff
                code:
                    type: string
                    enum:
                        - notifications.staff.task-opened
                params:
                    $ref: '#/components/schemas/TaskOpenedParamsPayload'
                severity:
                    type: string
                    enum:
                        - info
                        - success
                        - warning
                        - error
                readAt:
                    description: When the owner read it; absent while unread.
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
            additionalProperties: false
        NotificationStaffTaskOverduePayload:
            title: NotificationStaffTaskOverduePayload
            type: object
            required:
                - id
                - audience
                - code
                - params
                - severity
                - createdAt
            properties:
                id:
                    type: string
                audience:
                    description: Whose message it is — `own`, or a `staff` work notice.
                    type: string
                    enum:
                        - own
                        - staff
                code:
                    type: string
                    enum:
                        - notifications.staff.task-overdue
                params:
                    $ref: '#/components/schemas/TaskOpenedParamsPayload'
                severity:
                    type: string
                    enum:
                        - info
                        - success
                        - warning
                        - error
                readAt:
                    description: When the owner read it; absent while unread.
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
            additionalProperties: false
        NotificationStaffTaskAssignedPayload:
            title: NotificationStaffTaskAssignedPayload
            type: object
            required:
                - id
                - audience
                - code
                - params
                - severity
                - createdAt
            properties:
                id:
                    type: string
                audience:
                    description: Whose message it is — `own`, or a `staff` work notice.
                    type: string
                    enum:
                        - own
                        - staff
                code:
                    type: string
                    enum:
                        - notifications.staff.task-assigned
                params:
                    $ref: '#/components/schemas/TaskAssignedParamsPayload'
                severity:
                    type: string
                    enum:
                        - info
                        - success
                        - warning
                        - error
                readAt:
                    description: When the owner read it; absent while unread.
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
            additionalProperties: false
        OutboxDeadParamsPayload:
            title: OutboxDeadParamsPayload
            type: object
            required:
                - eventName
                - aggregateId
            properties:
                eventName:
                    type: string
                aggregateId:
                    type: string
            additionalProperties: false
        NotificationStaffOutboxDeadPayload:
            title: NotificationStaffOutboxDeadPayload
            type: object
            required:
                - id
                - audience
                - code
                - params
                - severity
                - createdAt
            properties:
                id:
                    type: string
                audience:
                    description: Whose message it is — `own`, or a `staff` work notice.
                    type: string
                    enum:
                        - own
                        - staff
                code:
                    type: string
                    enum:
                        - notifications.staff.outbox-dead
                params:
                    $ref: '#/components/schemas/OutboxDeadParamsPayload'
                severity:
                    type: string
                    enum:
                        - info
                        - success
                        - warning
                        - error
                readAt:
                    description: When the owner read it; absent while unread.
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
            additionalProperties: false
        NotificationPayload:
            title: NotificationPayload
            oneOf:
                - $ref: '#/components/schemas/NotificationStaffWebhookDisabledPayload'
                - $ref: '#/components/schemas/NotificationStaffTaskOpenedPayload'
                - $ref: '#/components/schemas/NotificationStaffTaskOverduePayload'
                - $ref: '#/components/schemas/NotificationStaffTaskAssignedPayload'
                - $ref: '#/components/schemas/NotificationStaffOutboxDeadPayload'
            # A plain property name here, unlike OpenAPI's `{ propertyName }` object.
            discriminator: code
        NotificationCreatedPayload:
            title: NotificationCreatedPayload
            type: object
            required:
                - notification
            properties:
                notification:
                    $ref: '#/components/schemas/NotificationPayload'
            additionalProperties: false
        NotificationsDeletedPayload:
            title: NotificationsDeletedPayload
            type: object
            required:
                - all
                - ids
            properties:
                all:
                    description: True when the whole inbox went (`DELETE /notifications`); `ids` is then empty.
                    type: boolean
                ids:
                    description: The deleted notifications' ids.
                    type: array
                    items:
                        type: string
            additionalProperties: false
        NotificationsReadPayload:
            title: NotificationsReadPayload
            type: object
            required:
                - readAt
            properties:
                readAt:
                    type: string
                    format: date-time
            additionalProperties: false
