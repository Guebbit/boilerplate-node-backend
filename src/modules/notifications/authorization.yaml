rules:
    # -- notifications -------------------------------------------------------------------------
    # Own rows only: an inbox is somebody's own, and no role reads or clears another person's. The
    # service filters every query by the caller's id, so there is no staff door to declare.
    # Held by every role that is a signed-in account — a staff member is a person with an inbox
    # too, even though staff own no basket.
    - action: read
      subject: Notification
      module: notifications
      scope: tenant
      description: Read the caller's own notifications, follow them live, and mark them read.
      conditions:
          userId: $caller.id
    - action: delete
      subject: Notification
      module: notifications
      scope: tenant
      description: Delete the caller's own notifications, one or all at once.
      conditions:
          userId: $caller.id

sets:
    - name: NotificationOwn
      module: notifications
      description: Read and clear one's own notifications.
      rules:
          - read:Notification
          - delete:Notification
