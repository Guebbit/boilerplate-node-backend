openapi: 3.1.0
info:
    title: notifications — module contract
    version: '0.1.0'

# The tags this module's operations file themselves under, with what each is for.
tags:
    - name: Notifications
      description: The signed-in user's in-app notifications, their own and the shop's work notices for staff.

# This module's section of the account data export (`POST /account/export`): the bundler
# adds it to `AccountExportResponse`. Removing the module removes the section.
x-personal-data:
    # Every notification in this account's inbox, read and unread. Empty, never absent.
    notifications:
        schema:
            type: array
            items:
                $ref: '#/components/schemas/Notification'
    # The work notices this account was sent as staff: when and which kind, never their `params`,
    # which name other people's orders and accounts.
    staffNotifications:
        schema:
            type: array
            items:
                $ref: '#/components/schemas/StaffNoticeExport'

paths:
    /notifications:
        get:
            tags: [Notifications]
            summary: List notifications
            description: >-
                The caller's own inbox, newest first, plus the work notices (`audience: staff`) of
                their shop whose permission sets they hold right now: a staff member who loses a role
                stops seeing the notices that role earned, and a member promoted later sees only
                those written after. A notification stays until its owner deletes it
                (`DELETE /notifications/{id}`, `DELETE /notifications`), the per-user cap
                trims it, or the account goes. Never paginated: the inbox is bounded by that cap, so
                one read is the whole of it. Empty and absent are the same state — this never
                answers 404. A client keeps the list live with `GET /notifications/stream`; the
                stream carries only what is written while it is open, so this read is what a login,
                a reload or a dropped connection starts from.
            operationId: listNotifications
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: The caller's notifications
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotificationsResponse'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
        delete:
            tags: [Notifications]
            summary: Delete every notification
            description: >-
                Permanently deletes every notification of the caller — a hard delete, like
                `DELETE /notifications/{id}`, on the collection itself (as `DELETE /account/sessions`
                and `DELETE /cart/items` are). Emptying an empty inbox is the state the caller asked
                for, so it answers 204 too. `POST /notifications/read-all` stays an action: it moves
                `readAt`, not membership.
            operationId: dismissAllNotifications
            security:
                - bearerAuth: []
            responses:
                '204': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NoContent' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }

    # Mounted above `/{id}` in the router: Express matches in mount order, so the literal
    # segments below must not be read as an id.
    /notifications/stream:
        get:
            tags: [Notifications]
            summary: Live notifications stream
            description: >-
                Server-Sent Events: a notification written, deleted or marked read for the caller
                reaches an open tab as it happens. The channels and their payloads are in
                `asyncapi.yaml` (`notifications.created`, `notifications.deleted`,
                `notifications.read`). Per process, like the observability stream: a message
                written by another worker process arrives at the next `GET /notifications` instead.
            operationId: getNotificationsStream
            security:
                - cookieAuth: []
            responses:
                '200':
                    description: Server-Sent Events stream
                    content:
                        text/event-stream:
                            schema:
                                type: string
                # An EventSource cannot set an Authorization header, so the HttpOnly refresh
                # cookie is the credential here — the same as `GET /observability/events`.
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }

    /notifications/read-all:
        post:
            tags: [Notifications]
            summary: Mark every notification read
            description: >-
                Sets `readAt` on every unread notification of the caller. The bell calls it when it
                opens, so the badge (unread count) goes to zero while the messages stay. Repeating
                it is a no-op.
            operationId: readAllNotifications
            security:
                - bearerAuth: []
            responses:
                '204': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NoContent' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }

    /notifications/{id}:
        get:
            tags: [Notifications]
            summary: Get a notification
            description: >-
                One of the caller's own notifications, the same shape the list carries (a work
                notice only while the caller still holds its permission sets). Someone
                else's, an unknown id and a malformed one are the same 404, so a probe cannot tell
                them apart.
            operationId: getNotificationById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '200':
                    description: The notification
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Notification'
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }
        delete:
            tags: [Notifications]
            summary: Delete a notification
            description: >-
                Permanently deletes the notification identified by `{id}`. Only the caller's own: an
                id that belongs to someone else answers the same 404 as one that does not exist, so
                a probe cannot tell the two apart.
            operationId: deleteNotificationById
            security:
                - bearerAuth: []
            parameters:
                - $ref: '../../../shared/contracts/openapi.root.yaml#/components/parameters/IdPathParam'
            responses:
                '204': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NoContent' }
                '401': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Unauthorized' }
                '403': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/Forbidden' }
                '404': { $ref: '../../../shared/contracts/openapi.root.yaml#/components/responses/NotFound' }

components:
    schemas:
        # ---------- notifications — the schemas only this module's paths reference. ----------
        # The backend stores a `code` and `params`, never text: the frontend translates it from
        # its own locale files, like every other API code. A `Notification` is one variant per
        # `code`, each with its own typed `params` (the `ReauthRequest` pattern in the account
        # module's contract), so a client switches on `code` and gets the right `params` shape.
        NotificationSeverity:
            type: string
            description: >-
                Meaning, not look — a client picks the colour. The four words most notification
                APIs share (Ant Design, Atlassian flags).
            enum: [info, success, warning, error]

        # Locale → the product's name in it. Copied into the notification because the product may
        # be gone by the time anyone reads it, so a reader sees their own language.
        ProductTitles:
            type: object
            additionalProperties:
                type: string

        CartLineRemovedParams:
            type: object
            additionalProperties: false
            required: [productId, titles]
            properties:
                productId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                titles:
                    $ref: '#/components/schemas/ProductTitles'

        CartMergeRefusedParams:
            type: object
            additionalProperties: false
            required: [lines]
            properties:
                lines:
                    type: array
                    description: The guest-cart lines `POST /cart/merge` could not add at all.
                    items:
                        type: object
                        additionalProperties: false
                        required: [productId, requested, titles]
                        properties:
                            productId:
                                $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                            requested:
                                type: integer
                                minimum: 1
                            titles:
                                $ref: '#/components/schemas/ProductTitles'

        FulfillmentDelayedParams:
            type: object
            additionalProperties: false
            required: [orderId, fulfillmentOrderId, titles, agreedAt]
            description: >-
                What the buyer needs to read a late-preorder notice: which order and fulfillment order,
                what is waiting, the date they were promised and the date now expected (absent when there
                is none).
            properties:
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                titles:
                    type: array
                    description: The waiting products' titles, as the order froze them.
                    items:
                        type: string
                agreedAt:
                    type: string
                    format: date-time
                expectedAt:
                    type: string
                    format: date-time

        ShipmentLostParams:
            type: object
            additionalProperties: false
            required: [orderId, shipmentId, reason]
            description: >-
                What the buyer needs to read a lost-parcel notice: which order and shipment, whether it
                was lost or damaged in transit, the sentence staff wrote for them if any, and the
                units the shelf could not cover again with the date they are now expected (absent
                when everything is being sent again from the shelf).
            properties:
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                shipmentId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                reason:
                    type: string
                    enum: [lost, damaged]
                message:
                    type: string
                    maxLength: 500
                owed:
                    type: array
                    description: The titles of the products still to be restocked, as the order froze them.
                    items:
                        type: string
                expectedAt:
                    type: string
                    format: date-time

        FulfillmentHeldParams:
            type: object
            additionalProperties: false
            required: [orderId, fulfillmentOrderId, notice]
            description: >-
                What the buyer needs to read a hold notice: which order and fulfillment order, whether
                the address needs a look (`check_address`) or the order is only `delayed`, and the
                sentence staff wrote for them, if any. Never staff's reason.
            properties:
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                fulfillmentOrderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                notice:
                    type: string
                    enum: [check_address, delayed]
                message:
                    type: string
                    maxLength: 500

        NotificationFulfillmentHeld:
            type: object
            additionalProperties: false
            description: Part of an order the caller bought is held back, and they can act (check the address) or have a message from the shop.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [notifications.fulfillment-held]
                params:
                    $ref: '#/components/schemas/FulfillmentHeldParams'
                severity:
                    $ref: '#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationShipmentLost:
            type: object
            additionalProperties: false
            description: A parcel the caller was waiting for was reported lost or damaged in transit; the shop sends it again or refunds.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [notifications.shipment-lost]
                params:
                    $ref: '#/components/schemas/ShipmentLostParams'
                severity:
                    $ref: '#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationStockAlert:
            type: object
            additionalProperties: false
            description: A product the caller asked to be told about can be ordered again. Sent once, then the request is gone.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [notifications.stock-alert]
                params:
                    $ref: '#/components/schemas/CartLineRemovedParams'
                severity:
                    $ref: '#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationFulfillmentDelayed:
            type: object
            additionalProperties: false
            description: A preorder the caller paid for will arrive later than promised; cancelling is open and silence keeps waiting.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [notifications.fulfillment-delayed]
                params:
                    $ref: '#/components/schemas/FulfillmentDelayedParams'
                severity:
                    $ref: '#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationCartLineRemoved:
            type: object
            additionalProperties: false
            description: A product left the catalogue and left the caller's cart with it.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [notifications.cart-line-removed]
                params:
                    $ref: '#/components/schemas/CartLineRemovedParams'
                severity:
                    $ref: '#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationWishlistItemRemoved:
            type: object
            additionalProperties: false
            description: A product left the catalogue and left the caller's wishlist with it.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [notifications.wishlist-item-removed]
                params:
                    $ref: '#/components/schemas/CartLineRemovedParams'
                severity:
                    $ref: '#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationCartMergeRefused:
            type: object
            additionalProperties: false
            description: Guest-cart lines `POST /cart/merge` could not add at all, because the product is no longer available.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [notifications.cart-merge-refused]
                params:
                    $ref: '#/components/schemas/CartMergeRefusedParams'
                severity:
                    $ref: '#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationAudience:
            type: string
            enum: [own, staff]
            description: >-
                Whose message this is. `own`: about the caller as a person or buyer. `staff`: a work
                notice sent because the caller's role does that work, not because it concerns them.

        PurchaseHoldPlacedParams:
            type: object
            additionalProperties: false
            required: [userId, until]
            description: >-
                The shop's rule paused a buyer's checkout. Ids and instants only: the account's own
                page has the rest.
            properties:
                userId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                until:
                    type: string
                    format: date-time
                    description: When the pause ends by itself.

        WebhookDisabledParams:
            type: object
            additionalProperties: false
            required: [subscriptionId]
            description: A webhook subscription was switched off after repeated delivery failures.
            properties:
                subscriptionId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        TicketOpenedParams:
            type: object
            additionalProperties: false
            required: [ticketId, kind]
            description: >-
                A ticket opened in the caller's jurisdiction. Ids and closed codes only: the ticket
                page has the rest, and no visitor text travels in a notice.
            properties:
                ticketId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                kind:
                    type: string
                    description: The ticket's kind (`contact`, `account_review`, ...).
                category:
                    type: string
                    description: A contact ticket's category, when the visitor chose one.

        TicketAssignedParams:
            type: object
            additionalProperties: false
            required: [ticketId, kind]
            description: A ticket was given to the caller by someone else.
            properties:
                ticketId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                kind:
                    type: string
                    description: The ticket's kind.

        NotificationStaffTicketOpened:
            type: object
            additionalProperties: false
            description: A ticket opened in a jurisdiction the caller works; whoever holds its permission set takes it.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [notifications.staff.ticket-opened]
                params:
                    $ref: '#/components/schemas/TicketOpenedParams'
                severity:
                    $ref: '#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationStaffTicketOverdue:
            type: object
            additionalProperties: false
            description: An open ticket in a jurisdiction the caller works passed its due date; said once per ticket.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [notifications.staff.ticket-overdue]
                params:
                    $ref: '#/components/schemas/TicketOpenedParams'
                severity:
                    $ref: '#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationStaffTicketAssigned:
            type: object
            additionalProperties: false
            description: A colleague gave the caller a ticket.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [notifications.staff.ticket-assigned]
                params:
                    $ref: '#/components/schemas/TicketAssignedParams'
                severity:
                    $ref: '#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationStaffPurchaseHoldPlaced:
            type: object
            additionalProperties: false
            description: A buyer's checkout was paused by the shop's cancellation rule; staff who can ban decide whether to step in.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [notifications.staff.purchase-hold-placed]
                params:
                    $ref: '#/components/schemas/PurchaseHoldPlacedParams'
                severity:
                    $ref: '#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationStaffWebhookDisabled:
            type: object
            additionalProperties: false
            description: A webhook subscription was switched off after repeated failures; staff who manage webhooks fix the endpoint and re-enable it.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [notifications.staff.webhook-disabled]
                params:
                    $ref: '#/components/schemas/WebhookDisabledParams'
                severity:
                    $ref: '#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        ReturnRequestedParams:
            type: object
            additionalProperties: false
            required: [returnId, orderId]
            description: A return request is waiting for a decision. Ids only, the return's page has the rest.
            properties:
                returnId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        OutboxDeadParams:
            type: object
            additionalProperties: false
            required: [eventName, aggregateId]
            description: A domain event parked as dead. The name and the record it was about, the payload stays in the outbox.
            properties:
                eventName:
                    type: string
                    description: The domain event's name (`order.paid`).
                aggregateId:
                    type: string
                    description: What the event was about (an order or account id).

        NotificationStaffReturnRequested:
            type: object
            additionalProperties: false
            description: A buyer asked to return goods; staff who decide returns take it.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [notifications.staff.return-requested]
                params:
                    $ref: '#/components/schemas/ReturnRequestedParams'
                severity:
                    $ref: '#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationStaffOutboxDead:
            type: object
            additionalProperties: false
            description: A domain event could not be delivered after every retry and was parked; administrators look at the record it names.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [notifications.staff.outbox-dead]
                params:
                    $ref: '#/components/schemas/OutboxDeadParams'
                severity:
                    $ref: '#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        WorkCountParams:
            type: object
            additionalProperties: false
            required: [count]
            description: A summary row of how many items need the reader today. The screen it points at lists them.
            properties:
                count:
                    type: integer
                    minimum: 1

        NotificationStaffTransfersDue:
            type: object
