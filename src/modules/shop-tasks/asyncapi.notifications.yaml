        NotificationStaffPurchaseHoldPlacedPayload:
            title: NotificationStaffPurchaseHoldPlacedPayload
            type: object
            required:
                - id
                - audience
                - code
                - params
                - severity
                - createdAt
            properties:
                id:
                    type: string
                audience:
                    description: Whose message it is — `own`, or a `staff` work notice.
                    type: string
                    enum:
                        - own
