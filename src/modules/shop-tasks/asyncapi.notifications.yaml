# The shop's additions to the notifications stream: the payload of every buyer message and staff
# work notice only a shop sends, mirroring `./openapi.notifications.yaml` variant for variant.
#
# A FRAGMENT, not a document: the bundler merges it into the `notifications` section only while
# this module exists, and `x-extends` appends each payload below to `NotificationPayload`
# (`scripts/contracts/asyncapi-webhook-events.ts`). Delete the module and the stream's union falls
# back to the five notices every project has.
x-extends:
    NotificationPayload:
        - NotificationStaffPurchaseHoldPlacedPayload
        - NotificationFulfillmentHeldPayload
        - NotificationShipmentLostPayload
        - NotificationStockAlertPayload
        - NotificationFulfillmentDelayedPayload
        - NotificationCartLineRemovedPayload
        - NotificationWishlistItemRemovedPayload
        - NotificationCartMergeRefusedPayload
        - NotificationStaffReturnRequestedPayload
        - NotificationStaffTransfersDuePayload
        - NotificationStaffPreordersLatePayload
        - NotificationStaffDeliveryHoldsOpenPayload
        - NotificationStaffWithdrawalsAwaitingGoodsPayload
        - NotificationStaffReturnsUndecidedPayload
        - NotificationStaffLowStockPayload
        - NotificationStaffUnshippedPayload
        - NotificationStaffAwaitingTrackingPayload
        - NotificationStaffUndeliveredPayload
        - NotificationStaffStaleRefundsPayload
components:
    schemas:
        # Mirrors the variants of `./openapi.notifications.yaml`. Repeated rather than referenced:
        # an AsyncAPI document is validated and generated on its own, and the two are held together
        # by the producer being typed against both. Members are listed before the union that names
        # them, because the generated Zod schemas are `const`s.
        CartLineRemovedParamsPayload:
            title: CartLineRemovedParamsPayload
            type: object
            required:
                - productId
                - titles
            properties:
                productId:
                    type: string
                titles:
                    description: Locale → the product's name in it.
                    type: object
                    additionalProperties:
                        type: string
            additionalProperties: false
        CartMergeRefusedLinePayload:
            title: CartMergeRefusedLinePayload
            type: object
            required:
                - productId
                - requested
                - titles
            properties:
                productId:
                    type: string
                requested:
                    type: integer
                    minimum: 1
                titles:
                    description: Locale → the product's name in it.
                    type: object
                    additionalProperties:
                        type: string
            additionalProperties: false
        CartMergeRefusedParamsPayload:
            title: CartMergeRefusedParamsPayload
            type: object
            required:
                - lines
            properties:
                lines:
                    type: array
                    items:
                        $ref: '#/components/schemas/CartMergeRefusedLinePayload'
            additionalProperties: false
        FulfillmentDelayedParamsPayload:
            title: FulfillmentDelayedParamsPayload
            type: object
            required:
                - orderId
                - fulfillmentOrderId
                - titles
                - agreedAt
            properties:
                orderId:
                    type: string
                fulfillmentOrderId:
                    type: string
                titles:
                    type: array
                    items:
                        type: string
                agreedAt:
                    type: string
                    format: date-time
                expectedAt:
                    type: string
                    format: date-time
            additionalProperties: false
        FulfillmentHeldParamsPayload:
            title: FulfillmentHeldParamsPayload
            type: object
            required:
                - orderId
                - fulfillmentOrderId
                - notice
            properties:
                orderId:
                    type: string
                fulfillmentOrderId:
                    type: string
                notice:
                    type: string
                    enum:
                        - check_address
                        - delayed
                message:
                    type: string
                    maxLength: 500
            additionalProperties: false
        ShipmentLostParamsPayload:
            title: ShipmentLostParamsPayload
            type: object
            required:
                - orderId
                - shipmentId
                - reason
            properties:
                orderId:
                    type: string
                shipmentId:
                    type: string
                reason:
                    type: string
