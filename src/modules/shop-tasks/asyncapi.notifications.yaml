                        - damaged
                message:
                    type: string
                    maxLength: 500
                owed:
                    type: array
                    items:
                        type: string
                expectedAt:
                    type: string
                    format: date-time
            additionalProperties: false
        PurchaseHoldPlacedParamsPayload:
            title: PurchaseHoldPlacedParamsPayload
