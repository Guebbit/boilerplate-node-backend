                createdAt:
                    type: string
                    format: date-time

        NotificationCartMergeRefused:
            type: object
            additionalProperties: false
            description: Guest-cart lines `POST /cart/merge` could not add at all, because the product is no longer available.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '../notifications/openapi.yaml#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [shop-tasks.cart-merge-refused]
                params:
                    $ref: '#/components/schemas/CartMergeRefusedParams'
                severity:
                    $ref: '../notifications/openapi.yaml#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        PurchaseHoldPlacedParams:
            type: object
            additionalProperties: false
            required: [userId, until]
            description: >-
                The shop's rule paused a buyer's checkout. Ids and instants only: the account's own
                page has the rest.
            properties:
                userId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                until:
                    type: string
                    format: date-time
                    description: When the pause ends by itself.

        NotificationStaffPurchaseHoldPlaced:
            type: object
            additionalProperties: false
            description: A buyer's checkout was paused by the shop's cancellation rule; staff who can ban decide whether to step in.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '../notifications/openapi.yaml#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [shop-tasks.staff.purchase-hold-placed]
                params:
                    $ref: '#/components/schemas/PurchaseHoldPlacedParams'
                severity:
                    $ref: '../notifications/openapi.yaml#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        ReturnRequestedParams:
            type: object
            additionalProperties: false
            required: [returnId, orderId]
            description: A return request is waiting for a decision. Ids only, the return's page has the rest.
            properties:
                returnId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                orderId:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'

        NotificationStaffReturnRequested:
            type: object
            additionalProperties: false
            description: A buyer asked to return goods; staff who decide returns take it.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '../notifications/openapi.yaml#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [shop-tasks.staff.return-requested]
                params:
                    $ref: '#/components/schemas/ReturnRequestedParams'
                severity:
                    $ref: '../notifications/openapi.yaml#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        WorkCountParams:
            type: object
            additionalProperties: false
            required: [count]
            description: A summary row of how many items need the reader today. The screen it points at lists them.
            properties:
                count:
                    type: integer
                    minimum: 1

        NotificationStaffTransfersDue:
            type: object
            additionalProperties: false
            description: Bank transfers still unpaid whose pay-by date is near.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '../notifications/openapi.yaml#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [shop-tasks.staff.transfers-due]
                params:
                    $ref: '#/components/schemas/WorkCountParams'
                severity:
                    $ref: '../notifications/openapi.yaml#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationStaffPreordersLate:
            type: object
            additionalProperties: false
            description: Preorders and backorders past their expected date with units still owed.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '../notifications/openapi.yaml#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [shop-tasks.staff.preorders-late]
                params:
                    $ref: '#/components/schemas/WorkCountParams'
                severity:
                    $ref: '../notifications/openapi.yaml#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationStaffDeliveryHoldsOpen:
            type: object
            additionalProperties: false
            description: Fulfillment orders held for a reason other than waiting for stock, for longer than the shop allows.
            required: [id, audience, code, params, severity, createdAt]
