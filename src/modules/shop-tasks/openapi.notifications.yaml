        NotificationStaffReturnsUndecided:
            type: object
            additionalProperties: false
            description: Return requests still awaiting a decision after the shop reminder time.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '../notifications/openapi.yaml#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [shop-tasks.staff.returns-undecided]
                params:
                    $ref: '#/components/schemas/WorkCountParams'
                severity:
                    $ref: '../notifications/openapi.yaml#/components/schemas/NotificationSeverity'
                readAt:
