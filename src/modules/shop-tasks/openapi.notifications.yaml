                readAt:
                    type: string
                    format: date-time
                    description: When the owner opened the bell past it; absent while unread. The badge counts the ones without it.
                createdAt:
                    type: string
                    format: date-time

        NotificationStaffUnshipped:
            type: object
            additionalProperties: false
            description: Paid orders not handed to a carrier for longer than the shop allows.
            required: [id, audience, code, params, severity, createdAt]
            properties:
                id:
                    $ref: '../../../shared/contracts/openapi.root.yaml#/components/schemas/Id'
                audience:
                    $ref: '../notifications/openapi.yaml#/components/schemas/NotificationAudience'
                code:
                    type: string
                    enum: [shop-tasks.staff.unshipped]
                params:
                    $ref: '#/components/schemas/WorkCountParams'
                severity:
                    $ref: '../notifications/openapi.yaml#/components/schemas/NotificationSeverity'
                readAt:
                    type: string
                    format: date-time
