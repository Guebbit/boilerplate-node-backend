rules:
    # -- roles ---------------------------------------------------------------------------------
    # The one permission that protects PEOPLE. Whoever holds it may hand a staff role to an account
    # or take it away, and may edit, ban or erase an account that already holds one. Everyone else
    # with a users rule changes customers only, so a moderator who may erase accounts cannot erase
    # the administrator's. A role is a bundle of permission sets and nothing else: there is no level to rank.
    - action: assign
      subject: Role
      module: access
      scope: tenant
      credential: false
      description: Hand a staff role to an account or take it away, and change an account that holds one — edit, ban, erase. Held by administrators.
      # Changing a person's powers is the one admin act a stolen session must not do quietly: the
      # role door asks a fresh login at the tier minting an API key does.
      stepUp: critical
      # A caller without it is told what is missing (`ROLE_MANAGEMENT_REQUIRED`), the answer every
      # other refusal on a staff account already gives, not a bare `FORBIDDEN`.
      deniedCode: ROLE_MANAGEMENT_REQUIRED

sets:
    - name: RoleManagement
      module: access
      description: Hand a staff role out or take it away, and change an account that holds one.
      rules:
          - assign:Role
