# Traefik overlay for MANY client stacks on one host — layer with a second `-f`:
#
#   docker compose --env-file "clients/acme/.env" \
#       -f docker-compose.production.yml -f docker-compose.proxy.yml up -d
#
# Routing only: this overlay defines no database, no volume and no seeding, and changes nothing
# about which data the stack it is layered onto holds.
#
# The base file is unchanged for anyone who does not want this: it still publishes the API on
# loopback and says "put any TLS-terminating proxy in front" — this overlay is one way to do that
# when the proxy itself is ALSO shared across several client stacks on the same box. A single-stack
# deployment behind a standalone nginx/Caddy/managed load balancer needs no overlay at all.
#
# `traefik` is started once per HOST, not once per client — bring it up from whichever client's
# compose invocation happens to run first; every later `up` against a different
# `COMPOSE_PROJECT_NAME` just adds that client's `app` to the shared `proxy` network.
#
# ── BEFORE THE FIRST DEPLOY ──────────────────────────────────────────────────────────────────────
# Create the shared network once, on the host, outside any single client's project:
#   docker network create proxy
#
# Add to the client's own `.env` (see `.env-example`'s production block):
#   NODE_PROXY_ACME_EMAIL=ops@example.com
#
# Then give the client a route: copy `traefik/client.example.yml` to
# `traefik/dynamic/<COMPOSE_PROJECT_NAME>.yml` and set its host. Traefik reloads it by itself.
#
# ── WHY A ROUTES DIRECTORY AND NOT THE DOCKER SOCKET ─────────────────────────────────────────────
# Traefik's Docker provider reads each container's labels through the Docker socket. That socket is
# the Docker API: `:ro` protects the socket FILE, not the API behind it, so owning the one container
# that faces the internet would mean starting a privileged container that mounts `/` — root on the
# host. Even a filtered read-only socket answers `GET /containers/{id}/json`, whose `Config.Env`
# carries every client's environment. Traefik's FILE provider needs neither: it reads one small YAML
# per client from `traefik/dynamic/`, which holds nothing but routes.
# "Add client #11" is then "start its stack, drop one file in" — still nothing central to restart.
# OWASP Docker Security Cheat Sheet, rule 1.
# https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html
#
# Mount `traefik/dynamic/` and NEVER `clients/`: that directory holds every client's secrets.

services:
    traefik:
        image: docker.io/library/traefik:v3@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
        restart: unless-stopped
        command:
            # The file provider, watching one directory: a changed or added file is a hot reload.
            # https://doc.traefik.io/traefik/providers/file/
            - '--providers.file.directory=/etc/traefik/dynamic'
            - '--providers.file.watch=true'
            - '--entrypoints.web.address=:80'
            - '--entrypoints.websecure.address=:443'
            # Port 80 only redirects. Traefik exempts the ACME HTTP challenge from the redirect, so
            # certificate issuance below still works.
            # https://doc.traefik.io/traefik/routing/entrypoints/#redirection
            - '--entrypoints.web.http.redirections.entryPoint.to=websecure'
            - '--entrypoints.web.http.redirections.entryPoint.scheme=https'
            - '--certificatesresolvers.le.acme.email=${NODE_PROXY_ACME_EMAIL:?set NODE_PROXY_ACME_EMAIL in the client env file}'
            - '--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json'
            - '--certificatesresolvers.le.acme.httpchallenge.entrypoint=web'
        ports:
            - '80:80'
            - '443:443'
        volumes:
            # Routes only, read-only. Never `clients/` (see above).
            - ./traefik/dynamic:/etc/traefik/dynamic:ro
            - traefik-acme:/letsencrypt
        networks:
            - proxy

    app:
        # `default` (this project's own network — reaches `database`/`cache`/`queue`) AND `proxy`
        # (the shared network Traefik reaches `app` on) — both, explicitly. Compose's per-service
        # `networks:` REPLACES rather than merges across files, so naming only `proxy` here would
        # silently cut `app` off from its own database.
        #
        # The alias is what a route's service URL names (`http://<COMPOSE_PROJECT_NAME>-app:<port>`).
        # A bare `app` resolves on the shared network to EVERY client's `app` and round-robins
        # across them, which would hand one client's requests to another.
        networks:
            default: {}
            proxy:
                aliases:
                    - '${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}-app'
        # The loopback publish has no reader once Traefik fronts this stack — every client sharing
        # the same default `NODE_PORT` would otherwise collide on the HOST's own 127.0.0.1:3000.
        ports: !reset []
        environment:
            # One hop: Traefik. It drops an `X-Forwarded-For` from an untrusted source
            # (`forwardedHeaders.insecure` is off by default) and writes the real peer's address, so
            # `request.ip` is the caller. With `0` every client is the proxy: the global budget and
            # each per-address login and signup budget become site-wide, and every audit row names
            # the proxy. A client env file that sets its own value still wins.
            # https://doc.traefik.io/traefik/routing/entrypoints/#forwarded-headers
            NODE_TRUST_PROXY_HOPS: '${NODE_TRUST_PROXY_HOPS:-1}'

networks:
    # Declared explicitly so `app` can name it alongside `proxy` — the base file never declares a
    # top-level `networks:` at all (relying on Compose's own implicit default), and referencing an
    # undeclared network by name fails on podman-compose 1.6 ("missing networks: default").
    # `{}` keeps every default behaviour; this is Compose's own documented way to keep using the
    # auto-created network while also being able to name it.
    default: {}
    proxy:
        external: true

volumes:
    traefik-acme:
