# Prometheus alert rules for the local API stack.
# Why this file exists: dashboards are visual, but alerts define actionable SRE thresholds.
# Local goal: starter coverage for availability, errors, latency, load, and memory.

groups:
    - name: api.rules
      rules:
          # Availability: API metrics endpoint unreachable.
          - alert: ApiDown
            expr: up{job="api"} == 0
            for: 1m
            labels:
                severity: critical
            annotations:
                summary: 'API instance is down'
                description: 'Prometheus cannot reach the /metrics endpoint of the API for > 1 min.'

          # A crash loop: the app restarts faster than `ApiDown`'s one-minute wait can complete, so
          # that alert never fires. More than two process starts in 15 minutes is not a deploy.
          # Unreliable with `NODE_ENABLE_CLUSTERING` on: each scrape then hits a different worker
          # and `process_start_time_seconds` jumps between them. `ApiDown` mutes this one.
          - alert: ApiRestarting
            expr: changes(process_start_time_seconds{job="api"}[15m]) > 2
            for: 0m
            labels:
                severity: critical
            annotations:
                summary: 'The API is restarting repeatedly'
                description: 'The API process started more than twice in 15 minutes: a crash loop. Not reliable with NODE_ENABLE_CLUSTERING on, where each scrape hits a different worker.'

          # A backing service that is not serving. `dependency_up` is the app's own reading of each
          # (`modules/observability/metrics.ts`). With Mongo down the job and outbox gauges stop
          # reporting and the stale-job rules go blind, so this is the one that still speaks.
          # One alert name, two rules, because severity differs: the database is critical, the
          # cache and the queue only degrade. The rate-limit Redis is covered by
          # `RateLimitStoreFallback`. While the database one fires, Alertmanager mutes the alerts
          # that are its consequence (`alertmanager.config.template.yaml`, `inhibit_rules`).
          - alert: DependencyUnavailable
            expr: dependency_up{dependency="database"} == 0
            for: 1m
            labels:
                severity: critical
            annotations:
                summary: 'The {{ $labels.dependency }} is unavailable'
                description: 'The app has reported its {{ $labels.dependency }} as not serving for over a minute.'

          - alert: DependencyUnavailable
            expr: dependency_up{dependency=~"cache|queue"} == 0
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: 'The {{ $labels.dependency }} is unavailable'
                description: 'The app has reported its {{ $labels.dependency }} as not serving for over 5 minutes; it keeps running without it.'

          # Error rate: the SERVER is failing. Counts 5xx only: 4xx are the client's mistakes
          # (scanner 404s, wrong logins, validation errors, rate-limit refusals) and have their own
          # rules, so counting them here fired three alerts for one cause. The golden-signals
          # error rate is the server's own failures.
          - alert: HighErrorRate
            expr: |
                (
                    sum(rate(http_requests_total{status_code=~"5.."}[5m]))
                    /
                    sum(rate(http_requests_total[5m]))
                ) > 0.05
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: 'High HTTP 5xx rate (> 5 %)'
                description: 'More than 5 % of requests are failing with a 5xx over the last 5 minutes.'

          # Latency: user-perceived slowness at p95 percentile.
          - alert: HighP95Latency
            expr: |
                histogram_quantile(
                    0.95,
                    sum by (le) (rate(http_request_duration_milliseconds_bucket[5m]))
                ) > 2000
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: 'p95 latency > 2 s'
                description: 'The 95th-percentile request duration has exceeded 2 000 ms for 5 minutes.'

          # Saturation: too many concurrent requests in-flight.
          - alert: HighInFlightRequests
            expr: http_requests_in_flight > 100
            for: 2m
            labels:
                severity: warning
            annotations:
                summary: 'Too many in-flight requests (> 100)'
                description: 'More than 100 requests are being processed simultaneously for 2 minutes.'

          # Memory pressure: Node.js heap close to exhaustion.
          #
          # The denominator is `nodejs_heap_size_limit_bytes` — V8's fixed ceiling — and not
          # `nodejs_heap_size_total_bytes`, which is only the heap V8 has committed so far and
          # which it grows on demand. Against `total` this ratio sits around 0.97 on an idle,
          # healthy process, so the alert fired permanently and taught everyone to ignore it.
          # The limit metric is registered by `infrastructure/observability/metrics-registry`.
          - alert: HighHeapUsage
            expr: |
                nodejs_heap_size_used_bytes
                /
                nodejs_heap_size_limit_bytes > 0.90
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: 'Node.js heap usage above 90 % of the V8 limit'
                description: 'The heap is within 10 % of --max-old-space-size; OOM risk if left unaddressed.'

          # Parked queue jobs: a job only reaches <queue>.dead after every retry the deployment's
          # NODE_QUEUE_MAX_ATTEMPTS allows, or a permanent rejection that was never going to
          # succeed on one. Nothing else reads that queue on its own, so this counter — registered
          # by `infrastructure/observability/metrics-queue` — is the only thing that surfaces it.
          # A rate above zero is the alert; there is no meaningful threshold above that.
          - alert: QueueJobsParked
            expr: increase(queue_jobs_dead_lettered_total[15m]) > 0
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'A queue is parking jobs in its dead-letter queue'
                description: 'queue_jobs_dead_lettered_total increased in the last 15 minutes for queue {{ $labels.queue }} — inspect and replay via the RabbitMQ management UI.'

          # The outbox parks an event as `dead` only after every dispatch attempt failed, and
          # nothing else reads a dead row. Same shape as `QueueJobsParked`: a rate above zero is
          # the alert. See docs/tools/outbox.md#poison-events.
          - alert: OutboxEventsDead
            expr: increase(outbox_events_dead_total[15m]) > 0
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'The transactional outbox parked an event as dead'
                description: 'outbox_events_dead_total increased in the last 15 minutes — a consumer of a domain event kept failing. Inspect `outboxevents` rows with status "dead".'

          # Fleet-wide webhook delivery failure: a failed delivery never parks (it reschedules on
          # its own row, and the sweep republishes it), so `QueueJobsParked` above never fires for
          # this queue — this is the signal that actually surfaces it. Zero successes while
          # attempts keep landing is our-side (egress, DNS, signing), never one subscriber's
          # endpoint — that stays quiet by design, see `docs/modules/webhooks.md`.
          - alert: WebhookDeliveriesFailingEverywhere
            # `outcome` differs on each side, so each side is summed down to one value first: an
            # `and` between the raw series never matched. `or vector(0)` covers a success series
            # that never existed at all.
            expr: |
                (sum(increase(webhook_delivery_attempts_total{outcome="success"}[30m])) or vector(0)) == 0
                and
                sum(increase(webhook_delivery_attempts_total{outcome="failure"}[30m])) > 10
            for: 0m
            labels:
                severity: critical
            annotations:
                summary: 'Every webhook delivery attempt is failing'
                description: 'No successful webhook delivery in 30 minutes while attempts keep arriving — a platform-side outage (egress, DNS, signing), not one endpoint.'

          # The retry sweep (`sweep:webhook-retries`, every minute) is what moves a
          # `pending` row back onto the queue once its `nextAttemptAt` arrives. A nonzero, growing
          # `webhook_deliveries_overdue` (`metrics.ts`) for 15 minutes straight means the cron
          # itself stopped running, not that deliveries are merely retrying on schedule.
          - alert: WebhookRetriesStalled
            expr: webhook_deliveries_overdue > 0
            for: 15m
            labels:
                severity: warning
            annotations:
                summary: 'Webhook retries are not being swept'
                description: 'webhook_deliveries_overdue has stayed above zero for 15 minutes — the retry sweep cron may not be running.'

          # Every NIGHTLY `docker/crontab` line: three jobs run every 5 minutes or every minute
          # instead, each already covered by its own purpose-built alert (this one and the two
          # below), so a shared 48-hour threshold would either fire on them constantly or, worse,
          # let one page 48 hours late. `job_last_success_timestamp_seconds`
          # (`infrastructure/observability/metrics-registry.ts`) is written by every crontab job
          # via `scripts/run-script.ts`, lease-guarded or not. Twice the nightly cadence, not the
          # cadence itself, so a job landing a few minutes late in the 02:00-02:30 stagger never
          # pages anyone. Catches both a job that FAILED (which still updates `lastError`, not
          # `lastSuccessAt`) and one that never ran at all (a dead supercronic) — a failure
          # counter alone would miss the second.
          - alert: ScheduledJobStale
            expr: |
                time() - job_last_success_timestamp_seconds{task!~"sweep:webhook-retries|sweep:outbox|sweep:payment-effects|sweep:reservations"} > 2 * 86400
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'A scheduled job has not succeeded in over 48 hours'
                description: '{{ $labels.task }} has not recorded a success in more than twice its expected daily interval — see docker/crontab and docs/reference/ops.md#scheduled-jobs.'

          # A job that has run but never once succeeded has no `job_last_success_timestamp_seconds`
          # series at all, so the two staleness rules cannot see it. `job_last_run_timestamp_seconds`
          # exists as soon as the job's outcome is recorded, success or not; `unless on (task)`
          # keeps the jobs with no success series. `for: 1h` lets a lease-guarded job's very first
          # run record its row before its success lands. Covers every job, the frequent sweeps
          # included.
          - alert: ScheduledJobNeverSucceeded
            expr: job_last_run_timestamp_seconds unless on (task) job_last_success_timestamp_seconds
            for: 1h
            labels:
                severity: warning
            annotations:
                summary: 'A scheduled job has run but never succeeded'
                description: '{{ $labels.task }} has been recorded as run for over an hour and has never recorded a success. Its lastError is on GET /observability/health, see docs/reference/ops.md#scheduled-jobs.'

          # `sweep:outbox` (every minute), `sweep:payment-effects` and `sweep:reservations`
          # (every 5 minutes; `docker/crontab`) are excluded from the rule above for the same reason `sweep:webhook-retries` is: at
          # that cadence, the 48-hour threshold would page 48 hours after a stuck payment or a
          # reservation nobody is expiring. 30 minutes is six missed runs — long enough that one
          # slow pass never pages, short enough to catch a dead cron before it costs a customer a
          # refund or a stale hold.
          - alert: FrequentSweepStale
            expr: |
                time() - job_last_success_timestamp_seconds{task=~"sweep:outbox|sweep:payment-effects|sweep:reservations"} > 30 * 60
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'A 5-minute sweep has not succeeded in 30 minutes'
                description: '{{ $labels.task }} has not recorded a success in 30 minutes — see docker/crontab and docs/reference/ops.md#scheduled-jobs.'

    # Security signals. Every threshold below is a starting point sized for a quiet shop:
    # "tune to your traffic" before trusting it. A busy deployment raises the rates; a quiet one
    # may lower them. Label names are the ones the metrics register (see docs/tools/prometheus.md).
    - name: security.rules
      rules:
          # Credential stuffing, as a volume: failed logins per second, all accounts together.
          # Tune to your traffic: 1/s is about a hundred failures a minute, far above typos.
          - alert: LoginFailureRate
            expr: sum(rate(auth_login_total{status="failure"}[5m])) > 1
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: 'Failed logins above 1 per second'
                description: 'auth_login_total{status="failure"} has averaged more than 1/s for 5 minutes — credential stuffing or a broken client.'

          # Credential stuffing, as a share: most attempts failing while there is real traffic.
          # The second condition keeps one stray failure on a quiet night from reading as 100 %.
          # Tune to your traffic: both the 50 % and the 0.05/s floor.
          - alert: LoginFailureShare
            expr: |
                (
                    sum(rate(auth_login_total{status="failure"}[10m]))
                    /
                    sum(rate(auth_login_total[10m]))
                ) > 0.5
                and
                sum(rate(auth_login_total[10m])) > 0.05
            for: 10m
            labels:
                severity: warning
            annotations:
                summary: 'More than half of login attempts are failing'
                description: 'Over 50 % of logins failed for 10 minutes while traffic stayed above 3 per minute.'

          # A failed 2FA challenge means the PASSWORD already checked out, so this is the sharpest
          # sign of a stolen password. Tune to your traffic: 0.1/s is six failures a minute.
          - alert: TwoFactorChallengeFailures
            expr: sum(rate(auth_two_factor_challenge_total{status="failure"}[10m])) > 0.1
            for: 10m
            labels:
                severity: warning
            annotations:
                summary: 'Login-time 2FA challenges are failing'
                description: 'auth_two_factor_challenge_total{status="failure"} averaged more than 0.1/s for 10 minutes.'

          # A stolen-but-fresh session probing for the second factor before it can strip it off.
          # A rate above zero is the alert; there is no meaningful threshold above that.
          - alert: TwoFactorDisableFailures
            expr: sum(increase(auth_two_factor_disable_total{status="failure"}[15m])) > 0
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'Someone failed to disable two-factor authentication'
                description: 'auth_two_factor_disable_total{status="failure"} increased in the last 15 minutes.'

          # The audit trail missed an entry the log still carries. The sink fails open on purpose,
          # so this counter is the only thing that says the queryable trail has a hole.
          - alert: AuditSinkFailing
            expr: increase(audit_sink_failures_total[5m]) > 0
            for: 0m
            labels:
                severity: critical
            annotations:
                summary: 'Audit entries are not being persisted'
                description: 'audit_sink_failures_total increased in the last 5 minutes — GET /observability/audit is missing entries the log has.'

          # Forced browsing and token probing: 401 and 403 answers per second, all routes together.
          # Tune to your traffic: a SPA whose sessions expire together produces a short burst of 401.
          - alert: UnauthorizedForbiddenRate
            expr: sum(rate(http_requests_total{status_code=~"401|403"}[5m])) > 2
            for: 10m
            labels:
                severity: warning
            annotations:
                summary: '401 and 403 answers above 2 per second'
                description: 'The API has refused more than 2 requests per second for 10 minutes — a scanner, a broken client or an expired deployment secret.'

          # The limits Redis is unreachable, so budgets count per process or fail open. A limit is
          # weaker than configured for as long as this rises.
          - alert: RateLimitStoreFallback
            expr: increase(rate_limit_store_fallback_total[5m]) > 0
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'Rate limits are running without the limits Redis'
                description: 'rate_limit_store_fallback_total increased in the last 5 minutes for namespace {{ $labels.namespace }} — budgets are per process or open.'

          # Callers are hitting a rate limit hard, the global brake included (it writes no audit
          # entry, so this is its only trace). Tune to your traffic: 1/s is sustained, not a burst.
          - alert: RateLimitRefusals
            expr: sum by (budget) (rate(rate_limit_refusals_total[5m])) > 1
            for: 10m
            labels:
                severity: warning
            annotations:
                summary: 'A rate limit is refusing more than 1 request per second'
                description: 'Budget {{ $labels.budget }} has refused over 1 request per second for 10 minutes.'

          # A promise nobody handled: an error lost, and whatever the promise was meant to finish.
          # The process keeps running on purpose, so nothing else says it happened.
          - alert: UnhandledRejections
            expr: increase(process_unhandled_rejections_total[15m]) > 0
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'A promise rejection went unhandled'
                description: 'process_unhandled_rejections_total increased in the last 15 minutes — a bug, find it in the logs.'

          # Credential attacks the guards audit and count (`security_events_total`, one series per
          # `security.*` audit action). Tune to your traffic before trusting these thresholds.
          # A forged or garbled bearer has no customer behind it. A handful is a scanner; a steady
          # stream is someone testing tokens. Tune to your traffic: 10 per 15 minutes.
          - alert: ForgedBearerTokens
            expr: sum(increase(security_events_total{event=~"security.token.(invalid_signature|malformed)"}[15m])) > 10
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'Bearer tokens with a bad signature or no JWT shape are arriving'
                description: 'security_events_total for security.token.* rose by more than 10 in 15 minutes — see the audit trail for the route and address.'

          # A retired secret is still in circulation, or a key leaked and was revoked too late.
          # A rate above zero is the alert: the secret was CORRECT, so someone holds it.
          - alert: RevokedApiKeyUsed
            expr: sum(increase(security_events_total{event="security.api_key.revoked"}[15m])) > 0
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'A revoked API key was presented with its real secret'
                description: 'security.api_key.revoked fired in the last 15 minutes — whoever holds the key was not told it was revoked.'

          # Nothing legitimate sends a bad signature: the provider signs every delivery.
          - alert: PaymentWebhookSignatureFailures
            expr: sum(increase(security_events_total{event="security.payment_webhook.invalid_signature"}[15m])) > 0
            for: 0m
            labels:
                severity: critical
            annotations:
                summary: 'A payment webhook failed its signature check'
                description: 'Someone is posting to the payment webhook without the signing secret, or the secret was rotated on one side only.'

          # Prometheus holds the token; anyone else sending one is guessing it.
          - alert: MetricsTokenGuessed
            expr: sum(increase(security_events_total{event="security.metrics_token.invalid"}[15m])) > 0
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'The metrics endpoint received a wrong bearer token'
                description: 'security.metrics_token.invalid fired in the last 15 minutes. If it is your own scraper, its token is stale.'

          # One-time links (reset, verify, email change, delete) refused as unknown or expired.
          # Stale links are normal; a burst on one flow is link guessing. Tune to your traffic.
          - alert: OneTimeTokenGuessing
            expr: sum by (flow) (increase(auth_one_time_token_rejected_total[15m])) > 20
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'Many one-time link tokens were refused on one flow'
                description: 'auth_one_time_token_rejected_total for {{ $labels.flow }} rose by more than 20 in 15 minutes.'

          # A refresh token was replayed after its rotation: the value leaked. The account's whole
          # refresh set was revoked in the same breath, so this is the signal that someone had it.
          - alert: RefreshTokenReuse
            expr: increase(auth_refresh_token_reuse_detected_total[15m]) > 0
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'A refresh token was replayed after rotation'
                description: 'auth_refresh_token_reuse_detected_total increased — a session token leaked; the account was signed out everywhere.'

    # Signals the business cannot ignore, each a counter that has no other watcher.
    - name: business.rules
      rules:
          # The provider reported a success for an amount, currency or payment that is not the one
          # frozen for the order (`payments/services/settlement.ts`). The order was cancelled and
          # the money is to be returned: any increase is a reconciliation to do by hand.
          - alert: PaymentAmountMismatch
            expr: sum by (field) (increase(payment_amount_mismatch_total[15m])) > 0
            for: 0m
            labels:
                severity: critical
            annotations:
                summary: 'A payment succeeded for the wrong {{ $labels.field }}'
                description: 'payment_amount_mismatch_total rose for {{ $labels.field }} in the last 15 minutes: money that does not add up. See the payments log line for the order.'

          # A person asked for their Art. 15 copy and did not get it, and the one-month deadline of
          # Art. 12(3) is running.
          - alert: AccountExportFailing
            expr: increase(account_export_failed_total[15m]) > 0
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'A personal-data export failed'
                description: 'account_export_failed_total rose in the last 15 minutes: a data-subject request is unanswered, and the GDPR deadline is running.'
