# Rules about the alerting pipeline itself, and about the host and proxy around the app.
# Why a second file: these read Prometheus's, Alertmanager's and other exporters' own metrics, not
# the app's, and tests/cross-cutting/alert-rules-metrics.test.ts rejects any `*_total` the app does
# not register. Mounted next to prometheus.alert-rules.yaml in both compose files.
# Routing for these alerts: docs/tools/prometheus.md#alert-routing

groups:
    - name: alerting.rules
      rules:
          # The heartbeat. Always firing, on purpose: Alertmanager pushes it to ALERT_HEARTBEAT_URL
          # every minute, and the service on the other end raises the alarm when the pings STOP.
          # That is the only way to notice that the host, Prometheus, Alertmanager or the network is
          # dead, since a dead pipeline cannot report itself.
          - alert: Watchdog
            expr: vector(1)
            labels:
                severity: none
            annotations:
                summary: 'Alerting pipeline heartbeat'
                description: 'Always firing. If the heartbeat service stops receiving it, the alerting pipeline is down.'

          # A failed send, by integration. The Watchdog cannot see this: its path is a different
          # receiver. Routed to the OTHER channel (alertmanager.config.template.yaml): a failing
          # email goes to the webhook, a failing webhook goes to email, so it is never sent to the
          # receiver that is broken.
          - alert: AlertmanagerNotificationsFailing
            expr: sum by (integration) (increase(alertmanager_notifications_failed_total[15m])) > 0
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'Alertmanager cannot send {{ $labels.integration }} notifications'
                description: 'Alertmanager failed to deliver {{ $labels.integration }} notifications in the last 15 minutes. Alerts routed there are not arriving.'

          # A rule that errors while running. `promtool check rules` in CI only reads the rule
          # statically; a runtime failure (a bad join, a series that changed shape) stays invisible
          # without this.
          - alert: PrometheusRuleEvaluationFailures
            expr: sum by (rule_group) (increase(prometheus_rule_evaluation_failures_total[15m])) > 0
            for: 0m
            labels:
                severity: warning
            annotations:
                summary: 'Prometheus rule group {{ $labels.rule_group }} is failing to evaluate'
                description: 'Rules in {{ $labels.rule_group }} errored while running in the last 15 minutes, so the alerts they define are blind.'

    - name: host.rules
      rules:
          # Disk filling up, on any real mount node_exporter reports. One rule for both conditions,
          # so the two never double-alarm: little space left, OR the last six hours say it is gone
          # within 24. The trend catches a runaway log or a growing upload folder days before the
          # percentage does. `for: 30m` rides out a compaction or a backup that borrows space.
          - alert: DiskAlmostFull
            expr: |
                (
                    node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay"}
                    /
                    node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay"}
                    < 0.10
                )
                or
                (
                    predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay"}[6h], 24 * 3600) < 0
                )
            for: 30m
            labels:
                severity: warning
            annotations:
                summary: 'The disk at {{ $labels.mountpoint }} is almost full'
                description: '{{ $labels.mountpoint }} has under 10 % free, or will be full within 24 hours at the rate of the last 6 hours.'

    - name: proxy.rules
      rules:
          # Traefik renews certificates by itself; this catches a renewal that failed silently.
          # Let's Encrypt stopped sending expiry emails on 2025-06-04, so nothing else says so.
          # 14 days is two renewal attempts' worth of margin (Traefik renews at 30 days left).
          # One alert per certificate (`cn`): one proxy serves several client stacks. The default
          # self-signed certificate is not one anyone presents, so it is left out.
          - alert: TlsCertExpiringSoon
            expr: (traefik_tls_certs_not_after{cn!="TRAEFIK DEFAULT CERT"} - time()) < 14 * 86400
            for: 1h
            labels:
                severity: warning
            annotations:
                summary: 'The TLS certificate for {{ $labels.cn }} expires in under 14 days'
                description: 'Traefik should have renewed {{ $labels.cn }} by now. Check its ACME log and that port 80 is reachable.'
