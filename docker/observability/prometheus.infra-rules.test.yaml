# Unit tests for prometheus.infra-rules.yaml, run by `promtool test rules` (see the `alert-rules`
# job in .github/workflows/ci.yml). One firing case per alert and a quiet case for the two that
# read a counter.
#
# Run it: promtool test rules docker/observability/prometheus.infra-rules.test.yaml
#
rule_files:
    - prometheus.infra-rules.yaml
evaluation_interval: 1m
tests:
    - interval: 1m
      input_series: []
      alert_rule_test:
          - eval_time: 1m
            alertname: Watchdog
            exp_alerts:
                - exp_labels:
                      severity: none
                  exp_annotations:
                      summary: Alerting pipeline heartbeat
                      description: Always firing. If the heartbeat service stops receiving it, the alerting pipeline is down.
    - interval: 1m
      input_series:
          - series: alertmanager_notifications_failed_total{integration="email"}
            values: 0 0 0 1 2 3 4 5 5 5
      alert_rule_test:
          - eval_time: 6m
            alertname: AlertmanagerNotificationsFailing
            exp_alerts:
                - exp_labels:
                      severity: warning
                      integration: email
                  exp_annotations:
                      summary: Alertmanager cannot send email notifications
                      description: Alertmanager failed to deliver email notifications in the last 15 minutes. Alerts routed there are not arriving.
    - interval: 1m
      input_series:
          - series: alertmanager_notifications_failed_total{integration="email"}
            values: 0x20
      alert_rule_test:
          - eval_time: 15m
            alertname: AlertmanagerNotificationsFailing
            exp_alerts: []
    - interval: 1m
      input_series:
          - series: prometheus_rule_evaluation_failures_total{rule_group="/etc/prometheus/rules/alerts.yml;api.rules"}
            values: 0 0 0 1 2 3 4 5 5 5
      alert_rule_test:
          - eval_time: 6m
            alertname: PrometheusRuleEvaluationFailures
            exp_alerts:
                - exp_labels:
                      severity: warning
                      rule_group: /etc/prometheus/rules/alerts.yml;api.rules
                  exp_annotations:
                      summary: Prometheus rule group /etc/prometheus/rules/alerts.yml;api.rules is failing to evaluate
                      description: Rules in /etc/prometheus/rules/alerts.yml;api.rules errored while running in the last 15 minutes, so the alerts they define are blind.
    - interval: 1m
      input_series:
          - series: prometheus_rule_evaluation_failures_total{rule_group="/etc/prometheus/rules/alerts.yml;api.rules"}
            values: 0x20
      alert_rule_test:
          - eval_time: 15m
            alertname: PrometheusRuleEvaluationFailures
            exp_alerts: []
    # Little free space left: 5 % of a 100 GB disk. (Input every minute: a sample older than five
    # minutes is stale, and `for` needs the series present throughout.)
    - interval: 1m
      input_series:
          - series: node_filesystem_avail_bytes{job="node",instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
            values: '5000000000x120'
          - series: node_filesystem_size_bytes{job="node",instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
            values: '100000000000x120'
      alert_rule_test:
          - eval_time: 2h
            alertname: DiskAlmostFull
            exp_alerts:
                - exp_labels:
                      severity: warning
                      job: node
                      instance: node-exporter:9100
                      mountpoint: /
                      fstype: ext4
                  exp_annotations:
                      summary: The disk at / is almost full
                      description: '/ has under 10 % free, or will be full within 24 hours at the rate of the last 6 hours.'
    # The trend: 70 % free now, but shrinking fast enough to be gone within 24 hours.
    - interval: 1m
      input_series:
          - series: node_filesystem_avail_bytes{job="node",instance="node-exporter:9100",mountpoint="/data",fstype="ext4"}
            values: '70000000000-100000000x120'
          - series: node_filesystem_size_bytes{job="node",instance="node-exporter:9100",mountpoint="/data",fstype="ext4"}
            values: '100000000000x120'
      alert_rule_test:
          - eval_time: 2h
            alertname: DiskAlmostFull
            exp_alerts:
                - exp_labels:
                      severity: warning
                      job: node
                      instance: node-exporter:9100
                      mountpoint: /data
                      fstype: ext4
                  exp_annotations:
                      summary: The disk at /data is almost full
                      description: '/data has under 10 % free, or will be full within 24 hours at the rate of the last 6 hours.'
    # Quiet: half full and steady, and a tmpfs that is full by design.
    - interval: 1m
      input_series:
          - series: node_filesystem_avail_bytes{job="node",instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
            values: '50000000000x120'
          - series: node_filesystem_size_bytes{job="node",instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
            values: '100000000000x120'
          - series: node_filesystem_avail_bytes{job="node",instance="node-exporter:9100",mountpoint="/run",fstype="tmpfs"}
            values: '0x120'
          - series: node_filesystem_size_bytes{job="node",instance="node-exporter:9100",mountpoint="/run",fstype="tmpfs"}
            values: '100000000x120'
      alert_rule_test:
          - eval_time: 2h
            alertname: DiskAlmostFull
            exp_alerts: []
    # A certificate with 10 days left, and one with 60: only the first is near expiry.
    - interval: 1m
      input_series:
          - series: traefik_tls_certs_not_after{job="traefik",cn="app.acme.example",serial="1"}
            values: '864000x120'
          - series: traefik_tls_certs_not_after{job="traefik",cn="app.other.example",serial="2"}
            values: '5184000x120'
          - series: traefik_tls_certs_not_after{job="traefik",cn="TRAEFIK DEFAULT CERT",serial="3"}
            values: '864000x120'
      alert_rule_test:
          - eval_time: 2h
            alertname: TlsCertExpiringSoon
            exp_alerts:
                - exp_labels:
                      severity: warning
                      job: traefik
                      cn: app.acme.example
                      serial: '1'
                  exp_annotations:
                      summary: The TLS certificate for app.acme.example expires in under 14 days
                      description: Traefik should have renewed app.acme.example by now. Check its ACME log and that port 80 is reachable.
    # Quiet: every certificate has plenty of time left.
    - interval: 1m
      input_series:
          - series: traefik_tls_certs_not_after{job="traefik",cn="app.acme.example",serial="1"}
            values: '5184000x120'
      alert_rule_test:
          - eval_time: 2h
            alertname: TlsCertExpiringSoon
            exp_alerts: []
