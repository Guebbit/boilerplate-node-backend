# Alertmanager routing, rendered at container start by alertmanager-render.sh.
# Why a template: Alertmanager reads no env vars, and email to/from/smarthost have no `_file`
# form, so the knobs are filled in before the daemon starts. Same routing for every client.
#
# Markers:    `@NAME@` is replaced by the knob's value.
#             `# BEGIN x` .. `# END x` lines are deleted when knob group `x` is empty.
# Receivers:  every receiver is always defined; an emptied receiver notifies no one.
# Docs:       docs/tools/prometheus.md#alert-routing

global:
    # Time to wait before considering an alert resolved when updates stop.
    resolve_timeout: 5m

route:
    # Group alerts by name to avoid notification floods.
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    # Everything not matched below: email only (or `null` with no email knobs).
    receiver: '@RECEIVER_DEFAULT@'
    routes:
        # The heartbeat: always firing, pushed every minute. Silence on the far end = we are dead.
        - receiver: '@RECEIVER_WATCHDOG@'
          matchers: ['alertname="Watchdog"']
          group_wait: 0s
          group_interval: 30s
          repeat_interval: 1m
        # A broken channel reports through the OTHER one, never through itself: an alert sent to
        # the broken receiver is lost. Email is what is broken here, so the webhook...
        - receiver: '@RECEIVER_NOTIFY_FAILING@'
          matchers: ['alertname="AlertmanagerNotificationsFailing"', 'integration="email"']
        # ...and when any other channel is (the webhook, or the heartbeat, which is a webhook too),
        # email. Without this the alert would go to the broken webhook and the failure would be
        # silent while the heartbeat stayed green.
        - receiver: '@RECEIVER_DEFAULT@'
          matchers: ['alertname="AlertmanagerNotificationsFailing"']
        # What cannot wait: email and the phone push.
        - receiver: '@RECEIVER_CRITICAL@'
          matchers: ['severity="critical"']

receivers:
    # Notifies no one: the sink for every route whose knob is empty.
    - name: 'null'

    - name: 'email'
      # BEGIN email
      email_configs:
          - to: '@ALERT_EMAIL_TO@'
            from: '@ALERT_EMAIL_FROM@'
            smarthost: '@ALERT_SMTP_HOST@:@ALERT_SMTP_PORT@'
            require_tls: ALERT_SMTP_REQUIRE_TLS
            # BEGIN smtp-auth
            auth_username: '@ALERT_SMTP_USER@'
            auth_password_file: '@SECRETS_DIR@/smtp-password'
            # END smtp-auth
      # END email

    - name: 'webhook'
      # BEGIN webhook
      webhook_configs:
          - url_file: '@SECRETS_DIR@/webhook-url'
      # END webhook

    - name: 'email-and-webhook'
      # BEGIN email
      email_configs:
          - to: '@ALERT_EMAIL_TO@'
            from: '@ALERT_EMAIL_FROM@'
            smarthost: '@ALERT_SMTP_HOST@:@ALERT_SMTP_PORT@'
            require_tls: ALERT_SMTP_REQUIRE_TLS
            # BEGIN smtp-auth
            auth_username: '@ALERT_SMTP_USER@'
            auth_password_file: '@SECRETS_DIR@/smtp-password'
            # END smtp-auth
      # END email
      # BEGIN webhook
      webhook_configs:
          - url_file: '@SECRETS_DIR@/webhook-url'
      # END webhook

    - name: 'heartbeat'
      # BEGIN heartbeat
      webhook_configs:
          - url_file: '@SECRETS_DIR@/heartbeat-url'
            # BEGIN heartbeat-auth
            http_config:
                authorization:
                    type: Bearer
                    credentials_file: '@SECRETS_DIR@/heartbeat-token'
            # END heartbeat-auth
      # END heartbeat

# Quiet what is only the consequence of a bigger fault, so one cause pages once.
# A source alert mutes the target alerts it names; labels need no `equal`: there is one app.
# `AuditSinkFailing` is never a target: a gap in the audit trail is real whatever the cause.
inhibit_rules:
    # A dead database makes every request slow or failing and every rejection unhandled.
    - source_matchers: ['alertname="DependencyUnavailable"', 'dependency="database"']
      target_matchers: ['alertname=~"HighErrorRate|HighP95Latency|UnhandledRejections"']
    # A dead queue is why jobs park and webhook retries stall.
    - source_matchers: ['alertname="DependencyUnavailable"', 'dependency="queue"']
      target_matchers: ['alertname=~"QueueJobsParked|WebhookRetriesStalled"']
    # A down API cannot also be a crash loop.
    - source_matchers: ['alertname="ApiDown"']
      target_matchers: ['alertname="ApiRestarting"']
